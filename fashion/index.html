<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷 공부</title>
<meta name="description" content="옷 사진을 보면서 목둘레, 깃, 소매 이름을 익히는 카드와 퀴즈">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#121212; --sub:#5f5f5c; --faint:#9a9a96; --line:#e6e6e3;
  --paper:#ffffff; --tile:#f1f1ee; --ok:#17784a; --no:#c4302b;
  --wrap:1180px; --gut:max(16px,4vw);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut);height:56px;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:22px;height:100%;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;white-space:nowrap;display:flex;align-items:center;height:100%;text-decoration:none;color:var(--faint);font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.stat{margin:12px 0 0;font-size:15px;color:var(--sub)}
.stat b{color:var(--ink);font-weight:700}
.sync{margin:6px 0 0;font-size:13px;color:var(--faint)}
.sync button{font-weight:600;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
body.sheet-open #cu-home,body.no-home #cu-home{display:none}
@media (hover:none){.op kbd,.op.pic kbd{display:none}}

main{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut) 96px}

/* 도감 */
.lead{padding:28px 0 8px}
.lead h1{margin:0;font-size:clamp(34px,6.4vw,64px);line-height:1.05;font-weight:800;letter-spacing:-.05em}
.lead h1 span{color:var(--faint);font-weight:300}
.grp{padding-top:44px}
.grp-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 16px}
.grp-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.04em}
.grp-h p{margin:0;font-size:14px;color:var(--sub)}
.grp-h .to-cmp{margin-left:auto;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 14px}
.tile{display:block;text-align:left;width:100%}
.ph{position:relative;aspect-ratio:3/4;background:#fff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.tile .ph img{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.tile:hover .ph img{transform:scale(1.035)}
.tile b{display:block;margin-top:10px;font-size:16px;font-weight:700;letter-spacing:-.03em}
.tile b .dot{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.mark{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 7px;background:var(--ok);color:#fff;letter-spacing:0;font-style:normal}
.mark.seen{background:rgba(255,255,255,.92);color:var(--sub);box-shadow:inset 0 0 0 1px var(--line)}

/* 점 */
.spot{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(0,0,0,.55);pointer-events:none;min-width:30px}
.spot::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid rgba(255,255,255,.9);animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.spot::before{animation:none;opacity:0}.tile .ph img{transition:none}}

/* 카드 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(18,18,18,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.card{position:relative;background:#fff;width:min(980px,100%);max-height:calc(100dvh - 48px);overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.card .ph{aspect-ratio:3/4}
.card-tx{padding:36px 36px 32px;display:flex;flex-direction:column;gap:18px}
.card-g{font-size:13px;color:var(--sub);font-weight:600}
.card h2{margin:-8px 0 0;font-size:clamp(34px,4.6vw,48px);line-height:1.1;font-weight:800;letter-spacing:-.05em}
.card .en{margin:-12px 0 0;font-size:13px;color:var(--faint)}
.card .say{margin:0;font-size:18px;line-height:1.6;letter-spacing:-.02em}
.nm{margin:-4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.nm dt{color:var(--faint)}
.nm dd{margin:0}
.nd h3{color:#b4441c}
.lk{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.lk li{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.lk a{text-underline-offset:3px}
.lk span{flex:none;font-size:12px;color:var(--faint)}
.row{border-top:1px solid var(--line);padding-top:14px}
.row h3{margin:0 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.row p{margin:0;font-size:15px}
.pair{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.pair button{width:64px;text-align:left;font-size:12px;line-height:1.3}
.pair .ph{margin-bottom:5px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 18px;font-size:15px;font-weight:700;border:1px solid var(--ink);text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--ink);color:#fff}
.x{position:absolute;right:10px;top:10px;z-index:2;width:40px;height:40px;display:grid;place-items:center;background:#fff}
.x svg,.nav svg{width:20px;height:20px}
.nav{position:absolute;top:50%;z-index:2;width:44px;height:44px;margin-top:-22px;display:grid;place-items:center;background:rgba(255,255,255,.9)}
.nav.prev{left:8px}.nav.next{left:calc(50% - 52px)}

.useg{display:flex;gap:6px 20px;flex-wrap:wrap;padding-top:26px;font-size:14px}
.useg a{color:var(--faint);text-decoration:none;font-weight:600;padding:4px 0;border-bottom:2px solid transparent}
.useg a[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.en span{margin-left:10px;color:var(--sub)}
.sw{display:flex;align-items:center;gap:10px;margin:-4px 0 0;font-size:13px;color:var(--sub)}
.sw i{width:30px;height:30px;border:1px solid rgba(0,0,0,.14)}
.tile small i{display:inline-block;width:11px;height:11px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
.cmp figcaption b i{display:inline-block;width:14px;height:14px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
/* 비교 */
.seg{display:flex;gap:6px 22px;flex-wrap:wrap;padding:20px 0 20px;border-bottom:1px solid var(--line);margin-bottom:26px}
.seg a{font-size:17px;font-weight:700;color:var(--faint);text-decoration:none;letter-spacing:-.03em}
.seg a[aria-current="true"]{color:var(--ink)}
.seg.qunit{padding:12px 0 14px;margin-bottom:20px;gap:6px 18px}
.seg.qunit a{font-size:14px;font-weight:600}
.cmp-say{margin:0 0 18px;color:var(--sub);font-size:15px}
.cmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cmp.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cmp figure{margin:0}
.cmp figcaption{padding-top:10px}
.cmp figcaption b{display:block;font-size:18px;font-weight:800;letter-spacing:-.04em}
.cmp figcaption span{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.cmp button{display:block;width:100%;text-align:left}

/* 퀴즈 */
.qz{max-width:980px;margin:0 auto;padding-top:14px}
.qz-top{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--sub);margin-bottom:14px}
.qz-top .combo{font-weight:800;color:var(--ok);animation:pop .35s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(1.5)}to{transform:none}}
.qz-top .today{font-size:13px;color:var(--faint)}
.bar{flex:1;height:3px;background:var(--line)}
.bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qz h2{margin:0 0 14px;font-size:clamp(21px,2.6vw,28px);line-height:1.2;font-weight:800;letter-spacing:-.04em}
.qz.split{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,5fr);gap:0 36px;align-items:start}
.qz.split .qz-top{grid-column:1/-1}
.qz.split .q-img{width:100%;margin:0}
.qz.split .ops{grid-template-columns:1fr}
.ops.pics{max-width:820px}
.qz .q-img{width:min(300px,64%,calc(40vh * .75));margin:0 auto 16px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{min-height:58px;padding:12px 14px;border:1px solid var(--line);text-align:left;font-size:17px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:10px;transition:border-color .15s,background-color .15s}
.op:hover{border-color:var(--ink)}
.op kbd{font:600 12px/1 "Pretendard Variable",sans-serif;color:var(--faint);width:14px}
.ops.pics{grid-template-columns:repeat(4,minmax(0,1fr))}
.op.pic{padding:0;border:2px solid transparent;display:block;min-height:0}
.op.pic:hover{border-color:var(--ink)}
.op.pic{position:relative}
.op.pic kbd{position:absolute;left:8px;top:8px;padding:3px 6px;width:auto;background:rgba(255,255,255,.9);color:var(--sub);font-size:11px}
.op.ok{border-color:var(--ok);background:#eef7f2}
.op.no{border-color:var(--no);background:#fbefee}
.op.pic.ok,.op.pic.no{background:none}
.ops.done .op{cursor:default}
.fb{margin-top:20px;padding:18px 0 0;border-top:2px solid var(--ink);display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}
.fb .r{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.04em}
.fb .r.ok{color:var(--ok)}.fb .r.no{color:var(--no)}
.fb p{margin:0;font-size:15px}
.fb .btn{margin-top:14px}
.end h2{margin-bottom:6px}
#rd-in{width:100%;font:inherit;font-size:16px;padding:14px;border:1px solid var(--line);resize:vertical;margin-bottom:8px}
#rd-in:focus{outline:2px solid var(--ink);outline-offset:-1px}
.rd{padding:22px 0;border-bottom:1px solid var(--line)}
.rd-name b{background:var(--ink);color:#fff;font-weight:700;padding:0 4px;margin:0 1px}
.rd .grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 10px}
/* 코디 */
.kd-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 28px}
.kd{display:block;text-decoration:none}
.kd-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--tile);padding:10px}
.kd-strip .ph{background:#fff}
.kd-strip.has{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}
.kd-strip .shot{grid-row:1/3;position:relative;overflow:hidden;background:var(--tile)}
.kd-strip .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.kd-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;margin:22px 0 30px;align-items:start}
.kd-top .kd-pcs{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
.kd-shot{margin:0}
.kd-shot img{display:block;width:100%;height:auto;background:var(--tile)}
.kd-shot figcaption{margin-top:10px;font-size:14px;color:var(--sub);display:grid;gap:3px}
.kd-shot figcaption b{color:var(--ink);font-weight:700;margin-right:6px}
.kd-shot figcaption a{font-size:12px;color:var(--faint)}
.kd h2{margin:14px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.04em}
.kd .meta,.kd-meta{font-size:13px;color:var(--faint);font-weight:600}
.kd p{margin:6px 0 0;font-size:15px;color:var(--sub)}
.kd:hover h2{text-decoration:underline;text-underline-offset:4px}
.blank{display:grid;place-items:center;background:#fff}
.blank i{width:42%;aspect-ratio:1;background:var(--c,#ddd);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.blank em{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-style:normal;font-size:12px;color:var(--faint)}
.kd-pcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 12px;margin:22px 0 30px}
.pc{display:block;text-align:left;width:100%}
.pc small{display:block;margin-top:8px;font-size:12px;color:var(--faint);font-weight:600}
.pc span{display:block;font-size:15px;font-weight:700;letter-spacing:-.03em}
.pc span i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
button.pc:hover span{text-decoration:underline;text-underline-offset:3px}
.kd-txt{display:grid;gap:16px;max-width:720px}
.kd-back{display:inline-block;margin-top:26px;font-size:14px;color:var(--sub);text-decoration:none}
.kd-back:hover{text-decoration:underline}
.rules{display:grid;gap:0;max-width:820px}
.rule{border-top:1px solid var(--line);padding:22px 0}
.rule h2{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.04em}
.rule p{margin:0;font-size:15px}
.rule dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:15px}
.rule dt{font-weight:700}.rule dt.ok{color:var(--ok)}.rule dt.no{color:var(--no)}
.rule dd{margin:0;color:var(--sub)}
@media (max-width:860px){.kd-list{grid-template-columns:1fr}.kd-pcs{grid-template-columns:repeat(2,minmax(0,1fr))}.kd-top{grid-template-columns:1fr;gap:24px}.kd-shot img{max-height:70vh;width:auto;max-width:100%;margin:0 auto}}
.rd .tile b{font-size:14px}
@media (max-width:860px){.rd .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tap{position:relative;width:min(560px,100%,calc(68vh * var(--r)));margin:0 auto;cursor:crosshair;overflow:hidden;background:var(--tile)}
.tap img{width:100%;height:100%;object-fit:cover}
.tap .box{position:absolute;border:3px solid var(--ok);box-shadow:0 0 0 2px #fff}
.tap .hit{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5)}
.tap .hit.ok{background:var(--ok)}.tap .hit.no{background:var(--no)}
.credit{margin:8px auto 0;max-width:560px;font-size:12px;color:var(--faint)}
.credit a{color:inherit}
/* 실제 사진 */
.rph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--tile)}
.rph img{width:100%;height:100%;object-fit:cover}
.rph .rb{position:absolute;border:3px solid #ffd400;box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.qz .q-img.real{width:min(340px,72%,calc(44vh * .75))}
.qmode{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap;padding-bottom:2px}
.qmode::-webkit-scrollbar{display:none}
.own-on{background:var(--ok);border-color:var(--ok);color:#fff}
.pc .have{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--ok)}
.kd .meta b{color:var(--ok)}
.end .best{margin:4px 0 14px;font-size:15px;color:var(--sub)}
@media (max-width:860px){.qz.split{display:block}.qz.split .q-img{width:min(280px,62%,calc(36vh * .75));margin:0 auto 14px}.qz.split .ops{grid-template-columns:1fr 1fr}.qz.split .ops.two{grid-template-columns:1fr}}
.rcard{display:flex;align-items:center;gap:14px;margin:-4px 0 18px}
.rcard .ph{width:76px;flex:none}
.rcard b{font-size:20px;letter-spacing:-.03em}
.credit.many{text-align:left}
.fb.one{grid-template-columns:1fr}
.lnk{font-weight:700;text-decoration:underline;text-underline-offset:4px}
.pname{margin:0 0 6px;font-size:clamp(20px,3.2vw,26px);font-weight:700;letter-spacing:-.04em;line-height:1.35}
.pname mark{background:var(--ink);color:#fff;padding:0 5px}
.whole{margin-top:26px}
.whole h3{margin:0 0 12px;font-size:15px;color:var(--sub);font-weight:600}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:620px}
.strip figure{margin:0}.strip figcaption{font-size:13px;font-weight:700;margin-top:6px}
.strip figcaption small{display:block;font-size:12px;font-weight:600;color:var(--faint)}
.ops.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.op.chip{min-height:54px;font-size:clamp(18px,2.6vw,22px)}
.ops.two{grid-template-columns:1fr}
.ops.two .op{min-height:64px;font-size:17px}
.tap .fmask{position:absolute;inset:0;width:100%;height:100%;filter:blur(3px);pointer-events:none}
.qz .q-rule{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ok)}
.op span small{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--faint)}
.op span small:empty{display:none}
.kshot{margin:0}.kshot img{display:block;width:100%;height:auto;max-height:68vh;object-fit:contain;background:var(--tile)}
.kshot figcaption{margin-top:6px;font-size:13px;color:var(--sub);font-weight:600}.kshot .credit{margin:4px 0 0}
.rule-fb .sub{margin-top:6px;color:var(--sub);font-size:14px}

/* 시작, 재질, 실제 코디, 짝 맞추기, 유행 */
.seg button{font:inherit;font-size:17px;font-weight:700;color:var(--faint);letter-spacing:-.03em;padding:0;background:none;border:0;cursor:pointer}
.seg button[aria-current="true"]{color:var(--ink)}
.seg .seg-gap{width:1px;background:var(--line);margin:0 4px}
.seg.sub{padding-top:0;border-bottom:0;margin-bottom:10px}.seg.sub a{font-size:14px}
.lk-filter{margin:-10px 0 20px}.lk-filter select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);background:var(--paper)}
.lk-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 16px}
.lk-grid.sm{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.lkc{display:block;text-decoration:none;color:inherit}
.lkph{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--tile)}
.lkph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lkph .st{position:absolute;left:8px;top:8px;font-style:normal;font-size:12px;font-weight:700;background:#fff;padding:2px 7px}
.lkc b{display:block;margin-top:10px;font-size:17px;font-weight:800;letter-spacing:-.03em}
.lk-say{display:block;margin-top:4px;font-size:14px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lk-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.lk-tags span{font-size:12px;font-weight:600;color:var(--sub);background:var(--tile);padding:2px 6px}
.lk-point{margin:0 0 18px;font-size:16px}
.lk-pcs{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.lk-pcs li{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lk-th{width:64px;flex:none;aspect-ratio:3/4;padding:0;border:0;background:#fff;overflow:hidden}.lk-th img{width:100%;height:100%;object-fit:cover;display:block}
.lk-th.none{background:var(--tile)}
.lk-pcs small{display:block;font-size:12px;color:var(--faint);font-weight:600}
.lk-pcs b{font-size:16px;font-weight:700;letter-spacing:-.03em}.lk-pcs b i{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

  .blend{grid-template-columns:1fr;gap:10px}.rule.has{grid-template-columns:1fr}.steps li{grid-template-columns:1fr;gap:12px}.st-go{justify-content:flex-start}.mt-gb{grid-template-columns:1fr}}

<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#book">옷 공부</a>
  <nav class="tabs" aria-label="화면">
    <a href="#start" data-v="start">시작</a>
    <a href="#book" data-v="book">도감</a>
    <a href="#mat" data-v="mat">재질</a>
    <a href="#cmp" data-v="cmp">비교</a>
    <a href="#codi" data-v="codi">코디</a>
    <a href="#quiz/mix" data-v="quiz">퀴즈</a>
    <a href="#read" data-v="read">읽기</a>
    <a href="plan.html">계획</a>
  </nav>
</div></header>

<main>
  <section id="v-start" hidden></section>
  <section id="v-book"></section>
  <section id="v-mat" hidden></section>
  <section id="v-cmp" hidden></section>
  <section id="v-codi" hidden></section>
  <section id="v-quiz" hidden></section>
  <section id="v-read" hidden></section>
</main>

<div class="sheet" id="sheet" hidden>
  <article class="card" role="dialog" aria-modal="true" aria-labelledby="c-name">
    <button class="x" id="c-x" aria-label="닫기"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
    <div class="ph" id="c-ph"></div>
    <button class="nav prev" id="c-prev" aria-label="이전 카드"><svg viewBox="0 0 20 20"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
    <button class="nav next" id="c-next" aria-label="다음 카드"><svg viewBox="0 0 20 20"><path d="M8 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
    <div class="card-tx" id="c-tx"></div>
  </article>
</div>

<script>
const KEY = "ot-gongbu-v1";
let LK = [], TR = [], PR = [], MT = { materials: [], blends: [], label_rules: [], mixing: [] }, KS = { season: "", sex: "", item: "" };
let U = [], G = [], C = [], N = [], F = [], R = {}, byId = {}, K = { f: [], r: [] }, RP = [];
let st = { seen: {}, stat: {} };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} window.otPush?.(); };
/* 로그인 뒤 서버 기록과 합칠 때 부름 */
window.ot = { get: () => st, set: x => { st = x; try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} if (!C.length) return; if ($("#sheet").hidden && view !== "quiz") refresh(); prog(); } };
const learned = id => (st.stat[id]?.s || 0) >= 3;
const DAY = 86400000;
const isDue = id => { const s = st.stat[id]; return !!(s && s.due && s.due <= Date.now()); };
const dueIds = () => C.filter(c => isDue(c.id)).map(c => c.id);
// 같은 카드는 틀리면 1일 뒤, 맞히면 연속 횟수에 따라 3일, 7일, 21일 뒤에 다시
const nextDue = s => Date.now() + DAY * [1, 3, 7, 21][Math.min(s.s, 3)];
const partList = () => C.filter(c => c.spot).map(c => ({ card: c.id, ko: c.ko, src: `img/${c.id}.webp`, w: 600, h: 800, box: [c.spot[0] - 0.1, c.spot[1] - 0.075, c.spot[0] + 0.1, c.spot[1] + 0.075] }));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const spotEl = c => c.spot ? `<i class="spot" style="left:${c.spot[0] * 100}%;top:${c.spot[1] * 100}%"></i>` : "";
const ph = (c, spot, lazy = true) => `<div class="ph"><img src="img/${c.id}.webp" alt="${esc(c.ko)}" width="600" height="800"${lazy ? ' loading="lazy"' : ""}>${spot ? spotEl(c) : ""}</div>`;
const gOf = id => G.find(g => g.id === id);
const uName = u => U.find(x => x.u == u)?.name || "";
const batchim = w => { const k = w.charCodeAt(w.length - 1) - 0xac00; return k >= 0 && k < 11172 && k % 28 !== 0; };
const eun = w => w + (batchim(w) ? "은" : "는");
const ieyo = w => w + (batchim(w) ? "이에요" : "예요");
const unitNav = (base, cur, all) => `<nav class="useg" aria-label="단원">${all ? `<a href="#${base}" aria-current="${!cur}">전체</a>` : ""}${U.map(x => `<a href="#${base}/${x.u}" aria-current="${x.u == cur}">${esc(x.name)}</a>`).join("")}</nav>`;

const syncBtn = () => window.otUser === undefined ? "" : window.otUser === "err" ? `<p class="sync">지금은 기록을 서버에 저장하지 못해요. 이 기기에는 그대로 남아요. <button id="sync-out">로그아웃</button></p>` : window.otUser ? `<p class="sync">폰과 노트북 기록이 이어져 있어요 <button id="sync-out">로그아웃</button></p>` : `<p class="sync">폰과 노트북에서 기록을 이어 보려면 <button id="sync-in">구글 로그인</button></p>`;
function prog() {
  const el = $("#prog"); if (!el) return;
  const seen = C.filter(c => st.seen[c.id]).length, done = C.filter(c => learned(c.id)).length;
  el.innerHTML = `전체 ${C.length}장 가운데 <b>${seen}</b>장 봤고 <b>${done}</b>장 외웠어요`;
}
function tile(c) {
  const m = learned(c.id) ? `<i class="mark">외웠어요</i>` : st.seen[c.id] ? `<i class="mark seen">봤어요</i>` : "";
  return `<button class="tile" data-card="${c.id}"><div class="ph"><img src="img/${c.id}.webp" alt="" width="600" height="800" loading="lazy">${m}</div><b>${c.hex ? `<i class="dot" style="background:${c.hex}"></i>` : ""}${esc(c.ko)}</b></button>`;
}

/* 도감 */
function book(u) {
  u = U.some(x => x.u == u) ? +u : U[0].u;
  const gs = G.filter(g => g.u == u);
  $("#v-book").innerHTML = unitNav("book", u) + `<div class="lead"><h1>${esc(uName(u))} <span>${C.filter(c => c.u == u).length}장</span></h1><p class="stat" id="prog"></p>${syncBtn()}</div>` +
    gs.map(g => `<section class="grp"><div class="grp-h"><h2>${esc(g.name)}</h2><p>${esc(g.say)}</p><a class="to-cmp" href="#cmp/${g.id}">나란히 보기</a></div>
      <div class="grid">${C.filter(c => c.g === g.id).map(tile).join("")}</div></section>`).join("");
}

/* 카드 */
let cur = null, lastFocus = null;
function names(c) {
  const rows = [["쇼핑몰", sq(c.shop) !== sq(c.ko) ? c.shop : ""], ["정확한 이름", c.pro && sq(c.pro) !== sq(c.ko) && sq(c.pro) !== sq(c.shop) ? c.pro : ""], ["편한 말", (c.casual || []).join(", ")]].filter(r => r[1]);
  return rows.length ? `<dl class="nm">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : "";
}
const owned = id => !!(st.own && st.own[id]);
const ownBtn = id => `<button class="btn${owned(id) ? " own-on" : ""}" data-own="${id}">${owned(id) ? "내 옷장에 있어요" : "내 옷장에 넣기"}</button>`;
function openCard(id) {
  const c = byId[id]; if (!c) return;
  if (!$("#sheet").hidden && cur === id) return;
  if ($("#sheet").hidden) lastFocus = document.activeElement;
  cur = id;
  st.seen[id] = 1; save();
  const mates = C.filter(x => x.g === c.g && x.id !== c.id).slice(0, 6);
  const q = encodeURIComponent(c.ko);
  $("#c-ph").outerHTML = `<div class="ph" id="c-ph"><img src="img/${c.id}.webp" alt="${esc(c.ko)} 사진" width="600" height="800">${spotEl(c)}</div>`;
  $("#c-tx").innerHTML = `
    <div class="card-g">${esc(uName(c.u))}, ${esc(gOf(c.g).name)}</div>
    <h2 id="c-name">${esc(c.ko)}</h2>
    <p class="en">${esc(c.en)}</p>
    ${names(c)}
    ${c.hex ? `<p class="sw"><i style="background:${c.hex}"></i>${c.measured ? "쇼핑몰 실제 옷에서 잰 색" : "이 색 정도"}</p>` : ""}
    <p class="say">${esc(c.say)}</p>
    ${c.say.startsWith(c.look) ? "" : `<div class="row"><h3>여기를 보면 알아요</h3><p>${esc(c.look)}</p></div>`}
    ${c.diff ? `<div class="row nd"><h3>이름끼리 뜻이 ${c.same === "다름" ? "달라요" : "조금 달라요"}</h3><p>${esc(c.diff)}</p></div>` : ""}
    ${c.where ? `<div class="row"><h3>자주 보이는 곳</h3><p>${esc(c.where)}</p></div>` : ""}
    ${c.tip ? `<div class="row"><h3>이렇게 입어요</h3><p>${esc(c.tip)}</p>${c.codi?.length ? `<ul class="lk">${c.codi.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)}</a><span>${x.pin ? "핀터레스트" : "무신사"}</span></li>`).join("")}</ul>` : ""}</div>` : ""}
    ${c.real?.length ? `<div class="row"><h3>이 색 실제 옷</h3><ul class="lk">${c.real.map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.t)}</a><span>무신사</span></li>`).join("")}</ul></div>` : ""}
    ${c.src ? `<div class="row"><h3>출처</h3><p><a href="${esc(c.src.url)}" target="_blank" rel="noopener">${esc(c.src.name)}</a> <span style="color:var(--faint)">${esc(c.src.date)}</span></p></div>` : ""}
    ${mates.length ? `<div class="row"><h3>헷갈리는 짝</h3><div class="pair">${mates.map(m => `<button data-card="${m.id}"><div class="ph"><img src="img/${m.id}.webp" alt="" width="600" height="800" loading="lazy"></div>${esc(m.ko)}</button>`).join("")}</div></div>` : ""}
    <div class="acts"><a class="btn solid" href="#cmp/${c.g}">나란히 비교</a>${c.u == 1 ? ownBtn(c.id) : ""}<a class="btn" href="https://www.musinsa.com/search/goods?keyword=${q}" target="_blank" rel="noopener">무신사에서 실제 상품</a></div>`;
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
  document.body.classList.add("sheet-open");
  $(".card").scrollTop = 0;
  $("#c-x").focus({ preventScroll: true });
}
function closeCard() {
  if ($("#sheet").hidden) return;
  $("#sheet").hidden = true; cur = null;
  document.body.style.overflow = "";
  document.body.classList.remove("sheet-open");
  refresh();
  lastFocus?.focus?.({ preventScroll: true });
}
function show(id) {
  if ($("#sheet").hidden) { location.hash = "#card/" + id; return; }
  history.replaceState(null, "", "#card/" + id);
  openCard(id);
}
function step(d) {
  const i = C.findIndex(c => c.id === cur);
  show(C[(i + d + C.length) % C.length].id);
}

/* 비교 */
function cmp(arg) {
  let g = gOf(arg);
  if (!g) { const u = U.some(x => x.u == arg) ? +arg : U[0].u; g = G.find(x => x.u == u); }
  const list = C.filter(c => c.g === g.id);
  const spots = list.some(c => c.spot);
  $("#v-cmp").innerHTML = unitNav("cmp", g.u) + `<nav class="seg" aria-label="묶음">${G.filter(x => x.u == g.u).map(x => `<a href="#cmp/${x.id}" aria-current="${x.id === g.id}">${esc(x.name)}</a>`).join("")}</nav>
    <p class="cmp-say">${g.say ? esc(g.say) + "." : ""}${spots ? " 동그라미 친 곳이 서로 다른 자리예요." : ""}</p>
    <div class="cmp${list.length === 3 ? " n3" : ""}">${list.map(c => `<figure><button data-card="${c.id}">${ph(c, true)}</button><figcaption><b>${c.hex ? `<i style="background:${c.hex}"></i>` : ""}${esc(c.ko)}</b><span>${esc(c.look)}</span></figcaption></figure>`).join("")}</div>`;
}

/* 퀴즈 */
let Q = null;
function pickSet(only, scope) {
  const pool = only ? only.map(id => byId[id]) : C.filter(c => !scope || c.u == scope);
  const w = c => (isDue(c.id) ? 6 : 0) + (learned(c.id) ? 0 : 2) + (st.stat[c.id]?.w || 0) * 0.5 + (st.seen[c.id] ? 0 : 0.5) + Math.random() * 1.5;
  return pool.sort((a, b) => w(b) - w(a)).slice(0, 10).map(c => {
    const same = shuffle(C.filter(x => x.g === c.g && x.id !== c.id));
    const unit = shuffle(C.filter(x => x.u === c.u && x.g !== c.g));
    const other = shuffle(C.filter(x => x.u !== c.u));
    const ops = shuffle([c, ...same.slice(0, 3).concat(unit, other).slice(0, 3)]);
    return { id: c.id, type: Math.random() < 0.5 ? "pic" : "name", ops: ops.map(o => o.id) };
  });
}
// 상품명 뜯어보기: 상품명 속 낱말이 무엇(옷 종류, 핏, 색 등)을 알려 주는지 고르게 한다
function kind(c) {
  const g = gOf(c.g)?.name || "";
  return { 1: "옷 종류", 3: "여미는 방법", 4: "핏이나 기장", 5: "색", 6: "무늬", 7: "재질" }[c.u] || (/목|깃/.test(g) ? "목이나 깃" : /어깨|소매/.test(g) ? "어깨나 소매" : /주머니/.test(g) ? "주머니" : /바지/.test(g) ? "바지 부분" : "작은 부분");
}
function nameSet() {
  return shuffle(N.slice()).slice(0, 10).map(n => {
    const ks = n.parts.map(p => kind(byId[p.id]));
    const cand = n.parts.filter((p, i) => ks.filter(k => k === ks[i]).length === 1);
    const p = cand[Math.floor(Math.random() * cand.length)];
    return { id: p.id, type: "parse", t: n.t, parts: n.parts, ask: kind(byId[p.id]), last: n.parts.map(x => x.id) };
  });
}
// 코디 규칙: 같은 규칙의 좋은 예와 피할 예 가운데 맞는 쪽 고르기
function ruleSet() {
  const by = Object.fromEntries(K.r.map(r => [r.id, r])), shots = K.f.filter(f => f.shot && f.shot.yes);

  if (Q.list[Q.i].type === "rpick") return pickAnswer(o);
  const q = Q.list[Q.i], c = byId[q.id], ok = o === q.id;
  const s = st.stat[q.id] || (st.stat[q.id] = { s: 0, w: 0 });
  if (ok) { s.s++; Q.right++; } else { s.s = 0; s.w++; Q.wrong.push(q.id); }
  s.due = ok ? nextDue(s) : Date.now() + DAY;
  st.seen[q.id] = 1; save(); prog(); tick(ok, q.type !== "parse");
  const ops = $("#ops"); ops.classList.add("done");
  ops.querySelectorAll(".op").forEach(b => {
    if (b.dataset.op === q.id) b.classList.add("ok");
    else if (b.dataset.op === o) b.classList.add("no");

  const wrongName = ok ? "" : q.type === "name" ? ` 고른 사진은 ${esc(ieyo(byId[o].ko))}.` : q.type === "parse" ? ` 고른 '${esc(byId[o].ko)}'${batchim(byId[o].ko) ? "은" : "는"} ${esc(ieyo(kind(byId[o])))}.` : "";
  $("#fb").innerHTML = `<div class="fb"><div>${ph(c, true, false)}</div><div>
    <p class="r ${ok ? "ok" : "no"}">${ok ? "맞았어요" : `정답은 ${esc(c.ko)}`}</p>
    <p>${esc(c.say)}${wrongName}</p><p style="color:var(--sub);margin-top:6px">${esc(c.look)}</p>
    <button class="btn solid" id="q-next">${Q.i + 1 < Q.list.length ? "다음" : "결과 보기"}</button></div></div>
    ${q.last ? `<div class="whole"><h3>그러니까 '${esc(q.t)}'${batchim(q.t) ? "은" : "는"}</h3><div class="strip">${q.last.map(id => `<figure>${ph(byId[id], true, false)}<figcaption>${esc(byId[id].ko)}<small>${esc(kind(byId[id]))}</small></figcaption></figure>`).join("")}</div></div>` : ""}`;
  $("#q-next").focus({ preventScroll: true });
  $("#fb").scrollIntoView({ block: "nearest" });
}

/* 상품명 읽기: 띄어 쓴 두세 낱말이 붙여서 한 말이면 그 말로("후드 집업"), 아니면 낱말 안에서 가장 긴 말부터 찾아 카드로 잇는다.
   한 글자 말은 낱말 전체가 그 말일 때만("울", "울30%"는 되고 "울터치"는 안 됨). */
const RKEY = "ot-read-v1";
function parse(line) {
  const out = [], found = [];
  const parts = [...line.matchAll(/[^\s\[\]()\/,·+&-]+|[\s\[\]()\/,·+&-]+/g)].map(m => m[0]);
  const isSep = w => /^[\s\[\]()\/,·+&-]+$/.test(w);
  const add = (t, html) => { if (!found.includes(R[t])) found.push(R[t]); out.push(html); };
  for (let k = 0; k < parts.length; k++) {
    const w = parts[k];
    if (isSep(w)) { out.push(esc(w)); continue; }
    let joined = false;
    for (const n of [3, 2]) {
      const span = parts.slice(k, k + 2 * n - 1);
      if (span.length < 2 * n - 1 || span.some((x, j) => j % 2 ? !/^\s+$/.test(x) : isSep(x))) continue;
      const t = span.filter((x, j) => j % 2 === 0).join("");
      if (R[t]) { add(t, `<b>${esc(span.join(""))}</b>`); k += 2 * n - 2; joined = true; break; }
    }
    if (joined) continue;
    let i = 0, html = "";
    while (i < w.length) {
      let hit = null;
      for (let L = Math.min(8, w.length - i); L >= 1; L--) {
        const t = w.slice(i, i + L);
        if (!R[t]) continue;
        if (L === 1 && !(i === 0 && /^[0-9%]*$/.test(w.slice(1)))) continue;
        hit = t; break;
      }
      if (hit) { html += `<b>${esc(hit)}</b>`; if (!found.includes(R[hit])) found.push(R[hit]); i += hit.length; }
      else { html += esc(w[i]); i++; }
    }
    out.push(html);
  }
  return { html: out.join(""), ids: found };
}
function readView() {
  let saved = ""; try { saved = localStorage.getItem(RKEY) || ""; } catch (e) {}
  $("#v-read").innerHTML = `<div class="lead"><h1>상품명 읽기</h1></div>
    <p class="cmp-say">쇼핑몰 상품명을 한 줄에 하나씩 붙여 넣으면 아는 말을 카드로 풀어 줘요. 쓴 글은 이 기기에만 남아요.</p>
    <textarea id="rd-in" rows="4" placeholder="예) 세미오버핏 골덴 투웨이 지퍼 블루종 브라운">${esc(saved)}</textarea>
    <div id="rd-out"></div>`;
  readRender();
}
function readRender() {
  const v = $("#rd-in").value;
  try { localStorage.setItem(RKEY, v); } catch (e) {}
  $("#rd-out").innerHTML = v.split(/\r?\n/).map(x => x.trim()).filter(Boolean).slice(0, 30).map(line => {
    const r = parse(line);
    return `<section class="rd"><p class="pname rd-name">${r.html}</p>${r.ids.length ? `<div class="grid">${r.ids.map(id => tile(byId[id])).join("")}</div>` : `<p class="cmp-say">아직 카드에 없는 말만 있어요.</p>`}</section>`;
  }).join("");
}
document.addEventListener("input", e => { if (e.target.id === "rd-in") readRender(); });

/* 코디 */
const sq = s => (s || "").replace(/\s/g, "");
// 색 카드에 없는 흔한 말(청바지 물 빠짐 정도 포함)
const BASE_HEX = { 회색: "#8F8F8C", 진청: "#2C3B57", 중청: "#4E6C8E", 연청: "#8FA9C3", 흑청: "#2B2E35", 초록: "#3F6A4A", 파랑: "#2F5CA6", 빨강: "#B1262D", 분홍: "#E7A6B6", 와인색: "#6A1F2B" };
function colorHex(name) {
  // "하늘색 또는 흰색"처럼 여럿이면 첫 색으로
  const n = ((name || "").split(/또는|,/)[0].trim().split(/\s+/)[0] || ""); if (!n || /같은/.test(name)) return "";
  if (BASE_HEX[n]) return BASE_HEX[n];
  const hit = w => C.find(c => c.hex && (sq(c.ko) === w || sq(c.shop) === w || (c.casual || []).some(x => sq(x) === w)));
  const c = hit(n) || hit(n.replace(/색$/, "")) || hit(n + "색");
  return c ? c.hex : "";
}
function piece(p, big) {
  const c = p.id && byId[p.id], hex = colorHex(p.color);

  if (!big) return c ? `<div class="ph"><img src="img/${c.id}.webp" alt="" width="600" height="800" loading="lazy"></div>` : `<div class="ph blank" style="--c:${hex || "#e4e4e0"}"><i></i><em>${esc(p.name)}</em></div>`;
  return c ? `<button class="pc" data-card="${c.id}"><small>${esc(p.role)}</small><div class="ph"><img src="img/${c.id}.webp" alt="${esc(c.ko)}" width="600" height="800" loading="lazy"></div>${label}</button>`
    : `<div class="pc"><small>${esc(p.role)}</small><div class="ph blank" style="--c:${hex || "#e4e4e0"}"><i></i><em>그림 준비 중</em></div>${label}</div>`;
}
const shot = f => `<figure class="kd-shot"><img src="kp/${f.id}.webp" alt="${esc(f.shot.wear)}" width="${f.shot.w}" height="${f.shot.h}"><figcaption><span><b>사진 속 옷</b>${esc(f.shot.wear)}</span>${f.shot.diff ? `<span><b>공식과 다른 점</b>${esc(f.shot.diff)}</span>` : ""}<a href="${esc(f.shot.page)}" target="_blank" rel="noopener">사진 ${esc(f.shot.by)}, Unsplash</a></figcaption></figure>`;
const kdMeta = f => [f.style, f.season.join(", "), f.for === "모두" ? "" : f.for === "여" ? "여자 코디" : "남자 코디"].filter(Boolean).join("  |  ");
function codi(arg) {

      ${f.shot ? `<div class="kd-top">${shot(f)}<div class="kd-pcs">${f.pieces.map(p => piece(p, true)).join("")}</div></div>` : `<div class="kd-pcs">${f.pieces.map(p => piece(p, true)).join("")}</div>`}
      <div class="kd-txt">

/* 계절과 성별 거르기: 주소를 바꾸지 않고 그 자리에서 다시 그린다 */

const swatch = (color, name) => `<div class="ph blank" style="--c:${colorHex(color) || "#e4e4e0"}"><i></i><em>${esc(name)}</em></div>`;

/* 짝 맞추기: 집에 있는 옷 하나로 이너, 신발, 소품까지 */
function pairView(arg, top, el) {

  if (pr) {

}

/* 요즘 유행 */
function trendView(arg, top, el) {

      <div class="kd-txt"><div class="row"><h3>무엇인가요</h3><p>${esc(tr.say)}</p></div><div class="row"><h3>왜 지금</h3><p>${esc(tr.why_now)}</p></div>

}

/* 재질: 재질 카드, 혼용률 읽기, 섞어 입기 */
function mats(arg) {
  arg = decodeURIComponent(arg || "");
  const el = $("#v-mat");
  const tabs = [["", "재질"], ["label", "혼용률 읽기"], ["mix", "섞어 입기"]];
  const cur = arg === "label" || arg === "mix" ? arg : "";
  const top = `<nav class="useg" aria-label="재질">${tabs.map(([k, l]) => `<a href="#mat${k ? "/" + k : ""}" aria-current="${k === cur}">${l}</a>`).join("")}</nav>`;
  const m = arg.startsWith("m-") && MT.materials.find(x => x.id === arg.slice(2));
  if (m) {
    el.innerHTML = `<a class="kd-back" href="#mat">재질 목록</a><div class="lead"><h1>${esc(m.name)}</h1><p class="kd-meta">${esc(m.kind)}  |  ${esc(m.season || "")}</p></div>
      <div class="kd-top">${m.shot ? `<figure class="kd-shot"><img src="mt/${m.id}.webp" alt="" width="${m.shot.w}" height="${m.shot.h}"><figcaption><span>${esc(m.shot.shows || "")}</span>${credit2(m.shot)}</figcaption></figure>` : "<div></div>"}
      <div class="kd-txt"><div class="row"><h3>무엇인가요</h3><p>${esc(m.say)}</p></div><div class="row"><h3>만지면</h3><p>${esc(m.feel || "")}</p></div>
      <div class="mt-gb"><div><h3>좋은 점</h3><ul>${(m.good || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><h3>아쉬운 점</h3><ul>${(m.bad || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div></div>
      <div class="row"><h3>많이 쓰는 옷</h3><p>${esc((m.where || []).join(", "))}</p></div><div class="row"><h3>세탁과 관리</h3><p>${esc(m.care || "")}</p></div>
      <div class="row"><h3>헷갈리는 것</h3><p>${esc(m.confuse || "")}</p></div><div class="row"><h3>살 때 볼 것</h3><p>${esc(m.tip || "")}</p></div>
      <div class="row"><h3>출처</h3><p class="src">${srcLinks(m.src)}</p></div></div></div>`;
    return;
  }
  if (cur === "label") {
    el.innerHTML = top + `<div class="lead"><h1>혼용률 읽기</h1></div><p class="cmp-say">옷 안쪽 라벨에 적힌 섬유 비율로 옷의 느낌과 관리법을 미리 알 수 있어요.</p>
      <ol class="mt-rules">${MT.label_rules.map(r => `<li>${esc(r.rule || r)} <span class="src">${srcLinks(r.src)}</span></li>`).join("")}</ol>
      <div class="mt-blends">${MT.blends.map(b => `<section class="blend"><div class="tag-label"><small>품질 표시</small><b>${esc(b.label)}</b></div><div><h2>${esc(b.name)}</h2><p>${esc(b.why)}</p><p class="gb"><span class="ok">좋은 점</span> ${esc((b.good || []).join(", "))}</p><p class="gb"><span class="no">아쉬운 점</span> ${esc((b.bad || []).join(", "))}</p><p class="rd">${esc(b.read)}</p><p class="src">${srcLinks(b.src)}</p></div></section>`).join("")}</div>`;
    return;
  }
  if (cur === "mix") {
    el.innerHTML = top + `<div class="lead"><h1>재질 섞어 입기</h1></div><p class="cmp-say">한 코디 안에서 재질을 어떻게 섞으면 좋은지 모았어요.</p>
      <div class="rules">${MT.mixing.map(x => { const ex = LK.filter(l => mixHit(l, x)).slice(0, 2); return `<section class="rule${ex.length ? " has" : ""}"><div><h2>${esc(x.name)}</h2><p>${esc(x.say)}</p><dl><dt class="ok">이렇게</dt><dd>${esc(x.do)}</dd><dt class="no">이건 피해요</dt><dd>${esc(x.dont)}</dd></dl><p class="src">${srcLinks(x.src)}</p></div>${ex.length ? `<div class="rule-ph">${ex.map(l => `<a href="#codi/l-${l.id}"><img src="lk/${l.id}.webp" alt="" loading="lazy"><span>${esc(l.pieces.filter(p => p.mat).map(p => p.mat).join(", "))}</span></a>`).join("")}</div>` : ""}</section>`; }).join("")}</div>`;
    return;
  }
  const kinds = [...new Set(MT.materials.map(x => x.kind))];
  el.innerHTML = top + `<div class="lead"><h1>재질 <span>${MT.materials.length}가지</span></h1></div><p class="cmp-say">같은 옷도 재질에 따라 느낌, 계절, 관리법이 달라요. 사진을 눌러 자세히 봐요.</p>
    ${kinds.map(k => `<h3 class="pair-h">${esc(k)}</h3><div class="mt-grid">${MT.materials.filter(x => x.kind === k).map(x => `<a class="mtc" href="#mat/m-${x.id}"><div class="mtph">${x.shot ? `<img src="mt/${x.id}.webp" alt="" loading="lazy">` : `<span>${esc(x.name)}</span>`}</div><b>${esc(x.name)}</b><span>${esc(x.feel || "")}</span></a>`).join("")}</div>`).join("")}`;
}
// 섞어 입기 규칙과 실제 코디 잇기: 규칙 글에 나온 재질 둘이 사진 속 옷에 다 있으면
const MATW = ["스웨이드", "가죽", "데님", "코듀로이", "울", "니트", "나일론", "플리스", "린넨", "퍼", "패딩", "트위드", "면"];
const mixHit = (l, x) => { const ws = MATW.filter(w => (x.do || "").includes(w)); const have = l.pieces.map(p => (p.mat || "") + p.name).join(" "); return ws.length >= 2 && ws.filter(w => have.includes(w)).length >= 2; };

/* 시작: 공부 순서 */
function start() {
  const seen = id => st.seen && st.seen[id];
  const steps = [
    { n: "아이템", d: "집에 흔한 옷부터 이름을 익혀요.", ids: ["tee", "sweatshirt", "hoodie", "zipup", "oxford", "flannel", "sweater", "cardigan", "jeans", "slacks", "chino", "cargo", "jogger", "shorts", "trucker", "blouson", "windbreaker", "fleece", "puffer", "longpuffer", "lowtop", "loafer", "derby", "runner", "workboots", "ballcap", "beanie", "bucket", "polo", "longsleeve"], go: [["#book/1", "카드 보기"], ["#quiz/1", "퀴즈"]] },
    { n: `재질 ${MT.materials.length}가지`, d: "면, 폴리, 나일론, 울, 스웨이드, 기모처럼 라벨에 자주 나오는 재질과 혼용률 읽기.", mat: 1, go: [["#mat", "재질 보기"], ["#mat/label", "혼용률 읽기"]] },
    { n: "핏과 색", d: "오버핏과 레귤러, 와이드와 스트레이트, 차콜과 그레이처럼 헷갈리는 짝을 나란히 봐요.", ids: ["oversized", "regular", "slim", "wide", "straight", "tapered", "charcoal", "black", "navy", "beige", "khaki", "olive"], go: [["#cmp", "나란히 비교"], ["#quiz/4", "퀴즈"]] },
    { n: "코디", d: "계절별 실제 코디를 보고, 가진 옷 하나로 짝을 맞춰 봐요.", look: 1, go: [["#codi", "실제 코디"], ["#codi/pair", "짝 맞추기"], ["#codi/rules", "기본 규칙"], ["#quiz/rule", "퀴즈"]] },
    { n: "요즘 유행", d: "스웨이드, 발레코어처럼 지금 뜨는 것과 집에 있는 옷으로 따라 하는 법.", trend: 1, go: [["#codi/trend", "요즘 유행"], ["#quiz/photo", "사진에서 찾기"]] },
  ];
  const strip = s => s.ids ? s.ids.filter(id => byId[id]).slice(0, 6).map(id => `<div class="ph">${cimg(id)}</div>`).join("")
    : s.mat ? MT.materials.filter(m => m.shot).slice(0, 6).map(m => `<div class="ph"><img src="mt/${m.id}.webp" alt="" loading="lazy"></div>`).join("")
    : s.look ? LK.slice(0, 6).map(l => `<div class="ph"><img src="lk/${l.id}.webp" alt="" loading="lazy"></div>`).join("") || K.f.filter(f => f.shot).slice(0, 6).map(f => `<div class="ph"><img src="kp/${f.id}.webp" alt="" loading="lazy"></div>`).join("")
    : TR.filter(x => x.shot).slice(0, 6).map(x => `<div class="ph"><img src="tp/${x.id}.webp" alt="" loading="lazy"></div>`).join("");
  const done = s => s.ids ? s.ids.filter(id => byId[id] && seen(id)).length + " / " + s.ids.filter(id => byId[id]).length : "";
  $("#v-start").innerHTML = `<div class="lead"><h1>처음이면 여기부터</h1><p class="goal">다섯 단계를 순서대로 하면 상품명과 라벨을 읽고, 집에 있는 옷으로 코디를 짤 수 있어요.</p></div>
    <ol class="steps">${steps.map((s, i) => `<li><div class="st-h"><b>${i + 1}</b><div><h2>${esc(s.n)}${s.ids ? ` ${s.ids.filter(id => byId[id]).length}장` : ""}</h2><p>${esc(s.d)}</p></div>${done(s) ? `<em>본 카드 ${done(s)}</em>` : ""}</div><div class="st-strip">${strip(s)}</div><div class="st-go">${s.go.map(([h, l], k) => `<a class="btn${k ? "" : " solid"}" href="${h}">${l}</a>`).join("")}</div></li>`).join("")}</ol>
    <p class="st-more"><a href="plan.html">기획</a><a href="refs.html">참고한 곳</a><a href="terms.html">용어 사전</a></p>`;
}

/* 화면 전환 */
let view = "book";
const VIEWS = ["start", "book", "mat", "cmp", "codi", "quiz", "read"];
function refresh() {
  const arg = location.hash.split("/")[1];
  if (view === "start") start();
  else if (view === "mat") mats(arg);
  else if (view === "book") book(arg);
  else if (view === "cmp") cmp(arg);
  else if (view === "codi") codi(arg);
  else if (view === "read" && $("#rd-in")) readRender();
  prog();
}
function route() {
  const h = location.hash.slice(1) || "start";
  const [v, arg] = h.split("/");
  if (v === "card") { openCard(arg); return; }
  closeCard();
  document.body.classList.remove("no-home");
  const prev = view;
  view = VIEWS.includes(v) ? v : "start";
  for (const s of VIEWS) $("#v-" + s).hidden = s !== view;
  document.querySelectorAll(".tabs a").forEach(a => a.dataset.v === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelector('.tabs a[aria-current="page"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (view === "read") { if (!$("#rd-in")) readView(); else readRender(); prog(); }
  else if (view === "quiz") {
    const scope = U.some(x => x.u == arg) || (arg === "name" && N.length) || arg === "mix" || (arg === "rule" && K.r.length) || (arg === "real" && RP.length) || (arg === "photo" && F.length) || arg === "part" || arg === "review" ? arg : "";
    if (!Q || Q.scope !== scope) startQuiz(null, scope); else quiz();
    prog();
  } else refresh();
  // 같은 화면 안에서 거르기만 바꿀 때는 보던 자리를 그대로 둔다
  if (prev !== view || /^[a-z]-/.test(arg || "")) window.scrollTo(0, 0);
}

document.addEventListener("change", e => { if (e.target.id === "lk-item") { KS.item = e.target.value; refresh(); } });
document.addEventListener("click", e => {
  const tp = e.target.closest("#tap"); if (tp) return tapAnswer(e);
  const ks = e.target.closest("[data-ks]"); if (ks) { KS[ks.dataset.ks] = ks.dataset.kv; return refresh(); }
  if (e.target.closest("#sync-in")) return window.otLogin?.();
  const ow = e.target.closest("[data-own]");
  if (ow) { st.own = st.own || {}; const id = ow.dataset.own; if (st.own[id]) delete st.own[id]; else st.own[id] = 1; save(); ow.outerHTML = ownBtn(id); return; }
  if (e.target.closest("#sync-out")) return window.otLogout?.();
  const t = e.target.closest("[data-card],[data-op],#q-next,#q-again,#q-again-wrong,#c-x,#c-prev,#c-next");
  if (!t) { if (e.target.id === "sheet") history.back(); return; }
  if (t.dataset.op) return answer(t.dataset.op);
  if (t.dataset.card) return show(t.dataset.card);
  if (t.id === "q-next") { Q.i++; quiz(); window.scrollTo({ top: 0, behavior: "instant" }); return; }
  if (t.id === "q-again") return startQuiz(null, Q.scope);
  if (t.id === "q-again-wrong") return startQuiz([...new Set(Q.wrong.filter(Boolean))], Q.scope);
  if (t.id === "c-x") return history.back();
  if (t.id === "c-prev") return step(-1);
  if (t.id === "c-next") return step(1);
});
document.addEventListener("keydown", e => {
  if (!$("#sheet").hidden) {
    if (e.key === "Escape") history.back();
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
    return;
  }
  if (view === "quiz" && Q && Q.done && e.key === "Enter" && $("#q-next") && document.activeElement !== $("#q-next")) { $("#q-next").click(); return; }
  if (view === "quiz" && Q) {
    const n = Number(e.key);
    if (n >= 1 && n <= 4 && !Q.done) { const b = $("#ops")?.children[n - 1]; b && answer(b.dataset.op); }
  }
});
window.addEventListener("hashchange", route);

fetch("cards.json").then(r => r.json()).then(d => {
  G = d.groups; C = d.cards; N = d.names || []; F = d.find || []; LK = d.looks || []; TR = d.trend || []; PR = d.pair || []; MT = d.mat && d.mat.materials ? d.mat : MT; R = d.read || {}; K = d.codi || K; RP = d.real || []; byId = Object.fromEntries(C.map(c => [c.id, c]));
  U = d.units.filter(x => C.some(c => c.u == x.u));
  if (location.hash.startsWith("#card/")) { const id = location.hash.split("/")[1]; history.replaceState(null, "", "#book"); route(); location.hash = "#card/" + id; }
  else route();
});
</script>
<script type="module">
// 폰과 노트북 기록 잇기: 구글 로그인 + Firestore otgongbu/{uid} (규칙: 본인만 읽고 씀). 로그인 안 하면 이 기기에만 저장.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, connectFirestoreEmulator, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js";
const app = initializeApp({ apiKey: "AIzaSyAIAE7UPt3jRirq331QOqhhRwoyiF9spGM", authDomain: "changupsil-board.firebaseapp.com", projectId: "changupsil-board", appId: "1:828479047713:web:1ae9a15c3952e41e2ebb60" });
const auth = getAuth(app), db = getFirestore(app);
if (location.hostname === "127.0.0.1" && location.search.includes("emu")) {
  connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
  connectFirestoreEmulator(db, "127.0.0.1", 8080);
}
const merge = (a, b) => {
  const seen = { ...a.seen, ...b.seen }, stat = { ...a.stat };
  for (const [k, v] of Object.entries(b.stat || {})) { const x = stat[k] || { s: 0, w: 0 }; stat[k] = { s: Math.max(x.s || 0, v.s || 0), w: Math.max(x.w || 0, v.w || 0) }; const dd = Math.max(x.due || 0, v.due || 0); if (dd) stat[k].due = dd; }
  const own = { ...a.own, ...b.own };
  const today = [a.today, b.today].filter(Boolean).sort((x, y) => x.d < y.d ? 1 : x.d > y.d ? -1 : y.n - x.n)[0];
  return { seen, stat, own, ...(today ? { today } : {}), streak: Math.max(a.streak || 0, b.streak || 0) };
};
let uid = null, timer = 0;
const send = () => { clearTimeout(timer); timer = 0; if (!uid) return; const s = window.ot.get(); setDoc(doc(db, "otgongbu", uid), { seen: s.seen, stat: s.stat, own: s.own || {}, today: s.today || null, streak: s.streak || 0, at: serverTimestamp() }).catch(() => {}); };
const push = () => { if (!uid) return; clearTimeout(timer); timer = setTimeout(send, 1500); };
document.addEventListener("visibilitychange", () => { if (document.hidden && timer) send(); });
window.otLogin = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(() => {});
window.otLogout = () => signOut(auth);
onAuthStateChanged(auth, async u => {
  uid = u?.uid || null;
  window.otUser = !!u;
  if (u) {
    try {
      const snap = await getDoc(doc(db, "otgongbu", u.uid));
      const both = merge(window.ot.get(), snap.exists() ? snap.data() : { seen: {}, stat: {} });
      window.ot.set(both);
      window.otPush = push; push();
    } catch (e) { window.otUser = "err"; window.otPush = null; }
  } else { window.otPush = null; }
  if (window.ot) window.ot.set(window.ot.get());
});
</script>
