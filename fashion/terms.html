<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷 공부 용어</title>
<meta name="description" content="옷 공부 열 단원의 용어를 쇼핑몰 이름, 전문 용어, 편한 말로 나눠 찾는 사전">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#121212; --sub:#5f5f5c; --faint:#9a9a96; --line:#e6e6e3;
  --paper:#ffffff; --tile:#f1f1ee; --diff:#b4441c; --part:#1f5fbf;
  --wrap:1180px; --gut:max(16px,4vw);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
[hidden]{display:none!important}
body.sheet-open #cu-home{display:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut);height:56px;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:22px;height:100%}
.tabs a{display:flex;align-items:center;height:100%;text-decoration:none;color:var(--faint);font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}

main{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut) 96px}
.lead{padding:28px 0 0}
.lead h1{margin:0;font-size:clamp(34px,6.4vw,64px);line-height:1.05;font-weight:800;letter-spacing:-.05em}
.lead h1 span{color:var(--faint);font-weight:300}
.lead p{margin:14px 0 0;max-width:40em;color:var(--sub);font-size:15px}

.useg{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:26px 0 0;border-bottom:1px solid var(--line)}
.useg::-webkit-scrollbar{display:none}
.useg button{flex:none;padding:10px 0;font-size:15px;font-weight:600;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.useg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.useg small{font-size:12px;font-weight:500;margin-left:3px;font-variant-numeric:tabular-nums}

.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 0 4px}
.tools input{font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);background:var(--paper);width:min(300px,100%)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:7px 12px;font-size:14px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.n{margin-left:auto;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}

.grp{padding-top:30px}
.grp h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.04em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
.t{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.t:hover .tn{text-decoration:underline;text-underline-offset:4px}
.tn{font-size:17px;font-weight:700;letter-spacing:-.03em}
.tn small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.tm{grid-column:1;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pr{font-size:12px;font-weight:800;color:var(--faint)}
.pr.A{color:var(--ink)}
.df{font-size:11px;font-weight:700;padding:1px 5px;border:1px solid currentColor}
.df.d{color:var(--diff)}.df.p{color:var(--part)}
.empty{padding:48px 0;color:var(--sub)}

/* 자세히 */
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.35);z-index:40}
.pane{position:fixed;z-index:50;background:#fff;top:0;right:0;bottom:0;width:min(460px,100%);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 28px calc(32px + env(safe-area-inset-bottom,0px));box-shadow:-12px 0 40px rgba(0,0,0,.08)}
.x{position:sticky;top:0;float:right;font-size:14px;font-weight:600;color:var(--sub);padding:6px 0 6px 12px;background:#fff}
.pu{font-size:13px;color:var(--sub);font-weight:600}
.pane h2{margin:6px 0 0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.05em}
.pane .say{margin:12px 0 0;font-size:17px;line-height:1.6}
.pic{margin:16px 0 0;display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:end}
.pic img{width:120px;aspect-ratio:3/4;object-fit:cover;background:var(--tile)}
.pic a{font-size:14px;font-weight:600}
dl{margin:20px 0 0;display:grid;grid-template-columns:5.5em 1fr;gap:8px 14px;font-size:15px}
dt{color:var(--faint);font-size:13px;padding-top:2px}
dd{margin:0}
.box{margin:18px 0 0;padding:14px 16px;background:var(--tile);font-size:15px;line-height:1.6}
.box b{display:block;font-size:13px;margin-bottom:4px}
.box.d b{color:var(--diff)}.box.p b{color:var(--part)}
.pane h3{margin:24px 0 8px;font-size:13px;color:var(--faint);font-weight:600}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pairs button{font-size:14px;padding:4px 10px;border:1px solid var(--line)}
.pairs button:hover{border-color:var(--ink)}
.ev{margin:0;padding:0 0 0 18px;font-size:13px;color:var(--sub);line-height:1.6}
.ev li+li{margin-top:4px}
.meta{margin:18px 0 0;font-size:12px;color:var(--faint)}

@media (max-width:760px){
  .pane{top:auto;left:0;width:100%;max-height:82vh;border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.12);padding:16px var(--gut) calc(24px + env(safe-area-inset-bottom,0px))}
  .pane h2{font-size:28px}
  .list{grid-template-columns:1fr}
  .tools .n{margin-left:0}
}
@media (max-width:560px){
  .top-in{gap:16px}.tabs{gap:14px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="./#book">옷 공부</a>
  <nav class="tabs" aria-label="화면">
    <a href="./#book">도감</a>
    <a href="./#cmp">비교</a>
    <a href="./#quiz">퀴즈</a>
    <a href="./#read">읽기</a>
    <a href="plan.html" aria-current="page">계획</a>
  </nav>
</div></header>
<main>
  <div class="lead">
    <h1>용어 <b id="tot"></b>개 <span>/ 10단원</span></h1>
    <p>쇼핑몰에 적힌 이름, 정확한 이름, 사람들이 편하게 부르는 이름을 나눴어요. 뜻이 조금 다른 것은 <b style="color:var(--part)">일부</b>, 아예 다른 것은 <b style="color:var(--diff)">다름</b>으로 표시했어요. 누르면 차이와 근거가 나와요.</p>
  </div>
  <nav class="useg" id="units" aria-label="단원"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="이름으로 찾기: 가디건, 시보리, 야상" aria-label="이름으로 찾기" autocomplete="off">
    <div class="seg" id="pr" role="group" aria-label="중요도"><button data-v="" aria-pressed="true">전체</button><button data-v="A" aria-pressed="false">자주 보는 말</button></div>
    <div class="seg" id="df" role="group" aria-label="뜻"><button data-v="" aria-pressed="true">전체</button><button data-v="x" aria-pressed="false">이름끼리 뜻이 다른 것</button></div>
    <span class="n" id="n"></span>
  </div>
  <div id="out"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="pane" id="pane" hidden aria-label="용어 자세히"></aside>
<script>
const D = [{"id":"tee","unit":1,"group":"상의","shop":"반팔 티셔츠","pro":"반팔 티셔츠(반소매 티셔츠)","casual":["반팔티","티","반팔","숏슬리브","티셔츠","라운드티"],"en":"T-shirt","same":"같음","meaning":"목이 둥글고 소매가 짧은 저지 상의예요.","look":"단추 없는 둥근 목, 팔꿈치 위에서 끝나는 소매","confuse":["threequartersleevelength"],"priority":"A","evidence":"무신사 상품명 반팔 티셔츠 8, 반팔티 11; 표준국어대사전 티셔츠; 무신사 반팔(14/60), 반소매(4/60)","img":1},{"id":"sweatshirt","unit":1,"group":"상의","shop":"맨투맨","pro":"스웨트셔츠(스웻셔츠)","casual":["맨투맨 티","쭈리 티"],"en":"Sweatshirt","same":"일부","diff":"영어 sweatshirt는 후드, 지퍼, V넥까지 포함하는 넓은 말이에요. 한국 맨투맨은 보통 크루넥 풀오버만 가리키고 한국에서만 통해요.","meaning":"안쪽이 보송한 두꺼운 스웨트 원단의 크루넥 상의예요. '맨투맨'은 한국에서 붙은 이름이고 영어로는 스웨트셔츠예요.","look":"목, 소매 끝, 밑단의 골지","priority":"A","evidence":"무신사 상품명 맨투맨 28, 스웨트셔츠 8, 스웻셔츠 9","img":1},{"id":"hoodie","unit":1,"group":"상의","shop":"후드티","pro":"후디","casual":["후드"],"en":"Hoodie","same":"일부","diff":"후드티는 후드와 티를 붙인 한국식 말이에요. 영어 hoodie는 풀오버뿐 아니라 지퍼형도 포함해요.","meaning":"모자가 달린 스웨트 상의예요. 배 앞에 큰 주머니가 있는 게 많아요.","look":"모자, 배 앞의 캥거루 주머니","confuse":["zipup"],"priority":"A","evidence":"무신사 상품명 후드티 17, 후디 11, 후드 38; 표준국어대사전 후드(hood)만 등재","img":1},{"id":"zipup","unit":1,"group":"상의","shop":"후드집업","pro":"지퍼 후디","casual":["후드짚업","집업","집업 후디"],"en":"Zip-up hoodie","same":"같음","meaning":"앞을 지퍼로 끝까지 여는 후드티예요.","look":"목에서 밑단까지 이어진 지퍼","confuse":["hoodie","knitzipup"],"priority":"A","evidence":"무신사 상품명 후드집업 35, 후드 집업 35, 집업 36; 무신사 후드집업 28,815(35/60)","img":1},{"id":"bustiertop","unit":1,"group":"상의","shop":"뷔스티에","pro":"뷔스티에","casual":["비스티에"],"en":"Bustier top","same":"같음","meaning":"가슴과 허리를 감싸 꼭 맞는 코르셋풍 상의예요. 어깨끈이 없거나 가는 것이 많아요.","look":"허리까지 꼭 맞는 몸판, 뒤쪽 끈이나 지퍼","priority":"A","evidence":"무신사 4,850(26/60)"},{"id":"poloshirt","unit":1,"group":"상의","shop":"폴로 셔츠","pro":"폴로 셔츠","casual":["피케 셔츠","카라티"],"en":"Polo shirt","same":"일부","diff":"폴로 셔츠는 칼라 아래 단추 2~3개가 달린 피케 면 상의이고 카라티는 같은 옷을 부르는 일상 말이에요. 니트 폴로는 소재가 니트라서 다른 카드예요.","meaning":"목에 칼라와 짧은 단추 줄이 있는 피케 면 상의예요.","look":"칼라 아래 단추 2~3개","confuse":["knitpolo","henley"],"priority":"A","evidence":"무신사 폴로셔츠 14,762(7/60), 카라티 14,134(5/60), 피케셔츠 209(24/60)"},{"id":"longsleeve","unit":1,"group":"상의","shop":"롱슬리브","title":"긴팔티","pro":"롱 슬리브 티셔츠","casual":["긴티","롱슬","긴팔 티셔츠","롱 슬리브 티","긴팔"],"en":"Long sleeve tee","same":"일부","diff":"쇼핑몰의 롱슬리브는 몸에 붙는 얇은 긴팔 티를 가리킬 때가 많아요(추정). 이름만으로는 두께를 알 수 없어요.","meaning":"티셔츠 원단 그대로 소매만 긴 상의예요.","look":"얇은 저지 원단, 손목까지 오는 소매","confuse":["threequartersleevelength"],"priority":"B","evidence":"무신사 상품명 긴팔 티셔츠 6, 긴팔티 14, 롱슬리브 21; 무신사 롱슬리브 169,318건(21/60)","img":1},{"id":"tank","unit":1,"group":"상의","shop":"슬리브리스","title":"민소매","pro":"슬리브리스 탑","casual":["나시","탱크 탑","나시티","민소매 티"],"en":"Tank top","same":"일부","diff":"나시는 일본어 소데나시의 줄임말이고 런닝은 속옷용 민소매를 가리키는 일본식 영어예요. 탱크탑은 어깨끈이 넓고 몸에 붙는 쪽이에요.","meaning":"소매 없이 어깨끈만 있는 상의예요. 흔히 '나시'나 '민소매'라고 해요.","look":"소매 없이 끈처럼 남은 어깨","confuse":["capsleeve","threequartersleevelength"],"priority":"B","evidence":"무신사 상품명 민소매 1, 나시 7, 나시티 1, 슬리브리스 16, 탱크탑 18, 런닝 3; 표준국어대사전 민소매(표준대). 나시는 순화 대상; 무신사 슬리브리스 32,688(16/60), 나시 33,429(7/60)","img":1},{"id":"croptee","unit":1,"group":"상의","shop":"크롭 티","pro":"크롭 탑","casual":["크롭 티셔츠","짧은 티"],"en":"Cropped tee","same":"같음","meaning":"기장이 허리 위로 짧은 티셔츠예요.","look":"허리선보다 위에서 끝나는 밑단","priority":"B","evidence":"무신사 상품명 크롭티 13, 크롭 티셔츠 12; 무신사 4,223(5/60), 크롭 티 27,185(13/60)","img":1},{"id":"rugby","unit":1,"group":"상의","shop":"럭비 셔츠","pro":"럭비 저지","casual":["럭비티"],"en":"Rugby shirt","same":"같음","meaning":"굵은 가로 줄무늬에 흰 깃이 달린 두꺼운 긴팔 셔츠예요.","look":"흰 칼라, 짧은 단추 앞트임, 굵은 가로 줄","priority":"B","evidence":"무신사 상품명 럭비티 19, 럭비 셔츠 8","img":1},{"id":"jersey","unit":1,"group":"상의","shop":"축구 저지","pro":"풋볼 셔츠","casual":["사커 저지","축구 져지","축구 유니폼","져지"],"en":"Football jersey","same":"일부","diff":"한국의 져지는 선수복 상의를 가리켜요. 일본어 ジャージ는 트레이닝복 전체이고 jersey 원단은 신축성 있는 편물이라 뜻이 셋이에요.","meaning":"축구 유니폼 상의예요. 얇은 기능성 원단에 칼라나 줄이 있어요.","look":"반짝이는 얇은 원단, 칼라, 몸판의 굵은 줄","priority":"B","evidence":"무신사 상품명 저지 8, 져지 4, 축구 저지 0; 표준국어대사전 저지의 의류 뜻은 표준대에서 확인 못 함","img":1},{"id":"babytee","unit":1,"group ,"same":"같음","meaning":"가죽(양가죽, 소가죽 등)으로 만든 재킷 전체예요. 모양과 길이로 이름이 나뉘어요.","look":"매끈한 가죽 겉면, 스웨이드는 보풀 있는 면","confuse":["rider"],"priority":"A","evidence":"무신사 레더자켓 6,502(17/60), 램스킨 1,059(37/60), 스웨이드자켓 3,174(6/60), 레더트렌치 121"},{"id":"jumper","unit":1,"group":"가벼운 아우터","shop":"점퍼","pro":"점퍼","casual":["잠바"],"en":"Jumper (jacket)","same":"다름","diff":"잠바는 일본어 ジャンパー에서 온 말이에요. 외래어 표기법은 점퍼가 맞지만 이화여대 국어문화원은 관습으로 둘 다 인정해요. 영어 jumper는 영국에서 스웨터, 미국에서 소매 없는 원피스예요.","meaning":"품이 넉넉한 활동복형 겉옷이에요.","look":"품이 넉넉하고 지퍼나 단추로 여미는 짧은 겉옷","priority":"A","evidence":"점퍼 6, 잠바 0, 블루종 31"},{"id":"outerwear","unit":1,"group":"가벼운 아우터","shop":"아우터","pro":"아우터","casual":["겉옷","외투"],"en":"Outerwear","same":"같음","meaning":"겉에 입는 옷 전체를 부르는 말이에요.","look":"티와 니트 위에 걸치는 모든 겉옷","priority":"A","evidence":"아우터 0(총 144011)"},{"id":"trucker","unit":1,"group":"가벼운 아우터","shop":"트러커 자켓","pro":"트러커 재킷(데님 재킷)","casual":["청자켓","청잠바","진 자켓","청재킷","트러커 재킷"],"en":"Trucker jacket","same":"일부","diff":"청자켓은 데님으로 만든 모든 재킷이고 트러커는 그중 가슴 포켓 두 개와 허리 조임 탭이 있는 리바이스 계열 모양이에요.","meaning":"가슴 주머니 두 개와 세로 절개가 있는 짧은 데님 재킷이에요.","look":"가슴 덮개 주머니, 세로 절개선, 허리 띠 밑단","confuse":["gjan"],"priority":"B","evidence":"무신사 상품명 트러커 13, 데님 트러커 3, 청자켓 1, 청재킷 0; 표준국어대사전 재킷","img":1},{"id":"rider","unit":1,"group":"가벼운 아우터","shop":"라이더 자켓","pro":"라이더 재킷","casual":["라이더 재킷"],"en":"Rider jacket","same":"일부","diff":"가죽 자켓은 가죽 재킷 전체이고 라이더는 비대칭 지퍼와 넓은 깃을 가진 한 종류예요.","meaning":"비스듬한 지퍼와 넓은 라펠의 가죽 재킷이에요.","look":"사선 지퍼, 넓은 라펠, 금속 장식","confuse":["firemanjacket","leatherjacket","allleather"],"priority":"B","evidence":"무신사 상품명 라이더 재킷 0, 라이더 자켓 1(검색 총 4900); 표준국어대사전 재킷"},{"id":"shortjacket","unit":1,"group":"가벼운 아우터","shop":"숏 자켓","pro":"숏 재킷","casual":["크롭 재킷"],"en":"Short jacket","same":"같음","meaning":"허리 위로 오는 짧은 재킷이에요.","look":"기장이 허리 위","confuse":["blazer"],"priority":"B","evidence":"무신사 숏자켓 12,305(7/60), 크롭자켓 8,866(2/60)"},{"id":"harringtonjacket","unit":1,"group":"가벼운 아우터","shop":"해링턴 재킷","pro":"해링턴 재킷","casual":["해링턴 자켓","바라쿠타","G9"],"en":"Harrington jacket","same":"같음","diff":"바라쿠타는 해링턴 재킷을 처음 만든 영국 브랜드이고 G9은 그 대표 모델이에요. 상품명에는 셋이 섞여 나와요.","meaning":"가슴과 어깨에 요크가 있고 지퍼로 여미는 짧은 점퍼예요. 칼라가 서고 체크 안감이 달려요.","look":"격자 안감, 칼라가 서 있음","confuse":["blouson"],"priority":"B","evidence":"무신사 해링턴 659(32/60), G9 1,946(32/60). 유튜브 챕터 \"해링턴 자켓 vs 바라쿠타 vs G9\""},{"id":"fatiguejacket","unit":1,"group":"가벼운 아우터","shop":"퍼티그 재킷","pro":"퍼티그 재킷","casual":["퍼티그","정글 퍼티그"],"en":"Fatigue jacket","same":"같음","meaning":"미군 올리브색 작업복에서 온 면 헤링본 군복 재킷이에요.","look":"올리브색 헤링본 원단, 큰 주머니","priority":"B","evidence":"무신사 퍼티그 16,747(46/60). 유튜브 챕터 \"필드 자켓(야상) vs 퍼티그 자켓\""},{"id":"firemanjacket","unit":1,"group":"가벼운 아우터","shop":"파이어맨 재킷","pro":"파이어맨 재킷","casual":["파이어맨 후크","후크 재킷"],"en":"Fireman jacket (hook jacket)","same":"같음","meaning":"소방복에서 온 지퍼 위 금속 후크 재킷이에요.","look":"지퍼 위에 후크 3개","confuse":["rider"],"priority":"B","evidence":"무신사 72건(36/60). 기사(2026-02-11) \"올해의 잇 디테일\", 이탈리아 빈티지 장터 상품 다수; 기사 무신사 서울패션위크(2026-02-11). 무신사 72건"},{"id":"shelljacket","unit":1,"group":"가벼운 아우터","shop":"쉘 자켓","pro":"쉘 재킷","casual":["마운틴 재킷","마운틴 자켓","고어텍스 재킷","마운틴 파카"],"en":"Shell jacket","same":"같음","meaning":"방수 방풍 겉옷이에요.","look":"두 겹 소재, 봉제선 테이프","confuse":["windbreaker"],"priority":"B","evidence":"무신사 고어텍스 878(49/60), 쉘자켓 872(16/60), 마운틴자켓 316(14/60)"},{"id":"suitjacket","unit":1,"group":"가벼운 아우터","shop":"슈트 재킷","pro":"슈트 재킷","casual":["마이","가다마이","양복 윗도리"],"en":"Suit jacket","same":"다름","diff":"마이는 일본어 가타마에가 줄어든 말이라는 설명이 있어요. 국립국어원은 재킷으로 쓰라고 안내해요. 블레이저와 달리 마이는 바지와 세트인 양복 상의에 써요.","meaning":"바지와 한 벌인 양복 윗옷이에요.","look":"바지와 같은 원단의 정장 상의","priority":"B","evidence":"마이 15"},{"id":"coach","unit":1,"group":"가벼운 아우터","shop":"코치 자켓","pro":"코치 재킷","casual":["코치 점퍼"],"en":"Coach jacket","same":"같음","meaning":"얇은 나일론에 똑딱이 단추로 여미는 셔츠 깃 점퍼예요.","look":"셔츠 깃, 앞 똑딱이 단추, 밑단 조임끈","priority":"C","evidence":"무신사 상품명 코치 재킷 0, 코치 자켓 0(검색 총 12700); 표준국어대사전 재킷; 무신사 카테고리 \"나일론/코치 재킷\", 무신사 코치재킷 12,713(0/60)","img":1},{"id":"gjan","unit":1,"group":"가벼운 아우터","shop":"지잔","pro":"지잔","casual":["데님 자켓"],"en":"G-jan (Japanese-style denim jacket)","same":"일부","diff":"데님 재킷은 소재 기준의 가장 큰 말이고 지잔은 아메카지 쪽에서 쓰는 일본식 말이에요(짧고 품 넉넉한 투박한 데님, 리바이스 1, 2세대).","meaning":"데님 소재 짧은 재킷을 부르는 남성복 용어예요.","look":"데님, 가슴 주머니","confuse":["trucker"],"priority":"C","evidence":"유튜브 챕터 \"데님 자켓 vs 지잔 vs 트러커 자켓\". 무신사 데님자켓 6,244(2/60). 일부러 어려운 말이라 낮은 우선순위"},{"id":"safarijacket","unit":1,"group":"가벼운 아우터","shop":"사파리","pro":"사파리","casual":["헌팅 재킷","사파리 자켓"],"en":"Safari jacket","same":"같음","meaning":"주머니가 많고 허리를 졸라 입는 카키색 겉옷이에요.","look":"가슴과 배 주머니 4개","confuse":["utilityjacket"],"priority":"C","evidence":"무신사 사파리 9,504(0/60), 헌팅 3,750. 무신사 카테고리 '사파리/헌팅 재킷'(2026-11-23). 유튜브(2026-08-27)의 사파리 자켓"},{"id":"robecoat","unit":1,"group":"가벼운 아우터","shop":"로브","pro":"로브","casual":["로브 코트","로브 가운"],"en":"Robe coat","same":"같음","meaning":"가운처럼 벨트로 묶는 겉옷이에요.","look":"벨트, 앞이 열림","confuse":["pajamas"],"priority":"C","evidence":"무신사 로브 1,253(38/60, 잠옷이 많음). 기사(2026-03-27)에서 블레이저 대신 입는 아우터로 소개"},{"id":"waxedhuntingjacket","unit":1,"group":"가벼운 아우터","shop":"바버 재킷","pro":"바버 재킷","casual":["왁스 재킷","왁스 자켓"],"en":"Waxed hunting jacket (Barbour style)","same":"같음","meaning":"기름 먹인 면으로 만든 영국식 사냥 재킷이에요.","look":"코듀로이 칼라, 큰 주머니","priority":"C","evidence":"무신사 바버 57(32/60), 왁스자켓 38. 인기 적음, 선택 항목"},{"id":"puffer","unit":1,"group":"겨울 아우터","shop":"숏패딩","pro":"다운 재킷(짧은 것)","casual":["패딩 점퍼"],"en":"Puffer jacket","same":"다름","diff":"패딩은 충전해 누비는 방식을 가리키는 한국식 옷 이름이에요. 영어권 down jacket은 깃털 충전이고 합성 솜은 insulated jacket이라 달라요. 상품명 패딩은 둘 다 포함해요.","meaning":"솜이나 오리털을 넣어 칸칸이 누빈 짧은 겨울 점퍼예요.","look":"부푼 가로 칸, 엉덩이 위 기장","confuse":["pufferjacket"],"priority":"A","evidence":"무신사 상품명 숏패딩 5, 숏 패딩 5, 다운 59; 표준국어대사전 패딩(표준대: 솜이나 깃털을 넣어 누비는 방식)"},{"id":"longpuffer","unit":1,"group":"겨울 아우터","shop":"롱패딩","pro":"롱 다운 코트","casual":["벤치파카"],"en":"Long puffer coat","same":"일부","diff":"무릎 아래까지 오는 패딩이에요. 영어로는 long puffer coat 또는 parka라고 해요.","meaning":"무릎 아래까지 내려오는 패딩이에요. 2017년 겨울에 크게 유행했어요.","look":"무릎 아래 기장, 후드, 긴 지퍼","priority":"A","evidence":"무신사 상품명 롱패딩 6, 롱 패딩 6; 표준국어대사전 패딩"},{"id":"fleece","unit":1,"group":"겨울 아우터","shop":"플리스","pro":"플리스 재킷","casual":["후리스"],"en":"Fleece jacket","same":"일부","diff":"후리스는 일본어 フリース를 거쳐 퍼진 말이고 같은 소재예요. 뽀글이는 고리 모양 곱슬털(보아) 플리스만 가리켜요.","meaning":"털처럼 보송한 폴리에스터 원단 재킷이에요. 흔히 '후리스'라고 해요.","look":"곱슬곱슬한 털 표면","confuse":["brushed","sherpafleecejacket"],"priority":"A","evidence":"무신사 상품명 플리스 45, 후리스 3; 뽀글이 17,151건(이름 1/60), 테디 790건(이름 59/60), 테디 플리스 85건, 후리스 16,502건(이름 3/60), 양털 18,113건, 표본 후리스 4"},{"id":"duffle","unit":1,"group":"겨울 아우터","shop":"더플코트","pro":"더플 코트","casual":["떡볶이 코트","토글 코트"],"en":"Duffle coat","same":"같음","meaning":"나무 토글 단추를 끈 고리에 거는 후드 코트예요. 단추 모양 때문에 떡볶이 코트라고 불러요.","look":"막대 모양 토글 단추와 끈 고리, 후드","priority":"A","evidence":"무신사 상품명 더플코트 25, 떡볶이 코트 0; 표준국어대사전 더플코트(표준대)"},{"id":"peacoat","unit":1,"group":"겨울 아우터","shop":"피코트","pro":"피 코트","casual":["해군 코트"],"en":"Peacoat","same":"같음","meaning":"단추가 두 줄인 짧은 해군 울 코트예요.","look":"두 줄 단추, 넓은 깃, 엉덩이 기장","priority":"A","evidence":"무신사 상품명 피코트 29; 표준국어대사전 피코트(표준대)"},{"id":"balmacaan","unit":1,"group":"겨울 아우터","shop":"발마칸 코트","pro":"발마칸 코트","casual":["발마칸","래글런 코트"],"en":"Balmacaan coat","same":"일부","diff":"발마칸은 래글런 소매에 약한 깃을 단 코트예요. 맥코트는 맥킨토시 방수 코트에서 온 것으로 겹치지만 같지는 않아요(추정).","meaning":"작은 깃에 래글런 소매인 품 넉넉한 코트예요.","look":"작은 깃, 래글런 소매, 숨은 단추","priority":"A","evidence":"무신사 상품명 발마칸 49"},{"id":"trench","unit":1,"group":"겨울 아우터","shop":"트렌치 코트","pro":"트렌치 코트","casual":["바바리","바바리 코트"],"en":"Trench coat","same":"다름","diff":"바바리는 영국 상표 버버리를 일본식으로 읽은 이름이고 트렌치코트가 일반 이름이에요. 2000년 국어 순화 때 트렌치코트로 부르자고 했어요. 버버리의 모든 코트가 트렌치는 아니에요.","meaning":"어깨 덮개와 허리 벨트가 있는 베이지 방수 코트예요. 한국에선 '바바리'라고도 해요.","look":"두 줄 단추, 허리 벨트, 어깨 견장","priority":"A","evidence":"무신사 상품명 트렌치 코트 17, 바바리 4; 표준국어대사전 바바리(Burberry, 표준대 등재), 트렌치코트(표준대)"},{"id":"shearling","unit":1,"group":"겨울 아우터","shop":"무스탕","pro":"시어링 재킷","casual":["시어링","무통"],"en":"Shearling jacket","same":"다름","diff":"무스탕은 한국에서만 쓰는 이름이고 영어로는 shearling이에요. 한국에서는 털이 붙은 가죽 옷을 모두 무스탕이라 하는데 원래는 양가죽에 양 function open(id, push = true) {
  const t = byId[id]; if (!t) return;
  const rows = [["쇼핑몰 이름", t.shop], ["정확한 이름", (t.pro || "").replace(/\s/g, "") !== t.shop.replace(/\s/g, "") ? t.pro : ""], ["편한 말", (t.casual || []).join(", ")], ["영어", t.en]].filter(r => r[1]);
  const ev = (t.evidence || "").split(/;\s*/).map(s => s.trim()).filter(Boolean);
  const pairs = (t.confuse || []).filter(c => byId[c]);
  $("#pane").innerHTML = `<button class="x" id="x">닫기</button>
    <div class="pu">${t.unit}. ${esc(U[t.unit])}, ${esc(t.group)}</div>
    <h2>${esc(name(t))}</h2>
    <p class="say">${esc(t.meaning)}</p>
    ${t.img ? `<div class="pic"><img src="img/${t.id}.webp" alt=""><a href="./#card/${t.id}">카드로 보기</a></div>` : ""}
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}${t.look ? `<dt>보는 곳</dt><dd>${esc(t.look)}</dd>` : ""}</dl>
    ${t.diff ? `<div class="box ${t.same === "다름" ? "d" : "p"}"><b>이름끼리 뜻이 ${t.same === "다름" ? "달라요" : "조금 달라요"}</b>${esc(t.diff)}</div>` : ""}
    ${pairs.length ? `<h3>헷갈리는 짝</h3><div class="pairs">${pairs.map(c => `<button data-t="${c}">${esc(name(byId[c]))}</button>`).join("")}</div>` : ""}
    ${ev.length ? `<h3>근거</h3><ul class="ev">${ev.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    <p class="meta">근거의 "38/60"은 2026년 11월 23일 무신사 인기 상품 60개 중 이름에 그 말이 든 개수예요.</p>`;
  $("#pane").hidden = false; $("#scrim").hidden = false; document.body.classList.add("sheet-open"); $("#pane").scrollTop = 0;
  if (push) history.replaceState(null, "", "#t/" + id);
}
function close() { $("#pane").hidden = true; $("#scrim").hidden = true; document.body.classList.remove("sheet-open"); history.replaceState(null, "", location.pathname); }
document.addEventListener("click", e => {
  const u = e.target.closest("[data-u]");
  if (u) { S.u = +u.dataset.u; document.querySelectorAll("[data-u]").forEach(b => b.setAttribute("aria-pressed", b === u)); draw(); return; }
  const sb = e.target.closest(".seg button");
  if (sb) { S[sb.parentElement.id] = sb.dataset.v; sb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sb)); draw(); return; }
  const t = e.target.closest("[data-t]"); if (t) { open(t.dataset.t); return; }
  if (e.target.closest("#x") || e.target.id === "scrim") close();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pane").hidden) close(); });
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); draw(); });
draw();
if (location.hash.startsWith("#t/")) open(location.hash.slice(3), false);
</script>
<script src="../hub/back.js" data-cat="study" defer></script>
