<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷 공부 용어</title>
<meta name="description" content="옷 공부 열한 단원의 용어를 쇼핑몰 이름, 전문 용어, 편한 말로 나눠 찾는 사전">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#121212; --sub:#5f5f5c; --faint:#9a9a96; --line:#e6e6e3;
  --paper:#ffffff; --tile:#f1f1ee; --diff:#b4441c; --part:#1f5fbf;
  --wrap:1180px; --gut:max(16px,4vw);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 "Pretendard Variable",Pretendard,system-ui,"Malgun Gothic",sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
[hidden]{display:none!important}
body.sheet-open #cu-home{display:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut);height:56px;display:flex;align-items:center;gap:28px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.04em;text-decoration:none;white-space:nowrap}
.tabs{display:flex;gap:22px;height:100%}
.tabs a{display:flex;align-items:center;height:100%;text-decoration:none;color:var(--faint);font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}

main{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut) 96px}
.lead{padding:28px 0 0}
.lead h1{margin:0;font-size:clamp(34px,6.4vw,64px);line-height:1.05;font-weight:800;letter-spacing:-.05em}
.lead h1 span{color:var(--faint);font-weight:300}
.lead p{margin:14px 0 0;max-width:40em;color:var(--sub);font-size:15px}

.useg{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin:26px 0 0;border-bottom:1px solid var(--line)}
.useg::-webkit-scrollbar{display:none}
.useg button{flex:none;padding:10px 0;font-size:15px;font-weight:600;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.useg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.useg small{font-size:12px;font-weight:500;margin-left:3px;font-variant-numeric:tabular-nums}

.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:14px 0 4px}
.tools input{font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);background:var(--paper);width:min(300px,100%)}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:7px 12px;font-size:14px;color:var(--sub)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.qbtn{font-size:14px;font-weight:700;padding:8px 14px;background:var(--ink);color:#fff}
.qo{display:grid;gap:8px;margin:18px 0 0}
.qo button{border:1px solid var(--line);padding:12px 14px;font-size:15px;line-height:1.5}
.qo button:hover{border-color:var(--ink)}
.qo button.ok{border-color:#17784a;background:#eaf5ef}
.qo button.no{border-color:#c4302b;background:#fbecec}
.qnext{margin-top:16px;font-weight:700;padding:10px 18px;background:var(--ink);color:#fff}
.n{margin-left:auto;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}

.grp{padding-top:30px}
.grp h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.04em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px}
.t{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%}
.th{grid-row:1/3;grid-column:1;width:42px;aspect-ratio:3/4;background:var(--tile);overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.t:hover .tn{text-decoration:underline;text-underline-offset:4px}
.tn{grid-column:2;align-self:end;font-size:17px;font-weight:700;letter-spacing:-.03em}
.tn small{font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.tm{grid-column:2;align-self:start;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pr{font-size:12px;font-weight:800;color:var(--faint)}
.pr.A{color:var(--ink)}
.df{font-size:11px;font-weight:700;padding:1px 5px;border:1px solid currentColor}
.df.d{color:var(--diff)}.df.p{color:var(--part)}
.empty{padding:48px 0;color:var(--sub)}

/* 자세히 */
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.35);z-index:45}
.pane{position:fixed;z-index:50;background:#fff;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:min(86vh,860px);overflow-y:auto;overscroll-behavior:contain;padding:22px 30px 30px;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.18)}
body.sheet-open{overflow:hidden}
.x{position:sticky;top:0;float:right;font-size:14px;font-weight:600;color:var(--sub);padding:6px 0 6px 12px;background:#fff}
.pu{font-size:13px;color:var(--sub);font-weight:600}
.pane h2{margin:6px 0 0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.05em}
.pane .say{margin:12px 0 0;font-size:17px;line-height:1.6}
.pic{margin:16px 0 0;display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:end}
.pic img{width:150px;aspect-ratio:3/4;object-fit:cover;background:var(--tile)}
.pic a{font-size:14px;font-weight:600}
dl{margin:20px 0 0;display:grid;grid-template-columns:5.5em 1fr;gap:8px 14px;font-size:15px}
dt{color:var(--faint);font-size:13px;padding-top:2px}
dd{margin:0}
.box{margin:18px 0 0;padding:14px 16px;background:var(--tile);font-size:15px;line-height:1.6}
.box b{display:block;font-size:13px;margin-bottom:4px}
.box.d b{color:var(--diff)}.box.p b{color:var(--part)}
.pane h3{margin:24px 0 8px;font-size:13px;color:var(--faint);font-weight:600}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pairs button{font-size:14px;padding:4px 10px;border:1px solid var(--line)}
.pairs button:hover{border-color:var(--ink)}
.ev{margin:0;padding:0 0 0 18px;font-size:13px;color:var(--sub);line-height:1.6}
.ev li+li{margin-top:4px}
.meta{margin:18px 0 0;font-size:12px;color:var(--faint)}

@media (max-width:760px){
  .pane{max-height:82vh;padding:16px 20px 24px}
  .pic{grid-template-columns:120px 1fr}.pic img{width:120px}
  .pane h2{font-size:28px}
  .list{grid-template-columns:1fr}
  .tools .n{margin-left:0}
}
@media (max-width:560px){
  .top-in{gap:16px}.tabs{gap:14px}
}
</style>
<style>
/* 디자인 2판 머리 (11-24) */
:root{--ink:#111;--sub:#4b4b48;--faint:#8a8a86;--line:#ebebe8;--tile:#f4f4f1;--tile2:#e9e9e5;--wrap:1280px;--gut:max(16px,3.2vw)}
.top{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
.top-in{height:64px;gap:36px}
.brand{font-size:20px}
.tabs{gap:28px}
.tabs a{font-size:16px;color:var(--faint)}
.tabs a svg{display:none}
.tabs a:hover{color:var(--ink)}
.top-x{margin-left:auto;display:flex;gap:18px;flex:none}
.top-x a{font-size:14px;font-weight:600;color:var(--sub);text-decoration:none}
.snav-wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
.snav{display:flex;gap:6px;padding-top:20px;overflow-x:auto;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav a{flex:none;display:inline-flex;align-items:center;height:38px;padding:0 15px;background:var(--tile);color:var(--sub);font-size:15px;font-weight:600;text-decoration:none}
.snav a:hover{background:var(--tile2);color:var(--ink)}
.snav a[aria-current="true"]{background:var(--ink);color:#fff}
@media (max-width:860px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .top-in{height:54px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
  .tabs a{flex-direction:column;justify-content:center;gap:3px;height:62px;margin:0;border:0;font-size:12px;font-weight:600}
  .tabs a svg{display:block;width:23px;height:23px}
  .tabs a[aria-current="page"]{color:var(--ink)}
  html body #cu-home{--lift:66px}
  .snav{padding-top:14px}
}
@media (max-width:560px){.top-x a:last-child{display:none}}
/* 뜻 맞히기: 문제, 주어진 말 구분 + 팝업 나타남 (11-24) */
.pane h2.qq{font-size:24px;letter-spacing:-.04em}
.q-clue{margin:14px 0 18px;padding:2px 0 4px 16px;border-left:3px solid var(--ok,#1f7a4d)}
.q-clue b{display:block;font-size:12px;font-weight:700;color:var(--ok,#1f7a4d);letter-spacing:.08em;margin-bottom:6px}
.q-clue p{margin:0;font-family:"Nanum Myeongjo","AppleMyungjo","Noto Serif KR","Batang",serif;font-size:18px;line-height:1.65;font-weight:500;color:#33332f}
.q-clue.nm p{font-family:inherit;font-size:28px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
@keyframes pin{from{opacity:0;transform:translate(-50%,-47%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fin{from{opacity:0}to{opacity:1}}
.pane:not([hidden]){animation:pin .2s cubic-bezier(.2,.7,.2,1)}
.scrim:not([hidden]){animation:fin .16s ease-out}
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
@media (prefers-reduced-motion:reduce){.pane:not([hidden]),.scrim:not([hidden]){animation:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="./#start">옷 공부</a>
  <nav class="tabs" aria-label="화면"><a href="./#start"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>홈</span></a><a href="./#book" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>도감</span></a><a href="./#codi"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a2 2 0 1 1 2-2M12 7v2L3 16h18l-9-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>코디</span></a><a href="./#care"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0zM12 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>입고 관리</span></a><a href="./#quiz/mix"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>퀴즈</span></a></nav>
  <nav class="top-x" aria-label="더 보기"><a href="terms.html">용어 사전</a><a href="plan.html">계획</a></nav>
</div></header>
<div class="snav-wrap"><nav class="snav" aria-label="이 묶음"><a href="./#book">카드 도감</a><a href="./#cmp">나란히 비교</a><a href="./#mat">재질</a><a href="terms.html" aria-current="true">용어 사전</a></nav></div>
<main>
  <div class="lead">
    <h1>용어 <b id="tot"></b>개 <span>/ 11단원</span></h1>
    <p>쇼핑몰에 적힌 이름, 정확한 이름, 사람들이 편하게 부르는 이름을 나눴어요. 뜻이 조금 다른 것은 <b style="color:var(--part)">일부</b>, 아예 다른 것은 <b style="color:var(--diff)">다름</b>으로 표시했어요. 누르면 차이와 근거가 나와요.</p>
  </div>
  <nav class="useg" id="units" aria-label="단원"></nav>
  <div class="tools">
    <input id="q" type="search" placeholder="이름으로 찾기: 가디건, 시보리, 야상" aria-label="이름으로 찾기" autocomplete="off">
    <div class="seg" id="pr" role="group" aria-label="중요도"><button data-v="" aria-pressed="true">전체</button><button data-v="A" aria-pressed="false">자주 보는 말</button></div>
    <div class="seg" id="df" role="group" aria-label="뜻"><button data-v="" aria-pressed="true">전체</button><button data-v="x" aria-pressed="false">이름끼리 뜻이 다른 것</button></div>
    <button class="qbtn" id="qstart">뜻 맞히기 10문제</button>
    <span class="n" id="n"></span>
  </div>
  <div id="out"></div>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="pane" id="pane" hidden aria-label="용어 자세히"></aside>
<script>
const D = [{"id":"tee","unit":1,"group":"상의","shop":"반팔 티셔츠","pro":"반팔 티셔츠(반소매 티셔츠)","casual":["반팔티","티","반팔","숏슬리브","티셔츠","라운드티"],"en":"T-shirt","same":"같음","meaning":"목이 둥글고 소매가 짧은 저지 상의예요.","look":"단추 없는 둥근 목, 팔꿈치 위에서 끝나는 소매","confuse":["threequartersleevelength"],"priority":"A","evidence":"무신사 상품명 반팔 티셔츠 8, 반팔티 11; 표준국어대사전 티셔츠; 무신사 반팔(14/60), 반소매(4/60)","img":1},{"id":"sweatshirt","unit":1,"group":"상의","shop":"맨투맨","pro":"스웨트셔츠(스웻셔츠)","casual":["맨투맨 티","쭈리 티"],"en":"Sweatshirt","same":"일부","diff":"영어 sweatshirt는 후드, 지퍼, V넥까지 포함하는 넓은 말이에요. 한국 맨투맨은 보통 크루넥 풀오버만 가리키고 한국에서만 통해요.","meaning":"안쪽이 보송한 두꺼운 스웨트 원단의 크루넥 상의예요. '맨투맨'은 한국에서 붙은 이름이고 영어로는 스웨트셔츠예요.","look":"목, 소매 끝, 밑단의 골지","priority":"A","evidence":"무신사 상품명 맨투맨 28, 스웨트셔츠 8, 스웻셔츠 9","img":1},{"id":"hoodie","unit":1,"group":"상의","shop":"후드티","pro":"후디","casual":["후드"],"en":"Hoodie","same":"일부","diff":"후드티는 후드와 티를 붙인 한국식 말이에요. 영어 hoodie는 풀오버뿐 아니라 지퍼형도 포함해요.","meaning":"모자가 달린 스웨트 상의예요. 배 앞에 큰 주머니가 있는 게 많아요.","look":"모자, 배 앞의 캥거루 주머니","confuse":["zipup"],"priority":"A","evidence":"무신사 상품명 후드티 17, 후디 11, 후드 38; 표준국어대사전 후드(hood)만 등재","img":1},{"id":"zipup","unit":1,"group":"상의","shop":"후드집업","pro":"지퍼 후디","casual":["후드짚업","집업","집업 후디"],"en":"Zip-up hoodie","same":"같음","meaning":"앞을 지퍼로 끝까지 여는 후드티예요.","look":"목에서 밑단까지 이어진 지퍼","confuse":["hoodie","knitzipup"],"priority":"A","evidence":"무신사 상품명 후드집업 35, 후드 집업 35, 집업 36; 무신사 후드집업 28,815(35/60)","img":1},{"id":"bustiertop","unit":1,"group":"상의","shop":"뷔스티에","pro":"뷔스티에","casual":["비스티에"],"en":"Bustier top","same":"같음","meaning":"가슴과 허리를 감싸 꼭 맞는 코르셋풍 상의예요. 어깨끈이 없거나 가는 것이 많아요.","look":"허리까지 꼭 맞는 몸판, 뒤쪽 끈이나 지퍼","priority":"A","evidence":"무신사 4,850(26/60)"},{"id":"poloshirt","unit":1,"group":"상의","shop":"폴로 셔츠","pro":"폴로 셔츠","casual":["피케 셔츠","카라티","피케 티","PK 티셔츠"],"en":"Polo shirt","same":"일부","diff":"폴로 셔츠는 칼라 아래 단추 2~3개가 달린 피케 면 상의이고 카라티는 같은 옷을 부르는 일상 말이에요. 니트 폴로는 소재가 니트라서 다른 카드예요.","meaning":"목에 칼라와 짧은 단추 줄이 있는 피케 면 상의예요.","look":"칼라 아래 단추 2~3개","confuse":["knitpolo","he ","meaning":"무릎 아래까지 내려오는 패딩이에요. 2017년 겨울에 크게 유행했어요.","look":"무릎 아래 기장, 후드, 긴 지퍼","priority":"A","evidence":"무신사 상품명 롱패딩 6, 롱 패딩 6; 표준국어대사전 패딩","img":1},{"id":"fleece","unit":1,"group":"겨울 아우터","shop":"플리스","pro":"플리스 재킷","casual":["후리스"],"en":"Fleece jacket","same":"일부","diff":"후리스는 일본어 フリース를 거쳐 퍼진 말이고 같은 소재예요. 뽀글이는 고리 모양 곱슬털(보아) 플리스만 가리켜요.","meaning":"털처럼 보송한 폴리에스터 원단 재킷이에요. 흔히 '후리스'라고 해요.","look":"곱슬곱슬한 털 표면","confuse":["brushed","sherpafleecejacket"],"priority":"A","evidence":"무신사 상품명 플리스 45, 후리스 3; 뽀글이 17,151건(이름 1/60), 테디 790건(이름 59/60), 테디 플리스 85건, 후리스 16,502건(이름 3/60), 양털 18,113건, 표본 후리스 4","img":1},{"id":"duffle","unit":1,"group":"겨울 아우터","shop":"더플코트","pro":"더플 코트","casual":["떡볶이 코트","토글 코트"],"en":"Duffle coat","same":"같음","meaning":"나무 토글 단추를 끈 고리에 거는 후드 코트예요. 단추 모양 때문에 떡볶이 코트라고 불러요.","look":"막대 모양 토글 단추와 끈 고리, 후드","priority":"A","evidence":"무신사 상품명 더플코트 25, 떡볶이 코트 0; 표준국어대사전 더플코트(표준대)","img":1},{"id":"peacoat","unit":1,"group":"겨울 아우터","shop":"피코트","pro":"피 코트","casual":["해군 코트"],"en":"Peacoat","same":"같음","meaning":"단추가 두 줄인 짧은 해군 울 코트예요.","look":"두 줄 단추, 넓은 깃, 엉덩이 기장","priority":"A","evidence":"무신사 상품명 피코트 29; 표준국어대사전 피코트(표준대)","img":1},{"id":"balmacaan","unit":1,"group":"겨울 아우터","shop":"발마칸 코트","pro":"발마칸 코트","casual":["발마칸","래글런 코트"],"en":"Balmacaan coat","same":"일부","diff":"발마칸은 래글런 소매에 약한 깃을 단 코트예요. 맥코트는 맥킨토시 방수 코트에서 온 것으로 겹치지만 같지는 않아요(추정).","meaning":"작은 깃에 래글런 소매인 품 넉넉한 코트예요.","look":"작은 깃, 래글런 소매, 숨은 단추","priority":"A","evidence":"무신사 상품명 발마칸 49","img":1},{"id":"trench","unit":1,"group":"겨울 아우터","shop":"트렌치 코트","pro":"트렌치 코트","casual":["바바리","바바리 코트"],"en":"Trench coat","same":"다름","diff":"바바리는 영국 상표 버버리를 일본식으로 읽은 이름이고 트렌치코트가 일반 이름이에요. 2000년 국어 순화 때 트렌치코트로 부르자고 했어요. 버버리의 모든 코트가 트렌치는 아니에요.","meaning":"어깨 덮개와 허리 벨트가 있는 베이지 방수 코트예요. 한국에선 '바바리'라고도 해요.","look":"두 줄 단추, 허리 벨트, 어깨 견장","priority":"A","evidence":"무신사 상품명 트렌치 코트 17, 바바리 4; 표준국어대사전 바바리(Burberry, 표준대 등재), 트렌치코트(표준대)","img":1},{"id":"shearling","unit":1,"group":"겨울 아우터","shop":"무스탕","pro":"시어링 재킷","casual":["시어링","무통"],"en":"Shearling jacket","same":"다름","diff":"무스탕은 한국에서만 쓰는 이름이고 영어로는 shearling이에요. 한국에서는 털이 붙은 가죽 옷을 모두 무스탕이라 하는데 원래는 양가죽에 양털이 붙은 옷이에요. 어원 설은 둘(P-51 무스탕, 프랑스어 mouton)이고 확정하지 못했어요.","meaning":"안쪽에 양털이 붙은 가죽 재킷이에요. 흔히 '무스탕'이라고 불러요.","look":"깃과 소매 끝으로 나온 털","priority":"A","evidence":"무신사 상품명 무스탕 29, 시어링 0(검색 총 807), 양털 자켓 0; 표준국어대사전 무스탕(표준대는 야생마 뜻만), 시어링(표준대: 전단 가공)","img":1},{"id":"pufferjacket","unit":1,"group":"겨울 아우터","shop":"푸퍼 패딩","pro":"푸퍼 패딩","casual":["푸퍼","숏 푸퍼","하이넥 푸퍼"],"en":"Puffer jacket","same":"같음","meaning":"부풀린 짧은 패딩이에요. 퍼프(복어)에서 온 말이에요.","look":"몸통이 둥글게 부풀고 기장이 허리 근처","confuse":["lightdown","puffer"],"priority":"A","evidence":"무신사 푸퍼 2,373(42/60), 숏푸퍼 1,734. 커뮤니티 에펨코리아 푸퍼 글. 29CM 하이넥 숏 푸퍼 패딩(검색 결과)"},{"id":"sherpafleecejacket","unit":1,"group":"겨울 아우터","shop":"뽀글이","pro":"뽀글이","casual":["양털 후리스","테디 후리스","보아 후리스","보아 자켓","양털 플리스"],"en":"Sherpa fleece jacket (bbogeuri)","same":"같음","meaning":"곱슬한 양털 모양 인조 털 점퍼예요.","look":"겉감이 뽀글뽀글한 털","confuse":["boa","fleece"],"priority":"A","evidence":"무신사 뽀글이 17,152(1/60). 무신사 아우터 카테고리 이름이 \"플리스/뽀글이\"(2026-11-23 확인). 더쿠 글에서도 양털 재킷의 별명으로 쓰임; 뽀글이 17,151건(이름 1/60), 테디 790건(이름 59/60), 테디 플리스 85건, 후리스 16,502건(이름 3/60), 양털 18,113건, 표본 후리스 4"},{"id":"parka","unit":1,"group":"겨울 아우터","shop":"파카","pro":"파카","casual":["M-51","후드 점퍼"],"en":"Parka","same":"일부","diff":"한국에서는 후드 달린 방한 점퍼를 파카라고 하고 야상(필드 재킷)과 겹쳐 써요.","meaning":"후드가 달린 긴 방한 겉옷이에요.","look":"털 테두리 후드, 허벅지까지 오는 기장","priority":"A","evidence":"무신사 파카 19,403; 파카 1(총 19403)"},{"id":"nuptse","unit":1,"group":"겨울 아우터","shop":"눕시","pro":"눕시 재킷","casual":["노스페이스 눕시","레트로 눕시","1996 눕시"],"en":"Nuptse jacket","same":"같음","diff":"푸퍼는 부푼 패딩 전체를 부르는 말이고 눕시는 노스페이스가 1992년에 낸 대표 모델 이름이에요. 가로 퀼팅과 어깨 배색이 특징이에요.","meaning":"노스페이스의 대표 부푼 패딩 모델 이름이에요. 큼직한 가로 칸과 짧은 기장이에요.","look":"굵은 가로 퀼팅, 어깨와 몸통의 두 가지 색, 서 있는 목, 짧은 기장","priority":"A","evidence":"무신사 눕시 60/60(상위 60개 상품명 전부); 신아일보 기사(1992년 출시, 대표 상품), 에펨코리아 눕시 글 댓글"},{"id":"woolcoat","unit":1,"group":"겨울 아우터","sh     ${ev.length ? `<h3>근거</h3><ul class="ev">${ev.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
    <p class="meta">근거의 "38/60"은 2026년 11월 23일 무신사 인기 상품 60개 중 이름에 그 말이 든 개수예요.</p>`;
  $("#pane").hidden = false; $("#scrim").hidden = false; document.body.classList.add("sheet-open"); $("#pane").scrollTop = 0;
  if (push) history.replaceState(null, "", "#t/" + id);
}
/* 뜻 맞히기: 그림이 아직 없는 용어도 이름과 뜻으로 익히기. 지금 고른 단원과 거르기 안에서 냄 */
let QZ = null;
const shuf = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function qStart() {
  const pool = D.filter(hit);
  if (pool.length < 4) return;
  QZ = { list: shuf(pool.slice()).slice(0, 10).map(t => {
    const near = shuf(D.filter(x => x.id !== t.id && x.unit === t.unit && x.meaning !== t.meaning)).slice(0, 3);
    return { t, ask: Math.random() < 0.5 ? "name" : "mean", ops: shuf([t, ...near]) };
  }), i: 0, right: 0 };
  qShow();
}
function qShow() {
  const pane = $("#pane");
  if (QZ.i >= QZ.list.length) {
    pane.innerHTML = `<button class="x" id="x">닫기</button><div class="pu">뜻 맞히기</div><h2>${QZ.list.length}문제 중 ${QZ.right}개</h2><p class="say">틀린 말은 목록에서 눌러 차이와 근거를 다시 볼 수 있어요.</p><button class="qnext" id="qagain">새로 10문제</button>`;
  } else {
    const q = QZ.list[QZ.i];
    pane.innerHTML = `<button class="x" id="x">닫기</button><div class="pu">뜻 맞히기 ${QZ.i + 1} / ${QZ.list.length}</div>
      <h2 class="qq">${q.ask === "name" ? "이 말의 뜻은 무엇일까요?" : "이 뜻을 가진 이름은 무엇일까요?"}</h2><div class="q-clue${q.ask === "name" ? " nm" : ""}"><b>${q.ask === "name" ? "용어" : "뜻"}</b><p>${esc(q.ask === "name" ? name(q.t) : q.t.meaning)}</p></div>
      <div class="qo">${q.ops.map(o => `<button data-qo="${o.id}">${esc(q.ask === "name" ? o.meaning : name(o))}</button>`).join("")}</div><div id="qfb"></div>`;
  }
  pane.hidden = false; $("#scrim").hidden = false; document.body.classList.add("sheet-open"); pane.scrollTop = 0;
}
function qAnswer(id) {
  const q = QZ.list[QZ.i]; if (q.done) return; q.done = true;
  const ok = id === q.t.id; if (ok) QZ.right++;
  document.querySelectorAll("[data-qo]").forEach(b => { if (b.dataset.qo === q.t.id) b.classList.add("ok"); else if (b.dataset.qo === id) b.classList.add("no"); });
  const other = (q.t.casual || []).slice(0, 3).join(", ");
  const bat = s => { const c = (s || "").charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 > 0; };
  const lastO = (q.t.casual || []).slice(0, 3).at(-1) || "";
  $("#qfb").innerHTML = `<p class="say">${ok ? "맞았어요." : `정답은 ${esc(name(q.t))}${bat(name(q.t)) ? "이에요" : "예요"}.`} ${other ? `편한 말로 ${esc(other)}${bat(lastO) ? "이라고도" : "라고도"} 해요.` : ""}</p><button class="qnext" id="qnext">${QZ.i + 1 < QZ.list.length ? "다음" : "결과 보기"}</button>`;
}
function close() { $("#pane").hidden = true; $("#scrim").hidden = true; document.body.classList.remove("sheet-open"); history.replaceState(null, "", location.pathname); }
document.addEventListener("click", e => {
  const u = e.target.closest("[data-u]");
  if (u) { S.u = +u.dataset.u; document.querySelectorAll("[data-u]").forEach(b => b.setAttribute("aria-pressed", b === u)); draw(); return; }
  const sb = e.target.closest(".seg button");
  if (sb) { S[sb.parentElement.id] = sb.dataset.v; sb.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === sb)); draw(); return; }
  if (e.target.id === "qstart" || e.target.id === "qagain") { qStart(); return; }
  const qo = e.target.closest("[data-qo]"); if (qo) { qAnswer(qo.dataset.qo); return; }
  if (e.target.id === "qnext") { QZ.i++; qShow(); return; }
  const t = e.target.closest("[data-t]"); if (t) { open(t.dataset.t); return; }
  if (e.target.closest("#x") || e.target.id === "scrim") close();
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pane").hidden) close(); });
$("#q").addEventListener("input", e => { S.q = e.target.value.trim(); draw(); });
draw();
if (location.hash.startsWith("#t/")) open(location.hash.slice(3), false);
</script>
