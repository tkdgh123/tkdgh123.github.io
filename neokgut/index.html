<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>넋굿</title>
<meta name="description" content="동양풍 3D 로그라이트 넋굿 — 기획 도록과 개발 영상">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap">
<style>
/* 기획 도록·개발 영상을 한 주소에서 탭으로. 도록은 plan.html, 영상은 videos/ 그대로 (마디 탭 페이지와 같은 짜임, 빛깔은 도록의 한지·먹) */
:root { --paper: #ECE8DF; --ink: #1D1B20; --ink-2: #5C5761; --rule: #CDC5B6; --accent: #23395B; --ui: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #15161B; --ink: #E9E4DA; --ink-2: #A59FA8; --rule: #33353F; --accent: #9DB4E0; color-scheme: dark } }
:root[data-theme="dark"] { --paper: #15161B; --ink: #E9E4DA; --ink-2: #A59FA8; --rule: #33353F; --accent: #9DB4E0; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; height: 100% }
body { background: var(--paper); color: var(--ink); font: 14px var(--ui); display: flex; flex-direction: column; overflow: hidden }
nav { flex: none; display: flex; align-items: center; gap: 4px 18px; height: 44px; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--rule) }
nav a { color: var(--ink-2); text-decoration: none; margin-right: auto; white-space: nowrap }
nav a:hover { color: var(--ink) }
nav button { font: inherit; color: var(--ink-2); background: none; border: 0; height: 100%; padding: 0 4px; cursor: pointer; box-shadow: inset 0 -2px 0 transparent; white-space: nowrap }
nav button[aria-pressed="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent) }
nav button:hover { color: var(--ink) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
iframe { flex: 1; width: 100%; border: 0; display: block; background: var(--paper) }
iframe[hidden] { display: none }
</style>
</head>
<body>
<nav aria-label="넋굿">
  <a href="../#game">← 창업실</a>
  <button type="button" data-v="plan" data-src="plan.html" aria-pressed="true">기획 도록</button>
  <button type="button" data-v="video" data-src="videos/" aria-pressed="false">개발 영상</button>
</nav>
<iframe id="f-plan" title="넋굿 기획 도록" hidden></iframe>
<iframe id="f-video" title="넋굿 개발 영상" hidden></iframe>
<script>
// 처음 연 탭에만 주소 뒤쪽(#절 이름 등)을 넘기고, 다른 탭은 처음 누를 때 불러옴
const tabs = [...document.querySelectorAll("nav button")];
const q = new URLSearchParams(location.search), first = q.get("v");
q.delete("v");
function show(v, rest = "") {
  for (const t of tabs) {
    const on = t.dataset.v === v, f = document.getElementById("f-" + t.dataset.v);
    t.setAttribute("aria-pressed", on);
    if (on && !f.getAttribute("src")) f.src = t.dataset.src + rest;
    f.hidden = !on;
  }
}
show(tabs.some(t => t.dataset.v === first) ? first : tabs[0].dataset.v, (q.size ? "?" + q : "") + location.hash);
for (const t of tabs) t.addEventListener("click", () => {
  show(t.dataset.v);
  history.replaceState(null, "", t === tabs[0] ? location.pathname : "?v=" + t.dataset.v);
});
</script>
</body>
</html>
