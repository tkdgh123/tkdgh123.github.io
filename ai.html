 o:[["Accept a bad move with some probability, and lower that probability over time, so the search can climb out of a local optimum.","나쁜 이동을 어떤 확률로 받아들이되 그 확률을 시간에 따라 낮춘다 → 지역 최적을 빠져나올 수 있다."],
    ["It is first-choice stochastic hill climbing plus a rule that accepts some bad moves, less often as the search goes on.","first-choice 확률적 언덕 오르기 + '나쁜 이동을 점점 덜 받아들이는' 규칙이다."],
    ["A bad move is accepted with probability exp(-ΔE / T); the annealing schedule lowers temperature T over time.","나쁜 이동은 확률 exp(-ΔE / T)로 수용; 담금질 일정(schedule)이 온도 T를 시간에 따라 낮춘다."]],
 x:"이름은 금속·유리를 천천히 식혀 결정을 안정시키는 <b>annealing</b>(담금질)에서 왔습니다. 좋은 이동은 항상 수용하고, 나쁜 이동(ΔE만큼 나빠짐)은 <code>exp(-ΔE / T)</code>의 확률로 수용합니다. 처음엔 T가 높아 거의 다 받아 자유롭게 돌아다니고, T가 낮아질수록 나쁜 이동을 거의 안 받아 봉우리에 정착합니다.",
 e:"조금 나빠지는 이동도 가끔 허용해 '옆 산으로 넘어갈' 틈을 줍니다. 식을수록 그 관용이 줄어 결국 한 봉우리에 자리 잡습니다."},
{s:"4-1",im:["4-1-16","4-1-17"],en:"Temperature and Cooling Schedules",ko:"온도와 냉각 일정",
 o:[["Accept-worse probability is exp(-ΔE / T). High T: nearly flat curve, almost anything accepted. Low T: only a very small loss accepted.","나쁜 상태 수용 확률 = exp(-ΔE / T). 높은 T: 곡선이 거의 평평 → 거의 다 수용. 낮은 T: 아주 작은 손해만 수용."],
    ["Classic: T(t) = T0 / log(1+t). Exponential (Kirkpatrick 1983): T(t) = T0·a^t, 0.8<a<1. Fast (Szu 1987): T(t) = T0 / (1+t).","고전: T0/log(1+t). 지수적: T0·a^t (0.8<a<1). 빠른: T0/(1+t)."],
    ["Choose T0 so almost any move is accepted at t=0; stop when T falls below a small constant. Best schedule found by trial and error.","t=0에서 거의 다 수용되게 T0을 고르고, T가 작은 상수 밑으로 떨어지면 멈춤. 최적 일정은 시행착오로."]],
 x:"온도 T는 '얼마나 나쁜 이동까지 봐줄지'를 조절하는 손잡이입니다. 너무 빨리 식으면 지역 최적에 갇히고, 너무 천천히 식으면 오래 걸립니다. 그래서 실무에서는 좋은 냉각 일정을 실험으로 찾습니다."},
{s:"4-1",im:["4-1-18"],en:"Properties of Simulated Annealing",ko:"담금질 모사의 성질",
 o:[["If the temperature falls slowly enough, simulated annealing finds the global optimum.","온도가 충분히 천천히 내려가면 담금질 모사는 전역 최적을 찾는다."],
    ["But in practice that guarantee usually takes far too long, and both the schedule and the local move must be found experimentally.","하지만 실무에서 그 보장은 보통 너무 오래 걸리고, 일정과 이동 방식 둘 다 실험으로 찾아야 한다."]],
 x:"이론적으로는 '아주 천천히 식히면 전역 최적 보장'이지만, 그 '천천히'가 실용적이지 않을 만큼 느립니다. 그래서 현실에서는 적당한 일정으로 '충분히 좋은' 해를 노립니다."},
{s:"4-1",im:["4-1-19"],en:"Local Beam Search",ko:"지역 빔 탐색",key:1,
 o:[["Follows k states at once rather than one, starting from k random states (k = beam width).","한 상태가 아니라 k개 상태를 동시에 따라간다. k개 무작위 상태에서 시작(k = 빔 폭)."],
    ["Each step: generate ALL successors of the k states, keep the best k of all of them, repeat.","매 단계: k개 상태의 후계를 전부 만들어, 그중 가장 좋은 k개만 남기고 반복."],
    ["More efficient than random restart (information is shared across the k states); k too small → collapses to a local optimum; k too large → approaches exhaustive search.","무작위 재시작보다 효율적(k개가 정보를 공유). k가 너무 작으면 지역 최적으로 붕괴, 너무 크면 완전 탐색에 가까워 비효율."]],
 x:"random restart는 k번을 '따로따로' 돌리지만, local beam search는 k개를 '함께' 돌리며 매 단계 전체에서 best k를 고릅니다. 좋은 쪽에 자원이 몰리는 효과(= 서로 communicate)가 있습니다. 이 '여러 상태를 병렬로'는 2장 다중 에이전트의 정보 공유와 같은 발상입니다."},
{s:"4-1",im:["4-1-20"],en:"Genetic Algorithms",ko:"유전 알고리즘",key:1,
 o:[["Population-based optimization using mechanisms from biological evolution.","생물 진화의 메커니즘을 빌린 개체군(population) 기반 최적화."],
    ["Reproduction: select at random weighted by a fitness function. Crossover: recombine two parents at a random point. Mutation: change a random position. Repeat for many generations.","재생산: 적합도(fitness)에 비례해 무작위 선택 · 교차(crossover): 두 부모를 임의 지점에서 재조합 · 돌연변이(mutation): 임의 위치를 바꿈 · 여러 세대 반복."]],
 x:"상태를 '유전자 문자열'로 보고, 좋은 상태(높은 fitness)끼리 섞어(crossover) 새 상태를 만들고 가끔 변이를 줍니다. local beam search를 '상태를 쪼개 재조합하는' 버전으로 확장한 것으로 볼 수 있습니다. 8-퀸이면 각 열 퀸의 행 번호 8자리가 유전자입니다.",
 e:"부모 배치 둘을 중간에서 잘라 앞·뒤를 바꿔 자식 배치를 만들고, 한 열을 무작위로 바꿔(변이) 다양성을 유지합니다."},
{s:"4-1",im:["4-1-21"],en:"Local Search in Continuous Spaces",ko:"연속 공간에서의 지역 탐색",key:1,
 o:[["Most real optimization problems live in a continuous space: the state is a vector of real numbers, not one of a finite set.","대부분의 실제 최적화는 연속 공간: 상태가 유한 집합의 원소가 아니라 실수 벡터다."],
    ["There is no finite list of successors to enumerate, so hill climbing as stated does not apply.","나열할 유한한 후계 목록이 없어, 앞서의 언덕 오르기를 그대로는 쓸 수 없다."]],
 x:"지금까지는 이웃이 유한 개(퀸을 옮기는 경우의 수)였습니다. 연속 공간에서는 상태가 <code>x = (x1, x2, …, xk)</code> 같은 실수 벡터라 이웃이 무한히 많습니다. 그래서 '모든 이웃을 만들어 비교'가 불가능하고, 다음 슬라이드들의 세 가지 방법이 필요합니다."},
{s:"4-1",im:["4-1-22","4-1-23"],en:"Method 1 — Discretization",ko:"방법 1 — 이산화",
 o:[["Lay a grid of spacing δ over the space; the neighbors of a point are the adjacent grid cells.","공간에 간격 δ의 격자(grid)를 깔면, 한 점의 이웃은 인접 격자 칸이다."],
    ["Once the grid is applied the (continuous) problem becomes an ordinary graph search from initial to goal.","격자를 적용하면 (연속) 문제가 초기→목표의 평범한 그래프 탐색이 된다."]],
 x:"연속 공간을 '칸'으로 쪼개면(discretize) 다시 3장의 그래프 탐색 문제가 됩니다. 간격 δ가 작을수록 정밀하지만 칸(=상태)이 많아집니다. 미로 예시처럼 실제로는 연속이어도 격자를 씌우면 보통의 탐색으로 풉니다."},
{s:"4-1",im:["4-1-24"],en:"Three Ways to Handle a Continuous Space",ko:"연속 공간을 다루는 세 가지 방법",
 o:[["1. Discretize it — define a grid with increment δ and use any discrete algorithm.","1. 이산화 — 간격 δ 격자를 정의하고 이산 알고리즘을 쓴다."],
    ["2. Random perturbations to the state — hill climbing with simulated annealing.","2. 상태에 무작위 섭동 — 담금질 모사를 곁들인 언덕 오르기."],
    ["3. Continuous, analytic methods — compute gradients to extrapolate the local curvature.","3. 연속·해석적 방법 — 기울기(gradient)를 계산해 국소 곡률을 추정."]],
 x:"요약 슬라이드입니다. (1) 격자로 쪼개기, (2) 무작위로 흔들어 보기, (3) 미분(기울기)으로 방향 정하기. 다음 슬라이드의 경사 하강이 (3)입니다."},
{s:"4-1",im:["4-1-25"],en:"Gradient Descent and Newton-Raphson",ko:"경사 하강과 뉴턴-랩슨",key:1,
 o:[["State: a vector x = (x1,…,xk); infinite state space; objective min f(x).","상태: 벡터 x = (x1,…,xk) · 상태 공간 무한 · 목적 min f(x)."],
    ["Gradient descent with step size α: x ← x - α·∇f(x).","보폭 α의 경사 하강: x ← x - α·∇f(x)."],
    ["Newton-Raphson uses the inverse Hessian as an optimal step size: x ← x - H⁻¹∇f(x).","뉴턴-랩슨은 헤시안 역행렬을 최적 보폭으로 사용: x ← x - H⁻¹∇f(x)."],
    ["In a non-convex space both still get trapped in a local optimum; simulated annealing or momentum is used to escape.","비볼록 공간에서는 둘 다 지역 최적에 갇힘; 담금질/모멘텀으로 탈출한다."]],
 x:"기울기 ∇f는 '가장 가파르게 오르는 방향'이라, 최소화에서는 그 반대로 한 발(-α·∇f) 내딛습니다. 이것이 연속 공간판 언덕 오르기이고, 머신러닝 학습의 핵심입니다. 보폭 α가 크면 발산, 작으면 느립니다. 봉우리가 많으면(비볼록) 여전히 지역 최적에 갇혀, 담금질·모멘텀으로 빠져나옵니다."},
{s:"4-1",im:["4-1-26"],en:"Example: Siting Airports in Romania",ko:"예: 루마니아 공항 입지",
 o:[["Place 3 airports to minimize the sum of squared distances from each city to its nearest airport.","각 도시에서 가장 가까운 공항까지 거리 제곱의 합을 최소화하도록 공항 3개를 놓는다."],
    ["State = airport locations x = (x1,y1,x2,y2,x3,y3). Objective f(x) = Σ_a Σ_{c∈Ca} (xa−xc)² + (ya−yc)².","상태 = 공항 위치 x = (x1,y1,x2,y2,x3,y3). 목적 f(x) = Σ Σ (공항−도시)²."]],
 x:"상태가 6개의 실수(공항 3곳의 좌표)인 연속 최적화 예입니다. 각 공항이 맡는 도시 집합 Ca가 고정이면 f는 미분 가능하므로 경사 하강으로 공항을 조금씩 옮겨 비용을 줄입니다(도시 배정이 바뀌면 다시 계산)."},
{s:"4-1",im:["4-1-27"],en:"Many ML Algorithms Are Local Search",ko:"많은 머신러닝이 지역 탐색이다",
 o:[["Families: hill climbing & continuous optimization; simulated annealing & stochastic methods; local beam search; genetic algorithms.","계열: 언덕 오르기·연속 최적화 / 담금질·확률적 방법 / 지역 빔 탐색 / 유전 알고리즘."],
    ["Many machine learning algorithms are local searches.","많은 머신러닝 알고리즘이 지역 탐색이다."]],
 x:"이 단원의 마무리: 신경망 학습(경사 하강)을 비롯한 수많은 ML 기법이 결국 '목적 함수를 지역적으로 개선'하는 지역 탐색입니다. 2장에서 '많은 ML이 지역 탐색'이라 했던 말과 이어집니다."},
/* ---- 4-2 Nondeterminism ---- */
{s:"4-2",im:["4-2-01","4-2-02"],en:"Recap: Solving a Search Problem under Certainty",ko:"복습: 확실성 아래의 탐색",
 o:[["No uncertainty: fully observable (the agent knows the state) and deterministic, so Result(s,a) is a single state.","불확실성 없음: 완전 관찰(상태를 앎) + 결정적이라 Result(s,a)가 상태 하나."],
    ["Method: use tree search at planning time to produce a sequence of actions, then execute that plan as it stands.","방법: 계획 시점에 트리 탐색으로 행동 순열을 만들고, 그 계획을 그대로 실행."]],
 x:"3장의 전제를 다시 짚습니다: 세상이 <b>관찰 가능 + 결정적</b>이면 결과가 하나로 정해지므로, 미리 '[a1, a2, a3]' 같은 <b>행동 순열</b>을 짜서 눈 감고 실행해도 됩니다. 4장은 이 전제들을 하나씩 깨뜨립니다."},
{s:"4-2",im:["4-2-03"],en:"Where Uncertainty Comes From, and What It Costs",ko:"불확실성의 출처와 대가",key:1,
 o:[["Two sources: (1) actions are nondeterministic — can't tell the resulting state; (2) environment is partially observable — uncertain about the current state.","두 출처: (1) 행동이 비결정적 — 결과 상태를 알 수 없음, (2) 부분 관찰 — 지금 상태가 불확실."],
    ["Consequence 1: a fixed precomputed plan fails; you need a conditional plan (strategy/policy) that depends on percepts.","결과 1: 고정 계획이 실패 → 지각에 따라 달라지는 조건부 계획(전략/정책)이 필요."],
    ["Consequence 2: the agent must track every state it could be in — that set is the belief state.","결과 2: 가능한 모든 상태를 추적해야 함 → 그 집합이 믿음 상태(belief state)."]],
 x:"이 단원(4-2)은 출처 (1) <b>비결정적 행동</b>을, 다음 단원(4-3)은 (2) <b>부분 관찰</b>을 다룹니다. 두 경우 모두 해가 '행동 순열'이 아니라 <b>조건부 계획</b>(if 지각 then 행동)이고, 가능한 상태들의 집합 <b>belief state</b>를 다룬다는 점이 공통입니다."},
{s:"4-2",im:["4-2-04"],en:"Nondeterministic Actions: The Definition",ko:"비결정적 행동의 정의",key:1,
 o:[["If actions are nondeterministic, the transition model describes that uncertainty: Results(s,a) returns a SET of states, not one.","행동이 비결정적이면 전이 모델이 그 불확실성을 담는다: Results(s,a)가 상태 하나가 아니라 집합을 반환."],
    ["Example: Results(s1,a) = {s2,s4,s5} — action a in s1 can lead to any one of three states.","예: Results(s1,a) = {s2,s4,s5} — s1에서 a는 셋 중 하나로 갈 수 있음."]],
 x:"3장에서 <code>Result(s,a)</code>는 상태 하나였지만, 비결정적 세계에서는 <code>Results(s,a)</code>(복수형)가 <b>상태들의 집합</b>입니다. 행동 후 agent는 '이 중 하나에 있다'까지만 알고, 그 집합이 바로 belief state입니다."},
{s:"4-2",im:["4-2-05","4-2-06"],en:"Example 1: The Erratic Vacuum World",ko:"예 1: 변덕스러운 진공청소기 세계",
 o:[["Like the deterministic vacuum world, but the powerful Suck is erratic: on a dirty square it cleans it and sometimes the adjacent square too; on a clean square it sometimes deposits dirt.","결정적 세계와 같지만 강력한 Suck이 변덕스럽다: 더러운 칸에서는 그 칸(가끔 옆 칸까지) 청소, 깨끗한 칸에서는 가끔 먼지를 떨어뜨림."],
    ["From state 1, Suck can lead to two different states, so a conditional plan is needed — NOT a sequence, but a tree with if-then-else.","상태 1에서 Suck은 두 상태로 갈 수 있어 조건부 계획이 필요 — 순열이 아니라 if-then-else 트리."],
    ["Solution: [Suck, if State=5 then [Right, Suck] else []].","해: [Suck, 만약 State=5면 [Right, Suck], 아니면 []]."]],
 x:"결정적 세계의 해는 단순히 <code>[Suck, Right, Suck]</code>였습니다. 하지만 Suck이 변덕스러우면 결과(상태 5 또는 7)에 따라 다음 행동이 달라져야 하므로, 해가 <b>관찰에 분기하는 트리</b>가 됩니다. '계획 = 리스트'가 아니라 '계획 = 프로그램'이 되는 첫 신호입니다."},
{s:"4-2",im:["4-2-07"],en:"AND-OR Search Trees",ko:"AND-OR 탐색 트리",key:1,
 o:[["OR node: the agent chooses one action among several.","OR 노드: agent가 여러 행동 중 하나를 고름."],
    ["AND node: the environment chooses, and every possible outcome must be handled.","AND 노드: 환경이 고르며, 가능한 모든 결과를 다 처리해야 함."],
    ["Because Suck in state 1 leads to belief state {5,7}, the agent needs a plan for 5 AND a plan for 7.","s1에서 Suck이 {5,7}로 가므로 5에 대한 계획 '그리고(AND)' 7에 대한 계획이 모두 필요."]],
 x:"비결정성을 트리로 표현하는 열쇠입니다. <b>OR</b>는 '내가 고른다'(여러 행동 중 하나면 충분), <b>AND</b>는 '환경이 고른다'(모든 결과에 대비해야 함)입니다. 3장 트리는 OR만 있었지만, 여기서는 AND가 추가됩니다. 해도 하나의 경로가 아니라 <b>부분 트리(subtree)</b>입니다.",
 e:"주사위를 던지는 게임: 내 수(OR)는 하나 고르면 되지만, 상대/주사위 결과(AND)는 1~6 모두에 답을 준비해야 합니다."},
{s:"4-2",im:["4-2-08"],en:"Searching the AND-OR Tree",ko:"AND-OR 트리 탐색하기",key:1,
 o:[["Goal: choose one action at every OR node, cover every outcome at every AND node, ending with a subtree whose leaves are all goal states.","목표: 모든 OR 노드에서 행동 하나 선택, 모든 AND 노드에서 모든 결과를 포괄, 잎이 전부 목표인 부분 트리로 끝냄."],
    ["Descend depth-first: at an OR node try one action at a time; at an AND node take every outcome and recurse; if a state repeats on the current path, return failure; abandon subtrees whose leaves aren't all goals; stop at the first complete subtree.","깊이 우선: OR에서 행동을 하나씩, AND에서 모든 결과를 재귀 · 현재 경로에 상태가 재등장하면 실패 반환 · 잎이 모두 목표가 아닌 부분 트리는 포기 · 첫 완성 부분 트리에서 종료."]],
 x:"해의 조건: OR는 '하나만 성공하면 OK', AND는 '모두 성공해야 OK'. 경로에 같은 상태가 다시 나오면(순환) 실패 처리하는 <code>IS-CYCLE</code> 검사가 있어 무한 루프를 막습니다. 결과 해는 조건부 계획 <code>[Suck, if State=5 then [Right,Suck] else []]</code>."},
{s:"4-2",im:["4-2-09"],en:"Recursive AND-OR Tree Search (DFS trace)",ko:"재귀 AND-OR 트리 탐색 (DFS 추적)",
 o:[["DFS: not optimal — it finds a path and just returns it.","DFS: 최적이 아님 — 경로를 찾으면 바로 반환."],
    ["OR-SEARCH tries each action; AND-SEARCH recurses on every result; IS-CYCLE returns fail; a GOAL leaf returns the empty plan [].","OR-SEARCH는 각 행동 시도 · AND-SEARCH는 모든 결과 재귀 · 순환이면 fail · 목표 잎은 빈 계획 [] 반환."]],
 x:"슬라이드의 추적을 그대로 따라가면 됩니다: <code>OR-SEARCH(1)</code>에서 Suck → {5,7} → <code>AND-SEARCH({5,7})</code> → 5와 7 각각 <code>OR-SEARCH</code> → 7은 바로 목표([]), 5는 Right·Suck으로 8(목표)에 도달. 합치면 <code>[Suck, if State=5 then [Right,Suck] else []]</code>. 순환(1→5→1…)은 <code>IS-CYCLE</code>로 끊습니다."},
{s:"4-2",im:["4-2-10","4-2-11"],en:"Example 2: Slippery Vacuum World & Cyclic Solutions",ko:"예 2: 미끄러운 세계와 순환 해",key:1,
 o:[["Slippery world: a movement action (Right/Left) sometimes fails and the agent stays put. From state 1, Right gives belief state {1,2}.","미끄러운 세계: 이동(Right/Left)이 가끔 실패해 제자리에 머묾. 상태 1에서 Right → {1,2}."],
    ["There is no acyclic solution, and AND-OR search returns failure (IS-CYCLE). But a cyclic solution exists: keep trying Right until it succeeds.","비순환 해가 없어 AND-OR 탐색은 실패를 반환. 하지만 순환 해가 존재: 성공할 때까지 Right를 반복."],
    ["Solution: [Suck, while State=5 do Right, Suck]. The plan is now a loop, not just a branch.","해: [Suck, State=5인 동안 Right 반복, Suck]. 계획이 분기를 넘어 '반복'이 됨."]],
 x:"여기서 '계획은 리스트가 아니라 <b>프로그램</b>'이라는 말이 완성됩니다: 분기(if)뿐 아니라 <b>반복(while)</b>까지 필요합니다. 이동이 가끔 실패해도 '될 때까지 다시 시도'하면 결국 성공합니다(언젠가 미끄러지지 않을 확률 1). 비순환 해만 찾는 기본 AND-OR는 이걸 놓치므로, 순환 해를 허용하도록 확장해야 합니다.",
 e:"엘리베이터 버튼이 가끔 안 눌릴 때 '열릴 때까지 다시 누른다'가 순환 해입니다. 한 번 눌러 끝나는 고정 계획으로는 안 됩니다."},
/* ---- 4-3 Partial Observability ---- */
{s:"4-3",im:["4-3-01","4-3-02"],en:"Sensorless (Conformant) Problems",ko:"무감각(컨포먼트) 문제",key:1,
 o:[["A sensorless (conformant) problem: the agent has no percepts at all and gets no information from the environment.","무감각(sensorless) 문제: agent가 지각이 전혀 없고 환경에서 정보를 못 받음."],
    ["Why useful? A doctor prescribing a broad-spectrum antibiotic instead of running a slow test — saving time and cost.","왜 유용? 느린 검사 없이 광범위 항생제를 처방하는 의사처럼 — 시간·비용 절약."],
    ["Idea: find a plan that works whatever state you are in, then execute it blind.","생각: 어떤 상태에 있든 통하는 계획을 찾아 눈 감고 실행."]],
 x:"센서가 전혀 없어도, '어느 상태든 상관없이 통하는' 행동 순열이 있으면 풉니다. 관찰이 없으니 분기(if)가 필요 없고 <b>순수 행동 순열</b>이면 충분하다는 점이 포인트입니다.",
 e:"어두운 방에서 스위치 위치를 몰라도 '모든 스위치를 순서대로 다 누른다'는 눈 감고도 통하는 conformant 계획입니다."},
{s:"4-3",im:["4-3-03"],en:"Belief States",ko:"믿음 상태",key:1,
 o:[["The agent does not know exactly which state it is in, but knows it is in one of several possible states.","agent는 정확히 어느 상태인지 모르지만, 가능한 여러 상태 중 하나임은 안다."],
    ["That set is the belief state, e.g. b = {s2, s4, s6}.","그 집합이 믿음 상태, 예: b = {s2, s4, s6}."]],
 x:"불확실성을 다루는 핵심 개념입니다. 실제 상태는 모르지만 '가능한 상태들의 집합' b는 압니다. 이제 탐색을 <b>실제 상태가 아니라 belief state 위에서</b> 합니다."},
{s:"4-3",im:["4-3-04","4-3-05","4-3-06"],en:"An Action Can Narrow the Belief State",ko:"행동이 믿음 상태를 좁힌다",key:1,
 o:[["Initial belief state is everything: {1,2,3,4,5,6,7,8}. An action can reduce the number of possible states.","초기 믿음 상태는 전부: {1..8}. 행동이 가능한 상태 수를 줄일 수 있다."],
    ["Deterministic but unobservable vacuum world: after Right, every state where the agent was on the left moves right, so half the possibilities collapse onto the other half.","결정적이지만 관찰 불가한 진공 세계: Right 후, 왼쪽에 있던 상태들이 오른쪽으로 모여 가능성의 절반이 합쳐진다."],
    ["The sequence [Right, Suck, Left, Suck] forces the world into goal state 7 whatever it started in. No observations → no conditional plan needed; a plain sequence suffices.","순열 [Right, Suck, Left, Suck]는 어디서 시작하든 목표 7로 몰아넣는다. 관찰이 없으니 조건부 계획 불필요 — 단순 순열로 충분."]],
 x:"관찰이 없어도 <b>행동 자체가 정보</b>가 됩니다: Right를 하면 '왼쪽/오른쪽' 구분이 사라져 믿음 상태가 줄고, Suck을 하면 '현재 칸은 깨끗'이 확정돼 또 줄어듭니다. 이렇게 믿음 상태를 한 점(목표)으로 몰아넣는 순열이 conformant 해입니다.",
 e:"Right·Suck·Left·Suck을 거치면, 처음에 어디 있었든 결국 '양쪽 다 깨끗, 오른쪽 칸'인 상태 7로 모입니다."},
{s:"4-3",im:["4-3-07"],en:"The Reachable Belief-State Space",ko:"도달 가능한 믿음 상태 공간",
 o:[["With no observations the solution is read off as a sequence: [Right, Suck, Left, Suck].","관찰이 없으면 해는 순열로 읽힌다: [Right, Suck, Left, Suck]."],
    ["The belief-state space is the power set of the N states, so its size is 2^N (here 2^8 = 256), but only 12 belief states are actually reachable by acting.","믿음 상태 공간은 N개 상태의 멱집합이라 크기 2^N (여기선 256). 하지만 실제로 도달 가능한 것은 12개뿐."]],
 x:"이론상 믿음 상태는 <code>2^N</code>개로 폭발하지만, <b>실제로 행동으로 도달</b>하는 것은 훨씬 적습니다(여기선 256 중 12개). 그래서 전체를 다 만들지 않고 도달 가능한 것만 탐색합니다."},
{s:"4-3",im:["4-3-08"],en:"Planning in Belief-State Space",ko:"믿음 상태 공간에서의 계획",key:1,
 o:[["Formulate as an ordinary search and solve with DFS/IDS/BFS/A*. States: every belief state (2^N). Initial: usually the belief state of every state. Goal test: does the belief state contain only goal states?","보통의 탐색으로 만들어 DFS/IDS/BFS/A*로 푼다. 상태: 모든 믿음 상태(2^N) · 초기: 보통 전체 집합 · 목표: 믿음 상태가 목표만 포함하는가?"],
    ["Simplifying property: if a belief state has a solution, so does every subset of it (by the same actions) — this prunes the tree.","단순화 성질: 어떤 믿음 상태에 해가 있으면 그 부분집합에도 같은 행동으로 해가 있다 — 트리를 가지치기."],
    ["Subset already solved → reuse the plan. Superset of an unsolvable one → discard. A superset already reached → drop the subset path (b dominates b').","이미 푼 것의 부분집합 → 계획 재사용 · 못 푼 것의 상위집합 → 버림 · 이미 도달한 상위집합이 있으면 → 부분집합 경로 버림(b가 b'를 지배)."]],
 x:"belief state를 '하나의 상태'로 보면 3장의 탐색을 그대로 적용할 수 있습니다. 핵심 최적화는 <b>부분집합·상위집합 관계</b>: 작은 믿음 상태가 더 쉽습니다(가능성이 적으니). 이걸 이용해 중복 탐색을 크게 줄입니다. 다만 2^N 때문에 큰 문제에는 비현실적입니다."},
{s:"4-3",im:["4-3-09"],en:"Percepts and Observability",ko:"지각과 관찰 가능성",key:1,
 o:[["Many problems can't be solved efficiently without sensing (e.g. the 8-puzzle where the agent must see at least one tile).","감지 없이는 효율적으로 못 푸는 문제가 많다(예: 타일을 적어도 하나는 봐야 하는 8-퍼즐)."],
    ["Percept(s) says what the agent observes: Fully observable → Percept(s)=s; Sensorless → Percept(s)=None; Partially observable → Percept(s)=o (tells something about s).","Percept(s)는 agent가 보는 것: 완전 관찰 → s · 무감각 → None · 부분 관찰 → o(상태에 대한 일부 정보)."]],
 x:"관찰 가능성을 <code>Percept</code> 함수로 통일해 표현합니다. 완전 관찰은 상태를 그대로 보고, 무감각은 아무것도 못 보며, <b>부분 관찰</b>은 그 사이 — 같은 관찰 o를 내는 상태가 여럿이라 믿음 상태가 완전히 한 점으로 좁혀지지 않습니다."},
{s:"4-3",im:["4-3-10"],en:"Using Observations: Predict and Update",ko:"관찰 활용: 예측과 갱신",key:1,
 o:[["Predict with an action: choose a, use the transition model to get the resulting belief state: b̂ = PREDICT(b,a) = RESULT(b,a).","행동으로 예측: a를 골라 전이 모델로 결과 믿음 상태를 얻음: b̂ = PREDICT(b,a)."],
    ["Update with an observation: receive o, keep only the states consistent with it: b_o = UPDATE(b̂,o) = {s : o = PERCEPT(s) and s ∈ b̂}.","관찰로 갱신: o를 받아 그것과 모순 없는 상태만 남김: b_o = UPDATE(b̂,o)."],
    ["Together: b ← Update(Predict(b,a), o). Predict always comes before update.","합치면: b ← Update(Predict(b,a), o). 예측이 항상 갱신보다 먼저."]],
 x:"부분 관찰의 믿음 상태 추적은 두 단계입니다. <b>Predict</b>(행동으로 가능성이 퍼짐) → <b>Update</b>(관찰로 모순되는 것을 쳐내 가능성이 좁아짐). agent는 '행동하고 나서 관찰'하므로 항상 predict가 먼저입니다. 이 과정이 다음 슬라이드의 monitoring/filtering입니다.",
 e:"로봇이 한 칸 전진(predict: 위치 후보가 늘어남)한 뒤 '벽이 보인다'(update: 벽 앞 위치만 남김)로 자기 위치를 좁혀 갑니다."},
{s:"4-3",im:["4-3-11"],en:"Example: The Local-Sensing Vacuum World",ko:"예: 국소 감지 진공 세계",
 o:[["The agent senses only its own square (partially observable): its position and whether that square is dirty.","agent는 자기 칸만 감지(부분 관찰): 위치와 그 칸이 더러운지."],
    ["Predict Right from b={1,3}, then update with observation [B, Dirty]: Update(Predict({1,3},Right), [B,Dirty]) = {2}.","b={1,3}에서 Right 예측 후 관찰 [B,Dirty]로 갱신: 결과 {2}. 두 가능성이 하나로 붕괴."]],
 x:"predict/update의 숫자 예시입니다. {1,3}에서 Right로 이동(predict)하면 가능성이 퍼지지만, '오른쪽 칸(B)이 더럽다'는 관찰(update)과 모순 없는 상태는 2뿐이라 믿음 상태가 {2}로 확정됩니다."},
{s:"4-3",im:["4-3-12","4-3-13"],en:"Solving a Partially Observable Problem",ko:"부분 관찰 문제 풀기",key:1,
 o:[["Build a conditional plan using an AND-OR tree over belief states.","믿음 상태 위의 AND-OR 트리로 조건부 계획을 세운다."],
    ["The OR node is the agent's choice of action; the AND branches are the observations it might then perceive.","OR 노드는 agent의 행동 선택 · AND 가지는 그 뒤 받을 수 있는 관찰들."]],
 x:"4-2의 AND-OR 트리가 여기서도 쓰입니다. 다만 AND 분기의 의미가 '행동의 비결정적 결과'에서 '<b>받을 수 있는 관찰</b>'로 바뀝니다. 각 관찰마다 믿음 상태가 달라지므로, 관찰별로 계획을 준비해야 합니다 → 해는 조건부 계획."},
{s:"4-3",im:["4-3-14"],en:"An Agent for Partially Observable Environments",ko:"부분 관찰 환경의 에이전트",
 o:[["Formulate the problem, call a search (e.g. AND-OR-SEARCH) to get a solution, and execute it. The solution is a conditional plan, not a sequence.","문제를 정의하고 탐색(예: AND-OR-SEARCH)으로 해를 얻어 실행. 해는 순열이 아니라 조건부 계획."],
    ["While acting, keep tracking the belief state: b ← Update(Predict(b,a), o). This is called monitoring, filtering, or state estimation.","행동하는 동안 믿음 상태를 계속 추적: b ← Update(Predict(b,a),o). 이를 monitoring/filtering/state estimation이라 함."],
    ["Difficulty: the belief state must be updated in real time; often only an approximate belief state can be computed (common in control theory and RL).","어려움: 실시간 갱신이 필요하고, 보통 근사 믿음 상태만 계산 가능(제어 이론·강화학습에서 흔함)."]],
 x:"실행 중에도 매 단계 predict/update로 믿음 상태를 유지하는 것이 <b>monitoring(filtering)</b>입니다. 실시간이라 정확한 믿음 상태 계산이 비싸, 현실에서는 근사합니다 — 이 발상이 강화학습·제어로 이어집니다."},
/* ---- 4-4 Online Search ---- */
{s:"4-4",im:["4-4-01","4-4-02"],en:"Recap: Offline Search",ko:"복습: 오프라인 탐색",
 o:[["Offline search (planning): builds a plan using the state space and transition model BEFORE taking any action; predicts outcomes with a known transition function.","오프라인 탐색(계획): 행동 전에 상태 공간·전이 모델로 계획을 세움. 알려진 전이 함수로 결과를 예측."],
    ["The problem: in an unknown environment the transition function is not known, so outcomes can't be predicted and offline search can't build a plan at all.","문제: 모르는 환경에서는 전이 함수를 모르므로 결과를 예측 못 해 계획 자체를 못 세움."]],
 x:"지금까지(3장·4-1~4-3)는 모두 <b>행동하기 전에</b> 전이 모델로 머릿속에서 탐색해 계획을 세우는 오프라인 방식이었습니다. 하지만 전이 함수를 아예 모르면 예측이 불가능해, 계획을 못 세웁니다 — 그래서 online search가 필요합니다."},
{s:"4-4",im:["4-4-03"],en:"Online Search",ko:"온라인 탐색",key:1,
 o:[["Online search does no planning. It searches the real world one action at a time: offline's predict and update become act and observe.","온라인 탐색은 계획하지 않는다. 실제 세계를 한 번에 한 행동씩 탐색: 오프라인의 예측·갱신이 '행동·관찰'이 된다."],
    ["Useful for: unknown environments, real-time problems, nondeterministic domains.","유용한 곳: 모르는 환경, 실시간 문제, 비결정적 영역."]],
 x:"핵심 전환: <b>predict/update(머릿속) → act/observe(실제로)</b>. 머릿속으로 결과를 예측할 수 없으니 진짜로 한 행동 해 보고 결과를 눈으로 확인합니다. 모르는 지도를 직접 걸어 다니며 그리는 셈입니다."},
{s:"4-4",im:["4-4-04"],en:"Implementation: The Online DFS Agent",ko:"구현: 온라인 DFS 에이전트",key:1,
 o:[["Setting: deterministic and fully observable (percept = state), but result(s,a) is unknown.","설정: 결정적·완전 관찰(지각=상태)이지만 result(s,a)를 모름."],
    ["Strategy: try every action, record result(s,a)→s′, backtrack when all actions from a state are searched.","전략: 모든 행동을 시도하고 result(s,a)→s′를 기록, 한 상태의 행동을 다 해 보면 되돌아감(backtrack)."],
    ["untried = frontier; store learned transitions; stack previous states to remember where we came from (for backtracking).","untried = 프런티어 · 배운 전이를 저장 · 이전 상태를 쌓아 어디서 왔는지 기억(되돌아가려고)."]],
 x:"온라인 DFS는 '해 보고 배우는' DFS입니다. 전이 함수를 모르니 <code>result(s,a)</code>를 직접 시도해 표에 채웁니다(= 전이 함수 학습). <code>untried[s]</code>가 프런티어 역할을 하고, 막다른 곳에서는 왔던 경로(스택)를 따라 물리적으로 되돌아갑니다. 순간이동이 안 되므로 backtrack도 '실제 이동'이라는 점이 오프라인 DFS와 다릅니다."},
{s:"4-4",im:["4-4-05"],en:"Example: Exploring a 2×2 World",ko:"예: 2×2 세계 탐험",
 o:[["Unknown 2×2 space: start top-left (A), goal bottom-right (D). States A,B,C,D; actions Up/Down/Left/Right; no walls; the agent perceives only its current position and has no map.","모르는 2×2 공간: 좌상단 A에서 시작, 목표는 우하단 D. 상태 A,B,C,D · 행동 상하좌우 · 벽 없음 · 현재 위치만 지각, 지도 없음."],
    ["Variables: s,a (previous state and action); result[s,a] (learned transitions); untried[s]; unbacktracked[s] (predecessors to backtrack to).","변수: s,a(이전 상태·행동) · result[s,a](배운 전이) · untried[s] · unbacktracked[s](되돌아갈 이전 상태들)."]],
 x:"작은 격자에서 온라인 DFS의 변수들이 어떻게 채워지는지 보는 예입니다. 지도가 없으니 agent는 움직여 보며 <code>result</code> 표를 채우고, 막히면 <code>unbacktracked</code>로 되돌아갑니다."},
{s:"4-4",im:["4-4-06"],en:"The Exploration, Step by Step",ko:"탐험, 단계별로",key:1,
 o:[["Step 1 at A: untried[A] ← [Right, Down]; no previous state so nothing in result; A isn't the goal; pop Down, move A→C.","1단계 A: untried[A]←[Right,Down] · 이전 상태 없어 result 비움 · A는 목표 아님 · Down 꺼내 A→C 이동."],
    ["Step 2 at C: untried[C] ← [Up, Right]; result[A,Down] ← C; unbacktracked[C] ← [A]; pop Right, move C→D.","2단계 C: untried[C]←[Up,Right] · result[A,Down]←C · unbacktracked[C]←[A] · Right 꺼내 C→D 이동."],
    ["Step 3 at D: IsGoal(D) is true, so the search stops.","3단계 D: IsGoal(D) 참 → 탐색 종료."]],
 x:"한 걸음마다 (1) 새 상태면 <code>untried</code> 채우기, (2) 방금 한 전이를 <code>result</code>에 기록, (3) 돌아갈 곳을 <code>unbacktracked</code>에 저장, (4) 안 해 본 행동 하나를 꺼내 실제로 이동 — 이 순서를 반복합니다. 목표에 닿으면 멈춥니다."},
{s:"4-4",im:["4-4-07"],en:"The Exploration Trace",ko:"탐험 추적표",
 o:[["A dead-end/backtracking scenario (no goal): in D, untried[D] becomes empty, so b = pop(unbacktracked[D]) = C; back at C, untried[C]=[Up], result[C,Up]=A; back at A, untried[A]=[Right], result[A,Right]=B; …","목표 없음 시나리오: D에서 untried[D]가 비면 b=pop(unbacktracked[D])=C로 되돌아감 · C로 와 untried[C]=[Up], result[C,Up]=A · A로 와 untried[A]=[Right], result[A,Right]=B · …"],
    ["In short, the algorithm repeats: Explore → Dead End → Backtrack → Explore a New Path.","요컨대 반복: 탐험 → 막다른 곳 → 되돌아가기 → 새 경로 탐험."]],
 x:"막다른 곳에 닿으면 <code>unbacktracked</code>에서 '왔던 이전 상태'를 꺼내 물리적으로 되돌아가, 거기서 아직 안 해 본 행동을 이어갑니다. '탐험 → 막힘 → 백트랙 → 새 길'의 반복이 온라인 DFS의 전부입니다."},
{s:"4-4",im:["4-4-08"],en:"Summary: What Chapter 4 Removed",ko:"요약: 4장이 없앤 가정들",key:1,
 o:[["Chapter 3 assumed the world is observable, deterministic and known. Chapter 4 removed those assumptions one at a time.","3장은 세상이 관찰 가능·결정적·알려짐이라 가정. 4장은 그 가정들을 하나씩 없앴다."],
    ["Path doesn't matter, only the state → local search (hill climbing, simulated annealing, local beam, genetic).","경로 무관, 상태만 중요 → 지역 탐색(언덕 오르기·담금질·빔·유전)."],
    ["Space is continuous → discretize or follow the gradient. Action outcome not unique → belief states + AND-OR search, conditional plan. State not observable → belief states narrowed by predict/update. Model itself unknown → online search (learn result(s,a) by acting).","연속 공간 → 이산화/경사. 결과가 유일하지 않음 → 믿음 상태+AND-OR, 조건부 계획. 관찰 불가 → predict/update로 믿음 상태 좁히기. 모델도 모름 → 온라인 탐색."]],
 x:"4장 전체 지도입니다. 3장의 세 전제(관찰 가능·결정적·알려짐)를 하나씩 풀면서 각각 다른 도구가 나왔습니다: 경로가 무의미 → <b>지역 탐색</b>, 연속 → <b>이산화·경사</b>, 비결정 → <b>belief state·AND-OR·조건부 계획</b>, 부분 관찰 → <b>predict/update</b>, 모델 모름 → <b>online search</b>. 공통 열쇠는 belief state와 '계획 = 프로그램(분기·반복)'입니다."}

];

const QB = [

{id:"1-1-01",s:"1-1",t:"mc",

 o:[["Thinking humanly — cognitive modeling that reproduces the inner workings of the human mind.","인간처럼 생각하기 — 인간 마음의 내부 작동을 재현하는 인지 모델링.",1,"맞습니다. '생각 × 인간처럼' 칸은 인지 모델링입니다."],
    ["Acting humanly — behaving so that an observer cannot tell the machine from a person (the Turing test).","인간처럼 행동하기 — 관찰자가 기계와 사람을 구별하지 못하게 행동하기(튜링 테스트).",1,"맞습니다. '행동 × 인간처럼' 칸의 대표가 튜링 테스트입니다."],
    ["Thinking rationally — the laws of thought: reasoning with formal logic so that conclusions necessarily follow.","합리적으로 생각하기 — 사고의 법칙: 형식 논리로 추론해 결론이 반드시 따라 나오게 하기.",1,"맞습니다. 논리주의(laws of thought)입니다."],
    ["This course adopts the 'thinking humanly' approach.","이 수업은 '인간처럼 생각하기' 관점을 택한다.",0,"틀렸습니다. 이 수업은 네 번째, '합리적으로 행동하기(acting rationally)'를 택합니다."],
    ["Acting rationally requires the machine to copy how a human brain internally works.","합리적으로 행동하기는 기계가 인간의 뇌가 내부적으로 작동하는 방식을 그대로 베낄 것을 요구한다.",0,"틀렸습니다. 합리적 행동은 '목표 달성 가능성을 최대화하는 행동'이 기준이지, 사람처럼 생각할 필요는 없습니다(예: 내비게이션)."]],

{id:"1-1-02",s:"1-1",t:"mc",
 q:"Which statements about AI, machine learning (ML) and deep learning (DL) are correct?",
 k:"AI, 머신러닝(ML), 딥러닝(DL)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Deep learning is a subset of machine learning.","딥러닝은 머신러닝의 부분집합이다.",1,"맞습니다. AI ⊃ ML ⊃ DL."],
    ["Machine learning is a subset of AI.","머신러닝은 AI의 부분집합이다.",1,"맞습니다. ML은 AI를 이루는 방법 중 '데이터로부터 규칙을 스스로 배우는' 방법입니다."],
    ["A spam filter built from a hand-written rule such as \"if the subject contains 'free', mark it as spam\" is AI but not machine learning.","\"제목에 '무료'가 있으면 스팸\" 같은 규칙을 사람이 직접 짠 스팸 필터는 AI이지만 머신러닝은 아니다.",1,"맞습니다. 규칙을 사람이 짰으니 데이터로 배운 것이 아닙니다."],
    ["This course is primarily a deep learning course.","이 수업은 주로 딥러닝 수업이다.",0,"틀렸습니다. 슬라이드는 '이 수업은 딥러닝 수업도, 머신러닝 수업도 아니다'라고 말합니다. 그것들은 기법일 뿐입니다."],
    ["Regression is the task of predicting a discrete category, such as cat vs. dog.","회귀는 고양이 vs 개처럼 이산적인 범주를 예측하는 과제다.",0,"틀렸습니다. 범주를 나누는 것은 분류(classification), 연속된 숫자를 예측하는 것이 회귀(regression)입니다."]],
 e:"세 개념은 포함 관계(AI ⊃ ML ⊃ DL)입니다. 이 수업은 기법(ML·DL)이 아니라 그 기법들이 섬기는 대상, 즉 지능 자체를 다룹니다."},
{id:"1-1-03",s:"1-1",t:"mc",
 q:"Which statements match the lecture's definitions of intelligence and AI?",
 k:"강의에서 제시한 지능과 AI의 정의에 맞는 설명을 모두 고르시오.",
 o:[["Intelligence is the ability to acquire and apply knowledge in order to adapt effectively to the environment.","지능은 환경에 효과적으로 적응하기 위해 지식을 습득하고 적용하는 능력이다.",1,"맞습니다. 슬라이드 20쪽의 정의입니다."],
    ["Intelligence includes the ability to learn, reason, and solve problems.","지능에는 배우고, 추론하고, 문제를 해결하는 능력이 포함된다.",1,"맞습니다. '즉 배우고, 추론하고, 문제를 해결하는 능력'이라고 풀어 씁니다."],
    ["AI is a machine that can perceive, learn, reason, and make decisions like humans.","AI는 인간처럼 지각하고, 배우고, 추론하고, 결정을 내릴 수 있는 기계다.",1,"맞습니다."],
    ["There is a single, universally agreed-upon definition of AI.","AI에는 모두가 합의한 단 하나의 정의가 있다.",0,"틀렸습니다. 요약 슬라이드: 'AI에는 합의된 하나의 정의가 없다.'"],
    ["Under the 'acting rationally' view, a machine counts as intelligent only if it passes the Turing test.","'합리적으로 행동하기' 관점에서는 튜링 테스트를 통과해야만 기계를 지능적이라고 본다.",0,"틀렸습니다. 튜링 테스트는 '인간처럼 행동하기'의 기준입니다. 합리적 행동의 기준은 목표 달성입니다."]],
 e:"지능 = 지식을 습득·적용해 환경에 적응하는 능력(학습·추론·문제 해결). AI = 인간처럼 지각·학습·추론·결정하는 기계. 하지만 AI의 정의는 하나로 합의되어 있지 않습니다."},
{id:"1-1-04",s:"1-1",t:"mc",
 q:"\"Are these things intelligent?\" Which statements reflect the lecture's conclusion?",
 k:"\"이 물건들은 지능일까?\" 강의의 결론을 반영하는 설명을 모두 고르시오.",
 o:[["There is no clean line between intelligent and non-intelligent things; it is a matter of degree.","지능적인 것과 아닌 것 사이에 깔끔한 선은 없고, 정도의 문제다.",1,"맞습니다. 요약: '지능적인 것과 아닌 것의 경계는 깔끔하지 않다.'"],
    ["A thermostat senses and reacts — so does a humanoid robot.","온도조절기도 감지하고 반응한다. 휴머노이드 로봇도 그렇다.",1,"맞습니다. 요약 슬라이드의 문장 그대로입니다."],
    ["A wardrobe senses its environment, decides, and learns.","옷장은 환경을 감지하고, 판단하고, 학습한다.",0,"틀렸습니다. 옷장은 감지·판단·학습 모두 없음(✗✗✗)으로 지능이 아닙니다."],
    ["For an AI speaker such as a Google Home Mini, the real 'brain' is a large language model behind it (e.g., Gemini, ChatGPT, Claude).","구글 홈 미니 같은 AI 스피커의 진짜 '두뇌'는 그 뒤에 있는 거대 언어 모델(Gemini, ChatGPT, Claude 등)이다.",1,"맞습니다. 스피커 자체는 마이크와 스피커일 뿐입니다."],
    ["A humanoid robot sprinting on a track necessarily requires more perception and decision-making than a robot sorting boxes of different shapes.","트랙을 달리는 휴머노이드 로봇은 모양이 제각각인 상자를 분류하는 로봇보다 반드시 더 많은 지각과 결정을 필요로 한다.",0,"틀렸습니다. 강의는 오히려 다양한 물건을 보고 판단해 처리하는 쪽이 더 많은 지각과 결정을 요구한다고 설명합니다."]],
 e:"'합리적으로 행동하기' 기준으로 보면 지능은 있다/없다가 아니라 정도의 문제입니다. 화려한 동작보다 다양한 상황에서의 지각·판단이 더 어렵습니다."},
{id:"1-1-05",s:"1-1",t:"mc",
 q:"Which of the following are part of the 'deskilling loop' described in the lecture?",
 k:"강의에서 설명한 '탈숙련화 루프(deskilling loop)'에 해당하는 것을 모두 고르시오.",
 o:[["The tool does it for you, so you practice less.","도구가 대신 해 주니 연습이 줄어든다.",1,"맞습니다. 루프의 시작입니다."],
    ["Skills rust, so you can no longer judge whether the output is correct.","기술이 녹슬어 결과물이 맞는지 판단할 수 없게 된다.",1,"맞습니다."],
    ["You depend on the tool more and hand it more work.","도구에 더 의존하고 더 많은 일을 맡긴다.",1,"맞습니다. 그리고 다시 처음으로 돌아갑니다."],
    ["Using the tool more makes your own skills sharper over time.","도구를 더 많이 쓸수록 자신의 기술이 점점 더 날카로워진다.",0,"틀렸습니다. 정반대입니다. 연습이 줄어 기술이 녹습니다."],
    ["If the tool fails or disappears, no one catches the error, because the skill that should have caught it is the rusted one.","도구가 틀리거나 사라지면 아무도 오류를 잡지 못한다. 오류를 잡았어야 할 기술이 바로 녹슨 기술이기 때문이다.",1,"맞습니다. 슬라이드 34쪽의 결론 문장입니다."]],
 e:"탈숙련화 루프: 도구가 대신 함 → 연습 감소 → 기술 녹슮 → 판단 불가 → 더 의존 → 처음으로. 위험은 도구가 실패했을 때 드러납니다."},
{id:"1-1-06",s:"1-1",t:"mc",
 q:"Which were presented as NEGATIVE sides of AI in our lives?",
 k:"우리 삶 속 AI의 '부정적인 면'으로 제시된 것을 모두 고르시오.",
 o:[["Deepfakes that put one person's face onto another person's movements.","한 사람의 움직임에 다른 사람의 얼굴을 입히는 딥페이크.",1,"맞습니다(33쪽)."],
    ["A realistic generated image of a famous CEO eating ramen in the Soongsil cafeteria, usable as fake news.","유명 CEO가 숭실대 학식에서 라면을 먹는 진짜 같은 생성 이미지 — 가짜 뉴스에 쓰일 수 있음.",1,"맞습니다. 같은 사진이 31쪽에선 신기한 기술, 32쪽에선 부정적인 면으로 쓰였습니다."],
    ["Deskilling.","탈숙련화.",1,"맞습니다(34쪽)."],
    ["Music recommendation systems.","음악 추천 시스템.",0,"틀렸습니다. 추천은 '우리 삶 속의 AI' 긍정 사례(27쪽)로 소개됐습니다."],
    ["Smartphone crash detection that automatically calls rescuers.","구조대를 자동으로 부르는 스마트폰 충돌 감지.",0,"틀렸습니다. 스마트 헬스케어 사례(29쪽)로 긍정적인 쪽입니다."]],
 e:"부정적인 면(32~34쪽): 이미지 생성(가짜 사진), 딥페이크, 탈숙련화. 추천·자율주행·헬스케어·ChatGPT·이미지 생성은 '우리 삶 속의 AI' 사례였습니다."},
{id:"1-1-07",s:"1-1",t:"sa",
 q:"Which of the four classic approaches to AI does this course adopt? (two words)",
 k:"AI의 네 가지 고전적 관점 중 이 수업이 택한 것은? (두 단어)",
 a:["acting rationally","act rationally","actrationally","rational agent","rationalagent","합리적으로행동하기","합리적행동"],show:"acting rationally",
 e:"이 수업은 '합리적으로 행동하기(acting rationally)', 즉 합리적 에이전트 관점을 택합니다. 목표를 가장 잘 달성할 것으로 기대되는 행동을 고르는 것이 기준입니다."},
{id:"1-1-08",s:"1-1",t:"sa",
 q:"Relying on a tool reduces practice, which makes your skills rust. What is this phenomenon called? (one word)",
 k:"도구에 의존하면 연습이 줄어 기술이 녹슨다. 이 현상을 무엇이라고 하는가? (한 단어)",
 a:["deskilling","de-skilling","탈숙련화"],show:"deskilling",
 e:"탈숙련화(deskilling) 루프입니다. 도구가 틀리거나 사라졌을 때 그 오류를 잡을 기술이 이미 녹슬어 있다는 것이 위험입니다."},
{id:"1-1-09",s:"1-1",t:"sa",
 q:"What is the commonly used abbreviation for the course textbook, \"Artificial Intelligence: A Modern Approach\"?",
 k:"이 수업 교재 『Artificial Intelligence: A Modern Approach』를 흔히 무엇이라고 줄여 부르는가?",
 a:["AIMA"],show:"AIMA",
 e:"Russell과 Norvig의 교재로, 전 세계 AI 입문 수업에서 가장 많이 쓰이며 AIMA라고 줄여 부릅니다. 강의는 UC 버클리 CS188을 바탕으로 합니다."},

/* ===================== 1-2 ===================== */
{id:"1-2-01",s:"1-2",t:"mc",
 q:"Which pairs correctly map a part of a biological neuron to an element of an artificial neural network?",
 k:"생물학적 뉴런의 부분과 인공신경망의 요소를 올바르게 짝지은 것을 모두 고르시오.",
 o:[["Dendrites → inputs","수상돌기 → 입력",1,"맞습니다. 수상돌기는 신호를 받는 '입력' 안테나입니다."],
    ["Axon → output","축삭 → 출력",1,"맞습니다. 축삭은 처리된 신호를 내보내는 '출력' 케이블입니다."],
    ["Synapse → weight","시냅스 → 가중치",1,"맞습니다. 연결 강도가 가중치에 해당합니다."],
    ["Neuron → weight","뉴런 → 가중치",0,"틀렸습니다. 뉴런은 노드(node)에 대응합니다."],
    ["Axon → input","축삭 → 입력",0,"틀렸습니다. 축삭은 출력입니다."]],
 e:"뉴런→노드, 수상돌기→입력, 축삭→출력, 시냅스→가중치. 이런 노드를 여러 층 쌓으면 심층 신경망(DNN)입니다."},
{id:"1-2-02",s:"1-2",t:"mc",
 q:"According to the lecture, why do large language models hallucinate?",
 k:"강의에 따르면 거대 언어 모델(LLM)이 환각을 일으키는 이유는 무엇인가? 모두 고르시오.",
 o:[["They are trained to predict the words people would plausibly write next, not to check whether something really happened.","사람들이 다음에 쓸 법한 단어를 예측하도록 훈련됐지, 그 일이 실제로 있었는지 확인하도록 훈련되지 않았다.",1,"맞습니다. 이유 ① '그럴듯함이 목표다'."],
    ["There is no separate 'I don't know' signal, so gaps are usually filled with whatever plausibly fits.","'모르겠다'는 별도 신호가 없어서, 빈틈은 보통 그럴듯한 내용으로 채워진다.",1,"맞습니다. 이유 ② '빈칸은 선택지가 아니다'."],
    ["The form survives while the facts disappear — a wrong citation can still have a plausible author, journal, and year.","형식은 살아남고 사실은 사라진다 — 틀린 인용도 저자·학술지·연도는 그럴듯하다.",1,"맞습니다. 이유 ③."],
    ["The model knowingly lies in order to please the user.","모델이 사용자를 기쁘게 하려고 알면서 거짓말을 한다.",0,"틀렸습니다. 환각은 '무언가 빠져 있다는 감각 없이' 만들어집니다. 의도적인 거짓말이 아닙니다."],
    ["Hallucination is a defect unique to machines with no counterpart in the human brain.","환각은 기계에만 있는 결함이며 인간의 뇌에는 비슷한 현상이 없다.",0,"틀렸습니다. 뇌도 맹점을 채우고 기억을 작화합니다. '환각은 기계만의 결함이 아니다.'"]],
 e:"환각 = 그럴듯하지만 사실이 아닌, 유창하고 자신감 있는 답변. 세 원인: 그럴듯함이 목표, '모른다' 신호 없음, 형식만 살아남음."},
{id:"1-2-03",s:"1-2",t:"mc",
 q:"Which are human-brain counterparts of AI hallucination mentioned in the lecture?",
 k:"강의에서 언급한, AI 환각에 대응하는 인간 뇌의 현상을 모두 고르시오.",
 o:[["The brain fills in the retina's blind spot with the surrounding pattern, and we never notice.","뇌는 망막의 맹점을 주변 패턴으로 채우고, 우리는 결코 알아채지 못한다.",1,"맞습니다. AI가 학습 데이터의 빈틈을 채우는 것에 대응합니다."],
    ["Split-brain patients give detailed but false explanations (confabulation), without lying.","분리뇌 환자는 자세하지만 거짓인 설명을 한다(작화). 거짓말이 아니다.",1,"맞습니다. AI가 완전한 자신감으로 보고하는 것에 대응합니다."],
    ["Perception is a guess that the senses keep updating — the brain predicts and is then corrected.","지각은 감각이 계속 갱신하는 추측이다 — 뇌는 예측하고 그다음 교정받는다.",1,"맞습니다. AI도 근거 확인·검색·사람 피드백으로 교정받습니다."],
    ["Split-brain patients deliberately lie because they know their story is false.","분리뇌 환자는 자기 이야기가 거짓임을 알기 때문에 일부러 거짓말을 한다.",0,"틀렸습니다. 슬라이드는 '거짓말이 아니다'라고 명시합니다."],
    ["The human retina has no blind spot, so humans never fill in missing information.","인간의 망막에는 맹점이 없어서 인간은 빠진 정보를 채우지 않는다.",0,"틀렸습니다. 망막에는 실제로 구멍(맹점)이 있습니다."]],
 e:"결론: 환각은 불완전한 증거로 답해야 하면서 증거가 빠졌다는 것을 알 수 없는 모든 시스템이 하는 일입니다. 그래서 모델을 열어 보는 것이 우리 자신에 대해 무언가를 알려 줍니다."},
{id:"1-2-04",s:"1-2",t:"mc",
 q:"Which pairs of year and event in AI history are correct?",
 k:"AI 역사에서 연도와 사건이 올바르게 짝지어진 것을 모두 고르시오.",
 o:[["1943 — McCulloch & Pitts create the first mathematical model of a neuron.","1943 — 맥컬럭과 피츠가 뉴런의 최초 수학 모델을 만듦.",1,"맞습니다. '전자 두뇌'."],
    ["1957 — Rosenblatt's perceptron learns weights automatically.","1957 — 로젠블랫의 퍼셉트론이 가중치를 자동으로 학습.",1,"맞습니다."],
    ["1969 — Minsky & Papert show the perceptron cannot learn XOR, leading to the first neural-network winter.","1969 — 민스키와 페퍼트가 퍼셉트론이 XOR을 배우지 못함을 보임 → 첫 번째 신경망 겨울.",1,"맞습니다."],
    ["1986 — Google introduces the Transformer architecture.","1986 — 구글이 트랜스포머 구조를 발표.",0,"틀렸습니다. 1986년은 역전파(backpropagation) 대중화, 트랜스포머는 2017년입니다."],
    ["2012 — AlexNet wins the ImageNet competition by a huge margin, using GPUs.","2012 — AlexNet이 GPU를 써서 ImageNet 대회에서 압도적 격차로 우승.",1,"맞습니다. 딥러닝의 첫 번째 큰 성과입니다."]],
 e:"1943 인공 뉴런 → 1957 퍼셉트론 → 1969 XOR(첫 겨울) → 1986 역전파 → 1987–93 겨울 → 2009 ImageNet → 2012 AlexNet → 2016 알파고 → 2017 트랜스포머 → 2020년대 LLM·생성형 AI."},
{id:"1-2-05",s:"1-2",t:"mc",
 q:"Which statements about weak AI and strong AI are correct?",
 k:"약한 AI와 강한 AI에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Weak AI is a claim about behavior: it is settled by observing what the machine does.","약한 AI는 행동에 관한 주장이며, 기계가 하는 일을 관찰하면 판정된다.",1,"맞습니다."],
    ["Strong AI is a claim about consciousness: no behavior can settle it.","강한 AI는 의식에 관한 주장이며, 어떤 행동으로도 판정할 수 없다.",1,"맞습니다."],
    ["The Turing test is the representative discussion for weak AI.","튜링 테스트는 약한 AI의 대표적 논의다.",1,"맞습니다. 중국어 방은 강한 AI 쪽입니다."],
    ["The Chinese Room argument was proposed by Alan Turing in 1950.","중국어 방 논증은 1950년 앨런 튜링이 제안했다.",0,"틀렸습니다. 중국어 방은 철학자 존 설(John Searle)이 1980년에 제안했습니다. 1950년은 튜링 테스트입니다."],
    ["The Systems Reply says understanding is a property of the whole system (person + rulebook + room), not of any single part.","시스템 응답은 이해가 어느 한 부품이 아니라 전체 시스템(사람+규칙책+방)의 속성이라고 말한다.",1,"맞습니다. 뉴런 하나는 한국어를 모르지만 우리는 이해하는 것과 같습니다."]],
 e:"약한 AI = '지능이 있는 것처럼 행동' (관찰로 판정, 튜링 테스트). 강한 AI = '실제로 생각하고 의식이 있음' (행동으로 판정 불가, 중국어 방). 시스템 응답은 중국어 방에 대한 반론입니다."},
{id:"1-2-06",s:"1-2",t:"mc",
 q:"In the review quiz \"Which of the following can be done at present?\", which tasks were marked as currently possible (✓)?",
 k:"복습 퀴즈 \"다음 중 현재 가능한 것은?\"에서 현재 가능(✓)으로 표시된 과제를 모두 고르시오.",
 o:[["Beat the best human at Go.","최고의 인간을 상대로 바둑에서 이기기.",1,"맞습니다(✓). 2016 알파고."],
    ["Unload any dishwasher in any home.","어떤 집의 어떤 식기세척기든 그릇 꺼내기.",0,"틀렸습니다(✗). 집마다 구조와 그릇이 달라 일반화된 물리적 행동이 필요합니다."],
    ["Translate spoken Chinese into spoken English in real time.","중국어 말을 실시간으로 영어 말로 통역하기.",1,"맞습니다(✓)."],
    ["Perform a complex surgical operation.","복잡한 수술 집도하기.",0,"틀렸습니다(✗)."],
    ["Buy a week's worth of groceries on the web.","일주일치 장보기를 인터넷으로 하기.",1,"맞습니다(✓). 실제 마트에서 하는 것은 ✗입니다."]],
 e:"✗로 표시된 과제(식기세척기, 실제 마트 장보기, 수술, 건물 짓기)의 공통점은 '일반화된 물리적 행동이 필요함'입니다. 처음 가는 도시 도로 운전은 △였습니다."},
{id:"1-2-07",s:"1-2",t:"mc",
 q:"Which pairs correctly match a human ability (where human cognition still leads) with its name on the AI side?",
 k:"인간이 아직 앞서는 능력과 AI 쪽 이름이 올바르게 짝지어진 것을 모두 고르시오.",
 o:[["Imagination → world model","상상력 → 월드 모델",1,"맞습니다. 주어진 것 너머로 펼치기(Genie 3)."],
    ["Intuition → zero-shot inference","직관 → 제로샷 추론",1,"맞습니다. 한눈에 알아채기."],
    ["Association → inpainting","연상 → 인페인팅",1,"맞습니다. 조각으로부터 전체를 재구성하기."],
    ["Spatial ability → zero-shot inference","공간 능력 → 제로샷 추론",0,"틀렸습니다. 공간 능력은 깊이 추정(depth estimation)입니다."],
    ["Comprehension → inpainting","이해력 → 인페인팅",0,"틀렸습니다. 이해력은 의미 이해(semantic understanding)입니다."]],
 e:"상상력–월드 모델, 직관–제로샷, 이해력–의미 이해, 공간 능력–깊이 추정, 연상–인페인팅. 인간은 문제가 열려 있는 곳에서 여전히 앞섭니다."},
{id:"1-2-08",s:"1-2",t:"mc",
 q:"Which of the following were associated with an AI or neural-network 'winter' in the lecture's timeline?",
 k:"강의 연표에서 AI 또는 신경망 '겨울'과 연결된 것을 모두 고르시오.",
 o:[["The 1969 finding that the perceptron cannot learn XOR.","퍼셉트론이 XOR을 학습할 수 없다는 1969년의 지적.",1,"맞습니다. 첫 번째 신경망 겨울의 계기입니다."],
    ["The collapse of research funding in 1987–93.","1987–93년 연구 자금의 붕괴.",1,"맞습니다. 두 번째 겨울입니다."],
    ["AlexNet in 2012.","2012년 AlexNet.",0,"틀렸습니다. 딥러닝 부흥(호황)의 계기입니다."],
    ["The Transformer in 2017.","2017년 트랜스포머.",0,"틀렸습니다. 오늘날 LLM의 기반이 된 호황 쪽 사건입니다."],
    ["ImageNet in 2009.","2009년 ImageNet.",0,"틀렸습니다. 빅데이터를 제공해 부흥을 이끈 사건입니다."]],
 e:"두 번의 겨울은 1969 XOR 이후와 1987–93입니다. 둘 다 '기대가 기술을 앞질러 달렸기 때문'이고, 이번엔 빅데이터·GPU·트랜스포머가 뒷받침해 살아남았습니다."},
{id:"1-2-09",s:"1-2",t:"sa",
 q:"An artificial neuron outputs max{0, A × Age + B × Weight}. With A = 0.5, B = 0.2, Age = 20 and Weight = 60, what is the output?",
 k:"인공 뉴런의 출력은 max{0, A × 나이 + B × 몸무게}이다. A = 0.5, B = 0.2, 나이 = 20, 몸무게 = 60이면 출력은?",
 a:["22","22.0"],show:"22",
 e:"0.5 × 20 + 0.2 × 60 = 10 + 12 = 22. 양수이므로 그대로 22. (음수였다면 0 — 이 '음수면 0' 규칙이 ReLU입니다.)"},
{id:"1-2-10",s:"1-2",t:"sa",
 q:"Which simple logical function could a single-layer perceptron NOT learn, as Minsky & Papert pointed out in 1969? (one word)",
 k:"1969년 민스키와 페퍼트가 지적한, 단층 퍼셉트론이 학습할 수 없었던 간단한 논리 함수는? (한 단어)",
 a:["XOR","exclusive or","exclusiveor","배타적논리합"],show:"XOR",
 e:"XOR은 둘 중 하나만 참일 때 참입니다. 네 점이 대각선으로 엇갈려 직선 하나로 나눌 수 없어 퍼셉트론이 풀지 못했고, 첫 번째 신경망 겨울을 불렀습니다. 1986년 역전파로 다층망을 학습하면서 해결됐습니다."},
{id:"1-2-11",s:"1-2",t:"sa",
 q:"Who proposed the Chinese Room argument in 1980?",
 k:"1980년 '중국어 방' 논증을 제안한 사람은?",
 a:["John Searle","Searle","존설","설"],show:"John Searle",
 e:"철학자 존 설(John Searle)입니다. 규칙책대로 기호만 조작하는 방 안의 사람은 중국어를 이해하지 못한다 → 컴퓨터도 이해 없이 대응표일 뿐일 수 있다는 강한 AI 비판입니다."},
{id:"1-2-12",s:"1-2",t:"sa",
 q:"Which training method, popularized in 1986 by Rumelhart, Hinton and Williams, made it possible to train multi-layer neural networks?",
 k:"1986년 럼멜하트·힌튼·윌리엄스가 대중화해 다층 신경망 학습을 가능하게 한 방법은?",
 a:["backpropagation","back propagation","backprop","역전파"],show:"backpropagation",
 e:"역전파(backpropagation)는 최종 결과가 얼마나 틀렸는지를 뒤쪽 층에서 앞쪽 층으로 거슬러 전달하며 각 가중치를 얼마나 바꿀지 계산합니다. 이로써 XOR 문제가 해결됐습니다."},
/* ===================== 2-1 ===================== */
{id:"2-1-01",s:"2-1",t:"mc",
 q:"Which statements about agents are correct?",
 k:"에이전트에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["An agent perceives its environment through sensors.","에이전트는 센서를 통해 환경을 지각한다.",1,"맞습니다."],
    ["An agent acts upon its environment through actuators.","에이전트는 액추에이터를 통해 환경에 행동한다.",1,"맞습니다."],
    ["A softbot, whose whole world is inside a machine (sensors read files and packets, actuators write them), can be an agent.","세계 전체가 기계 안에 있는 소프트봇(센서는 파일·패킷을 읽고, 액추에이터는 그것을 씀)도 에이전트가 될 수 있다.",1,"맞습니다. 스팸 필터가 대표 예입니다."],
    ["Only physical robots with a body count as agents.","몸을 가진 물리적 로봇만 에이전트에 해당한다.",0,"틀렸습니다. 입력→결정→출력 구조라면 소프트웨어도 에이전트입니다."],
    ["A thermostat is an example of a controller in a closed-loop system.","온도조절기는 폐루프 시스템의 제어기(controller)의 예다.",1,"맞습니다. 사람 개입 없이 상태를 감지해 원하는 상태로 보정합니다."]],
 e:"에이전트 = 센서로 지각하고 액추에이터로 행동하는 모든 것. 사람, 로봇, 온도조절기(제어기), 스팸 필터(소프트봇) 모두 해당합니다."},
{id:"2-1-02",s:"2-1",t:"mc",
 q:"Which statements about the agent function and the agent program are correct?",
 k:"에이전트 함수와 에이전트 프로그램에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The agent function maps percept sequences to actions: f : P* → A.","에이전트 함수는 지각 순열을 행동으로 대응시킨다: f : P* → A.",1,"맞습니다. P*는 지금까지의 모든 지각의 나열입니다."],
    ["The agent program is the concrete implementation that produces the agent function.","에이전트 프로그램은 에이전트 함수를 만들어 내는 구체적인 구현이다.",1,"맞습니다."],
    ["In the vacuum world, a table that tabulates the agent function grows without bound as time goes on.","진공청소기 세계에서 에이전트 함수를 표로 적으면 시간이 지날수록 끝없이 커진다.",1,"맞습니다. 4 + 4² + … 줄로 늘어납니다."],
    ["The three-line reflex vacuum program looks at the entire percept history to choose an action.","3줄짜리 반사 청소기 프로그램은 행동을 고를 때 지각 이력 전체를 본다.",0,"틀렸습니다. 가장 최근 지각 [위치, 상태] 하나만 봅니다."],
    ["Two different programs can never implement the same agent function.","서로 다른 두 프로그램이 같은 에이전트 함수를 구현하는 것은 불가능하다.",0,"틀렸습니다. 같은 함수(같은 동작)도 전혀 다른 코드·회로로 구현할 수 있습니다(자판기 예)."]],
 e:"함수 = '무엇을 할지'의 수학적 명세(표), 프로그램 = 그것을 실제로 계산하는 코드. 표는 무한히 커지므로 짧은 프로그램으로 같은 행동을 내는 것이 목표입니다."},
{id:"2-1-03",s:"2-1",t:"mc",
 q:"According to the lecture, what does whether an agent is rational depend on?",
 k:"강의에 따르면 에이전트가 합리적인지는 무엇에 달려 있는가? 모두 고르시오.",
 o:[["The performance measure that defines the criterion of success.","성공의 기준을 정의하는 성능 척도.",1,"맞습니다(1번)."],
    ["The agent's prior knowledge of the environment.","환경에 대한 에이전트의 사전 지식.",1,"맞습니다(2번)."],
    ["The actions the agent can perform.","에이전트가 수행할 수 있는 행동.",1,"맞습니다(3번)."],
    ["The agent's percept sequence to date.","지금까지 에이전트의 지각 순열(이력).",1,"맞습니다(4번)."],
    ["The actual outcome that happens after the action is taken.","행동 후 실제로 일어난 결과.",0,"틀렸습니다. 합리성은 결정 시점의 정보로 판단합니다. 결과로 평가하면 전지(omniscience)를 요구하는 것입니다."]],
 e:"합리성의 4요소: 성능 척도, 사전 지식, 가능한 행동, 지각 순열. 넷 중 하나라도 바뀌면 올바른 행동도 바뀔 수 있습니다."},
{id:"2-1-04",s:"2-1",t:"mc",
 q:"Which statements correctly describe what rationality is NOT (or what it is)?",
 k:"'합리성이 아닌 것'(또는 합리성의 성격)을 올바르게 설명한 것을 모두 고르시오.",
 o:[["Rationality is not omniscience: the agent cannot know how things will actually turn out.","합리성은 전지가 아니다: 일이 실제로 어떻게 될지 알 수 없다.",1,"맞습니다."],
    ["Rationality maximizes expected performance, while perfection maximizes actual performance.","합리성은 기대 성능을 최대화하고, 완벽함은 실제 성능을 최대화한다.",1,"맞습니다. 슬라이드의 대비 그대로입니다."],
    ["A rational agent should stay passive and avoid gathering extra information.","합리적 에이전트는 수동적으로 있으며 추가 정보 수집을 피해야 한다.",0,"틀렸습니다. 합리성은 수동적이지 않습니다. 정보를 수집하고, 배우고, 모르는 것을 탐험해야 합니다."],
    ["Rationality is bounded by available memory, computation, and sensors.","합리성은 사용 가능한 메모리, 계산 능력, 센서에 의해 제한된다.",1,"맞습니다. '무제한이 아니다'."],
    ["If you cross an empty street and a cargo door falling from a plane hits you, crossing was irrational.","아무것도 오지 않는 길을 건너다 비행기에서 떨어진 화물칸 문에 맞았다면, 길을 건넌 것은 비합리적이었다.",0,"틀렸습니다. 슬라이드의 답은 '아니오'. 결정 당시의 정보로는 최선이었습니다."]],
 e:"합리성은 이상(ideal)입니다: 전지 X, 완벽 X(기대 vs 실제), 수동 X(정보 수집·학습·탐험), 무제한 X(자원의 한계)."},
{id:"2-1-05",s:"2-1",t:"mc",
 q:"Which statements about designing a performance measure are correct?",
 k:"성능 척도 설계에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Design the measure around what you want the world to look like, not around how you imagine the agent should behave.","척도는 에이전트가 어떻게 행동해야 한다고 상상하는 방식이 아니라, 원하는 세상의 모습을 중심으로 설계하라.",1,"맞습니다. 슬라이드 16쪽의 규칙입니다."],
    ["Scoring a vacuum by the amount of dirt collected per shift can lead a smart agent to dump dirt back out and clean it again.","청소기를 근무 시간당 모은 먼지 양으로 채점하면 똑똑한 에이전트가 먼지를 다시 쏟고 또 치울 수 있다.",1,"맞습니다. '에이전트는 우리가 요청한 것을 하고 있다. 그것이 문제다.'"],
    ["The performance measure evaluates the sequence of environment states produced, not merely how hard the agent moved.","성능 척도는 에이전트가 얼마나 열심히 움직였는지가 아니라 만들어진 환경 상태들의 순서를 평가한다.",1,"맞습니다."],
    ["The English tutor's performance measure in the lecture is the student's accuracy on today's practice problems.","강의에서 영어 튜터의 성능 척도는 오늘 푼 연습 문제의 정답률이다.",0,"틀렸습니다. '학생의 나중 시험 점수'입니다. 오늘 정답률로 하면 쉬운 문제만 내서 점수를 부풀릴 수 있습니다."],
    ["Writing down the conflicts between performance measures (e.g., fast vs. safe) is not part of the specification.","성능 척도 사이의 충돌(예: 빠름 vs 안전)을 적어 두는 것은 명세의 일부가 아니다.",0,"틀렸습니다. '충돌을 명시하는 것도 명세의 일부다.'"]],
 e:"기계는 우리가 적어 놓은 것을 최적화합니다(→ LLM 환각도 같은 교훈). 그러니 척도는 원하는 결과(깨끗한 바닥)로 정해야 합니다."},
{id:"2-1-06",s:"2-1",t:"mc",
 q:"Which statements about PEAS are correct?",
 k:"PEAS에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["P stands for Performance measure.","P는 성능 척도(Performance measure)다.",1,"맞습니다."],
    ["E stands for Environment.","E는 환경(Environment)이다.",1,"맞습니다."],
    ["S stands for Strategy.","S는 전략(Strategy)이다.",0,"틀렸습니다. S는 센서(Sensors)입니다."],
    ["The first step in designing an agent should always be to specify the task environment as fully as possible.","에이전트를 설계할 때 첫 단계는 언제나 과업 환경을 가능한 한 완전하게 명세하는 것이어야 한다.",1,"맞습니다. PEAS = 과업 환경."],
    ["The hardest box to fill is almost always A (Actuators).","가장 채우기 어려운 칸은 거의 항상 A(액추에이터)다.",0,"틀렸습니다. 가장 어려운 칸은 거의 항상 P(성능 척도)입니다."]],
 e:"PEAS = Performance, Environment, Actuators, Sensors. 합리성이 의존하는 것들을 적어 둔 것으로, 설계의 1단계입니다. 실습: 일부러 게이밍 가능한 P를 만들어 보고 고쳐라."},
{id:"2-1-07",s:"2-1",t:"mc",
 q:"For the automated taxi driver, which items are placed in the correct PEAS category?",
 k:"자동화된 택시 운전사의 PEAS에서 올바른 범주에 놓인 항목을 모두 고르시오.",
 o:[["Steering wheel, accelerator, brake — Actuators","핸들, 가속 페달, 브레이크 — 액추에이터",1,"맞습니다."],
    ["Cameras, radar, LiDAR — Sensors","카메라, 레이더, 라이다 — 센서",1,"맞습니다."],
    ["Safe, fast, legal, profitable — Performance measure","안전, 빠름, 합법, 수익성 — 성능 척도",1,"맞습니다."],
    ["GPS — Actuators","GPS — 액추에이터",0,"틀렸습니다. GPS는 위치를 관찰하는 센서입니다."],
    ["Pedestrians and police — Sensors","보행자와 경찰 — 센서",0,"틀렸습니다. 보행자·경찰은 환경(Environment)입니다."]],
 e:"택시 PEAS — P: 안전·빠름·합법·쾌적·수익·배려 / E: 도로·교통·보행자·경찰·손님·날씨 / A: 핸들·가속·브레이크·방향지시등·경적·화면 / S: 카메라·레이더·라이다·속도계·GPS·엔진 센서·가속도계·마이크."},
{id:"2-1-08",s:"2-1",t:"mc",
 q:"The simple 3-line vacuum agent is rational under the lecture's stated assumptions. Which changes to the assumptions would make it no longer the best choice?",
 k:"3줄짜리 단순 청소기 에이전트는 강의의 가정 아래에서 합리적이다. 가정을 어떻게 바꾸면 더 이상 최선이 아니게 되는가? 모두 고르시오.",
 o:[["Each movement costs a penalty point.","이동할 때마다 벌점이 있다.",1,"맞습니다. 다 치운 뒤에도 A↔B를 계속 왕복하므로 손해. '다 치웠으면 NoOp'이 더 좋고, 그러려면 기억이 필요합니다."],
    ["The room layout is unknown (not just two squares A and B).","방의 배치를 모른다(A, B 두 칸이 아님).",1,"맞습니다. 탐험이 필요해집니다."],
    ["The score is 1 point per clean square per time step over 1000 steps.","1000 시간 단계 동안 매 단계 깨끗한 칸 하나당 1점이다.",0,"틀렸습니다. 이것은 원래 가정 그대로입니다."],
    ["The layout (two squares) is known in advance.","배치(두 칸)가 미리 알려져 있다.",0,"틀렸습니다. 원래 가정입니다."],
    ["The available actions are Left, Right, Suck, NoOp.","가능한 행동은 Left, Right, Suck, NoOp이다.",0,"틀렸습니다. 원래 가정입니다."]],
 e:"원래 가정에서는 '더 잘할 수 있는 일이 없으므로' 합리적입니다. 하지만 가정을 바꾸면 판정도 바뀝니다 → 합리성은 에이전트와 환경 사이의 '관계'입니다."},
{id:"2-1-09",s:"2-1",t:"sa",
 q:"Action A gives 10 gold with probability 1. Action B gives 100 gold with probability 0.2 and 0 gold with probability 0.8. What is the expected value of action B?",
 k:"행동 A는 확률 1로 10골드. 행동 B는 확률 0.2로 100골드, 확률 0.8로 0골드. 행동 B의 기댓값은?",
 a:["20","20.0","20gold"],show:"20",
 e:"E(U|B) = 0.2 × 100 + 0.8 × 0 = 20. A의 기댓값 10보다 크므로 argmax 규칙에 따라 합리적 에이전트는 B를 고릅니다(실제로 꽝이 나와도 선택은 합리적)."},
{id:"2-1-10",s:"2-1",t:"sa",
 q:"What do the four letters of PEAS stand for? (write all four words)",
 k:"PEAS의 네 글자는 각각 무엇의 약자인가? (네 단어 모두 쓰기)",
 kw:[["perform","성능"],["environ","환경"],["actuat","액추에이터","구동기"],["sensor","센서"]],show:"Performance measure, Environment, Actuators, Sensors",
 e:"P = Performance measure(성능 척도), E = Environment(환경), A = Actuators(액추에이터), S = Sensors(센서). 이 묶음이 과업 환경입니다."},
{id:"2-1-11",s:"2-1",t:"sa",
 q:"In the vacuum world (two squares), the score is 1 point per clean square per time step over 1000 time steps. What is the maximum possible score?",
 k:"진공청소기 세계(두 칸)에서 1000 시간 단계 동안 매 단계 깨끗한 칸 하나당 1점을 준다. 가능한 최대 점수는?",
 a:["2000","2,000"],show:"2000",
 e:"1000 단계 × 2칸 = 2000점. 점수는 '청소한 횟수'가 아니라 '깨끗한 상태가 유지된 칸 수'라서 빨리 치울수록 점수가 높습니다."},
{id:"2-1-12",s:"2-1",t:"sa",
 q:"Fill in the blank: a rational agent chooses a = ______ over a ∈ A of E(U|a). (the operator that returns the input achieving the maximum)",
 k:"빈칸 채우기: 합리적 에이전트는 a = ______ E(U|a) (a ∈ A)를 고른다. (최댓값을 만드는 입력을 돌려주는 연산)",
 a:["argmax","arg max"],show:"argmax",
 e:"argmax는 '최댓값 자체'가 아니라 '최댓값을 만드는 행동'을 돌려줍니다. E(U|a) = Σ 결과 U × P (결과별 효용 × 확률의 합)."},

/* ===================== 2-2 ===================== */
{id:"2-2-01",s:"2-2",t:"mc",
 q:"Which statements about observability are correct?",
 k:"관찰 가능성에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Chess is fully observable.","체스는 완전 관찰 가능하다.",1,"맞습니다. 판 위 모든 말의 위치가 보입니다."],
    ["Poker is partially observable.","포커는 부분 관찰 가능하다.",1,"맞습니다. 상대 카드가 보이지 않습니다."],
    ["Noisy or inaccurate sensors can make an environment partially observable.","잡음이 많거나 부정확한 센서 때문에 환경이 부분 관찰 가능해질 수 있다.",1,"맞습니다."],
    ["'Fully observable' means the sensors deliver every detail of the entire world, including irrelevant details.","'완전 관찰 가능'은 센서가 관련 없는 세부까지 포함해 세상 전체의 모든 것을 전달한다는 뜻이다.",0,"틀렸습니다. 핵심은 '결정에 관련된' 모든 것을 매 단계 전달하는가입니다."],
    ["In a partially observable environment, the agent needs memory.","부분 관찰 가능한 환경에서 에이전트는 기억이 필요하다.",1,"맞습니다. '환경이 설계를 결정한다' 슬라이드의 첫 항목입니다."]],
 e:"완전 관찰 = 센서가 결정에 관련된 모든 것을 매 단계 전달. 부분 관찰 = 관련된 무언가가 숨겨져 있음(잡음 센서, 감지 안 되는 상태)."},
{id:"2-2-02",s:"2-2",t:"mc",
 q:"Which statements about deterministic, nondeterministic and stochastic environments are correct?",
 k:"결정적, 비결정적, 확률적 환경에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Deterministic: the next state is completely determined by the current state and the action(s) executed.","결정적: 다음 상태가 현재 상태와 실행된 행동에 의해 완전히 결정된다.",1,"맞습니다."],
    ["Nondeterministic: several outcomes are possible, and no probabilities are attached (\"it might rain\").","비결정적: 여러 결과가 가능하고, 확률을 붙이지 않는다(\"비가 올지도\").",1,"맞습니다."],
    ["\"25% chance of rain\" describes a stochastic model.","\"비 올 확률 25%\"는 확률적 모델을 묘사한다.",1,"맞습니다."],
    ["If the environment is partially observable, a deterministic environment can appear nondeterministic.","환경이 부분 관찰 가능하면 결정적인 환경도 비결정적인 것처럼 보일 수 있다.",1,"맞습니다. '세상이 주사위를 굴리는 게 아니라 판 전체를 못 볼 뿐'."],
    ["Backgammon is deterministic because the whole board is visible.","백개먼은 판 전체가 보이므로 결정적이다.",0,"틀렸습니다. 판은 다 보이지만(완전 관찰) 주사위 때문에 확률적입니다. 관찰성과 결정성은 독립된 축입니다."]],
 e:"비결정적 vs 확률적의 차이는 '가능성 목록만 있나, 확률 숫자까지 있나'. 확률이 있으면 기대 효용 계산이 가능해집니다."},
{id:"2-2-03",s:"2-2",t:"mc",
 q:"Which statements about static, dynamic and semidynamic environments are correct?",
 k:"정적, 동적, 준동적 환경에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A crossword puzzle is static: the world waits while you think, so thinking is free.","십자말풀이는 정적이다: 생각하는 동안 세상이 기다리므로 생각은 공짜다.",1,"맞습니다."],
    ["Chess with a clock is semidynamic.","시간 제한 체스는 준동적이다.",1,"맞습니다. 판은 그대로지만 점수(남은 시간)가 변합니다."],
    ["Driving is dynamic.","운전은 동적이다.",1,"맞습니다."],
    ["In a dynamic environment, not deciding is not a decision.","동적 환경에서 결정하지 않는 것은 결정이 아니다.",0,"틀렸습니다. 슬라이드: '결정하지 않는 것도 그 자체로 하나의 결정이다.'"],
    ["Semidynamic means the world changes while you deliberate, but your score does not.","준동적은 고민하는 동안 세상은 변하지만 점수는 변하지 않는다는 뜻이다.",0,"틀렸습니다. 반대입니다. 세상은 가만히 있지만 점수가 변합니다."]],
 e:"정적 = 세상이 기다림 / 동적 = 세상이 변함(느린 추론을 처벌 → 쓸 수 있는 알고리즘 제약) / 준동적 = 세상은 멈춰 있지만 점수는 흐름."},
{id:"2-2-04",s:"2-2",t:"mc",
 q:"Which statements about episodic/sequential and discrete/continuous environments are correct?",
 k:"에피소드적/순차적, 이산/연속 환경에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Spotting defective parts on an assembly line is episodic.","생산 라인에서 불량 부품을 가려내는 일은 에피소드적이다.",1,"맞습니다. 다음 에피소드는 당신이 무엇을 했는지 신경 쓰지 않습니다."],
    ["Chess is sequential.","체스는 순차적이다.",1,"맞습니다. 이번 결정이 이후 모든 결정을 형성합니다."],
    ["A crossword puzzle is sequential.","십자말풀이는 순차적이다.",1,"맞습니다. 한 칸에 쓴 단어가 교차하는 다른 칸의 답을 제약합니다."],
    ["Taxi driving is discrete.","택시 운전은 이산적이다.",0,"틀렸습니다. 위치·속도·핸들 각도·시간이 모두 연속입니다."],
    ["The discrete/continuous distinction applies to the state, to time, and to percepts/actions.","이산/연속 구분은 상태, 시간, 지각/행동에 적용된다.",1,"맞습니다. 세 가지에 동시에 적용됩니다."]],
 e:"에피소드적 = 지각·행동·끝(앞을 내다볼 필요 없음), 순차적 = 지금 결정이 미래에 영향. 이산/연속은 상태·시간·지각/행동 세 측면에서 묻습니다."},
{id:"2-2-05",s:"2-2",t:"mc",
 q:"Which statements about known vs. unknown environments are correct?",
 k:"알려진 환경 vs 모르는 환경에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Known/unknown is not really a property of the environment; it is about how much the agent or designer knows about the rules.","알려짐/모름은 사실 환경의 속성이 아니라, 에이전트나 설계자가 규칙을 얼마나 아는가에 관한 것이다.",1,"맞습니다."],
    ["Poker is known (we know the rules) but partially observable.","포커는 알려진(규칙을 앎) 환경이지만 부분 관찰 가능하다.",1,"맞습니다. 관찰 가능성과 알려짐은 다른 축입니다."],
    ["The performance measure itself can be unknown, e.g., a taxi not knowing whether the passenger wants speed or comfort.","성능 척도 자체를 모를 수도 있다. 예: 택시가 승객이 빠름을 원하는지 편안함을 원하는지 모름.",1,"맞습니다."],
    ["'Known' means the same thing as 'fully observable'.","'알려짐'은 '완전 관찰 가능'과 같은 뜻이다.",0,"틀렸습니다. 관찰 가능성은 현재 상태가 보이는가, 알려짐은 규칙을 아는가입니다."],
    ["An unknown performance measure quietly turns a single-agent problem into a fully deterministic one.","성능 척도를 모르면 단일 에이전트 문제가 조용히 완전 결정적인 문제로 바뀐다.",0,"틀렸습니다. 슬라이드는 '다중 에이전트에 가까운 것'으로 바뀐다고 말합니다(승객의 선호를 추측해야 하므로)."]],
 e:"사막 지프를 서울 도로에 두면 모든 게 보여도 규칙(신호등·횡단보도)은 모릅니다. 규칙을 모르면 탐험, 성능 척도를 모르면 사람에게서 배워야 합니다."},
{id:"2-2-06",s:"2-2",t:"mc",
 q:"Which statements about single-agent vs. multiagent, and competitive vs. cooperative environments are correct?",
 k:"단일/다중 에이전트, 경쟁적/협력적 환경에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The test is: is there another entity whose success depends on what you do?","판별법은 '내 행동에 따라 성공이 달라지는 다른 개체가 있는가?'이다.",1,"맞습니다."],
    ["A falling rock should be modeled as an agent.","떨어지는 바위는 에이전트로 모델링해야 한다.",0,"틀렸습니다. '무언가를 최대화하는 존재'로 모델링하는 게 유용할 때만 에이전트입니다."],
    ["Chess is competitive: the opponent's performance measure is the opposite of yours.","체스는 경쟁적이다: 상대의 성능 척도는 당신의 것과 정반대다.",1,"맞습니다."],
    ["In taxi driving, avoiding collisions maximizes every agent's performance measure, which is cooperative.","택시 운전에서 충돌 회피는 모든 에이전트의 성능 척도를 최대화하므로 협력적이다.",1,"맞습니다. 운전은 일부는 둘 다입니다(한 대만 들어갈 수 있는 주차 공간)."],
    ["In multiagent environments, communicating can never be rational.","다중 에이전트 환경에서 의사소통은 결코 합리적일 수 없다.",0,"틀렸습니다. 다중 에이전트는 의사소통하기와 예측 불가능하게 행동하기(포커)를 합리적으로 만듭니다."]],
 e:"다중 에이전트 환경은 경쟁/협력 두 맛이 있고 보통 섞여 있습니다. 이상한 두 가지 — 소통과 예측 불가능한 행동 — 이 합리적이 됩니다."},
{id:"2-2-09",s:"2-2",t:"mc",
 q:"\"The environment decides the design.\" Which pairs of environment property → requirement on the agent are correct?",
 k:"\"환경이 설계를 결정한다.\" 환경 속성 → 에이전트에 대한 요구가 올바르게 짝지어진 것을 모두 고르시오.",
 o:[["Partially observable → the agent needs memory.","부분 관찰 가능 → 에이전트는 기억이 필요하다.",1,"맞습니다."],
    ["Unknown rules → the agent must explore.","규칙을 모름 → 탐험해야 한다.",1,"맞습니다."],
    ["Static → there is time to compute a good decision.","정적 → 좋은 결정을 계산할 시간이 있다.",1,"맞습니다."],
    ["Continuous time → the agent becomes an always-running controller.","연속 시간 → 에이전트는 항상 돌아가는 제어기가 된다.",1,"맞습니다."],
    ["Unknown performance measure → the agent should ignore the people it serves.","성능 척도를 모름 → 에이전트는 자신이 봉사하는 사람을 무시해야 한다.",0,"틀렸습니다. 반대로 '자신이 봉사하는 사람에게서 배워야 한다'입니다."]],
 e:"각 속성은 하나의 요구를 만듭니다: 부분 관찰→기억, 비결정적→여러 가능성 대비, 다중→예측 불가능한 행동, 정적→계산할 시간, 연속 시간→상시 제어기, 규칙 모름→탐험, 척도 모름→사람에게서 배우기."},
{id:"2-2-10",s:"2-2",t:"sa",
 q:"Chess with a clock: the board does not change while you think, but your remaining time (score) does. What type of environment is this? (one word)",
 k:"시간 제한 체스: 생각하는 동안 판은 변하지 않지만 남은 시간(점수)은 변한다. 어떤 유형의 환경인가? (한 단어)",
 a:["semidynamic","semi-dynamic","semi dynamic","준동적"],show:"semidynamic",
 e:"준동적(semidynamic): 세상은 가만히 있지만 점수는 그렇지 않다. 시험장에서 문제 풀기도 비슷합니다."},
{id:"2-2-11",s:"2-2",t:"sa",
 q:"How many properties does the lecture use to classify any task environment? (a number)",
 k:"강의에서 과업 환경을 분류하는 데 쓰는 속성은 몇 가지인가? (숫자)",
 a:["7","seven","일곱","7가지"],show:"7",
 e:"7가지: 관찰 가능성, 에이전트 수, 결정성, 에피소드성, 정적/동적, 이산/연속, 알려짐/모름. 각각이 에이전트에게 요구를 만듭니다."},
{id:"2-2-12",s:"2-2",t:"sa",
 q:"Backgammon is fully observable, but because of the dice its next state is ______. (one word, the type of environment with probabilities attached)",
 k:"백개먼은 완전 관찰 가능하지만 주사위 때문에 다음 상태가 ______하다. (한 단어, 확률이 붙는 환경 유형)",
 a:["stochastic","확률적"],show:"stochastic",
 e:"확률적(stochastic). 판은 다 보이지만 결과가 확률적으로 정해집니다 → 관찰 가능성과 결정성은 독립된 축입니다."},
{id:"2-2-13",s:"2-2",t:"sa",
 q:"The environment is everything except the agent ______. (one word) — which is why even sensors and actuators count as part of the environment.",
 k:"환경은 에이전트 ______를 제외한 모든 것이다. (한 단어) — 그래서 센서와 액추에이터도 환경의 일부다.",
 a:["function","함수"],show:"function",
 e:"환경 = 에이전트 함수(지각→행동 대응)를 제외한 모든 것. 지각을 만들어 내는 카메라는 그 경계 바깥에 있으므로 1080p vs 720p 카메라 차이도 '환경 조건'입니다."},

/* ===================== 2-3 ===================== */
{id:"2-3-01",s:"2-3",t:"mc",
 q:"Which statements about the hierarchy of agent types are correct?",
 k:"에이전트 유형의 계층에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A simple reflex agent acts on the current percept only.","단순 반사 에이전트는 현재 지각만으로 행동한다.",1,"맞습니다."],
    ["A model-based reflex agent adds an internal state (memory).","모델 기반 반사 에이전트는 내부 상태(기억)를 추가한다.",1,"맞습니다."],
    ["A goal-based agent adds goals and planning.","목표 기반 에이전트는 목표와 계획을 추가한다.",1,"맞습니다."],
    ["The utility-based agent is the least capable type in the hierarchy.","효용 기반 에이전트는 계층에서 가장 덜 유능한 유형이다.",0,"틀렸습니다. 아래(단순 반사)에서 위(효용 기반)로 갈수록 더 유능합니다."],
    ["The learning agent is a fifth level placed above the utility-based agent in the same hierarchy.","학습 에이전트는 같은 계층에서 효용 기반 위에 놓인 다섯 번째 단계다.",0,"틀렸습니다. 학습은 네 구조와 직교하며, 어느 구조에든 붙일 수 있습니다."]],
 e:"단순 반사 → 모델 기반 반사 → 목표 기반 → 효용 기반, 각 단계는 이전 단계가 못 하던 것을 고칩니다. 학습은 넷 모두를 가로지릅니다."},
{id:"2-3-02",s:"2-3",t:"mc",
 q:"Which statements about simple reflex agents are correct?",
 k:"단순 반사 에이전트에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Its agent function uses only the current percept: a = f(p).","에이전트 함수는 현재 지각만 쓴다: a = f(p).",1,"맞습니다."],
    ["It is fast and cheap.","빠르고 저렴하다.",1,"맞습니다."],
    ["It explicitly knows the performance measure and reasons about it.","성능 척도를 명시적으로 알고 그것에 대해 추론한다.",0,"틀렸습니다. 성능 척도를 전혀 모릅니다. 그래도 규칙을 잘 고르면 좋은 성능을 낼 수 있습니다."],
    ["If the vacuum agent's location sensor is removed and it always moves Left when clean, it can get stuck forever.","청소기의 위치 센서를 없애고 깨끗할 때 항상 Left로 가면 영원히 갇힐 수 있다.",1,"맞습니다. B에서 시작했다면 A로 간 뒤 계속 벽에 대고 Left."],
    ["Randomizing (flipping a coin) reaches the other square in two steps on average, but it is a trick, not a real fix.","무작위화(동전 던지기)는 평균 두 단계에 다른 칸에 도달하지만, 요령일 뿐 진짜 해결책은 아니다.",1,"맞습니다. 더 나은 것은 기억을 주는 것입니다."]],
 e:"단순 반사 = 조건-행동 규칙 + 현재 지각. 약간의 관찰 불가능성만으로도 루프에 갇힐 수 있고, 근본 해결은 기억(모델 기반)입니다."},
{id:"2-3-03",s:"2-3",t:"mc",
 q:"Which statements about model-based reflex agents are correct?",
 k:"모델 기반 반사 에이전트에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The agent function takes a second argument: a = f(p, s), where s is a state updated every step.","에이전트 함수가 두 번째 인자를 받는다: a = f(p, s), s는 매 단계 갱신되는 상태.",1,"맞습니다."],
    ["The state is updated with s′ = T(s, a).","상태는 s′ = T(s, a)로 갱신된다.",1,"맞습니다. T는 전이 모델입니다."],
    ["Maintaining the state requires a transition model and a sensor model.","상태를 유지하려면 전이 모델과 센서 모델이 필요하다.",1,"맞습니다."],
    ["The state is always known with certainty.","상태는 항상 확실하게 알 수 있다.",0,"틀렸습니다. 상태는 센서에 의한 '최선의 추측'이지 결코 확실한 것이 아닙니다."],
    ["The sensor model describes how the world evolves on its own.","센서 모델은 세상이 스스로 어떻게 변하는지를 설명한다.",0,"틀렸습니다. 그건 전이 모델의 일부입니다. 센서 모델은 세상의 상태가 지각에 어떻게 나타나는지입니다."]],
 e:"전이 모델 = 세상이 어떻게 변하나(내 행동에 의해, 그리고 스스로). 센서 모델 = 상태가 지각에 어떻게 나타나나. 둘로 안 보이는 것도 추적합니다."},
{id:"2-3-04",s:"2-3",t:"mc",
 q:"Which statements about state representations are correct?",
 k:"상태 표현에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Atomic: the state is a single label, such as just \"A\" or \"B\".","원자적: 상태는 하나의 이름표다. 그냥 \"A\" 또는 \"B\".",1,"맞습니다."],
    ["Factored: the state is a set of attribute–value pairs called fluents.","분해된(요인적): 상태는 플루언트라고 부르는 속성-값 쌍의 집합이다.",1,"맞습니다. [위치=A, 상태=깨끗, 온도=24°C]."],
    ["Structured: objects, their attributes, and relations between objects.","구조화된: 객체, 그 속성, 객체 사이의 관계.",1,"맞습니다."],
    ["Structured and factored representations mean the same thing.","구조화된 표현과 분해된 표현은 같은 뜻이다.",0,"틀렸습니다. 분해된 = 속성-값 쌍, 구조화된 = 거기에 객체 사이의 관계까지 표현합니다."],
    ["\"The cup is on the table, which is in the kitchen\" is an example of a factored state.","\"컵이 탁자 위에 있고, 그 탁자는 부엌에 있다\"는 분해된 상태의 예다.",0,"틀렸습니다. 객체 사이의 관계이므로 구조화된 표현입니다."]],
 e:"원자적 < 분해된 < 구조화된 순으로 표현력이 커집니다. 분해된 표현에서 속성-값 쌍(예: 온도 = 24°C)을 플루언트(fluent)라고 부릅니다."},
{id:"2-3-05",s:"2-3",t:"mc",
 q:"Which statements comparing goal-based and utility-based agents are correct (as stated in the lecture)?",
 k:"목표 기반 에이전트와 효용 기반 에이전트를 비교한 설명 중 (강의 기준으로) 옳은 것을 모두 고르시오.",
 o:[["A goal is a yes/no test.","목표는 예/아니오 판정이다.",1,"맞습니다."],
    ["A utility function scores how desirable a state is, often written as a reward R(s).","효용 함수는 상태가 얼마나 바람직한지 점수를 매기며, 흔히 보상 R(s)로 쓴다.",1,"맞습니다."],
    ["The goal-based sequence p0, s0, a0, … ends at s_goal: when the agent arrives, it is done.","목표 기반의 수열 p0, s0, a0, …는 s_goal에서 끝난다: 도착하면 끝이다.",1,"맞습니다."],
    ["The utility-based sequence never terminates: there is no arriving, only continuing.","효용 기반의 수열은 종료되지 않는다: 도착이란 없고 계속될 뿐이다.",1,"맞습니다(강의 슬라이드의 표현)."],
    ["To send a reflex taxi to a new destination, you only need to change one parameter: the destination.","반사형 택시를 새 목적지로 보내려면 목적지 하나만 바꾸면 된다.",0,"틀렸습니다. 그건 목표 기반 택시입니다. 반사형은 그 목적지 전용 규칙을 전부 교체해야 합니다."]],
 e:"목표 = 행복/불행의 조잡한 이분법, 효용 = 바람직함의 점수. 목표 기반 택시가 유연한 이유는 지식(목적지, 지도)이 명시적으로 분리되어 있기 때문입니다."},
{id:"2-3-06",s:"2-3",t:"mc",
 q:"In which situations are goals (with a goal test and path cost) NOT enough, so a utility function is needed?",
 k:"목표(목표 판정과 경로 비용)만으로는 부족해 효용 함수가 필요한 상황을 모두 고르시오.",
 o:[["There is no terminal goal at all, e.g., a Mars rover keeping its battery out of the danger zone.","종료 목표가 아예 없다. 예: 배터리를 위험 구간 밖으로 유지하는 화성 로버.",1,"맞습니다. 도착할 곳이 없고 과업이 끝나지 않습니다."],
    ["Objectives conflict, e.g., fast vs. safe vs. comfortable.","목적들이 충돌한다. 예: 빠름 vs 안전 vs 쾌적.",1,"맞습니다. 누군가 절충을 적어 줘야 합니다."],
    ["Outcomes are uncertain, e.g., 90% chance of a small win vs. 10% chance of a big win.","결과가 불확실하다. 예: 90% 작은 승리 vs 10% 큰 승리.",1,"맞습니다. 예/아니오 판정에는 확률을 곱할 수 없습니다."],
    ["There is exactly one path to the goal.","목표로 가는 경로가 정확히 하나뿐이다.",0,"틀렸습니다. 경로가 하나뿐이면 목표만으로 충분합니다. 효용은 경로가 여러 개일 때 필요합니다."],
    ["The environment is fully observable.","환경이 완전 관찰 가능하다.",0,"틀렸습니다. 관찰 가능성은 목표/효용 선택의 기준으로 제시되지 않았습니다."]],
 e:"목표만으로 부족한 세 상황: ① 종료 목표 없음 ② 목적 충돌 ③ 결과 불확실(기대 효용 Σ U×P 필요)."},
{id:"2-3-07",s:"2-3",t:"mc",
 q:"Which statements about the components of a learning agent are correct?",
 k:"학습 에이전트의 구성 요소에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The performance element takes in percepts and chooses actions — it is the whole agent we studied before.","수행 요소는 지각을 받아 행동을 고른다 — 지금까지 배운 에이전트 전체다.",1,"맞습니다."],
    ["The learning element updates the performance element so it does better next time.","학습 요소는 수행 요소가 다음번에 더 잘하도록 갱신한다.",1,"맞습니다."],
    ["The critic judges what happened against a fixed external standard.","비평가는 일어난 일을 고정된 외부 기준에 대해 판정한다.",1,"맞습니다."],
    ["The problem generator deliberately suggests actions worth trying.","문제 생성기는 시도해 볼 만한 행동을 의도적으로 제안한다.",1,"맞습니다. 탐험을 담당합니다."],
    ["The performance standard should be inside the agent so the agent can adjust it freely.","성능 기준은 에이전트가 자유롭게 조정할 수 있도록 에이전트 안에 있어야 한다.",0,"틀렸습니다. 반드시 밖에 있어야 합니다. 안에 있으면 이미 달성한 수준으로 낮춰 버립니다."]],
 e:"학습 에이전트 = 수행 요소 + 학습 요소 + 비평가 + 문제 생성기. 성능 기준은 외부에 있으며 에이전트가 바꿀 수 없습니다."},
{id:"2-3-08",s:"2-3",t:"mc",
 q:"Which statements about learning in agents are correct?",
 k:"에이전트의 학습에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Learning is orthogonal to the four architectures: any of them can be made to learn, or not.","학습은 네 가지 아키텍처와 직교한다: 어느 것이든 학습하게 만들 수도, 아닐 수도 있다.",1,"맞습니다."],
    ["A spam filter can be a simple reflex agent that still learns from the user's \"not spam\" clicks.","스팸 필터는 단순 반사 에이전트이면서도 사용자의 '스팸 아님' 클릭으로 학습할 수 있다.",1,"맞습니다. 직교의 예입니다."],
    ["Learning matters most in unknown environments, i.e., whenever the designer is not omniscient.","학습은 모르는 환경, 즉 설계자가 전지전능하지 않은 모든 경우에 가장 중요하다.",1,"맞습니다."],
    ["Only utility-based agents are able to learn.","효용 기반 에이전트만 학습할 수 있다.",0,"틀렸습니다. 직교이므로 어느 구조든 학습할 수 있습니다."],
    ["An agent allowed to modify its own standard would raise it to the hardest possible level.","자기 기준을 고칠 수 있는 에이전트는 기준을 가장 어려운 수준으로 올릴 것이다.",0,"틀렸습니다. 이미 달성한 수준으로 '낮춰' 버립니다 — 게이밍 가능한 척도와 같은 실패가 한 층 아래에서 일어납니다."]],
 e:"주목할 두 가지: ① 성능 기준은 반드시 에이전트 바깥에 ② 학습은 네 구조와 직교. 그리고 학습은 모르는 환경에서 가장 중요합니다."},
{id:"2-3-09",s:"2-3",t:"mc",
 q:"Why can't we simply implement an agent as a lookup table? Select all reasons given in the lecture.",
 k:"왜 에이전트를 그냥 조회표로 구현할 수 없는가? 강의에서 제시한 이유를 모두 고르시오.",
 o:[["No machine could store it (chess needs roughly 10^150 entries).","어떤 기계도 그것을 저장할 수 없다(체스는 약 10^150개 항목).",1,"맞습니다."],
    ["No designer could fill it in.","어떤 설계자도 그것을 채울 수 없다.",1,"맞습니다."],
    ["No agent could learn all the right entries.","어떤 에이전트도 올바른 항목들을 전부 학습할 수 없다.",1,"맞습니다."],
    ["Tables cannot represent any agent function in principle.","표로는 원리적으로 어떤 에이전트 함수도 표현할 수 없다.",0,"틀렸습니다. 슬라이드는 '어떤 에이전트 함수든 표로 쓸 수 있다'고 전제합니다. 문제는 크기입니다."],
    ["Tables are too slow to look up compared with computing rules.","표는 규칙 계산에 비해 조회가 너무 느리다.",0,"틀렸습니다. 강의가 든 세 개의 벽은 저장·작성·학습입니다."]],
 e:"세 개의 벽(저장·작성·학습), 그중 어느 하나만으로도 치명적. 그래서 이 장의 나머지는 '작은 프로그램으로 같은 행동을 얻는 법'을 묻습니다."},
{id:"2-3-10",s:"2-3",t:"sa",
 q:"To maintain its internal state, a model-based agent needs a transition model and a ______ model. (one word)",
 k:"내부 상태를 유지하려면 모델 기반 에이전트에게 전이 모델과 ______ 모델이 필요하다. (한 단어)",
 a:["sensor","센서"],show:"sensor",
 e:"센서 모델(sensor model): 세상의 상태가 지각에 어떻게 나타나는가. 전이 모델(transition model): 세상이 어떻게 변하는가. 둘을 합치면 '예측 → 관측으로 보정'의 반복이 됩니다."},
{id:"2-3-11",s:"2-3",t:"sa",
 q:"The four components of a learning agent are the performance element, the learning element, the critic, and the ______. (two words)",
 k:"학습 에이전트의 네 구성 요소는 수행 요소, 학습 요소, 비평가, 그리고 ______다. (두 단어)",
 a:["problem generator","problemgenerator","문제생성기"],show:"problem generator",
 e:"문제 생성기(problem generator)는 시도해 볼 만한 행동을 의도적으로 제안합니다. 늘 하던 최선만 반복하면 더 좋은 방법을 영영 발견하지 못하기 때문입니다(탐험 vs 활용)."},
{id:"2-3-12",s:"2-3",t:"sa",
 q:"In a factored state representation, the attribute–value pairs (e.g., Temperature = 24°C) are called ______. (one word, plural)",
 k:"분해된(요인적) 상태 표현에서 속성-값 쌍(예: 온도 = 24°C)을 ______라고 부른다. (한 단어, 복수형)",
 a:["fluents","fluent","플루언트"],show:"fluents",
 e:"플루언트(fluent). 상태 = [위치 = A, 상태 = 깨끗함, 온도 = 24°C]처럼 변수들로 쪼개면 두 상태가 어떤 변수에서 같고 다른지 비교할 수 있습니다."},
{id:"2-3-13",s:"2-3",t:"sa",
 q:"Write the agent function of a model-based reflex agent, using p for the percept and s for the state.",
 k:"지각을 p, 상태를 s로 써서 모델 기반 반사 에이전트의 에이전트 함수를 쓰시오.",
 a:["a=f(p,s)","f(p,s)","a=f(s,p)","f(s,p)"],show:"a = f(p, s)",
 e:"a = f(p, s). 단순 반사는 a = f(p)였고, 모델 기반은 매 단계 갱신되는 상태 s(s′ = T(s, a))를 두 번째 인자로 받습니다."},
/* ===================== 3-1 ===================== */
{id:"3-1-01",s:"3-1",t:"mc",
 q:"In this chapter, a search problem is set in an environment with which properties?",
 k:"이 장에서 탐색 문제는 어떤 특성을 가진 환경을 가정하는가? 모두 고르시오.",
 o:[["Known — the agent knows what its actions do.","알려진 — 에이전트는 자기 행동이 무엇을 하는지 안다.",1,"맞습니다."],
    ["Fully observable — the agent can see the whole state.","완전 관측 가능 — 전체 상태를 볼 수 있다.",1,"맞습니다."],
    ["Deterministic — the same action always gives the same result.","결정적 — 같은 행동은 언제나 같은 결과를 낸다.",1,"맞습니다."],
    ["Stochastic — outcomes come with probabilities.","확률적 — 결과에 확률이 붙는다.",0,"틀렸습니다. 결정적 환경을 가정합니다."],
    ["Competitive multiagent — an opponent works against us.","경쟁적 다중 에이전트 — 상대가 우리에게 맞선다.",0,"틀렸습니다. 상대가 있는 문제는 6~7주차 게임에서 다룹니다."]],
 e:"알려진·완전 관측·결정적(+ 이산, 원자적 상태) 환경이어야 실제로 움직이기 전에 머릿속(컴퓨터 안)에서 계획을 완성할 수 있습니다."},
{id:"3-1-02",s:"3-1",t:"mc",
 q:"Which of the following are among the five components of a search problem as defined in the lecture?",
 k:"강의에서 정의한 탐색 문제의 5요소에 해당하는 것을 모두 고르시오.",
 o:[["Initial state","초기 상태",1,"맞습니다."],
    ["Actions","행동",1,"맞습니다."],
    ["Transition model","전이 모델",1,"맞습니다."],
    ["Heuristic function h(n)","휴리스틱 함수 h(n)",0,"틀렸습니다. h(n)은 정보 탐색에서 추가로 쓰는 힌트이지 문제 정의의 5요소가 아닙니다."],
    ["Action cost function","행동 비용 함수",1,"맞습니다. 다섯 번째는 목표 상태입니다."]],
 e:"5요소: 초기 상태, 행동, 전이 모델, 목표 상태, 행동 비용 함수. 상태 공간(표) 자체는 정의하지 않습니다 — 너무 크거나 연속적이기 때문입니다."},
{id:"3-1-03",s:"3-1",t:"mc",
 q:"Which statements about ACTIONS(s) and RESULT(s, a) are correct?",
 k:"ACTIONS(s)와 RESULT(s, a)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["RESULT(s, a) returns the next state; the transition function is f : S × A → S.","RESULT(s, a)는 다음 상태를 돌려준다. 전이 함수는 f : S × A → S.",1,"맞습니다."],
    ["ACTIONS(s) is the set of legal actions in state s.","ACTIONS(s)는 상태 s에서 가능한(합법적인) 행동의 집합이다.",1,"맞습니다."],
    ["They are functions, not stored tables — states are generated when needed.","이들은 저장된 표가 아니라 함수다 — 상태는 필요할 때 생성된다.",1,"맞습니다."],
    ["Writing the transition model as a lookup table gives the state-space graph, where each row is an edge.","전이 모델을 조회표로 만들면 그것이 상태 공간 그래프이며, 표의 각 행이 간선 하나다.",1,"맞습니다."],
    ["In the maze example, ACTIONS(4) includes W even though there is a wall to the west.","미로 예에서 서쪽이 벽인데도 ACTIONS(4)에 W가 포함된다.",0,"틀렸습니다. ACTIONS(4) = {E, S, N}. 벽이 있는 W는 합법적인 행동이 아닙니다."]],
 e:"탐색 알고리즘은 ACTIONS와 RESULT 두 함수만 반복 호출하며 그래프를 조금씩 펼칩니다. 그래서 상태가 수십억 개인 문제도 다룰 수 있습니다."},
{id:"3-1-04",s:"3-1",t:"mc",
 q:"For Pac-Man, which statements about world states and search states are correct?",
 k:"팩맨에서 세계 상태와 탐색 상태에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A search state keeps only the details needed for planning — this is abstraction.","탐색 상태는 계획에 필요한 세부 사항만 담는다 — 이것이 추상화다.",1,"맞습니다."],
    ["For the pathing problem, the state is the (x, y) location.","경로 찾기 문제의 상태는 (x, y) 위치다.",1,"맞습니다."],
    ["For eat-all-dots, the state is {(x, y), dot booleans}.","모든 점 먹기 문제의 상태는 {(x, y), 점 불리언들}이다.",1,"맞습니다."],
    ["The goal of eat-all-dots is reached when all dot booleans are true.","모든 점 먹기의 목표는 모든 점 불리언이 true일 때다.",0,"틀렸습니다. 목표는 '모든 점이 false'인 상태입니다(남은 점이 없음)."],
    ["Ghost positions must be part of the pathing state.","유령의 위치는 경로 찾기 상태에 반드시 포함되어야 한다.",0,"틀렸습니다. 유령과 방향은 두 문제 모두에 불필요해 뺍니다."]],
 e:"세계 상태 = 환경의 모든 세부 사항, 탐색 상태 = 계획에 필요한 것만. 같은 게임이라도 문제에 따라 상태 정의가 달라집니다(120 vs 120 × 2^30)."},
{id:"3-1-05",s:"3-1",t:"mc",
 q:"Which statements about the 'Vacation in Romania' problem are correct?",
 k:"'루마니아 휴가' 문제에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The initial state is Arad and the goal state is Bucharest.","초기 상태는 아라드, 목표 상태는 부쿠레슈티다.",1,"맞습니다."],
    ["The action cost is the distance driven.","행동 비용은 이동한 거리다.",1,"맞습니다."],
    ["Arad → Sibiu → Fagaras → Bucharest (450 miles) is the optimal path.","아라드 → 시비우 → 파가라스 → 부쿠레슈티(450마일)가 최적 경로다.",0,"틀렸습니다. 이동 횟수는 적지만 더 깁니다."],
    ["Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest (418 miles) is shorter despite having more moves.","아라드 → 시비우 → 림니쿠빌체아 → 피테슈티 → 부쿠레슈티(418마일)는 이동 횟수가 더 많지만 더 짧다.",1,"맞습니다. 140 + 80 + 97 + 101 = 418."],
    ["The path with the fewest cities is always the cheapest.","거치는 도시가 가장 적은 경로가 항상 가장 싸다.",0,"틀렸습니다. 이 차이(32마일) 때문에 최적 해를 찾는 탐색이 필요합니다."]],
 e:"최적 해 = 목표에 도달하는 행동 순서 중 경로 비용(행동 비용의 합)이 가장 낮은 것. 루마니아에서는 418마일입니다."},
{id:"3-1-06",s:"3-1",t:"mc",
 q:"Which statements about the sliding-tile puzzle are correct?",
 k:"슬라이딩 타일 퍼즐에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The actions are: move the blank Left, Right, Up, or Down.","행동은 빈칸을 왼쪽, 오른쪽, 위, 아래로 옮기는 것이다.",1,"맞습니다. 타일 8개가 아니라 빈칸을 움직인다고 보면 행동이 4가지로 단순해집니다."],
    ["The 8-puzzle has 9!/2 = 181,440 reachable states.","8-퍼즐에는 9!/2 = 181,440개의 도달 가능한 상태가 있다.",1,"맞습니다."],
    ["Half of the permutations cannot be reached from any given start state.","순열의 절반은 주어진 어떤 시작 상태에서도 도달할 수 없다.",1,"맞습니다. 패리티 불변량 때문입니다."],
    ["Every arrangement of the 8-puzzle can be transformed into the goal state.","8-퍼즐의 모든 배치는 목표 상태로 만들 수 있다.",0,"틀렸습니다. 절반은 어떤 합법적 이동으로도 경계를 넘지 못합니다."],
    ["The 24-puzzle has about 10^13 states.","24-퍼즐에는 약 10^13개의 상태가 있다.",0,"틀렸습니다. 10^13은 15-퍼즐(16!/2)이고, 24-퍼즐은 25!/2 ≈ 10^25입니다."]],
 e:"빈칸 위치(밝은/어두운 칸)와 순열의 짝·홀이 매 이동마다 함께 뒤집혀 합이 변하지 않습니다(불변량). 15 → 24퍼즐로 가면 상태 공간이 약 10^12배 커집니다."},
{id:"3-1-07",s:"3-1",t:"mc",
 q:"Which statements about search problems as models and about executing plans are correct?",
 k:"모델로서의 탐색 문제와 계획 실행에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["In a known, deterministic environment, the agent can ignore its percepts while executing the plan (open-loop).","알려진 결정적 환경에서는 계획을 실행하는 동안 지각을 무시해도 된다(개루프).",1,"맞습니다."],
    ["Search never runs in the world itself; it runs on a model of the world.","탐색은 절대 세상 그 자체에서 실행되지 않는다. 세상의 모델 위에서 실행된다.",1,"맞습니다."],
    ["A plan is only as good as the model it was found in.","계획은 그것을 찾아낸 모델만큼만 좋다.",1,"맞습니다. 모델은 일부러 단순화한 것입니다."],
    ["Open-loop execution is the best choice for nondeterministic environments.","개루프 실행은 비결정적 환경에서 최선의 선택이다.",0,"틀렸습니다. 불확실할수록 지각으로 계속 수정하는 폐루프가 필요합니다."],
    ["The optimal solution is the action sequence with the fewest actions, regardless of action costs.","최적 해는 행동 비용과 상관없이 행동 수가 가장 적은 행동 순서다.",0,"틀렸습니다. 경로 비용이 가장 낮은 행동 순서입니다."]],
 e:"'최적 해'는 '이 모델 안에서 최적'이라는 뜻입니다. 모델이 현실을 잘못 반영하면(예: 지도에 없는 공사 구간) 최적 해도 현실에서는 나쁜 계획일 수 있습니다."},
{id:"3-1-08",s:"3-1",t:"sa",
 q:"How many reachable states does the 8-puzzle have? (number)",
 k:"8-퍼즐의 도달 가능한 상태는 몇 개인가? (숫자)",
 a:["181440","181,440","9!/2"],show:"181,440 (= 9!/2)",
 e:"9! = 362,880가지 배치 중 정확히 절반만 도달 가능합니다: 9!/2 = 181,440."},
{id:"3-1-09",s:"3-1",t:"sa",
 q:"What is the cost (in miles) of the optimal path from Arad to Bucharest?",
 k:"아라드에서 부쿠레슈티까지 최적 경로의 비용(마일)은?",
 a:["418","418miles","418마일"],show:"418",
 e:"아라드 → 시비우 → 림니쿠빌체아 → 피테슈티 → 부쿠레슈티 = 140 + 80 + 97 + 101 = 418마일."},
{id:"3-1-10",s:"3-1",t:"sa",
 q:"How many atomic states does the two-square vacuum world have?",
 k:"두 칸짜리 진공청소기 세계의 원자적 상태는 몇 개인가?",
 a:["8","eight","여덟","8개"],show:"8",
 e:"청소기 위치 2 × A 먼지 2 × B 먼지 2 = 8. 목표 상태는 두 방 모두 깨끗한 2개(청소기가 A 또는 B)."},
{id:"3-1-11",s:"3-1",t:"sa",
 q:"The path cost is the ______ of the action costs along the action sequence from the initial state to the goal. (one word)",
 k:"경로 비용은 초기 상태에서 목표까지 행동 순서를 따라 행동 비용을 ______한 값이다. (한 단어)",
 a:["sum","total","합","합계","더한"],show:"sum",
 e:"경로 비용 = 행동 비용의 합. 모든 행동 비용이 1이면 경로 비용 = 행동 횟수입니다."},

/* ===================== 3-2 ===================== */
{id:"3-2-01",s:"3-2",t:"mc",
 q:"Which statements comparing the state-space graph and the search tree are correct?",
 k:"상태 공간 그래프와 탐색 트리를 비교한 설명으로 옳은 것을 모두 고르시오.",
 o:[["In the state space, there is one node per state.","상태 공간에서는 상태 하나당 노드 하나다.",1,"맞습니다."],
    ["In the search tree, each node represents a whole path from the root.","탐색 트리에서 각 노드는 루트로부터의 경로 전체를 나타낸다.",1,"맞습니다. 노드는 상태가 아니라 경로입니다."],
    ["The vacuum world has 8 states, but its search tree is infinite.","진공청소기 세계는 상태가 8개지만 탐색 트리는 무한하다.",1,"맞습니다."],
    ["The search tree is fixed before the search begins.","탐색 트리는 탐색이 시작되기 전에 고정되어 있다.",0,"틀렸습니다. 고정된 것은 상태 공간이고, 탐색 트리는 진행하면서 만들어집니다."],
    ["The same state can appear as several different nodes in the search tree.","같은 상태가 탐색 트리에서 여러 개의 다른 노드로 나타날 수 있다.",1,"맞습니다. 중복 경로를 완전히 막지 못할 때."]],
 e:"상태 공간 = 세상(고정, 그래프, 유한할 수 있음). 탐색 트리 = 시도한 것의 기록(진행하며 생성, 항상 트리, 무한할 수 있음). 학생들이 가장 자주 놓치는 구분입니다."},
{id:"3-2-02",s:"3-2",t:"mc",
 q:"Which statements about cycles and redundant paths are correct?",
 k:"사이클과 중복 경로에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A cycle is a path that returns to the same state.","사이클은 같은 상태로 되돌아오는 경로다.",1,"맞습니다."],
    ["A redundant path is one of several different paths reaching the same state.","중복 경로는 같은 상태에 도달하는 서로 다른 여러 경로다.",1,"맞습니다."],
    ["A cycle can be detected cheaply by following parent pointers along the current path.","사이클은 현재 경로를 따라 부모 포인터를 따라가면 싸게 검사할 수 있다.",1,"맞습니다."],
    ["AI search always removes all redundant paths, no matter how much memory it costs.","AI 탐색은 메모리가 얼마나 들든 항상 모든 중복 경로를 제거한다.",0,"틀렸습니다. 중복 경로 검사는 메모리가 많이 들어 같은 부분을 여러 번 탐색하는 것을 감수하기도 합니다."],
    ["When expanding Sibiu from Arad in the Romania example, the Arad node that reappears one level below is a redundant path, not a cycle.","루마니아 예에서 아라드에서 시비우를 확장할 때 한 단계 아래에 다시 나타난 아라드는 사이클이 아니라 중복 경로다.",0,"틀렸습니다. 아라드→시비우→아라드는 출발점으로 되돌아온 사이클입니다."]],
 e:"사이클 = 한 경로 안에서 같은 상태 반복(무한 루프 → 반드시 잘라냄). 중복 경로 = 서로 다른 두 경로가 같은 상태에서 만남(없애면 효율↑, 단 메모리 비용)."},
{id:"3-2-03",s:"3-2",t:"mc",
 q:"Which statements correctly describe the tree-search algorithm summarized in the lecture?",
 k:"강의에서 요약한 트리 탐색 알고리즘을 올바르게 설명한 것을 모두 고르시오.",
 o:[["Initialize the frontier with all goal states.","프런티어를 모든 목표 상태로 초기화한다.",0,"틀렸습니다. 시작 상태(루트 노드)로 초기화합니다."],
    ["While the frontier is not empty, choose the next node to expand according to the search strategy.","프런티어가 비어 있지 않은 동안, 탐색 전략에 따라 다음에 확장할 노드를 고른다.",1,"맞습니다."],
