 unlimited)."}, {"s": "2-1", "im": ["2-1-12", "2-1-13"], "en": "Example: Is the Vacuum Agent Rational?", "ko": "예제: 진공청소기 에이전트는 합리적인가?", "o": [["Two questions worth asking of our vacuum agent: What should the performance measure be? / Given that measure, is this agent rational?", "청소기 에이전트에게 물어볼 만한 두 질문: 성능 척도는 무엇이어야 하나? / 그 척도가 주어졌을 때, 이 에이전트는 합리적인가?"], ["The honest answer to the second is: <b>it depends</b> / And what it depends on is exactly the 4 things from earlier: performance measure, prior knowledge, actions, percept sequence", "두 번째 질문의 정직한 답은: <b>상황에 따라 다르다</b> / 그리고 무엇에 따라 다른지는 바로 앞의 네 가지: 성능 척도, 사전 지식, 행동, 지각 순열"]], "x": "07쪽의 3줄짜리 청소기 프로그램이 합리적인지 묻습니다. 답은 \"조건을 정하기 전에는 답할 수 없다(it depends)\"입니다. 09쪽에서 배운 대로 합리성은 네 가지(성능 척도, 사전 지식, 행동, 지각 순열)에 달려 있는데, 아직 성능 척도조차 정하지 않았기 때문입니다. 13쪽은 같은 질문 아래에 07쪽의 함수 표와 프로그램을 다시 보여 주고, 다음 14쪽에서 네 조건을 하나씩 못 박습니다.", "pg": [[1, 1], [1, 1]]}, {"s": "2-1", "im": ["2-1-14"], "en": "Pin Down the Assumptions", "ko": "가정을 못 박아 두기", "o": [["<b>Performance measure</b>: One point per clean square, per time step, over 1000 steps", "<b>성능 척도</b>: 1000 시간 단계 동안, 매 단계마다 깨끗한 칸 하나당 1점"], ["<b>Prior knowledge</b>: The layout is known. Where the dirt is, and where the agent starts, are not", "<b>사전 지식</b>: 방의 배치는 알려져 있다. 먼지가 어디 있는지, 에이전트가 어디서 시작하는지는 모른다"], ["<b>Four actions</b> are available: {Left, Right, Suck, NoOp} / <b>Percepts</b>: [location, status] — {[A, Dirty], [A, Clean], [B, Dirty], [B, Clean]}", "<b>행동 4가지</b>: {왼쪽, 오른쪽, 흡입, 아무것도 안 함} / <b>지각</b>: [위치, 상태] — {[A, 더러움], [A, 깨끗], [B, 더러움], [B, 깨끗]}"]], "x": "네 가지 조건을 구체적으로 정합니다.<ul><li><b>성능 척도</b>: 매 시간 단계마다 깨끗한 칸 수만큼 점수. 1000단계 동안 합산. 따라서 최고 점수는 1000단계 × 2칸 = <b>2000점</b>이고, 실제로는 치우는 데 몇 단계가 걸리므로 그보다 조금 작습니다. 점수가 '청소 횟수'가 아니라 '<b>깨끗한 칸 수</b>'라는 점이 중요합니다 — 빨리 치울수록 깨끗한 상태로 보내는 단계가 많아져 점수가 높습니다.</li><li><b>사전 지식</b>: 방이 A, B 두 칸이라는 구조는 알지만, 어느 칸이 더러운지와 내가 어디서 시작하는지는 모릅니다.</li><li><b>행동</b>과 <b>지각</b>은 07쪽과 같습니다.</li></ul>겉으로 드러나지 않은 암묵적 가정도 있습니다: 치운 칸은 다시 더러워지지 않는다, 이동과 흡입은 항상 성공한다, 이동해도 벌점은 없다. 이 가정들이 다음 슬라이드의 판정을 좌우합니다.", "e": "A에서 시작, 둘 다 더러움: 1단계 Suck(깨끗한 칸 1개 → 1점), 2단계 Right(1점), 3단계 Suck(2점), 이후 매 단계 2점 → 총 1 + 1 + 2 × 998 = 1998점."}, {"s": "2-1", "im": ["2-1-15"], "en": "Under Those Assumptions: Yes", "ko": "그 가정들 아래에서는: 합리적이다", "key": 1, "o": [["This simple agent is rational / No other agent does better, because there is nothing better to do — Square dirty? Cleaning it is the only way to score / Square clean? The only remaining points are next door", "이 단순한 에이전트는 합리적이다 / 더 잘할 수 있는 일이 없으니 더 잘하는 에이전트도 없다 — 칸이 더럽다? 치우는 것이 유일한 득점 방법 / 칸이 깨끗하다? 남은 점수는 옆 칸에만 있다"], ["A three-line program turns out to be optimal / Which should make you suspicious of the assumptions", "3줄짜리 프로그램이 최적으로 밝혀진다 / 그렇다면 가정을 의심해 봐야 한다"], ["Rationality is a relation between <b>an agent and its environment</b>, not a property the agent has", "합리성은 <b>에이전트와 그 환경 사이의 관계</b>이지, 에이전트가 가진 속성이 아니다"]], "x": "14쪽의 가정 아래에서는 3줄 프로그램이 <b>합리적</b>입니다. 이유가 간단합니다: 지금 칸이 더러우면 치우는 것 말고는 점수를 얻을 방법이 없고, 깨끗하면 남은 점수는 옆 칸에만 있으니 옆으로 가는 것이 최선입니다. 어떤 똑똑한 에이전트를 데려와도 이보다 잘할 수 없습니다.<br>그런데 \"3줄이 최적이라면 문제가 너무 쉬운 것 아닌가?\"라고 <b>가정을 의심</b>해 보라는 것이 이 슬라이드의 두 번째 메시지입니다. 가정을 하나씩 바꾸면 판정이 바뀝니다:<ul><li>이동에 벌점(−1)이 있다면 → 다 치운 뒤에도 A↔B를 왕복하는 것은 손해. NoOp을 해야 하는데, 그러려면 \"둘 다 깨끗하다\"는 것을 <b>기억</b>해야 하므로 3줄 프로그램은 더 이상 합리적이지 않습니다.</li><li>먼지가 다시 생긴다면 → 가끔 순찰을 돌아야 합니다.</li><li>방의 구조를 모른다면 → 먼저 돌아다니며 <b>탐험(exploration)</b>해야 합니다.</li></ul>그래서 마지막 문장(강조): <b>합리성은 에이전트와 환경 사이의 관계</b>입니다. 같은 프로그램이 어떤 환경에서는 합리적이고 다른 환경에서는 아닙니다. \"이 에이전트는 합리적이다\"라고만 말하면 반쪽짜리 문장이고, \"이 환경에서\"가 붙어야 합니다.", "e": "우산을 항상 들고 다니는 사람: 장마철 서울에서는 합리적이지만, 1년 내내 비가 안 오는 사막 도시에서는 비합리적입니다. 사람(에이전트)은 같은데 환경이 다르면 판정이 달라집니다."}, {"s": "2-1", "im": ["2-1-16"], "en": "Design the Measure Around the Outcome", "ko": "원하는 결과를 중심으로 척도를 설계하라", "key": 1, "o": [["Suppose we score the vacuum on dirt collected per shift (performance measure) / A sufficiently good agent will maximize exactly that — Clean the floor. Throw it back out. Clean it again, repeatly / It is doing what we asked. That is the problem", "청소기를 근무 시간당 모은 먼지의 양으로 채점한다고 하자(성능 척도) / 충분히 똑똑한 에이전트는 정확히 그것을 최대화한다 — 바닥을 치운다. 다시 쏟는다. 또 치운다, 반복해서 / 요청한 대로 하고 있다. 그것이 문제다"], ["The rule: <b>The measure around what you want the world to look like;</b> not how you imagine the agent have to behave.", "규칙: <b>척도는 당신이 원하는 세상의 모습을 중심으로 만들어라;</b> 에이전트가 어떻게 행동해야 한다고 상상하는 방식이 아니라."], ["Same lesson as last week – the machine optimizes what we wrote down.. → Hallucination in a LLM is occurred", "지난주와 같은 교훈 — 기계는 우리가 적어 놓은 것을 최적화한다.. → LLM의 환각이 그래서 생긴다"]], "x": "성능 척도를 잘못 정하면 생기는 일입니다. \"모은 먼지의 양\"으로 채점하면, 똑똑한 청소기는 먼지를 빨아들인 뒤 <b>다시 쏟아 놓고 또 빨아들이는</b> 것이 점수를 가장 많이 얻는 방법임을 알아냅니다(그림의 세 장면과 되돌아가는 점선 화살표). 에이전트는 잘못한 것이 없습니다 — 우리가 적은 척도를 정확히 최대화했을 뿐입니다. <b>\"요청한 대로 하고 있다. 그것이 문제다.\"</b><br>교훈(슬라이드에서 파란 형광펜으로 강조): 척도는 <b>원하는 세상의 모습(outcome)</b>을 적어야지, 에이전트가 할 것이라고 <b>상상한 행동</b>을 적으면 안 됩니다. \"먼지를 많이 빨아들인다\"는 상상한 행동이고, 진짜 원하는 것은 \"바닥이 깨끗하다\"입니다. 그래서 14쪽의 척도가 '깨끗한 칸 수'였던 것입니다.<br>지난주(1-2)의 환각과 같은 교훈입니다: LLM은 '그럴듯한 다음 단어'를 맞히도록 훈련되었기 때문에, 모르는 것도 그럴듯하게 지어내는 편이 점수가 높아집니다. 기계는 우리가 적은 것을 최적화합니다. (보충: 이런 현상을 <b>reward hacking</b> 또는 <b>specification gaming</b>이라고 하고, \"척도가 목표가 되면 더 이상 좋은 척도가 아니다\"는 Goodhart의 법칙으로도 알려져 있습니다.)", "e": "코브라 효과: 영국 식민지 인도에서 코브라를 줄이려고 죽은 코브라 한 마리당 보상을 주자, 사람들이 보상을 받으려고 코브라를 <b>사육</b>했습니다. 원하는 결과는 '코브라가 적은 도시'였는데 척도는 '죽은 코브라 수'였기 때문입니다."}, {"s": "2-1", "im": ["2-1-17", "2-1-18"], "en": "Problem Specification: PEAS", "ko": "문제 명세: PEAS", "key": 1, "o": [["Rationality depends on four things. That bundle (PEAS) is the <b>Task environment</b>.", "합리성은 네 가지에 달려 있다. 그 묶음(PEAS)이 <b>과업 환경</b>이다."], ["In designing an agent, the first step must always be to <b>specify the task environment</b> as fully as possible.", "에이전트를 설계할 때 첫 단계는 언제나 <b>과업 환경을 명세하는</b> 것이어야 한다, 가능한 한 완전하게."], ["Performance measure — The criterion of success (Winning or losing a game. Stability and safety while driving) / Environment — Everything outside that the agent deals with (The chess board. The road, the weather, the other traffic) / Actuators — the ways of affecting the environment (A robot arm. The steering, the accelerator, the brake) / Sensors — the ways of observing it (A camera, a lidar, a microphone)", "성능 척도 — 성공의 기준 (게임의 승패. 운전 중의 안정성과 안전) / 환경 — 에이전트가 상대하는 바깥의 모든 것 (체스판. 도로, 날씨, 다른 차량) / 액추에이터 — 환경에 영향을 주는 수단 (로봇 팔. 핸들, 가속 페달, 브레이크) / 센서 — 환경을 관찰하는 수단 (카메라, 라이다, 마이크)"]], "x": "09쪽의 \"합리성이 달려 있는 네 가지\"를 설계자 입장에서 다시 정리한 것이 <b>PEAS</b>이고, 이 네 가지 묶음을 <b>과업 환경(task environment)</b>이라고 부릅니다. 그냥 '환경(environment)'은 PEAS의 E 하나이고, '과업 환경'은 P·E·A·S 전체라는 점을 구분하세요. 에이전트를 만들 때 코드부터 짜는 것이 아니라 <b>PEAS를 먼저 적는 것</b>이 첫 단계입니다.<div class='tw'><table><tr><th>P · Performance measure</th><th>E · Environment</th><th>A · Actuators</th><th>S · Sensors</th></tr><tr><td><b>성공의 기준</b><br>예: 게임 승패, 운전의 안정성과 안전</td><td><b>에이전트가 상대하는 바깥의 모든 것</b><br>예: 체스판, 도로, 날씨, 다른 차량</td><td><b>환경에 영향을 주는 수단</b><br>예: 로봇 팔, 핸들, 가속 페달, 브레이크</td><td><b>환경을 관찰하는 수단</b><br>예: 카메라, 라이다, 마이크</td></tr></table></div>외우는 팁: P(점수표) → E(무대) → A(손발) → S(눈귀). 09쪽의 네 가지와 비교하면 '사전 지식'과 '지각 순열'이 E와 S에 녹아 있습니다.", "e": "체스 프로그램의 PEAS: P = 승리(또는 승률), E = 체스판과 상대, A = 말을 옮기기(또는 수를 출력하기), S = 현재 판의 배치를 읽기.", "pg": [[1, 0], [1, 3]]}, {"s": "2-1", "im": ["2-1-19"], "en": "Example: An Automated Taxi Driver", "ko": "예제: 자동화된 택시 운전사", "key": 1, "o": [["Performance measure: Safe, fast, legal, comfortable trip, profitable, easy on other road users / Environment: Roads and traffic, pedestrians, police, customers, weather / Actuators: Steering, accelerator, brake, signals, horn, display and speech / Sensors: Cameras, radar, lidar, speedometer, GPS, engine sensors, accelerometer, microphone", "성능 척도: 안전, 빠름, 합법, 쾌적한 여행, 수익, 다른 도로 이용자 배려 / 환경: 도로와 교통, 보행자, 경찰, 손님, 날씨 / 액추에이터: 핸들, 가속 페달, 브레이크, 방향지시등, 경적, 화면과 음성 / 센서: 카메라, 레이더, 라이다, 속도계, GPS, 엔진 센서, 가속도계, 마이크"], ["\"Roads\" covers a farm track and a twelve-lane motorway / Snow in Gangwon. No snow in Busan / Drive on the right here. On the left in Japan", "\"도로\"에는 농로도 12차선 고속도로도 포함된다 / 강원도엔 눈이 오고 부산엔 안 온다 / 여기선 우측통행, 일본에선 좌측통행"], ["Every restriction you can honestly make shrinks the design problem — A taxi for one campus is a different machine from a taxi for one country", "정직하게 둘 수 있는 제약 하나하나가 설계 문제를 줄인다 — 캠퍼스 하나를 위한 택시와 나라 전체를 위한 택시는 다른 기계다"], ["Notice the performance measures conflict: fast fights safe, profitable fights comfortable. Stating the <b>conflict</b> is part of the specification.", "성능 척도들이 충돌한다는 점에 주목하라: 빠름은 안전과 싸우고, 수익은 쾌적함과 싸운다. <b>충돌</b>을 명시하는 것도 명세의 일부다."]], "x": "PEAS의 대표 예제, 자율주행 택시입니다. 표의 네 칸을 보면 P에는 서로 다른 목표가 여섯 개, E에는 도로·보행자·경찰·손님·날씨, A에는 운전 장치와 승객에게 말하는 화면·음성, S에는 카메라·레이더·라이다·GPS 등이 들어갑니다. 이 슬라이드가 말하려는 두 가지 교훈:<ul><li><b>E를 정직하게 좁혀라</b>: \"도로\"라고만 쓰면 농로부터 12차선 고속도로까지 전부 다뤄야 합니다. 눈이 오는 강원도와 안 오는 부산, 우측통행 한국과 좌측통행 일본은 전혀 다른 환경입니다. 범위를 좁힐수록(캠퍼스 안에서만 운행) 필요한 센서와 기능이 줄어 문제가 쉬워집니다. 단, <b>정직하게</b> — 눈이 오는 곳인데 \"눈 없음\"으로 가정하면 사고가 납니다.</li><li><b>P의 충돌을 적어라</b>: 빠르게 가려면 안전이 줄고, 수익을 내려면 쾌적함(에어컨, 부드러운 운전)이 줄어듭니다. 어느 쪽을 얼마나 중시할지(예: 합법·안전 > 빠름 > 수익)를 설계자가 <b>절충(trade-off)</b>으로 적어 주는 것까지가 명세입니다.</li></ul>", "e": "캠퍼스 셔틀 택시: E = 캠퍼스 내 도로(제한속도 30km/h, 신호등 없음, 눈 오면 운행 중단) → 레이더·고속 주행 제어가 필요 없고 보행자 감지에 집중하면 됩니다. 범위를 좁혀서 문제가 훨씬 쉬워진 예입니다."}, {"s": "2-1", "im": ["2-1-20"], "en": "PEAS for Other Agent Types", "ko": "다른 에이전트 유형들의 PEAS", "fill": "peas", "o": [["Medical diagnosis: Patient health, cost / Patient, hospital, staff / Questions, tests, treatments / Symptom and finding entry", "의료 진단: 환자 건강, 비용 / 환자, 병원, 직원 / 질문, 검사, 치료 / 증상과 소견 입력"], ["Satellite image analysis: Correct categorization / Satellite, downlink, weather / Category display / High-resolution camera", "위성 영상 분석: 올바른 분류 / 위성, 다운링크, 날씨 / 분류 결과 표시 / 고해상도 카메라"], ["Part-picking robot: Parts in the right bin / Conveyor belt, bins / Jointed arm and hand / Camera, joint angle, touch", "부품 집기 로봇: 올바른 통에 들어간 부품 / 컨베이어 벨트, 통 / 관절 팔과 손 / 카메라, 관절 각도, 촉각"], ["English tutor: Student's <b>later</b> test score / Students, testing agency / Exercises, feedback, speech / Keyboard, voice", "영어 튜터: 학생의 <b>나중</b> 시험 점수 / 학생, 시험 기관 / 연습 문제, 피드백, 음성 / 키보드, 음성"]], "x": "네 가지 다른 에이전트의 PEAS 표입니다(아래 연습 표에서 직접 채워 볼 수 있습니다). 눈여겨볼 점:<ul><li><b>소프트웨어 에이전트도 PEAS가 있다</b>: 의료 진단 에이전트의 액추에이터는 로봇 팔이 아니라 \"질문하기, 검사 지시하기, 치료 제안하기\"이고, 센서는 \"증상과 소견을 입력받는 것\"입니다. 위성 영상 분석의 액추에이터는 \"분류 결과를 화면에 표시하기\"뿐입니다.</li><li><b>P를 정하는 데 주의</b>: 영어 튜터의 P가 \"오늘 맞힌 문제 수\"가 아니라 \"학생의 <b>나중</b> 시험 점수\"입니다. 오늘 정답률로 채점하면 튜터는 쉬운 문제만 내서 점수를 부풀릴 수 있기 때문입니다(16쪽의 교훈 — 원하는 결과는 '학생의 실력 향상'). 의료 진단의 P에 '비용'이 들어 있는 것도 비싼 검사를 무조건 다 시키지 못하게 하려는 것입니다.</li><li><b>E에는 사람도 들어간다</b>: 환자, 병원 직원, 학생, 시험 기관처럼 에이전트가 상대하는 사람들도 환경입니다.</li></ul>", "e": "부품 집기 로봇의 P가 \"집은 부품 수\"라면? 아무 통에나 던져 넣어도 점수가 오릅니다. 그래서 \"<b>올바른 통에</b> 들어간 부품\"이라고 적어야 합니다."}, {"s": "2-1", "im": ["2-1-21"], "en": "Let's specify a task environment of a rational agent", "ko": "합리적 에이전트의 과업 환경을 명세해 보자 (실습)", "o": [["Write the PEAS description for one of these: A robot vacuum in a real apartment / A system that recommends what to watch next / A drone that inspects bridges for cracks / An agent that plays a game you know well", "다음 중 하나의 PEAS 명세를 작성하라: 실제 아파트의 로봇 청소기 / 다음에 볼 것을 추천하는 시스템 / 다리의 균열을 점검하는 드론 / 잘 아는 게임을 하는 에이전트"], ["Four columns. Be specific – \"the internet\" is not an environment", "네 칸을 채워라. 구체적으로 — \"인터넷\"은 환경이 아니다"], ["The hardest column is almost always P. Try to make it gameable, then fix it.", "가장 어려운 칸은 거의 항상 P다. 일부러 게이밍(악용) 가능하게 만들어 본 다음, 고쳐라."]], "x": "실습 슬라이드입니다. 네 가지 중 하나를 골라 PEAS 네 칸을 채워 봅니다. 두 가지 지침:<ul><li><b>구체적으로</b>: \"인터넷\"처럼 두루뭉술하게 쓰지 말고, 추천 시스템이라면 E = \"사용자의 시청 기록, 영상 목록, 시간대, 기기\"처럼 에이전트가 실제로 상대하는 것을 적습니다.</li><li><b>P는 일부러 허점을 만든 뒤 고쳐라</b>: 가장 어려운 칸이 P입니다. 연습 방법은 ① 허점 있는 P를 적고 → ② 에이전트가 그것을 어떻게 악용할지(16쪽처럼) 상상한 뒤 → ③ 원하는 결과를 중심으로 P를 고치는 것입니다.</li></ul>", "e": "로봇 청소기: 허점 있는 P \"주행 거리가 길수록 좋다\" → 같은 방을 빙글빙글 돌기만 함 → 고친 P \"청소 후 남은 먼지가 적을수록 + 걸린 시간이 짧을수록 + 가구 충돌 시 감점\". 추천 시스템: 허점 P \"클릭 수\" → 낚시 썸네일만 추천 → 고친 P \"끝까지 본 비율 + 만족도 평가\"."}, {"s": "2-2", "im": ["2-2-01", "2-2-02"], "en": "Chapter 2 - Part II: Environment and Agent types", "ko": "2장 파트 II: 환경과 에이전트 유형", "o": [["Chapter 2 - Part II: Environment and Agent types", "2장 파트 II: 환경과 에이전트 유형"], ["4 Environment types", "④ 환경 유형"]], "x": "2장 파트 II입니다. 로드맵의 ④ 환경 유형(Environment types)을 다룹니다. 환경을 분류하는 기준은 일곱 가지입니다: 관찰 가능성(observable), 에이전트 수(agents), 결정성(deterministic), 에피소드성(episodic), 정적/동적(static), 이산/연속(discrete), 알려짐/모름(known). 앞의 여섯 가지가 교재 Figure 2.6 표의 여섯 열이고, 일곱 번째(known/unknown)는 성격이 조금 달라 따로 다룹니다(11쪽). 이 분류를 왜 배우는지는 14쪽에 답이 있습니다: <b>환경의 종류가 에이전트에 필요한 기능을 결정</b>하기 때문입니다.", "pg": [[1, 1], [1, 1]]}, {"s": "2-2", "im": ["2-2-03"], "en": "What Counts as the Environment?", "ko": "무엇이 환경에 해당하는가?", "key": 1, "o": [["The environment is everything except the agent function", "환경은 에이전트 함수를 제외한 모든 것이다"], ["This leads somewhere strange: The <b>sensors</b> and <b>actuators</b> are part of the <b>environment</b> too.. — Ex: 1080p vs 720p, High-torque actuator..", "이것은 이상한 결론으로 이어진다: <b>센서</b>와 <b>액추에이터</b>도 <b>환경</b>의 일부다.. — 예: 1080p vs 720p 카메라, 고토크 액추에이터.."], ["The agent function is only the mapping from percepts to actions / The camera that produces the percept is on the outside of that line", "에이전트 함수는 지각에서 행동으로의 대응일 뿐이다 / 지각을 만들어 내는 카메라는 그 경계선 바깥에 있다"]], "x": "환경의 경계를 어디에 긋느냐는 질문입니다. 답: <b>에이전트 함수(지각→행동 대응 규칙) 빼고 전부</b>가 환경입니다. 그러면 이상하게 들리는 결론이 나옵니다 — 로봇의 눈(카메라)과 팔(액추에이터)도 환경이라는 것입니다. 왜냐하면 에이전트 함수는 \"이런 지각이 들어오면 이런 행동\"이라는 순수한 <b>결정 규칙(두뇌 소프트웨어)</b>이고, 카메라는 그 규칙에 지각을 넣어 주는 바깥 장치이기 때문입니다. 두뇌 입장에서 카메라 화질(1080p냐 720p냐)이나 모터의 힘(고토크냐 아니냐)은 자기가 바꿀 수 없는 <b>주어진 조건</b>이고, 주어진 조건은 모두 환경입니다. 그림의 로봇 팔·휴머노이드(액추에이터), 체스판, 자율주행차의 카메라 시야가 모두 이 '환경' 쪽에 속합니다.", "e": "게이머의 실력(에이전트 함수)은 같아도, 입력 지연이 큰 패드와 저화질 모니터를 쓰면 성적이 떨어집니다. 패드와 모니터는 실력이 아니라 '환경'이기 때문입니다."}, {"s": "2-2", "im": ["2-2-04"], "en": "Environment Types: Fully or Partially Observable", "ko": "완전 관찰 가능 vs 부분 관찰 가능", "key": 1, "o": [["Fully observable – the sensors deliver everything <b>relevant to the decision</b>, at every step", "완전 관찰 가능 — 센서가 <b>결정에 관련된</b> 모든 것을 매 단계 전달한다"], ["Partially observable – something relevant is hidden: Noisy or inaccurate sensors / Or state that simply is not sensed", "부분 관찰 가능 — 관련된 무언가가 숨겨져 있다: 잡음이 섞이거나 부정확한 센서 / 또는 아예 감지되지 않는 상태"]], "x": "첫 번째 기준, <b>관찰 가능성</b>입니다. 핵심은 \"세상 전부가 보이느냐\"가 아니라 <b>\"결정에 필요한 것이 다 보이느냐\"</b>입니다. 체스는 판 위의 모든 말이 보이므로 완전 관찰 가능(fully observable)입니다. 자율주행 도로는 앞차 뒤에 무엇이 있는지, 옆 차 운전자가 끼어들 생각인지 보이지 않으므로 부분 관찰 가능(partially observable)입니다. 부분 관찰이 되는 이유는 두 가지: ① 센서가 있지만 잡음이 섞이거나 부정확함(안개 낀 날의 카메라) ② 그 정보를 재는 센서 자체가 없음(상대의 속마음). 부분 관찰 가능한 환경에서는 \"지금 안 보이는 것은 아까 봤던 것으로 추정\"해야 하므로 에이전트에 <b>기억(memory)</b>이 필요합니다(→ 14쪽, 2-3의 모델 기반 에이전트).", "e": "완전 관찰: 오목, 스도쿠, 체스, 바둑. 부분 관찰: 포커(상대 카드가 안 보임), 게임의 '전장의 안개', 청소기에게 침대 밑."}, {"s": "2-2", "im": ["2-2-05"], "en": "Environment Types: Single-Agent or Multiagent", "ko": "단일 에이전트 vs 다중 에이전트", "key": 1, "o": [["The test is there another entity whose success depends on what you do?", "판별법: 당신이 하는 행동에 따라 성공이 달라지는 다른 개체가 있는가?"], ["Careful with the test – a falling rock is not an agent / It is only an agent if modelling it as maximizing something is the useful thing to do", "판별법을 쓸 때 조심 — 떨어지는 바위는 에이전트가 아니다 / '무언가를 최대화하려는 존재'로 모델링하는 것이 유용할 때만 에이전트다"]], "x": "두 번째 기준, <b>에이전트 수</b>입니다. 스도쿠(왼쪽 그림)는 나 혼자 푸는 단일 에이전트(single-agent) 환경이고, 체스(오른쪽)는 내 수에 따라 상대의 성패가 달라지므로 다중 에이전트(multiagent) 환경입니다. 판별 기준: \"내 행동에 따라 성공이 달라지는 <b>다른 존재</b>가 있는가?\"<br>단, 모든 움직이는 것이 에이전트는 아닙니다. 떨어지는 바위는 내 행동과 상관없이 물리 법칙대로 떨어질 뿐이므로 에이전트가 아니라 환경의 일부입니다. 어떤 것을 에이전트로 볼지는 '그것이 <b>무언가를 최대화하려 한다고 생각하면 예측이 더 잘 되는가</b>'로 정합니다. 도로의 다른 운전자는 \"빨리, 안전하게 가려 한다\"고 보면 행동이 잘 예측되므로 에이전트로 봅니다.", "e": "로봇 청소기가 강아지를 피해야 한다면? 강아지를 '움직이는 장애물'로 봐도 되지만, '간식을 원하는 존재'로 모델링하면 다음 움직임이 더 잘 예측되므로 에이전트로 보는 것이 유용할 수 있습니다."}, {"s": "2-2", "im": ["2-2-06"], "en": "Environment Types: Competitive and Cooperative", "ko": "경쟁적 vs 협력적", "key": 1, "o": [["Multiagent settings come in two flavors, and usually both at once", "다중 에이전트 환경은 두 가지 맛이 있고, 보통 둘이 동시에 있다"], ["Competitive — Chess: your opponent's performance measure is the opposite of yours / Cooperative — Taxi-driving environment: avoiding collisions maximizes the performance measure of all agents", "경쟁적 — 체스: 상대의 성능 척도는 당신의 것과 정반대다 / 협력적 — 택시 운전 환경: 충돌을 피하는 것은 모든 에이전트의 성능 척도를 최대화한다"], ["Driving is partly both — Only one car fits the parking space: as fast as possible, avoiding collision.", "운전은 부분적으로 둘 다다 — 주차 공간에는 한 대만 들어간다: 최대한 빨리, 그러나 충돌은 피하면서."], ["Multiagent settings make two odd things rational: communicating, and behaving unpredictably – Poker", "다중 에이전트 환경은 이상한 두 가지를 합리적으로 만든다: 의사소통, 그리고 예측 불가능하게 행동하기 — 포커"]], "x": "다중 에이전트 환경은 둘로 나뉩니다.<ul><li><b>경쟁적(competitive)</b>: 상대가 잘되면 내가 못 되는 관계. 체스에서 상대의 점수는 내 점수의 정반대입니다(제로섬).</li><li><b>협력적(cooperative)</b>: 함께 잘되는 관계. 도로에서 충돌을 피하면 모든 운전자에게 좋습니다.</li></ul>현실은 보통 둘이 섞여 있습니다. 운전은 협력적이지만, 주차 자리가 하나뿐이면 먼저 가려는 경쟁이 생깁니다.<br>다중 에이전트 환경에서는 혼자일 때는 이상해 보이는 두 행동이 합리적이 됩니다: ① <b>의사소통</b> — 방향지시등, 경적처럼 내 의도를 알리면 협력이 쉬워집니다. ② <b>예측 불가능하게 행동하기</b> — 혼자일 때는 무작위로 행동할 이유가 전혀 없지만, 상대가 있으면 내 행동이 읽히는 것 자체가 약점입니다. 포커에서 좋은 패일 때만 돈을 걸면 상대가 금방 알아채므로 가끔 나쁜 패로도 거는 <b>블러핑</b>이 합리적입니다. (보충: 이런 무작위 전략을 게임 이론에서 혼합 전략(mixed strategy)이라고 합니다.)", "e": "가위바위보: 항상 바위만 내면 상대가 보만 냅니다. 1/3씩 무작위로 내는 것이 가장 안전한 전략 — '예측 불가능하게 행동하기'가 합리적인 예."}, {"s": "2-2", "im": ["2-2-07"], "en": "Environment Types: Deterministic, Nondeterministic, Stochastic", "ko": "결정적, 비결정적, 확률적", "key": 1, "o": [["<b>Deterministic</b> – the next state of the environment is completely determined by the current state and the action executed by the agent(s).", "<b>결정적</b> — 환경의 다음 상태가 현재 상태와 에이전트(들)가 실행한 행동에 의해 완전히 결정된다."], ["<b>Nondeterministic</b> – several outcomes are possible, and we do not put numbers on them — Ex) \"It might rain\"", "<b>비결정적</b> — 여러 결과가 가능하고, 거기에 숫자(확률)를 붙이지 않는다 — 예) \"비가 올지도 모른다\""], ["<b>Stochastic</b> – the model attaches probabilities — Ex) \"A 25% chance of rain\"", "<b>확률적</b> — 모델이 확률을 붙인다 — 예) \"비 올 확률 25%\""], ["One caution: <b>If the environment is partially observable, however, then it could appear to be nondeterministic.</b> The world is not rolling dice – you just cannot see the whole board", "한 가지 주의: <b>그러나 환경이 부분 관찰 가능하면, 비결정적인 것처럼 보일 수 있다.</b> 세상이 주사위를 굴리는 것이 아니라, 당신이 판 전체를 보지 못할 뿐이다"]], "x": "세 번째 기준, <b>결정성</b>입니다. \"같은 상태에서 같은 행동을 하면 항상 같은 결과가 나오는가?\"<ul><li><b>결정적(deterministic)</b>: 항상 같은 결과. 체스에서 나이트를 옮기면 정확히 그 자리로 갑니다.</li><li><b>비결정적(nondeterministic)</b>: 결과가 여러 가지일 수 있는데, 각각이 얼마나 자주 일어나는지 <b>숫자는 없음</b>. \"비가 올지도 모른다\"처럼 가능성 목록만 있습니다.</li><li><b>확률적(stochastic)</b>: 결과가 여러 가지이고 각각에 <b>확률 숫자</b>가 붙어 있음. \"비 올 확률 25%\". 확률이 있으면 기대 효용(2-1)을 계산할 수 있습니다.</li></ul>비결정적과 확률적의 차이는 \"가능성 목록만 있나, 확률 숫자까지 있나\" 하나입니다. 슬라이드의 밑줄 친 주의 사항이 시험 포인트입니다: <b>부분 관찰 가능한 환경은 사실 결정적이어도 비결정적처럼 보일 수 있습니다.</b> 세상이 주사위를 굴리는 것이 아니라, 내가 판 전체를 못 보기 때문에 결과가 제멋대로인 것처럼 느껴질 뿐입니다. 관찰 가능성(4쪽)과 결정성(7쪽)은 서로 다른 축이라는 뜻입니다.", "e": "결정적: 체스, 스도쿠. 확률적: 주사위를 쓰는 백개먼, 게임의 '명중률 70%' 스킬. 비결정적: 처음 쓰는 기계의 버튼(\"뭔가 일어나긴 하는데 뭐가 될지 모름\"). 카드 섞기는 물리적으로는 정해진 과정이지만 볼 수 없어서 무작위로 보입니다 — 부분 관찰이 비결정적처럼 보이는 예."}, {"s": "2-2", "im": ["2-2-08"], "en": "Environment Types: Episodic or Sequential", "ko": "에피소드적 vs 순차적", "key": 1, "o": [["Episodic – experience comes in independent pieces: Perceive, act, done. The next episode does not care what you did — Ex) Figuring broken parts on a production line", "에피소드적 — 경험이 독립된 조각들로 온다: 지각하고, 행동하고, 끝. 다음 에피소드는 당신이 무엇을 했는지 신경 쓰지 않는다 — 예) 생산 라인에서 불량 부품 가려내기"], ["Sequential – this decision shapes every decision after it — Ex) Chess. Driving. Almost everything interesting", "순차적 — 이번 결정이 이후의 모든 결정을 좌우한다 — 예) 체스. 운전. 흥미로운 거의 모든 것"]], "x": "네 번째 기준, <b>에피소드성</b>입니다. \"지금 내린 결정이 다음 결정에 영향을 주는가?\"<ul><li><b>에피소드적(episodic)</b>: 경험이 서로 독립된 조각(에피소드)으로 옵니다. 지각 → 행동 → 끝, 그리고 다음 조각은 처음부터 새로 시작. 그림의 생산 라인 검사처럼, 이 부품을 불량으로 판정했다고 다음 부품의 판정이 달라지지 않습니다. 앞을 내다볼 필요가 없어 <b>쉽습니다</b>.</li><li><b>순차적(sequential)</b>: 이번 결정이 다음 상황을 바꾸고, 그것이 또 다음을 바꿉니다. 체스에서 지금 둔 수가 끝까지 영향을 주고, 운전에서 지금 차선을 바꾸면 그다음 선택지가 달라집니다. \"지금의 선택이 나중에 어떤 결과를 낳을지\" <b>계획(planning)</b>해야 해서 어렵습니다. 슬라이드 말대로 \"흥미로운 거의 모든 것\"이 순차적이고, 3장의 탐색이 바로 이 계획을 하는 방법입니다.</li></ul>", "e": "에피소드적: 사진 한 장을 고양이/개로 분류하기, 스팸 메일 한 통 판별하기. 순차적: 수강 신청(선수 과목을 안 들으면 다음 학기에 못 듣는 과목이 생김), RPG의 스킬 트리."}, {"s": "2-2", "im": ["2-2-09"], "en": "Environment Types: Static, Dynamic, Semidynamic", "ko": "정적, 동적, 준동적", "key": 1, "o": [["Static – the world waits while the agent thinks — Ex) A crossword puzzle does not move, thinking (waiting) is free.", "정적 — 에이전트가 생각하는 동안 세상이 기다린다 — 예) 십자말풀이는 움직이지 않는다, 생각하는(기다리는) 것은 공짜다."], ["Dynamic – the world changes during consideration — Ex) Driving. And note: not deciding (waiting) is itself a decision.", "동적 — 고민하는 동안 세상이 변한다 — 예) 운전. 그리고 주의: 결정하지 않는 것(기다리는 것)도 그 자체로 하나의 결정이다."], ["Semidynamic – the world holds still, but your score does not — Chess with a clock", "준동적 — 세상은 가만히 있지만, 당신의 점수는 그렇지 않다 — 시계가 있는 체스"], ["Dynamic environments punish slow reasoning, which constrains which algorithms you can use at all.", "동적 환경은 느린 추론을 처벌하며, 이는 애초에 쓸 수 있는 알고리즘을 제약한다."]], "x": "다섯 번째 기준, <b>정적/동적</b>입니다. \"내가 생각하는 동안 세상이 변하는가?\"<ul><li><b>정적(static)</b>: 세상이 기다려 줍니다. 십자말풀이는 한 시간 고민해도 그대로이고, 고민하는 데 비용이 들지 않습니다.</li><li><b>동적(dynamic)</b>: 고민하는 동안 세상이 바뀝니다. 교차로에서 3초 고민하는 사이에 다른 차는 움직이고 신호는 바뀝니다. 그래서 \"아직 결정 안 했어\"도 사실은 \"아무것도 안 하기\"를 결정한 것과 같습니다.</li><li><b>준동적(semidynamic)</b>: 세상은 가만히 있지만 <b>점수</b>가 변합니다. 시계가 있는 체스는 판은 그대로지만 시간이 흐를수록 불리해집니다.</li></ul>마지막 줄이 중요합니다: 동적 환경에서는 느린 추론이 손해이므로, 정확하지만 느린 알고리즘 대신 <b>빠르고 충분히 좋은</b> 방법을 써야 합니다. 환경의 성질이 알고리즘 선택을 제약하는 예입니다.", "e": "정적: 집에서 수학 문제 풀기. 준동적: 시험장(문제는 그대로지만 시간이 흐름). 동적: 운전, 스타크래프트, 탁구."}, {"s": "2-2", "im": ["2-2-10"], "en": "Environment Types: Discrete or Continuous", "ko": "이산 vs 연속", "key": 1, "o": [["This applies to three things at once: <b>state</b>, <b>time</b>, and <b>percepts/actions</b>", "이 구분은 세 가지에 동시에 적용된다: <b>상태</b>, <b>시간</b>, 그리고 <b>지각/행동</b>"], ["Chess/Go: finitely many states, distinct moves, discrete throughout", "체스/바둑: 유한한 개수의 상태, 구별되는 수, 처음부터 끝까지 이산적"], ["Driving: position and speed sweep smoothly, steering angle is continuous, time does not tick", "운전: 위치와 속도는 매끄럽게 변하고, 핸들 각도는 연속적이며, 시간은 똑딱 끊어지지 않는다"]], "x": "여섯 번째 기준, <b>이산/연속</b>입니다. <b>이산(discrete)</b>은 계단처럼 값을 하나하나 셀 수 있는 것, <b>연속(continuous)</b>은 경사로처럼 끊김 없이 어떤 값이든 될 수 있는 것입니다. 이 구분은 세 군데에 따로 적용됩니다: <b>상태</b>(판의 배치는 유한한가, 위치는 실수인가), <b>시간</b>(턴 단위로 흐르는가, 끊김 없이 흐르는가), <b>지각/행동</b>(수가 몇 가지로 정해져 있는가, 핸들 각도처럼 무한히 많은가). 체스와 바둑은 셋 다 이산이고, 운전은 셋 다 연속입니다.<br>왜 중요한가: 이산이면 경우의 수를 <b>나열하고 탐색</b>할 수 있지만(3장), 연속이면 경우의 수가 무한해서 미적분·최적화 같은 다른 도구가 필요합니다(4장). 컴퓨터는 연속 세계를 잘게 쪼개 이산으로 근사(discretize)하기도 합니다 — 3장의 미로를 격자로 나누는 것이 그 예입니다.", "e": "온도조절기: 온도(상태)는 연속이지만 행동은 {켜기, 끄기} 두 가지로 이산. 이렇게 한 환경 안에서도 축마다 다를 수 있습니다."}, {"s": "2-2", "im": ["2-2-11"], "en": "Environment Types: Known or Unknown", "ko": "알려짐 vs 모름", "key": 1, "o": [["This one is not a property of the environment at all / It is about the agent's or designer's knowledge of the rules", "이것은 환경의 속성이 전혀 아니다 / 에이전트나 설계자가 규칙을 얼마나 아는가에 관한 것이다"], ["The <b>performance measure</b> itself can be unknown — Ex) A taxi does not know whether this passenger wants speed or calm / Ex) Which quietly turns a single-agent problem into something closer to multiagent", "<b>성능 척도</b> 자체도 모를 수 있다 — 예) 택시는 이 승객이 빠름을 원하는지 편안함을 원하는지 모른다 / 예) 이것은 단일 에이전트 문제를 조용히 다중 에이전트에 가까운 것으로 바꾼다"]], "x": "일곱 번째 기준, <b>알려짐/모름(known/unknown)</b>은 앞의 여섯과 성격이 다릅니다. 환경 자체의 성질이 아니라 <b>에이전트(또는 설계자)가 환경의 규칙을 아는가</b>에 관한 것입니다. 여기서 '규칙'이란 \"이 행동을 하면 어떤 결과가 나오는가\"입니다. 그림: 사막만 달리던 지프를 한국 도심에 갖다 놓으면, 신호등·횡단보도·차선이 전부 눈에 보이지만(완전 관찰 가능) 그것들이 무슨 뜻인지 규칙은 모릅니다(unknown). 반대로 포커는 규칙은 다 알지만(known) 상대 카드가 안 보입니다(부분 관찰). 즉 <b>관찰 가능성(지금 상태가 보이는가)</b>과 <b>알려짐(규칙을 아는가)</b>은 별개입니다.<br>두 번째 포인트: 모를 수 있는 것은 규칙만이 아니라 <b>성능 척도</b>일 수도 있습니다. 택시는 이 승객이 '빨리'를 원하는지 '편안하게'를 원하는지 모릅니다. 그러면 승객의 선호를 알아내야 하므로, 승객이 또 하나의 에이전트가 되어 단일 에이전트 문제가 다중 에이전트 문제에 가까워집니다.", "e": "부분 관찰 + 알려짐: 포커(룰은 알지만 상대 패가 안 보임). 완전 관찰 + 모름: 버튼이 다 보이는 낯선 해외 자판기(뭐가 나올지 모름). 규칙을 모르면 에이전트는 눌러 보며 <b>탐험</b>해야 합니다(14쪽)."}, {"s": "2-2", "im": ["2-2-12", "2-2-13"], "en": "Let's Think About It — Answers (Figure 2.6)", "ko": "생각해 봅시다 — 정답 (그림 2.6)", "key": 1, "fill": "fig26", "o": [["For each one: observable, agents, deterministic, episodic, static, discrete? — Crossword puzzle · Chess with a clock · Poker · Backgammon · Taxi driving · Medical diagnosis", "각각에 대해: 관찰 가능성, 에이전트 수, 결정성, 에피소드성, 정적, 이산? — 십자말풀이 · 시계 있는 체스 · 포커 · 백개먼 · 택시 운전 · 의료 진단"], ["Figure 2.6 Examples of task environments and their characteristics. — Crossword puzzle: Fully, Single, Deterministic, Sequential, Static, Discrete / Chess with a clock: Fully, Multi, Deterministic, Sequential, Semi, Discrete / Poker: Partially, Multi, Stochastic, Sequential, Static, Discrete / Backgammon: Fully, Multi, Stochastic, Sequential, Static, Discrete / Taxi driving: Partially, Multi, Stochastic, Sequential, Dynamic, Continuous / Medical diagnosis: Partially, Single, Stochastic, Sequential, Dynamic, Continuous / Image analysis: Fully, Single, Deterministic, Episodic, Semi, Continuous / Part-picking robot: Partially, Single, Stochastic, Episodic, Dynamic, Continuous / Refinery controller: Partially, Single, Stochastic, Sequential, Dynamic, Continuous / English tutor: Partially, Multi, Stochastic, Sequential, Dynamic, Discrete", "그림 2.6 과업 환경의 예와 그 특성. — 십자말풀이: 완전, 단일, 결정적, 순차적, 정적, 이산 / 시계 있는 체스: 완전, 다중, 결정적, 순차적, 준동적, 이산 / 포커: 부분, 다중, 확률적, 순차적, 정적, 이산 / 백개먼: 완전, 다중, 확률적, 순차적, 정적, 이산 / 택시 운전: 부분, 다중, 확률적, 순차적, 동적, 연속 / 의료 진단: 부분, 단일, 확률적, 순차적, 동적, 연속 / 영상 분석: 완전, 단일, 결정적, 에피소드적, 준동적, 연속 / 부품 집기 로봇: 부분, 단일, 확률적, 에피소드적, 동적, 연속 / 정유 공장 제어기: 부분, 단일, 확률적, 순차적, 동적, 연속 / 영어 튜터: 부분, 다중, 확률적, 순차적, 동적, 이산"], ["Not always clear cut. Medical diagnosis is single-agent only if you decline to model the patient as one, and episodic only if the task is one diagnosis rather than a course of treatment.", "항상 딱 떨어지지는 않는다. 의료 진단은 환자를 에이전트로 모델링하지 않기로 할 때만 단일 에이전트이고, 치료 과정이 아니라 한 번의 진단이 과업일 때만 에피소드적이다."]], "x": "12쪽에서 여섯 환경을 직접 분류해 보고, 13쪽의 교재 <b>Figure 2.6</b>으로 답을 확인합니다(아래 연습 표에서 직접 채워 볼 수 있습니다). 여섯 기준을 한 줄로 묻는 질문: 다 보이나? / 상대가 있나? / 결과가 정해져 있나? / 한 판으로 끝나나? / 생각하는 동안 변하나? / 셀 수 있나? 헷갈리기 쉬운 칸들:<ul><li><b>Crossword가 Sequential</b>: 한 칸에 넣은 단어가 교차하는 칸을 제약하므로 앞 결정이 뒤에 영향을 줍니다.</li><li><b>Poker가 Static</b>: 상대가 생각하는 동안 판이 변하지 않습니다(동적은 '시간이 흐르면 세상이 변함'이지 '상대가 있음'이 아님).</li><li><b>Backgammon이 Fully인데 Stochastic</b>: 판은 다 보이지만 주사위가 있습니다 → 관찰 가능성과 결정성은 독립된 축(7쪽의 주의와 연결).</li><li><b>Image analysis가 Semi</b>: 이미지는 그대로지만 처리 시간이 성능에 영향을 줍니다. Episodic인 이유는 사진 한 장 한 장이 독립이기 때문.</li><li><b>Medical diagnosis가 Single·Sequential</b>: 환자를 에이전트로 보지 않을 때만 단일이고, 한 번의 진단이 아니라 치료 과정 전체를 보면 순차적입니다 — 슬라이드 아래 주석처럼 분류는 '과업을 어떻게 정했느냐'에 따라 달라집니다.</li><li><b>English tutor가 Discrete·Multi</b>: 대화가 단어·문장 단위라 이산, 학생이 또 다른 에이전트라 다중.</li></ul>", "e": "시험에서 \"백개먼은 왜 fully observable인데 stochastic인가?\"처럼 두 축을 섞어 묻기 좋습니다. 답: 판 위의 말은 전부 보이지만(관찰), 주사위 결과는 정해져 있지 않다(결정성)."}, {"s": "2-2", "im": ["2-2-14"], "en": "The Environment Decides the Design", "ko": "환경이 설계를 결정한다", "key": 1, "o": [["This is the payoff of the whole section. Each property makes a demand:", "이것이 이 절 전체의 결론이다. 각 속성은 하나의 요구를 만든다:"], ["Partially observable → the agent needs memory / Nondeterministic → it must prepare for possibility / Multiagent → acting unpredictably may become rational / Static → there is time to compute a good decision", "부분 관찰 가능 → 에이전트에 기억이 필요하다 / 비결정적 → 여러 가능성에 대비해야 한다 / 다중 에이전트 → 예측 불가능하게 행동하는 것이 합리적일 수 있다 / 정적 → 좋은 결정을 계산할 시간이 있다"], ["Continuous time → it becomes a controller, always running / Unknown rules → it must explore / Unknown performance measure → it must learn from the person it serves", "연속 시간 → 항상 돌아가는 제어기가 된다 / 규칙을 모름 → 탐험해야 한다 / 성능 척도를 모름 → 자기가 섬기는 사람에게서 배워야 한다"]], "x": "환경 분류를 왜 배웠는지에 대한 답, 이 절의 결론입니다. 환경의 각 성질이 에이전트에 <b>꼭 넣어야 할 기능</b> 하나를 요구합니다.<div class='tw'><table><tr><th>환경이 이러면</th><th>에이전트는 이것이 필요</th><th>이어지는 내용</th></tr><tr><td>부분 관찰 가능</td><td>안 보이는 것을 추정할 <b>기억</b></td><td>2-3 모델 기반 에이전트</td></tr><tr><td>비결정적</td><td>여러 결과에 대한 <b>대비</b></td><td>4장 비결정적 탐색</td></tr><tr><td>다중 에이전트</td><td>때로는 <b>무작위 행동</b></td><td>게임 이론</td></tr><tr><td>정적</td><td>천천히 <b>계산</b>해도 됨</td><td>3장 탐색</td></tr><tr><td>연속 시간</td><td>쉬지 않고 도는 <b>제어기</b></td><td>제어 이론</td></tr><tr><td>규칙을 모름</td><td><b>탐험</b></td><td>4장 온라인 탐색, 강화학습</td></tr><tr><td>성능 척도를 모름</td><td>사람에게서 <b>배우기</b></td><td>2-3 학습 에이전트</td></tr></table></div>즉 PEAS를 적고 환경을 분류하면, 어떤 종류의 에이전트를 만들어야 하는지가 거의 자동으로 정해집니다. 다음 절(2-3)의 에이전트 유형 네 가지가 바로 이 요구들에 대한 답입니다. (보충: 마지막 줄 '사람에게서 성능 척도를 배우기'는 오늘날 LLM을 사람 피드백으로 훈련하는 RLHF 같은 AI 안전 연구의 주제입니다.)", "e": "로봇 청소기: 침대 밑이 안 보임(부분 관찰) → 지도를 기억 · 러그에서 미끄러짐(비결정적) → 재시도 준비 · 처음 온 집(규칙 모름) → 돌아다니며 지도 작성(탐험)."}, {"s": "2-2", "im": ["2-2-15", "2-2-16"], "en": "Agent types — Why Not Just Use a Table?", "ko": "에이전트 유형 — 그냥 표를 쓰면 안 될까?", "key": 1, "o": [["5 Agent types", "⑤ 에이전트 유형"], ["We said any agent function can be written as a table — So why not build the table and look the answer up? / Chess would need somewhere around 10^150 entries. Too huge..", "어떤 에이전트 함수든 표로 쓸 수 있다고 했다 — 그럼 표를 만들어 놓고 답을 찾아보면 안 될까? / 체스는 약 10^150개의 항목이 필요하다. 너무 크다.."], ["Three separate walls, any one of them fatal: No machine could store it / No designer could fill it in / No agent could learn all the right entries", "세 개의 별개 벽, 그중 하나만으로도 치명적: 어떤 기계도 저장할 수 없다 / 어떤 설계자도 채워 넣을 수 없다 / 어떤 에이전트도 올바른 항목을 전부 학습할 수 없다"], ["So the rest of the chapter asks: <b>how do we get the same behavior out of a small program?</b>", "그래서 이 장의 나머지는 묻는다: <b>작은 프로그램으로 어떻게 같은 행동을 얻을까?</b>"]], "x": "로드맵 ⑤ 에이전트 유형으로 넘어갑니다. 2-1에서 \"에이전트 함수는 지각 순열 → 행동의 표\"라고 했으니, 그냥 그 표를 다 만들어 놓고 찾아보면 되지 않을까요? 안 되는 이유가 세 가지 벽입니다. 체스의 표는 약 10<sup>150</sup>줄 — 관측 가능한 우주의 원자 수(약 10<sup>80</sup>)보다 훨씬 많습니다.<ul><li><b>저장</b>할 기계가 없다.</li><li>설계자가 그 줄을 다 <b>채울</b> 수 없다.</li><li>에이전트가 경험으로 그 줄을 다 <b>배울</b> 수도 없다.</li></ul>셋 중 하나만으로도 불가능합니다. 그래서 질문이 바뀝니다(굵게 강조): <b>표와 똑같이 행동하는 작은 프로그램을 어떻게 만들까?</b> 이 질문의 답이 2-3의 네 가지 에이전트 구조(단순 반사 → 모델 기반 → 목표 기반 → 효용 기반)와 학습 에이전트입니다.", "e": "구구단 81칸은 표로 외우지만, 1234 × 5678은 표 대신 곱셈 '알고리즘'을 씁니다. 모든 곱셈을 표로 만들 수 없기 때문입니다. 청소기의 3줄 프로그램(2-1)도 무한한 표를 작은 프로그램으로 바꾼 예입니다.", "pg": [[1, 1], [1, 3]]}, {"s": "2-2", "im": ["2-2-21"], "en": "Where Simple Reflex Breaks", "ko": "단순 반사가 무너지는 곳", "key": 1, "o": [["Take the <b>location</b> sensor away. Now it knows only clean or dirty", "<b>위치</b> 센서를 없애 보자. 이제 깨끗한지 더러운지만 안다"], ["On [Clean], what should it do? It cannot tell A from B — Always Left: stuck forever if it started in B / Always Right: stuck forever if it started in A", "[깨끗함]일 때 무엇을 해야 하나? A와 B를 구별할 수 없다 — 항상 왼쪽: B에서 시작했으면 영원히 갇힌다 / 항상 오른쪽: A에서 시작했으면 영원히 갇힌다"], ["A little unobservability is enough to trap it in a loop", "약간의 관찰 불가능성만으로도 루프에 갇히기에 충분하다"], ["One escape: <b>randomize</b> — A coin flip reaches the other square in two steps on average / A useful trick, not a real fix. Better is to give it a memory", "탈출구 하나: <b>무작위화</b> — 동전 던지기로 평균 두 단계면 다른 칸에 도달한다 / 유용한 요령이지, 진짜 해결책은 아니다. 더 나은 것은 기억을 주는 것"]], "x": "단순 반사 에이전트(2-3에서 자세히)가 무너지는 예입니다. 청소기에서 위치 센서를 빼면 지각이 [Clean]/[Dirty]뿐이라 내가 A에 있는지 B에 있는지 모릅니다. [Clean]일 때 \"항상 왼쪽으로\"라고 정하면, B에서 시작했을 때는 왼쪽의 A로 가서 치우지만 A에서 시작했을 때는 왼쪽 벽에 막혀 영원히 제자리입니다. \"항상 오른쪽\"도 반대 경우에 똑같이 갇힙니다. 센서 하나가 없어진 것만으로(약간의 관찰 불가능성) 무한 루프에 빠지는 것입니다.<br>탈출구: <b>무작위화</b>. [Clean]이면 동전을 던져 왼쪽/오른쪽을 정하면, 매 단계 1/2 확률로 맞는 방향이므로 평균 2단계면 다른 칸에 도착합니다(기하분포의 기댓값 1 ÷ 1/2 = 2). 하지만 이것은 요령일 뿐이고, 제대로 된 해결은 <b>기억</b>을 주는 것 — \"방금 왼쪽으로 갔는데 벽이었으니 나는 A에 있다\"를 기억하면 됩니다(2-2 14쪽의 '부분 관찰 → 기억 필요', 2-3의 모델 기반 반사 에이전트). 그림의 로봇이 낭떠러지를 뛰어넘다 떨어지는 모습은 2-1 05쪽 그림과 대비됩니다.<div class='warn'>2-2 강의의 나머지 에이전트 유형 슬라이드(17~38쪽)는 2-3 강의와 같은 내용이라 2-3 소단원에 모아 두었습니다.</div>", "e": "밤에 깜깜한 방에서 문을 찾을 때: 항상 왼쪽으로만 더듬으면 운이 나쁘면 영원히 못 찾지만, 방향을 무작위로 바꾸면 언젠가는 찾습니다. 더 좋은 방법은 \"이쪽은 이미 더듬어 봤다\"를 기억하는 것입니다."}, {"s": "2-3", "im": ["2-3-01", "2-3-02"], "en": "Chapter 2 - Part III: Agent types — A Hierarchy of Agent Types", "ko": "2장 파트 III: 에이전트 유형 — 에이전트 유형의 계층", "key": 1, "o": [["Chapter 2 - Part III: Agent types", "2장 파트 III: 에이전트 유형"], ["A Hierarchy of Agent Types — Utility-based agents ↑ Goal-based agents ↑ Model-based reflex agents ↑ Simple reflex agents — More capable", "에이전트 유형의 계층 — 효용 기반 ↑ 목표 기반 ↑ 모델 기반 반사 ↑ 단순 반사 — 위로 갈수록 더 유능"]], "x": "2-2 16쪽의 질문 \"작은 프로그램으로 어떻게 표와 같은 행동을 얻을까?\"에 대한 답이 네 가지 에이전트 구조(architecture)입니다. 아래에서 위로 갈수록 할 수 있는 일이 많아지고, 각 단계는 바로 아래 단계가 못 하던 것 하나를 고칩니다.<div class='tw'><table><tr><th>유형</th><th>행동을 고르는 근거</th><th>못 하는 것 (다음 단계가 고침)</th></tr><tr><td>① 단순 반사 (Simple reflex)</td><td>지금 보이는 것(현재 지각)만</td><td>안 보이는 것은 모름</td></tr><tr><td>② 모델 기반 반사 (Model-based reflex)</td><td>현재 지각 + 기억해 둔 내부 상태</td><td>목적이 바뀌면 규칙을 전부 갈아야 함</td></tr><tr><td>③ 목표 기반 (Goal-based)</td><td>\"이 행동을 하면 목표에 도달하나?\"</td><td>목표에 가는 여러 방법 중 어느 것이 더 좋은지 모름</td></tr><tr><td>④ 효용 기반 (Utility-based)</td><td>\"이 상태가 얼마나 좋은가?\" (점수)</td><td>효용 함수를 설계하기 어려움</td></tr></table></div>그리고 이 네 가지 모두에 <b>학습</b>을 붙일 수 있습니다(18~19쪽). 더 유능하다고 항상 더 좋은 것은 아닙니다 — 위로 갈수록 계산이 무거워지므로, 2-2에서 분류한 환경에 맞는 가장 단순한 구조를 고르는 것이 설계입니다.", "e": "미로 로봇으로 네 단계: 반사 \"벽이면 오른쪽으로 돈다\" / 모델 기반 \"아까 왼쪽은 막혔었지\" / 목표 기반 \"출구까지 경로를 미리 계획\" / 효용 기반 \"여러 경로 중 가장 짧고 안전한 길\".", "pg": [[1, 1], [1, 1]]}, {"s": "2-3", "im": ["2-3-03"], "en": "Simple Reflex Agent", "ko": "단순 반사 에이전트", "key": 1, "o": [["Sensors → What the world is like now → (Condition-action rules) → What action I should do now → Actuators", "센서 → 지금 세상은 어떤 모습인가 → (조건-행동 규칙) → 지금 어떤 행동을 해야 하나 → 액추에이터"], ["Acts on the current percept alone.", "오직 현재 지각만을 근거로 행동한다."]], "x": "가장 단순한 구조, <b>단순 반사 에이전트</b>입니다. 그림을 위에서 아래로 읽으면: 센서가 환경을 봄 → \"지금 세상은 이렇다\" → <b>조건-행동 규칙(condition-action rules)</b>에 대조 → \"그러면 이 행동\" → 액추에이터가 실행. 그림에 <b>과거를 저장하는 상자가 전혀 없다</b>는 점이 핵심입니다. 조건-행동 규칙은 \"<b>if</b> 조건 <b>then</b> 행동\" 형태의 규칙 목록으로, 뜨거운 것에 닿으면 생각 없이 손을 빼는 반사 신경과 같습니다. 그래서 이름이 '반사(reflex)'입니다.", "e": "자동문: 사람이 감지되면 → 연다. 보일러: 실내 온도 < 설정 온도이면 → 난방을 켠다. 둘 다 '아까 무슨 일이 있었나'는 전혀 보지 않습니다."}, {"s": "2-3", "im": ["2-3-04"], "en": "How a Reflex Agent Runs", "ko": "반사 에이전트는 어떻게 동작하는가", "key": 1, "o": [["The agent function is the current percept alone: <b>a = f(p)</b>", "에이전트 함수는 현재 지각만 쓴다: <b>a = f(p)</b>"], ["So, the interaction is a simple alternation: p<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, a<sub>1</sub>, p<sub>2</sub>, a<sub>2</sub>, … p<sub>t</sub>, a<sub>t</sub>", "그래서 상호작용은 단순한 교대다: p<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, a<sub>1</sub>, p<sub>2</sub>, a<sub>2</sub>, … p<sub>t</sub>, a<sub>t</sub>"], ["Fast, and cheap. It also does not know why it does anything — It does not know the performance measure at all – yet well-chosen rules can still perform well", "빠르고 싸다. 그리고 자기가 왜 무언가를 하는지 모른다 — 성능 척도를 전혀 모른다 – 그래도 잘 고른 규칙이면 여전히 잘할 수 있다"]], "x": "2-1의 일반 에이전트 함수는 f : P* → A, 즉 지각 <b>이력 전체</b>를 입력으로 받았습니다. 단순 반사 에이전트는 그중 현재 지각 <b>p 하나만</b> 봅니다: <b>a = f(p)</b>. 그래서 \"표가 무한히 커지는\" 문제(2-1 07쪽)가 사라집니다 — 지각의 가짓수만큼만 규칙이 있으면 됩니다. 시간 순서로 보면 지각 → 행동 → 지각 → 행동 …의 단순한 교대(p₀, a₀, p₁, a₁, …)이고, 각 행동은 바로 앞의 지각에만 의존합니다.<br>장점: 빠르고 싸다. 단점: <b>자기가 왜 그 행동을 하는지 모른다</b>. 규칙 안에 목표나 성능 척도가 들어 있지 않기 때문입니다. 그래도 설계자가 규칙을 잘 짜 두면 결과적으로 잘 동작합니다 — 다만 그 '똑똑함'은 에이전트가 아니라 설계자의 것입니다.", "e": "가로등: \"어두우면 켠다\". '보행자 안전'이라는 목적은 모르지만 규칙이 좋아서 목적을 달성합니다. 2-1의 청소기 3줄 프로그램도 '깨끗한 방'이라는 목표를 모른 채 규칙만 따르지만 (그 환경에서는) 합리적이었습니다."}, {"s": "2-3", "im": ["2-3-05"], "en": "Example of Simple Reflex Agent", "ko": "단순 반사 에이전트의 예", "o": [["Rule-based reflex vacuum cleaner: function REFLEX-VACUUM-AGENT([location, status]) returns an action — if status = Dirty then return Suck / else if location = A then return Right / else if location = B then return Left", "핵심: 현재 지각만 보는 조건-행동 규칙 3개 — 더러우면 Suck, 아니면 반대쪽 칸으로", "code"], ["Driving: If the car in front is braking, brake. Everything before this instant (history) is ignored.", "운전: 앞차가 브레이크를 밟으면 브레이크를 밟는다. 이 순간 이전의 모든 것(이력)은 무시된다."]], "x": "단순 반사 에이전트의 두 예입니다. 첫째는 2-1의 청소기 3줄 프로그램 — 조건-행동 규칙 세 개로 이루어져 있고, 현재 지각 [위치, 상태]만 봅니다. 실행을 따라가 보면:<div class='tw'><table><tr><th>단계</th><th>지각</th><th>행동</th></tr><tr><td>1</td><td>[A, Dirty]</td><td>Suck</td></tr><tr><td>2</td><td>[A, Clean]</td><td>Right</td></tr><tr><td>3</td><td>[B, Dirty]</td><td>Suck</td></tr><tr><td>4</td><td>[B, Clean]</td><td>Left</td></tr><tr><td>5</td><td>[A, Clean]</td><td>Right … (끝없이 왕복)</td></tr></table></div>두 방이 다 깨끗해진 뒤에도 멈추지 못합니다. \"B도 이미 치웠다\"는 사실을 <b>기억하지 못하기</b> 때문입니다. 이것이 단순 반사의 한계이고, 다음 슬라이드의 모델 기반 에이전트가 고칩니다.<br>둘째는 운전: \"앞차가 브레이크를 밟으면 나도 밟는다\". 유용한 규칙이지만, 앞차가 1초 전에 브레이크를 밟았다가 뗐는지, 옆 차선에 차가 있었는지 같은 이력은 전부 무시합니다.", "e": "현재 지각만으로는 안 되는 운전 상황: 앞차가 깜빡이를 켰다가 껐다 → 반사 에이전트는 '깜빡이 꺼짐'만 보고 차선 변경 의도를 모릅니다. 기억이 있어야 \"아까 깜빡이를 켰으니 곧 끼어들겠다\"를 압니다."}, {"s": "2-3", "im": ["2-3-06"], "en": "Model-Based Reflex Agent", "ko": "모델 기반 반사 에이전트", "key": 1, "o": [["State · How the world evolves · What my actions do → What the world is like now", "상태 · 세상이 어떻게 변하는가 · 내 행동이 무엇을 하는가 → 지금 세상은 어떤 모습인가"]], "x": "<b>모델 기반 반사 에이전트</b>입니다. 단순 반사 그림에 <b>주황 상자</b>가 하나 추가되었고, 그 안에 세 가지가 있습니다.<ul><li><b>State(상태)</b>: 머릿속에 적어 둔 \"세상에 대한 기록\". 지금 안 보이는 것도 여기 남아 있습니다.</li><li><b>How the world evolves(세상이 어떻게 변하는가)</b>: 내가 아무것도 안 해도 세상이 스스로 어떻게 바뀌는지에 대한 지식. \"앞차는 계속 앞으로 간다\".</li><li><b>What my actions do(내 행동이 무엇을 하는가)</b>: 내가 행동하면 세상이 어떻게 바뀌는지에 대한 지식. \"핸들을 왼쪽으로 돌리면 차가 왼쪽으로 간다\".</li></ul>이 셋과 센서 입력을 합쳐 \"지금 세상은 이렇다\"를 추정하고, 그 뒤는 단순 반사와 같이 조건-행동 규칙으로 행동을 고릅니다. 위쪽 <b>점선 화살표</b>는 추정한 현재 세계를 다시 State에 저장한다는 뜻입니다 — 매 단계 기억이 갱신됩니다. 이 세 상자가 '세상의 모델(model)'이라서 모델 기반이라고 부릅니다.", "e": "눈을 감고 방을 걷기: \"세 걸음 갔으니 책상이 바로 앞이다\" — 방 구조(세상의 모델)와 내 행동(세 걸음)으로 현재 위치(상태)를 추적합니다. 눈을 감아도(센서 없음) 행동할 수 있는 이유입니다."}, {"s": "2-3", "im": ["2-3-07"], "en": "Model-Based Reflex Agent: Adding Memory", "ko": "모델 기반 반사 에이전트: 기억 추가하기", "key": 1, "o": [["The agent function now takes a second argument: <b>a = f(p, s)</b> where <b>s is state</b>, updated at every step. — s′ = T(s, a)", "에이전트 함수가 이제 두 번째 인자를 받는다: <b>a = f(p, s)</b>, 여기서 <b>s는 상태</b>이고 매 단계 갱신된다. — s′ = T(s, a)"], ["It can now track what it cannot currently see — Memorize a car in the next lane, while you are looking the other way / Memorize which rooms already cleaned", "이제 지금 당장 볼 수 없는 것을 추적할 수 있다 — 다른 쪽을 보는 동안 옆 차선의 차를 기억 / 어느 방을 이미 청소했는지 기억"], ["More information available means better rules become possible", "쓸 수 있는 정보가 많아지면 더 좋은 규칙이 가능해진다"]], "x": "수식으로 보면 바뀐 점이 하나입니다. 단순 반사는 a = f(p)였는데, 모델 기반은 <b>a = f(p, s)</b> — 현재 지각 p에 더해 <b>기억해 둔 상태 s</b>를 함께 봅니다. 그리고 그림 속의 두 번째 식 <b>s′ = T(s, a)</b>는 상태를 갱신하는 식입니다: 지금 상태 s에서 행동 a를 하면 다음 상태는 s′가 된다는 <b>전이 함수 T</b>(3장의 RESULT 함수와 같은 것)입니다.<div class='formula'>s′ = T(s, a)   — 상태 갱신 (내가 한 행동으로 세상이 어떻게 바뀌었나)<br>a = f(p, s)   — 행동 결정 (지금 보이는 것 + 기억한 것으로 행동 고르기)</div>기억이 생기면 지금 안 보이는 것도 추적할 수 있습니다: 옆 차선을 보는 동안에도 반대편 차가 거기 있다는 것을 알고, 어느 방을 이미 치웠는지 압니다. 그래서 더 좋은 규칙을 쓸 수 있습니다 — 청소기에 \"A 깨끗, B 깨끗\"이라는 기억을 달면 \"둘 다 깨끗하면 NoOp\"이라는 규칙이 가능해져 2-1의 끝없는 왕복(이동 벌점 문제)이 해결됩니다. 2-2 21쪽의 위치 센서 없는 청소기도 \"처음 위치 A + 오른쪽으로 움직였음 → 지금은 B\"로 해결됩니다.", "e": "농구 수비: 공을 보는 동안에도 \"내 뒤에 상대 선수가 있다\"를 기억(상태)하고, 그가 움직였을 것(세상이 변함)까지 추정해서 자리를 잡습니다."}, {"s": "2-3", "im": ["2-3-08"], "en": "Model-Based Reflex Agent: Two Models Are Needed", "ko": "모델 기반 반사 에이전트: 두 가지 모델이 필요하다", "key": 1, "o": [["To maintain that <b>state variable</b>, the agent needs two kinds of knowledge", "그 <b>상태 변수</b>를 유지하려면 에이전트에 두 종류의 지식이 필요하다"], ["A <b>transition model</b>: How the world changes – both from its own actions a and on its own world", "<b>전이 모델</b>: 세상이 어떻게 변하는가 — 자신의 행동 a에 의해서, 그리고 세상 스스로"], ["A <b>sensor model</b>: How the state of the world shows up in its percepts", "<b>센서 모델</b>: 세상의 상태가 지각에 어떻게 나타나는가"], ["One honest caution: the state is a best guess in by sensor, never a certainty — In a partially observable world the exact state is rarely knowable", "솔직한 주의 하나: 상태는 센서로 추정한 최선의 추측이지 결코 확실한 것이 아니다 — 부분 관찰 가능한 세계에서 정확한 상태는 거의 알 수 없다"]], "x": "상태 s를 계속 맞게 유지하려면 두 가지 지식(모델)이 필요합니다. 06쪽 그림의 상자 두 개가 바로 이것입니다.<ul><li><b>전이 모델(transition model)</b> = 원인 → 결과. 두 부분으로 이루어집니다: ① 내 행동의 효과(What my actions do: 핸들을 왼쪽 → 차가 왼쪽으로) ② 세상 스스로의 변화(How the world evolves: 내가 가만히 있어도 앞차는 계속 앞으로).</li><li><b>센서 모델(sensor model)</b> = 실제 상태 → 내가 보게 되는 것. \"앞차가 10m 앞에 있으면 카메라에는 이 정도 크기로 찍힌다\". 센서 모델이 있어야 지각을 보고 거꾸로 \"그러면 실제 상태는 이렇겠구나\"를 추론할 수 있습니다.</li></ul>둘을 합치면 모델 기반 에이전트가 하는 일은 \"전이 모델로 <b>예측</b> → 센서로 들어온 것과 비교해 <b>보정</b>\"의 반복입니다. 마지막 주의가 중요합니다: 부분 관찰 세계에서 상태는 <b>최선의 추측</b>일 뿐 확실하지 않습니다. 그래서 '진짜 상태' 대신 '내가 믿는 상태'를 다루게 되고, 이것이 4장(부분 관찰)에서 belief state로 다시 나옵니다. (보충: 이 예측-보정을 수학적으로 정리한 것이 칼만 필터 같은 추정 기법입니다.)", "e": "터널 속 GPS 내비게이션: 신호가 끊겨도 \"시속 80km로 달렸으니 지금쯤 여기\"라고 예측하고(전이 모델), 터널을 나오면 GPS 신호로 위치를 보정합니다(센서 모델). 터널 안의 위치 표시는 '추측'이라 조금 틀릴 수 있습니다."}, {"s": "2-3", "im": ["2-3-09"], "en": "Model-Based Reflex Agent: State Representation", "ko": "모델 기반 반사 에이전트: 상태 표현", "key": 1, "o": [["<b>State</b> helps the agent keep track of the environment", "<b>상태</b>는 에이전트가 환경을 추적하도록 돕는다"], ["Atomic – the state is a label. Just \"A\" or \"B\".", "원자적 — 상태는 하나의 이름표. 그냥 \"A\" 또는 \"B\"."], ["Factored – the state is a set of attribute-value pairs, called fluent. [location = A, status = clean, temperature = 24°C]", "요인적(분해된) — 상태는 속성-값 쌍의 집합이고, 이를 플루언트라 부른다. [위치 = A, 상태 = 깨끗, 온도 = 24°C]"], ["Structured – objects, with attributes and relations between them. \"the cup is on the table, which is in the kitchen\"", "구조적 — 객체, 그 속성, 그리고 객체 사이의 관계. \"컵이 탁자 위에 있고, 그 탁자는 부엌에 있다\""]], "x": "상태 s를 컴퓨터 안에 어떻게 적을 것인가, 세 가지 방법입니다. 그림 (a)(b)(c)와 짝지어 보세요.<div class='tw'><table><tr><th>표현</th><th>상태를 적는 방식</th><th>들여다볼 수 있는 것</th><th>쓰이는 곳</th></tr><tr><td>(a) 원자적 (Atomic)</td><td>이름표 하나. \"B\", \"C\"</td><td>B와 C가 \"다르다\"는 것만. 왜 다른지는 모름</td><td>3장의 탐색 (상태 = 그래프의 점)</td></tr><tr><td>(b) 요인적 (Factored)</td><td>변수들의 값 목록. [위치 = A, 상태 = 깨끗, 온도 = 24°C]</td><td>변수별로 비교 가능: \"온도만 다르다\"</td><td>제약 만족 문제, 베이즈 망, 머신러닝</td></tr><tr><td>(c) 구조적 (Structured)</td><td>객체 + 속성 + 객체 사이의 관계</td><td>\"컵이 탁자 위\"처럼 관계까지</td><td>1차 논리, 자연어, 지식 그래프</td></tr></table></div>(b)에서 각 변수(위치, 상태, 온도)를 <b>플루언트(fluent)</b>라고 부릅니다 — 시간에 따라 값이 변하는 변수라는 뜻입니다. 아래로 갈수록 표현력이 커지지만 다루기는 어려워집니다. 3장은 가장 단순한 원자적 표현만 씁니다(3-1 10쪽).", "e": "게임 캐릭터의 상태: 원자적 \"스테이지 3\" / 요인적 [HP = 80, MP = 30, 레벨 = 7] / 구조적 \"플레이어는 길드 A 소속이고, 길드 A는 길드 B와 동맹이다\"."}, {"s": "2-3", "im": ["2-3-10"], "en": "Model-Based Reflex Agent: The Transition Model", "ko": "모델 기반 반사 에이전트: 전이 모델", "key": 1, "o": [["Treat the environment as a discrete dynamic system", "환경을 이산 동적 시스템으로 취급한다"], ["The transition function says where an action takes you: the set of states (boxes) · A the set of actions (arrows)", "전이 함수는 행동이 당신을 어디로 데려가는지 알려 준다: 상태들의 집합(상자) · 행동들의 집합 A(화살표)"], ["<b>Next week this becomes the backbone of every search algorithm</b>", "<b>다음 주에 이것이 모든 탐색 알고리즘의 뼈대가 된다</b>"]], "x": "전이 모델을 그림으로 그리면 이렇게 됩니다. 환경을 <b>이산 동적 시스템</b>, 즉 \"유한한 상태들 사이를 행동으로 건너다니는 것\"으로 봅니다. 오른쪽 그림은 진공청소기 세계의 전이 모델 <b>전체</b>입니다.<ul><li><b>상자 = 상태</b>: 청소기 위치(A/B) × A 먼지 유무 × B 먼지 유무 = 2 × 2 × 2 = <b>8개</b>. 맨 위 줄은 둘 다 더러운 상태, 가운데는 한 칸만 더러운 상태, 맨 아래는 둘 다 깨끗한 상태입니다.</li><li><b>화살표 = 행동</b>: L(왼쪽)/R(오른쪽)은 청소기 위치를 바꾸고, S(흡입)는 현재 칸의 먼지를 없애 아래 줄로 내려보냅니다.</li><li><b>자기 자신으로 돌아오는 고리(self-loop)</b>: 해도 아무 변화가 없는 행동. 왼쪽 방에서 L을 하면 벽이라 그대로, 깨끗한 칸에서 S를 해도 그대로.</li></ul>이 그림이 3장에서 <b>상태 공간 그래프(state space graph)</b>라는 이름으로 다시 나옵니다. 탐색이란 이 그래프에서 시작 상태로부터 목표 상태(맨 아래 줄)까지 가는 화살표의 순서를 찾는 것입니다 — 그래서 \"모든 탐색 알고리즘의 뼈대\"입니다.", "e": "엘리베이터: 상태 = 층 번호, 행동 = {위, 아래}. (1층, 아래) → 1층 그대로(self-loop). 2.5층이 없으니 이산(discrete)입니다."}, {"s": "2-3", "im": ["2-3-11"], "en": "Goal-Based Agent", "ko": "목표 기반 에이전트", "key": 1, "o": [["State · How the world evolves · What my actions do → What the world is like now → <b>What it will be like if I do action A</b> ← <b>Goals</b> → What action I should do now — <b>Plan</b>", "상태 · 세상이 어떻게 변하는가 · 내 행동이 무엇을 하는가 → 지금 세상은 어떤 모습인가 → <b>내가 행동 A를 하면 세상은 어떻게 될까</b> ← <b>목표</b> → 지금 어떤 행동을 해야 하나 — <b>계획</b>"]], "x": "<b>목표 기반 에이전트</b>입니다. 모델 기반 그림에서 두 가지가 바뀌었습니다(주황 상자).<ul><li>① <b>조건-행동 규칙이 사라지고 Goals(목표)</b>가 들어왔습니다. \"이럴 땐 이렇게 해라\"라는 규칙 대신 \"이런 상태에 도달하라\"는 목표만 줍니다.</li><li>② <b>\"What it will be like if I do action A(행동 A를 하면 세상은 어떻게 될까)\"</b>라는 예측 상자가 생겼습니다. 전이 모델로 미래를 머릿속에서 시뮬레이션하는 단계입니다.</li></ul>동작 방식: 가능한 행동마다 \"이걸 하면 세상이 어떻게 될까\"를 예측하고, 예측한 결과가 목표에 가까운지 비교해 행동을 고릅니다. 한 번으로 안 되면 \"그다음엔?\"을 반복해서 목표까지 이어지는 행동의 순서를 찾는데, 이 반복이 그림의 주황 화살표 <b>Plan(계획)</b>이고, 3장의 탐색(search)이 바로 계획을 세우는 방법입니다.", "e": "체스: \"나이트를 여기 두면 → 상대는 이렇게 받을 테고 → 그러면 체크메이트\" — 말을 실제로 옮기기 전에 머릿속에서(전이 모델로) 여러 수를 미리 둬 보고, 목표(체크메이트)에 이르는 수를 고릅니다."}, {"s": "2-3", "im": ["2-3-12"], "en": "Goal-Based Agent: Flexibility, Concretely", "ko": "목표 기반 에이전트: 유연성, 구체적으로", "key": 1, "o": [["Has a <b>goal state</b>: The agent is given a defined goal state to reach, and the task <b>ends</b> once it gets there.", "<b>목표 상태</b>를 가진다: 에이전트에게 도달해야 할 정해진 목표 상태가 주어지고, 거기 도착하면 과업이 <b>끝난다</b>."], ["Must act toward the goal state: <b>A planning</b> uses <b>search algorithms</b> to work out a sequence of actions that leads to the goal.", "목표 상태를 향해 행동해야 한다: <b>계획</b>은 <b>탐색 알고리즘</b>을 써서 목표로 이어지는 행동의 순서를 알아낸다."]], "x": "목표 기반 에이전트의 두 가지 특징을 못 박습니다(형광펜 강조).<ul><li><b>목표 상태(goal state)가 있다</b>: 도달해야 할 상태가 미리 정해져 있고, 거기 도착하면 <b>끝(ends)</b>입니다. 종료 시점이 있다는 것이 뒤에 나올 효용 기반과의 차이입니다(17쪽).</li><li><b>계획(planning)은 탐색 알고리즘으로 한다</b>: 행동 하나가 아니라 \"1 → 2 → 3 → …\"처럼 목표까지 이어지는 <b>행동의 순서(sequence of actions)</b>를 찾아야 하고, 그 찾는 방법이 탐색입니다.</li></ul>즉 3장 전체는 \"목표 기반 에이전트의 Plan 상자 안에서 무슨 일이 일어나는가\"를 다루는 장입니다.", "e": "내비게이션: 목적지(목표 상태)를 입력하면 → \"300m 직진 → 우회전 → 두 번째 신호에서 좌회전 → …\"이라는 행동의 순서를 탐색으로 계산하고 → 도착하면 안내가 끝납니다."}, {"s": "2-3", "im": ["2-3-13"], "en": "Goal-Based Agent: Examples", "ko": "목표 기반 에이전트: 예시", "key": 1, "o": [["Send a goal-based taxi somewhere new — Change one thing: the destination / The plan is changed for the destination", "목표 기반 택시를 새로운 곳으로 보내 보자 — 한 가지만 바꾼다: 목적지 / 계획은 그 목적지에 맞게 바뀐다"], ["Send a reflex taxi somewhere new — Every rules for when to turn and when to go straight will work only for a single destination. / Replace all of them", "반사형 택시를 새로운 곳으로 보내 보자 — 언제 회전하고 언제 직진할지에 관한 모든 규칙은 단 하나의 목적지에서만 통한다. / 전부 교체해야 한다"], ["The difference is that <b>the goal agent's knowledge is written down explicitly</b>, and so can be changed.", "차이는 <b>목표 에이전트의 지식은 명시적으로 적혀 있다</b>는 것이고, 그래서 바꿀 수 있다."]], "x": "목표 기반이 반사형보다 <b>유연한(flexible)</b> 이유를 택시로 보여 줍니다.<ul><li>반사형 택시의 규칙 \"두 번째 사거리에서 좌회전, 그다음 직진\"에는 특정 목적지가 규칙 속에 <b>몰래 박혀</b> 있습니다. 목적지가 바뀌면 이 규칙들은 전부 쓸모없어져서 모두 다시 써야 합니다.</li><li>목표 기반 택시는 <b>목적지(goal)</b>와 <b>도로 지도(전이 모델)</b>가 따로 적혀 있습니다. 목적지 변수 하나만 바꾸면 탐색이 지도를 보고 새 경로를 알아서 계산합니다.</li></ul>마지막 문장(이탤릭 강조)이 핵심입니다: 목표 기반 에이전트의 지식은 <b>명시적으로 적혀 있어서(written down explicitly)</b> 바꿀 수 있습니다. 반사형의 지식은 규칙 속에 녹아 있어서 꺼내 바꿀 수 없습니다.", "e": "코딩 비유: 반사형은 turn_left_at(2)처럼 목적지를 하드코딩한 것, 목표 기반은 route(destination)처럼 목적지를 인자로 받는 것. 후자는 인자만 바꾸면 됩니다."}, {"s": "2-3", "im": ["2-3-14"], "en": "Utility-Based Agent", "ko": "효용 기반 에이전트", "key": 1, "o": [["State · How the world evolves · What my actions do → What the world is like now → What it will be like if I do action A → <b>Utility → How happy I will be in such a state</b> → What action I should do now", "상태 · 세상이 어떻게 변하는가 · 내 행동이 무엇을 하는가 → 지금 세상은 어떤 모습인가 → 행동 A를 하면 어떻게 될까 → <b>효용 → 그런 상태에서 나는 얼마나 행복할까</b> → 지금 어떤 행동을 해야 하나"], ["A <b>goal is a yes-or-no</b> test. A <b>utility function scores how good a state is</b>, which is what you need when several routes reach the goal.", "<b>목표는 예/아니오</b> 판정이다. <b>효용 함수는 상태가 얼마나 좋은지 점수를 매기며</b>, 이것은 여러 경로가 목표에 도달할 때 필요한 것이다."]], "x": "<b>효용 기반 에이전트</b>입니다. 목표 기반 그림에서 Goals 자리에 <b>Utility(효용)</b>가 들어가고, \"<b>How happy I will be in such a state(그 상태에서 나는 얼마나 행복할까)</b>\"라는 상자가 생겼습니다(주황 상자). 차이는 평가 방식입니다:<ul><li><b>목표</b>는 예/아니오 판정: 목표 상태에 도달했나, 아닌가. 1시간 걸리는 길과 3시간 걸리는 길이 둘 다 \"도착 = 예\"로 똑같습니다.</li><li><b>효용 함수</b>는 점수: 각 상태가 얼마나 좋은지 숫자로 매깁니다. 1시간 길에 더 높은 점수를 줄 수 있습니다.</li></ul>그래서 \"목표에 가는 길이 여러 개일 때 어느 길이 더 좋은가\"를 고를 수 있습니다. 효용(utility)은 2-1 05쪽에서 \"합리적 에이전트는 기대 효용을 최대화한다\"고 했던 바로 그 효용입니다.", "e": "서울 → 부산: KTX, 고속버스, 비행기 모두 목표 달성(예). 효용 기반은 시간, 돈, 편안함을 점수로 매겨 하나를 고릅니다. 급하면 KTX, 돈이 없으면 버스 — 효용 함수가 다르면 선택이 달라집니다."}, {"s": "2-3", "im": ["2-3-15"], "en": "Utility-Based Agent: When Goals Are Not Enough (1)", "ko": "효용 기반: 목표만으로 부족할 때 (1)", "key": 1, "o": [["Three situations a <b>goal</b> test and a path cost cannot handle", "<b>목표</b> 판정과 경로 비용으로는 다룰 수 없는 세 가지 상황"], ["There is no terminal goal at all — A Mars rover keeping its battery out of the danger zone. Nothing to arrive at. The task never ends.", "종료 목표가 아예 없다 — 배터리를 위험 구간 밖으로 유지하는 화성 로버. 도착할 곳이 없다. 과업이 끝나지 않는다."], ["Objectives conflict — Fast against safe against comfortable. You cannot have all three, and someone has to write down the trade-off.", "목적들이 충돌한다 — 빠름 vs 안전 vs 쾌적. 셋을 다 가질 수 없고, 누군가 절충안을 적어 줘야 한다."], ["Outcomes are uncertain — 90% chance of a small win, 10% chance of a large one. A yes-or-no test cannot multiply by a probability", "결과가 불확실하다 — 90% 확률로 작은 승리, 10% 확률로 큰 승리. 예/아니오 판정에는 확률을 곱할 수 없다"]], "x": "목표(예/아니오) + 경로 비용만으로는 안 되고 효용이 꼭 필요한 세 상황입니다.<ul><li><b>① 끝이 없다</b>: 화성 로버가 \"배터리를 위험 구간 밖으로 유지\"하는 일에는 도착 지점이 없습니다. 목표 기반은 '도착하면 끝'인데 끝이 없으니, \"지금 상태가 얼마나 좋은가\"를 계속 점수로 재야 합니다.</li><li><b>② 목적이 충돌한다</b>: 빠름·안전·쾌적을 동시에 다 가질 수 없습니다(2-1 19쪽 택시). 예/아니오로는 \"조금 덜 빠르지만 훨씬 안전한 길\"을 표현할 수 없고, 점수로 절충안을 적어야 합니다.</li><li><b>③ 결과가 불확실하다</b>: 90% 확률로 작은 이득, 10% 확률로 큰 이득인 행동을 평가하려면 확률을 곱해야 하는데, 예/아니오에는 확률을 곱할 수 없습니다. 결과가 <b>숫자</b>여야 2-1 10쪽의 기대 효용 E(U|a) = Σ U × P를 계산할 수 있습니다.</li></ul>", "e": "① 에어컨 자동 모드: '쾌적하게 유지'에는 끝이 없음. ② 자동차의 스포츠 모드 vs 컴포트 모드: 빠름과 쾌적의 절충. ③ 수강 신청: 인기 강의 추첨(10% 확률로 큰 만족) vs 무난한 강의(90% 확실) — 100% 50만 원 vs (90% 10만 원, 10% 500만 원)이면 후자의 기대값은 0.9 × 10 + 0.1 × 500 = 59만 원으로 더 큽니다."}, {"s": "2-3", "im": ["2-3-16"], "en": "Utility-Based Agent: When Goals Are Not Enough (2)", "ko": "효용 기반: 목표만으로 부족할 때 (2)", "o": [["<b>Goals</b> just provide a binary distinction between \"happy\" and \"unhappy\" states.", "<b>목표</b>는 '행복한' 상태와 '불행한' 상태 사이의 이분법만 제공한다."], ["A <b>utility</b> function scores how desirable (happy) a state is — Often written as a reward <b>R(s)</b> attached to each state.", "<b>효용</b> 함수는 상태가 얼마나 바람직한지(행복한지) 점수를 매긴다 — 흔히 각 상태에 붙은 보상 <b>R(s)</b>로 쓴다."]], "x": "앞 슬라이드의 결론을 한 번 더: 목표는 0 아니면 1(이분법), 효용은 실수값(점수)입니다. 새로 나온 기호 <b>R(s)</b>는 \"상태 s에 있을 때 받는 보상(reward)\"으로, 효용을 상태마다 붙은 점수로 적은 것입니다. 이 기호는 뒤에 배울 강화학습(reinforcement learning)의 핵심 기호이고, 2-1 10쪽에서 \"성능 척도는 효용 함수 또는 보상 함수의 역할을 한다\"고 한 말이 여기서 이어집니다.", "e": "학점: 목표 기반 = Pass/Fail(이분법), 효용 기반 = A+ 4.5, A 4.0, B+ 3.5 …(점수). 게임: 깃발에 도착(목표) vs 코인·남은 시간 보너스까지 합산한 점수(효용)."}, {"s": "2-3", "im": ["2-3-17"], "en": "Goal-Based Agent vs Utility-Based Agent", "ko": "목표 기반 vs 효용 기반", "key": 1, "o": [["Goal-based: p<sub>0</sub>, s<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, s<sub>1</sub>, a<sub>1</sub>, …, s<sub>goal</sub> — It terminates. The agent arrives, and it is done", "목표 기반: p<sub>0</sub>, s<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, s<sub>1</sub>, a<sub>1</sub>, …, s<sub>goal</sub> — 종료된다. 에이전트가 도착하면 끝이다"], ["Utility-based: p<sub>0</sub>, s<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, s<sub>1</sub>, a<sub>1</sub>, … — It does not terminate. There is no arriving, only continuing", "효용 기반: p<sub>0</sub>, s<sub>0</sub>, a<sub>0</sub>, p<sub>1</sub>, s<sub>1</sub>, a<sub>1</sub>, … — 종료되지 않는다. 도착은 없고, 계속될 뿐이다"]], "x": "두 에이전트의 시간 흐름을 나란히 적은 것입니다. 둘 다 지각 p → 상태 s → 행동 a를 반복하지만, 목표 기반은 마지막에 <b>s<sub>goal</sub></b>(목표 상태)이 있어 거기서 멈추고, 효용 기반은 끝 기호 없이 \"…\"로 계속됩니다.<div class='tw'><table><tr><th></th><th>목표 기반</th><th>효용 기반</th></tr><tr><td>평가</td><td>예/아니오</td><td>연속적인 점수</td></tr><tr><td>끝</td><td>목표에 도달하면 종료</td><td>종료 없음 (계속 점수를 최적화)</td></tr><tr><td>강점</td><td>단순하고 명확</td><td>절충(trade-off)과 불확실성을 다룰 수 있음</td></tr><tr><td>예</td><td>길 찾기, 퍼즐</td><td>온도 유지, 투자, 게임 점수 올리기</td></tr></table></div>(보충: 교재는 효용 기반 에이전트도 종료가 있는 과제에 쓸 수 있다고 보고, 핵심 차이를 \"이분법 vs 연속 점수\"로 설명합니다. 시험은 강의 슬라이드의 표현(종료 여부)을 기준으로 답하는 것이 안전합니다.)", "e": "목표 기반: 택배 기사가 마지막 집에 배송하면 업무 종료. 효용 기반: 스마트 에어컨이 하루 종일 쾌적함과 전기 요금의 점수를 저울질하며 계속 조절."}, {"s": "2-3", "im": ["2-3-18"], "en": "Learning Agent", "ko": "학습 에이전트", "key": 1, "o": [["<b>Performance element</b>: It takes percepts and chooses actions. That is the entire agent.", "<b>수행 요소</b>: 지각을 받아 행동을 고른다. 그것이 (지금까지 배운) 에이전트 전체다."], ["<b>Learning element</b>: Updates the performance element so it does better next time", "<b>학습 요소</b>: 수행 요소가 다음번에 더 잘하도록 갱신한다"], ["<b>Critic</b>: Judges what happened against a fixed external standard", "<b>비평가</b>: 일어난 일을 고정된 외부 기준에 비추어 판정한다"], ["<b>Problem generator</b>: Suggests intentionally actions worth trying", "<b>문제 생성기</b>: 시도해 볼 만한 행동을 의도적으로 제안한다"], ["Performance standard — <b>It is external – the agent cannot change it</b>", "성능 기준 — <b>외부에 있다 – 에이전트는 이것을 바꿀 수 없다</b>"]], "x": "<b>학습 에이전트</b>는 지금까지의 에이전트에 '스스로 나아지는' 부품을 덧붙인 것입니다. 네 부품을 그림의 색 상자와 짝지어 보세요.<ul><li><b>수행 요소(Performance element, 오른쪽)</b>: 지각을 받아 행동을 고르는 부분. 지금까지 배운 반사/모델/목표/효용 에이전트가 통째로 여기 들어갑니다.</li><li><b>비평가(Critic, 위)</b>: 수행 요소가 한 일의 결과를 <b>성능 기준(performance standard)</b>에 비추어 \"잘했다/못했다\"로 판정하고 피드백(feedback)을 줍니다.</li><li><b>학습 요소(Learning element, 가운데)</b>: 그 피드백을 받아 수행 요소를 고칩니다(changes). 수행 요소가 가진 지식(knowledge)도 참고합니다.</li><li><b>문제 생성기(Problem generator, 아래)</b>: \"이것도 한번 해 봐\"라고 새로운 시도를 제안합니다. 늘 하던 최선만 반복하면 더 좋은 방법을 영영 발견하지 못하기 때문입니다(탐험 vs 활용, exploration vs exploitation).</li></ul>그림 위의 말풍선 \"It is external – the agent cannot change it\": 성능 기준은 에이전트 <b>밖</b>에 있고 에이전트가 손댈 수 없습니다. 이유는 다음 슬라이드에서.", "e": "게임 실력 늘리기: 실제 플레이(수행 요소) · 승패와 랭크(비평가, 기준은 게임 서버가 정함) · 리플레이를 보며 전략 수정(학습 요소) · \"안 써 본 캐릭터로 해 보자\"(문제 생성기)."}, {"s": "2-3", "im": ["2-3-19"], "en": "Learning Agent: Two Things Worth Noticing", "ko": "학습 에이전트: 눈여겨볼 두 가지", "key": 1, "o": [["The performance standard must sit outside the agent — An agent able to edit its own standard would lower it to whatever it already achieves. / The same failure as a gameable performance measure in the vacuum world.", "성능 기준은 반드시 에이전트 바깥에 있어야 한다 — 자기 기준을 고칠 수 있는 에이전트는 기준을 이미 달성한 수준으로 낮춰 버릴 것이다. / 진공청소기 세계의 게이밍 가능한 성능 척도와 같은 실패다."], ["Learning is orthogonal to everything else in this section — Any of the four architectures can be built to learn, or not. <b>Can be built as learning agent</b>", "학습은 이 절의 다른 모든 것과 직교한다 — 네 가지 구조 중 어느 것이든 학습하도록 만들 수도 있고, 아닐 수도 있다. <b>학습 에이전트로 만들 수 있다</b>"]], "x": "학습 에이전트에서 눈여겨볼 두 가지입니다.<ul><li><b>성능 기준은 에이전트 밖에</b>: 에이전트가 자기 채점 기준을 고칠 수 있다면, 노력하는 대신 기준을 지금 수준으로 낮춰 버리는 것이 가장 쉬운 '최적화'입니다. 2-1 16쪽의 \"먼지를 다시 쏟는 청소기\"와 똑같은 실패입니다 — 기계는 우리가 적은 것을 최적화하므로, 기준은 바깥에서 고정되어야 합니다.</li><li><b>학습은 직교한다(orthogonal)</b>: 직교란 서로 독립된 축이라는 뜻입니다. \"어떤 구조냐(반사 ~ 효용)\"와 \"학습하느냐\"는 별개의 선택이라서, 학습하는 반사 에이전트도, 학습하지 않는 효용 에이전트도 있을 수 있습니다. 그림 아래의 계층 그림 전체에 \"Can be built as learning agent\"라고 적혀 있는 이유입니다.</li></ul>(2-2 강의에서 덧붙인 말: 학습은 환경의 규칙을 모르는 <b>unknown environment</b>, 즉 설계자가 모든 것을 미리 알 수 없는 모든 경우에 가장 중요합니다.)", "e": "학생이 자기 시험 합격선을 정할 수 있다면 → 기준을 내려서 \"항상 합격\". 스팸 필터는 단순 반사형(규칙 대조)이지만 사용자의 '스팸 아님' 클릭으로 학습합니다 — 반사 + 학습의 예."}, {"s": "2-3", "im": ["2-3-20"], "en": "Summary", "ko": "요약", "key": 1, "o": [["An agent perceives through sensors and acts through actuators; the agent function maps percept sequences to actions", "에이전트는 센서로 지각하고 액추에이터로 행동한다; 에이전트 함수는 지각 순열을 행동으로 대응시킨다"], ["A rational agent takes the action expected to maximize its performance measure – which is neither omniscience nor perfection, and is bounded by its own resources", "합리적 에이전트는 성능 척도를 최대화할 것으로 기대되는 행동을 한다 — 이것은 전지도 완벽함도 아니며, 자신의 자원에 의해 제한된다"], ["PEAS writes down the four things rationality depends on. Always step one", "PEAS는 합리성이 의존하는 네 가지를 적어 둔 것이다. 언제나 첫 단계"], ["Seven properties classify any environment, and each one makes a demand on the agent", "일곱 가지 속성이 모든 환경을 분류하고, 각각이 에이전트에게 요구를 만든다"], ["Four architectures, each fixing what the previous could not: reflex → model-based → goal-based → utility-based / Learning cuts across all four (learning agent)", "네 가지 구조, 각각 이전 것이 못 하던 것을 고친다: 반사 → 모델 기반 → 목표 기반 → 효용 기반 / 학습은 넷 모두를 가로지른다 (학습 에이전트)"]], "x": "2장 전체가 다섯 줄로 압축되어 있습니다(2-2 강의 36쪽과 같은 슬라이드). 시험 대비 체크리스트:<ul><li>에이전트의 정의와 에이전트 함수 f : P* → A, 함수와 프로그램의 차이를 말할 수 있는가? (2-1)</li><li>합리적 에이전트의 정의(기대값 최대화)와 '아닌 것' 네 가지(전지, 완벽, 수동, 무제한)를 설명할 수 있는가? (2-1)</li><li>PEAS 네 칸을 택시·청소기 등 새 문제에 채울 수 있고, 척도를 잘못 정하면 생기는 일을 설명할 수 있는가? (2-1)</li><li>환경의 일곱 속성을 Figure 2.6처럼 분류하고, 각 속성이 에이전트에 요구하는 기능을 짝지을 수 있는가? (2-2)</li><li>네 구조의 그림을 구별하고(무엇이 추가되었나), 각각이 고친 한계와 학습 에이전트의 네 부품을 말할 수 있는가? (2-3)</li></ul>"}, {"s": "2-3", "im": ["2-3-21", "2-3-22"], "en": "Where This Comes Back / Next Lecture: Solving Problems by Searching", "ko": "이 내용이 다시 등장하는 곳 / 다음 강의: 탐색으로 문제 풀기", "o": [["Almost everything ahead is a return to today's lecture / Weeks 3 to 5, search — How a goal-based agent actually finds its sequence of actions, using the transition model from today", "앞으로 배울 거의 모든 것이 오늘 강의로 되돌아온다 / 3~5주 탐색 — 목표 기반 에이전트가 오늘 배운 전이 모델을 써서 실제로 행동의 순서를 찾는 방법"], ["Weeks 6 and 7, constraints and games — What changes when there are rules, or an opponent / Further out, decision processes and reinforcement learning — The expected-discounted-utility line, taken seriously", "6~7주 제약과 게임 — 규칙이나 상대가 있을 때 무엇이 달라지는가 / 그 너머 결정 과정과 강화학습 — 기대 할인 효용 노선을 진지하게"], ["A goal-based agent needs a sequence of actions, not just one / Finding that sequence is search / What a search problem is, stated precisely: States, actions, transitions, a start state, and a goal test", "목표 기반 에이전트는 행동 하나가 아니라 행동의 순서가 필요하다 / 그 순서를 찾는 것이 탐색이다 / 탐색 문제란 무엇인지 정확히 말하면: 상태, 행동, 전이, 시작 상태, 목표 판정"], ["State spaces and search trees – and why they are not the same thing / Breadth-first and depth-first search, and what each one costs / Read: Chapter 3 (3.1–3.4, pp. 81–101)", "상태 공간과 탐색 트리 — 그리고 왜 둘이 같은 것이 아닌지 / 너비 우선 탐색과 깊이 우선 탐색, 그리고 각각의 비용 / 읽기: 3장 (3.1–3.4, 81–101쪽)"]], "x": "21쪽은 2장의 내용이 앞으로 어디서 다시 나오는지, 22쪽은 다음 강의(3장) 예고입니다.<ul><li><b>3~5주 탐색</b>: 목표 기반 에이전트(11~13쪽)의 Plan 상자 안을 채웁니다. 10쪽의 전이 모델 그래프 위에서 행동의 순서를 찾는 것이 탐색입니다.</li><li><b>6~7주 제약과 게임</b>: 규칙(제약)이나 상대(다중 에이전트, 2-2)가 있을 때.</li><li><b>그 너머 강화학습</b>: 효용 기반 에이전트(14~17쪽)의 R(s)를 진지하게 다룹니다. \"기대 할인 효용\"에서 <b>할인(discounted)</b>이란 먼 미래의 보상을 조금 덜 쳐주는 것: R₀ + γR₁ + γ²R₂ + … (γ = 0.9이면 1년 뒤 100점은 지금의 90점 가치).</li></ul>3장 예고의 핵심 문장: \"목표 기반 에이전트는 행동 <b>하나</b>가 아니라 행동의 <b>순서</b>가 필요하고, 그 순서를 찾는 것이 탐색이다.\" 탐색 문제의 요소(상태, 행동, 전이, 시작 상태, 목표 판정)가 3-1의 5요소로, 상태 공간과 탐색 트리의 차이가 3-2로, BFS·DFS가 3-3으로 이어집니다.", "e": "예습 문제: 10쪽의 청소기 상태 그래프에서 '왼쪽 방, 둘 다 더러움'에서 시작해 '둘 다 깨끗'까지 가는 화살표의 순서를 찾아보세요(답: S → R → S, 3단계). 3장에서 이것을 BFS·DFS로 자동으로 찾게 됩니다.", "pg": [[1, 2], [1, 2]]}, {"s": "3-1", "im": ["3-1-01", "3-1-02"], "en": "Chapter 3 - Solving Problems by Searching · Recap of Chapter 2", "ko": "3장 탐색을 통한 문제 해결 · 2장 복습", "o": [["Chapter 3 - Solving Problems by Searching", "3장 - 탐색을 통한 문제 해결"], ["An agent <b>perceives</b> through sensors and <b>acts</b> through actuators / A rational agent takes the action expected to maximize its performance measure.", "에이전트는 센서를 통해 <b>지각</b>하고 액추에이터를 통해 <b>행동</b>한다 / 합리적 에이전트는 성능 척도를 최대화할 것으로 기대되는 행동을 한다."], ["That bundle (PEAS) is the <b>task environment</b>. / Seven properties classify any environment, and each one makes a demand on the agent.", "그 묶음(PEAS)이 <b>과업 환경</b>이다. / 일곱 가지 속성이 모든 환경을 분류하고, 각각이 에이전트에게 요구를 만든다."], ["Four architectures, each fixing what the previous could not: Reflex → Model-based → <b>Goal-based (for this chapter)</b> → Utility-based", "네 가지 구조, 각각 이전 것이 못 하던 것을 고친다: 반사 → 모델 기반 → <b>목표 기반 (이번 장)</b> → 효용 기반"]], "x": "3장 표지와 2장 복습입니다. 2장의 다섯 줄 요약(2-3 20쪽)을 다시 보여 주면서 \"이번 장은 <b>목표 기반 에이전트</b>\"라고 굵게 표시했습니다. 3장은 목표 기반 에이전트의 'Search for a plan' 상자 안에서 일어나는 일 — 즉 <b>행동의 순서(sequence of actions)를 어떻게 찾는가</b> — 를 다룹니다. 강의는 UC 버클리 CS188(Dan Klein, Pieter Abbeel) 자료를 바탕으로 해서 팩맨(Pac-Man) 예시가 자주 나옵니다.", "pg": [[1, 1], [1, 3]]}, {"s": "3-1", "im": ["3-1-03", "3-1-04"], "en": "Contents · Learning Objectives", "ko": "목차 · 학습 목표", "o": [["1. What is a search problem? 2. Tree search 3. Search space 4. Uninformed search strategies 5. Informed search strategies", "1. 탐색 문제란? 2. 트리 탐색 3. 탐색 공간 4. 무정보 탐색 전략 5. 정보 탐색 전략"], ["Understand what a <b>search problem</b> is, and how a goal-based agent uses one / Understand <b>the various measures</b> that describe a search space / Understand the <b>uninformed and informed search algorithms</b>, and their properties", "<b>탐색 문제</b>가 무엇이고 목표 기반 에이전트가 그것을 어떻게 쓰는지 이해한다 / 탐색 공간을 설명하는 <b>여러 측정값</b>을 이해한다 / <b>무정보 탐색과 정보 탐색 알고리즘</b>, 그리고 그 성질을 이해한다"]], "x": "3장의 목차와 학습 목표입니다. 이 사이트의 소단원과 대응시키면: 3-1 = 1번(탐색 문제), 3-2 = 2·3번(트리 탐색, 탐색 공간), 3-3 = 4번(무정보 탐색), 3-4 = 5번(정보 탐색). 학습 목표의 형광펜 부분 세 가지가 시험 범위의 뼈대입니다.<ul><li><b>탐색 문제</b>: 5요소로 문제를 정의하기 (3-1)</li><li><b>여러 측정값</b>: 3-2의 <b>b</b>(분기 계수), <b>m</b>(최대 깊이), <b>d</b>(최적 해의 깊이)와 상태 공간 크기 — 계산 문제로 나오기 좋은 부분</li><li><b>무정보/정보 탐색 알고리즘과 성질</b>: BFS·UCS·DFS·IDS(3-3), 탐욕적·A*(3-4)와 각각의 완전성·최적성·시간·공간</li></ul>", "e": "무정보 vs 정보 탐색 미리보기: 미로에서 출구 방향을 전혀 모른 채 모든 길을 차례로 가 보는 것(무정보) vs \"출구는 남동쪽\"이라는 힌트로 그쪽 길부터 가 보는 것(정보).", "pg": [[1, 1], [1, 1]]}, {"s": "3-1", "im": ["3-1-05", "3-1-06"], "en": "1. Search Problem", "ko": "1. 탐색 문제 (개요)", "key": 1, "o": [["Chapter 3 - Part I: Search Problem, Tree Search, and Search Space", "3장 파트 I: 탐색 문제, 트리 탐색, 탐색 공간"], ["What has to be written down before any search can start?", "탐색을 시작하기 전에 무엇을 적어 두어야 하는가?"], ["A search problem is five things: an initial state, actions, a transition model, goal states, and an action cost function", "탐색 문제는 다섯 가지다: 초기 상태, 행동, 전이 모델, 목표 상태, 행동 비용 함수"], ["Transition function: ACTIONS(s) and RESULT(s, a) are functions, not stored tables – states are generated on demand.", "전이 함수: ACTIONS(s)와 RESULT(s, a)는 저장된 표가 아니라 함수다 — 상태는 필요할 때 생성된다."], ["Three worked examples: vacation in Romania, the vacuum-cleaner world, the sliding-tile puzzle / Choosing the state representation is a design decision, and it is the hard part", "세 가지 예제: 루마니아 휴가, 진공청소기 세계, 슬라이딩 타일 퍼즐 / 상태 표현을 고르는 것은 설계상의 결정이고, 그것이 어려운 부분이다"]], "x": "1절의 개요입니다. 질문은 \"탐색을 시작하기 전에 무엇을 적어야 하나?\"이고, 답은 <b>다섯 가지</b>(11쪽에서 자세히)입니다. 미리 알아 둘 두 가지:<ul><li><b>\"함수이지 표가 아니다\"</b>: 가능한 모든 상태를 미리 표로 만들어 두는 것이 아니라, \"이 상태에서 할 수 있는 행동은?\"(ACTIONS), \"이 행동을 하면 어떤 상태가 되나?\"(RESULT)를 물을 때마다 계산합니다. 그래서 상태가 수십억 개인 문제도 다룰 수 있습니다(2-2의 '표는 너무 크다'와 같은 이야기).</li><li><b>상태 표현을 고르는 것이 어려운 부분</b>: 알고리즘은 정해져 있지만, 문제를 어떤 상태·행동으로 적을지는 사람이 결정해야 하고 그 결정이 문제의 난이도를 좌우합니다(14쪽, 17쪽).</li></ul>", "e": "체스: 모든 판(10^40개 이상)을 저장하는 대신 \"지금 둘 수 있는 수는?\"(ACTIONS), \"이 수를 두면 판은?\"(RESULT)을 규칙으로 계산합니다.", "pg": [[1, 1], [1, 4]]}, {"s": "3-1", "im": ["3-1-07"], "en": "Search Problem: What Is It?", "ko": "탐색 문제: 무엇인가?", "key": 1, "o": [["We design <b>goal-based agents</b> for environments that are: <b>Known</b>: the agent knows what its actions do / <b>Fully observable</b>: it can see the whole state / <b>Deterministic</b>: the same action always gives the same result", "다음과 같은 환경을 위한 <b>목표 기반 에이전트</b>를 설계한다: <b>알려진</b>: 에이전트가 자기 행동이 무엇을 하는지 안다 / <b>완전 관찰 가능</b>: 상태 전체를 볼 수 있다 / <b>결정적</b>: 같은 행동은 항상 같은 결과를 낸다"], ["<b>Example</b>: a robot in a maze — the maze is the environment", "<b>예</b>: 미로 속 로봇 — 미로가 곧 환경이다"]], "x": "3장이 다루는 환경에는 세 가지 가정이 붙습니다. 2-2에서 배운 환경 속성 중 세 개입니다.<ul><li><b>알려진(known)</b>: 행동의 결과를 안다 — 미로의 지도를 갖고 있다.</li><li><b>완전 관찰 가능(fully observable)</b>: 지금 상태 전체가 보인다 — 내가 미로의 어디에 있는지 안다.</li><li><b>결정적(deterministic)</b>: 같은 행동은 항상 같은 결과 — 북쪽으로 가면 반드시 북쪽 칸에 도착한다.</li></ul>셋이 모두 성립하면 <b>미래를 정확히 예측</b>할 수 있으므로, 실제로 움직이기 전에 컴퓨터 안에서 계획 전체를 완성할 수 있습니다. 하나라도 깨지면? 규칙을 모르면(unknown) 계획 자체가 불가능하고, 부분 관찰이면 지금 어디 있는지조차 불확실하고, 비결정적이면 세운 계획이 실행 중에 어긋납니다 — 이 경우들이 4장입니다. 그래서 이 세 가정은 배경 설명이 아니라 <b>3장 알고리즘이 통하는 범위의 경계</b>입니다.", "e": "세 가정을 만족: 종이에 그려진 미로, 8-퍼즐, 루마니아 지도. 만족하지 않음: 포커(부분 관찰), 윷놀이(비결정적), 처음 가 본 건물(unknown)."}, {"s": "3-1", "im": ["3-1-08"], "en": "Why Search Matters", "ko": "탐색이 중요한 이유", "o": [["The algorithms we'll discuss are incredibly widely applied.", "우리가 다룰 알고리즘은 믿을 수 없을 만큼 널리 쓰인다."], ["Pathing and routing problems, both for people and for robots / Chip design (routing wires) and resource planning problems / Robot motion planning and protein design / Language analysis, machine translation, and speech recognition / Video games", "사람과 로봇 모두를 위한 경로 찾기·라우팅 문제 / 칩 설계(배선)와 자원 계획 문제 / 로봇 동작 계획과 단백질 설계 / 언어 분석, 기계 번역, 음성 인식 / 비디오 게임"]], "x": "탐색이 쓰이는 곳입니다. 겉보기엔 전혀 달라 보이지만 모두 \"<b>시작 상태에서 목표 상태까지 가는 좋은 행동 순서 찾기</b>\"로 바꿔 쓸 수 있습니다.<ul><li>지도 앱의 경로(왼쪽 그림의 \"625 routes\" 중 가장 좋은 것 고르기), 로봇의 이동 경로</li><li>칩 설계(가운데 그림): 수백만 개의 배선을 서로 겹치지 않게 연결하는 길 찾기</li><li>로봇 동작 계획(오른쪽 그림): 장애물을 피해 목표까지 팔이나 몸을 움직이는 순서</li><li>단백질 설계: 원하는 모양이 되는 아미노산 순서 찾기</li><li>기계 번역·음성 인식: 가능한 단어 조합 중 가장 그럴듯한 문장을 찾는 것도 탐색(예: beam search)</li><li>게임: NPC의 길 찾기, 체스·바둑의 수 읽기</li></ul>", "e": "음성 인식에서 \"나는 학교에 ___\" 다음에 올 단어 후보 수천 개 중 가장 자연스러운 문장을 고르는 것도, 단어를 하나씩 붙여 가며 '가장 그럴듯한 경로'를 찾는 탐색입니다."}, {"s": "3-1", "im": ["3-1-09"], "en": "Search Problem: Recall the Goal-Based Agent", "ko": "탐색 문제: 목표 기반 에이전트 다시 보기", "key": 1, "o": [["The agent's task is to reach a defined goal state / Its performance measure is normally the cost of getting there", "에이전트의 과제는 정해진 목표 상태에 도달하는 것이다 / 성능 척도는 보통 거기까지 가는 데 드는 비용이다"], ["<b>The problem-solving agent</b>: a special kind of goal-based agent which produces a sequence of actions", "<b>문제 해결 에이전트</b>: 행동의 순서를 만들어 내는 특별한 종류의 목표 기반 에이전트"], ["Agent's location → State · Map of the maze → What my actions do · Exit location → Goals · maze → Environment · <b>Search for a plan</b>", "에이전트의 위치 → 상태 · 미로의 지도 → 내 행동이 하는 일 · 출구 위치 → 목표 · 미로 → 환경 · <b>계획 탐색</b>"], ["a<sub>i</sub> = argmin<sub>a<sub>i</sub>∈A</sub> [ Σ<sub>t=i</sub><sup>T</sup> c<sub>t</sub> | s<sub>T</sub> ∈ S<sup>goal</sup> ]", "a<sub>i</sub> = argmin<sub>a<sub>i</sub>∈A</sub> [ Σ<sub>t=i</sub><sup>T</sup> c<sub>t</sub> | s<sub>T</sub> ∈ S<sup>goal</sup> ]"]], "x": "2-3의 목표 기반 에이전트 그림을 미로 로봇에 대입한 것입니다. 초록 상자가 대응 관계입니다: 로봇의 위치 = <b>State</b>, 미로 지도 = <b>What my actions do</b>(전이 모델), 출구 위치 = <b>Goals</b>, 미로 자체 = Environment. 2장 그림에 없던 새 상자 <b>Search for a plan</b>이 생겼고, 3장 전체가 이 상자의 내용입니다. 목표 기반 에이전트 중에서도 이렇게 행동의 <b>순서</b>를 통째로 만들어 내는 것을 <b>문제 해결 에이전트(problem-solving agent)</b>라고 부릅니다.<br>오른쪽 아래 수식을 한 조각씩 읽으면:<div class='formula'>a<sub>i</sub> = argmin<sub>a<sub>i</sub>∈A</sub> [ Σ<sub>t=i</sub><sup>T</sup> c<sub>t</sub>  |  s<sub>T</sub> ∈ S<sup>goal</sup> ]</div><ul><li>c<sub>t</sub>: t번째 행동의 비용. Σ<sub>t=i</sub><sup>T</sup> c<sub>t</sub>는 지금(i)부터 마지막(T)까지 행동 비용을 전부 더한 것 = 경로 비용.</li><li>| s<sub>T</sub> ∈ S<sup>goal</sup>: \"단, 마지막 상태 s<sub>T</sub>가 목표 집합 S<sup>goal</sup> 안에 있어야 한다\"는 조건. 이 조건이 없으면 아무것도 안 하는 것(비용 0)이 항상 최선이 되어 버립니다.</li><li>argmin<sub>a<sub>i</sub>∈A</sub>: 가능한 행동 A 중에서 위 합을 <b>가장 작게</b> 만드는 행동 a<sub>i</sub>를 고른다. 2-1의 argmax(효용 최대)와 짝으로, 여기서는 비용이니 최소(min)입니다.</li></ul>한 문장으로: \"<b>목표에 도달하는 행동 순서들 중에서 총비용이 가장 작은 것을 고른다.</b>\"", "e": "등굣길: 버스 30분 vs 지하철 28분. 둘 다 학교(목표)에 도착하니 조건을 만족하고, 비용(시간)이 작은 지하철이 argmin입니다. 집에 그냥 있기는 비용 0이지만 목표에 도달하지 않으므로 후보에서 빠집니다."}, {"s": "3-1", "im": ["3-1-10"], "en": "Search Problem: Problem Formulation", "ko": "탐색 문제: 문제 정의(정식화)", "key": 1, "o": [["We consider only discrete environments with an atomic state representation (1, 2, 3, …)", "원자적 상태 표현(1, 2, 3, …)을 쓰는 이산 환경만 고려한다"], ["The <b>state space</b> is <b>the set of all states</b> the environment can be in, including the initial state and the goal states.", "<b>상태 공간</b>은 환경이 가질 수 있는 <b>모든 상태의 집합</b>이며, 초기 상태와 목표 상태를 포함한다."], ["An <b>optimal solution</b> is the sequence of actions with the lowest path cost that reaches a goal state.", "<b>최적 해</b>는 목표 상태에 도달하는 행동 순서 중 경로 비용이 가장 낮은 것이다."], ["1) Search, or planning: the process of finding that sequence / 2) In a <b>known and deterministic environment</b>, the agent can ignore its <b>percepts</b> while executing the plan (an open-loop system)", "1) 탐색 또는 계획: 그 순서를 찾는 과정 / 2) <b>알려진 결정적 환경</b>에서는 에이전트가 계획을 실행하는 동안 <b>지각</b>을 무시해도 된다 (개루프 시스템)"], ["(s, a, s′) table: 1, S, 2 / 2, N, 1 / 2, S, 3 / … / 4, E, a / 4, S, 5 / 4, N, 3 — state-space graph · Initial state · Goal state · Actions: {N, E, S, W}", "(s, a, s′) 표: 1, S, 2 / 2, N, 1 / 2, S, 3 / … / 4, E, a / 4, S, 5 / 4, N, 3 — 상태 공간 그래프 · 초기 상태 · 목표 상태 · 행동: {N, E, S, W}"]], "x": "문제를 정식으로 적는(formulation) 첫 슬라이드입니다. 용어 세 개:<ul><li><b>원자적 상태(atomic state)</b>: 2-3 09쪽의 (a). 상태는 1, 2, 3, a 같은 이름표일 뿐 안을 들여다보지 않습니다. 그리고 이산(discrete) 환경만 다룹니다 — 연속 환경은 4장.</li><li><b>상태 공간(state space)</b>: 환경이 가질 수 있는 모든 상태의 집합. 미로라면 로봇이 있을 수 있는 모든 칸.</li><li><b>최적 해(optimal solution)</b>: 목표에 도달하는 행동 순서 중 경로 비용이 가장 낮은 것. 09쪽의 argmin이 찾는 것.</li></ul>오른쪽 위 표가 <b>상태 공간 그래프</b>를 표로 적은 것입니다. 한 줄 (s, a, s′) = \"상태 s에서 행동 a를 하면 상태 s′\". \"1, S, 2\"는 상태 1에서 남쪽(South)으로 가면 상태 2, \"2, N, 1\"은 2에서 북쪽으로 가면 다시 1입니다. 오른쪽 아래 미로에 초기 상태(1)와 목표 상태(2, 출구), 행동 {N, E, S, W}가 표시되어 있고 주황 선이 해(solution)입니다.<br>아래 두 줄: ① 이 순서를 찾는 과정이 <b>탐색(search)</b> 또는 <b>계획(planning)</b>. ② 07쪽의 가정(알려진 + 결정적) 덕분에 계획할 때 이미 결과를 정확히 예측했으므로, 실행 중에는 눈을 감고 계획대로만 움직여도 됩니다 — 이것이 <b>개루프(open-loop)</b>입니다. 반대로 실행하면서 계속 확인하고 고치는 것이 폐루프(closed-loop, 2-1 03쪽의 온도조절기).", "e": "개루프: 전자레인지 3분 — 버튼을 누르면 중간에 안 들여다봐도 됩니다. 폐루프: 라면 끓이기 — 면 상태를 계속 보면서 불을 조절합니다. 환경이 바뀔 수 있으면 개루프 계획이 가장 먼저 깨집니다."}, {"s": "3-1", "im": ["3-1-11"], "en": "Search Problem: Problem Formulation (2)", "ko": "탐색 문제: 문제 정의 (2) — 5요소", "key": 1, "o": [["<b>Initial state</b>: where the agent starts / <b>Actions</b>: the set A of possible actions / <b>Transition model</b>: the function giving the next state when one action is taken in the current state / <b>Goal state</b>: a set of one or more goal states / <b>Action cost function</b>: what each action costs", "<b>초기 상태</b>: 에이전트가 시작하는 곳 / <b>행동</b>: 가능한 행동의 집합 A / <b>전이 모델</b>: 현재 상태에서 행동 하나를 했을 때 다음 상태를 주는 함수 / <b>목표 상태</b>: 하나 이상의 목표 상태의 집합 / <b>행동 비용 함수</b>: 각 행동에 드는 비용"], ["1) We define the initial state, the actions, the transition model and the goal states. And <b>NOT the state space (table)</b> itself, which is usually too large to enumerate, or continuous", "1) 우리가 정의하는 것은 초기 상태, 행동, 전이 모델, 목표 상태다. 그리고 <b>상태 공간(표) 자체는 정의하지 않는다</b> — 보통 너무 커서 나열할 수 없거나, 연속적이기 때문"], ["2) <b>Path cost</b>: the sum of the action costs along the sequence from initial state to goal", "2) <b>경로 비용</b>: 초기 상태에서 목표까지 행동 순서를 따라 더한 행동 비용의 합"], ["Initial state · Actions: {N, E, S, W} · Transitions → · Goal state · Discretization grid", "초기 상태 · 행동: {N, E, S, W} · 전이 → · 목표 상태 · 이산화 격자"]], "x": "탐색 문제의 <b>5요소</b>입니다. 이것이 3장 전체의 틀이자, 어떤 문제든 탐색으로 풀려면 가장 먼저 적어야 하는 것입니다(2장의 PEAS가 에이전트 설계의 첫 단계였듯이).<div class='tw'><table><tr><th>요소</th><th>뜻</th><th>미로에서</th></tr><tr><td>① 초기 상태</td><td>시작하는 곳</td><td>칸 1 (Start)</td></tr><tr><td>② 행동 A</td><td>할 수 있는 행동들</td><td>{N, E, S, W}</td></tr><tr><td>③ 전이 모델</td><td>상태 + 행동 → 다음 상태</td><td>\"4에서 E로 가면 a\"</td></tr><tr><td>④ 목표 상태</td><td>도착하면 끝인 상태(여러 개일 수 있음)</td><td>칸 2 (Exit)</td></tr><tr><td>⑤ 행동 비용 함수</td><td>행동 하나의 비용</td><td>한 칸 이동 = 1</td></tr></table></div>그림의 <b>이산화 격자(discretization grid)</b>: 원래 미로는 연속 공간이지만, 주황 점선으로 칸을 나눠 1, 4, a, g, i 같은 이름을 붙이면 셀 수 있는 원자적 상태가 됩니다. 2-2의 '연속을 이산으로 근사'가 바로 이것입니다.<br>주의할 점 두 가지: ① 우리는 <b>상태 공간 자체는 적지 않습니다</b>. 상태가 너무 많거나(체스) 연속적이라(로봇 팔 각도) 다 나열할 수 없기 때문이고, 전이 모델 함수가 있으면 필요할 때 만들어 낼 수 있기 때문입니다. ② <b>경로 비용</b> = 경로 위 행동 비용의 합. 모든 행동 비용이 1이면 경로 비용 = 행동 횟수입니다. 뒤에서는 행동마다 비용이 다른 경우(루마니아의 도로 거리)도 나옵니다.", "e": "지하철로 숭실대입구 → 강남: 초기 상태 = 숭실대입구 · 행동 = 인접 역으로 이동, 환승 · 전이 모델 = 노선도(이 역에서 이 방향이면 다음 역) · 목표 상태 = {강남} · 행동 비용 = 역 사이 소요 시간. 경로 비용 = 총 소요 시간."}, {"s": "3-1", "im": ["3-1-12"], "en": "Search Problem: Transition Function and Actions", "ko": "탐색 문제: 전이 함수와 행동", "key": 1, "o": [["Transition function: <b>f : S × A → S</b>, or <b>s′ = RESULT(s, a)</b>", "전이 함수: <b>f : S × A → S</b>, 또는 <b>s′ = RESULT(s, a)</b>"], ["<b>A lookup table</b> of the transition model is a <b>state-space graph</b>: Each row is one edge.", "전이 모델의 <b>조회표</b>가 곧 <b>상태 공간 그래프</b>다: 각 행이 간선 하나다."], ["<b>ACTIONS(s)</b> is the set of actions legal in state s. <b>ACTIONS(4) = {E, S, N}</b>", "<b>ACTIONS(s)</b>는 상태 s에서 할 수 있는(합법적인) 행동의 집합이다. <b>ACTIONS(4) = {E, S, N}</b>"]], "x": "5요소 중 ②행동과 ③전이 모델을 함수로 적는 법입니다.<ul><li><b>전이 함수 f : S × A → S</b>: S × A는 (상태, 행동)의 모든 조합이고, 화살표 오른쪽 S는 그 결과 상태입니다. 교재 표기로는 <b>s′ = RESULT(s, a)</b>: \"상태 s에서 행동 a를 하면 s′\".</li><li><b>조회표 = 상태 공간 그래프</b>: 전이 함수를 표로 적으면 10쪽의 (s, a, s′) 표가 되고, 각 행이 그래프의 간선(화살표) 하나입니다. 표의 주황 상자 세 줄을 미로에서 보면: 상태 4에서 E(동쪽) → a, S(남쪽) → 5, N(북쪽) → 3.</li><li><b>ACTIONS(s)</b>: 상태 s에서 할 수 있는 행동의 집합. 상태 4의 서쪽은 벽이라 W가 빠져서 <b>ACTIONS(4) = {E, S, N}</b>입니다. 즉 가능한 행동은 상태마다 다릅니다.</li></ul>탐색 알고리즘은 이 두 함수 ACTIONS와 RESULT만 반복해서 부르며 그래프를 <b>조금씩 펼쳐 나갑니다</b> — 그래서 상태 공간 전체를 미리 만들 필요가 없습니다(05쪽의 '함수이지 표가 아니다').", "e": "자판기: ACTIONS(0원) = {동전 넣기}, ACTIONS(1500원) = {동전 넣기, 음료 선택, 반환}. RESULT(1000원, 500원 넣기) = 1500원, RESULT(1500원, 콜라 선택) = 0원·콜라 나옴."}, {"s": "3-1", "im": ["3-1-13"], "en": "Search Problems Are Models", "ko": "탐색 문제는 모델이다", "key": 1, "o": [["A robot has built a blocky, pixelated model of the Earth and set it next to the real planet.", "로봇이 각진 픽셀 모양의 지구 모형을 만들어 실제 지구 옆에 놓았다."], ["Search never runs on the world itself – it runs on a model of the world.", "탐색은 절대 세상 그 자체에서 실행되지 않는다 — 세상의 모델 위에서 실행된다."], ["The model is a simplification on purpose, so a plan is only as good as the model it was found in.", "모델은 일부러 단순화한 것이므로, 계획은 그것을 찾아낸 모델만큼만 좋다."]], "x": "그림: 로봇이 만든 각진 지구 모형(왼쪽)과 진짜 지구(오른쪽). 탐색은 진짜 지구가 아니라 <b>모형 위에서</b> 돌아갑니다. 11쪽의 5요소를 적는 것 자체가 현실을 단순화한 모델을 만드는 일입니다 — 미로를 격자로 자르고, 루마니아를 도시와 도로만 남긴 그래프로 바꾸는 것처럼. 단순화는 <b>일부러</b> 하는 것이고 그래야 풀 수 있지만, 대가가 있습니다: <b>\"최적 해\"는 \"이 모델 안에서 최적\"</b>이라는 뜻일 뿐입니다. 모델이 현실을 잘못 담았으면 최적 해도 현실에서는 나쁜 계획이 됩니다. 탐색이 실패하는 경우는 대개 알고리즘이 틀려서가 아니라 모델이 현실적이지 않았기 때문입니다.", "e": "지도 앱에 어제 시작된 도로 공사가 반영되지 않으면, 앱이 찾은 '최단 경로'로 가다가 막힙니다. 알고리즘은 완벽했고 모델(지도)이 틀린 것입니다."}, {"s": "3-1", "im": ["3-1-14"], "en": "What's in a State Space?", "ko": "상태 공간에는 무엇이 들어 있나?", "key": 1, "o": [["<b>World state</b>: Every detail of the environment.", "<b>세계 상태</b>: 환경의 모든 세부 사항."], ["<b>Search state</b>: only the details needed for planning – this is abstraction.", "<b>탐색 상태</b>: 계획에 필요한 세부 사항만 — 이것이 추상화다."], ["Problem 1: Pathing – states are (x, y) locations; actions are {N, S, E, W}; the transition model updates location only; every action costs 1; the goal states are those where (x, y) == END.", "문제 1: 경로 찾기 — 상태는 (x, y) 위치; 행동은 {N, S, E, W}; 전이 모델은 위치만 갱신; 모든 행동의 비용은 1; 목표 상태는 (x, y) == END인 상태들."], ["Problem 2: Eat-All-Dots – states are {(x, y), dot booleans}; actions are {N, S, E, W}; the transition model updates location and possibly a dot boolean; every action costs 1; the goal states are those where all dots are false.", "문제 2: 모든 점 먹기 — 상태는 {(x, y), 점마다의 참/거짓}; 행동은 {N, S, E, W}; 전이 모델은 위치와 (때로는) 점의 참/거짓을 갱신; 모든 행동의 비용은 1; 목표 상태는 모든 점이 거짓(다 먹음)인 상태들."]], "x": "상태에 무엇을 넣을 것인가 — 05쪽에서 말한 '어려운 부분'입니다. 팩맨 화면에는 팩맨 위치, 점 30개, 유령 위치, 점수, 목숨, 바라보는 방향 등 정보가 아주 많습니다. 이 전부가 <b>세계 상태(world state)</b>입니다. 하지만 탐색에는 <b>계획에 필요한 것만</b> 넣는데, 이것이 <b>추상화(abstraction)</b>이고 결과가 <b>탐색 상태(search state)</b>입니다. 같은 팩맨이라도 문제가 다르면 탐색 상태가 달라집니다:<div class='tw'><table><tr><th></th><th>문제 1: 경로 찾기</th><th>문제 2: 모든 점 먹기</th></tr><tr><td>상태</td><td>(x, y) 위치만</td><td>(x, y) + 점 30개 각각을 먹었나(참/거짓)</td></tr><tr><td>행동</td><td>{N, S, E, W}</td><td>{N, S, E, W}</td></tr><tr><td>전이 모델</td><td>위치만 바뀜</td><td>위치가 바뀌고, 점이 있는 칸이면 그 점이 '먹음'으로</td></tr><tr><td>비용</td><td>행동당 1</td><td>행동당 1</td></tr><tr><td>목표</td><td>(x, y) == END</td><td>모든 점이 '먹음'</td></tr></table></div>유령과 점수는 두 문제 모두에서 빠졌습니다(계획에 불필요). 문제 2는 점 30개의 참/거짓 때문에 상태 수가 2<sup>30</sup>배 커집니다 — 3-2 20쪽에서 120 vs 120 × 2<sup>30</sup>으로 다시 나옵니다. 상태에 너무 많이 넣으면 탐색이 불가능해지고, 너무 적게 넣으면 문제를 풀 수 없습니다.", "e": "짐 싸기: 당일치기 나들이(문제 1)엔 지갑과 폰만 챙기면 되고, 일주일 여행(문제 2)엔 옷까지 챙겨야 합니다. 무엇을 챙길지(상태에 넣을지)는 어디 가느냐(문제)가 정합니다."}, {"s": "3-1", "im": ["3-1-15"], "en": "Example: Vacation in Romania", "ko": "예시: 루마니아 휴가", "key": 1, "o": [["<i>You are on holiday in Arad and fly out of Bucharest tomorrow.</i>", "<i>당신은 아라드에서 휴가 중이고 내일 부쿠레슈티에서 비행기를 탄다.</i>"], ["<b>Initial state</b>: Arad / <b>Actions</b>: drive from one city to another / <b>Transition model</b>: leaving city A for city B lands you in B / <b>Goal state</b>: Bucharest / <b>Action cost</b>: distance travelled / Set of actions (<b>Path</b>) cost: total distance to the goal", "<b>초기 상태</b>: 아라드 / <b>행동</b>: 한 도시에서 다른 도시로 운전 / <b>전이 모델</b>: 도시 A를 떠나 B로 가면 B에 도착한다 / <b>목표 상태</b>: 부쿠레슈티 / <b>행동 비용</b>: 이동한 거리 / 행동 순서(<b>경로</b>)의 비용: 목표까지의 총 거리"], ["Original Description → State Space / Transition model, defined as a graph. Distance in miles", "원래의 설명(지도) → 상태 공간 / 전이 모델, 그래프로 정의됨. 거리 단위는 마일"]], "x": "교재(AIMA)의 대표 예제, 세 예제 중 첫 번째입니다. 오른쪽 위의 실제 루마니아 지도(Original Description)를 도시(점)와 도로(선)만 남긴 그래프로 <b>추상화</b>한 것이 상태 공간이자 전이 모델이고, 도로 옆 숫자(마일)가 행동 비용입니다. 5요소에 대입하면 표 그대로입니다: 초기 = Arad, 행동 = 이웃 도시로 운전, 전이 = 도로를 따라가면 그 도시 도착, 목표 = Bucharest, 비용 = 거리. 이 예제가 중요한 이유는 <b>행동마다 비용이 다르다</b>는 점입니다(미로는 모두 1이었음).<div class='tw'><table><tr><th>경로</th><th>비용</th></tr><tr><td>Arad → Sibiu → Fagaras → Bucharest (3번 이동)</td><td>140 + 99 + 211 = 450</td></tr><tr><td>Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest (4번 이동)</td><td>140 + 80 + 97 + 101 = <b>418 (최적)</b></td></tr></table></div>거치는 도시가 하나 더 많은 쪽이 32마일 더 쌉니다. 눈대중으로는 알 수 없고, 그래서 탐색 알고리즘이 필요합니다. 이 지도는 3-3(UCS), 3-4(탐욕적 탐색, A*)에서 계속 다시 나오므로 익숙해져 두세요.", "e": "같은 틀로 서울 → 부산 기차 여행: 초기 = 서울, 행동 = 다음 역으로 이동, 전이 = 노선도, 목표 = 부산, 비용 = 구간 소요 시간. 환승이 많아도 총 시간이 짧은 경로가 최적입니다."}, {"s": "3-1", "im": ["3-1-16"], "en": "Example 2: The Vacuum-Cleaner World", "ko": "예시 2: 진공청소기 세계", "key": 1, "o": [["<b>States</b> — which of the two rooms holds the agent, and where the dirt is / <b>Initial state</b> — any of them", "<b>상태</b> — 두 방 중 어디에 에이전트가 있고, 먼지가 어디 있는가 / <b>초기 상태</b> — 그중 아무거나"], ["<b>Actions</b> — Left, Right, Suck / <b>Transition model</b> — move, or remove the dirt / <b>Goal state</b> — both rooms clean", "<b>행동</b> — 왼쪽, 오른쪽, 흡입 / <b>전이 모델</b> — 이동하거나, 먼지를 없앤다 / <b>목표 상태</b> — 두 방 모두 깨끗"], ["<b>Action cost</b> — 1 per action, so path cost counts actions / <b>8 atomic states</b> can be represented — State Space · Goal states", "<b>행동 비용</b> — 행동당 1, 따라서 경로 비용은 행동 수를 센다 / <b>8개의 원자적 상태</b>로 표현된다 — 상태 공간 · 목표 상태들"]], "x": "두 번째 예제, 2장의 진공청소기 세계를 탐색 문제로 다시 적은 것입니다. 그림은 2-3 10쪽의 전이 모델 그래프와 같습니다. 상태 수 8 = 청소기 위치 2 × A 먼지 유무 2 × B 먼지 유무 2. 맨 윗줄 두 상태 = 두 방 모두 더러움, 가운데 네 상태 = 한 방만 더러움, 맨 아랫줄(주황 테두리) = 두 방 모두 깨끗 = <b>목표 상태 2개</b>(청소기가 A에 있든 B에 있든 둘 다 목표). 행동은 L, R, S 세 가지이고(2장의 NoOp은 뺐음), 비용은 모두 1이라 경로 비용 = 행동 횟수입니다. 이 예제는 3-2에서 b = 3, d = 3, m = 5를 세는 연습 문제로 다시 쓰입니다.", "e": "최적 해 찾기: [A, 둘 다 더러움]에서 시작하면 Suck → Right → Suck으로 목표. 행동 3개 = 경로 비용 3. 2장의 반사 청소기 프로그램도 이 순서로 움직였습니다. Right → Suck → Left → Suck처럼 돌아가면 비용 4라 최적이 아닙니다."}, {"s": "3-1", "im": ["3-1-17"], "en": "Example 3: The Sliding-Tile Puzzle", "ko": "예시 3: 슬라이딩 타일 퍼즐", "key": 1, "o": [["<b>States</b>: tile positions / <b>Initial state</b>: the left-bottom figure", "<b>상태</b>: 타일들의 위치 / <b>초기 상태</b>: 왼쪽 아래 그림"], ["<b>Actions</b>: move the blank tile left, right, up or down.", "<b>행동</b>: 빈칸을 왼쪽, 오른쪽, 위, 아래로 옮긴다."], ["<b>Transition model</b>: swap the blank with the position of the tile the moved into it.", "<b>전이 모델</b>: 빈칸과, 그 자리로 옮겨 온 타일의 위치를 맞바꾼다."], ["<b>Goal state</b>: the tiles in order as the right-bottom figure. / <b>Action cost</b>: the tiles in order as the right-bottom figure.", "<b>목표 상태</b>: 오른쪽 아래 그림처럼 타일이 순서대로. / <b>행동 비용</b>: (슬라이드 원문 그대로) 오른쪽 아래 그림처럼 타일이 순서대로."]], "x": "세 번째 예제, <b>8-퍼즐</b>(슬라이딩 타일 퍼즐)입니다. 3×3 판에 타일 8개와 빈칸 1개가 있고, 시작 상태(7 2 4 / 5 _ 6 / 8 3 1)에서 목표 상태(_ 1 2 / 3 4 5 / 6 7 8)로 만드는 문제입니다. 상태 표현의 설계 결정이 잘 드러나는 예입니다: 실제로는 타일을 밀지만, \"<b>빈칸(blank)을 움직인다</b>\"고 보면 행동이 상·하·좌·우 4가지로 단순해집니다(타일 8개를 각각 따진다면 행동 종류가 훨씬 많아짐). 빈칸이 가운데면 4방향, 변에 있으면 3방향, 모서리면 2방향으로 움직일 수 있습니다. 전이 모델은 빈칸과 그 방향의 타일을 맞바꾸는 것입니다.<div class='warn'>확인 포인트: 슬라이드의 'Action cost' 줄은 Goal state 문장이 그대로 복사된 것으로 보입니다. 교재 기준 행동 비용은 이동 한 번당 1이고, 경로 비용 = 이동 횟수입니다.</div>", "e": "시작 상태에서 가능한 행동: 빈칸이 가운데이므로 4가지. 빈칸을 위로 옮기면 2가 내려와서 (7 _ 4 / 5 2 6 / 8 3 1)이 됩니다. 이렇게 한 번 움직일 때마다 새 상태가 하나 생깁니다."}, {"s": "3-1", "im": ["3-1-18"], "en": "Example: How Big Is the Puzzle?", "ko": "예시: 퍼즐은 얼마나 큰가?", "key": 1, "o": [["Each state is a placement of the tiles, blank included / <b>Half</b> of the permutations are unreachable from any given start", "각 상태는 빈칸을 포함한 타일의 배치 하나다 / 순열의 <b>절반</b>은 어떤 시작 상태에서도 도달할 수 없다"], ["8-puzzle — 9! / <b>2</b> = 181,440 states / 15-puzzle — 16! / <b>2</b> ≈ 10<sup>13</sup> states / 24-puzzle — 25! / <b>2</b> ≈ 10<sup>25</sup> states / Going from the 15-puzzle to the 24-puzzle (one more row and one more column) multiplies the state space by about 10<sup>12</sup>", "8-퍼즐 — 9! / <b>2</b> = 181,440개 상태 / 15-퍼즐 — 16! / <b>2</b> ≈ 10<sup>13</sup>개 상태 / 24-퍼
