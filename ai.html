즐 — 25! / <b>2</b> ≈ 10<sup>25</sup>개 상태 / 15-퍼즐에서 24-퍼즐로 가면(행 하나, 열 하나 추가) 상태 공간이 약 10<sup>12</sup>배가 된다"], ["S<sub>0</sub> start: blank on light 0 · permutation even 0 · SUM 0 → S<sub>1</sub> 1 move: blank on dark 1 · permutation odd 1 · SUM 0 → S<sub>2</sub> 2 moves: blank on light 0 · permutation even 0 · SUM 0 — <b>Both flip together, every single move — so the sum never changes.</b>", "S<sub>0</sub> 시작: 빈칸이 밝은 칸 0 · 순열 짝 0 · 합 0 → S<sub>1</sub> 1회 이동: 빈칸이 어두운 칸 1 · 순열 홀 1 · 합 0 → S<sub>2</sub> 2회 이동: 빈칸이 밝은 칸 0 · 순열 짝 0 · 합 0 — <b>둘이 매 이동마다 함께 뒤집힌다 — 그래서 합은 절대 변하지 않는다.</b>"], ["SUM = 0: the half you start in, 181,440 states, all reachable from one another / SUM = 1: everything else, 181,440 states, never reachable, ever / <b>9! = 362,880 splits in two, and no legal move crosses.</b>", "합 = 0: 당신이 시작한 절반, 181,440개 상태, 서로 모두 도달 가능 / 합 = 1: 나머지 전부, 181,440개 상태, 영원히 도달 불가 / <b>9! = 362,880이 둘로 갈라지고, 어떤 합법적 이동도 경계를 넘지 못한다.</b>"]], "x": "8-퍼즐의 상태 수와, 교수님이 가장 중요하다고 한 \"<b>왜 2로 나누는가</b>\"입니다.<br><b>상태 수</b>: 9칸에 타일 8개와 빈칸을 놓는 방법은 9! = 362,880가지. 그런데 그중 절반은 어떤 시작 상태에서도 갈 수 없어서 실제 상태 수는 9!/2 = <b>181,440</b>입니다. 판이 커지면 15-퍼즐 16!/2 ≈ 10<sup>13</sup>, 24-퍼즐 25!/2 ≈ 10<sup>25</sup> — 행과 열을 하나씩만 늘려도 10<sup>12</sup>배. 상태 공간은 이렇게 <b>지수적으로 폭발</b>합니다.<br><b>왜 절반인가</b> (아래 그림): 판을 체스판처럼 밝은 칸/어두운 칸으로 칠합니다. 두 가지 값을 추적합니다.<ul><li>① <b>빈칸의 칸 색</b>: 밝은 칸이면 0, 어두운 칸이면 1. 빈칸은 한 번 움직일 때마다 옆 칸으로 가므로 색이 반드시 바뀝니다(0 ↔ 1).</li><li>② <b>순열의 짝/홀(parity)</b>: 타일 배열을 순서대로 되돌리는 데 맞바꾸기가 짝수 번 필요하면 0, 홀수 번이면 1. 한 번 움직이는 것은 빈칸과 타일 하나를 맞바꾸는 것이므로 이 값도 반드시 뒤집힙니다.</li></ul>둘이 <b>매번 함께</b> 뒤집히므로 두 값의 합(mod 2)은 절대 변하지 않습니다 — 이런 값을 <b>불변량(invariant)</b>이라고 합니다. 그림의 S₀(합 0) → S₁(1 + 1 = 2 ≡ 0) → S₂(0 + 0 = 0)처럼 합은 늘 0입니다. 따라서 합 = 0인 배치 181,440개끼리는 서로 오갈 수 있지만, 합 = 1인 나머지 181,440개로는 어떤 합법적 이동으로도 건너갈 수 없습니다. 9!이 정확히 두 세계로 갈라지는 것입니다.", "e": "목표 상태에서 타일 1과 2만 서로 바꿔 끼운 배치는 절대 풀 수 없습니다(순열의 짝/홀만 바뀌고 빈칸 위치는 그대로 → 합이 1). 샘 로이드가 1800년대에 '15-퍼즐에서 14와 15를 바꾸면 상금'을 걸었는데 아무도 못 푼 것이 이 이유입니다. 참고로 8-퍼즐은 어떤 상태에서도 최대 31수면 풀립니다."}, {"s": "3-2", "im": ["3-2-01", "3-2-02"], "en": "2. Tree Search", "ko": "2. 트리 탐색 (개요)", "key": 1, "o": [["Chapter 3 - Part I: Search Problem, Tree Search, and Search Space", "3장 파트 I: 탐색 문제, 트리 탐색, 탐색 공간"], ["The state space is a graph. A search tree is not. What happens in between?", "상태 공간은 그래프다. 탐색 트리는 그래프가 아니다. 그 사이에서 무슨 일이 일어나는가?"], ["Cycles and redundant paths, and why every algorithm today has to deal with them — In tree, Seoul ≠ Seoul → Busan → Seoul ≠ S → B → S → B → S", "사이클과 중복 경로, 그리고 오늘의 모든 알고리즘이 그것을 다뤄야 하는 이유 — 트리에서는 서울 ≠ 서울 → 부산 → 서울 ≠ 서울 → 부산 → 서울 → 부산 → 서울"], ["The frontier known but not yet expanded, also called the open list / In tree, nodes are paths, not states: eight states, an infinite tree", "프런티어: 알려졌지만 아직 확장되지 않은 것, 개방 목록이라고도 부른다 / 트리에서 노드는 상태가 아니라 경로다: 상태는 8개, 트리는 무한"], ["One loop that every strategy in this chapter is a special case of / The four questions asked of any search strategy: complete, optimal, time, space", "이 장의 모든 전략이 특수한 경우가 되는 하나의 반복문 / 모든 탐색 전략에 던지는 네 가지 질문: 완전한가, 최적인가, 시간, 공간"]], "x": "2절 '트리 탐색'의 개요입니다. 핵심 질문: 상태 공간은 <b>그래프</b>(점과 선이 자유롭게 연결, 되돌아올 수 있음)인데, 탐색은 <b>트리</b>(루트에서 가지가 뻗어 나가기만 함) 위에서 이루어집니다. 그래프를 트리로 펼칠 때 무슨 일이 생기는가가 이 절의 주제입니다.<br>미리 보는 핵심 예: 지도(그래프)에서 '서울'은 한 점이지만, 탐색 트리에서는 \"처음의 서울\", \"부산에 갔다가 돌아온 서울\", \"부산을 두 번 갔다 온 서울\"이 모두 <b>다른 노드</b>입니다. 도착하기까지의 <b>경로</b>가 다르기 때문입니다. 왕복이 가능하면 이런 노드가 끝없이 생겨서, 상태는 8개뿐인 진공청소기 세계도 탐색 트리는 무한합니다. 이 절에서 배울 것: 사이클과 중복 경로(04쪽), 프런티어(09쪽), 노드 ≠ 상태(06쪽), 모든 전략의 공통 반복문(09쪽), 전략을 평가하는 네 질문(13쪽).", "e": "일기장 비유: 지도에 '우리 집'은 한 곳이지만, 일기에는 \"아침에 집에서\", \"학교 갔다 돌아온 집에서\"가 다른 줄로 적힙니다. 지도 = 상태 공간 그래프, 일기 = 탐색 트리.", "pg": [[1, 1], [1, 4]]}, {"s": "3-2", "im": ["3-2-03"], "en": "Tree Search: Solving a Search Problem", "ko": "트리 탐색: 탐색 문제 풀기", "o": [["We have the problem formulation: initial state, actions, transition model, goal states, action cost function", "문제 정의는 갖고 있다: 초기 상태, 행동, 전이 모델, 목표 상태, 행동 비용 함수"], ["So how do we actually find the optimal solution? → <b>Build a search tree over the state-space graph</b>", "그러면 최적 해는 실제로 어떻게 찾는가? → <b>상태 공간 그래프 위에 탐색 트리를 만든다</b>"], ["State space ≠ SEARCH TREE · Initial state · Goal states", "상태 공간 ≠ 탐색 트리 · 초기 상태 · 목표 상태들"]], "x": "3-1에서 문제의 5요소를 적었으니, 이제 \"그래서 답은 어떻게 찾나?\"입니다. 답(형광펜): <b>상태 공간 그래프 위에 탐색 트리를 만든다</b>. 그림은 진공청소기 세계의 상태 공간 그래프(3-1 16쪽)이고, 주황 화살표는 초기 상태(왼쪽 위, 둘 다 더러움)에서 목표 상태(맨 아래, 둘 다 깨끗)로 가는 경로 하나(R → S → L → S)입니다. 빨간 글씨 <b>\"State space ≠ SEARCH TREE\"</b>가 이 슬라이드의 포인트입니다: 이 그래프는 '세상의 지도'이지 탐색 트리가 아닙니다. 탐색 트리는 초기 상태를 뿌리로 해서 이 그래프를 펼쳐 만드는 별도의 것입니다(05쪽)."}, {"s": "3-2", "im": ["3-2-04"], "en": "Tree Search: The Transition Model Is a Graph, Not a Tree", "ko": "트리 탐색: 전이 모델은 트리가 아니라 그래프다", "key": 1, "o": [["<b>Cycles</b>: paths that come back to the same state", "<b>사이클</b>: 같은 상태로 되돌아오는 경로"], ["Non-cycle <b>redundant paths</b>: several different paths that reach the same state", "사이클이 아닌 <b>중복 경로</b>: 같은 상태에 도달하는 서로 다른 여러 경로"], ["Both have to be dealt with before a graph can be searched as a tree", "그래프를 트리처럼 탐색하려면 둘 다 먼저 처리해야 한다"], ["Cycles – the orange loops return to the same state / Redundant paths – Path 1 and Path 2 reach the same goal", "사이클 — 주황색 고리들은 같은 상태로 돌아온다 / 중복 경로 — 경로 1과 경로 2가 같은 목표에 도달한다"]], "x": "그래프를 트리로 펼칠 때 생기는 두 가지 문제입니다.<ul><li><b>사이클(cycle)</b>: 한 경로를 따라가다 <b>같은 상태로 되돌아오는</b> 것. 왼쪽 그림의 주황 고리들 — 왼쪽 방에서 L을 하면 제자리(self-loop), R 했다가 L 하면 원래 상태. 그대로 두면 L, L, L… 또는 R, L, R, L…을 끝없이 반복하며 트리가 무한히 깊어집니다.</li><li><b>중복 경로(redundant path)</b>: 서로 다른 두 경로가 <b>같은 상태에서 만나는</b> 것. 오른쪽 그림의 Path 1(초록)과 Path 2(파랑)는 다른 길로 가서 같은 목표에 도착합니다. 무한 루프는 아니지만 같은 상태를 두 번 조사하므로 시간 낭비입니다.</li></ul>둘의 차이: 사이클은 <b>한 경로 안</b>에서의 반복이고, 중복 경로는 <b>서로 다른 두 경로</b>가 만나는 것입니다. 사이클도 넓게 보면 중복 경로의 한 종류입니다(같은 상태에 두 번 도달하니까). 둘을 어떻게 처리하느냐가 08쪽(검사 비용)과 3-3(BFS의 reached, DFS의 사이클 검사)으로 이어집니다.", "e": "사이클: 에스컬레이터로 1층 ↔ 2층을 계속 오르내리기. 중복 경로: 편의점까지 큰길로 가나 골목으로 가나 같은 편의점에 도착."}, {"s": "3-2", "im": ["3-2-05"], "en": "Tree Search: Generating the Search Tree", "ko": "트리 탐색: 탐색 트리 생성하기", "key": 1, "o": [["Overlay a \"<b>what-if tree</b>\" of possible actions on the state-space graph. / The root node is the initial state.", "상태 공간 그래프 위에 가능한 행동들의 \"<b>만약에 트리</b>\"를 겹쳐 놓는다. / 루트 노드는 초기 상태다."], ["A child is reached along an <b>edge</b> representing an <b>action</b>, and the <b>transition model</b> says which state that child is.", "자식은 <b>행동</b>을 나타내는 <b>간선</b>을 따라 도달하며, 그 자식이 어떤 상태인지는 <b>전이 모델</b>이 알려 준다."], ["A tree cannot contain a <b>cycle</b> — A cycle in the search space becomes an infinite loop, so it must be cut.", "트리는 <b>사이클</b>을 포함할 수 없다 — 탐색 공간의 사이클은 무한 루프가 되므로, 잘라내야 한다."], ["A tree cannot contain <b>two paths to the same state</b> — That is a redundant path; removing it improves efficiency", "트리는 <b>같은 상태로 가는 두 경로</b>를 포함할 수 없다 — 그것이 중복 경로이며, 없애면 효율이 좋아진다"], ["A path through the tree is a sequence of actions; a solution is a path ending at a goal node — Root node = Initial state · Edge = Action · Cycle ✕ · Non-cycle redundant path ✕ · Goal state node", "트리를 지나는 경로는 행동의 순서이고, 해는 목표 노드에서 끝나는 경로다 — 루트 노드 = 초기 상태 · 간선 = 행동 · 사이클 ✕ · 사이클 아닌 중복 경로 ✕ · 목표 상태 노드"]], "x": "탐색 트리를 만드는 방법입니다. \"만약에 이 행동을 하면? 그다음엔?\"을 계속 물으며 그래프를 펼친 것이 <b>만약에 트리(what-if tree)</b>입니다. 오른쪽 그림으로 용어를 짝지어 보세요.<ul><li><b>루트 노드(root)</b> a = 초기 상태. 트리의 맨 위.</li><li><b>간선(edge)</b> = 행동. a에서 뻗은 두 화살표가 두 가지 행동이고, 그 끝의 b, c가 자식 노드입니다. 자식이 어떤 상태인지는 <b>전이 모델</b> RESULT(a, 행동)가 알려 줍니다.</li><li><b>사이클 ✕</b>: b → d → b. d의 자식으로 b가 또 나오는데, 이것은 이미 지나온 상태로 돌아가는 것이므로 빨간 ✕로 잘라냅니다. 안 자르면 b → d → b → d … 무한 루프.</li><li><b>중복 경로 ✕</b>: a → c → e. 그런데 e는 이미 a → b → e로 도달했습니다. 같은 상태 e에 가는 두 번째 경로이므로 효율을 위해 잘라냅니다.</li><li><b>해(solution)</b>: 주황 굵은 선 a → b → d → … → f. 목표 상태 노드 f에서 끝나는 경로이고, 이 경로의 간선들이 곧 행동의 순서입니다.</li></ul>", "e": "오목 수 읽기: \"여기에 두면(간선 = 행동) → 판이 이렇게 된다(자식 노드)\"를 반복해서 트리를 만듭니다. 이미 따져 본 판이 다른 수순으로 또 나오면(중복 경로) 다시 따지지 않고 건너뜁니다."}, {"s": "3-2", "im": ["3-2-06"], "en": "Tree Search: Nodes Are Not States", "ko": "트리 탐색: 노드는 상태가 아니다", "key": 1, "o": [["This is the distinction students lose most often", "이것은 학생들이 가장 자주 놓치는 구분이다"], ["Each node of the tree stands for one state of the system. But it is not the same thing as that state / But when redundant paths cannot be fully prevented, the same state appears as several different nodes.", "트리의 각 노드는 시스템의 한 상태를 나타낸다. 하지만 그 상태와 같은 것은 아니다 / 중복 경로를 완전히 막을 수 없으면, 같은 상태가 여러 개의 다른 노드로 나타난다."], ["State space: the world. <b>One node per state</b>. Fixed. A graph / Search tree: the record of what we tried. <b>One node per PATH</b>. Built as we go. Always a tree. Can be infinite", "상태 공간: 세상. <b>상태당 노드 하나</b>. 고정됨. 그래프 / 탐색 트리: 우리가 시도한 것의 기록. <b>경로당 노드 하나</b>. 진행하면서 만들어짐. 항상 트리. 무한할 수 있음"], ["The vacuum world has 8 states and an infinite search tree", "진공청소기 세계는 상태가 8개이고 탐색 트리는 무한하다"]], "x": "\"학생들이 가장 자주 놓치는 구분\" — <b>노드는 상태가 아닙니다</b>. 노드는 상태를 '가리키지만', 거기에 \"어떤 경로로 왔는가\"가 붙어 있습니다. 그래서 같은 상태라도 다른 경로로 도달하면 다른 노드입니다.<div class='tw'><table><tr><th></th><th>상태 공간 (그래프)</th><th>탐색 트리</th></tr><tr><td>무엇인가</td><td>세상 그 자체</td><td>우리가 시도한 것의 기록</td></tr><tr><td>노드 하나 =</td><td><b>상태 하나</b></td><td><b>경로 하나</b></td></tr><tr><td>언제 만들어지나</td><td>고정되어 있음</td><td>탐색하면서 조금씩</td></tr><tr><td>모양</td><td>그래프 (되돌아갈 수 있음)</td><td>항상 트리 (가지만 뻗음)</td></tr><tr><td>크기</td><td>유한할 수 있음 (청소기: 8)</td><td>무한할 수 있음 (청소기: ∞)</td></tr></table></div>중복 경로를 완전히 막을 수 없으면(08쪽: 메모리 때문에 자주 포기함) 같은 상태가 트리에 여러 번 나타납니다. (보충) 교재에서 노드 하나가 담는 정보: <b>STATE</b>(상태), <b>PARENT</b>(부모 노드), <b>ACTION</b>(부모에서 여기로 온 행동), <b>PATH-COST</b>(루트부터 여기까지 비용, g(n)). 상태가 같아도 부모나 비용이 다르면 다른 노드입니다 — 3-3의 UCS에서 \"같은 상태로 가는 더 싼 노드\"를 찾는 것이 이 때문입니다.", "e": "숭실대입구 → 고속터미널 → 강남으로 간 '강남'과 숭실대입구 → 사당 → 강남으로 간 '강남'은 같은 상태(같은 역)이지만, 탐색 트리에서는 경로가 달라서 다른 노드입니다(비용도 다를 수 있음)."}, {"s": "3-2", "im": ["3-2-07"], "en": "State Space Graphs vs. Search Trees", "ko": "상태 공간 그래프 vs 탐색 트리", "o": [["The same problem drawn both ways: the state space graph on one side, the search tree unrolled from S on the other", "같은 문제를 두 방식으로 그린 것: 한쪽은 상태 공간 그래프, 다른 쪽은 S에서 펼친 탐색 트리"], ["State e appears once in the graph but many times in the tree once for every path that reaches it. Count them", "상태 e는 그래프에는 한 번 나오지만 트리에는 여러 번 나온다 — 그것에 도달하는 경로마다 한 번씩. 세어 보라"], ["Each NODE in the search tree is an entire PATH in the state space graph. / We construct both on demand – and we construct as little as possible.", "탐색 트리의 각 노드는 상태 공간 그래프의 경로 전체다. / 둘 다 필요할 때 만든다 — 그리고 가능한 한 적게 만든다."]], "x": "CS188의 유명한 그림입니다. 왼쪽은 상태 공간 그래프(S에서 G까지, 상태 11개), 오른쪽은 S를 뿌리로 펼친 탐색 트리입니다. 이 그래프는 3-3에서 BFS·UCS·DFS를 직접 돌려 보는 예제로 다시 나옵니다.<br>\"세어 보라\"의 답: 그래프에서 e는 한 번뿐이지만, 트리에서는 S → e로 간 e와 S → d → e로 간 e, 이렇게 <b>2번</b> 나옵니다. 목표 G도 트리에 2번 나옵니다(S → e → r → f → G와 S → d → e → r → f → G). 트리의 노드 하나 = 그래프에서 S부터 거기까지의 <b>경로 전체</b>이기 때문입니다.<br>마지막 문장이 실용적 교훈입니다: 그래프도 트리도 <b>미리 다 만들지 않고 필요할 때</b> 만들며, 좋은 탐색 전략일수록 트리를 <b>적게 펼치고</b> 목표를 찾습니다. 3-3·3-4의 알고리즘 비교가 결국 '얼마나 적게 펼치느냐'입니다.", "e": "트리에서 p를 세어 보면: S → p, S → d → e → h → p, S → e → h → p … 그래프에는 p가 하나지만 트리에서는 도달 경로마다 하나씩 생깁니다."}, {"s": "3-2", "im": ["3-2-08"], "en": "Tree Search: Classical Tree Search vs AI Search", "ko": "고전적 트리 탐색 vs AI 탐색", "key": 1, "o": [["Classical tree search: The tree is given, and held in memory / The tree has no redundant or cyclic paths", "고전적 트리 탐색: 트리가 주어져 있고, 메모리에 들어 있다 / 트리에 중복 경로나 순환 경로가 없다"], ["AI tree / graph search: The search tree is far too large to hold in memory — Part of the tree is built from the initial state using the transition function / Memory management is critical / The search space is usually a very large, complex graph", "AI 트리/그래프 탐색: 탐색 트리가 메모리에 담기에는 너무 크다 — 트리의 일부를 초기 상태에서 전이 함수로 만들어 간다 / 메모리 관리가 결정적이다 / 탐색 공간은 대개 매우 크고 복잡한 그래프다"], ["Memory-efficient cycle checking matters, to avoid infinite loops and limit re-searching the same region / Checking for redundant paths often costs too much memory, so we accept searching the same part more than once", "메모리 효율적인 사이클 검사가 중요하다 — 무한 루프를 피하고 같은 영역을 다시 탐색하는 것을 줄이기 위해 / 중복 경로 검사는 메모리가 너무 많이 들 때가 많아서, 같은 부분을 여러 번 탐색하는 것을 감수한다"], ["<i>The difference is whether the tree already exists.</i>", "<i>차이는 트리가 이미 존재하느냐다.</i>"]], "x": "자료구조 수업에서 배우는 '트리 탐색'과 AI의 '탐색'이 왜 다른지입니다. 차이는 한 문장: <b>트리가 이미 존재하는가</b>.<div class='tw'><table><tr><th>고전적 트리 탐색</th><th>AI 탐색</th></tr><tr><td>트리가 통째로 메모리에 있음 (폴더 구조, 가계도)</td><td>트리가 너무 커서 메모리에 못 넣음. 초기 상태에서 전이 함수로 <b>필요한 부분만 만들어 가며</b> 탐색</td></tr><tr><td>중복·순환 경로가 없음</td><td>탐색 공간이 크고 복잡한 그래프라 사이클과 중복 경로가 많음</td></tr><tr><td>메모리 걱정 없음</td><td><b>메모리 관리가 결정적</b></td></tr></table></div>그래서 두 가지 검사의 비용이 중요해집니다.<ul><li><b>사이클 검사(cycle check)</b>: 새 노드의 상태가 \"현재 경로 위\"에 이미 있는지만 보면 됩니다. 부모를 따라 루트까지 올라가며 비교하면 되므로 추가 메모리가 거의 안 듭니다 → 싸다, 꼭 한다.</li><li><b>중복 경로 검사(redundant path check)</b>: 새 노드의 상태가 \"지금까지 어디서든 본 적 있는지\"를 알아야 하므로 방문한 모든 상태를 기억해야 합니다 → 메모리가 많이 든다. 그래서 종종 포기하고 같은 부분을 여러 번 탐색하는 것을 감수합니다.</li></ul>(보충) 방문한 상태를 모두 기억하는 표를 교재는 <b>reached</b>(또는 explored)라고 부르고, 이것을 쓰면 그래프 탐색(graph search), 안 쓰면 트리형 탐색(tree-like search)이라고 합니다. 3-3의 BFS는 reached를 쓰고, DFS는 메모리를 아끼려 안 씁니다.", "e": "고전: 내 컴퓨터 폴더 트리에서 파일 찾기 — 폴더 구조가 이미 디스크에 있음. AI: 체스 프로그램이 규칙(전이 함수)으로 다음 판들을 그때그때 만들어 가며 탐색 — 모든 판을 미리 저장할 수 없음."}, {"s": "3-2", "im": ["3-2-09"], "en": "Tree Search: Summary of the Algorithm", "ko": "트리 탐색: 알고리즘 요약", "key": 1, "o": [["1. Initialise the FRONTIER with the start state (root node) (the frontier is the set of known but not-yet-expanded nodes)", "1. 프런티어를 시작 상태(루트 노드)로 초기화한다 (프런티어는 알려졌지만 아직 확장되지 않은 노드들의 집합이다)"], ["2. While the frontier is not empty: a) Choose the next node to expand from the frontier, according to the SEARCH STRATEGY / b) If that node represents a goal state, return it as the solution / c) Otherwise EXPAND the node – apply every possible action using the transition model – and add the child nodes for the newly reached states to the frontier", "2. 프런티어가 비어 있지 않은 동안: a) 탐색 전략에 따라 프런티어에서 다음에 확장할 노드를 고른다 / b) 그 노드가 목표 상태를 나타내면, 해로 반환한다 / c) 아니면 그 노드를 확장한다 — 전이 모델을 써서 가능한 모든 행동을 적용하고 — 새로 도달한 상태들의 자식 노드를 프런티어에 추가한다"]], "x": "탐색 알고리즘의 전체 모양입니다. 01쪽에서 말한 \"<b>이 장의 모든 전략이 특수한 경우가 되는 하나의 반복문</b>\"이 바로 이것입니다. 용어부터:<ul><li><b>프런티어(frontier)</b>: \"발견했지만 아직 자식을 만들어 보지 않은\" 노드들의 목록. 개방 목록(open list)이라고도 합니다. 탐색의 '가장자리'입니다.</li><li><b>확장(expand)</b>: 노드 하나를 꺼내 전이 모델로 가능한 모든 행동을 적용해 자식 노드들을 만들고 프런티어에 넣는 것.</li></ul>반복문을 말로 풀면: ① 처음엔 프런티어에 루트만 있다. ② 프런티어에서 하나 꺼낸다 → 목표면 끝 → 아니면 자식들을 만들어 프런티어에 넣는다 → 반복. 프런티어가 비면 해가 없는 것(실패).<div class='formula'>frontier = [root]<br>while frontier:<br>&nbsp;&nbsp;node = pick(frontier)   # ← 탐색 전략은 여기만 다르다<br>&nbsp;&nbsp;if goal(node): return node<br>&nbsp;&nbsp;for a in ACTIONS(node.state):<br>&nbsp;&nbsp;&nbsp;&nbsp;frontier.add(child(RESULT(node.state, a)))</div>BFS, DFS, UCS, A*는 모두 이 반복문이고, 다른 것은 오직 a) 단계 — <b>프런티어에서 무엇을 먼저 꺼내느냐</b>입니다. 그것을 정하는 규칙이 <b>탐색 전략(search strategy)</b>입니다.", "e": "맛집 탐방: '가 볼 곳 목록'(프런티어)에서 하나를 골라(전략) 가 본다 → 인생 맛집이면 끝(목표 검사) → 아니면 그 가게 사장님이 추천한 가게들을 목록에 추가(확장) → 반복. 목록이 비면 포기."}, {"s": "3-2", "im": ["3-2-10", "3-2-11", "3-2-12"], "en": "Example: Travelling in Romania (1)–(3)", "ko": "예시: 루마니아 여행 (1)–(3)", "key": 1, "o": [["(1) The frontier holds Arad alone / Nothing has been expanded yet / The dashed nodes below do not exist now. They are only drawn to show where children will go.", "(1) 프런티어에는 아라드만 있다 / 아직 아무것도 확장되지 않았다 / 아래의 점선 노드들은 지금은 존재하지 않는다. 자식들이 어디에 생길지 보여 주려고 그린 것일 뿐이다."], ["(2) Expand Arad / Its three children (Sibiu, Timisoara, Zerind) are generated and join the frontier / Arad leaves the frontier", "(2) 아라드를 확장한다 / 세 자식(시비우, 티미쇼아라, 제린드)이 생성되어 프런티어에 합류한다 / 아라드는 프런티어를 떠난다"], ["(3) Expand Sibiu / Arad has reappeared one level down (the same state) reached by a different path. That is a cycle. / We could just as well have expanded Timisoara or Zerind instead", "(3) 시비우를 확장한다 / 아라드가 한 단계 아래에 다시 나타났다 (같은 상태) — 다른 경로로 도달한 것이다. 그것은 사이클이다. / 티미쇼아라나 제린드를 대신 확장했어도 똑같이 괜찮았다"]], "x": "09쪽의 반복문을 루마니아 지도에서 세 단계만 돌려 본 것입니다. 위쪽이 탐색 트리, 아래쪽이 상태 공간 그래프(지도)이고, 빨간 점선 상자가 프런티어입니다.<div class='tw'><table><tr><th>단계</th><th>확장한 노드</th><th>프런티어</th></tr><tr><td>(1)</td><td>—</td><td>{Arad}</td></tr><tr><td>(2)</td><td>Arad</td><td>{Sibiu, Timisoara, Zerind}</td></tr><tr><td>(3)</td><td>Sibiu</td><td>{Timisoara, Zerind, <u>Arad</u>, Fagaras, Oradea, Rimnicu Vilcea}</td></tr></table></div>눈여겨볼 점:<ul><li>(1)의 <b>점선 노드는 아직 없습니다</b>. 트리는 '진행하면서' 만들어집니다(06쪽). 지도 위 주황 화살표는 결국 찾게 될 최적 경로(Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest)를 미리 보여 준 것입니다.</li><li>(2) 확장한 노드는 프런티어를 떠나고 자식들이 들어옵니다. 지도의 빨간 원이 프런티어의 도시들입니다.</li><li>(3) Sibiu의 자식 중 <u>Arad</u>가 다시 나왔습니다 — Arad → Sibiu → Arad, 같은 상태를 다른 경로로 도달한 <b>사이클</b>입니다. 사이클 검사를 하면 이 노드는 넣지 않습니다.</li><li>\"Timisoara나 Zerind를 확장해도 됐다\": 프런티어의 셋 중 <b>무엇을 먼저 꺼낼지</b>는 탐색 전략이 정합니다. 여기서는 그냥 Sibiu를 골랐을 뿐입니다.</li></ul>", "e": "(3) 다음 단계를 직접 해 보기: 전략이 '프런티어에서 가장 먼저 들어온 것'이면(BFS) Timisoara를 확장 → 자식 Arad(사이클), Lugoj. '가장 싼 경로 비용'이면(UCS) Zerind(75)를 확장. 전략에 따라 트리가 다르게 자랍니다.", "pg": [[1, 1], [1, 1], [1, 1]]}, {"s": "3-2", "im": ["3-2-13"], "en": "Search Strategies: Properties", "ko": "탐색 전략: 성질", "key": 1, "o": [["A <b>search strategy</b> decides the order in which nodes are expanded", "<b>탐색 전략</b>은 노드가 확장되는 순서를 정한다"], ["Strategies are evaluated along four dimensions: <b>Completeness</b> – does it always find a solution when one exists? / <b>Cost optimality</b> – does it always find the lowest-cost solution? / <b>Time complexity</b> – how long does it take? / <b>Space complexity</b> – how much memory does it need?", "전략은 네 가지 차원으로 평가된다: <b>완전성</b> — 해가 존재할 때 항상 찾아내는가? / <b>비용 최적성</b> — 항상 가장 비용이 낮은 해를 찾는가? / <b>시간 복잡도</b> — 얼마나 오래 걸리는가? / <b>공간 복잡도</b> — 메모리가 얼마나 필요한가?"], ["We will discuss several strategies and compare them on these four", "여러 전략을 다루고, 이 네 가지로 비교할 것이다"]], "x": "탐색 전략 = 프런티어에서 다음에 꺼낼 노드를 정하는 규칙(09쪽의 a단계). 전략마다 성능이 다르고, 그것을 재는 자가 <b>네 가지</b>입니다.<ul><li><b>완전성(completeness)</b>: 해가 있으면 반드시 찾는가? (찾다가 무한 루프에 빠지면 불완전)</li><li><b>비용 최적성(cost optimality)</b>: 찾은 해가 가장 싼 해인가? (아무 해나 찾는 것과 다름)</li><li><b>시간 복잡도</b>: 노드를 몇 개나 만들어 보는가?</li><li><b>공간 복잡도</b>: 노드를 몇 개나 동시에 기억해야 하는가?</li></ul>시간·공간은 보통 b, d, m(21쪽)을 써서 O(b<sup>d</sup>), O(bm) 같은 식으로 나타냅니다. 3-3·3-4에서 알고리즘마다 이 네 칸을 채우게 되고, 시험 단골 문제가 \"OO 탐색은 완전한가? 최적인가? 시간·공간 복잡도는?\"입니다.", "e": "잃어버린 열쇠 찾기: 방을 전부 뒤지면 반드시 찾음(완전). 가까운 곳부터 뒤지면 가장 가까운 열쇠를 먼저 찾음(최적). 뒤진 곳 수가 시간, 동시에 '여기는 봤다'고 기억하는 곳 수가 공간."}, {"s": "3-2", "im": ["3-2-14"], "en": "3. Search Space", "ko": "3. 탐색 공간 (개요)", "o": [["How large is the thing we are searching, and how would we know?", "우리가 탐색하는 대상은 얼마나 크며, 그것을 어떻게 알 수 있는가?"], ["b, m and d — branching factor, maximum depth, depth of the optimal solution / Counting the state space by multiplying out its independent parts / Counting the search tree instead, which is the number that governs cost", "b, m, d — 분기 계수, 최대 깊이, 최적 해의 깊이 / 독립된 부분들을 곱해서 상태 공간을 세기 / 대신 탐색 트리를 세기 — 이것이 비용을 좌우하는 숫자"], ["The same four problems measured twice: maze, 8-queens, 8-puzzle, tic-tac-toe / Memory runs out well before time does", "같은 네 문제를 두 번 측정: 미로, 8-퀸, 8-퍼즐, 틱택토 / 메모리는 시간보다 훨씬 먼저 바닥난다"]], "x": "3절 '탐색 공간'의 개요입니다. 질문: 우리가 뒤지는 공간은 얼마나 큰가, 그것을 어떻게 추정하나? 두 가지 방법을 배웁니다. ① <b>상태 공간의 크기</b>를 변수별 경우의 수를 곱해서 세기(17~20쪽). ② <b>탐색 트리의 크기</b>를 b, m, d로 추정하기(21~24쪽) — 실제 비용을 좌우하는 것은 이쪽입니다. 같은 네 문제(미로, 8-퀸, 8-퍼즐, 틱택토)를 두 방법으로 재 봅니다(19쪽, 23쪽).<br>마지막 줄 \"메모리는 시간보다 훨씬 먼저 바닥난다\": 노드를 전부 저장하는 방식은 몇 시간 기다리는 것은 참을 수 있어도, 메모리를 수십 GB 먼저 다 써 버려서 돌아가지 못합니다. (보충: b = 10, 초당 100만 노드, 노드당 1KB라고 하면 깊이 10에서 시간은 3시간 미만이지만 메모리는 약 10TB.) 그래서 3-3에서 공간 복잡도가 시간 못지않게 중요합니다."}, {"s": "3-2", "im": ["3-2-15"], "en": "Search Space: Time and Space Complexity", "ko": "탐색 공간: 시간·공간 복잡도", "o": [["Both depend on the number n of tree nodes searched before the goal is found. <b>O(n)</b>", "둘 다 목표를 찾기 전까지 탐색한 트리 노드의 수 n에 달려 있다. <b>O(n)</b>"], ["Estimate the size of the reachable state space. The larger it is, the harder the search. / Or estimate the number of searched tree nodes directly", "도달 가능한 상태 공간의 크기를 추정한다. 클수록 탐색이 어렵다. / 또는 탐색한 트리 노드의 수를 직접 추정한다"], ["Estimating complexity tells us: How hard is this problem? / Which algorithm will fit in memory? / Can we find a solution fast enough? / Can we find the optimal solution, or must we use a heuristic?", "복잡도를 추정하면 알 수 있다: 이 문제는 얼마나 어려운가? / 어떤 알고리즘이 메모리에 들어가는가? / 충분히 빨리 해를 찾을 수 있는가? / 최적 해를 찾을 수 있는가, 아니면 휴리스틱을 써야 하는가?"]], "x": "시간과 공간 복잡도는 둘 다 결국 \"목표를 찾을 때까지 <b>노드를 몇 개 만들었나(n)</b>\"에 달려 있습니다. 노드 하나를 만들고 검사하는 비용은 거의 일정하니, 전체 비용은 n에 비례 → <b>O(n)</b>. 그래서 \"복잡도 추정 = n 추정\"이고, n을 추정하는 방법이 두 가지(상태 공간 크기 / 트리 노드 수)입니다. 추정하면 네 가지를 미리 알 수 있습니다: 문제가 얼마나 어려운지, 어떤 알고리즘이 메모리에 들어가는지, 제시간에 풀리는지, 그리고 <b>최적 해를 정확히 찾을 수 있는지 아니면 휴리스틱을 써야 하는지</b>. 여기서 <b>휴리스틱(heuristic)</b>은 '정답 보장은 없지만 빠르게 좋은 답을 찾게 돕는 경험적 규칙'으로, 3-4의 주제입니다.", "e": "8-퍼즐(약 18만 상태)은 전부 뒤져도 금방이라 최적 해를 찾을 수 있습니다. 24-퍼즐(약 10<sup>25</sup>)은 전부 뒤지는 것이 불가능해서 휴리스틱이 필요합니다. 상태 수를 세 보면 이런 판단이 미리 됩니다."}, {"s": "3-2", "im": ["3-2-16"], "en": "Search Space: Big-O Notation", "ko": "탐색 공간: 빅오 표기법", "key": 1, "o": [["As the input grows, the highest-order term dominates and the rest stop mattering", "입력이 커지면 최고차항이 지배하고 나머지는 중요하지 않게 된다"], ["Example: T(n) = n² + n + 1 — n = 1: T = 1 + 1 + 1 = 3 (n² is <b>33.3%</b>) / n = 10: T = 100 + 10 + 1 = 111 (90%) / n = 100: T = 10,000 + 100 + 1 = 10,101 (99%) / n = 1,000: T = 1,000,000 + 1,000 + 1 = 1,001,001 (<b>99.9%</b>)", "예: T(n) = n² + n + 1 — n = 1: T = 1 + 1 + 1 = 3 (n²이 <b>33.3%</b>) / n = 10: T = 100 + 10 + 1 = 111 (90%) / n = 100: T = 10,000 + 100 + 1 = 10,101 (99%) / n = 1,000: T = 1,000,000 + 1,000 + 1 = 1,001,001 (<b>99.9%</b>)"], ["⇒ O(T(n)) = O(n² + n + 1) = O(n²)", "⇒ O(T(n)) = O(n² + n + 1) = O(n²)"]], "x": "복잡도를 적는 표기법 <b>빅오(Big-O)</b>입니다. 규칙은 하나: 입력 n이 커지면 <b>가장 빨리 자라는 항(최고차항)</b>만 남기고, 계수와 나머지 항은 버린다. 예시의 T(n) = n² + n + 1에서 괄호 속 %는 전체 중 n²이 차지하는 비율입니다. n = 1일 때는 33.3%뿐이지만 n = 1,000이면 99.9% — 큰 문제에서는 n² 말고는 거의 의미가 없으니 <b>O(n²)</b>이라고 씁니다. 빨간색으로 강조된 33.3%와 99.9%가 \"작을 땐 차이가 커 보여도 커지면 최고차항이 전부\"라는 메시지입니다.<br>탐색에서 쓰는 모습: 트리의 노드 수 1 + b + b² + … + b<sup>m</sup>에서 가장 큰 항 b<sup>m</sup>만 남겨 <b>O(b<sup>m</sup>)</b>이라고 씁니다(24쪽). 상수 배는 무시하므로 O(2n²)도 그냥 O(n²)입니다.", "e": "n명이 모두 서로 악수하는 횟수: n(n − 1)/2 = 0.5n² − 0.5n → O(n²). 인원이 2배가 되면 악수는 약 4배. 10명이면 45번, 100명이면 4,950번."}, {"s": "3-2", "im": ["3-2-17"], "en": "Search Space: Estimating the State-Space Size", "ko": "탐색 공간: 상태 공간 크기 추정하기", "key": 1, "o": [["<b>The state space</b> is the set of different states the agent and its environment can be in", "<b>상태 공간</b>은 에이전트와 환경이 있을 수 있는 서로 다른 상태들의 집합이다"], ["<b>Reachable states</b> are defined by the initial state and the transition model: only those matter for search", "<b>도달 가능한 상태</b>는 초기 상태와 전이 모델로 정해진다: 탐색에는 그것들만 중요하다"], ["Even when the algorithm treats states as atomic, we can use a factored representation internally to estimate the size.", "알고리즘이 상태를 원자적으로 다루더라도, 크기를 추정할 때는 내부적으로 요인적 표현을 쓸 수 있다."], ["With l fluents (variables) in the factored representation: n = |X<sub>1</sub>| × |X<sub>2</sub>| × ⋯ × |X<sub>l</sub>| — where |·| is the number of values that variable can take", "요인적 표현에 플루언트(변수)가 l개 있을 때: n = |X<sub>1</sub>| × |X<sub>2</sub>| × ⋯ × |X<sub>l</sub>| — 여기서 |·|는 그 변수가 가질 수 있는 값의 개수"]], "x": "n을 추정하는 첫 번째 방법, <b>상태 공간의 크기 세기</b>입니다. 알고리즘은 상태를 원자적(이름표)으로 다루지만, 크기를 셀 때는 2-3 09쪽의 <b>요인적 표현</b>(변수들의 목록)으로 바꿔 생각하면 쉽습니다. 상태가 변수 X₁, X₂, …, X<sub>l</sub>로 이루어지고 변수들이 서로 독립이면:<div class='formula'>n = |X<sub>1</sub>| × |X<sub>2</sub>| × ⋯ × |X<sub>l</sub>|</div>|X<sub>i</sub>|는 변수 X<sub>i</sub>가 가질 수 있는 값의 개수입니다. 즉 <b>각 변수의 경우의 수를 모두 곱하면</b> 됩니다(곱의 법칙). 그림: (a) 원자적으로 보면 B, C 두 상태가 '다르다'는 것만 알지만, (b) 요인적으로 보면 x₁, x₂, … 변수들의 값이 보여서 셀 수 있습니다.<br>주의: 곱셈 결과는 '이론상 가능한' 개수이고, 실제로 초기 상태에서 전이 모델로 <b>도달 가능한(reachable)</b> 상태는 더 적을 수 있습니다(8-퍼즐은 정확히 절반). 탐색에는 도달 가능한 것만 중요하므로, 곱셈은 상한(upper bound)입니다.", "e": "자물쇠: 다이얼 4개 × 각 0~9 = 10 × 10 × 10 × 10 = 10<sup>4</sup>가지. 신호등 2개 × 각 {빨, 노, 초} = 9가지 — 하지만 '둘 다 초록'은 실제로는 일어나지 않으니 도달 가능한 상태는 9보다 적습니다."}, {"s": "3-2", "im": ["3-2-18"], "en": "Example: State-Space Size?", "ko": "예시: 상태 공간 크기는?", "key": 1, "o": [["1. Dirt — A and B are different rooms; order does not matter / Dirt can be in either room, clean or dirty: 2 choices each — <b>r<sup>n</sup> = 2²</b> where r is the room conditions and n is the number of rooms", "1. 먼지 — A와 B는 서로 다른 방이고, 순서는 상관없다 / 먼지는 어느 방에나 있을 수 있고, 각 방은 깨끗하거나 더럽다: 방마다 2가지 — <b>r<sup>n</sup> = 2²</b>, 여기서 r은 방의 상태 가짓수, n은 방의 개수"], ["2. Robot location — The robot is in one of the 2 rooms → 2", "2. 로봇 위치 — 로봇은 2개 방 중 하나에 있다 → 2"], ["3. Total: <b>N<sub>state</sub> = 2 × 2² = 2³ = 8</b>", "3. 합계: <b>N<sub>state</sub> = 2 × 2² = 2³ = 8</b>"]], "x": "17쪽의 곱셈 공식을 진공청소기 세계에 적용한 것입니다. 변수는 세 개(A의 먼지, B의 먼지, 로봇 위치)이고 각각 값이 2가지입니다.<ul><li><b>먼지</b>: 방이 n = 2개, 각 방의 상태가 r = 2가지(깨끗/더러움) → r<sup>n</sup> = 2² = 4가지. \"순서는 상관없다\"는 A가 더럽고 B가 깨끗한 것과 그 반대가 서로 다른 상태라는 뜻(방이 구별되므로 그냥 각각 2가지씩 곱함).</li><li><b>로봇 위치</b>: 2가지.</li><li><b>합계</b>: 2 × 2² = 2³ = <b>8</b>. 3-1 16쪽의 8개 상태와 일치합니다.</li></ul>오른쪽 그림의 번호: 홀수(1, 3, 5, 7)는 로봇이 왼쪽 방, 짝수(2, 4, 6, 8)는 오른쪽 방이고, 7·8번이 둘 다 깨끗한 목표 상태입니다.<div class='warn'>기호 주의: 여기서 n은 '방의 개수'이고, 15쪽의 n은 '탐색한 노드 수'입니다. 같은 글자가 다른 뜻으로 쓰였습니다.</div>", "e": "방이 k개라면 위치 k × 먼지 2<sup>k</sup> = k × 2<sup>k</sup>: 방 3개 → 3 × 8 = 24, 방 10개 → 10 × 1,024 = 10,240. 방이 하나 늘 때마다 상태 수가 2배 이상으로 커집니다."}, {"s": "3-2", "im": ["3-2-19"], "en": "Example: State-Space Size? (2)", "ko": "예시: 상태 공간 크기는? (2)", "key": 1, "o": [["The complexity of a search problem can be estimated by computing a rough upper limit.", "탐색 문제의 복잡도는 대략적인 상한을 계산해서 추정할 수 있다."], ["Maze: The positions the agent can occupy — n = number of grid cells the agent can be in / 8-queens problem: Place 8 queens on 64 (8×8) squares — n = C(64, 8) ≈ 4.4 × 10<sup>9</sup>", "미로: 에이전트가 있을 수 있는 위치들 — n = 에이전트가 있을 수 있는 격자 칸의 수 / 8-퀸 문제: 64칸(8×8)에 퀸 8개를 놓는다 — n = C(64, 8) ≈ 4.4 × 10<sup>9</sup>"], ["8-puzzle problem: Arrange the 8 tiles in order — 9 cells to fill, blank included, so n ≤ 9! / Half are unreachable: n = 9! / 2 = 181,440 / Tic-tac-toe: Possible board states — n < 3<sup>9</sup> = 19,683", "8-퍼즐 문제: 타일 8개를 순서대로 배열한다 — 빈칸 포함 9칸을 채우므로 n ≤ 9! / 절반은 도달 불가: n = 9! / 2 = 181,440 / 틱택토: 가능한 판의 상태 — n < 3<sup>9</sup> = 19,683"]], "x": "네 문제의 상태 공간 크기를 '대략적인 상한'으로 추정합니다. 정확히 세기 어려울 때는 \"아무리 많아도 이 이하\"를 구하면 충분합니다.<div class='tw'><table><tr><th>문제</th><th>세는 법</th><th>n</th></tr><tr><td>미로</td><td>로봇이 있을 수 있는 칸 수</td><td>격자 칸 수 (벽 제외)</td></tr><tr><td>8-퀸</td><td>64칸 중 퀸을 놓을 8칸 고르기 = 조합 C(64, 8)</td><td>≈ 4.4 × 10<sup>9</sup></td></tr><tr><td>8-퍼즐</td><td>9칸의 배열 9!, 그중 절반만 도달 가능</td><td>9!/2 = 181,440</td></tr><tr><td>틱택토</td><td>칸 9개 × 각 {X, O, 빈칸}</td><td>< 3<sup>9</sup> = 19,683</td></tr></table></div>'≤', '<'가 붙는 이유: 8-퀸의 C(64, 8)은 \"퀸끼리 서로 공격하지 않아야 한다\"는 조건을 무시한 값이라 실제 유효한 배치는 훨씬 적습니다. 틱택토의 3<sup>9</sup>도 \"X가 O보다 3개 많은 판\"처럼 실제 게임에서 나올 수 없는 판까지 센 것입니다. 상한이지만 \"18만 개면 전부 뒤질 수 있다\", \"44억이면 어렵다\" 같은 판단에는 충분합니다. (보충: 실제 가능한 틱택토 판은 5,478개, 8-퀸의 해는 92개입니다.)", "e": "C(64, 8) 계산: 64 × 63 × … × 57 ÷ 8! = 4,426,165,368. 조합을 쓰는 이유는 퀸 8개가 서로 구별되지 않아서(어느 퀸이 어느 칸에 있든 같은 배치) 순서를 빼기 때문입니다."}, {"s": "3-2", "im": ["3-2-20"], "en": "Example: State-Space Size in Pac-Man", "ko": "예시: 팩맨의 상태 공간 크기", "key": 1, "o": [["World state: agent position on a 12x10 grid. / Status of <b>30 dots (eaten or not)</b>, two ghosts each on a <b>12x1</b> corridor, and the agent's direction (NSEW).", "세계 상태: 12×10 격자 위의 에이전트 위치. / <b>점 30개의 상태(먹었는지 아닌지)</b>, 각각 <b>12×1</b> 통로에 있는 유령 두 마리, 그리고 에이전트의 방향(동서남북)."], ["How many world states? 120 × 2<sup>30</sup> × 12² × 4 = 74,217,034,874,880", "세계 상태는 몇 개? 120 × 2<sup>30</sup> × 12² × 4 = 74,217,034,874,880"], ["How many states for pathing? 120 / How many states for eat-all-dots? 120 × 2<sup>30</sup>", "경로 찾기의 상태는 몇 개? 120 / 모든 점 먹기의 상태는 몇 개? 120 × 2<sup>30</sup>"]], "x": "CS188의 팩맨 예제로 곱셈 공식과 추상화(3-1 14쪽)를 함께 봅니다. 세계 상태를 이루는 변수와 값의 개수:<div class='tw'><table><tr><th>변수</th><th>값의 개수</th></tr><tr><td>팩맨 위치</td><td>12 × 10 = 120</td></tr><tr><td>점 30개 (각각 먹음/안 먹음)</td><td>2<sup>30</sup> ≈ 10.7억</td></tr><tr><td>유령 2마리 (각각 12칸 통로)</td><td>12 × 12 = 144</td></tr><tr><td>팩맨의 방향</td><td>4</td></tr></table></div>전부 곱하면 약 <b>74조</b>개입니다. 그런데 문제를 정하면 필요한 변수만 남습니다: 경로 찾기(목표: 특정 칸 도착)에는 위치만 필요 → <b>120</b>. 모든 점 먹기에는 위치 + 점 상태 → <b>120 × 2<sup>30</sup></b>. 유령과 방향은 두 문제 모두에서 계획에 불필요하므로 뺍니다. 이것이 추상화의 효과입니다 — 같은 게임인데 상태 수가 74조에서 120으로 줄었습니다.", "e": "계산 확인: 120 × 2<sup>30</sup> = 120 × 1,073,741,824 ≈ 1,288억. 여기에 144 × 4 = 576을 곱하면 약 74조. 점이 하나 늘면 전체가 2배가 됩니다."}, {"s": "3-2", "im": ["3-2-21"], "en": "Search Space: Estimating the Search-Tree Size", "ko": "탐색 공간: 탐색 트리 크기 추정하기", "key": 1, "o": [["Often <b>more useful</b> than estimating the state space / It matters especially where <b>redundant paths</b> let one state be represented by many nodes.", "상태 공간을 추정하는 것보다 <b>더 유용할</b> 때가 많다 / 특히 <b>중복 경로</b> 때문에 한 상태가 여러 노드로 나타나는 경우에 중요하다."], ["Estimated from the problem formulation — initial state, actions, transition function", "문제 정의 — 초기 상태, 행동, 전이 함수 — 로부터 추정한다"], ["The metrics we use: <b>b</b> — maximum branching factor = the largest number of possible actions / <b>m</b> — maximum tree depth = the length of the longest path once cycles are removed / <b>d</b> — depth of the optimal solution = the shortest path length from the initial state to a goal", "우리가 쓰는 측정값: <b>b</b> — 최대 분기 계수 = 가능한 행동의 최대 개수 / <b>m</b> — 최대 트리 깊이 = 사이클을 제거한 뒤 가장 긴 경로의 길이 / <b>d</b> — 최적 해의 깊이 = 초기 상태에서 목표까지 가장 짧은 경로의 길이"], ["The number of searched nodes is n = f(b, m, d) ⇒ O(f(b, m, d))", "탐색한 노드의 수는 n = f(b, m, d) ⇒ O(f(b, m, d))"]], "x": "n을 추정하는 두 번째 방법, <b>탐색 트리의 크기</b>입니다. 탐색 비용을 정하는 것은 \"상태가 몇 개냐\"가 아니라 \"<b>트리 노드를 몇 개 만드느냐</b>\"이고, 중복 경로 때문에 같은 상태가 여러 노드로 나타나면 둘은 크게 달라집니다. 그래서 이쪽이 더 유용합니다. 트리 크기를 정하는 세 숫자(시험 필수):<div class='tw'><table><tr><th>기호</th><th>이름</th><th>뜻</th><th>쉽게 말하면</th></tr><tr><td><b>b</b></td><td>분기 계수 (branching factor)</td><td>한 노드에서 뻗는 자식의 최대 개수 = 가능한 행동의 최대 개수</td><td>갈림길에서 길이 몇 갈래?</td></tr><tr><td><b>m</b></td><td>최대 깊이 (maximum depth)</td><td>사이클을 없앤 뒤 가장 긴 경로의 길이</td><td>트리가 최대 얼마나 깊은가?</td></tr><tr><td><b>d</b></td><td>최적 해의 깊이 (depth of the optimal solution)</td><td>초기 상태에서 가장 가까운 목표까지의 길이</td><td>답이 얼마나 얕은 곳에 있나?</td></tr></table></div>항상 <b>d ≤ m</b>입니다(가장 얕은 목표가 가장 긴 경로보다 깊을 수는 없으니). 탐색한 노드 수는 이 셋의 함수 n = f(b, m, d)이고, 다음 강의(3-3)에서 BFS는 d에, DFS는 m에 비용이 좌우된다는 것을 배웁니다.", "e": "전화 연락망: 한 사람이 3명에게 연락(b = 3), 연락망의 최대 단계 5(m = 5), 찾는 친구는 2단계 안에 있음(d = 2). 가까운 단계부터 찾으면 1 + 3 + 9 = 13명 안에서 끝납니다."}, {"s": "3-2", "im": ["3-2-22"], "en": "Search Space: Reading b, m and d Off a Graph", "ko": "탐색 공간: 그래프에서 b, m, d 읽어내기", "key": 1, "o": [["b — maximum branching factor = largest number of actions (L, R, S) → <b>3</b>", "b — 최대 분기 계수 = 행동의 최대 개수 (L, R, S) → <b>3</b>"], ["m — maximum tree depth = longest path with cycles removed → <b>5</b>", "m — 최대 트리 깊이 = 사이클을 제거한 가장 긴 경로 → <b>5</b>"], ["d — depth of the optimal solution = shortest path from the initial state to a goal → <b>3</b>", "d — 최적 해의 깊이 = 초기 상태에서 목표까지의 최단 경로 → <b>3</b>"], ["Duplicate edges are dropped to turn the transition-model graph into a tree. / <b>✕: You must remove the cycles before you can count m.</b>", "전이 모델 그래프를 트리로 바꾸기 위해 중복 간선을 없앤다. / <b>✕: m을 세려면 먼저 사이클을 제거해야 한다.</b>"]], "x": "진공청소기 세계에서 b, m, d를 직접 읽어 봅니다(초기 상태 = 왼쪽 위, 둘 다 더러움).<ul><li><b>b = 3</b>: 어느 상태에서든 행동은 L, R, S 세 가지가 최대.</li><li><b>d = 3</b>: 초기 상태에서 목표(둘 다 깨끗)까지 가장 짧은 경로는 S → R → S의 3단계.</li><li><b>m = 5</b>: 사이클을 지운 뒤 가장 긴 경로. 그림의 빨간 ✕가 지운 사이클들(자기 자신으로 돌아오는 고리와 L↔R 왕복)입니다. 가장 긴 경로의 예: [A, 둘 다 더러움] –R→ [B, 둘 다 더러움] –S→ [B, A만 더러움] –L→ [A, A만 더러움] –S→ [A, 깨끗] –R→ [B, 깨끗]. 먼지는 줄기만 하고 늘지 않으므로, 사이클 없이 방문할 수 있는 상태는 최대 6개 = 간선 5개 → m = 5.</li></ul>마지막 줄(강조)이 핵심입니다: <b>사이클을 안 지우면 m = ∞</b>입니다. L, L, L, … 또는 L, R, L, R, …을 끝없이 할 수 있으니까요. 그래서 m을 세기 전에 반드시 사이클부터 제거해야 합니다.", "e": "d는 쉽지만 m은 헷갈립니다. 확인법: 상태를 두 번 지나지 않으면서 가장 많은 상태를 지나는 경로를 찾으면, 그 경로의 간선 수가 m입니다. 청소기는 상태 8개 중 먼지가 늘어나는 방향으로는 못 가므로 최대 6개만 한 번에 지날 수 있습니다."}, {"s": "3-2", "im": ["3-2-23"], "en": "Example: Search Complexity", "ko": "예시: 탐색 복잡도", "key": 1, "o": [["b: maximum branching factor · m: maximum depth of tree · d: depth of the optimal solution", "b: 최대 분기 계수 · m: 트리의 최대 깊이 · d: 최적 해의 깊이"], ["Maze: b = 4 actions / m = longest path to the goal (bounded by the x × y grid) / d = shortest path to the goal (same bound)", "미로: b = 행동 4개 / m = 목표까지 가장 긴 경로 (x × y 격자로 제한됨) / d = 목표까지 가장 짧은 경로 (같은 제한)"], ["8-queens problem: b = 8, eight rows in a column / m = 8, there are eight columns / d = 8, one queen placed per column", "8-퀸 문제: b = 8, 한 열에 8개 행 / m = 8, 열이 8개 있다 / d = 8, 열마다 퀸을 하나씩 놓는다"], ["8-puzzle problem: b = move the blank tile in 4 directions / m = try all, O(9!/2) / d ≤ 31", "8-퍼즐 문제: b = 빈칸을 4방향으로 이동 / m = 전부 시도, O(9!/2) / d ≤ 31"], ["Tic-tac-toe: b = 9 actions / m = 9 / d = 5 (xoxox → x player get straight)", "틱택토: b = 행동 9개 / m = 9 / d = 5 (X, O, X, O, X → X가 한 줄을 완성)"]], "x": "19쪽의 네 문제를 이번에는 b, m, d로 다시 잽니다.<div class='tw'><table><tr><th>문제</th><th>b</th><th>m</th><th>d</th></tr><tr><td>미로</td><td>4 (N, E, S, W)</td><td>≤ 칸 수 (x × y)</td><td>≤ 칸 수</td></tr><tr><td>8-퀸</td><td>8 (한 열의 8행 중 선택)</td><td>8 (열이 8개)</td><td>8 (열마다 하나씩 놓으면 끝)</td></tr><tr><td>8-퍼즐</td><td>4 (빈칸 4방향)</td><td>O(9!/2) (모든 상태를 한 번씩)</td><td>≤ 31</td></tr><tr><td>틱택토</td><td>9 (빈칸 9개 중 선택)</td><td>9 (칸이 다 차면 끝)</td><td>5 (X, O, X, O, X 다섯 수면 X가 한 줄 가능)</td></tr></table></div>비교해서 볼 점: 8-퀸은 <b>d = m = 8</b> — 퀸을 열마다 하나씩 놓는 문제라 해가 항상 맨 아래 깊이에 있습니다. 틱택토는 <b>d = 5 < m = 9</b> — 다섯 수 만에 끝날 수도, 아홉 수까지 갈 수도 있어 목표가 여러 깊이에 있습니다. 이 차이가 다음 슬라이드의 \"빨간 목표 노드가 여러 깊이에 있다\"로 이어지고, 3-3에서 BFS(d에 좌우)와 DFS(m에 좌우)의 차이를 만듭니다. 8-퍼즐의 d ≤ 31은 \"어떤 시작 상태든 31수 안에 풀린다\"는 알려진 결과이고, b는 빈칸 위치에 따라 2~4이므로 최대인 4를 씁니다.", "e": "틱택토의 b는 정확히는 첫 수 9, 둘째 수 8, … 로 줄어들지만 b는 '최대'이므로 9입니다. 미로에서 벽 때문에 어떤 칸은 갈 수 있는 방향이 2개뿐이어도 b = 4로 씁니다."}, {"s": "3-2", "im": ["3-2-24"], "en": "How Many Nodes Are in the Whole Tree?", "ko": "전체 트리에는 노드가 몇 개인가?", "key": 1, "o": [["b is the branching factor and m the maximum depth — the same two just measured", "b는 분기 계수이고 m은 최대 깊이다 — 방금 잰 그 두 값"], ["Each tier holds b times as many nodes as the one above it: 1, b, b², …, b<sup>m</sup> — 1 node · b nodes · b² nodes · m tiers · b<sup>m</sup> nodes", "각 층은 바로 위층보다 b배 많은 노드를 갖는다: 1, b, b², …, b<sup>m</sup> — 1개 · b개 · b²개 · m개 층 · b<sup>m</sup>개"], ["<b>1 + b + b² + ⋯ + b<sup>m</sup> = O(b<sup>m</sup>)</b>: The whole tree costs about what its bottom row costs.", "<b>1 + b + b² + ⋯ + b<sup>m</sup> = O(b<sup>m</sup>)</b>: 트리 전체의 비용은 맨 아래 줄의 비용과 거의 같다."], ["The red nodes are goals, and they sit at various depths — which is exactly why d and m are two different numbers", "빨간 노드는 목표이고, 여러 깊이에 흩어져 있다 — 바로 그래서 d와 m은 서로 다른 두 수다"], ["Every time and space bound in Part II (the next lecture) is a piece of this sum.", "파트 II(다음 강의)의 모든 시간·공간 상한은 이 합의 일부분이다."]], "x": "3-2의 결론, 트리 전체의 노드 수입니다. 그림의 삼각형이 탐색 트리입니다. 맨 위 층에 노드 1개, 그 아래 층은 각 노드가 b개씩 자식을 가지니 b개, 그 아래는 b²개, … m층까지 내려가면 맨 아래 층에 b<sup>m</sup>개. 전부 더하면:<div class='formula'>1 + b + b² + ⋯ + b<sup>m</sup> = O(b<sup>m</sup>)</div>빅오로는 가장 큰 항 b<sup>m</sup>만 남습니다(16쪽). 직관적으로: b ≥ 2이면 마지막 층이 너무 커서 <b>윗층을 전부 합쳐도 마지막 층 하나보다 작습니다</b>. 그래서 \"트리 전체 비용 ≈ 맨 아래 줄 비용\"입니다.<br>빨간 노드(목표)가 여러 깊이에 있다는 점을 보세요. 가장 얕은 목표의 깊이가 <b>d</b>, 트리의 바닥이 <b>m</b>입니다. 다음 강의 3-3의 모든 복잡도가 이 합의 일부입니다: 층 단위로 훑어서 깊이 d에서 멈추면(BFS) 1 + b + … + b<sup>d</sup> = <b>O(b<sup>d</sup>)</b>, 맨 아래까지 파고들면(DFS) <b>O(b<sup>m</sup>)</b>.", "e": "b = 10, m = 3: 1 + 10 + 100 + 1,000 = 1,111개인데 맨 아래 층 1,000개가 90%입니다. b = 10, m = 6이면 1,111,111개로 맨 아래 층이 90%. (보충: 등비수열 합 공식으로 정확히는 (b<sup>m+1</sup> − 1)/(b − 1).)"}, {"s": "3-3", "im": ["3-3-01", "3-3-02"], "en": "Chapter 3 - Part II: Uninformed Search · 4. Uninformed Search", "ko": "3장 파트 II: 무정보 탐색", "key": 1, "o": [["Chapter 3 - Part II: Uninformed Search", "3장 파트 II: 무정보 탐색"], ["Search with nothing but the problem definition — no idea which way the goal lies", "문제 정의 말고는 아무것도 없이 하는 탐색 — 목표가 어느 쪽에 있는지 전혀 모른다"], ["Queue, stack and priority queue: the frontier rule is the strategy", "큐, 스택, 우선순위 큐: 프런티어 규칙이 곧 전략이다"], ["Breadth-first and uniform-cost — complete, optimal, and hungry for memory / Depth-first — linear space, and what that costs you / Iterative deepening: BFS guarantees at DFS memory", "너비 우선과 균일 비용 — 완전하고, 최적이고, 메모리를 많이 먹는다 / 깊이 우선 — 선형 공간, 그리고 그 대가 / 반복적 깊이 심화: DFS의 메모리로 BFS의 보장을"], ["All four scored on completeness, cost optimality, time and space", "네 알고리즘 모두 완전성, 비용 최적성, 시간, 공간으로 채점한다"]], "x": "파트 II, <b>무정보 탐색(uninformed search)</b>의 지도입니다. '무정보'란 목표가 어느 방향에 있는지 힌트가 전혀 없이, 3-1의 문제 정의(5요소)만으로 탐색한다는 뜻입니다. 네 알고리즘을 배우는데, 3-2 09쪽의 반복문은 똑같고 <b>프런티어에서 무엇을 먼저 꺼내느냐</b>만 다릅니다.<div class='tw'><table><tr><th>알고리즘</th><th>프런티어</th><th>먼저 꺼내는 것</th><th>한 줄 평</th></tr><tr><td>BFS (너비 우선)</td><td>큐</td><td>가장 얕은 노드</td><td>완전·최적(비용 같을 때), 메모리 많이 씀</td></tr><tr><td>UCS (균일 비용)</td><td>우선순위 큐</td><td>경로 비용이 가장 싼 노드</td><td>완전·최적, 메모리 많이 씀</td></tr><tr><td>DFS (깊이 우선)</td><td>스택</td><td>가장 깊은 노드</td><td>메모리 적음, 최적 보장 없음</td></tr><tr><td>IDS (반복적 깊이 심화)</td><td>스택 + 깊이 한계</td><td>DFS를 한계를 늘려 가며 반복</td><td>DFS의 메모리로 BFS의 보장</td></tr></table></div>넷 모두 3-2 13쪽의 네 기준(완전성, 비용 최적성, 시간, 공간)으로 채점하고, 복잡도는 b(분기 계수), d(가장 얕은 해의 깊이), m(최대 깊이)으로 씁니다.", "pg": [[1, 1], [1, 4]]}, {"s": "3-3", "im": ["3-3-03", "3-3-04"], "en": "Uninformed Search: The Queue · The Stack", "ko": "무정보 탐색: 큐 · 스택", "key": 1, "o": [["Queue: The data type where whatever went in first comes out first — First In, First Out (FIFO) — Examples: a queue of people, a bank ticket number", "큐: 먼저 들어간 것이 먼저 나오는 자료형 — 선입선출(FIFO) — 예: 줄 서 있는 사람들, 은행 번호표"], ["Stack: The data type where whatever went in last comes out first — Last In, First Out (LIFO) — In principle only the top item can be added or removed", "스택: 마지막에 들어간 것이 먼저 나오는 자료형 — 후입선출(LIFO) — 원칙적으로 맨 위의 항목만 넣거나 뺄 수 있다"]], "x": "프런티어를 담는 두 가지 자료구조입니다.<ul><li><b>큐(queue)</b>: 은행 창구의 줄처럼, 먼저 온 사람이 먼저 나갑니다(FIFO). 뒤로 들어가서 앞으로 나옵니다.</li><li><b>스택(stack)</b>: 쌓아 둔 접시처럼, 마지막에 올린 것을 먼저 꺼냅니다(LIFO). 맨 위에서만 넣고 뺍니다.</li></ul>탐색에서의 의미: 프런티어를 <b>큐</b>로 만들면 먼저 발견한(= 얕은) 노드부터 처리하므로, 깊이 1의 노드를 다 처리하기 전에는 깊이 2로 내려가지 않습니다 → 층 단위로 넓게 → <b>BFS</b>. 프런티어를 <b>스택</b>으로 만들면 가장 최근에 발견한(= 깊은) 노드부터 처리하므로, 한 갈래를 끝까지 파고들다 막히면 바로 위 형제로 돌아옵니다(<b>백트래킹</b>) → <b>DFS</b>.", "e": "A, B, C를 차례로 넣고(ADD) 하나 꺼내면(POP): 큐는 A, 스택은 C. 스택의 일상 예: 브라우저 '뒤로 가기', Ctrl+Z 실행 취소, 함수 호출 스택.", "pg": [[1, 1], [1, 1]]}, {"s": "3-3", "im": ["3-3-05"], "en": "Uninformed Search: Queue as an Abstract Data Type", "ko": "추상 자료형으로서의 큐", "o": [["Queue — FIFO: Take the oldest. Explores level by level → breadth-first search", "큐 — FIFO: 가장 오래된 것을 꺼낸다. 층 단위로 탐색 → 너비 우선 탐색"], ["Stack — LIFO: Take the newest. Dives down one branch → depth-first search", "스택 — LIFO: 가장 새로운 것을 꺼낸다. 한 가지를 따라 깊이 내려감 → 깊이 우선 탐색"], ["Insertion at the rear, deletion at the front. / The four operations — IS-EMPTY, POP, TOP, ADD — are the same whichever rule the frontier uses; only ADD changes.", "(큐는) 뒤에서 삽입, 앞에서 삭제. / 네 가지 연산 — IS-EMPTY, POP, TOP, ADD — 는 프런티어가 어떤 규칙을 쓰든 같다; ADD만 바뀐다."]], "x": "큐와 스택을 <b>추상 자료형(ADT, abstract data type)</b>으로 보는 슬라이드입니다. ADT란 \"무엇을 할 수 있는가(연산)\"만 약속하고 안이 어떻게 만들어졌는지는 숨기는 것입니다. 프런티어가 지원하는 연산은 네 개: <b>IS-EMPTY</b>(비었나?), <b>POP</b>(하나 꺼내기), <b>TOP</b>(다음에 나올 것 들여다보기), <b>ADD</b>(넣기). 큐든 스택이든 이 네 연산은 이름이 같고, 다른 것은 ADD가 어디에 넣느냐(그래서 POP이 무엇을 꺼내느냐)뿐입니다. 그래서 3-2 09쪽의 탐색 코드는 한 글자도 바꾸지 않고, 프런티어 객체만 큐 ↔ 스택으로 갈아 끼우면 BFS ↔ DFS가 됩니다. 27쪽 \"모든 전략은 하나의 알고리즘\"의 근거입니다.", "e": "파이썬: 큐는 deque의 popleft(), 스택은 list의 pop(). 탐색 코드에서 이 한 줄만 바꾸면 BFS가 DFS로 바뀝니다."}, {"s": "3-3", "im": ["3-3-06"], "en": "Uninformed Search Strategies", "ko": "무정보 탐색 전략", "key": 1, "o": [["The search algorithm (the planning agent) is given <b>no information about how close a state is to the goal</b>.", "탐색 알고리즘(계획하는 에이전트)에게는 <b>어떤 상태가 목표에 얼마나 가까운지에 대한 정보가 전혀 주어지지 않는다</b>."], ["It uses only the labels of the atomic states and the transition function / It searches blindly, following a simple strategy, until it reaches a goal state", "원자적 상태의 이름표와 전이 함수만 쓴다 / 단순한 전략을 따라 맹목적으로 탐색하다가, 목표 상태에 도달하면 멈춘다"], ["The strategies: Breadth-first strategy — BFS and Uniform-Cost Search (UCS) / Depth-first strategy — DFS and Iterative Deepening Search (IDS)", "전략들: 너비 우선 전략 — BFS와 균일 비용 탐색(UCS) / 깊이 우선 전략 — DFS와 반복적 깊이 심화 탐색(IDS)"]], "x": "'무정보'의 정확한 뜻: 알고리즘이 쓸 수 있는 것은 \"여기서 어디로 갈 수 있나\"(ACTIONS, RESULT)와 \"여기가 목표인가\"(IS-GOAL)뿐이고, <b>\"목표까지 얼마나 남았나\"는 전혀 모릅니다</b>. 상태는 이름표일 뿐이라 이름표를 봐도 거리를 알 수 없습니다. 그래서 맹목적으로(blindly), 정해진 단순한 순서대로 뒤지다가 목표를 만나면 멈춥니다. 네 알고리즘은 두 계열로 나뉩니다: 너비 우선 계열(BFS, UCS)은 가까운 곳부터 넓게, 깊이 우선 계열(DFS, IDS)은 한 방향으로 깊게. 3-4의 정보 탐색(informed search)은 여기에 \"목표까지 대략 이 정도 남았다\"는 힌트 h(n)을 더한 것입니다.", "e": "숨바꼭질: 무정보 = 아무 힌트 없이 방을 정해진 순서대로 뒤짐. 정보 탐색(3-4) = \"따뜻해~ 차가워~\" 힌트를 들으며 가까워 보이는 쪽부터 뒤짐."}, {"s": "3-3", "im": ["3-3-07", "3-3-08"], "en": "Uninformed Search: Breadth-First Search (BFS)", "ko": "너비 우선 탐색(BFS)", "key": 1, "o": [["Expansion rule: Expand the <b>shallowest</b> unexpanded node on the frontier.", "확장 규칙: 프런티어에서 가장 <b>얕은</b> 미확장 노드를 확장한다."], ["Frontier: known, not yet expanded. (<b>a FIFO queue</b>) — Search Tiers", "프런티어: 알려졌지만 아직 확장되지 않음. (<b>FIFO 큐</b>) — 탐색 층"]], "x": "<b>너비 우선 탐색(BFS)</b>입니다. 규칙은 하나: 프런티어에서 <b>가장 얕은</b> 노드를 꺼내 확장한다. 큐를 쓰면 저절로 그렇게 됩니다(먼저 발견한 노드가 더 얕으니까).<br>07쪽 그림: 로봇이 흙더미를 <b>한 층씩</b> 긁어냅니다. 윗층을 다 파기 전에는 아래층으로 내려가지 않으므로, 처음 발견하는 보석(목표)은 반드시 가장 얕은 곳의 보석입니다 — 이것이 BFS가 '가장 짧은 해'를 찾는 이유입니다.<br>08쪽 그림: 왼쪽 그래프를 S부터 펼친 탐색 트리이고, 색 띠(<b>Search Tiers</b>)가 깊이입니다. BFS는 빨강(S) → 주황(d, e, p) → 초록(b, c, e, h, r, q) → 파랑 → 보라 순서로, 한 띠를 다 처리한 뒤 다음 띠로 내려갑니다. 그래프의 상태 e는 하나지만 트리에는 주황 띠와 초록 띠에 각각 나오는 것(노드 = 경로)도 보세요. 목표 G는 보라 띠(깊이 4)에서 처음 나타납니다.", "e": "SNS 친구 찾기: 내 친구(1촌) 전부 → 친구의 친구(2촌) 전부 → … 순서로 찾으면, 목표 인물을 찾는 순간 '몇 촌인지'(최소 단계 수)를 자동으로 알게 됩니다. 이 그래프에서 BFS가 찾는 해: S → e → r → f → G (4단계).", "pg": [[1, 1], [1, 1]]}, {"s": "3-3", "im": ["3-3-09"], "en": "BFS — on a binary tree (Figure 3.8)", "ko": "BFS — 이진 트리에서의 진행 (그림 3.8)", "o": [["Expansion rule: Expand the shallowest unexpanded node on the frontier. / Frontier: the green nodes: known, not yet expanded. (a FIFO queue)", "확장 규칙: 프런티어에서 가장 얕은 미확장 노드를 확장한다. / 프런티어: 초록 노드들 — 알려졌지만 아직 확장 안 됨. (FIFO 큐)"], ["<b>Reached</b>: every node visited, which is what stops a state being visited twice", "<b>Reached(도달)</b>: 방문한 모든 노드 — 한 상태를 두 번 방문하는 것을 막아 주는 것"], ["Together they build the <b>full tree</b>, with every node holding the parent–child link that lets the solution path be recovered.", "둘이 함께 <b>전체 트리</b>를 만들며, 모든 노드가 부모–자식 연결을 갖고 있어 해 경로를 복원할 수 있다."], ["Figure 3.8 Breadth-first search on a simple binary tree. At each stage, the node to be expanded next is indicated by the triangular marker.", "그림 3.8 단순한 이진 트리에서의 너비 우선 탐색. 각 단계에서 다음에 확장할 노드가 삼각형 표시로 나타나 있다."]], "x": "교재 그림 3.8로 BFS를 한 단계씩 봅니다. 초록 = 프런티어, 보라 = 이미 확장됨, 삼각형 = 다음에 확장할 노드.<ol><li>프런티어 = {A}. A를 확장.</li><li>A의 자식 B, C가 프런티어에 들어옴(큐 뒤에). 삼각형이 B(먼저 들어온 것)를 가리킴.</li><li>B 확장 → D, E 추가. 프런티어 = {C, D, E}. 다음은 C(D, E보다 먼저 들어왔으니).</li><li>C 확장 → F, G 추가. 프런티어 = {D, E, F, G}. 깊이 1을 다 끝내고 이제 깊이 2.</li></ol>새 용어 <b>reached</b>: \"지금까지 본 적 있는 상태\"의 명단입니다. 자식을 만들었을 때 그 상태가 이미 reached에 있으면 프런티어에 넣지 않습니다. 이것이 3-2 04쪽의 사이클과 중복 경로를 모두 막아 주고, 그래서 그래프에 왕복 길이 있어도 BFS는 무한 반복에 빠지지 않습니다. 또 모든 노드가 부모를 기억하므로(3-2 06쪽의 PARENT), 목표를 찾으면 부모를 거슬러 올라가 경로를 복원할 수 있습니다.", "e": "경로 복원: 목표가 E라면 E의 부모 = B, B의 부모 = A → 거꾸로 뒤집으면 A → B → E가 해입니다."}, {"s": "3-3", "im": ["3-3-10"], "en": "Implementation: Breadth-First Search", "ko": "구현: 너비 우선 탐색", "key": 1, "o": [["function BREADTH-FIRST-SEARCH(problem) returns a solution node or failure / node ← NODE(problem.INITIAL) / if problem.IS-GOAL(node.STATE) then return node / frontier ← a <b>FIFO queue</b>, with node as an element / reached ← {problem.INITIAL}", "핵심: 프런티어 = <b>FIFO 큐</b>, reached = 이미 본 상태 명단", "code"], ["while not IS-EMPTY(frontier) do / node ← POP(frontier) / for each child in <b>EXPAND</b>(problem, node) do / s ← child.STATE / if problem.IS-GOAL(s) then return child / if s is not in <b>reached</b> then add s to reached, add child to frontier / return failure", "핵심: 꺼낸 노드를 <b>EXPAND</b> → 자식을 <b>만드는 순간</b> 목표 검사 / <b>reached</b>에 없는 상태만 프런티어에 추가", "code"], ["Expansion adds the node's lower level to the frontier. / Reached stops a node being visited twice — a cycle, or any other redundant path.", "확장은 그 노드의 아래 층을 프런티어에 추가한다. / Reached는 노드를 두 번 방문하는 것 — 사이클이든 다른 중복 경로든 — 을 막는다."]], "x": "교재의 BFS 의사코드입니다. 다 읽을 필요 없이 세 군데만 보면 됩니다.<ol><li><b>frontier ← a FIFO queue</b>: 큐라서 먼저 발견한(얕은) 노드부터 꺼낸다 → 층 단위 탐색.</li><li><b>reached</b>: 이미 본 상태 명단. 여기 없는 상태만 프런티어에 넣어 사이클과 중복 경로를 막는다.</li><li><b>IS-GOAL 검사가 EXPAND 루프 안</b>에 있다: 자식을 <b>만드는 순간</b> 목표 검사(조기 목표 검사). BFS는 얕은 순서로 노드를 만들기 때문에 처음 만든 목표가 곧 가장 얕은 해라 안전하다. 비용 순서인 UCS(16쪽)는 이렇게 하면 안 된다.</li></ol>", "e": "조기 검사의 이득: b = 10, d = 3이면 조기 검사는 깊이 3 노드를 만들다가 발견(약 1,000개 수준)하지만, 꺼낼 때 검사하면 깊이 3을 전부 꺼내는 동안 깊이 4 노드(최대 10,000개)까지 만들어 버립니다 — 한 층 차이 = b배 차이."}, {"s": "3-3", "im": ["3-3-11"], "en": "Implementation: Expanding the Search Tree", "ko": "구현: 탐색 트리 확장하기 (EXPAND)", "key": 1, "o": [["Tree search in <b>AI</b> builds <b>the search tree as it goes</b>.", "<b>AI</b>의 트리 탐색은 <b>탐색 트리를 진행하면서 만들어 간다</b>."], ["The <b>EXPAND</b> function applies the transition model (<b>RESULT</b>) to try every action available in the current node's state. It returns the list of new child nodes to be added to the frontier.", "<b>EXPAND</b> 함수는 전이 모델(<b>RESULT</b>)을 적용해 현재 노드의 상태에서 가능한 모든 행동을 시도한다. 프런티어에 추가할 새 자식 노드들의 목록을 돌려준다."], ["function EXPAND(problem, node) yields nodes / s ← node.STATE / for each action in problem.ACTIONS(s) do / s′ ← problem.RESULT(s, action) — Transition function / cost ← node.PATH-COST + problem.ACTION-COST(s, action, s′) / yield NODE(STATE=s′, PARENT=node, ACTION=action, PATH-COST=cost)", "핵심: 가능한 행동마다 RESULT로 다음 상태 s′를 만든다 / 자식 노드에 상태·부모·행동·경로 비용(부모 비용 + 행동 비용)을 기록", "code"], ["A node records four things: <b>its state</b>, <b>its parent</b>, <b>the action that produced it</b>, and the <b>path cost</b> so far. / <b>yield</b> may equally be implemented as returning a list of nodes.", "노드는 네 가지를 기록한다: <b>자신의 상태</b>, <b>부모</b>, <b>자신을 만든 행동</b>, 그리고 지금까지의 <b>경로 비용</b>. / <b>yield</b>는 노드 목록을 반환하는 것으로 구현해도 똑같다."]], "x": "모든 탐색 알고리즘이 공통으로 쓰는 <b>EXPAND</b> 함수입니다. 노드 하나를 받아 그 자식 노드들을 만들어 냅니다.3-1 12쪽의 ACTIONS(s)와 RESULT(s, a)가 여기서 실제로 쓰입니다. 자식 노드는 <b>네 가지</b>를 기록합니다: <b>STATE</b>(어떤 상태인가), <b>PARENT</b>(어느 노드에서 왔나 — 경로 복원용), <b>ACTION</b>(무슨 행동으로 왔나), <b>PATH-COST</b>(루트부터 여기까지 비용 = 부모의 비용 + 이번 행동의 비용). 이것이 3-2 06쪽 \"노드 ≠ 상태\"의 정확한 내용입니다: 상태는 '세계가 어떤 모습인가'이고, 노드는 거기에 '어떻게 왔는가'의 기록이 붙은 것입니다. yield는 자식을 하나씩 내놓는다는 뜻이고, 목록으로 한꺼번에 돌려줘도 같습니다. 트리는 이렇게 EXPAND를 부를 때마다 조금씩 자랍니다.", "e": "루마니아: Arad 노드(PATH-COST 0)를 EXPAND하면 Sibiu(PATH-COST 140), Timisoara(118), Zerind(75) 세 노드가 나오고, 각각의 PARENT는 Arad. Sibiu 노드를 다시 EXPAND하면 Fagaras의 PATH-COST = 140 + 99 = 239."}, {"s": "3-3", "im": ["3-3-12"], "en": "Time and Space Complexity: Breadth-First Search", "ko": "시간·공간 복잡도: 너비 우선 탐색", "key": 1, "o": [["b: maximum branching factor · m: maximum depth of tree · d: depth of the optimal solution", "b: 최대 분기 계수 · m: 트리의 최대 깊이 · d: 최적 해의 깊이"], ["1 + b + b² + … + b<sup>d</sup> ⇒ O(b<sup>d</sup>)  (here b = 2, d = 1, m = 3)", "1 + b + b² + … + b<sup>d</sup> ⇒ O(b<sup>d</sup>)  (여기서는 b = 2, d = 1, m = 3)"], ["Everything above the orange line has been expanded. If every path down to the goal depth is expanded, the search tree has 1 + b + b² + … + b<sup>d</sup> nodes.", "주황 선 위쪽은 모두 확장되었다. 목표 깊이까지의 모든 경로를 확장하면, 탐색 트리의 노드 수는 1 + b + b² + … + b<sup>d</sup>개다."]], "x": "BFS의 비용입니다. 그림: 이진 트리(b = 2)에서 목표 C가 깊이 1에 있고(d = 1), 트리는 깊이 3까지 있습니다(m = 3). BFS는 층 단위로 가므로 A(깊이 0) → B, C(깊이 1)까지만 보고 C가 목표라 끝납니다. 주황 선 아래(D, E, F, G, …)는 트리에 있어도 <b>전혀 만들지 않습니다</b>. 즉 BFS의 비용은 트리가 얼마나 깊은지(m)와 무관하게 <b>목표가 얼마나 얕은지(d)</b>에 좌우됩니다.<div class='formula'>1 + b + b² + ⋯ + b<sup>d</sup> ⇒ O(b<sup>d</sup>)</div>3-2 24쪽의 합을 깊이 d에서 끊은 것입니다. 시간(만든 노드 수)이 O(b<sup>d</sup>)이고, 그 노드들을 프런티어와 reached에 전부 기억해야 하므로 공간도 O(b<sup>d</sup>)입니다.", "e": "b = 10일 때: d = 2 → 111개, d = 4 → 11,111개, d = 6 → 1,111,111개. 깊이가 2 늘 때마다 100배. 노드당 1KB면 d = 6에서 약 1GB."}, {"s": "3-3", "im": ["3-3-13"], "en": "Properties of Breadth-First Search", "ko": "너비 우선 탐색의 성질", "key": 1, "o": [["Completeness: does a solution exist and will it be found? <b>Yes</b>", "완전성: 해가 존재하면 찾아내는가? <b>예</b>"], ["Cost optimality: will it find the lowest-cost solution? <b>Yes, when every step costs the same.</b> Otherwise, use uniform-cost search.", "비용 최적성: 가장 비용이 낮은 해를 찾는가? <b>모든 단계의 비용이 같을 때는 예.</b> 그렇지 않으면 균일 비용 탐색을 써라."], ["Time complexity: nodes generated – <b>O(b<sup>d</sup>)</b> / Space complexity: nodes stored – <b>O(b<sup>d</sup>)</b>", "시간 복잡도: 생성된 노드 수 – <b>O(b<sup>d</sup>)</b> / 공간 복잡도: 저장된 노드 수 – <b>O(b<sup>d</sup>)</b>"], ["Note: <b>In AI, a large space complexity is usually a bigger problem than time.</b>", "참고: <b>AI에서는 큰 공간 복잡도가 보통 시간보다 더 큰 문제다.</b>"]], "x": "BFS의 성적표(3-2 13쪽의 네 기준).<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간</th><th>공간</th></tr><tr><td>예 (b가 유한하면)</td><td>단계 비용이 모두 같을 때만 예</td><td>O(b<sup>d</sup>)</td><td>O(b<sup>d</sup>)</td></tr></table></div><ul><li><b>완전</b>: 각 층의 노드 수가 유한하므로 층을 하나씩 내려가다 보면 해가 있는 층에 반드시 도착합니다.</li><li><b>최적성에 조건이 붙는 이유</b>: BFS가 보장하는 것은 '<b>단계 수</b>가 가장 적은' 해입니다. 모든 단계의 비용이 같으면 단계 수 최소 = 비용 최소이지만, 비용이 제각각이면 단계는 적어도 비싼 길을 고를 수 있습니다. 그 경우엔 다음의 UCS를 써야 합니다.</li><li><b>공간이 더 큰 문제</b>(밑줄 강조): 3-2 14쪽처럼, 시간은 오래 기다리면 되지만 메모리는 넘치면 아예 실행이 안 됩니다. BFS는 한 층 전체를 메모리에 들고 있어야 해서 d가 조금만 커져도 터집니다.</li></ul>", "e": "08쪽 그래프에서 BFS의 해 S → e → r → f → G는 4단계지만 비용은 9 + 2 + 1 + 2 = <b>14</b>. 반면 S → d → e → r → f → G는 5단계인데 비용은 3 + 2 + 2 + 1 + 2 = <b>10</b>으로 더 쌉니다. BFS는 단계가 적은 14짜리를 고릅니다 — 최적이 아닌 예."}, {"s": "3-3", "im": ["3-3-14"], "en": "Uniform-Cost Search (= Dijkstra's Algorithm) — Cost contours", "ko": "균일 비용 탐색(= 다익스트라) — 비용 등고선", "key": 1, "o": [["The word \"<b>uniform</b>\" means it searches consistently by lowest cost", "\"<b>uniform(균일)</b>\"이라는 말은 일관되게 가장 낮은 비용 순서로 탐색한다는 뜻이다"], ["Expansion rule: expand a <b>cheapest</b> node first. — Cost contours", "확장 규칙: 가장 <b>싼</b> 노드를 먼저 확장한다. — 비용 등고선"]], "x": "<b>균일 비용 탐색(UCS)</b>, 다른 이름으로 <b>다익스트라 알고리즘</b>입니다. BFS가 '가장 얕은' 노드를 꺼냈다면 UCS는 '<b>경로 비용이 가장 싼</b>' 노드를 꺼냅니다. 08쪽과 같은 그래프인데 이번엔 간선 비용이 있습니다. 오른쪽 트리에서 노드 옆 숫자가 S부터의 누적 비용 g(n)이고, 색 영역이 <b>비용 등고선(cost contours)</b> — BFS의 띠가 '깊이'였다면 UCS의 영역은 '비용'입니다. 비용 순서대로 따라가 보면:<div class='tw'><table><tr><th>#</th><th>꺼냄 (비용)</th><th>넣음 / 갱신</th></tr><tr><td>1</td><td>S (0)</td><td>d(3), e(9), p(1)</td></tr><tr><td>2</td><td>p (1)</td><td>q(16)</td></tr><tr><td>3</td><td>d (3)</td><td>b(4), c(11), e: 9 → 5로 갱신</td></tr><tr><td>4</td><td>b (4)</td><td>a(6)</td></tr><tr><td>5</td><td>e (5)</td><td>h(13), r(7)</td></tr><tr><td>6</td><td>a (6)</td><td>—</td></tr><tr><td>7</td><td>r (7)</td><td>f(8)</td></tr><tr><td>8</td><td>f (8)</td><td>G(10) · c는 11로 더 싸지 않아 무시</td></tr><tr><td>9</td><td>G (10)</td><td>목표! S → d → e → r → f → G, 비용 10</td></tr></table></div>눈여겨볼 점: p(1)은 깊이 1이지만 비용 1이라 가장 먼저, e(9)는 깊이 1인데 비싸서 뒤로 밀리고, 깊이 4인 f(8)이 e(9)보다 먼저 처리됩니다. 3단계에서 e에 더 싼 경로(S → d → e = 5)가 발견되어 갱신되는 것이 UCS의 핵심 동작입니다(16쪽). 결과는 13쪽의 BFS(비용 14)와 달리 최적인 10입니다. (슬라이드의 트리는 갱신 없이 그린 트리 탐색 버전이라 e가 9와 5 둘 다 보입니다.)", "e": "지도 앱의 최단 경로가 바로 다익스트라(UCS)입니다. '환승 횟수 최소'가 BFS라면 '소요 시간 최소'가 UCS."}, {"s": "3-3", "im": ["3-3-15"], "en": "Uniform-Cost Search — Properties", "ko": "균일 비용 탐색 — 성질과 복잡도", "key": 1, "o": [["The word \"<b>uniform</b>\" means it searches consistently by lowest cost / Expansion rule: expand the frontier node <b>with the lowest path cost</b> from the initial state", "\"<b>uniform</b>\"이라는 말은 일관되게 가장 낮은 비용 순서로 탐색한다는 뜻 / 확장 규칙: 초기 상태로부터의 <b>경로 비용이 가장 낮은</b> 프런티어 노드를 확장한다"], ["Implementation: <b>best-first search</b>, with the frontier as <b>a priority queue</b> ordered by f(n) = g(n) = path cost", "구현: <b>최선 우선 탐색</b>, 프런티어는 f(n) = g(n) = 경로 비용으로 정렬된 <b>우선순위 큐</b>"], ["Completeness: yes, provided every step cost exceeds some small positive constant <b>ε</b>. / Cost optimality: yes; nodes are expanded in order of increasing path cost (Proof next lecture via A*)", "완전성: 예, 단 모든 단계 비용이 어떤 작은 양의 상수 <b>ε</b>보다 커야 한다. / 비용 최적성: 예; 노드가 경로 비용이 증가하는 순서로 확장되기 때문 (증명은 다음 강의에서 A*로)"], ["Time and space complexity: <b>O(b<sup>(C*/ε)</sup>)</b>, expanding every node with cost c ≤ C* (the cost of the optimal solution) / <b>This can be larger than BFS's O(b<sup>d</sup>)</b>: it may explore many cheap long paths before an expensive short one.", "시간·공간 복잡도: <b>O(b<sup>(C*/ε)</sup>)</b>, 비용 c ≤ C*(최적 해의 비용)인 모든 노드를 확장한다 / <b>이것은 BFS의 O(b<sup>d</sup>)보다 클 수 있다</b>: 비싼 짧은 경로 하나를 보기 전에 싼 긴 경로를 많이 탐색할 수 있다."], ["<i>Breadth-first search is the special case of UCS where every step costs the same. = Flatten the contours</i>", "<i>너비 우선 탐색은 모든 단계의 비용이 같은 UCS의 특수한 경우다. = 등고선을 평평하게 만든 것</i>"]], "x": "UCS의 성질입니다. 구현은 <b>최선 우선 탐색(best-first search)</b>: 프런티어를 <b>우선순위 큐</b>(값이 작은 것부터 나오는 큐)로 만들고 정렬 기준 <b>f(n) = g(n)</b> = 시작부터 n까지의 경로 비용으로 둡니다. 오른쪽 그림의 \"C*/ε tiers\": c ≤ 1, c ≤ 2, c ≤ 3 … 비용 등고선을 바깥으로 넓혀 가며 탐색합니다.<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간·공간</th></tr><tr><td>예 (단계 비용 ≥ ε > 0이면)</td><td>예</td><td>O(b<sup>C*/ε</sup>)</td></tr></table></div><ul><li><b>ε 조건이 필요한 이유</b>: 비용이 0인 행동이 있으면, 그 행동만 반복하는 경로는 비용이 늘지 않아 UCS가 그 길만 영원히 팔 수 있습니다. 모든 행동의 비용이 어떤 작은 양수 ε 이상이면 그런 일이 없습니다.</li><li><b>최적인 이유</b>: 비용이 작은 순서로 꺼내므로, 목표를 꺼내는 순간 그보다 싼 경로는 이미 다 꺼내 본 뒤입니다(증명은 3-4의 A*에서).</li><li><b>C*/ε의 뜻</b>: C*가 최적 해의 비용이면, 비용 C* 이하인 경로는 최대 C*/ε 걸음까지 길어질 수 있습니다. 즉 UCS가 뒤지는 '실질 깊이'가 C*/ε이라 BFS의 d 자리에 C*/ε이 들어간 것입니다. 이 값이 d보다 클 수 있어서 UCS가 BFS보다 더 많이 뒤질 수 있습니다 — 비싼 짧은 길 하나를 꺼내기 전에 싼 긴 길들을 전부 먼저 보기 때문입니다.</li></ul>마지막 문장(이탤릭): 모든 비용이 같으면 등고선이 깊이 띠와 일치하므로 <b>BFS는 UCS의 특수한 경우</b>입니다.", "e": "고속도로 한 번에 비용 10 vs 골목길 한 칸에 비용 1, 사방 4갈래: UCS는 비용 10 미만의 골목길 경로를 전부 본 뒤에야 고속도로 해를 꺼냅니다(최대 4<sup>9</sup> ≈ 26만 노드). BFS라면 고속도로(1단계)를 바로 찾습니다 — UCS가 BFS보다 느린 예."}, {"s": "3-3", "im": ["3-3-16"], "en": "Implementation: Uniform-Cost Search", "ko": "구현: 균일 비용 탐색", "key": 1, "o": [["function UNIFORM-COST-SEARCH(problem) returns a solution node, or failure / return BEST-FIRST-SEARCH(problem, <b>PATH-COST</b>)", "핵심: UCS = 최선 우선 탐색에 정렬 기준 <b>PATH-COST</b>(g)를 넘긴 것", "code"], ["function BEST-FIRST-SEARCH(problem, f) returns a solution node or failure / node ← NODE(STATE=problem.INITIAL) / frontier ← a <b>priority queue</b> ordered by f, with node as an element / reached ← a lookup table, with one entry with key problem.INITIAL and value node / while not IS-EMPTY(frontier) do / node ← POP(frontier) / if problem.IS-GOAL(node.STATE) then return node / for each child in EXPAND(problem, node) do / s ← child.STATE / if s is not in reached or <b>child.PATH-COST < reached[s].PATH-COST</b> then / reached[s] ← child / add child to frontier / return failure", "핵심 ① 프런티어 = f로 정렬된 <b>우선순위 큐</b> / ② 목표 검사는 노드를 <b>꺼낼 때</b> / ③ <b>더 싼 경로</b>가 나오면 reached를 갱신", "code"], ["The order of expansion is set by f(n) = the path cost from the initial state to n. / If a cheaper path to a state turns up later, we take it. (≠ BFS) — The extra check is what BFS does not have: revisit a node if a better — cheaper — path reaches it.", "확장 순서는 f(n) = 초기 상태에서 n까지의 경로 비용이 정한다. / 어떤 상태로 가는 더 싼 경로가 나중에 나타나면, 그것을 택한다. (≠ BFS) — 이 추가 검사가 BFS에는 없는 것이다: 더 좋은 — 더 싼 — 경로가 도달하면 노드를 다시 방문한다."]], "x": "UCS의 의사코드입니다. 위 상자: UCS는 한 줄 — <b>BEST-FIRST-SEARCH에 정렬 기준으로 PATH-COST를 넘긴 것</b>입니다. 아래 상자가 그 최선 우선 탐색이고, 3-4의 탐욕적 탐색과 A*도 f만 바꿔서 이 함수를 그대로 씁니다.BFS(10쪽)와 다른 세 가지:<ul><li>① 프런티어가 큐가 아니라 <b>우선순위 큐</b>(키 = g).</li><li>② 목표 검사를 자식을 만들 때가 아니라 <b>꺼낼 때</b> 합니다(<b>늦은 목표 검사, late goal test</b>). 꺼낸다는 것은 남은 것 중 가장 싸다는 뜻이므로 그때 목표면 최적입니다. 만들 때 검사하면 더 싼 경로가 아직 안 나온 상태에서 반환해 버릴 수 있습니다.</li><li>③ reached가 집합이 아니라 표이고, <b>더 싼 경로가 나오면 갱신</b>합니다(형광펜). 14쪽에서 e가 9 → 5로 바뀐 것이 이 줄입니다. BFS에는 이 검사가 없습니다 — 처음 도달한 것이 항상 가장 얕으니 필요 없기 때문입니다.</li></ul>", "e": "조기 검사가 틀리는 예: S → G 비용 10, S → A 비용 1, A → G 비용 1. 만들 때 검사하면 S를 확장하자마자 G(10)를 반환합니다. 꺼낼 때 검사하면 A(1)를 먼저 꺼내 G(2)를 찾습니다."}, {"s": "3-3", "im": ["3-3-17", "3-3-18"], "en": "Uninformed Search: Depth-First Search (DFS)", "ko": "깊이 우선 탐색(DFS)", "key": 1, "o": [["Expansion rule: expand the <b>deepest</b> unexpanded node on the frontier", "확장 규칙: 프런티어에서 가장 <b>깊은</b> 미확장 노드를 확장한다"], ["Frontier: <b>a stack (LIFO)</b>", "프런티어: <b>스택(LIFO)</b>"]], "x": "<b>깊이 우선 탐색(DFS)</b>입니다. 규칙: 프런티어에서 가장 <b>깊은</b> 노드를 꺼내 확장한다. 스택을 쓰면 저절로 그렇게 됩니다(가장 최근에 넣은 노드가 가장 깊으니까).<br>17쪽 그림: 드릴 로봇이 한 지점을 <b>바닥까지</b> 뚫습니다. 바닥에 닿으면(더 갈 곳이 없으면) 한 칸 올라와 옆 갈래를 다시 끝까지 뚫습니다 — 이것이 <b>백트래킹(backtracking)</b>입니다. 옆 갈래의 얕은 곳에 보석이 있어도, 지금 파는 구멍에서 먼저 만나는 보석을 먼저 찾으므로 '가장 얕은 해'를 보장하지 않습니다.<br>18쪽 그림: 08쪽과 같은 그래프에서 DFS가 지나간 자리(빨강). S의 첫 자식 d로 들어가 b → a(끝, 되돌아감) → c → a(끝) → e → h → p → q(끝) → r → f → c → a … → G 발견. 깊이 1의 e, p 가지는 손도 대지 않았고, 오른쪽 그래프에서 빨간 경로가 S → d → … → G로 크게 돌아간 것을 볼 수 있습니다. 운이 좋으면 금방 찾고, 운이 나쁘면 깊은 가지를 다 뒤지고 옵니다.", "e": "미로의 '오른손 법칙'(벽에 오른손을 대고 계속 걷기)이 DFS입니다. 기억할 것은 '지금까지 온 길'뿐이라 메모가 적게 들지만, 출구가 바로 옆 갈림길에 있어도 먼 길을 돌 수 있습니다.", "pg": [[1, 1], [1, 1]]}, {"s": "3-3", "im": ["3-3-19"], "en": "DFS — on a binary tree (Figure 3.11)", "ko": "DFS — 이진 트리에서의 진행 (그림 3.11)", "key": 1, "o": [["Expansion rule: expand the deepest unexpanded node on the frontier / Frontier: a stack (LIFO)", "확장 규칙: 프런티어에서 가장 깊은 미확장 노드를 확장한다 / 프런티어: 스택(LIFO)"], ["<b>No reached</b> data structure is needed / Redundant paths are not checked, so the same region may be searched more than once / Cycle checking is done only along the current path", "<b>reached 자료구조가 필요 없다</b> / 중복 경로를 검사하지 않으므로, 같은 영역을 두 번 이상 탐색할 수 있다 / 사이클 검사는 현재 경로를 따라서만 한다"], ["Figure 3.11 A dozen steps (left to right, top to bottom) in the progress of a depth-first search on a binary tree from start state A to goal M. The frontier is in green, with a triangle marking the node to be expanded next. Previously expanded nodes are lavender, and potential future nodes have faint dashed lines. Expanded nodes with no descendants in the frontier (very faint lines) can be discarded.", "그림 3.11 이진 트리에서 시작 상태 A부터 목표 M까지 깊이 우선 탐색이 진행되는 열두 단계(왼쪽에서 오른쪽으로, 위에서 아래로). 프런티어는 초록색이고, 삼각형이 다음에 확장할 노드를 표시한다. 이미 확장된 노드는 연보라색, 앞으로 생길 수 있는 노드는 흐린 점선이다. 프런티어에 자손이 없는 확장된 노드(아주 흐린 선)는 버려도 된다."]], "x": "교재 그림 3.11로 DFS를 봅니다. A에서 시작해 목표 M까지: A → B → D → H(끝, 되돌아감) → I(끝) → E → J → K → C → F → L → M. 왼쪽 가지를 바닥까지 먼저 파고, 막히면 올라와 다음 가지로 갑니다.<br>BFS와 결정적으로 다른 점 세 가지:<ul><li><b>reached가 없다</b>: 방문한 모든 상태를 기억하지 않습니다. 메모리를 아끼기 위해서입니다.</li><li><b>다 본 가지는 버린다</b>: 그림에서 아주 흐려진 노드(예: 2번째 줄의 D, H, I)는 \"확장했고 프런티어에 자손도 없다\" = 더 이상 쓸 일이 없으므로 메모리에서 지웁니다. 그래서 동시에 기억하는 것은 '<b>현재 경로 + 각 층에서 아직 안 본 형제들</b>'뿐입니다(21쪽의 O(bm)).</li><li><b>사이클 검사는 현재 경로만</b>: 새 노드의 상태가 조상 중에 있는지만 봅니다(A → B → A 같은 되돌아감). 3-2 08쪽에서 말한 싼 검사입니다. 반면 중복 경로(A → B → D와 A → C → D처럼 다른 경로로 같은 상태)는 '본 적 있는 모든 상태'를 기억해야 막을 수 있는데 DFS는 그것을 포기했으므로, 같은 영역을 여러 번 탐색할 수 있습니다.</li></ul>", "e": "그림 2번째 줄 첫 칸: H와 I를 다 봤으니 D도 끝 → D, H, I를 버리고 E로. 이때 메모리에 있는 것은 경로 A → B와 프런티어의 E, C뿐입니다."}, {"s": "3-3", "im": ["3-3-20"], "en": "Implementation: Depth-First Search (Depth-Limited Search)", "ko": "구현: 깊이 우선 탐색 (깊이 제한 탐색)", "key": 1, "o": [["DFS identical to BFS or best-first except that <b>it takes the last element off the frontier</b>.", "DFS는 BFS나 최선 우선 탐색과 똑같은데, <b>프런티어에서 마지막 원소를 꺼낸다</b>는 점만 다르다."], ["Implementation option — Iterative: abandoned branches are freed as the tree is built, and cycles are checked only along the current path — much like backtracking search. / Recursive: the current path lives on the call stack where the function cannot read it, so cycle checking needs a separate structure.", "구현 방식 — 반복: 트리를 만들어 가면서 버려진 가지는 해제되고, 사이클은 현재 경로를 따라서만 검사한다 — 백트래킹 탐색과 매우 비슷. / 재귀: 현재 경로가 함수가 읽을 수 없는 호출 스택에 있으므로, 사이클 검사에 별도의 자료구조가 필요하다."], ["function DEPTH-LIMITED-SEARCH(problem, ℓ) returns a node or failure or cutoff / frontier ← a LIFO queue (stack) with NODE(problem.INITIAL) as an element / result ← failure / while not IS-EMPTY(frontier) do / node ← POP(frontier) / if problem.IS-GOAL(node.STATE) then return node / if DEPTH(node) > ℓ then result ← cutoff / else if not <b>IS-CYCLE</b>(node) do / for each child in EXPAND(problem, node) do / add child to frontier / return result", "핵심: 프런티어 = <b>스택</b>, reached 없음 / 깊이가 ℓ을 넘으면 <b>cutoff</b>로 표시 / <b>IS-CYCLE</b>로 현재 경로의 사이클만 막는다", "code"], ["ℓ could be ∞ in DFS / No reached data structure: Memory management. / IS-CYCLE also stops the same state sitting on the frontier twice. But, Redundant paths cannot be prevented.", "DFS에서는 ℓ이 ∞일 수 있다 / reached 자료구조가 없다: 메모리 관리. / IS-CYCLE은 같은 상태가 프런티어에 두 번 올라가는 것도 막는다. 하지만 중복 경로는 막을 수 없다."]], "x": "DFS의 의사코드인데, 교재는 깊이 한계 ℓ을 붙인 <b>깊이 제한 탐색(depth-limited search)</b>으로 보여 줍니다. ℓ = ∞로 두면 그냥 DFS입니다(말풍선).읽을 점:<ul><li>BFS 코드와의 차이는 사실상 \"<b>프런티어에서 마지막 원소를 꺼낸다</b>\"(스택) 하나입니다(05쪽의 ADT 이야기).</li><li><b>reached가 없습니다</b>(말풍선: 메모리 관리). 대신 <b>IS-CYCLE</b>이 부모를 거슬러 올라가며 현재 경로에 같은 상태가 있는지 검사합니다. 사이클과 '같은 상태가 프런티어에 두 번 오르는 것'은 막지만, 중복 경로는 못 막습니다.</li><li>반환값이 세 가지: 해 노드, <b>failure</b>(다 뒤졌는데 없음), <b>cutoff</b>(한계 ℓ에 걸려 못 본 곳이 있음). 이 구분이 25쪽 IDS에서 중요합니다.</li><li>구현 방식 두 가지: 반복(iterative)은 위 코드처럼 스택을 직접 쓰는 것이고, 재귀(recursive)는 함수가 자기를 부르는 것인데 이때 현재 경로가 프로그램의 호출 스택에 숨어 있어 IS-CYCLE을 위해 경로를 따로 기록해야 합니다.</li></ul>", "e": "cutoff vs failure: 깊이 2까지만 보라고 했는데(ℓ = 2) 깊이 3에 노드가 있었으면 → cutoff(더 깊이 가면 있을지도). 깊이 2 안에서 트리가 끝났는데 목표가 없으면 → failure(정말 없음)."}, {"s": "3-3", "im": ["3-3-21"], "en": "Time and Space Complexity: Depth-First Search", "ko": "시간·공간 복잡도: 깊이 우선 탐색", "key": 1, "o": [["b: maximum branching factor · m: maximum depth of tree · d: depth of the optimal solution", "b: 최대 분기 계수 · m: 트리의 최대 깊이 · d: 최적 해의 깊이"], ["<b>DFS returns the FIRST goal it reaches — not the cheapest</b>", "<b>DFS는 처음 도달한 목표를 반환한다 — 가장 싼 목표가 아니다</b>"], ["Time O(b<sup>m</sup>), Space (= memory) O(bm)  (here b = 2, d = 1, m = 3) / Time complexity: Worst case, it expands every path.", "시간 O(b<sup>m</sup>), 공간(= 메모리) O(bm)  (여기서는 b = 2, d = 1, m = 3) / 시간 복잡도: 최악의 경우 모든 경로를 확장한다."]], "x": "DFS의 비용입니다. 12쪽과 같은 트리(b = 2, d = 1, m = 3)인데 결과가 전혀 다릅니다. DFS는 A → B → D → H(막힘) → I 순서로 왼쪽 가지를 끝까지 파다가 깊이 3의 I에서 목표를 만납니다. 깊이 1의 C가 더 좋은 목표인데 <b>보지도 못했습니다</b> — \"DFS는 처음 도달한 목표를 반환하지, 가장 싼 목표를 반환하지 않는다\"(주황 상자). 그래서 최적이 아닙니다.<ul><li><b>시간 O(b<sup>m</sup>)</b>: 최악의 경우(목표가 마지막 가지에 있으면) 트리 전체를 다 봐야 하므로 3-2 24쪽의 전체 합, 즉 b<sup>m</sup>입니다. BFS의 b<sup>d</sup>와 비교하면 m ≥ d이므로 보통 더 큽니다.</li><li><b>공간 O(bm)</b>: 이것이 DFS의 장점입니다. 동시에 기억하는 것은 루트부터 현재 노드까지의 경로(최대 m개)와 그 경로의 각 층에서 아직 안 본 형제들(층마다 최대 b − 1개)뿐이라 대략 b × m입니다. 지수(b<sup>d</sup>)가 아니라 곱(bm)이라 엄청나게 작습니다.</li></ul>", "e": "b = 10, m = 16일 때 DFS가 들고 있는 노드는 약 160개. BFS는 깊이 16 한 층에만 10<sup>16</sup>개가 들 수 있습니다. 노드당 1KB면 DFS는 160KB, BFS는 10,000TB."}, {"s": "3-3", "im": ["3-3-22"], "en": "Properties of Depth-First Search", "ko": "깊이 우선 탐색의 성질", "key": 1, "o": [["Completeness? — m could be infinite, so <b>only if we prevent cycles</b> (more later)", "완전성? — m이 무한일 수 있으므로, <b>사이클을 막을 때만</b> (뒤에서 더)"], ["Cost optimality — <b>no</b>. It returns the first solution it finds.", "비용 최적성 — <b>아니오</b>. 처음 찾은 해를 반환한다."], ["Time complexity — <b>O(b<sup>m</sup>)</b> — worst case, it reaches maximum depth m on the last path / if m ≫ d, this is inefficient compared to BFS", "시간 복잡도 — <b>O(b<sup>m</sup>)</b> — 최악의 경우 마지막 경로에서 최대 깊이 m까지 간다 / m ≫ d이면 BFS에 비해 비효율적이다"], ["Space complexity — <b>O(bm)</b>, linear in the maximum tree depth. — but only if no reached structure is used. / cycles can be cut; <b>redundant paths</b> cannot be checked.", "공간 복잡도 — <b>O(bm)</b>, 최대 트리 깊이에 선형. — 단 reached 구조를 쓰지 않을 때만. / 사이클은 끊을 수 있지만; <b>중복 경로</b>는 검사할 수 없다."]], "x": "DFS의 성적표.<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간</th><th>공간</th></tr><tr><td>사이클을 막을 때만 (유한 공간에서)</td><td>아니오</td><td>O(b<sup>m</sup>)</td><td>O(bm) — 선형!</td></tr></table></div><ul><li><b>완전성이 조건부인 이유</b>: 무한히 깊은 가지(사이클)에 들어가면 영원히 바닥에 닿지 못해 다른 가지로 돌아오지 못합니다. IS-CYCLE로 사이클을 끊으면 유한 상태 공간에서는 완전합니다. 무한 상태 공간에서는 끊어도 불완전할 수 있습니다.</li><li><b>최적이 아닌 이유</b>: 21쪽처럼 처음 만난 해를 반환.</li><li><b>시간</b>: m ≫ d이면(목표는 얕은데 트리는 깊으면) BFS보다 훨씬 비효율적.</li><li><b>공간이 선형</b>: DFS의 유일하지만 결정적인 장점. 단, 이 장점은 reached를 쓰지 않을 때만 유효합니다 — reached를 쓰면 방문한 상태를 다 기억하니 다시 지수적이 됩니다. 그래서 사이클만 끊고 중복 경로는 포기하는 것입니다.</li></ul>", "e": "정답이 깊이 2에 있는데 왼쪽 첫 가지가 깊이 1,000까지 뻗어 있다면: BFS는 깊이 2까지만 보고 끝, DFS는 1,000까지 내려갔다 올라와야 합니다. 반대로 정답이 왼쪽 가지 바닥에 있으면 DFS가 훨씬 빠릅니다."}, {"s": "3-3", "im": ["3-3-23", "3-3-24"], "en": "Iterative Deepening Search (IDS)", "ko": "반복적 깊이 심화 탐색(IDS)", "key": 1, "o": [["Can we have DFS's low memory use, avoid its infinite loops, and keep BFS's optimality guarantee?", "DFS의 적은 메모리 사용, 무한 루프 회피, 그리고 BFS의 최적성 보장을 모두 가질 수 있을까?"], ["Check the root; then DFS for a path of length 1; then length 2; then length 3; … — limit ℓ = 0 · limit ℓ = 1 · limit ℓ = 2", "루트를 확인한다; 그다음 길이 1인 경로까지 DFS; 그다음 길이 2; 그다음 길이 3; … — 한계 ℓ = 0 · 한계 ℓ = 1 · 한계 ℓ = 2"]], "x": "BFS는 최적이지만 메모리를 많이 쓰고, DFS는 메모리는 적지만 최적이 아니고 무한 루프 위험이 있습니다. 둘의 장점만 합칠 수 없을까? 답이 <b>반복적 깊이 심화 탐색(IDS, Iterative Deepening Search)</b>입니다. 아이디어는 단순합니다: 깊이 한계 ℓ을 0, 1, 2, 3, …으로 하나씩 늘려 가며 <b>매번 처음부터</b> 깊이 제한 DFS(20쪽)를 돌립니다. 23쪽 그림: ℓ = 0이면 루트만, ℓ = 1이면 깊이 1까지, ℓ = 2이면 깊이 2까지 봅니다.<br>왜 되는가: 깊이 d에 있는 해는 한계가 d가 되는 회차에 처음 발견됩니다. 그보다 얕은 해가 있었다면 더 이른 회차에서 이미 찾았을 것이므로, <b>가장 얕은 해를 놓치지 않습니다</b>(BFS의 장점). 그리고 각 회차는 DFS이므로 메모리가 O(bd)뿐입니다(DFS의 장점). 24쪽은 교재 그림 3.12로, 목표 M(깊이 3)을 찾기까지 limit 0 → 1 → 2 → 3의 네 회차를 전부 보여 줍니다: limit 0: A / limit 1: A, B, C / limit 2: A, B, D, E, C, F, G / limit 3: A, B, D, H, I, E, J, K, C, F, L, M 발견.", "e": "낭비가 작은 이유: 목표 M까지 A는 4번, B·C는 3번, D~G는 2번, H~M은 1번 만들어집니다. 윗층일수록 여러 번 만들지만 노드 대부분은 맨 아래층에 있어서(3-2 24쪽) 전체로는 조금만 더 듭니다.", "pg": [[1, 2], [1, 0]]}, {"s": "3-3", "im": ["3-3-25"], "en": "Implementation: Iterative Deepening Search", "ko": "구현: 반복적 깊이 심화 탐색", "key": 1, "o": [["function ITERATIVE-DEEPENING-SEARCH(problem) returns a solution node or failure / for depth = 0 to ∞ do / result ← DEPTH-LIMITED-SEARCH(problem, depth) / if result ≠ <b>cutoff</b> then return result", "핵심: 깊이 한계를 0, 1, 2, …로 늘리며 깊이 제한 탐색을 반복 / 결과가 <b>cutoff</b>가 아니면(해 또는 failure) 멈춘다", "code"], ["cutoff means \"no solution within this limit\"; failure means \"no solution at all\". The outer loop needs the difference to know when to stop.", "cutoff는 \"이 한계 안에는 해가 없다\", failure는 \"해가 아예 없다\"는 뜻이다. 바깥 루프는 언제 멈출지 알기 위해 이 차이가 필요하다."]], "x": "IDS의 의사코드는 세 줄입니다: depth를 0부터 하나씩 늘리며 깊이 제한 탐색(아래 상자, 20쪽과 같음)을 부르고, 결과가 <b>cutoff가 아니면</b> 반환합니다. 결과가 해 노드면 찾은 것이고, failure면 해가 없는 것이니 둘 다 멈춥니다. cutoff일 때만 \"한계를 늘리면 찾을지도\" 하며 다음 회차로 갑니다.<br>그래서 <b>cutoff와 failure의 구분</b>이 꼭 필요합니다. 깊이 제한 탐색은 한 번이라도 한계에 걸려 못 본 노드가 있으면 cutoff를, 한계에 걸린 적 없이 다 뒤졌는데 없으면 failure를 돌려줍니다. 만약 둘을 구분하지 않으면, 해가 정말 없는 유한한 문제에서도 IDS는 \"한계를 더 늘리면…\" 하며 영원히 돕니다.", "e": "상태가 A, B 두 개뿐이고(A ↔ B) 목표가 없는 문제: 한계 2에서 A → B → A는 사이클이라 확장하지 않고, 한계에 걸려 잘린 노드도 없음 → failure → IDS 종료. 구분이 없었다면 한계 3, 4, 5, … 무한 반복."}, {"s": "3-3", "im": ["3-3-26"], "en": "Properties of Iterative Deepening Search", "ko": "반복적 깊이 심화 탐색의 성질", "key": 1, "o": [["Completeness — <b>yes</b> / Cost optimality — <b>yes</b>", "완전성 — <b>예</b> / 비용 최적성 — <b>예</b>"], ["Time complexity — it rebuilds the tree up to d times: <b>db + (d − 1)b² + … + 1·b<sup>d</sup> = O(b<sup>d</sup>)</b> / slower than BFS, but in the same complexity class.", "시간 복잡도 — 트리를 최대 d번 다시 만든다: <b>db + (d − 1)b² + … + 1·b<sup>d</sup> = O(b<sup>d</sup>)</b> / BFS보다 느리지만, 같은 복잡도 등급이다."], ["Space complexity — <b>O(bd)</b>, linear. / Even less than DFS, since d ≤ m. / cycles have to be handled inside the depth-limited DFS", "공간 복잡도 — <b>O(bd)</b>, 선형. / d ≤ m이므로 DFS보다도 적다. / 사이클은 깊이 제한 DFS 안에서 처리되어야 한다"], ["IDS gives the same result as BFS, at a longer running time but a far better space complexity / <b>This is why IDS and DFS are the workhorses of AI</b>", "IDS는 BFS와 같은 결과를, 더 긴 실행 시간이지만 훨씬 좋은 공간 복잡도로 얻는다 / <b>그래서 IDS와 DFS가 AI의 일꾼이다</b>"]], "x": "IDS의 성적표.<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간</th><th>공간</th></tr><tr><td>예</td><td>예 (비용이 모두 같을 때, BFS와 같은 조건)</td><td>O(b<sup>d</sup>)</td><td>O(bd) — 선형!</td></tr></table></div><ul><li><b>시간 식의 뜻</b>: 깊이 1의 노드는 회차 1, 2, …, d에서 매번 만들어지니 d번, 깊이 2의 노드는 d − 1번, …, 깊이 d의 노드는 마지막 회차에만 1번. 그래서 db + (d − 1)b² + ⋯ + 1·b<sup>d</sup>인데, 마지막 항 b<sup>d</sup>가 지배적이라 <b>O(b<sup>d</sup>)</b> — BFS와 같은 등급입니다. 반복한다고 등급이 나빠지지 않습니다.</li><li><b>공간 O(bd)</b>: 각 회차가 DFS이고 깊이가 최대 d이므로. 한계가 d에서 멈추니 DFS의 O(bm)보다도 작습니다(d ≤ m).</li><li>사이클 처리는 안쪽의 깊이 제한 DFS가 IS-CYCLE로 합니다.</li></ul>결론: IDS는 BFS의 결과(완전, 가장 얕은 해)를 조금 더 긴 시간에, 하지만 <b>훨씬 적은 메모리</b>로 얻습니다. 메모리가 병목인 AI에서는 이것이 결정적이라 \"IDS와 DFS가 AI의 일꾼(workhorse)\"입니다.", "e": "b = 10, d = 5: BFS는 10 + 100 + 1,000 + 10,000 + 100,000 = 111,110개, IDS는 5·10 + 4·100 + 3·1,000 + 2·10,000 + 1·100,000 = 123,450개 → 약 11%만 더 만듭니다. 대신 메모리는 BFS의 100,000개 vs IDS의 약 50개."}, {"s": "3-3", "im": ["3-3-27"], "en": "The One Queue: Every Strategy Is One Algorithm", "ko": "하나의 큐: 모든 전략은 하나의 알고리즘이다", "key": 1, "o": [["Breadth-first, uniform-cost, depth-first and iterative deepening are one algorithm. / Only the frontier rule differs: FIFO queue, priority queue, LIFO stack, stack with a depth cutoff", "너비 우선, 균일 비용, 깊이 우선, 반복적 깊이 심화는 하나의 알고리즘이다. / 프런티어 규칙만 다르다: FIFO 큐, 우선순위 큐, LIFO 스택, 깊이 컷오프가 있는 스택"], ["Conceptually every frontier is a priority queue: nodes with priorities attached", "개념적으로 모든 프런티어는 우선순위 큐다: 우선순위가 붙은 노드들"], ["Practically, depth-first and breadth-first avoid the log(n) overhead of a real priority queue by using a stack and a plain queue", "실용적으로는, 깊이 우선과 너비 우선은 진짜 우선순위 큐의 log(n) 오버헤드를 피하기 위해 스택과 일반 큐를 쓴다"], ["One implementation with the queuing object passed in gives all four — and Part III changes nothing but the priority: <b>f = g + h</b>", "큐 객체를 인자로 넘기는 하나의 구현이 넷을 모두 만든다 — 그리고 파트 III는 우선순위 말고는 아무것도 바꾸지 않는다: <b>f = g + h</b>"]], "x": "파트 II의 결론, CS188의 \"The One Queue\"입니다. 네 알고리즘은 3-2 09쪽의 반복문 하나이고, 프런티어 규칙만 다릅니다. 개념적으로는 전부 '우선순위가 붙은 노드들을 작은 순서로 꺼내는' 우선순위 큐로 볼 수 있습니다.<div class='tw'><table><tr><th>알고리즘</th><th>프런티어</th><th>우선순위 (작은 것부터)</th><th>목표 검사</th></tr><tr><td>BFS</td><td>FIFO 큐</td><td>깊이</td><td>생성할 때 (early)</td></tr><tr><td>UCS</td><td>우선순위 큐</td><td>g(n) = 경로 비용</td><td>꺼낼 때 (late)</td></tr><tr><td>DFS</td><td>LIFO 스택</td><td>−깊이 (깊을수록 먼저)</td><td>꺼낼 때</td></tr><tr><td>IDS</td><td>스택 + 깊이 한계</td><td>−깊이, 한계 초과는 cutoff</td><td>꺼낼 때</td></tr><tr><td>탐욕적 탐색 (3-4)</td><td>우선순위 큐</td><td>h(n)</td><td>꺼낼 때</td></tr><tr><td>A* (3-4)</td><td>우선순위 큐</td><td>g(n) + h(n)</td><td>꺼낼 때</td></tr></table></div>실제 구현에서 BFS와 DFS가 우선순위 큐 대신 일반 큐와 스택을 쓰는 이유는 속도입니다 — 우선순위 큐는 넣고 뺄 때마다 정렬 비용 log(n)이 들지만 큐와 스택은 상수 시간입니다. 마지막 줄이 3-4 예고입니다: 파트 III(정보 탐색)는 우선순위를 <b>f = g + h</b>로 바꾸는 것 말고는 아무것도 바꾸지 않습니다.", "e": "시험 대비: 이 표의 넷을 완전성/최적성/시간/공간 네 칸과 함께 채우는 연습을 하세요. BFS (예/비용 같을 때/b<sup>d</sup>/b<sup>d</sup>), UCS (예/예/b<sup>C*/ε</sup>/같음), DFS (조건부/아니오/b<sup>m</sup>/bm), IDS (예/비용 같을 때/b<sup>d</sup>/bd)."}, {"s": "3-4", "im": ["3-4-01", "3-4-02"], "en": "Chapter 3 - Part III: Informed Search · 5. Informed Search", "ko": "3장 파트 III: 정보 탐색", "key": 1, "o": [["Now the agent gets a <b>hint</b> (informed). One function changes everything.", "이제 에이전트는 <b>힌트</b>를 얻는다(정보가 주어진다). 함수 하나가 모든 것을 바꾼다."], ["h(n): <b>the estimated cost from a node to the goal</b>", "h(n): <b>노드에서 목표까지의 추정 비용</b>"], ["Greedy best-first search: use h alone, and watch it miss the shorter route by 32 miles / A* search: f(n) = g(n) + h(n), with the proof that it is optimal", "탐욕적 최선 우선 탐색: h만 쓰고, 더 짧은 경로를 32마일 차이로 놓치는 것을 본다 / A* 탐색: f(n) = g(n) + h(n), 그리고 최적이라는 증명"], ["Admissibility and consistency - what a heuristic has to promise / Designing heuristics: relaxed problems, subproblems, dominance, pattern databases / Weighted A*, and the one parameter that contains every algorithm in this chapter", "허용성과 일관성 — 휴리스틱이 지켜야 할 약속 / 휴리스틱 설계: 완화 문제, 부분 문제, 지배, 패턴 데이터베이스 / 가중 A*, 그리고 이 장의 모든 알고리즘을 담은 하나의 매개변수"]], "x": "파트 III, <b>정보 탐색(informed search)</b>의 지도입니다. 파트 II의 알고리즘은 목표가 어디 있는지 전혀 몰랐지만, 이제 \"목표까지 대략 이만큼 남았다\"는 <b>힌트</b>를 받습니다. 그 힌트가 함수 하나, <b>h(n)</b>입니다. 줄거리:<ol><li>h(n) = 노드 n에서 목표까지 남은 비용의 <b>추정값</b>.</li><li>h만 보고 가면(<b>탐욕적 최선 우선 탐색</b>) 빠르지만 최적이 아닐 수 있다 — 루마니아 예에서 450마일 경로를 찾고 418마일 경로를 놓친다(32마일 차이).</li><li>지금까지 쓴 비용 g와 남은 추정 h를 더해 f = g + h로 가면(<b>A*</b>) 최적이다.</li><li>단, h가 <b>허용성(admissibility)</b>이라는 약속(실제보다 크게 말하지 않기)을 지켜야 한다. 더 강한 약속이 <b>일관성(consistency)</b>.</li></ol>개요의 마지막 두 항목(휴리스틱 설계, 가중 A*)은 이번 PDF에 슬라이드가 없어 이 소단원 끝에 보충으로 정리했습니다.", "pg": [[1, 0], [1, 4]]}, {"s": "3-4", "im": ["3-4-03"], "en": "Informed Search", "ko": "정보 탐색이란", "key": 1, "o": [["AI search problems generally have very large search spaces. → <b>We want to improve efficiency by expanding as few nodes as possible</b>", "AI 탐색 문제는 일반적으로 탐색 공간이 매우 크다. → <b>가능한 한 적은 노드를 확장해서 효율을 높이고 싶다</b>"], ["The agent can use extra information — a \"hint\" — to explore the more promising states first: information the agent already has (e.g. a map with the goal marked) / derived from percepts arriving through its sensors (e.g. a GPS sensor and the goal coordinates)", "에이전트는 추가 정보 — '힌트' — 를 써서 더 유망한 상태를 먼저 탐색할 수 있다: 에이전트가 이미 가진 정보(예: 목표가 표시된 지도) / 센서로 들어오는 지각에서 얻은 정보(예: GPS 센서와 목표 좌표)"], ["The agent uses a heuristic function h(n) to rank the nodes on the frontier, and a best-first search strategy always expands the most promising node on it.", "에이전트는 휴리스틱 함수 h(n)으로 프런티어의 노드에 순위를 매기고, 최선 우선 탐색 전략은 항상 그중 가장 유망한 노드를 확장한다."], ["Informed search algorithms: Greedy best-first search / A* search", "정보 탐색 알고리즘: 탐욕적 최선 우선 탐색 / A* 탐색"]], "x": "왜 정보 탐색이 필요한가: 탐색 공간이 너무 커서(3-2 17쪽) 노드를 <b>가능한 한 적게</b> 확장해야 합니다. 무정보 탐색은 목표 방향을 몰라서 '공정하게' 모든 방향을 똑같이 봤지만, 목표가 동쪽에 있다는 것을 안다면 서쪽 길을 똑같이 볼 이유가 없습니다.<br>힌트는 어디서 오나: ① 에이전트가 이미 가진 정보 — 목표 위치가 표시된 지도가 있으면 직선 거리를 잴 수 있습니다. ② 센서에서 오는 정보 — GPS로 내 좌표와 목표 좌표를 알면 역시 거리를 잴 수 있습니다.<br>쓰는 방법: 힌트를 숫자로 만든 것이 <b>휴리스틱 함수 h(n)</b>이고, 이 숫자로 프런티어 노드에 순위를 매겨 가장 유망한 것부터 꺼내는 것이 <b>최선 우선 탐색(best-first search)</b>입니다 — 3-3 16쪽에서 이미 본 BEST-FIRST-SEARCH에 f로 무엇을 넘기느냐의 문제입니다. 탐욕적 탐색은 f = h, A*는 f = g + h.", "e": "서울 → 부산 내비게이션: '부산은 남쪽'이라는 힌트만 있어도 강릉 방향 도로는 한참 뒤로 미뤄집니다. 무정보 탐색은 강릉 방향도 부산 방향과 똑같이 넓혀 갑니다."}, {"s": "3-4", "im": ["3-4-04"], "en": "Heuristic Function", "ko": "휴리스틱 함수", "key": 1, "o": [["The heuristic function h(n) estimates how close a state is to a goal.", "휴리스틱 함수 h(n)은 한 상태가 목표에 얼마나 가까운지를 추정한다."], ["Examples: Euclidean distance: straight line, ignoring obstacles / Manhattan distance; sum of the horizontal and vertical steps", "예: 유클리드 거리: 직선, 장애물 무시 / 맨해튼 거리: 가로 이동 칸 수와 세로 이동 칸 수의 합"]], "x": "<b>휴리스틱(heuristic)</b>은 '어림짐작'이라는 뜻입니다. h(n)은 노드 n에서 목표까지 남은 비용을 <b>정확히가 아니라 빠르게 어림잡은 값</b>입니다. 정확히 알려면 탐색을 다 해야 하니 의미가 없고, 대신 벽·장애물 같은 제약을 무시하고 계산해서 싸게 구합니다. 그림의 두 미로 예:<ul><li><b>유클리드 거리</b>: 시작과 목표를 자로 잰 직선 거리. 벽을 뚫고 지나간다고 치고 잰 것.</li><li><b>맨해튼 거리</b>: 바둑판 도시(맨해튼)에서 택시가 가는 것처럼 가로 칸 수 + 세로 칸 수. 역시 벽은 무시.</li></ul>둘 다 실제 미로 경로보다 <b>짧거나 같습니다</b> — 벽을 무시했으니 실제 길이 더 길 수밖에 없죠. 이 '실제보다 크게 말하지 않는다'는 성질이 24쪽의 <b>허용성(admissibility)</b>이고, A*가 최적이 되는 조건입니다. 오른쪽 로봇 그림의 계기판(Heuristi-Tron): 목표에서 멀어지면 NOPE, 가까워지면 GOAL! — h(n)이 하는 일을 그린 것입니다.", "e": "(1,1)에서 (4,5)까지: 유클리드 = √(3² + 4²) = 5, 맨해튼 = 3 + 4 = 7. 상하좌우로만 움직이는 격자라면 실제 최단 걸음 수가 7 이상이므로 맨해튼이 더 정확한(실제에 가까운) 휴리스틱입니다."}, {"s": "3-4", "im": ["3-4-05"], "en": "Example: A Heuristic for the Romania Problem", "ko": "예: 루마니아 문제의 휴리스틱", "key": 1, "o": [["h(n): estimate the driving distance from Arad to Bucharest by the straight-line distance (Euclidian)", "h(n): 아라드에서 부쿠레슈티까지의 주행 거리를 직선(유클리드) 거리로 추정한다"], ["Straight-line distance to Bucharest = h(n)", "부쿠레슈티까지의 직선 거리 = h(n)"]], "x": "3-1의 루마니아 문제에 휴리스틱을 붙입니다. 오른쪽 표가 각 도시에서 부쿠레슈티까지의 <b>직선 거리</b>이고, 이것을 h(n)으로 씁니다. 지도의 주황 화살표가 Arad → Bucharest 직선 거리 366입니다.<div class='tw'><table><tr><th>도시</th><th>h</th><th>도시</th><th>h</th><th>도시</th><th>h</th></tr><tr><td>Arad</td><td>366</td><td>Bucharest</td><td>0</td><td>Craiova</td><td>160</td></tr><tr><td>Fagaras</td><td>176</td><td>Oradea</td><td>380</td><td>Pitesti</td><td>100</td></tr><tr><td>Rimnicu Vilcea</td><td>193</td><td>Sibiu</td><td>253</td><td>Timisoara</td><td>329</td></tr><tr><td>Zerind</td><td>374</td><td>Urziceni</td><td>80</td><td>Giurgiu</td><td>77</td></tr></table></div>직선 거리는 도로 지도의 간선 비용만으로는 알 수 없는 <b>추가 정보</b>입니다(좌표가 필요). 그리고 도로는 구불구불하니 실제 주행 거리는 직선보다 항상 길거나 같습니다: Arad의 h = 366인데 실제 최단 도로 거리는 418. 목표인 Bucharest는 h = 0."}, {"s": "3-4", "im": ["3-4-06", "3-4-07", "3-4-08", "3-4-09"], "en": "Example: Greedy Best-First Search (1)–(4)", "ko": "예: 탐욕적 최선 우선 탐색 (1)–(4)", "key": 1, "o": [["<b>Expansion rule</b>: expand the node with the lowest heuristic value h(n) / Start at Arad, h = 366", "<b>확장 규칙</b>: 휴리스틱 값 h(n)이 가장 낮은 노드를 확장한다 / 아라드에서 시작, h = 366"], ["Expand Arad. Of Sibiu (253), Timisoara (329) and Zerind (374), Sibiu has the lowest h", "아라드를 확장. 시비우(253), 티미쇼아라(329), 제린드(374) 중 시비우의 h가 가장 낮다"], ["Expand Sibiu. Fagaras has h = 176, the lowest among its children / Note that Rimnicu Vilcea (193) is passed over", "시비우를 확장. 자식 중 파가라스의 h = 176이 가장 낮다 / 림니쿠빌체아(193)가 지나쳐진다는 점에 주목"], ["Expand Fagaras, and Bucharest is reached / Total: 140 + 99 + 211 = 450 miles", "파가라스를 확장하면 부쿠레슈티에 도달 / 합계: 140 + 99 + 211 = 450마일"]], "x": "<b>탐욕적 최선 우선 탐색(greedy best-first search)</b>: 프런티어에서 <b>h가 가장 작은</b>(목표에 가장 가까워 보이는) 노드를 꺼냅니다. 지금까지 온 비용 g는 전혀 보지 않습니다. 네 슬라이드를 따라가면:<div class='tw'><table><tr><th>단계</th><th>확장</th><th>프런티어 (h)</th><th>선택</th></tr><tr><td>1</td><td>Arad (366)</td><td>Sibiu 253, Timisoara 329, Zerind 374</td><td>Sibiu</td></tr><tr><td>2</td><td>Sibiu (253)</td><td>Fagaras 176, Rimnicu Vilcea 193, Oradea 380, Arad 366 (+ Timisoara, Zerind)</td><td>Fagaras</td></tr><tr><td>3</td><td>Fagaras (176)</td><td>Bucharest 0, Sibiu 253, …</td><td>Bucharest → 끝</td></tr></table></div>확장한 노드가 Arad, Sibiu, Fagaras 단 3개 — 매우 빠릅니다. 눈여겨볼 점 두 가지: ① 1단계에서 Zerind는 도로로 75밖에 안 돼 가장 싸지만 h = 374라 뒤로 밀립니다(g를 안 보니까). ② 2단계에서 Rimnicu Vilcea(193)가 Fagaras(176)에 밀려 지나쳐지는데, 실제 최단 경로는 바로 Rimnicu Vilcea를 지납니다. 결과 경로 Arad → Sibiu → Fagaras → Bucharest = 140 + 99 + 211 = <b>450마일</b>.", "e": "등산로에서 '정상이 가장 가까워 보이는 방향'으로만 걷는 사람: 빠르게 나아가지만, 눈앞에 절벽이 있으면 크게 돌아가야 합니다. 보이는 거리(h)만 믿고 실제 길의 비용은 안 본 셈입니다.", "pg": [[1, 1], [1, 1], [1, 1], [1, 1]]}, {"s": "3-4", "im": ["3-4-10"], "en": "Properties of Greedy Best-First Search", "ko": "탐욕적 최선 우선 탐색의 성질", "key": 1, "o": [["Completeness? Yes — best-first search is complete in a finite space", "완전성? 예 — 최선 우선 탐색은 유한한 공간에서 완전하다"], ["Cost optimality? No — 1. the path it found: 140 + 99 + 211 = 450 miles / 2. another path, through <b>Rimnicu Vilcea</b>: 140 + 80 + 97 + 101 = 418 miles", "비용 최적성? 아니오 — 1. 찾은 경로: 140 + 99 + 211 = 450마일 / 2. <b>림니쿠빌체아</b>를 지나는 다른 경로: 140 + 80 + 97 + 101 = 418마일"]], "x": "탐욕적 탐색은 450마일 경로를 찾았지만, Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest는 140 + 80 + 97 + 101 = <b>418마일</b>로 <b>32마일</b> 더 짧습니다(02쪽의 '32 miles'). 왜 놓쳤나: Sibiu에서 Fagaras(h = 176)가 Rimnicu Vilcea(h = 193)보다 17마일 '가까워 보였지만', Fagaras → Bucharest 도로가 211로 긴 반면 Rimnicu Vilcea → Pitesti → Bucharest는 97 + 101 = 198이었습니다. h는 어디까지나 추정이고, 탐욕적 탐색은 그 추정만 믿습니다.<br><b>완전성</b>: reached 표를 쓰는 버전(12쪽 코드)은 유한한 상태 공간에서 같은 상태를 두 번 안 가므로 결국 모든 상태를 보고, 해가 있으면 찾습니다. (보충: reached가 없는 트리 탐색 버전이면 Iasi ↔ Neamt처럼 h가 서로를 가리키는 두 도시 사이를 영원히 오갈 수 있어 불완전합니다.)"}, {"s": "3-4", "im": ["3-4-11"], "en": "Implementing Greedy Best-First Search — three strategies, one loop", "ko": "탐욕적 탐색 구현 — 세 전략, 하나의 루프", "key": 1, "o": [["It is the best-first search we already have / Expand the frontier using f(n) = h(n) / Nothing else changes — same loop, same frontier, same EXPAND", "이미 가지고 있는 최선 우선 탐색이다 / f(n) = h(n)으로 프런티어를 확장한다 / 나머지는 아무것도 바뀌지 않는다 — 같은 루프, 같은 프런티어, 같은 EXPAND"], ["BEST-FIRST-SEARCH(problem, f): f(n) = g(n) Uniform-cost search — Order by the cost already paid / f(n) = h(n) Greedy best-first search — Order by the cost still estimated / f(n) = g(n) + h(n) A* search — Order by both - next section", "BEST-FIRST-SEARCH(problem, f): f(n) = g(n) 균일 비용 탐색 — 이미 지불한 비용으로 정렬 / f(n) = h(n) 탐욕적 최선 우선 탐색 — 아직 남은 추정 비용으로 정렬 / f(n) = g(n) + h(n) A* 탐색 — 둘 다로 정렬 - 다음 절"], ["Three strategies, one loop (same). Only the key the frontier is sorted on changes.", "세 전략, 하나의 루프(같음). 프런티어를 정렬하는 키만 바뀐다."]], "x": "경로의 전체 비용은 두 토막입니다: (시작 ~ n까지 <b>이미 쓴</b> 비용 g) + (n ~ 목표까지 <b>남은</b> 비용, 추정 h). 세 알고리즘은 이 중 무엇으로 프런티어를 정렬하느냐만 다릅니다.<ul><li><b>UCS: f = g</b> — 이미 쓴 비용만. 확실하지만 목표 방향을 몰라 사방으로 퍼집니다.</li><li><b>탐욕적: f = h</b> — 남은 추정만. 목표 쪽으로 곧장 가지만 이미 쓴 비용을 무시해 비싼 길도 고릅니다.</li><li><b>A*: f = g + h</b> — 둘을 더함. 다음 절.</li></ul>같은 상황(Arad, Sibiu 확장 후)에서 세 알고리즘이 고르는 노드:<div class='tw'><table><tr><th>노드</th><th>g</th><th>h</th><th>UCS (g)</th><th>탐욕적 (h)</th><th>A* (g+h)</th></tr><tr><td>Zerind</td><td>75</td><td>374</td><td><b>75</b></td><td>374</td><td>449</td></tr><tr><td>Timisoar
