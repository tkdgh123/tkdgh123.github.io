 o:[["An agent perceives through sensors and acts through actuators; the agent function maps percept sequences to actions","에이전트는 센서로 지각하고 액추에이터로 행동한다; 에이전트 함수는 지각 순열을 행동으로 대응시킨다"],["A rational agent takes the action expected to maximize its performance measure - which is neither omniscience nor perfection, and is bounded by its own resources","합리적 에이전트는 성능 척도를 최대화할 것으로 기대되는 행동을 한다 — 전지도 완벽함도 아니며 자원에 의해 제한된다"],["PEAS writes down the four things rationality depends on. Always step one","PEAS는 합리성이 의존하는 네 가지를 적은 것. 언제나 1단계"],["Seven properties classify any environment, and each one makes a demand on the agent","일곱 가지 속성이 모든 환경을 분류하고, 각각이 에이전트에게 요구를 만든다"],["Four architectures, each fixing what the previous could not: reflex → model-based → goal-based → utility-based. Learning cuts across all four","네 아키텍처, 각각 이전 것이 못 하던 것을 고친다: 반사 → 모델 → 목표 → 효용. 학습은 넷 모두를 가로지른다"]],
 x:"2장 전체가 이 다섯 줄에 압축되어 있습니다(2-2 강의 36쪽과 같은 슬라이드)."},
{s:"2-3",im:["2-3-21","2-3-22"],en:"Where This Comes Back / Next Lecture: Solving Problems by Searching",ko:"이 내용이 다시 등장하는 곳 / 다음 강의: 탐색으로 문제 풀기",
 o:[["Weeks 3 to 5, search — how a goal-based agent actually finds its sequence of actions, using the transition model from today","3~5주 탐색 — 목표 기반 에이전트가 오늘 배운 전이 모델로 실제 행동 순서를 찾는 방법"],["Weeks 6 and 7, constraints and games — what changes when there are rules, or an opponent. Further out, decision processes and reinforcement learning — the expected-discounted-utility line","6~7주 제약과 게임 — 규칙이나 상대가 있을 때. 그 너머 결정 과정과 강화학습 — 기대 할인 효용 노선"],["A goal-based agent needs a sequence of actions, not just one. Finding that sequence is search.","목표 기반 에이전트는 행동 하나가 아니라 행동의 순서가 필요하다. 그 순서를 찾는 것이 탐색이다."],["State spaces and search trees - and why they are not the same thing · Breadth-first and depth-first search · Read: Chapter 3 (3.1–3.4)","상태 공간과 탐색 트리 — 왜 같은 것이 아닌지 · BFS와 DFS · 읽기: 3장 3.1–3.4"]],
 x:"<b>Discounted</b>(할인) = 먼 미래의 보상을 조금 덜 쳐주는 것: R<sub>0</sub> + γR<sub>1</sub> + γ²R<sub>2</sub> + … (γ=0.9면 1년 뒤 100점 = 지금 90점). 예습: 2-3 p.10의 진공청소기 상태 그래프에서 시작 → 목표(모두 깨끗) 경로를 BFS/DFS로 찾게 됩니다."},
/* ================= 3-1 ================= */
{s:"3-1",im:["3-1-01","3-1-02"],en:"Chapter 3 - Solving Problems by Searching · Recap of Chapter 2",ko:"3장 탐색을 통한 문제 해결 · 2장 복습",
 o:[["An agent perceives through sensors and acts through actuators. A rational agent takes the action expected to maximize its performance measure.","에이전트는 센서로 지각하고 액추에이터로 행동한다. 합리적 에이전트는 성능 척도를 최대화할 것으로 기대되는 행동을 한다."],["That bundle (PEAS) is the task environment. Seven properties classify any environment.","그 묶음(PEAS)이 과업 환경. 일곱 속성이 모든 환경을 분류한다."],["Four architectures: Reflex → Model-based → Goal-based (for this chapter) → Utility-based","네 아키텍처: 반사 → 모델 → 목표 기반(이번 장) → 효용"]],
 x:"3장은 네 에이전트 중 <b>goal-based agent</b>가 행동 순서(sequence of actions)를 어떻게 찾는지를 다룹니다. 강의는 UC Berkeley CS188(Dan Klein, Pieter Abbeel) 자료를 바탕으로 합니다(팩맨 예시)."},
{s:"3-1",im:["3-1-03","3-1-04"],en:"Contents · Learning Objectives",ko:"목차 · 학습 목표",
 o:[["1. What is a search problem? 2. Tree search 3. Search space 4. Uninformed search strategies 5. Informed search strategies","1. 탐색 문제란? 2. 트리 탐색 3. 탐색 공간 4. 무정보 탐색 전략 5. 정보 탐색 전략"],["Understand what a search problem is, and how a goal-based agent uses one · the various measures that describe a search space · the uninformed and informed search algorithms, and their properties","탐색 문제가 무엇이고 목표 기반 에이전트가 어떻게 쓰는지 · 탐색 공간을 설명하는 측정값 · 무정보/정보 탐색 알고리즘과 성질을 이해한다"]],
 x:"3-1 = 1번, 3-2 = 2·3번, 3-3 = 4번, 3-4 = 5번. \"various measures\"는 3-2의 <b>b</b>(branching factor), <b>m</b>(maximum depth), <b>d</b>(depth of the optimal solution)와 상태 공간 크기 — 계산 문제로 나오기 좋은 부분.",
 e:"Uninformed vs informed 미리보기: 출구 방향을 모른 채 모든 길을 가 보는 것 vs \"출구는 남동쪽\" 힌트로 그쪽부터."},
{s:"3-1",im:["3-1-05","3-1-06"],en:"1. Search Problem",ko:"1. 탐색 문제 (개요)",key:1,
 o:[["What has to be written down before any search can start?","탐색을 시작하기 전에 무엇을 적어 두어야 하는가?"],["A search problem is five things: an initial state, actions, a transition model, goal states, and an action cost function","탐색 문제는 다섯 가지다: 초기 상태, 행동, 전이 모델, 목표 상태, 행동 비용 함수"],["Transition function: ACTIONS(s) and RESULT(s, a) are functions, not stored tables - states are generated on demand.","전이 함수: ACTIONS(s)와 RESULT(s, a)는 저장된 표가 아니라 함수다 — 상태는 필요할 때 생성된다."],["Three worked examples: vacation in Romania, the vacuum-cleaner world, the sliding-tile puzzle","세 예제: 루마니아 휴가, 진공청소기 세계, 슬라이딩 타일 퍼즐"],["Choosing the state representation is a design decision, and it is the hard part","상태 표현을 고르는 것은 설계상의 결정이고, 그것이 어려운 부분이다"]],
 x:"\"함수이지 표가 아니다\": 모든 상태를 미리 표로 만들지 않고 \"이 상태에서 이 행동을 하면?\"이라고 물을 때마다 계산합니다 → 상태가 수십억 개인 문제도 다룰 수 있음.",
 e:"체스: 모든 판을 저장하는 대신 \"가능한 수는?\"(ACTIONS), \"이 수를 두면?\"(RESULT)을 규칙으로 계산."},
{s:"3-1",im:["3-1-07"],en:"Search Problem: What Is It?",ko:"탐색 문제: 무엇인가?",key:1,
 o:[["We design goal-based agents for environments that are:","다음과 같은 환경을 위한 목표 기반 에이전트를 설계한다:"],["Known: the agent knows what its actions do · Fully observable: it can see the whole state · Deterministic: the same action always gives the same result","알려진: 자기 행동이 무엇을 하는지 안다 · 완전 관측: 전체 상태를 본다 · 결정적: 같은 행동은 항상 같은 결과"],["Example: a robot in a maze — the maze is the environment","예: 미로 속 로봇 — 미로가 곧 환경이다"]],
 x:"세 조건은 \"미래를 정확히 예측할 수 있다\"를 보장 → 실제로 움직이기 전에 컴퓨터 안에서 계획을 완성할 수 있습니다. Unknown이면 계획 불가, partially observable이면 현재 위치조차 불확실, nondeterministic이면 계획이 어긋남.",
 e:"만족: 종이 미로. 불만족: 포커(부분 관측), 윷놀이(비결정적), 처음 가 본 건물(unknown)."},
{s:"3-1",im:["3-1-08"],en:"Why Search Matters",ko:"탐색이 중요한 이유",
 o:[["The algorithms we'll discuss are incredibly widely applied.","우리가 다룰 알고리즘은 믿을 수 없을 만큼 널리 쓰인다."],["Pathing and routing problems · Chip design (routing wires) and resource planning · Robot motion planning and protein design · Language analysis, machine translation, and speech recognition · Video games","경로 찾기·라우팅 · 칩 설계(배선)·자원 계획 · 로봇 동작 계획·단백질 설계 · 언어 분석·기계 번역·음성 인식 · 비디오 게임"]],
 x:"겉보기엔 달라도 모두 \"시작 상태에서 목표 상태까지 가는 좋은 행동 순서 찾기\"입니다. 기계 번역·음성 인식은 가능한 단어 조합 중 가장 그럴듯한 문장을 찾는 탐색(예: beam search)."},
{s:"3-1",im:["3-1-09"],en:"Search Problem: Recall the Goal-Based Agent",ko:"탐색 문제: 목표 기반 에이전트 다시 보기",key:1,
 o:[["The agent's task is to reach a defined goal state. Its performance measure is normally the cost of getting there","에이전트의 과제는 정해진 목표 상태에 도달하는 것. 성능 척도는 보통 거기까지 드는 비용"],["The problem-solving agent: a special kind of goal-based agent which produces a sequence of actions","문제 해결 에이전트: 행동의 순서를 만들어 내는 특별한 목표 기반 에이전트"]],
 x:"그림: Agent's location → <b>State</b> · Map of the maze → <b>What my actions do</b> · Exit location → <b>Goals</b> · 새 상자 <b>Search for a plan</b>.<div class='formula'>a<sub>i</sub> = argmin<sub>a<sub>i</sub>∈A</sub> [ Σ<sub>t=i</sub><sup>T</sup> c<sub>t</sub>  |  s<sub>T</sub> ∈ S<sub>goal</sub> ]</div>읽는 법: \"지금(i)부터 마지막(T)까지 행동 비용 c<sub>t</sub>의 합이 가장 작아지도록 행동을 고른다, 단 마지막 상태 s<sub>T</sub>는 목표 집합 안\". <b>argmin</b>은 최솟값을 만드는 <b>선택</b>을 돌려줍니다.",
 e:"등굣길: 버스 30분 vs 지하철 28분 — 둘 다 목표 도착, argmin = 지하철."},
{s:"3-1",im:["3-1-10"],en:"Search Problem: Problem Formulation",ko:"탐색 문제: 문제 정의(정식화)",key:1,
 o:[["We consider only discrete environments with an atomic state representation (1, 2, 3, …)","원자적 상태 표현(1, 2, 3, …)을 쓰는 이산 환경만 고려한다"],["The state space is the set of all states the environment can be in, including the initial state and the goal states.","상태 공간은 환경이 가질 수 있는 모든 상태의 집합이며, 초기 상태와 목표 상태를 포함한다."],["An optimal solution is the sequence of actions with the lowest path cost that reaches a goal state.","최적 해는 목표 상태에 도달하는 행동 순서 중 경로 비용이 가장 낮은 것이다."],["1) Search, or planning: the process of finding that sequence 2) In a known and deterministic environment, the agent can ignore its percepts while executing the plan (an open-loop system)","1) 탐색 또는 계획: 그 순서를 찾는 과정 2) 알려진 결정적 환경에서는 계획 실행 중 지각을 무시해도 된다(개루프)"]],
 x:"오른쪽 표 (s, a, s′) = <b>state-space graph</b>. \"1, S, 2\" = 상태 1에서 남쪽(S)으로 가면 상태 2. <b>Open-loop</b>: 계획할 때 이미 결과를 정확히 예측했으니 실행 중 확인할 필요가 없음.",
 e:"Open-loop: 전자레인지 3분. Closed-loop: 라면 끓이며 면 상태를 계속 보고 불 조절."},
{s:"3-1",im:["3-1-11"],en:"Search Problem: Problem Formulation (2)",ko:"탐색 문제: 문제 정의 (2) — 5요소",key:1,
 o:[["Initial state: where the agent starts · Actions: the set A of possible actions · Transition model: the function giving the next state when one action is taken in the current state · Goal state: a set of one or more goal states · Action cost function: what each action costs","초기 상태: 시작하는 곳 · 행동: 가능한 행동 집합 A · 전이 모델: 현재 상태에서 행동했을 때 다음 상태를 주는 함수 · 목표 상태: 하나 이상의 목표 상태 집합 · 행동 비용 함수: 각 행동의 비용"],["1) We define the initial state, the actions, the transition model and the goal states. And NOT the state space (table) itself, which is usually too large to enumerate, or continuous","1) 우리가 정의하는 것은 초기 상태, 행동, 전이 모델, 목표 상태다. 상태 공간(표) 자체는 정의하지 않는다 — 보통 너무 커서 나열할 수 없거나 연속적이기 때문"],["2) Path cost: the sum of the action costs along the sequence from initial state to goal","2) 경로 비용: 초기 상태에서 목표까지 행동 순서를 따라 더한 행동 비용의 합"]],
 x:"이 5요소가 3장 전체의 틀입니다. <b>Discretization grid</b>(이산화 격자): 연속 미로를 주황 점선으로 칸 단위(1, 4, a, …)로 잘라 셀 수 있게 만든 것. 모든 행동 비용이 1이면 경로 비용 = 행동 횟수.",
 e:"지하철 숭실대입구→강남: 초기=숭실대입구 · 행동=인접 역 이동·환승 · 전이=노선도상 다음 역 · 목표={강남} · 비용=소요 시간."},
{s:"3-1",im:["3-1-12"],en:"Search Problem: Transition Function and Actions",ko:"탐색 문제: 전이 함수와 행동",key:1,
 o:[["Transition function: f : S × A → S, or s′ = RESULT(s, a)","전이 함수: f : S × A → S, 또는 s′ = RESULT(s, a)"],["A lookup table of the transition model is a state-space graph: each row is one edge.","전이 모델의 조회표가 상태 공간 그래프다: 각 행이 간선 하나."],["ACTIONS(s) is the set of actions legal in state s. ACTIONS(4) = {E, S, N}","ACTIONS(s)는 상태 s에서 합법적인 행동 집합. ACTIONS(4) = {E, S, N}"]],
 x:"S × A = 모든 (상태, 행동) 조합. 상태 4에서 E → a, S → 5, N → 3. 서쪽(W)은 벽이라 ACTIONS(4)에 없음. 탐색 알고리즘은 이 두 함수만 반복 호출하며 그래프를 조금씩 펼칩니다.",
 e:"자판기: ACTIONS(0원) = {동전 넣기}, ACTIONS(1500원) = {동전 넣기, 음료 선택, 반환}. RESULT(1000원, 500원 넣기) = 1500원."},
{s:"3-1",im:["3-1-13"],en:"Search Problems Are Models",ko:"탐색 문제는 모델이다",key:1,
 o:[["A robot has built a blocky, pixelated model of the Earth and set it next to the real planet.","로봇이 각진 픽셀 지구 모형을 만들어 실제 지구 옆에 놓았다."],["Search never runs on the world itself - it runs on a model of the world.","탐색은 절대 세상 그 자체에서 실행되지 않는다 — 세상의 모델 위에서 실행된다."],["The model is a simplification on purpose, so a plan is only as good as the model it was found in.","모델은 일부러 단순화한 것이므로, 계획은 그것을 찾아낸 모델만큼만 좋다."]],
 x:"\"최적 해(optimal solution)\"는 \"<b>이 모델 안에서</b> 최적\"이라는 뜻. 모델이 현실을 잘못 반영하면 최적 해도 현실에서는 나쁜 계획일 수 있습니다.",
 e:"지도 앱에 어제 시작된 공사가 반영되지 않으면 '최단 경로'로 가다 막힌다 — 알고리즘이 아니라 모델이 틀린 것."},
{s:"3-1",im:["3-1-14"],en:"What's in a State Space?",ko:"상태 공간에는 무엇이 들어 있나?",key:1,
 o:[["World state: Every detail of the environment.","세계 상태: 환경의 모든 세부 사항."],["Search state: only the details needed for planning - this is abstraction.","탐색 상태: 계획에 필요한 세부 사항만 — 이것이 추상화다."],["Problem 1: Pathing - states are (x, y) locations; actions are {N, S, E, W}; the transition model updates location only; every action costs 1; the goal states are those where (x, y) == END.","문제 1 경로 찾기: 상태 (x, y), 행동 {N,S,E,W}, 위치만 갱신, 비용 1, 목표 (x, y) == END"],["Problem 2: Eat-All-Dots - states are {(x, y), dot booleans}; actions are {N, S, E, W}; the transition model updates location and possibly a dot boolean; every action costs 1; the goal states are those where all dots are false.","문제 2 모든 점 먹기: 상태 {(x, y), 점 불리언}, 위치와 점 불리언 갱신, 비용 1, 목표 = 모든 점이 false"]],
 x:"팩맨 화면에는 유령 위치·점수·목숨·방향 등 정보가 많지만(world state), 문제에 필요한 것만 상태에 넣습니다. 같은 게임이라도 <b>문제에 따라 상태 정의가 달라진다</b> → 3-2의 상태 수 120 vs 120 × 2<sup>30</sup>.",
 e:"짐 싸기: 당일치기엔 지갑·폰만, 일주일 여행엔 옷까지. 너무 많이 넣으면 상태 수 폭발, 너무 적으면 못 푼다."},
{s:"3-1",im:["3-1-15"],en:"Example: Vacation in Romania",ko:"예시: 루마니아 휴가",key:1,
 o:[["You are on holiday in Arad and fly out of Bucharest tomorrow.","당신은 아라드에서 휴가 중이고 내일 부쿠레슈티에서 비행기를 탄다."],["Initial state: Arad · Actions: drive from one city to another · Transition model: leaving city A for city B lands you in B · Goal state: Bucharest · Action cost: distance travelled · Set of actions (Path) cost: total distance to the goal","초기: 아라드 · 행동: 도시 간 운전 · 전이: A를 떠나 B로 가면 B 도착 · 목표: 부쿠레슈티 · 행동 비용: 이동 거리 · 경로 비용: 목표까지 총 거리"]],
 x:"교재(AIMA)의 대표 예제. 실제 지도를 도시와 도로만 남긴 그래프로 <b>추상화</b>했고 도로 옆 숫자(마일)가 행동 비용.<div class='tw'><table><tr><th>Path</th><th>Cost</th></tr><tr><td>Arad → Sibiu → Fagaras → Bucharest (3 moves)</td><td>140+99+211 = 450</td></tr><tr><td>Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest (4 moves)</td><td>140+80+97+101 = <b>418 (optimal)</b></td></tr></table></div>거치는 도시 수가 적다고 비용이 싼 것은 아닙니다 — 그래서 탐색이 필요."},
{s:"3-1",im:["3-1-16"],en:"Example 2: The Vacuum-Cleaner World",ko:"예시 2: 진공청소기 세계",key:1,
 o:[["States — which of the two rooms holds the agent, and where the dirt is · Initial state — any of them","상태 — 에이전트가 어느 방에 있는지, 먼지가 어디 있는지 · 초기 상태 — 그중 아무거나"],["Actions — Left, Right, Suck · Transition model — move, or remove the dirt · Goal state — both rooms clean","행동 — 왼쪽, 오른쪽, 흡입 · 전이 — 이동하거나 먼지 제거 · 목표 — 두 방 모두 깨끗"],["Action cost — 1 per action, so path cost counts actions · 8 atomic states can be represented","행동 비용 — 행동당 1, 경로 비용 = 행동 수 · 8개의 원자적 상태"]],
 x:"맨 윗줄 = 두 방 모두 더러움, 가운데 = 한 방만 더러움, 맨 아랫줄(주황 테두리) = <b>goal states</b> 2개(청소기가 A든 B든). 8 = 위치 2 × A 먼지 2 × B 먼지 2.",
 e:"최적 해: [A, 둘 다 더러움] → Suck → Right → Suck → 목표. 행동 3개 = 경로 비용 3 (3-2에서 d = 3)."},
{s:"3-1",im:["3-1-17"],en:"Example 3: The Sliding-Tile Puzzle",ko:"예시 3: 슬라이딩 타일 퍼즐",key:1,
 o:[["States: tile positions · Initial state: the left-bottom figure","상태: 타일 위치 · 초기 상태: 왼쪽 아래 그림"],["Actions: move the blank tile left, right, up or down.","행동: 빈칸을 왼쪽·오른쪽·위·아래로 옮긴다."],["Transition model: swap the blank with the position of the tile the moved into it.","전이 모델: 빈칸과 그 자리로 옮겨 온 타일의 위치를 맞바꾼다."],["Goal state: the tiles in order as the right-bottom figure.","목표 상태: 오른쪽 아래 그림처럼 타일이 순서대로."]],
 x:"실제로는 타일을 밀지만 \"<b>빈칸(blank)</b>을 움직인다\"고 보면 행동이 4가지로 단순해집니다 — 상태 표현·행동 정의가 설계상의 결정이라는 좋은 예. 빈칸이 가운데면 4방향, 변이면 3, 모서리면 2.<div class='warn'>확인 포인트: 슬라이드의 'Action cost' 줄은 Goal state 문장이 복사된 것으로 보입니다. 교재 기준 행동 비용은 이동 한 번당 1.</div>"},
{s:"3-1",im:["3-1-18"],en:"Example: How Big Is the Puzzle?",ko:"예시: 퍼즐은 얼마나 큰가?",key:1,
 o:[["Each state is a placement of the tiles, blank included. Half of the permutations are unreachable from any given start","각 상태는 빈칸 포함 타일 배치 하나. 순열의 절반은 어떤 시작에서도 도달 불가"],["8-puzzle — 9!/2 = 181,440 states · 15-puzzle — 16!/2 ≈ 10^13 states · 24-puzzle — 25!/2 ≈ 10^25 states","8-퍼즐 181,440 · 15-퍼즐 약 10^13 · 24-퍼즐 약 10^25"],["Going from the 15-puzzle to the 24-puzzle multiplies the state space by about 10^12","15 → 24퍼즐로 가면 상태 공간이 약 10^12배"],["Both flip together, every single move — so the sum never changes. 9! = 362,880 splits in two, and no legal move crosses.","둘이 매 이동마다 함께 뒤집혀 합은 변하지 않는다. 9! = 362,880이 둘로 나뉘고 어떤 합법적 이동도 경계를 넘지 못한다."]],
 x:"칸을 밝은/어두운 체스판으로 칠하면 빈칸은 이동마다 밝은↔어두운 칸을 오가고(<b>blank on light/dark</b> 0↔1), 동시에 순열의 짝/홀(<b>permutation even/odd</b>)도 뒤집힙니다. 두 값이 함께 뒤집히므로 SUM(mod 2)은 <b>불변량(invariant)</b> → SUM=0 세계에서 시작하면 SUM=1 세계(181,440개)로는 영원히 못 감.",
 e:"목표에서 1과 2만 바꿔 끼운 배치는 절대 못 푼다(샘 로이드의 15-퍼즐 상금 일화). 8-퍼즐 최적 해는 최대 31수."},

/* ================= 3-2 ================= */
{s:"3-2",im:["3-2-01","3-2-02"],en:"2. Tree Search",ko:"2. 트리 탐색 (개요)",key:1,
 o:[["The state space is a graph. A search tree is not. What happens in between?","상태 공간은 그래프다. 탐색 트리는 아니다. 그 사이에서 무슨 일이?"],["Cycles and redundant paths — in tree, Seoul ≠ Seoul → Busan → Seoul ≠ S → B → S → B → S","사이클과 중복 경로 — 트리에서는 서울 ≠ 서울→부산→서울 ≠ …"],["The frontier: known but not yet expanded, also called the open list","프런티어: 알려졌지만 아직 확장되지 않은 것, 개방 목록이라고도 함"],["In tree, nodes are paths, not states: eight states, an infinite tree","트리에서 노드는 상태가 아니라 경로다: 상태는 8개, 트리는 무한"],["One loop that every strategy in this chapter is a special case of · The four questions asked of any search strategy: complete, optimal, time, space","이 장의 모든 전략이 특수한 경우가 되는 하나의 반복문 · 모든 탐색 전략에 던지는 네 질문: 완전성, 최적성, 시간, 공간"]],
 x:"지도(graph)에서 '서울'은 하나지만, 탐색 트리에서는 \"처음 서울\"과 \"부산 갔다 돌아온 서울\"이 서로 다른 노드입니다 — 도착한 <b>경로</b>가 다르기 때문. 왕복이 가능하면 트리는 끝없이 깊어질 수 있음.",
 e:"일기장: '우리 집'은 하나지만 \"아침에 집\"과 \"학교 갔다 돌아온 집\"은 다른 줄로 기록된다."},
{s:"3-2",im:["3-2-03"],en:"Tree Search: Solving a Search Problem",ko:"트리 탐색: 탐색 문제 풀기",
 o:[["We have the problem formulation: initial state, actions, transition model, goal states, action cost function","문제 정의는 있다: 초기 상태, 행동, 전이 모델, 목표 상태, 행동 비용 함수"],["So how do we actually find the optimal solution? → Build a search tree over the state-space graph","그럼 최적 해는 어떻게 찾나? → 상태 공간 그래프 위에 탐색 트리를 만든다"]],
 x:"그림: 진공청소기 상태 공간 위의 주황 화살표 = 초기 상태 → 목표 상태로 가는 한 경로. 빨간 \"<b>State space ≠ SEARCH TREE</b>\" — 이 그래프 자체가 탐색 트리는 아니라는 강조."},
{s:"3-2",im:["3-2-04"],en:"Tree Search: The Transition Model Is a Graph, Not a Tree",ko:"트리 탐색: 전이 모델은 트리가 아니라 그래프다",key:1,
 o:[["Cycles: paths that come back to the same state","사이클: 같은 상태로 되돌아오는 경로"],["Non-cycle redundant paths: several different paths that reach the same state","사이클이 아닌 중복 경로: 같은 상태에 도달하는 서로 다른 여러 경로"],["Both have to be dealt with before a graph can be searched as a tree","그래프를 트리처럼 탐색하려면 둘 다 처리해야 한다"]],
 x:"<b>Cycle</b>: 주황 고리 — 왼쪽 방에서 L(제자리), R 후 L(원래로). 그대로 두면 L, L, L…을 끝없이 반복. <b>Redundant path</b>: Path 1(초록)과 Path 2(파랑)가 같은 목표에 도착 → 같은 상태를 두 번 조사(시간 낭비). 차이: 사이클은 <b>한 경로 안</b>의 반복, 중복 경로는 <b>서로 다른 두 경로</b>가 만남.",
 e:"사이클: 에스컬레이터 1층↔2층 반복. 중복 경로: 편의점까지 큰길 vs 골목."},
{s:"3-2",im:["3-2-05"],en:"Tree Search: Generating the Search Tree",ko:"트리 탐색: 탐색 트리 생성하기",key:1,
 o:[["Overlay a \"what-if tree\" of possible actions on the state-space graph. The root node is the initial state.","상태 공간 그래프 위에 가능한 행동의 '만약에 트리'를 겹친다. 루트 노드는 초기 상태다."],["A child is reached along an edge representing an action, and the transition model says which state that child is.","자식은 행동을 나타내는 간선을 따라 도달하며, 그 자식이 어떤 상태인지는 전이 모델이 알려 준다."],["A tree cannot contain a cycle — a cycle in the search space becomes an infinite loop, so it must be cut.","트리는 사이클을 포함할 수 없다 — 무한 루프가 되므로 잘라야 한다."],["A tree cannot contain two paths to the same state — that is a redundant path; removing it improves efficiency","트리는 같은 상태로 가는 두 경로를 포함할 수 없다 — 중복 경로이며, 없애면 효율이 좋아진다"],["A path through the tree is a sequence of actions; a solution is a path ending at a goal node","트리를 지나는 경로는 행동의 순서이고, 해는 목표 노드에서 끝나는 경로다"]],
 x:"그림: 루트 a → b, c. b→d→b는 <b>Cycle</b>(✕), c→e는 이미 b→e로 도달한 e에 또 가는 <b>Non-cycle redundant path</b>(✕). 주황 굵은 선 a→b→d→…→f가 <b>Goal state node</b> f에 도달한 해.",
 e:"오목 수 읽기: \"여기 두면(edge=action) → 판이 이렇게(child)\". 이미 따져 본 판이 다른 수순으로 또 나오면 건너뜀."},
{s:"3-2",im:["3-2-06"],en:"Tree Search: Nodes Are Not States",ko:"트리 탐색: 노드는 상태가 아니다",key:1,
 o:[["This is the distinction students lose most often","이것은 학생들이 가장 자주 놓치는 구분이다"],["Each node of the tree stands for one state of the system. But it is not the same thing as that state","트리의 각 노드는 한 상태를 나타낸다. 하지만 그 상태와 같은 것은 아니다"],["But when redundant paths cannot be fully prevented, the same state appears as several different nodes.","중복 경로를 완전히 막을 수 없으면 같은 상태가 여러 노드로 나타난다."],["State space: the world. One node per state. Fixed. A graph · Search tree: the record of what we tried. One node per PATH. Built as we go. Always a tree. Can be infinite","상태 공간: 세상. 상태당 노드 1개. 고정. 그래프 · 탐색 트리: 시도한 것의 기록. 경로당 노드 1개. 진행하며 생성. 항상 트리. 무한할 수 있음"],["The vacuum world has 8 states and an infinite search tree","진공청소기 세계는 상태 8개, 탐색 트리는 무한"]],
 x:"<div class='tw'><table><tr><th></th><th>State space (graph)</th><th>Search tree</th></tr><tr><td>무엇</td><td>the world</td><td>record of what we tried</td></tr><tr><td>노드 1개</td><td>one state</td><td>one <b>path</b></td></tr><tr><td>생성</td><td>fixed</td><td>built as we go</td></tr><tr><td>크기</td><td>유한 가능 (vacuum: 8)</td><td>무한 가능 (vacuum: ∞)</td></tr></table></div>(보충: 노드 = STATE, PARENT, ACTION, PATH-COST g(n). 같은 상태여도 부모·비용이 다르면 다른 노드)",
 e:"숭실대입구→고속터미널→강남의 '강남'과 숭실대입구→사당→강남의 '강남'은 같은 상태, 다른 노드."},
{s:"3-2",im:["3-2-07"],en:"State Space Graphs vs. Search Trees",ko:"상태 공간 그래프 vs 탐색 트리",
 o:[["The same problem drawn both ways: the state space graph on one side, the search tree unrolled from S on the other","같은 문제를 두 방식으로: 한쪽은 상태 공간 그래프, 다른 쪽은 S에서 펼친 탐색 트리"],["State e appears once in the graph but many times in the tree once for every path that reaches it. Count them","상태 e는 그래프에 한 번 나오지만 트리에는 도달하는 경로마다 한 번씩. 세어 보라"],["Each NODE in the search tree is an entire PATH in the state space graph. We construct both on demand – and we construct as little as possible.","탐색 트리의 각 노드는 상태 공간 그래프의 경로 전체다. 둘 다 필요할 때, 가능한 한 적게 만든다."]],
 x:"\"세어 보라\"의 답: 트리에서 e는 2번(S→d→e, S→e). 목표 G도 2번. 좋은 탐색 전략일수록 트리를 적게 펼치고 목표를 찾습니다."},
{s:"3-2",im:["3-2-08"],en:"Tree Search: Classical Tree Search vs AI Search",ko:"고전적 트리 탐색 vs AI 탐색",key:1,
 o:[["Classical: The tree is given, and held in memory · The tree has no redundant or cyclic paths","고전: 트리가 주어져 있고 메모리에 있다 · 중복·순환 경로가 없다"],["AI: The search tree is far too large to hold in memory — part of the tree is built from the initial state using the transition function; memory management is critical · The search space is usually a very large, complex graph","AI: 탐색 트리가 메모리에 담기엔 너무 크다 — 초기 상태에서 전이 함수로 일부를 만들어 가며, 메모리 관리가 결정적 · 탐색 공간은 대개 매우 크고 복잡한 그래프"],["Memory-efficient cycle checking matters · Checking for redundant paths often costs too much memory, so we accept searching the same part more than once","메모리 효율적인 사이클 검사가 중요 · 중복 경로 검사는 메모리가 너무 많이 들어 같은 부분을 여러 번 탐색하는 것을 감수한다"],["The difference is whether the tree already exists.","차이는 트리가 이미 존재하느냐다."]],
 x:"<b>Cycle check</b>는 부모를 따라 올라가며 \"현재 경로 안에 같은 상태가 있나\"만 보면 되어 싸고, <b>redundant path check</b>는 \"지금까지 방문한 모든 상태\"를 기억해야 해서 메모리가 많이 듭니다. (보충: reached/explored를 쓰면 graph search, 안 쓰면 tree-like search)",
 e:"고전: 폴더 트리에서 파일 찾기. AI: 체스 AI가 규칙으로 다음 판들을 만들어 가며 탐색."},
{s:"3-2",im:["3-2-09"],en:"Tree Search: Summary of the Algorithm",ko:"트리 탐색: 알고리즘 요약",key:1,
 o:[["1. Initialise the FRONTIER with the start state (root node) — the frontier is the set of known but not-yet-expanded nodes","1. 프런티어를 시작 상태(루트)로 초기화 — 알려졌지만 아직 확장되지 않은 노드 집합"],["2. While the frontier is not empty: a) Choose the next node to expand from the frontier, according to the SEARCH STRATEGY b) If that node represents a goal state, return it as the solution c) Otherwise EXPAND the node — apply every possible action using the transition model — and add the child nodes for the newly reached states to the frontier","2. 프런티어가 비어 있지 않은 동안: a) 탐색 전략에 따라 다음 노드 고르기 b) 목표 상태면 해로 반환 c) 아니면 확장 — 전이 모델로 모든 행동 적용 — 새로 도달한 자식들을 프런티어에 추가"]],
 x:"이것이 \"이 장의 모든 전략이 특수한 경우가 되는 하나의 반복문\" — BFS, DFS, UCS, A*는 모두 a) 단계에서 <b>무엇을 먼저 꺼내느냐</b>만 다릅니다. 프런티어가 비면 실패.<div class='formula'>frontier = [root]<br>while frontier: node = pick(frontier)  # strategy<br>&nbsp;&nbsp;if goal(node): return node<br>&nbsp;&nbsp;for a in ACTIONS(node.state): frontier.add(child(RESULT(node.state, a)))</div>",
 e:"맛집 탐방: '가 볼 곳 목록'(frontier)에서 하나 골라 가 보고, 인생 맛집이면 끝, 아니면 사장님 추천 가게를 목록에 추가(expand)."},
{s:"3-2",im:["3-2-10","3-2-11","3-2-12"],en:"Example: Travelling in Romania (1)–(3)",ko:"예시: 루마니아 여행 (1)–(3)",key:1,
 o:[["(1) The frontier holds Arad alone. Nothing has been expanded yet. The dashed nodes below do not exist now. They are only drawn to show where children will go.","(1) 프런티어엔 아라드만. 아직 아무것도 확장 안 됨. 점선 노드는 지금 존재하지 않는다 — 자식이 생길 자리를 보여 줄 뿐."],["(2) Expand Arad. Its three children (Sibiu, Timisoara, Zerind) are generated and join the frontier. Arad leaves the frontier","(2) 아라드 확장. 세 자식이 생성되어 프런티어에 합류. 아라드는 프런티어를 떠난다"],["(3) Expand Sibiu. Arad has reappeared one level down (the same state) reached by a different path. That is a cycle. We could just as well have expanded Timisoara or Zerind instead","(3) 시비우 확장. 아라드가 한 단계 아래 다시 나타났다(같은 상태, 다른 경로). 사이클이다. 티미쇼아라나 제린드를 확장했어도 괜찮았다"]],
 x:"<div class='tw'><table><tr><th>step</th><th>expanded</th><th>frontier</th></tr><tr><td>0</td><td>—</td><td>{Arad}</td></tr><tr><td>1</td><td>Arad</td><td>{Sibiu, Timisoara, Zerind}</td></tr><tr><td>2</td><td>Sibiu</td><td>{Timisoara, Zerind, <u>Arad</u>, Fagaras, Oradea, Rimnicu Vilcea}</td></tr></table></div>밑줄 친 Arad는 사이클 노드 — 사이클 검사를 하면 넣지 않습니다. \"티미쇼아라나 제린드를 확장해도 됐다\" = 어떤 노드를 먼저 꺼낼지는 <b>search strategy</b>가 정한다."},
{s:"3-2",im:["3-2-13"],en:"Search Strategies: Properties",ko:"탐색 전략: 성질",key:1,
 o:[["A search strategy decides the order in which nodes are expanded","탐색 전략은 노드가 확장되는 순서를 정한다"],["Completeness - does it always find a solution when one exists? · Cost optimality - does it always find the lowest-cost solution? · Time complexity - how long does it take? · Space complexity - how much memory does it need?","완전성 — 해가 있으면 항상 찾는가? · 비용 최적성 — 항상 최소 비용 해를 찾는가? · 시간 복잡도 — 얼마나 오래? · 공간 복잡도 — 메모리가 얼마나?"],["We will discuss several strategies and compare them on these four","여러 전략을 이 넷으로 비교할 것이다"]],
 x:"시험 단골: \"OO 탐색은 complete한가? optimal한가? time·space complexity는?\" 시간·공간은 보통 b, d, m을 이용한 식으로 나타냅니다.",
 e:"잃어버린 열쇠: 방을 전부 뒤지면 반드시 찾음(complete). 가까운 곳부터 뒤지면 가장 가까운 열쇠를 먼저(optimal)."},
{s:"3-2",im:["3-2-14"],en:"3. Search Space",ko:"3. 탐색 공간 (개요)",
 o:[["How large is the thing we are searching, and how would we know?","우리가 탐색하는 대상은 얼마나 크며, 어떻게 알 수 있는가?"],["b, m and d — branching factor, maximum depth, depth of the optimal solution · Counting the state space by multiplying out its independent parts · Counting the search tree instead, which is the number that governs cost","b, m, d — 분기 계수, 최대 깊이, 최적 해의 깊이 · 상태 공간을 독립 부분으로 나누어 곱해서 세기 · 대신 탐색 트리를 세기 — 이것이 비용을 좌우"],["The same four problems measured twice: maze, 8-queens, 8-puzzle, tic-tac-toe · Memory runs out well before time does","같은 네 문제를 두 번 측정 · 메모리는 시간보다 훨씬 먼저 바닥난다"]],
 x:"\"Memory runs out well before time does\": 노드를 전부 저장하는 방식은 몇 시간 기다릴 수는 있어도 수십 GB 메모리를 먼저 다 써 버립니다. (보충: b=10, 초당 백만 노드, 노드당 1KB면 깊이 10에서 시간 3시간 미만, 메모리 약 10TB)"},
{s:"3-2",im:["3-2-15"],en:"Search Space: Time and Space Complexity",ko:"탐색 공간: 시간·공간 복잡도",
 o:[["Both depend on the number n of tree nodes searched before the goal is found. O(n)","둘 다 목표를 찾기 전까지 탐색한 트리 노드 수 n에 달려 있다. O(n)"],["Estimate the size of the reachable state space. The larger it is, the harder the search. Or estimate the number of searched tree nodes directly","도달 가능한 상태 공간 크기를 추정 — 클수록 어렵다. 또는 탐색한 트리 노드 수를 직접 추정"],["Estimating complexity tells us: How hard is this problem? Which algorithm will fit in memory? Can we find a solution fast enough? Can we find the optimal solution, or must we use a heuristic?","추정하면 알 수 있다: 얼마나 어려운가? 어떤 알고리즘이 메모리에 들어가나? 충분히 빨리 찾나? 최적 해냐 휴리스틱이냐?"]],
 x:"노드 하나를 만들고 검사하는 비용을 상수로 보면 전체 비용은 n에 비례 → \"복잡도 추정 = n 추정\". 두 방법: ① 상태 공간 크기(17~20쪽) ② b, m, d로 트리 크기(21~24쪽). <b>Heuristic</b> = 보장은 없지만 빠르게 좋은 답을 찾게 돕는 경험적 규칙.",
 e:"8-퍼즐(약 18만 상태)은 전부 뒤져도 금방 → 최적 해. 24-퍼즐(약 10<sup>25</sup>)은 휴리스틱 필요."},
{s:"3-2",im:["3-2-16"],en:"Search Space: Big-O Notation",ko:"탐색 공간: 빅오 표기법",key:1,
 o:[["As the input grows, the highest-order term dominates and the rest stop mattering","입력이 커지면 최고차항이 지배하고 나머지는 중요하지 않게 된다"],["Example: T(n) = n² + n + 1 — n=1: 3 (n² is 33.3%) · n=10: 111 (90%) · n=100: 10,101 (99%) · n=1,000: 1,001,001 (99.9%)","예: T(n) = n² + n + 1 — n이 커질수록 n²의 비중 33.3% → 99.9%"],["⇒ O(T(n)) = O(n² + n + 1) = O(n²)","⇒ O(n²)"]],
 x:"괄호 속 %는 전체 T(n) 중 n²이 차지하는 비율. 큰 문제에서는 가장 빨리 자라는 항만 보면 됩니다. 탐색에서는 1 + b + … + b<sup>m</sup>에서 b<sup>m</sup>만 남겨 <b>O(b<sup>m</sup>)</b>.",
 e:"n명이 서로 악수: n(n−1)/2 = 0.5n² − 0.5n → O(n²). 인원 2배면 악수 약 4배."},
{s:"3-2",im:["3-2-17"],en:"Search Space: Estimating the State-Space Size",ko:"탐색 공간: 상태 공간 크기 추정하기",key:1,
 o:[["The state space is the set of different states the agent and its environment can be in","상태 공간은 에이전트와 환경이 있을 수 있는 서로 다른 상태들의 집합"],["Reachable states are defined by the initial state and the transition model: only those matter for search","도달 가능한 상태는 초기 상태와 전이 모델로 정의된다: 탐색에는 이것들만 중요"],["Even when the algorithm treats states as atomic, we can use a factored representation internally to estimate the size.","알고리즘이 상태를 원자적으로 다뤄도, 크기 추정엔 요인적 표현을 쓸 수 있다."],["With l fluents (variables): n = |X1| × |X2| × ⋯ × |Xl|, where |·| is the number of values that variable can take","플루언트(변수) l개: n = |X1| × |X2| × ⋯ × |Xl|, |·|는 그 변수의 값 개수"]],
 x:"변수들이 독립이면 각 변수의 경우의 수를 곱하면 됩니다(곱의 법칙). 곱셈 결과는 '이론상 가능한' 개수이고, 실제 <b>reachable</b> 상태는 더 적을 수 있음(8-퍼즐은 정확히 절반).",
 e:"자물쇠 다이얼 4개 × 0~9 = 10<sup>4</sup>. 신호등 2개 {빨·노·초} = 9, 하지만 '둘 다 초록'은 도달 불가."},
{s:"3-2",im:["3-2-18"],en:"Example: State-Space Size?",ko:"예시: 상태 공간 크기는?",key:1,
 o:[["1. Dirt — A and B are different rooms; order does not matter. Dirt can be in either room, clean or dirty: 2 choices each. r^n = 2² where r is the room conditions and n is the number of rooms","1. 먼지 — A·B는 다른 방. 각 방은 깨끗/더러움 2가지 → r^n = 2² (r: 방 상태 가짓수, n: 방 개수)"],["2. Robot location — the robot is in one of the 2 rooms → 2","2. 로봇 위치 — 2개 방 중 하나 → 2"],["3. Total: N_state = 2 × 2² = 2³ = 8","3. 합계: 2 × 2² = 2³ = 8"]],
 x:"그림의 홀수 번호(1,3,5,7)는 로봇이 왼쪽, 짝수는 오른쪽. 7·8번이 목표 상태. 주의: 여기서 n은 '방의 개수'로, 15쪽의 '노드 수 n'과 다른 뜻.",
 e:"방이 k개면 k × 2<sup>k</sup>: 방 3개 → 24, 방 10개 → 10,240."},
{s:"3-2",im:["3-2-19"],en:"Example: State-Space Size? (2)",ko:"예시: 상태 공간 크기는? (2)",key:1,
 o:[["The complexity of a search problem can be estimated by computing a rough upper limit.","탐색 문제의 복잡도는 대략적인 상한을 계산해서 추정할 수 있다."],["Maze: n = number of grid cells the agent can be in · 8-queens: place 8 queens on 64 squares, n = C(64, 8) ≈ 4.4 × 10^9","미로: n = 에이전트가 있을 수 있는 격자 칸 수 · 8-퀸: 64칸에 퀸 8개, n = C(64,8) ≈ 4.4×10^9"],["8-puzzle: 9 cells to fill, blank included, so n ≤ 9!; half are unreachable: n = 9!/2 = 181,440 · Tic-tac-toe: n < 3^9 = 19,683","8-퍼즐: n ≤ 9!, 절반 도달 불가 → 181,440 · 틱택토: n < 3^9 = 19,683"]],
 x:"8-퀸 상한은 \"서로 공격하지 않음\" 조건을 무시한 값. 틱택토 3<sup>9</sup>은 각 칸 {X, O, 빈칸}이지만 \"X가 O보다 3개 많음\" 같은 불가능한 판도 포함하므로 \"&lt;\". (보충: 실제 가능한 틱택토 판 5,478개, 8-퀸 해 92개)"},
{s:"3-2",im:["3-2-20"],en:"Example: State-Space Size in Pac-Man",ko:"예시: 팩맨의 상태 공간 크기",key:1,
 o:[["World state: agent position on a 12x10 grid. Status of 30 dots (eaten or not), two ghosts each on a 12x1 corridor, and the agent's direction (NSEW).","세계 상태: 12×10 격자 위치, 점 30개(먹음/안 먹음), 12×1 통로의 유령 2마리, 방향(동서남북)"],["How many world states? 120 × 2^30 × 12² × 4 = 74,217,034,874,880","세계 상태 수? 약 74조"],["How many states for pathing? 120 · How many states for eat-all-dots? 120 × 2^30","경로 찾기 상태 수? 120 · 모든 점 먹기? 120 × 2^30"]],
 x:"<div class='tw'><table><tr><th>variable</th><th>values</th></tr><tr><td>Pac-Man position</td><td>12 × 10 = 120</td></tr><tr><td>30 dots</td><td>2<sup>30</sup> ≈ 10.7억</td></tr><tr><td>2 ghosts</td><td>12² = 144</td></tr><tr><td>direction</td><td>4</td></tr></table></div>유령·방향은 두 문제 모두에 불필요해 뺍니다 — 3-1 14쪽의 <b>abstraction</b>이 상태 수를 약 74조 → 120으로 줄인 셈."},
{s:"3-2",im:["3-2-21"],en:"Search Space: Estimating the Search-Tree Size",ko:"탐색 공간: 탐색 트리 크기 추정하기",key:1,
 o:[["Often more useful than estimating the state space. It matters especially where redundant paths let one state be represented by many nodes.","상태 공간 추정보다 더 유용할 때가 많다. 특히 중복 경로 때문에 한 상태가 여러 노드로 나타날 때 중요하다."],["Estimated from the problem formulation — initial state, actions, transition function","문제 정의(초기 상태, 행동, 전이 함수)로부터 추정한다"],["b — maximum branching factor = the largest number of possible actions · m — maximum tree depth = the length of the longest path once cycles are removed · d — depth of the optimal solution = the shortest path length from the initial state to a goal","b — 최대 분기 계수 = 가능한 행동의 최대 개수 · m — 최대 트리 깊이 = 사이클 제거 후 가장 긴 경로 · d — 최적 해의 깊이 = 초기 상태에서 목표까지 가장 짧은 경로"],["The number of searched nodes is n = f(b, m, d) ⇒ O(f(b, m, d))","탐색한 노드 수 n = f(b, m, d) ⇒ O(f(b, m, d))"]],
 x:"탐색 비용을 정하는 건 \"상태가 몇 개냐\"가 아니라 \"트리 노드를 몇 개 만드냐\". 항상 <b>d ≤ m</b>. 다음 강의: BFS는 d에, DFS는 m에 비용이 좌우됩니다.",
 e:"전화 연락망: 한 명이 3명에게(b=3), 최대 5단계(m=5), 찾는 친구는 2단계(d=2) → 너비로 찾으면 1+3+9 = 13명 안."},
{s:"3-2",im:["3-2-22"],en:"Search Space: Reading b, m and d Off a Graph",ko:"탐색 공간: 그래프에서 b, m, d 읽어내기",key:1,
 o:[["b — maximum branching factor = largest number of actions (L, R, S) → 3","b — 최대 분기 계수 = 행동의 최대 개수(L, R, S) → 3"],["m — maximum tree depth = longest path with cycles removed → 5","m — 최대 트리 깊이 = 사이클 제거 후 가장 긴 경로 → 5"],["d — depth of the optimal solution = shortest path from the initial state to a goal → 3","d — 최적 해의 깊이 = 초기 상태에서 목표까지 최단 경로 → 3"],["Duplicate edges are dropped to turn the transition-model graph into a tree. ✕: You must remove the cycles before you can count m.","중복 간선을 없애 전이 모델 그래프를 트리로 바꾼다. ✕: m을 세려면 먼저 사이클을 제거해야 한다."]],
 x:"m = 5인 가장 긴 경로: [A, 둘 다 더러움] –R→ [B, 둘 다 더러움] –S→ [B, A만 더러움] –L→ [A, A만 더러움] –S→ [A, 깨끗] –R→ [B, 깨끗]. 먼지는 줄어들기만 하므로 사이클 없이 방문 가능한 상태는 최대 6개 = 간선 5개. 사이클을 안 지우면 L, L, L … → m = ∞."},
{s:"3-2",im:["3-2-23"],en:"Example: Search Complexity",ko:"예시: 탐색 복잡도",key:1,
 o:[["Maze: b = 4 actions · m = longest path to the goal (bounded by the x × y grid) · d = shortest path to the goal (same bound)","미로: b = 4 · m ≤ x·y · d ≤ x·y"],["8-queens: b = 8, eight rows in a column · m = 8, there are eight columns · d = 8, one queen placed per column","8-퀸: b = 8(한 열에 8행) · m = 8(8열) · d = 8(열마다 퀸 하나)"],["8-puzzle: b = move the blank tile in 4 directions · m = try all, O(9!/2) · d ≤ 31","8-퍼즐: b = 빈칸 4방향 · m = 전부 시도 O(9!/2) · d ≤ 31"],["Tic-tac-toe: b = 9 actions · m = 9 · d = 5 (xoxox → x player get straight)","틱택토: b = 9 · m = 9 · d = 5 (X,O,X,O,X → X가 한 줄 완성)"]],
 x:"8-퀸은 <b>d = m = 8</b>(해가 항상 맨 아래), 틱택토는 <b>d = 5, m = 9</b>(목표가 중간 깊이에도 있음). 이 차이가 다음 슬라이드의 \"빨간 목표 노드가 여러 깊이에 있다\"와 연결됩니다."},
{s:"3-2",im:["3-2-24"],en:"How Many Nodes Are in the Whole Tree?",ko:"전체 트리에는 노드가 몇 개인가?",key:1,
 o:[["b is the branching factor and m the maximum depth — the same two just measured","b는 분기 계수, m은 최대 깊이 — 방금 잰 그 두 값"],["Each tier holds b times as many nodes as the one above it: 1, b, b², …, b^m","각 층은 바로 위층보다 b배 많은 노드: 1, b, b², …, b^m"],["1 + b + b² + ⋯ + b^m = O(b^m): The whole tree costs about what its bottom row costs.","1 + b + … + b^m = O(b^m): 트리 전체 비용 ≈ 맨 아래 줄의 비용"],["The red nodes are goals, and they sit at various depths — which is exactly why d and m are two different numbers","빨간 노드는 목표이며 여러 깊이에 있다 — 그래서 d와 m은 서로 다른 두 수"],["Every time and space bound in Part II (the next lecture) is a piece of this sum.","파트 II(다음 강의)의 모든 시간·공간 상한은 이 합의 일부분이다."]],
 x:"마지막 층 b<sup>m</sup>이 압도적이라 윗층을 다 합쳐도 마지막 층보다 작습니다(b ≥ 2). 다음 강의: 목표가 깊이 d에 있고 층 단위로 훑으면(BFS) O(b<sup>d</sup>), 맨 아래까지 파면(DFS) O(b<sup>m</sup>).",
 e:"b=10, m=3: 1+10+100+1000 = 1,111 (맨 아래 층 90%). 보충: 합 = (b<sup>m+1</sup> − 1)/(b − 1)."},
/* ================= 3-3 ================= */
{s:"3-3",im:["3-3-01","3-3-02"],en:"Chapter 3 - Part II: Uninformed Search · 4. Uninformed Search",ko:"3장 파트 II: 무정보 탐색",key:1,
 o:[["Search with nothing but the problem definition — no idea which way the goal lies","문제 정의 말고는 아무것도 없이 하는 탐색 — 목표가 어느 쪽에 있는지 전혀 모른다"],["Queue, stack and priority queue: the frontier rule is the strategy","큐, 스택, 우선순위 큐: 프런티어 규칙이 곧 전략이다"],["Breadth-first and uniform-cost — complete, optimal, and hungry for memory · Depth-first — linear space, and what that costs you · Iterative deepening: BFS guarantees at DFS memory","BFS·UCS — 완전·최적, 메모리를 많이 먹음 · DFS — 선형 공간과 그 대가 · IDS: DFS 메모리로 BFS의 보장"],["All four scored on completeness, cost optimality, time and space","네 알고리즘 모두 완전성, 비용 최적성, 시간, 공간으로 채점"]],
 x:"강의 전체의 지도. <b>Frontier</b> = 발견했지만 아직 확장하지 않은 노드 모음. 탐색은 \"프런티어에서 하나 꺼내 → 자식을 만들어 → 프런티어에 넣기\"의 반복이고, 무엇을 먼저 꺼내느냐가 알고리즘의 성격을 결정합니다. 복잡도 기호: b = branching factor, d = depth of the shallowest(optimal) solution, m = maximum depth."},
{s:"3-3",im:["3-3-03","3-3-04"],en:"Uninformed Search: The Queue · The Stack",ko:"무정보 탐색: 큐 · 스택",key:1,
 o:[["Queue: the data type where whatever went in first comes out first — First In, First Out (FIFO). Examples: a queue of people, a bank ticket number","큐: 먼저 들어간 것이 먼저 나오는 자료형 — 선입선출(FIFO). 예: 줄 선 사람들, 은행 번호표"],["Stack: the data type where whatever went in last comes out first — Last In, First Out (LIFO). In principle only the top item can be added or removed","스택: 마지막에 들어간 것이 먼저 나오는 자료형 — 후입선출(LIFO). 원칙적으로 맨 위 항목만 넣거나 뺄 수 있다"]],
 x:"탐색에서: <b>큐</b>는 먼저 발견한(얕은) 노드부터 처리 → 깊이 1이 다 처리되기 전에 깊이 2가 나오지 않음 → BFS. <b>스택</b>은 가장 최근에 발견한(깊은) 노드부터 → 한 갈래를 끝까지 파고들다 막히면 형제로 돌아옴(<b>backtracking</b>) → DFS.",
 e:"ADD(A), ADD(B), ADD(C) 후 POP: 큐 → A, 스택 → C. 스택 예: 브라우저 '뒤로 가기', Ctrl+Z, 함수 호출 스택."},
{s:"3-3",im:["3-3-05"],en:"Uninformed Search: Queue as an Abstract Data Type",ko:"추상 자료형으로서의 큐",
 o:[["Queue — FIFO: Take the oldest. Explores level by level → breadth-first search","큐 — FIFO: 가장 오래된 것을 꺼낸다. 층 단위로 탐색 → 너비 우선 탐색"],["Stack — LIFO: Take the newest. Dives down one branch → depth-first search","스택 — LIFO: 가장 새로운 것을 꺼낸다. 한 가지를 따라 깊이 → 깊이 우선 탐색"],["Insertion at the rear, deletion at the front. The four operations — IS-EMPTY, POP, TOP, ADD — are the same whichever rule the frontier uses; only ADD changes.","(큐는) 뒤에서 삽입, 앞에서 삭제. 네 연산 IS-EMPTY, POP, TOP, ADD는 프런티어 규칙과 상관없이 같고, ADD만 바뀐다."]],
 x:"<b>ADT</b>(abstract data type) = \"무엇을 할 수 있는가(연산)\"만 정하고 내부 구현은 숨긴 약속. 탐색 코드는 그대로 두고 프런티어 자료구조만 큐 ↔ 스택으로 바꾸면 BFS ↔ DFS가 됩니다.",
 e:"Python: q.popleft() (deque, 큐) vs s.pop() (list, 스택) — 한 줄 차이."},
{s:"3-3",im:["3-3-06"],en:"Uninformed Search Strategies",ko:"무정보 탐색 전략",key:1,
 o:[["The search algorithm (the planning agent) is given no information about how close a state is to the goal.","탐색 알고리즘은 어떤 상태가 목표에 얼마나 가까운지 정보를 전혀 받지 못한다."],["It uses only the labels of the atomic states and the transition function. It searches blindly, following a simple strategy, until it reaches a goal state","원자적 상태의 이름표와 전이 함수만 쓴다. 단순한 전략으로 맹목적으로 탐색하다 목표에 도달하면 멈춘다"],["Breadth-first strategy — BFS and Uniform-Cost Search (UCS) · Depth-first strategy — DFS and Iterative Deepening Search (IDS)","너비 우선 계열 — BFS, UCS · 깊이 우선 계열 — DFS, IDS"]],
 x:"<b>Uninformed</b> = 목표까지의 거리 감각이 없음. 알 수 있는 건 \"여기서 어디로 갈 수 있나(RESULT)\"와 \"여기가 목표인가(IS-GOAL)\"뿐.",
 e:"숨바꼭질: uninformed = 힌트 없이 방을 순서대로 뒤짐. informed(3-4) = \"따뜻해~\" 힌트(h(n))로 가까워 보이는 쪽부터."},
{s:"3-3",im:["3-3-07","3-3-08"],en:"Uninformed Search: Breadth-First Search (BFS)",ko:"너비 우선 탐색(BFS)",key:1,
 o:[["Expansion rule: Expand the shallowest unexpanded node on the frontier.","확장 규칙: 프런티어에서 가장 얕은 미확장 노드를 확장한다."],["Frontier: known, not yet expanded. (a FIFO queue)","프런티어: 알려졌지만 아직 확장 안 됨. (FIFO 큐)"]],
 x:"로봇이 흙더미를 <b>한 층씩</b> 긁어냅니다 — 윗층을 다 파기 전에는 아래로 내려가지 않음 → 처음 발견하는 보석(목표)은 항상 가장 얕은 곳의 것. 오른쪽 그림: 왼쪽 그래프를 S부터 펼친 탐색 트리, 색 띠(<b>Search Tiers</b>) = 깊이. 그래프의 상태 a는 하나지만 트리에서는 여러 번 나옵니다(노드 = 경로).",
 e:"SNS 촌수: 1촌 모두 → 2촌 모두 → … 목표 인물을 찾으면 최소 단계 수를 자동으로 안다. 손 추적 결과: S → e → r → f → G (4단계)."},
{s:"3-3",im:["3-3-09"],en:"BFS — on a binary tree (Figure 3.8)",ko:"BFS — 이진 트리에서의 진행 (그림 3.8)",
 o:[["Frontier: the green nodes: known, not yet expanded. (a FIFO queue)","프런티어: 초록 노드 — 알려졌지만 아직 확장 안 됨 (FIFO 큐)"],["Reached: every node visited, which is what stops a state being visited twice","도달(reached): 방문한 모든 노드 — 한 상태를 두 번 방문하는 것을 막아 준다"],["Together they build the full tree, with every node holding the parent–child link that lets the solution path be recovered.","둘이 함께 전체 트리를 만들며, 모든 노드가 부모–자식 연결을 가져 해 경로를 복원할 수 있다."]],
 x:"① A만 프런티어 → ② A 확장, B·C 추가 → ③ B 확장, D·E 추가 → ④ C 확장, F·G 추가. 삼각형은 항상 가장 먼저 들어온(가장 얕은) 노드. <b>reached</b> = \"이미 본 상태\" 명단 → 사이클·여러 갈래가 있어도 무한 반복이 없음.",
 e:"경로 복원: 목표가 E면 E.parent = B, B.parent = A → 뒤집으면 A → B → E."},
{s:"3-3",im:["3-3-10"],en:"Implementation: Breadth-First Search",ko:"구현: 너비 우선 탐색",key:1,
 o:[["Expansion adds the node's lower level to the frontier.","확장은 노드의 아래 층을 프런티어에 추가한다."],["reached stops a node being visited twice — a cycle, or any other redundant path. EXPAND adds the level below to the frontier.","reached는 노드를 두 번 방문하는 것(사이클이나 다른 중복 경로)을 막는다."]],
 x:"<div class='formula'>function BREADTH-FIRST-SEARCH(problem) returns a solution node or failure<br>&nbsp;node ← NODE(problem.INITIAL)<br>&nbsp;if problem.IS-GOAL(node.STATE) then return node<br>&nbsp;frontier ← a FIFO queue, with node as an element<br>&nbsp;reached ← {problem.INITIAL}<br>&nbsp;while not IS-EMPTY(frontier) do<br>&nbsp;&nbsp;node ← POP(frontier)<br>&nbsp;&nbsp;for each child in EXPAND(problem, node) do<br>&nbsp;&nbsp;&nbsp;s ← child.STATE<br>&nbsp;&nbsp;&nbsp;if problem.IS-GOAL(s) then return child &nbsp;← 생성할 때 검사<br>&nbsp;&nbsp;&nbsp;if s is not in reached then add s to reached; add child to frontier<br>&nbsp;return failure</div>BFS는 자식을 <b>만드는 순간</b> 목표 검사(<b>early goal test</b>, 조기 목표 검사). 얕은 순서로 만들기 때문에 처음 만든 목표가 이미 가장 얕은 해로 보장됩니다.",
 e:"d=3, b=10: 조기 검사는 깊이 3 노드를 만들다 발견(약 1,111개 수준), 늦은 검사면 깊이 4 노드(최대 10,000개)까지 만들어 버림 — 한 층 = b배 차이."},
{s:"3-3",im:["3-3-11"],en:"Implementation: Expanding the Search Tree",ko:"구현: 탐색 트리 확장하기 (EXPAND)",key:1,
 o:[["Tree search in AI builds the search tree as it goes.","AI의 트리 탐색은 탐색 트리를 진행하면서 만들어 간다."],["The EXPAND function applies the transition model (RESULT) to try every action available in the current node's state. It returns the list of new child nodes to be added to the frontier.","EXPAND 함수는 전이 모델(RESULT)을 적용해 현재 노드 상태에서 가능한 모든 행동을 시도하고, 프런티어에 추가할 새 자식 노드 목록을 돌려준다."],["A node records four things: its state, its parent, the action that produced it, and the path cost so far. yield may equally be implemented as returning a list of nodes.","노드는 네 가지를 기록한다: 상태, 부모, 자신을 만든 행동, 지금까지의 경로 비용. yield는 노드 목록 반환으로 구현해도 같다."]],
 x:"<div class='formula'>function EXPAND(problem, node) yields nodes<br>&nbsp;s ← node.STATE<br>&nbsp;for each action in problem.ACTIONS(s) do<br>&nbsp;&nbsp;s′ ← problem.RESULT(s, action)  &nbsp;← transition function<br>&nbsp;&nbsp;cost ← node.PATH-COST + problem.ACTION-COST(s, action, s′)<br>&nbsp;&nbsp;yield NODE(STATE=s′, PARENT=node, ACTION=action, PATH-COST=cost)</div><b>State ≠ node</b>: 상태는 \"세계가 어떤 모습인가\", 노드는 거기에 \"어떻게 왔는가(부모, 행동, 비용)\" 기록이 붙은 것.",
 e:"Arad 확장 → Sibiu(cost 140), Timisoara(118), Zerind(75). Sibiu를 확장하면 Fagaras의 PATH-COST = 140 + 99 = 239."},
{s:"3-3",im:["3-3-12"],en:"Time and Space Complexity: Breadth-First Search",ko:"시간·공간 복잡도: 너비 우선 탐색",key:1,
 o:[["1 + b + b² + … + b^d ⇒ O(b^d)  (here b = 2, d = 1, m = 3)","1 + b + b² + … + b^d ⇒ O(b^d)  (여기서 b = 2, d = 1, m = 3)"],["Everything above the orange line has been expanded. If every path down to the goal depth is expanded, the search tree has 1 + b + b² + … + b^d nodes.","주황 선 위쪽은 모두 확장되었다. 목표 깊이까지 모든 경로를 확장하면 노드 수는 1 + b + … + b^d개."]],
 x:"목표 C가 깊이 1에 있으므로(d=1) BFS는 A, B, C까지만 보고 끝 — 트리가 깊이 3(m=3)까지 있어도 상관없음. BFS의 비용은 <b>m이 아니라 d</b>에 좌우됩니다. 그리고 그 노드들을 전부 기억해야 하므로 공간도 b<sup>d</sup>.",
 e:"b=10: d=2 → 111개, d=4 → 11,111개, d=6 → 1,111,111개."},
{s:"3-3",im:["3-3-13"],en:"Properties of Breadth-First Search",ko:"너비 우선 탐색의 성질",key:1,
 o:[["Completeness: does a solution exist and will it be found? Yes","완전성: 해가 있으면 찾는가? 예"],["Cost optimality: will it find the lowest-cost solution? Yes, when every step costs the same. Otherwise, use uniform-cost search.","비용 최적성: 최소 비용 해를 찾는가? 모든 단계 비용이 같을 때 예. 아니면 균일 비용 탐색을 써라."],["Time complexity: nodes generated - O(b^d) · Space complexity: nodes stored - O(b^d)","시간: 생성 노드 수 O(b^d) · 공간: 저장 노드 수 O(b^d)"],["Note: In AI, a large space complexity is usually a bigger problem than time.","참고: AI에서는 큰 공간 복잡도가 보통 시간보다 더 큰 문제다."]],
 x:"Complete: b가 유한하면 각 층이 유한해 해가 있는 층에 반드시 도착. BFS가 보장하는 건 '<b>단계 수</b>가 가장 적은' 해 — 비용이 제각각이면 단계는 적어도 비싼 길을 고를 수 있습니다.",
 e:"슬라이드 그래프: BFS 경로 S→e→r→f→G = 9+2+1+2 = <b>14</b>(4단계), 최저 비용 S→d→e→r→f→G = 3+2+2+1+2 = <b>10</b>(5단계)."},
{s:"3-3",im:["3-3-14"],en:"Uniform-Cost Search (= Dijkstra's Algorithm) — Cost contours",ko:"균일 비용 탐색(= 다익스트라) — 비용 등고선",key:1,
 o:[["The word \"uniform\" means it searches consistently by lowest cost","'uniform'은 일관되게 가장 낮은 비용 순서로 탐색한다는 뜻"],["Expansion rule: expand a cheapest node first.","확장 규칙: 가장 비용이 싼 노드를 먼저 확장한다."]],
 x:"BFS의 색 띠가 '깊이'였다면 UCS의 색 영역은 '비용'(<b>cost contours</b>, 비용 등고선). 노드 옆 숫자 = S부터의 누적 비용 g(n). p(1)은 비용 1로 가장 먼저, e(9)는 깊이 1이지만 비싸서 뒤로, 깊이 4인 f(8)이 e(9)보다 먼저 처리.<div class='tw'><table><tr><th>#</th><th>pop</th><th>push / update</th></tr><tr><td>1</td><td>S(0)</td><td>d(3), e(9), p(1)</td></tr><tr><td>2</td><td>p(1)</td><td>q(16)</td></tr><tr><td>3</td><td>d(3)</td><td>b(4), c(11), e 9→5 갱신</td></tr><tr><td>4–5</td><td>b(4), e(5)</td><td>a(6), h(13), r(7)</td></tr><tr><td>6–8</td><td>a(6), r(7), f(8)</td><td>f(8), G(10)</td></tr><tr><td>10</td><td>G(10)</td><td>목표! S→d→e→r→f→G, 비용 10</td></tr></table></div>"},
{s:"3-3",im:["3-3-15"],en:"Uniform-Cost Search — Properties",ko:"균일 비용 탐색 — 성질과 복잡도",key:1,
 o:[["Expansion rule: expand the frontier node with the lowest path cost from the initial state","확장 규칙: 초기 상태로부터 경로 비용이 가장 낮은 프런티어 노드를 확장"],["Implementation: best-first search, with the frontier as a priority queue ordered by f(n) = g(n) = path cost","구현: 최선 우선 탐색, 프런티어는 f(n) = g(n) = 경로 비용으로 정렬된 우선순위 큐"],["Completeness: yes, provided every step cost exceeds some small positive constant ε. Cost optimality: yes; nodes are expanded in order of increasing path cost (Proof next lecture via A*)","완전성: 모든 단계 비용이 작은 양수 ε보다 크면 예. 비용 최적성: 예 — 경로 비용 증가 순서로 확장 (증명은 다음 강의 A*)"],["Time and space complexity: O(b^(C*/ε)), expanding every node with cost c ≤ C*. This can be larger than BFS's O(b^d): it may explore many cheap long paths before an expensive short one.","시간·공간: O(b^(C*/ε)) — 비용 ≤ C*인 노드를 모두 확장. BFS의 O(b^d)보다 클 수 있다: 비싼 짧은 경로보다 싼 긴 경로를 먼저 많이 볼 수 있다."],["Breadth-first search is the special case of UCS where every step costs the same. = Flatten the contours","BFS는 모든 단계 비용이 같은 UCS의 특수한 경우다. = 등고선을 평평하게"]],
 x:"<b>ε 조건</b>이 필요한 이유: 비용 0짜리 행동이 무한히 반복되면 누적 비용이 늘지 않는 길만 영원히 팔 수 있음. <b>C*/ε</b> = 비용 C* 이하 경로가 최대 C*/ε 걸음까지 길어질 수 있으니 UCS의 '실질 깊이'.",
 e:"고속도로 한 번(비용 10) vs 골목 칸당 1·사방 4갈래: UCS는 비용 10 미만 골목을 전부 본 뒤에야 고속도로 해를 꺼냄(4<sup>9</sup> ≈ 26만 노드)."},
{s:"3-3",im:["3-3-16"],en:"Implementation: Uniform-Cost Search",ko:"구현: 균일 비용 탐색",key:1,
 o:[["function UNIFORM-COST-SEARCH(problem) returns BEST-FIRST-SEARCH(problem, PATH-COST)","UCS = 최선 우선 탐색에 정렬 기준으로 경로 비용을 넘긴 것"],["The order of expansion is set by f(n) = the path cost from the initial state to n.","확장 순서는 f(n) = 초기 상태에서 n까지의 경로 비용으로 정해진다."],["If a cheaper path to a state turns up later, we take it. (≠ BFS) The extra check is what BFS does not have: revisit a node if a better — cheaper — path reaches it.","어떤 상태로 가는 더 싼 경로가 나중에 나오면 그것을 택한다(≠ BFS). BFS에 없는 추가 검사: 더 싼 경로가 도달하면 다시 방문."]],
 x:"<div class='formula'>function BEST-FIRST-SEARCH(problem, f)<br>&nbsp;frontier ← a priority queue ordered by f<br>&nbsp;reached ← a lookup table {INITIAL: node}<br>&nbsp;while not IS-EMPTY(frontier) do<br>&nbsp;&nbsp;node ← POP(frontier)<br>&nbsp;&nbsp;if problem.IS-GOAL(node.STATE) then return node &nbsp;← 꺼낼 때 검사<br>&nbsp;&nbsp;for each child in EXPAND(problem, node) do<br>&nbsp;&nbsp;&nbsp;if s not in reached or child.PATH-COST &lt; reached[s].PATH-COST then<br>&nbsp;&nbsp;&nbsp;&nbsp;reached[s] ← child; add child to frontier</div>BFS와 다른 점: ① 우선순위 큐(키 = g) ② <b>꺼낼 때</b> 목표 검사(<b>late goal test</b>) ③ 더 싼 경로면 reached 갱신.",
 e:"조기 검사였다면 틀리는 예: S→G 10, S→A 1, A→G 1. 조기 검사는 G(10) 반환, 늦은 검사는 A를 꺼내 G(2)를 찾음."},
{s:"3-3",im:["3-3-17","3-3-18"],en:"Uninformed Search: Depth-First Search (DFS)",ko:"깊이 우선 탐색(DFS)",key:1,
 o:[["Expansion rule: expand the deepest unexpanded node on the frontier","확장 규칙: 프런티어에서 가장 깊은 미확장 노드를 확장한다"],["Frontier: a stack (LIFO)","프런티어: 스택(LIFO)"]],
 x:"드릴 로봇이 한 지점을 <b>바닥까지</b> 뚫습니다. 바닥에 닿으면 한 칸 올라와 옆 갈래를 다시 끝까지(<b>backtracking</b>). 옆 갈래 얕은 곳에 목표가 있어도 처음 찾는 해는 더 깊은 것일 수 있음 → 얕은(좋은) 해 보장 없음. 오른쪽 그림: S의 첫 가지 d를 끝까지 훑다가 G를 발견, e·p 가지는 손도 대지 않음.",
 e:"미로의 '오른손 법칙': 메모할 건 '지금까지 온 길'뿐이라 기억이 적게 들지만, 출구가 옆 갈림길에 있어도 먼 길을 돌 수 있다."},
{s:"3-3",im:["3-3-19"],en:"DFS — on a binary tree (Figure 3.11)",ko:"DFS — 이진 트리에서의 진행 (그림 3.11)",key:1,
 o:[["No reached data structure is needed","reached 자료구조는 필요 없다"],["Redundant paths are not checked, so the same region may be searched more than once","중복 경로를 검사하지 않으므로 같은 영역을 두 번 이상 탐색할 수 있다"],["Cycle checking is done only along the current path","사이클 검사는 현재 경로를 따라서만 한다"]],
 x:"다 본 가지(희미해진 노드)는 메모리에서 지웁니다 → 동시에 기억하는 것은 '현재 경로 + 각 층의 아직 안 본 형제들'뿐. <b>Cycle</b>(같은 경로 안에서 되돌아옴, A→B→A)은 조상만 보면 발견, <b>redundant path</b>(A→B→D와 A→C→D)는 '본 적 있는 모든 상태'를 기억해야 막을 수 있는데 DFS는 메모리를 아끼려 포기."},
{s:"3-3",im:["3-3-20"],en:"Implementation: Depth-First Search (Depth-Limited Search)",ko:"구현: 깊이 우선 탐색 (깊이 제한 탐색)",key:1,
 o:[["DFS identical to BFS or best-first except that it takes the last element off the frontier.","DFS는 BFS나 최선 우선 탐색과 같은데, 다만 프런티어에서 마지막 원소를 꺼낸다."],["Iterative: abandoned branches are freed as the tree is built, and cycles are checked only along the current path — much like backtracking search.","반복 방식: 버려진 가지는 해제되고, 사이클은 현재 경로를 따라서만 검사 — 백트래킹 탐색과 비슷."],["Recursive: the current path lives on the call stack where the function cannot read it, so cycle checking needs a separate structure.","재귀 방식: 현재 경로가 함수가 읽을 수 없는 호출 스택에 있어, 사이클 검사에 별도 구조가 필요."],["ℓ could be ∞ in DFS · No reached data structure: memory management · IS-CYCLE also stops the same state sitting on the frontier twice. But, redundant paths cannot be prevented.","DFS에서 ℓ은 ∞일 수 있다 · reached 없음: 메모리 관리 · IS-CYCLE은 같은 상태가 프런티어에 두 번 오르는 것도 막지만 중복 경로는 못 막는다."]],
 x:"<div class='formula'>function DEPTH-LIMITED-SEARCH(problem, ℓ) returns a node or failure or cutoff<br>&nbsp;frontier ← a LIFO queue (stack) with NODE(problem.INITIAL)<br>&nbsp;result ← failure<br>&nbsp;while not IS-EMPTY(frontier) do<br>&nbsp;&nbsp;node ← POP(frontier)<br>&nbsp;&nbsp;if problem.IS-GOAL(node.STATE) then return node<br>&nbsp;&nbsp;if DEPTH(node) &gt; ℓ then result ← cutoff<br>&nbsp;&nbsp;else if not IS-CYCLE(node) do for each child in EXPAND(...) add child to frontier<br>&nbsp;return result</div><b>cutoff</b> = \"한계 안에서는 못 찾았지만 더 깊이 가면 있을 수도\", <b>failure</b> = \"아예 없다\"."},
{s:"3-3",im:["3-3-21"],en:"Time and Space Complexity: Depth-First Search",ko:"시간·공간 복잡도: 깊이 우선 탐색",key:1,
 o:[["DFS returns the FIRST goal it reaches — not the cheapest","DFS는 처음 도달한 목표를 반환한다 — 가장 싼 목표가 아니다"],["Time O(b^m), Space (= memory) O(bm)  (here b = 2, d = 1, m = 3). Time complexity: Worst case, it expands every path.","시간 O(b^m), 공간(메모리) O(bm). 시간: 최악의 경우 모든 경로를 확장한다."]],
 x:"그림: A → B → D → H → I 순서로 가다 I(깊이 3)에서 목표를 만남. C(깊이 1)라는 더 좋은 목표는 보지도 못함 → <b>not optimal</b>. 공간 bm: 루트~현재 노드 경로(최대 m층) × 각 층의 안 본 형제(최대 b개).",
 e:"b=10, m=16: DFS가 들고 있는 노드 약 160개 vs BFS는 한 층에만 10<sup>16</sup>개 가능."},
{s:"3-3",im:["3-3-22"],en:"Properties of Depth-First Search",ko:"깊이 우선 탐색의 성질",key:1,
 o:[["Completeness? m could be infinite, so only if we prevent cycles (more later)","완전성? m이 무한일 수 있으므로, 사이클을 막을 때만"],["Cost optimality — no. It returns the first solution it finds.","비용 최적성 — 아니오. 처음 찾은 해를 반환한다."],["Time complexity — O(b^m): worst case, it reaches maximum depth m on the last path; if m ≫ d, this is inefficient compared to BFS","시간 — O(b^m): 최악엔 마지막 경로에서 최대 깊이 m까지. m ≫ d이면 BFS보다 비효율"],["Space complexity — O(bm), linear in the maximum tree depth, but only if no reached structure is used. Cycles can be cut; redundant paths cannot be checked.","공간 — O(bm), 최대 깊이에 선형. 단 reached를 쓰지 않을 때만. 사이클은 끊을 수 있지만 중복 경로는 검사 못 한다."]],
 x:"DFS의 유일한 장점은 <b>메모리(선형)</b>. 완전성이 조건부인 이유: 무한히 깊은 가지에 들어가면 영원히 바닥에 닿지 못함. 유한 상태 공간이면 사이클만 막아도 완전.",
 e:"정답이 깊이 2인데 왼쪽 첫 가지가 깊이 1,000이라면 BFS는 2까지만, DFS는 1,000까지 내려갔다 와야 한다."},
{s:"3-3",im:["3-3-23","3-3-24"],en:"Iterative Deepening Search (IDS)",ko:"반복적 깊이 심화 탐색(IDS)",key:1,
 o:[["Can we have DFS's low memory use, avoid its infinite loops, and keep BFS's optimality guarantee?","DFS의 적은 메모리, 무한 루프 회피, BFS의 최적성 보장을 모두 가질 수 있을까?"],["Check the root; then DFS for a path of length 1; then length 2; then length 3; …","루트를 확인 → 길이 1 경로 DFS → 길이 2 → 길이 3 → …"]],
 x:"한계 ℓ = 0, 1, 2, …를 늘려 가며 매번 처음부터 <b>depth-limited DFS</b>. 깊이 d의 해는 한계가 d일 때 처음 발견 → 더 얕은 해를 놓치지 않음(BFS 장점) + 각 회차는 DFS라 메모리 작음(DFS 장점). 그림(목표 M, 깊이 3): limit 0 A → limit 1 A,B,C → limit 2 A,B,D,E,C,F,G → limit 3 … M 발견.",
 e:"A는 4번, B·C는 3번, D~G는 2번, H~O는 1번 만들어짐 — 윗층일수록 여러 번이지만 노드 대부분이 맨 아래층이라 낭비가 작다."},
{s:"3-3",im:["3-3-25"],en:"Implementation: Iterative Deepening Search",ko:"구현: 반복적 깊이 심화 탐색",key:1,
 o:[["function ITERATIVE-DEEPENING-SEARCH(problem): for depth = 0 to ∞ do result ← DEPTH-LIMITED-SEARCH(problem, depth); if result ≠ cutoff then return result","depth를 0, 1, 2, …로 늘리며 깊이 제한 탐색; 결과가 cutoff가 아니면 반환"],["cutoff means \"no solution within this limit\"; failure means \"no solution at all\". The outer loop needs the difference to know when to stop.","cutoff = '이 한계 안엔 해가 없다', failure = '해가 아예 없다'. 바깥 루프는 언제 멈출지 알기 위해 이 차이가 필요하다."]],
 x:"구분이 없으면 해가 정말 없는 유한 문제에서도 \"한계를 늘리면 찾을지도\" 하며 영원히 돕니다. 깊이 제한 탐색은 한 번이라도 한계에 걸려 잘린 노드가 있으면 cutoff, 한계에 걸린 적 없이 다 봤는데 없으면 failure.",
 e:"상태 A, B뿐이고 목표가 없는 문제: 한계 2에서 A는 사이클이라 확장 안 함, 잘린 노드 없음 → failure → 종료."},
{s:"3-3",im:["3-3-26"],en:"Properties of Iterative Deepening Search",ko:"반복적 깊이 심화 탐색의 성질",key:1,
 o:[["Completeness — yes · Cost optimality — yes","완전성 — 예 · 비용 최적성 — 예"],["Time complexity — it rebuilds the tree up to d times: db + (d−1)b² + … + 1·b^d = O(b^d), slower than BFS, but in the same complexity class.","시간 — 트리를 최대 d번 다시 만든다: db + (d−1)b² + … + 1·b^d = O(b^d). BFS보다 느리지만 같은 등급."],["Space complexity — O(bd), linear. Even less than DFS, since d ≤ m. Cycles have to be handled inside the depth-limited DFS","공간 — O(bd), 선형. d ≤ m이므로 DFS보다도 적다. 사이클은 깊이 제한 DFS 안에서 처리"],["IDS gives the same result as BFS, at a longer running time but a far better space complexity. This is why IDS and DFS are the workhorses of AI","IDS는 BFS와 같은 결과를 더 긴 시간, 훨씬 좋은 공간으로 얻는다. 그래서 IDS와 DFS가 AI의 일꾼이다"]],
 x:"시간 식: 깊이 1 노드는 d번, 깊이 2는 d−1번, …, 깊이 d는 1번 만들어짐. 마지막 항이 지배적 → O(b<sup>d</sup>). (Optimal은 BFS와 같은 조건 — 모든 비용이 같을 때)",
 e:"b=10, d=5: BFS 10+100+…+100,000 = 111,110 vs IDS 5·10+4·100+3·1,000+2·10,000+1·100,000 = 123,450 → 약 11%만 더."},
{s:"3-3",im:["3-3-27"],en:"The One Queue: Every Strategy Is One Algorithm",ko:"하나의 큐: 모든 전략은 하나의 알고리즘이다",key:1,
 o:[["Breadth-first, uniform-cost, depth-first and iterative deepening are one algorithm. Only the frontier rule differs: FIFO queue, priority queue, LIFO stack, stack with a depth cutoff","BFS, UCS, DFS, IDS는 하나의 알고리즘이다. 프런티어 규칙만 다르다: FIFO 큐, 우선순위 큐, LIFO 스택, 깊이 컷오프가 있는 스택"],["Conceptually every frontier is a priority queue: nodes with priorities attached","개념적으로 모든 프런티어는 우선순위 큐다"],["Practically, depth-first and breadth-first avoid the log(n) overhead of a real priority queue by using a stack and a plain queue","실용적으로 DFS·BFS는 스택과 일반 큐로 우선순위 큐의 log(n) 오버헤드를 피한다"],["One implementation with the queuing object passed in gives all four — and Part III changes nothing but the priority: f = g + h","큐 객체를 인자로 넘기는 하나의 구현이 넷을 모두 만든다 — 3부는 우선순위만 바꾼다: f = g + h"]],
 x:"<div class='tw'><table><tr><th>Algorithm</th><th>Frontier</th><th>Priority key</th><th>Goal test</th></tr><tr><td>BFS</td><td>FIFO queue</td><td>depth</td><td>생성 시 (early)</td></tr><tr><td>UCS</td><td>priority queue</td><td>g(n)</td><td>꺼낼 때 (late)</td></tr><tr><td>DFS</td><td>LIFO stack</td><td>−depth</td><td>꺼낼 때</td></tr><tr><td>IDS</td><td>stack + depth cutoff</td><td>−depth, 한계 초과는 버림</td><td>꺼낼 때</td></tr><tr><td>Greedy (3-4)</td><td>priority queue</td><td>h(n)</td><td>꺼낼 때</td></tr><tr><td>A* (3-4)</td><td>priority queue</td><td>g(n) + h(n)</td><td>꺼낼 때</td></tr></table></div>"},

/* ================= 3-4 ================= */
{s:"3-4",im:["3-4-01","3-4-02"],en:"Chapter 3 - Part III: Informed Search · 5. Informed Search",ko:"3장 파트 III: 정보 탐색",key:1,
 o:[["Now the agent gets a hint (informed). One function changes everything.","이제 에이전트는 힌트를 얻는다(정보가 주어진다). 함수 하나가 모든 것을 바꾼다."],["h(n): the estimated cost from a node to the goal","h(n): 노드에서 목표까지의 추정 비용"],["Greedy best-first search: use h alone, and watch it miss the shorter route by 32 miles · A* search: f(n) = g(n) + h(n), with the proof that it is optimal","탐욕적 최선 우선: h만 쓰고, 더 짧은 경로를 32마일 차이로 놓치는 걸 본다 · A*: f = g + h, 최적이라는 증명"],["Admissibility and consistency - what a heuristic has to promise · Designing heuristics: relaxed problems, subproblems, dominance, pattern databases · Weighted A*, and the one parameter that contains every algorithm in this chapter","허용성과 일관성 — 휴리스틱이 지켜야 할 약속 · 휴리스틱 설계: 완화 문제, 부분 문제, 지배, 패턴 DB · 가중 A*와 이 장의 모든 알고리즘을 담은 하나의 매개변수"]],
 x:"줄거리: h(n) 정의 → h만 쓰면(greedy) 빠르지만 틀릴 수 있음(450 vs 418) → g+h를 쓰면(A*) 최적 → 그 조건이 <b>admissibility</b>(허용성). 마지막 두 항목(휴리스틱 설계, 가중 A*)은 이번 PDF에 슬라이드가 없어 이 소단원 끝에 보충으로 정리했습니다."},
{s:"3-4",im:["3-4-03"],en:"Informed Search",ko:"정보 탐색이란",key:1,
 o:[["AI search problems generally have very large search spaces. → We want to improve efficiency by expanding as few nodes as possible","AI 탐색 문제는 탐색 공간이 매우 크다 → 가능한 한 적은 노드를 확장해 효율을 높이고 싶다"],["The agent can use extra information — a \"hint\" — to explore the more promising states first: information the agent already has (e.g. a map with the goal marked) · derived from percepts arriving through its sensors (e.g. a GPS sensor and the goal coordinates)","에이전트는 추가 정보('힌트')로 더 유망한 상태를 먼저 탐색할 수 있다: 이미 가진 정보(목표가 표시된 지도) · 지각에서 얻은 정보(GPS와 목표 좌표)"],["The agent uses a heuristic function h(n) to rank the nodes on the frontier, and a best-first search strategy always expands the most promising node on it.","에이전트는 휴리스틱 함수 h(n)으로 프런티어 노드에 순위를 매기고, 최선 우선 전략은 항상 가장 유망한 것을 확장한다."],["Informed search algorithms: Greedy best-first search · A* search","정보 탐색 알고리즘: 탐욕적 최선 우선 탐색 · A* 탐색"]],
 x:"무정보 탐색은 '공정하게' 모든 방향을 봤지만, 목표가 동쪽에 있다는 걸 안다면 서쪽 길을 똑같이 볼 이유가 없습니다.",
 e:"서울→부산 내비: '부산은 남쪽' 힌트로 강릉 방향 도로는 한참 뒤로 미뤄진다."},
{s:"3-4",im:["3-4-04"],en:"Heuristic Function",ko:"휴리스틱 함수",key:1,
 o:[["The heuristic function h(n) estimates how close a state is to a goal.","휴리스틱 함수 h(n)은 한 상태가 목표에 얼마나 가까운지를 추정한다."],["Euclidean distance: straight line, ignoring obstacles · Manhattan distance; sum of the horizontal and vertical steps","유클리드 거리: 직선, 장애물 무시 · 맨해튼 거리: 가로 이동 칸 수 + 세로 이동 칸 수"]],
 x:"h(n) = 목표까지 남은 비용의 <b>어림값</b>. 보통 벽·장애물 같은 제약을 무시하고 계산해 빠르게 구합니다. 둘 다 실제 미로 거리보다 짧거나 같음 — 이 '실제보다 크게 말하지 않는다'는 성질이 뒤의 <b>admissibility</b>. 로봇 계기판(Heuristi-Tron): 멀어지면 NOPE, 가까워지면 GOAL!",
 e:"(1,1) → (4,5): 유클리드 √(9+16) = 5, 맨해튼 3 + 4 = 7. 상하좌우만 움직이는 판이면 맨해튼이 실제에 더 가깝다."},
{s:"3-4",im:["3-4-05"],en:"Example: A Heuristic for the Romania Problem",ko:"예: 루마니아 문제의 휴리스틱",key:1,
 o:[["h(n): estimate the driving distance from Arad to Bucharest by the straight-line (Euclidean) distance","h(n): 아라드에서 부쿠레슈티까지의 주행 거리를 직선(유클리드) 거리로 추정한다"],["Straight-line distance to Bucharest (table)","부쿠레슈티까지의 직선 거리 표"]],
 x:"<div class='tw'><table><tr><th>City</th><th>h</th><th>City</th><th>h</th></tr><tr><td>Arad</td><td>366</td><td>Bucharest</td><td>0</td></tr><tr><td>Sibiu</td><td>253</td><td>Fagaras</td><td>176</td></tr><tr><td>Rimnicu Vilcea</td><td>193</td><td>Pitesti</td><td>100</td></tr><tr><td>Timisoara</td><td>329</td><td>Zerind</td><td>374</td></tr><tr><td>Oradea</td><td>380</td><td>Craiova</td><td>160</td></tr></table></div>직선 거리는 도로 지도만으로는 알 수 없는 '추가 정보'. 아라드의 h = 366, 실제 최단 도로 거리 = 418 — 도로는 구불구불하니 직선보다 항상 길거나 같습니다."},
{s:"3-4",im:["3-4-06","3-4-07","3-4-08","3-4-09"],en:"Example: Greedy Best-First Search (1)–(4)",ko:"예: 탐욕적 최선 우선 탐색 (1)–(4)",key:1,
 o:[["Expansion rule: expand the node with the lowest heuristic value h(n). Start at Arad, h = 366","확장 규칙: h(n)이 가장 낮은 노드를 확장한다. 아라드에서 시작, h = 366"],["Expand Arad. Among Sibiu (253), Timisoara (329), Zerind (374), Sibiu has the lowest h","아라드 확장. 시비우(253), 티미쇼아라(329), 제린드(374) 중 시비우의 h가 가장 낮다"],["Expand Sibiu. Fagaras has h = 176, the lowest among its children. Note that Rimnicu Vilcea (193) is passed over","시비우 확장. 자식 중 파가라스 h = 176이 가장 낮다. 림니쿠빌체아(193)가 지나쳐진다는 점에 주목"],["Expand Fagaras, and Bucharest is reached. Total: 140 + 99 + 211 = 450 miles","파가라스를 확장하면 부쿠레슈티 도달. 합계: 140 + 99 + 211 = 450마일"]],
 x:"<b>Greedy</b>(탐욕적) = 매 순간 당장 목표에 가장 가까워 보이는 선택만. 지금까지 온 비용(g)은 전혀 보지 않습니다 — 제린드는 도로로 75로 가장 가깝지만 h=374라 뒤로 밀림. 확장 노드는 Arad, Sibiu, Fagaras 3개뿐으로 빠르지만, 실제 최단 경로는 림니쿠빌체아를 지납니다.",
 e:"등산로에서 '정상이 보이는 방향'으로만 걷다가 절벽을 만나 크게 돌아가는 사람."},
{s:"3-4",im:["3-4-10"],en:"Properties of Greedy Best-First Search",ko:"탐욕적 최선 우선 탐색의 성질",key:1,
 o:[["Completeness? Yes — best-first search is complete in a finite space","완전성? 예 — 최선 우선 탐색은 유한한 공간에서 완전하다"],["Cost optimality? No — 1. the path it found: 140 + 99 + 211 = 450 miles 2. another path, through Rimnicu Vilcea: 140 + 80 + 97 + 101 = 418 miles","비용 최적? 아니오 — 찾은 경로 450마일 vs 림니쿠빌체아 경유 418마일"]],
 x:"450 − 418 = <b>32마일</b> 손해(2번 슬라이드의 '32 miles'). 파가라스(176)가 림니쿠빌체아(193)보다 '가까워 보였지만' 파가라스→부쿠레슈티 도로가 211로 길었던 것. 완전성: reached를 쓰는 graph search면 유한 공간에서 결국 모든 상태를 봄. (보충: 트리 탐색이면 Iasi↔Neamt 무한 루프 가능)"},
{s:"3-4",im:["3-4-11"],en:"Implementing Greedy Best-First Search — three strategies, one loop",ko:"탐욕적 탐색 구현 — 세 전략, 하나의 루프",key:1,
 o:[["It is the best-first search we already have · Expand the frontier using f(n) = h(n) · Nothing else changes — same loop, same frontier, same EXPAND","이미 가진 최선 우선 탐색 그대로. f(n) = h(n)으로 프런티어 확장. 나머지는 그대로 — 같은 루프, 같은 프런티어, 같은 EXPAND"],["f(n) = g(n) Uniform-cost search: order by the cost already paid · f(n) = h(n) Greedy best-first search: order by the cost still estimated · f(n) = g(n) + h(n) A* search: order by both - next section. Three strategies, one loop (same). Only the key the frontier is sorted on changes.","f = g → UCS(이미 지불한 비용) · f = h → 탐욕적(남은 추정 비용) · f = g + h → A*(둘 다)"]],
 x:"경로 전체 비용 = (시작~n까지 이미 쓴 비용) + (n~목표 남은 비용). UCS는 앞부분(g)만 → 확실하지만 사방으로 퍼짐. Greedy는 뒷부분 추정(h)만 → 목표 쪽으로 곧장 가지만 쓴 비용 무시. A*는 둘을 더함.<div class='tw'><table><tr><th>node</th><th>g</th><th>h</th><th>UCS</th><th>Greedy</th><th>A*</th></tr><tr><td>Zerind</td><td>75</td><td>374</td><td><b>75</b></td><td>374</td><td>449</td></tr><tr><td>Timisoara</td><td>118</td><td>329</td><td>118</td><td>329</td><td>447</td></tr><tr><td>Rimnicu Vilcea</td><td>220</td><td>193</td><td>220</td><td>193</td><td><b>413</b></td></tr><tr><td>Fagaras</td><td>239</td><td>176</td><td>239</td><td><b>176</b></td><td>415</td></tr></table></div>같은 후보에서 UCS는 Zerind, Greedy는 Fagaras, A*는 Rimnicu Vilcea를 고릅니다."},
{s:"3-4",im:["3-4-12"],en:"Implementation: Greedy Best-First Search",ko:"구현: 탐욕적 최선 우선 탐색 (의사코드)",
 o:[["Because f(n) = h(n), it expands the node with the lowest estimated cost.","f(n) = h(n)이므로 추정 비용이 가장 낮은 노드를 확장한다."],["The order in which the frontier is expanded is decided by f(n).","프런티어가 확장되는 순서는 f(n)이 결정한다."]],
 x:"UCS의 BEST-FIRST-SEARCH와 한 글자도 다르지 않고, 우선순위 큐의 정렬 기준만 다릅니다. 재미있는 점: reached를 갱신할지 판단하는 줄은 f가 아니라 여전히 <b>PATH-COST(g)</b>를 비교 — 순서는 h로 정하지만 경로 기록은 g로 관리.",
 e:"Python heapq: (h, node) → greedy, (g+h, node) → A*, (g, node) → UCS."},
{s:"3-4",im:["3-4-13"],en:"Properties of Greedy Best-First Search (2)",ko:"탐욕적 최선 우선 탐색의 성질 (2)",key:1,
 o:[["Completeness? Yes — best-first search is complete in a finite space · Cost optimality? No","완전성? 예(유한 공간) · 비용 최적? 아니오"],["Time complexity? worst case: O(b^m) — similar to DFS · best case: O(bm) — if h(n) were 100% accurate it would expand a single path","시간? 최악 O(b^m) — DFS와 비슷 · 최선 O(bm) — h(n)이 100% 정확하면 경로 하나만 확장"],["Space complexity? The same as its time complexity","공간? 시간과 같다"]],
 x:"성능은 <b>h의 품질</b>에 달려 있습니다. 엉터리 h면 그 방향으로 깊이 파고드는 DFS처럼(O(b<sup>m</sup>)), 완벽한 h면 단계마다 자식 b개를 만들어 보며 최대 m단계(O(bm)). 만든 노드를 모두 보관하므로 공간 = 시간.",
 e:"미로에서 목표가 벽 바로 너머인데 입구는 반대편 끝이면 직선 거리가 계속 벽 쪽을 가리켜 헤맨다."},
{s:"3-4",im:["3-4-14"],en:"Why Greedy Best-First Search Is Not Cost Optimal",ko:"탐욕적 탐색이 비용 최적이 아닌 이유",key:1,
 o:[["h = 1 looks better than h = 2","h = 1이 h = 2보다 좋아 보인다"],["Greedy best-first search follows that path and never reconsiders it.","탐욕적 탐색은 그 경로를 따라가고 다시는 재고하지 않는다."],["It weighs only the estimated cost to the goal: never the cost already paid.","목표까지의 추정 비용만 저울질한다: 이미 지불한 비용은 절대 고려하지 않는다."]],
 x:"위쪽 길: 초기 → (h=2) → (h=1) → 목표 = 3걸음. 아래쪽 길: 초기 → (h=1)×5 → 목표 = 6걸음. 아래쪽 노드들은 계속 h=1이라 프런티어의 h=2보다 항상 먼저 꺼내짐 → 6걸음 해 반환.",
 e:"A*였다면 아래로 3걸음쯤 가면 f = 3 + 1 = 4 > 위쪽 첫 노드 f = 1 + 2 = 3 → 위로 돌아가 3걸음 해를 찾는다."},
{s:"3-4",im:["3-4-15"],en:"A* Search",ko:"A* 탐색",key:1,
 o:[["Idea: to avoid expanding paths that are already very expensive, let g(n) be the path cost to node n and take it into account.","아이디어: 이미 매우 비싼 경로를 확장하지 않도록, n까지의 경로 비용 g(n)을 고려에 넣는다."],["The evaluation function f(n) is the estimated total cost of the path through n to the goal: g(n) the cost so far to reach n (path cost) · h(n) the estimated cost from n to the goal (heuristic) · f(n) = g(n) + h(n)","평가 함수 f(n)은 n을 거쳐 목표까지 가는 경로의 추정 총비용: g(n) 지금까지 든 비용 · h(n) 목표까지 추정 비용 · f = g + h"]],
 x:"그래프 색: 파랑(a→b→c)은 g가 작아도 h가 커서 멀어지는 길, 빨강(a→e)은 h(e)=1로 코앞처럼 보이지만 가는 데 이미 9를 쓴 길, 보라(S→a→d→G)가 g+h로 가장 좋은 길. A*는 f(e) = 9 + 1 = 10으로 보고 뒤로 미룹니다.",
 e:"진행: S(6) → a(6) → 프런티어 {d 6, b 8, e 10} → d(6) → G(6) → 해 S→a→d→G, 비용 6. e, b, c는 확장조차 안 함."},
{s:"3-4",im:["3-4-16","3-4-17","3-4-18"],en:"Example: A* Search (1)–(3)",ko:"예: A* 탐색 (1)–(3)",key:1,
 o:[["Expansion rule: f(n) = g(n) + h(n). Expand the node with the lowest f(n). Start at Arad: g = 0, h = 366, so f = 0 + 366 = 366 · h(n) is the straight-line distance to Bucharest","확장 규칙: f(n)이 가장 작은 노드. 아라드: g=0, h=366, f=366"],["Expand Arad: Sibiu 393 = 140 + 253, Timisoara 447 = 118 + 329, Zerind 449 = 75 + 374","아라드 확장: 시비우 393, 티미쇼아라 447, 제린드 449"],["Expand Sibiu: Arad 646 = 280 + 366, Fagaras 415 = 239 + 176, Oradea 671 = 291 + 380, Rimnicu Vilcea 413 = 220 + 193","시비우 확장: 아라드 646, 파가라스 415, 오라데아 671, 림니쿠빌체아 413"]],
 x:"여기서 greedy와 갈립니다! h만 보면 Fagaras(176)가 낫지만 f로 보면 <b>Rimnicu Vilcea(413) &lt; Fagaras(415)</b> — h는 파가라스가 17 작지만 g는 림니쿠빌체아가 19 작아서. Arad(646)는 되돌아가는 길이라 reached 구현에선 다시 넣지 않음. f(시작) = 366은 \"최적 해 비용이 적어도 366\"이라는 추정이기도 함(실제 418)."},
{s:"3-4",im:["3-4-19","3-4-20","3-4-21"],en:"Example: A* Search (4)–(6)",ko:"예: A* 탐색 (4)–(6)",key:1,
 o:[["Expand Rimnicu Vilcea: Craiova 526 = 366 + 160, Pitesti 417 = 317 + 100, Sibiu 553 = 300 + 253","림니쿠빌체아 확장: 크라이오바 526, 피테슈티 417, 시비우 553"],["Expand Fagaras: Sibiu 591 = 338 + 253, Bucharest 450 = 450 + 0","파가라스 확장: 시비우 591, 부쿠레슈티 450"],["Expand Pitesti: Bucharest 418 = 418 + 0, Craiova 615 = 455 + 160, Rimnicu Vilcea 607 = 414 + 193","피테슈티 확장: 부쿠레슈티 418, 크라이오바 615, 림니쿠빌체아 607"]],
 x:"<div class='tw'><table><tr><th>#</th><th>pop (f)</th><th>new on frontier</th></tr><tr><td>1</td><td>Arad 366</td><td>Sibiu 393, Timisoara 447, Zerind 449</td></tr><tr><td>2</td><td>Sibiu 393</td><td>Rimnicu Vilcea 413, Fagaras 415, Oradea 671</td></tr><tr><td>3</td><td>Rimnicu Vilcea 413</td><td>Pitesti 417, Craiova 526</td></tr><tr><td>4</td><td>Fagaras 415</td><td>Bucharest 450 — 목표지만 아직 반환 안 함!</td></tr><tr><td>5</td><td>Pitesti 417</td><td>Bucharest 418 (450 → 418 갱신)</td></tr><tr><td>6</td><td>Bucharest 418</td><td>꺼낼 때 목표 확인 → 최적 418마일</td></tr></table></div>핵심 장면: 파가라스 확장 후 목표가 f=450으로 들어왔지만 A*는 <b>꺼낼 때</b> 검사 — 프런티어의 피테슈티(417)가 \"417까지 가능할지도\"라는 뜻이라 450을 확정하기엔 이릅니다. 결과: Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest, 탐욕적(450)보다 32마일 짧음."},
{s:"3-4",im:["3-4-22"],en:"Breadth-First Search vs A* Search",ko:"너비 우선 탐색 vs A* 탐색",
 o:[["A* search expands fewer nodes than BFS!","A* 탐색은 BFS보다 더 적은 노드를 확장한다!"]],
 x:"BFS(위)는 목표 방향을 모르니 시작점에서 사방으로 둥글게 퍼져 격자 거의 전체가 칠해짐. A*(아래)는 목표 방향으로 쏠려 퍼지고, 벽(장애물)에 부딪히면 주변을 조금 더 탐색해 우회하지만 반대쪽 구석은 비어 있음. 출처: Wikipedia.",
 e:"어두운 방에서 폰 찾기: BFS는 원을 넓혀 가며 바닥 전체, A*는 \"소리가 저쪽에서\" 힌트로 부채꼴."},
{s:"3-4",im:["3-4-23"],en:"Implementation of A* Search",ko:"A* 탐색의 구현",key:1,
 o:[["Path cost to n + heuristic from n to goal = estimate of the total cost. g(n) + h(n)","n까지의 경로 비용 + n에서 목표까지의 휴리스틱 = 총비용 추정치"],["The order in which the frontier is expanded is determined by f(n).","프런티어 확장 순서는 f(n)이 결정한다."]],
 x:"A* = BEST-FIRST-SEARCH(problem, g + h). UCS에서 f=g를 f=g+h로만 바꾸면 됩니다. 강조된 줄 <code>child.PATH-COST &lt; reached[s].PATH-COST</code>가 450 → 418 갱신을 만들며 최적성을 지킵니다. 비교하는 건 f가 아니라 g — 같은 상태끼리는 h가 같으므로 결과는 같음.",
 e:"h(n) = 0이면 f = g → A* = UCS. g를 빼고 h만 남기면 greedy."},
{s:"3-4",im:["3-4-24"],en:"Admissible Heuristics and Optimality",ko:"허용 가능한 휴리스틱과 최적성",key:1,
 o:[["Definition: a heuristic h is admissible when, for every node n, h(n) ≤ h*(n), where h*(n) is the true cost from n to a goal state","정의: 모든 노드 n에 대해 h(n) ≤ h*(n)이면 휴리스틱 h는 허용 가능하다(h* = n에서 목표까지의 실제 비용)"],["An admissible heuristic is a lower bound: it never overestimates the true cost of reaching the goal","허용 가능한 휴리스틱은 하한이다: 목표 도달 비용을 절대 과대평가하지 않는다"],["Example: straight-line distance never overestimates the actual road distance","예: 직선 거리는 실제 도로 거리를 절대 과대평가하지 않는다"],["Theorem: If h is admissible, A* is optimal","정리: h가 허용 가능하면 A*는 최적이다"]],
 x:"Admissible = <b>optimistic</b>(낙관적). 과대평가하면 최적 경로 위 노드의 f가 커 보여 뒤로 밀리고, 그 사이 덜 좋은 목표를 먼저 꺼내 반환할 수 있음. 과소평가는 오히려 기회를 주는 쪽이라 최적 경로를 놓치지 않음(대신 더 많이 볼 수는 있음).",
 e:"허용 O: 직선 거리(366 ≤ 418), h=0(→UCS), 상하좌우 격자의 맨해튼. 허용 X: 직선 거리×2(732 > 418), 대각선 이동 가능한 격자의 맨해튼."},
{s:"3-4",im:["3-4-25"],en:"Proof of A* Optimality",ko:"A* 최적성의 증명",key:1,
 o:[["By contradiction (reductio ad absurdum). Let C* be the optimal path cost","귀류법으로 증명한다. C* = 최적 경로의 비용"],["Suppose some node n on the optimal path is never expanded. If every node on the optimal path had been expanded, the algorithm would have returned the optimal solution.","최적 경로 위의 어떤 노드 n이 끝내 확장되지 않는다고 가정. 최적 경로 위 노드가 모두 확장되었다면 최적 해를 반환했을 것."],["(1) f(n) > C* — otherwise n would have been expanded · (2) f(n) = g(n) + h(n) — by definition · (3) f(n) = g*(n) + h(n) — since n lies on the optimal path · (4) f(n) ≤ g*(n) + h*(n) — by admissibility, h(n) ≤ h*(n) · (5) f(n) ≤ C* — by definition, C* = g*(n) + h*(n)","(1) f(n) > C* (2) f = g + h (3) = g* + h (4) ≤ g* + h* (허용성) (5) ≤ C*"],["Lines (1) and (5) contradict each other. ∴ f(n) ≤ C*","(1)과 (5)가 모순. ∴ f(n) ≤ C*"]],
 x:"기호: g*(n) = 시작~n 최적 비용, h*(n) = n~목표 실제 최적 비용. 결론: 최적 경로 위 노드는 모두 <b>f ≤ C*</b>라 확장되고, 비용이 더 큰 가짜 목표 G₂는 h(G₂)=0이라 <b>f(G₂) = g(G₂) &gt; C*</b> → 항상 늦게 꺼내짐.",
 e:"루마니아: C* = 418. 최적 경로 노드 f = 366, 393, 413, 417 ≤ 418, 가짜 목표 450 > 418 → 피테슈티(417)가 먼저 꺼내짐."},
{s:"3-4",im:["3-4-26"],en:"Proof of A* Optimality: Consistency",ko:"A* 최적성의 증명: 일관성",key:1,
 o:[["Consistency (also called monotonicity): A heuristic h(n) is consistent when, for every node n and every successor n′ generated by action a, h(n) ≤ c(n, a, n′) + h(n′)","일관성(단조성): 모든 노드 n과 행동 a로 생성되는 모든 후속 n′에 대해 h(n) ≤ c(n, a, n′) + h(n′)이면 h는 일관적이다"],["This is a form of the triangle inequality: one side of a triangle can never be longer than the sum of the other two","삼각 부등식의 한 형태: 삼각형의 한 변은 나머지 두 변의 합보다 길 수 없다"],["Consistency implies admissibility. But admissibility cannot imply consistency","일관성은 허용성을 함축한다. 하지만 허용성은 일관성을 함축하지 않는다"]],
 x:"한 걸음 갈 때 h가 그 걸음의 비용보다 더 많이 줄지 않는다는 조건. 일관적이면 경로를 따라 f가 절대 줄지 않음: f(n′) = g(n) + c + h(n′) ≥ g(n) + h(n) = f(n) → 처음 꺼낸 경로가 이미 최적이라 재확장 불필요.",
 e:"허용적이지만 비일관적: S→A(1)→G(3), h(S)=4, h(A)=1 → 둘 다 실제 이하(허용) but 4 ≤ 1 + 1 거짓(비일관)."},
{s:"3-4",im:["3-4-27"],en:"Properties of A* Search",ko:"A* 탐색의 성질",key:1,
 o:[["Completeness? Yes · Cost optimality? Yes","완전성? 예 · 비용 최적성? 예"],["Time complexity? In the worst case the number of nodes with f(n) ≤ C* is O(b^d), as for BFS","시간? 최악의 경우 f(n) ≤ C*인 노드 수는 BFS처럼 O(b^d)"],["Space complexity? Same as time complexity. This is usually far too large unless we know a very good heuristic","공간? 시간과 같다. 아주 좋은 휴리스틱을 모르면 보통 너무 크다"]],
 x:"A*는 f ≤ C*인 노드를 (거의) 모두 확장: h가 정확할수록 영역이 좁아지고, 0에 가까울수록 UCS처럼 넓어집니다. 프런티어와 reached를 모두 메모리에 유지 → <b>메모리가 가장 큰 약점</b>. (보충: 조건 = b 유한, 모든 비용 ≥ ε &gt; 0. 메모리 대안 IDA*)",
 e:"8-퍼즐(약 18만 상태)은 금방, 15-퍼즐(약 10<sup>13</sup>)은 좋은 휴리스틱 없이는 메모리가 못 버틴다."},
{s:"3-4",im:[],en:"Supplement: Designing Heuristics · Weighted A*",ko:"보충: 휴리스틱 설계 · 가중 A* (슬라이드 없음)",
 o:[],
 x:"강의 개요(3-4 p.2)에 있지만 이번 PDF에 슬라이드가 없는 내용입니다. 교수님 설명 방식이 다를 수 있습니다.<ul><li><b>8-puzzle heuristics</b>: h₁ = 제자리에 없는 타일 수(misplaced tiles), h₂ = 맨해튼 거리 합. 시작 상태 7 2 4 / 5 _ 6 / 8 3 1 → h₁ = 8, h₂ = 18.</li><li><b>Relaxed problem</b>(완화된 문제): 규칙을 일부 없앤 쉬운 문제의 최적 비용은 허용적 휴리스틱. 순간이동 허용 → h₁, 겹쳐도 인접 이동 허용 → h₂. 루마니아 직선 거리도 '도로를 따라야 한다'를 없앤 완화 문제.</li><li><b>Dominance</b>(지배): 둘 다 허용적이고 항상 h₂ ≥ h₁이면 h₂가 더 좋음. d=12에서 IDS 3,644,035 vs A*(h₁) 227 vs A*(h₂) 73 노드. max(h₁, h₂, …)도 허용적.</li><li><b>Pattern database</b>: 부분 문제(예: 타일 1~4만)의 정확한 최소 비용을 미리 계산해 표로 저장.</li></ul><div class='tw'><table><tr><th>f(n) = g + W·h</th><th>Algorithm</th></tr><tr><td>W = 0</td><td>UCS</td></tr><tr><td>W = 1</td><td>A*</td></tr><tr><td>1 &lt; W &lt; ∞</td><td>Weighted A* (빠르지만 최적의 W배 이내)</td></tr><tr><td>W → ∞</td><td>Greedy best-first</td></tr></table></div>"},
/* ===================== CHAPTER 4 ===================== */
/* ---- 4-1 Local Search & Continuous Spaces ---- */
{s:"4-1",im:["4-1-01","4-1-02"],en:"Local Search: What It Is",ko:"지역 탐색이란",key:1,
 o:[["Local search: works from the current state and moves to a neighboring state. It does not keep the path, and the sequence of states reached does not matter.","지역 탐색(local search): 현재 상태에서 출발해 이웃 상태로 이동한다. 경로를 저장하지 않고, 거쳐 온 상태의 순서도 중요하지 않다."],
    ["Examples: N-queens, integrated-circuit design, factory floor layout, network optimization, crop planning.","예: N-퀸, 집적회로 설계, 공장 배치, 네트워크 최적화, 작물 계획."],
    ["Not systematic (can fail to find a solution); uses very little memory; works even in an infinite (continuous) state space; well suited to optimization.","체계적이지 않아 해를 못 찾을 수도 있음 · 메모리를 거의 안 씀 · 무한(연속) 상태 공간에서도 동작 · 최적화 문제에 적합."]],
 x:"3장의 탐색(search)은 <b>목표까지 가는 경로</b>를 찾는 것이었습니다. 지역 탐색(local search)은 <b>경로는 버리고 좋은 상태 자체</b>만 찾습니다. N-퀸의 답은 '어떻게 놓았는가'(경로)가 아니라 '최종 배치'(상태)이기 때문입니다. 그래서 현재 상태 하나만 들고 이웃으로 조금씩 옮겨 가며, 목적 함수(objective function)를 더 좋게 만드는 상태를 찾습니다.",
 e:"미로 탈출(3장)은 '어느 길로 갔는지'가 답이지만, 8-퀸은 '최종 배치'만 답입니다. 후자가 지역 탐색이 어울리는 문제입니다."},
{s:"4-1",im:["4-1-03"],en:"Local Search as Iterative Improvement",ko:"반복 개선으로서의 지역 탐색",
 o:[["In many optimization problems the path is irrelevant; the goal state is itself the solution.","많은 최적화 문제에서 경로는 무의미하고, 목표 상태 자체가 해다."],
    ["State space = set of complete configurations. Find one satisfying constraints (n-queens), or find the optimal one (TSP).","상태 공간 = '완성된' 구성(configuration)들의 집합. 제약을 만족하는 것을 찾거나(N-퀸), 최적인 것을 찾는다(외판원 문제)."],
    ["Use an iterative improvement algorithm: keep a single current state and try to improve it.","반복 개선(iterative improvement) 알고리즘을 쓴다: 현재 상태 하나를 들고 계속 개선한다."]],
 x:"핵심 구분: <b>constraint satisfaction</b>(제약 만족 — 조건을 만족하는 아무 배치, N-퀸)와 <b>optimization</b>(최적화 — 가장 좋은 배치, TSP). 둘 다 '완성된 구성'들 사이를 옮겨 다니며 개선합니다."},
{s:"4-1",im:["4-1-04"],en:"How Local Search Differs from Tree Search",ko:"트리 탐색과의 차이",key:1,
 o:[["Each state's utility (score) is known or computable; the goal is the state with highest utility.","각 상태의 효용(utility, 점수)을 알거나 계산할 수 있고, 목표는 효용이 가장 높은 상태다."],
    ["Often no explicit initial state; neither the path nor its cost matters.","명시적 초기 상태가 없을 때가 많고, 경로도 경로 비용도 중요하지 않다."],
    ["No search tree. Only the current state is stored — almost no memory, very simple code (constant space).","탐색 트리가 없다. 현재 상태만 저장 — 메모리 거의 없음, 코드 단순(상수 공간)."]],
 x:"메모리 비교가 핵심입니다. BFS·A*는 프런티어 + reached 표로 <code>O(b^d)</code>, DFS/IDS는 <code>O(bd)</code>가 필요하지만, 지역 탐색은 현재 상태 하나라서 <b>상수(constant) 공간</b>입니다. 그래서 거대한/연속 공간과 online search(온라인 탐색)에도 쓸 수 있습니다.",
 e:""},
{s:"4-1",im:["4-1-05"],en:"The State-Space Landscape",ko:"상태 공간 지형",key:1,
 o:[["Treat the objective function as elevation. The goal of local search is the global maximum, and climbing towards it is hill climbing.","목적 함수를 '높이'로 보면, 지역 탐색의 목표는 전역 최댓값(global maximum)이고 그쪽으로 오르는 것이 언덕 오르기(hill climbing)다."],
    ["How do we escape a local maximum? One answer: start hill climbing again from a random state.","지역 최댓값(local maximum)을 어떻게 벗어나나? 한 방법: 임의 상태에서 다시 시작."]],
 x:"지형(landscape) 비유: 가로축은 상태 공간, 세로축은 목적 함수 값(높이). 봉우리가 <b>global maximum</b>(전역 최댓값)이면 좋지만, 중간에 작은 봉우리(<b>local maximum</b>)에 갇힐 수 있습니다. 이 그림의 용어(global/local maximum, shoulder, plateau)가 이 단원 내내 쓰입니다."},
{s:"4-1",im:["4-1-06"],en:"Convex and Non-Convex Optimisation",ko:"볼록/비볼록 최적화",
 o:[["Convex: one global optimum, a smooth continuous function. Solve by differentiating, f'(x) = 0.","볼록(convex): 전역 최적이 하나, 매끄러운 연속 함수. 미분해서 f'(x) = 0으로 푼다."],
    ["Non-convex: many local optima, so the solution is hard to find.","비볼록(non-convex): 지역 최적이 여러 개여서 해를 찾기 어렵다."]],
 x:"볼록 함수는 봉우리가 하나뿐이라 미분으로 바로 풀립니다. 비볼록은 봉우리가 많아 어디서 출발했느냐에 따라 엉뚱한 지역 최적에 갇힙니다 — 이것이 뒤에 나오는 random restart, simulated annealing이 필요한 이유입니다."},
{s:"4-1",im:["4-1-07"],en:"Hill-Climbing Search (Greedy Local Search)",ko:"언덕 오르기 탐색 (탐욕적 지역 탐색)",key:1,
 o:[["Idea: start wherever; repeat: move to the best neighboring state; if no neighbor is better, quit.","생각: 아무 데서나 시작 → 반복: 가장 좋은 이웃으로 이동 → 더 나은 이웃이 없으면 종료."],
    ["Greedy like Chapter 3's greedy best-first search: it follows the objective function alone and never looks ahead.","3장의 탐욕적 최선 우선처럼 탐욕적(greedy): 목적 함수만 보고 앞을 내다보지 않는다."],
    ["Keeps only the current state. There is no frontier.","현재 상태만 유지한다. 프런티어가 없다."]],
 x:"언덕 오르기는 '지금 위치에서 가장 가파르게 오르는 쪽으로 한 발'을 반복합니다. 앞을 안 보기 때문에 더 오를 데가 없으면 멈추는데, 그 지점이 전역 최댓값이라는 보장은 없습니다(= 불완전·비최적).",
 e:"안개 속에서 발밑 경사만 보고 산을 오르는 것과 같습니다. 가장 가까운 봉우리까지는 가지만, 더 높은 옆 산은 못 봅니다."},
{s:"4-1",im:["4-1-08"],en:"Minimization and Maximization Are the Same Problem",ko:"최소화와 최대화는 같은 문제",
 o:[["In AI, hill climbing walks uphill toward the maximum; in practice problems are often minimization.","AI에서 언덕 오르기는 최댓값을 향해 오르지만, 실제 문제는 최소화로 적힐 때가 많다."],
    ["The two are the same: max f(x) is min -f(x).","둘은 같다: max f(x) = min -f(x)."]],
 x:"부호만 뒤집으면 됩니다. 비용(cost)·오차(error)·충돌 수처럼 '작을수록 좋은' 값은 <code>-f</code>로 바꿔 최댓값 찾기와 똑같이 다룹니다. 그래서 '언덕 오르기'와 '경사 하강'은 같은 아이디어입니다."},
{s:"4-1",im:["4-1-09"],en:"Hill-Climbing Search: The Algorithm",ko:"언덕 오르기 알고리즘",key:1,
 o:[["Steepest-ascent: generate ALL successors, take the highest-valued one.","최대 경사(steepest-ascent): 모든 후계를 만들어 가장 값이 높은 것을 택한다."],
    ["Stochastic: generate all, choose at random among the uphill moves (less greedy).","확률적(stochastic): 모두 만들되 오르막 중 무작위로 택한다(덜 탐욕적)."],
    ["First-choice stochastic: generate one random successor at a time, move only if it is better.","첫 선택 확률적(first-choice): 무작위 후계를 하나씩 만들어 더 좋으면 바로 이동."]],
 x:"<div class='tw'><table><tr><th>변형</th><th>후계 생성</th><th>이동</th></tr><tr><td>Steepest-ascent</td><td>전부</td><td>가장 가파른 오르막</td></tr><tr><td>Stochastic</td><td>전부</td><td>오르막 중 무작위</td></tr><tr><td>First-choice</td><td>하나씩</td><td>처음 만난 오르막</td></tr></table></div>후계가 수천 개일 때는 first-choice가 유리합니다(전부 만들 필요 없음).",
 e:""},
{s:"4-1",im:["4-1-10","4-1-11"],en:"A Heuristic for the n-Queens Problem",ko:"N-퀸 문제의 휴리스틱",
 o:[["States: n queens, one per column. Actions: move a queen within its column.","상태: 각 열에 퀸 하나씩 n개. 행동: 한 퀸을 같은 열 안에서 옮김."],
    ["Heuristic h = the number of conflicts (pairs of queens attacking each other).","휴리스틱 h = 충돌 수(서로 공격하는 퀸 쌍의 수)."],
    ["The boards show h falling 5 → 2 → 0: two moves solve it.","보드는 h가 5 → 2 → 0으로 줄어든다: 두 번 옮겨 해결."]],
 x:"여기서는 <b>최소화</b> 문제입니다(충돌 h를 0으로). 각 칸의 숫자는 그 퀸을 그 칸으로 옮겼을 때의 h입니다. 언덕 오르기는 매번 h가 가장 작아지는 이동을 고릅니다. h = 0이면 아무 퀸도 서로 공격하지 않으니 해입니다."},
{s:"4-1",im:["4-1-12"],en:"Local Optima: Maxima, Ridges and Plateaus",ko:"지역 최적: 최댓값·능선·고원",key:1,
 o:[["Local maximum: higher than its neighbors but lower than the global maximum.","지역 최댓값: 이웃보다 높지만 전역 최댓값보다는 낮음."],
    ["Ridge: a sequence of local maxima; a greedy algorithm has trouble crossing one.","능선(ridge): 지역 최댓값이 줄지은 지형; 탐욕적 알고리즘이 넘기 어려움."],
    ["Plateau: a flat region — a flat local maximum with no uphill exit, or a shoulder from which progress is still possible.","고원(plateau): 평평한 구역 — 오르막 출구가 없는 평평한 지역 최댓값이거나, 아직 나아갈 수 있는 어깨(shoulder)."],
    ["Is hill climbing complete or optimal? No — it can get stuck in any of these.","언덕 오르기는 완전·최적인가? 아니다 — 이 셋 어디에나 갇힐 수 있다."]],
 x:"언덕 오르기가 실패하는 세 지형입니다. <b>local maximum</b>에서는 모든 이웃이 더 낮아 멈추고, <b>ridge</b>는 비스듬해서 한 발씩으로는 못 넘고, <b>plateau</b>는 평평해서 어디로 갈지 모릅니다. 그래서 '완전하지도 최적이지도 않다'가 결론입니다."},
{s:"4-1",im:["4-1-13"],en:"Local Optima: An Example, and Random Restart",ko:"지역 최적 예시와 무작위 재시작",
 o:[["An 8-queens local optimum: no single-column move improves h, yet one attacking pair remains.","8-퀸의 지역 최적: 어떤 열 이동으로도 h가 줄지 않지만 공격 쌍이 하나 남음."],
    ["Random-restart hill climbing: run from several random initial states, return the best result.","무작위 재시작(random-restart): 여러 임의 초기 상태에서 돌려 가장 좋은 결과를 반환."],
    ["Works with any stochastic algorithm, not just this one.","이 알고리즘뿐 아니라 어떤 확률적 알고리즘에도 통한다."]],
 x:"갇히면 '처음부터 다시, 다른 출발점에서' 여러 번 시도하는 단순하지만 강력한 전략입니다. 언덕 오르기 한 번의 성공 확률이 p면, 평균 1/p번 재시작하면 해를 찾습니다. 봉우리가 많아도 결국 전역 최댓값을 만납니다."},
{s:"4-1",im:["4-1-14","4-1-15"],en:"Simulated Annealing",ko:"담금질 모사",key:1,
