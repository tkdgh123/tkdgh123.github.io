a</td><td>118</td><td>329</td><td>118</td><td>329</td><td>447</td></tr><tr><td>Rimnicu Vilcea</td><td>220</td><td>193</td><td>220</td><td>193</td><td><b>413</b></td></tr><tr><td>Fagaras</td><td>239</td><td>176</td><td>239</td><td><b>176</b></td><td>415</td></tr></table></div>UCS는 Zerind, 탐욕적은 Fagaras, A*는 Rimnicu Vilcea를 고릅니다. 코드는 3-3 16쪽의 BEST-FIRST-SEARCH 그대로이고 f 인자만 바꿉니다."}, {"s": "3-4", "im": ["3-4-12"], "en": "Implementation: Greedy Best-First Search", "ko": "구현: 탐욕적 최선 우선 탐색 (의사코드)", "o": [["Because f(n) = h(n), it expands the node with the lowest estimated cost.", "f(n) = h(n)이므로, 추정 비용이 가장 낮은 노드를 확장한다."], ["function BEST-FIRST-SEARCH(problem, <b>f</b>) returns a solution node or failure / node ← NODE(STATE=problem.INITIAL) / frontier ← <b>a priority queue ordered by f</b>, with node as an element / reached ← a lookup table, with one entry with key problem.INITIAL and value node / while not IS-EMPTY(frontier) do / node ← POP(frontier) / if problem.IS-GOAL(node.STATE) then return node / for each child in EXPAND(problem, node) do / s ← child.STATE / if s is not in reached or child.PATH-COST < reached[s].PATH-COST then / reached[s] ← child / add child to frontier / return failure", "핵심: UCS와 같은 코드 — <b>f로 정렬된 우선순위 큐</b>에 f = h만 넘긴다 / reached 갱신은 여전히 PATH-COST(g)로 비교", "code"], ["The order in which the frontier is expanded is decided by f(n).", "프런티어가 확장되는 순서는 f(n)이 결정한다."]], "x": "탐욕적 탐색의 의사코드는 3-3 16쪽의 BEST-FIRST-SEARCH와 <b>한 글자도 다르지 않습니다</b>. 형광펜 부분만 보면 됩니다: 인자 f와 \"f로 정렬된 우선순위 큐\". f = h를 넘기면 h가 가장 작은 노드가 먼저 나옵니다.<br>재미있는 점: reached를 갱신할지 판단하는 줄은 f가 아니라 여전히 <b>PATH-COST(= g)</b>를 비교합니다. 즉 꺼내는 <b>순서</b>는 h로 정하지만, 같은 상태에 두 경로가 도달했을 때 어느 쪽을 <b>기록</b>할지는 g(더 싼 경로)로 정합니다. 그래서 탐욕적 탐색도 되돌아온 경로가 더 싸면 갱신은 하지만, 꺼내는 순서가 h라서 최적성은 여전히 보장되지 않습니다.", "e": "파이썬 heapq로 쓰면 우선순위 큐에 넣는 튜플만 다릅니다: (h, node) → 탐욕적, (g, node) → UCS, (g + h, node) → A*."}, {"s": "3-4", "im": ["3-4-13"], "en": "Properties of Greedy Best-First Search (2)", "ko": "탐욕적 최선 우선 탐색의 성질 (2)", "key": 1, "o": [["Completeness? Yes — best-first search is complete in a finite space / Cost optimality? No", "완전성? 예 — 최선 우선 탐색은 유한한 공간에서 완전하다 / 비용 최적성? 아니오"], ["Time complexity? worst case: O(b<sup>m</sup>) — similar to DFS / best case: O(bm) — if h(n) were 100% accurate it would expand a single path", "시간 복잡도? 최악의 경우: O(b<sup>m</sup>) — DFS와 비슷 / 최선의 경우: O(bm) — h(n)이 100% 정확하다면 경로 하나만 확장할 것"], ["Space complexity? The same as its time complexity", "공간 복잡도? 시간 복잡도와 같다"], ["Do you remember? b: maximum branching factor, m: maximum depth of tree, d: depth of the optimal solution", "기억하나요? b: 최대 분기 계수, m: 트리의 최대 깊이, d: 최적 해의 깊이"]], "x": "탐욕적 탐색의 성적표.<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간</th><th>공간</th></tr><tr><td>예 (유한 공간, reached 사용)</td><td>아니오</td><td>최악 O(b<sup>m</sup>), 최선 O(bm)</td><td>시간과 같음</td></tr></table></div>성능이 전적으로 <b>h의 품질</b>에 달려 있다는 것이 핵심입니다.<ul><li><b>최악 O(b<sup>m</sup>)</b>: h가 엉터리면 틀린 방향으로 계속 깊이 파고듭니다 — 사실상 DFS와 같아져서 트리 전체(b<sup>m</sup>)를 볼 수 있습니다.</li><li><b>최선 O(bm)</b>: h가 완벽하면 매 단계 올바른 자식을 고르므로 경로 하나만 따라갑니다. 단계마다 자식 b개를 만들어 보고, 최대 m단계 → b × m.</li><li>공간 = 시간: 만든 노드를 프런티어와 reached에 모두 보관하기 때문입니다.</li></ul>", "e": "미로에서 목표가 벽 바로 너머에 있는데 실제 입구는 반대편 끝이라면, 직선 거리 h는 계속 벽 쪽을 가리켜서 벽 주변을 한참 헤맵니다. h가 나쁜 상황의 예."}, {"s": "3-4", "im": ["3-4-14"], "en": "Why Greedy Best-First Search Is Not Cost Optimal", "ko": "탐욕적 탐색이 비용 최적이 아닌 이유", "key": 1, "o": [["h = 1 looks better than h = 2", "h = 1이 h = 2보다 좋아 보인다"], ["Greedy best-first search follows that path and never reconsiders it.", "탐욕적 최선 우선 탐색은 그 경로를 따라가고 다시는 재고하지 않는다."], ["It weighs only the estimated cost to the goal: never the cost already paid.", "목표까지의 추정 비용만 저울질한다: 이미 지불한 비용은 절대 고려하지 않는다."]], "x": "탐욕적 탐색이 최적이 아닌 이유를 보여 주는 작은 그래프입니다. 시작에서 목표까지 두 길이 있습니다(모든 간선 비용 1):<ul><li><b>위쪽 길</b>: 시작 → (h = 2) → (h = 1) → 목표. <b>3걸음</b>.</li><li><b>아래쪽 길</b>(빨간 화살표): 시작 → (h = 1) → (h = 1) → (h = 1) → (h = 1) → (h = 1) → 목표. <b>6걸음</b>.</li></ul>시작 노드를 확장하면 프런티어에 위쪽 h = 2 노드와 아래쪽 h = 1 노드가 들어옵니다. 탐욕적 탐색은 h = 1을 고릅니다. 그 노드를 확장하면 또 h = 1 노드가 나오고, 프런티어의 위쪽 노드는 여전히 h = 2라 매번 집니다. 아래쪽 길에서 이미 5걸음을 썼어도(g = 5) 그 비용은 보지 않으므로, 결국 6걸음짜리 해를 반환합니다. 이 그림의 h는 허용적(실제 이하)인데도 틀립니다 — 문제는 h의 품질이 아니라 <b>g를 안 본다는 것</b>입니다.", "e": "A*였다면: 아래쪽으로 2걸음 가면 f = 2 + 1 = 3, 3걸음째는 f = 3 + 1 = 4가 되어 위쪽 첫 노드의 f = 1 + 2 = 3보다 커집니다 → 위쪽으로 돌아가 3걸음 해를 찾습니다."}, {"s": "3-4", "im": ["3-4-15"], "en": "A* Search", "ko": "A* 탐색", "key": 1, "o": [["Idea: to avoid expanding paths that are already very expensive, let <b>g(n)</b> be the <b>path cost</b> to node n, and take it into account.", "아이디어: 이미 매우 비싼 경로를 확장하지 않도록, <b>g(n)</b>을 노드 n까지의 <b>경로 비용</b>이라 하고 이것을 고려에 넣는다."], ["The evaluation function f(n) is the estimated total cost of the path through n to the goal: g(n): the cost so far, to reach node n (path cost) / h(n): the estimated cost from n to the goal (heuristic) / f(n) = g(n) + h(n)", "평가 함수 f(n)은 n을 거쳐 목표까지 가는 경로의 추정 총비용이다: g(n): 노드 n에 도달하기까지 지금까지 든 비용(경로 비용) / h(n): n에서 목표까지의 추정 비용(휴리스틱) / f(n) = g(n) + h(n)"]], "x": "<b>A* 탐색</b>(에이스타). 탐욕적 탐색의 약점(이미 쓴 비용을 무시)을 고치기 위해 g(n)을 더합니다.<div class='formula'>f(n) = g(n) + h(n)<br>= (시작 → n 실제 비용) + (n → 목표 추정 비용)<br>= \"n을 거쳐 목표까지 가는 경로의 총비용 추정\"</div>왼쪽 그래프(간선 비용: S→a 1, a→b 1, b→c 1, a→d 3, a→e 8, e→d 1, d→G 2; h는 각 노드 옆)의 세 가지 길:<ul><li><b>파랑 a → b → c</b>: g는 작지만(2, 3) h가 커서(6, 7) 목표에서 멀어지는 길. f = 8, 10.</li><li><b>빨강 a → e</b>: h(e) = 1이라 목표가 코앞처럼 보이지만, 가는 데 이미 8을 써서 g = 9. f = 10. 탐욕적 탐색이라면 h = 1에 속아 이쪽으로 갔을 것.</li><li><b>보라 S → a → d → G</b>: g + h로 보면 가장 좋은 길. f(d) = 4 + 2 = 6, f(G) = 6 + 0 = 6.</li></ul>오른쪽 트리는 각 노드의 g와 h를 적은 탐색 트리입니다. A*의 진행: S(f 6) → a(6) → 프런티어 {d 6, b 8, e 10} → d(6) → G(6) → 해 S → a → d → G, 비용 6. e, b, c는 확장조차 하지 않습니다."}, {"s": "3-4", "im": ["3-4-16", "3-4-17", "3-4-18"], "en": "Example: A* Search (1)–(3)", "ko": "예: A* 탐색 (1)–(3)", "key": 1, "o": [["Expansion rule: f(n) = g(n) + h(n) / Expand the node with the smallest f(n). Start at Arad: g = 0, h = 366, so f = 0 + 366 = 366 / h(n) is the straight-line distance to Bucharest.", "확장 규칙: f(n) = g(n) + h(n) / f(n)이 가장 작은 노드를 확장한다. 아라드에서 시작: g = 0, h = 366, 따라서 f = 0 + 366 = 366 / h(n)은 부쿠레슈티까지의 직선 거리."], ["Expand Arad: Sibiu 393 = 140 + 253, Timisoara 447 = 118 + 329, Zerind 449 = 75 + 374", "아라드 확장: 시비우 393 = 140 + 253, 티미쇼아라 447 = 118 + 329, 제린드 449 = 75 + 374"], ["Expand Sibiu: Arad 646 = 280 + 366, Fagaras 415 = 239 + 176, Oradea 671 = 291 + 380, Rimnicu Vilcea 413 = 220 + 193", "시비우 확장: 아라드 646 = 280 + 366, 파가라스 415 = 239 + 176, 오라데아 671 = 291 + 380, 림니쿠빌체아 413 = 220 + 193"]], "x": "루마니아 문제에 A*를 적용합니다. 트리의 각 노드 아래 숫자는 <b>f = g + h</b>로, 예를 들어 Sibiu의 393 = 140(Arad → Sibiu 도로) + 253(Sibiu의 직선 거리)입니다.<ul><li><b>Arad 확장</b>: Sibiu 393, Timisoara 447, Zerind 449. Zerind는 도로가 75로 가장 싸지만 직선 거리 374가 커서 f가 가장 큽니다 → Sibiu 선택.</li><li><b>Sibiu 확장</b>: Arad 646(되돌아가는 길, g = 280), Fagaras 415, Oradea 671, Rimnicu Vilcea 413.</li></ul>여기서 탐욕적 탐색과 갈립니다! h만 보면 Fagaras(176)가 Rimnicu Vilcea(193)보다 낫지만, f로 보면 <b>Rimnicu Vilcea 413 &lt; Fagaras 415</b>입니다. h는 Fagaras가 17 작지만 g는 Rimnicu Vilcea가 19 작기 때문입니다(220 vs 239). Arad(646)는 reached 구현에서는 이미 더 싼 기록(g = 0)이 있어 프런티어에 넣지 않습니다. 참고: f(Arad) = 366은 \"최적 해의 비용은 적어도 366\"이라는 추정이기도 합니다(실제 418).", "pg": [[1, 1], [1, 1], [1, 1]]}, {"s": "3-4", "im": ["3-4-19", "3-4-20", "3-4-21"], "en": "Example: A* Search (4)–(6)", "ko": "예: A* 탐색 (4)–(6)", "key": 1, "o": [["Expand Rimnicu Vilcea: Craiova 526 = 366 + 160, Pitesti 417 = 317 + 100, Sibiu 553 = 300 + 253", "림니쿠빌체아 확장: 크라이오바 526 = 366 + 160, 피테슈티 417 = 317 + 100, 시비우 553 = 300 + 253"], ["Expand Fagaras: Sibiu 591 = 338 + 253, Bucharest 450 = 450 + 0", "파가라스 확장: 시비우 591 = 338 + 253, 부쿠레슈티 450 = 450 + 0"], ["Expand Pitesti: Bucharest 418 = 418 + 0, Craiova 615 = 455 + 160, Rimnicu Vilcea 607 = 414 + 193", "피테슈티 확장: 부쿠레슈티 418 = 418 + 0, 크라이오바 615 = 455 + 160, 림니쿠빌체아 607 = 414 + 193"]], "x": "A* 전체 진행을 표로 정리하면:<div class='tw'><table><tr><th>#</th><th>꺼냄 (f)</th><th>프런티어에 새로 들어옴</th></tr><tr><td>1</td><td>Arad 366</td><td>Sibiu 393, Timisoara 447, Zerind 449</td></tr><tr><td>2</td><td>Sibiu 393</td><td>Rimnicu Vilcea 413, Fagaras 415, Oradea 671</td></tr><tr><td>3</td><td>Rimnicu Vilcea 413</td><td>Pitesti 417, Craiova 526</td></tr><tr><td>4</td><td>Fagaras 415</td><td><b>Bucharest 450</b> — 목표지만 아직 반환하지 않음!</td></tr><tr><td>5</td><td>Pitesti 417</td><td>Bucharest 418 (450 → 418로 갱신)</td></tr><tr><td>6</td><td>Bucharest 418</td><td>꺼낼 때 목표 확인 → 최적 해 418마일</td></tr></table></div>핵심 장면은 4~5단계입니다. Fagaras를 확장하자 목표 Bucharest가 f = 450으로 프런티어에 들어왔지만, A*는 <b>꺼낼 때</b> 목표를 검사합니다(늦은 목표 검사). 프런티어에 Pitesti(417)가 남아 있다는 것은 \"417까지 가능할지도 모른다\"는 뜻이므로 450을 확정하기엔 이릅니다. 실제로 Pitesti를 확장하니 Bucharest에 418로 도달했고, 더 싼 경로라 reached가 갱신됩니다(23쪽). 그다음 꺼낸 것이 Bucharest 418 → 반환. 결과: Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest = 418마일. 탐욕적 탐색(450)보다 32마일 짧고, 확장한 노드는 5개뿐입니다(UCS라면 훨씬 많이 확장).", "e": "만약 A*가 만들 때 목표를 검사했다면(BFS처럼) 4단계에서 450을 반환해 틀렸을 것입니다. UCS/A*가 늦은 목표 검사를 쓰는 이유(3-3 16쪽)가 바로 이것.", "pg": [[1, 1], [1, 1], [1, 1]]}, {"s": "3-4", "im": ["3-4-22"], "en": "Breadth-First Search vs A* Search", "ko": "너비 우선 탐색 vs A* 탐색", "o": [["A* Search expands fewer nodes than BFS!", "A* 탐색은 BFS보다 더 적은 노드를 확장한다!"], ["Source: Wikipedia (https://en.wikipedia.org/wiki/A*_search_algorithm)", "출처: 위키백과 (A* search algorithm)"]], "x": "격자 지도에서 빨간 점(시작)에서 초록 점(목표)까지 가는데, 중간에 ㄱ자 벽(회색)이 있습니다. 칠해진 점이 확장된 노드입니다.<ul><li><b>BFS</b>(위): 목표 방향을 모르니 시작점에서 사방으로 둥글게 퍼집니다. 격자 거의 전체가 칠해졌습니다.</li><li><b>A*</b>(아래): 목표 방향으로 쏠려 퍼집니다. 벽에 부딪히면 주변을 조금 더 탐색해 우회하지만, 목표 반대쪽 구석은 비어 있습니다.</li></ul>둘 다 같은 최단 경로(연두색 선)를 찾지만, A*가 훨씬 적은 노드로 찾습니다. 이것이 h(n)이라는 힌트의 가치입니다. 왼쪽 가운데 그림은 A*가 쓰는 h — 시작에서 목표까지의 직선(유클리드) 거리 — 를 보여 줍니다.", "e": "어두운 방에서 떨어뜨린 폰 찾기: BFS는 내 자리에서 원을 넓혀 가며 바닥 전체를 더듬고, A*는 \"소리가 저쪽에서 났다\"는 힌트로 그쪽 부채꼴만 더듬습니다."}, {"s": "3-4", "im": ["3-4-23"], "en": "Implementation of A* Search", "ko": "A* 탐색의 구현", "key": 1, "o": [["Path cost to n + heuristic from n to the goal = estimate of the total cost. g(n) + h(n)", "n까지의 경로 비용 + n에서 목표까지의 휴리스틱 = 총비용의 추정치. g(n) + h(n)"], ["function BEST-FIRST-SEARCH(problem, <b>f</b>) … frontier ← <b>a priority queue ordered by f</b> … if s is not in reached or <b>child.PATH-COST</b> < reached[s].PATH-COST then reached[s] ← child; add child to frontier", "핵심: 같은 코드에 f = g + h / <b>child.PATH-COST</b>가 더 작으면 reached를 갱신 → 450 → 418처럼 더 싼 경로로 교체", "code"], ["The order in which the frontier is expanded is decided by f(n).", "프런티어가 확장되는 순서는 f(n)이 결정한다."]], "x": "A* = BEST-FIRST-SEARCH(problem, g + h). 역시 3-3 16쪽 코드 그대로이고 f만 g + h입니다. 형광펜 세 곳:<ul><li><b>f</b>: 이번엔 f(n) = g(n) + h(n).</li><li><b>f로 정렬된 우선순위 큐</b>: f가 가장 작은 노드가 먼저 나옴.</li><li><b>child.PATH-COST &lt; reached[s].PATH-COST</b>: 같은 상태에 더 싼 경로가 나타나면 갱신. 19쪽에서 Bucharest가 450 → 418로 바뀐 것이 이 줄이며, 이것이 최적성을 지켜 줍니다.</li></ul>비교하는 값이 f가 아니라 g인 이유: 같은 상태 s에 도달한 두 노드는 h(s)가 같으므로 g를 비교하나 f를 비교하나 결과가 같습니다.", "e": "h(n) = 0으로 두면 f = g → A*는 UCS가 됩니다. 반대로 g를 빼고 h만 남기면 탐욕적 탐색. A*는 이 둘 사이의 '정답'."}, {"s": "3-4", "im": ["3-4-24"], "en": "Admissible Heuristics and Optimality", "ko": "허용 가능한 휴리스틱과 최적성", "key": 1, "o": [["Definition: a heuristic h is <b>admissible</b> when, for every node n, h(n) ≤ h*(n), where h*(n) is the true cost from n to a goal state", "정의: 모든 노드 n에 대해 h(n) ≤ h*(n)이면 휴리스틱 h는 <b>허용 가능(admissible)</b>하다. 여기서 h*(n)은 n에서 목표 상태까지의 실제 비용"], ["An admissible heuristic is a lower bound: it never overestimates the true cost of reaching the goal", "허용 가능한 휴리스틱은 하한이다: 목표에 도달하는 실제 비용을 절대 과대평가하지 않는다"], ["Example: <b>straight-line distance</b> never overestimates actual road distance", "예: <b>직선 거리</b>는 실제 도로 거리를 절대 과대평가하지 않는다"], ["Theorem: if h is admissible, A* is optimal", "정리: h가 허용 가능하면 A*는 최적이다"]], "x": "A*가 최적이려면 h가 지켜야 할 약속, <b>허용성(admissibility)</b>입니다.<div class='formula'>모든 n에 대해 h(n) ≤ h*(n)   (h* = n에서 목표까지의 <b>실제</b> 최소 비용)</div>한마디로 \"<b>실제보다 크게 말하지 않는다</b>\" = <b>낙관적(optimistic)</b>. 직선 거리는 어떤 도로도 직선보다 짧을 수 없으므로 허용적입니다(Arad: 366 ≤ 418).<br>왜 이 조건이 필요한가: h가 과대평가하면 최적 경로 위의 노드가 실제보다 나빠 보여(f가 커져) 뒤로 밀리고, 그 사이에 덜 좋은 목표를 먼저 꺼내 반환해 버릴 수 있습니다. 반대로 과소평가는 \"혹시 이 길이 좋을지도\" 하며 기회를 주는 쪽이라 최적 경로를 놓치지 않습니다 — 대신 쓸데없는 노드를 더 볼 수는 있습니다(h = 0이면 UCS처럼 많이 봄). 정리: <b>h가 허용적이면 A*는 최적</b>. 증명은 다음 쪽.", "e": "허용 O: 직선 거리, h = 0(→ UCS), 상하좌우 격자에서의 맨해튼 거리. 허용 X: 직선 거리 × 2(Arad에서 732 > 418), 대각선 이동이 가능한 격자에서의 맨해튼 거리(대각선으로 가면 실제가 더 짧아 과대평가)."}, {"s": "3-4", "im": ["3-4-25"], "en": "Proof of A* Optimality", "ko": "A* 최적성의 증명", "key": 1, "o": [["By contradiction (reductio ad absurdum) / Let C* be the optimal path cost", "귀류법으로 (모순을 이끌어 내는 방법) / C*를 최적 경로의 비용이라 하자"], ["Suppose some node n on the optimal path is never expanded. If every node on the optimal path had been expanded, the algorithm would have returned the optimal solution.", "최적 경로 위의 어떤 노드 n이 끝내 확장되지 않는다고 가정하자. 최적 경로 위의 모든 노드가 확장되었다면, 알고리즘은 최적 해를 반환했을 것이다."], ["(1) f(n) > C* — otherwise n would have been expanded / (2) f(n) = g(n) + h(n) — by definition / (3) f(n) = g*(n) + h(n) — since n lies on the optimal path / (4) f(n) ≤ g*(n) + h*(n) — by admissibility, h(n) ≤ h*(n) / (5) f(n) ≤ C* — by definition, C* = g*(n) + h*(n)", "(1) f(n) > C* — 그렇지 않았다면 n은 확장되었을 것 / (2) f(n) = g(n) + h(n) — 정의에 의해 / (3) f(n) = g*(n) + h(n) — n이 최적 경로 위에 있으므로 / (4) f(n) ≤ g*(n) + h*(n) — 허용성에 의해, h(n) ≤ h*(n) / (5) f(n) ≤ C* — 정의에 의해, C* = g*(n) + h*(n)"], ["Line (1) and line (5) contradict each other. ∴ f(n) ≤ C*", "(1)과 (5)는 서로 모순이다. ∴ f(n) ≤ C*"]], "x": "\"h가 허용적이면 A*는 최적\"의 증명입니다. 기호: C* = 최적 해의 비용, g*(n) = 시작에서 n까지의 최적 비용, h*(n) = n에서 목표까지의 실제 최적 비용.<br><b>귀류법</b>: 반대를 가정하고 모순을 보입니다. A*가 최적이 아니라면 최적 경로 위의 어떤 노드 n을 끝내 확장하지 않았다는 뜻입니다(모두 확장했다면 최적 해를 찾았을 테니). 그 n에 대해:<div class='formula'>(1) f(n) &gt; C*   ← 확장 안 됐다는 것은, C*짜리 목표가 먼저 나올 만큼 f가 컸다는 뜻<br>(2) f(n) = g(n) + h(n)   ← f의 정의<br>(3) f(n) = g*(n) + h(n)   ← n은 최적 경로 위에 있으니 g(n) = g*(n)<br>(4) f(n) ≤ g*(n) + h*(n)   ← 허용성: h(n) ≤ h*(n)<br>(5) f(n) ≤ C*   ← 최적 경로 위에서 g*(n) + h*(n) = C*</div>(1)은 f(n) &gt; C*, (5)는 f(n) ≤ C* — 모순. 따라서 가정이 틀렸고, 최적 경로 위의 노드는 모두 <b>f ≤ C*</b>라서 확장됩니다. 반면 비용이 더 큰 가짜 목표 G₂는 h(G₂) = 0이므로 <b>f(G₂) = g(G₂) &gt; C*</b> — 항상 최적 경로 노드보다 늦게 꺼내집니다. 그래서 최적 목표가 먼저 나옵니다.", "e": "루마니아: C* = 418. 최적 경로 위 노드의 f = 366(Arad), 393(Sibiu), 413(Rimnicu Vilcea), 417(Pitesti) — 모두 ≤ 418. 가짜 목표(Fagaras 경유 Bucharest) f = 450 > 418 → Pitesti(417)가 먼저 꺼내지고 418짜리 해가 발견됩니다."}, {"s": "3-4", "im": ["3-4-26"], "en": "Proof of A* Optimality: Consistency", "ko": "A* 최적성의 증명: 일관성", "key": 1, "o": [["Consistency (also called monotonicity): A heuristic h(n) is consistent when, for every node n and every successor n′ generated by an action a: <b>h(n) ≤ c(n, a, n′) + h(n′)</b>", "일관성(단조성이라고도 함): 모든 노드 n과 행동 a로 생성되는 모든 후속 노드 n′에 대해 <b>h(n) ≤ c(n, a, n′) + h(n′)</b>이면 휴리스틱 h(n)은 일관적이다"], ["This is a form of the triangle inequality: one side of a triangle can never be longer than the sum of the other two", "이것은 삼각 부등식의 한 형태다: 삼각형의 한 변은 나머지 두 변의 합보다 길 수 없다"], ["<b>Consistency implies admissibility</b>. But, <b>admissibility cannot imply consistency</b>", "<b>일관성은 허용성을 함축한다</b>. 하지만 <b>허용성은 일관성을 함축하지 못한다</b>"]], "x": "허용성보다 강한 조건, <b>일관성(consistency, 단조성)</b>입니다.<div class='formula'>h(n) ≤ c(n, a, n′) + h(n′)<br>(n에서 본 남은 거리) ≤ (n → n′ 한 걸음 비용) + (n′에서 본 남은 거리)</div>그림의 삼각형: n에서 목표 G까지 직접 추정한 h(n)이, n′를 거쳐 가는 길(c + h(n′))보다 길면 안 된다는 것 — 삼각형의 한 변이 나머지 두 변의 합보다 길 수 없다는 <b>삼각 부등식</b>과 같은 모양입니다. 쉽게 말하면 \"한 걸음 갈 때 h가 그 걸음의 비용보다 더 많이 줄지 않는다\"입니다.<br>왜 중요한가: 일관적이면 경로를 따라 f가 절대 줄지 않습니다: f(n′) = g(n) + c + h(n′) ≥ g(n) + h(n) = f(n). 그러면 어떤 상태를 처음 꺼냈을 때 그 경로가 이미 최적이라, 나중에 더 싼 경로가 나타나 다시 확장할 일이 없습니다(reached 갱신이 일어나지 않음). 직선 거리는 일관적입니다.<br>관계(초록/빨강): <b>일관적이면 반드시 허용적</b>이지만, <b>허용적이라고 일관적인 것은 아닙니다</b>. 실제로는 허용적인 휴리스틱 대부분이 일관적이기도 합니다.", "e": "허용적이지만 일관적이지 않은 예: S → A 비용 1, A → G 비용 3, h(S) = 4, h(A) = 1. 둘 다 실제(4, 3) 이하라 허용적. 하지만 h(S) = 4 ≤ 1 + h(A) = 2는 거짓 → 비일관적. S에서 A로 한 걸음(비용 1) 갔는데 h가 3이나 줄었습니다."}, {"s": "3-4", "im": ["3-4-27"], "en": "Properties of A* Search", "ko": "A* 탐색의 성질", "key": 1, "o": [["Completeness? Yes / Cost optimality? Yes", "완전성? 예 / 비용 최적성? 예"], ["Time complexity? In the worst case the number of nodes with f(n) ≤ C* is O(b<sup>d</sup>), as for BFS", "시간 복잡도? 최악의 경우 f(n) ≤ C*인 노드의 수는 BFS처럼 O(b<sup>d</sup>)"], ["Space complexity? The same as its time complexity. This is usually far too large unless we know a very good heuristic", "공간 복잡도? 시간 복잡도와 같다. 아주 좋은 휴리스틱을 알지 못하는 한 보통 너무 크다"]], "x": "A*의 성적표.<div class='tw'><table><tr><th>완전성</th><th>비용 최적성</th><th>시간</th><th>공간</th></tr><tr><td>예</td><td>예 (h가 허용적이면)</td><td>최악 O(b<sup>d</sup>)</td><td>시간과 같음</td></tr></table></div>A*는 f ≤ C*인 노드를 (거의) 전부 확장합니다. h가 정확할수록 그 영역이 좁아지고(22쪽 그림의 부채꼴), h가 0에 가까울수록 UCS처럼 넓어집니다. 최악의 경우(h가 거의 정보가 없을 때) BFS와 같은 O(b<sup>d</sup>)입니다.<br>가장 큰 약점은 <b>메모리</b>입니다. 프런티어와 reached를 모두 메모리에 들고 있어야 해서, 아주 좋은 휴리스틱이 없으면 큰 문제에서는 메모리가 먼저 바닥납니다(3-3 13쪽: AI에서는 공간이 시간보다 더 큰 문제). (보충: 완전성 조건은 b 유한, 모든 비용 ≥ ε &gt; 0. 메모리 문제의 대안으로 IDS처럼 f 한계를 늘려 가는 IDA*가 있습니다.)", "e": "8-퍼즐(약 18만 상태)은 A*로 금방 풀리지만, 15-퍼즐(약 10<sup>13</sup> 상태)은 좋은 휴리스틱 없이는 메모리가 버티지 못합니다."}, {"s": "3-4", "im": [], "en": "Supplement: Designing Heuristics · Weighted A*", "ko": "보충: 휴리스틱 설계 · 가중 A* (슬라이드 없음)", "o": [], "x": "강의 개요(3-4 p.2)에 있지만 이번 PDF에 슬라이드가 없는 내용입니다. 교수님 설명 방식이 다를 수 있습니다.<ul><li><b>8-puzzle heuristics</b>: h₁ = 제자리에 없는 타일 수(misplaced tiles), h₂ = 맨해튼 거리 합. 시작 상태 7 2 4 / 5 _ 6 / 8 3 1 → h₁ = 8, h₂ = 18.</li><li><b>Relaxed problem</b>(완화된 문제): 규칙을 일부 없앤 쉬운 문제의 최적 비용은 허용적 휴리스틱. 순간이동 허용 → h₁, 겹쳐도 인접 이동 허용 → h₂. 루마니아 직선 거리도 '도로를 따라야 한다'를 없앤 완화 문제.</li><li><b>Dominance</b>(지배): 둘 다 허용적이고 항상 h₂ ≥ h₁이면 h₂가 더 좋음. d=12에서 IDS 3,644,035 vs A*(h₁) 227 vs A*(h₂) 73 노드. max(h₁, h₂, …)도 허용적.</li><li><b>Pattern database</b>: 부분 문제(예: 타일 1~4만)의 정확한 최소 비용을 미리 계산해 표로 저장.</li></ul><div class='tw'><table><tr><th>f(n) = g + W·h</th><th>Algorithm</th></tr><tr><td>W = 0</td><td>UCS</td></tr><tr><td>W = 1</td><td>A*</td></tr><tr><td>1 &lt; W &lt; ∞</td><td>Weighted A* (빠르지만 최적의 W배 이내)</td></tr><tr><td>W → ∞</td><td>Greedy best-first</td></tr></table></div>"}, {"s": "4-1", "im": ["4-1-01", "4-1-02"], "en": "Local Search: What It Is", "ko": "지역 탐색이란", "key": 1, "o": [["Local search: works from the current state and moves to a neighboring state — It does <b>not keep the path</b>, and the sequence of states reached does not matter", "지역 탐색: 현재 상태에서 출발해 이웃 상태로 이동한다 — <b>경로를 저장하지 않으며</b>, 거쳐 온 상태의 순서도 중요하지 않다"], ["Examples: the N-queens problem, integrated-circuit design, factory floor layout, network optimization, crop planning", "예: N-퀸 문제, 집적회로 설계, 공장 바닥 배치, 네트워크 최적화, 작물 계획"], ["It is not systematic, so it can fail to find a solution at all ☹ / It uses very little memory ☺ / It can find a reasonable solution even in an infinite (continuous) state space ☺ / It is well suited to <b>optimization problems</b> — find the best state by an <b>objective function</b> ☺", "체계적이지 않아서 해를 아예 못 찾을 수도 있다 ☹ / 메모리를 아주 조금만 쓴다 ☺ / 무한한(연속) 상태 공간에서도 쓸 만한 해를 찾을 수 있다 ☺ / <b>최적화 문제</b>에 잘 맞는다 — <b>목적 함수</b>로 가장 좋은 상태를 찾는 것 ☺"]], "x": "4장 파트 I, <b>지역 탐색(local search)</b>입니다. 3장의 탐색은 시작에서 목표까지 가는 <b>경로</b>를 찾는 것이었고, 그래서 트리를 키우며 지나온 길을 전부 기억했습니다. 지역 탐색은 다릅니다: <b>경로는 버리고, 좋은 상태 자체</b>만 찾습니다. 현재 상태 하나만 들고, 이웃 상태로 조금씩 옮겨 가며 더 좋은 상태를 찾습니다. N-퀸의 답은 '퀸을 어떤 순서로 옮겼는가'가 아니라 '최종 배치'이기 때문입니다.<br>장단점(슬라이드의 표정):<ul><li>☹ 체계적이지 않다 — 3장처럼 모든 가능성을 빠짐없이 훑지 않으므로, 해가 있어도 못 찾을 수 있습니다.</li><li>☺ 메모리를 거의 안 쓴다 — 현재 상태 하나뿐.</li><li>☺ 상태가 실수(연속)라 무한히 많아도 동작한다.</li><li>☺ <b>최적화 문제</b>에 잘 맞는다 — 목표가 '조건 만족'이 아니라 '<b>목적 함수(objective function)</b> 값이 가장 좋은 상태 찾기'인 문제.</li></ul>그림의 산꼭대기 사원 = 목적 함수가 가장 높은 상태. 이 단원 내내 '산 오르기' 비유가 쓰입니다.", "e": "미로 탈출(3장)은 '어느 길로 갔는지'가 답이지만, 8-퀸은 '최종 배치'만 답입니다. 후자가 지역 탐색이 어울리는 문제입니다.", "pg": [[1, 0], [1, 3]]}, {"s": "4-1", "im": ["4-1-03"], "en": "Local Search as Iterative Improvement", "ko": "반복 개선으로서의 지역 탐색", "o": [["In many optimization problems <b>the path is irrelevant</b>; the goal state is itself the solution.", "많은 최적화 문제에서 <b>경로는 무의미하다</b>; 목표 상태 자체가 해다."], ["Then state space = set of \"complete\" configurations; find <b>configuration satisfying constraints</b>, e.g., n-queens problem; or, find <b>optimal configuration</b>, e.g., travelling salesperson problem", "그러면 상태 공간 = '완성된' 구성(configuration)들의 집합; <b>제약을 만족하는 구성</b>을 찾거나(예: n-퀸 문제), <b>최적의 구성</b>을 찾는다(예: 외판원 문제)"], ["In such cases use an <b>iterative improvement</b> algorithm: keep a single current state and try to improve it.", "이런 경우 <b>반복 개선(iterative improvement)</b> 알고리즘을 쓴다: 현재 상태 하나를 유지하고 그것을 개선하려 한다."]], "x": "지역 탐색이 다루는 문제의 두 종류:<ul><li><b>제약 만족</b>(constraint satisfaction): 조건을 만족하는 배치라면 아무거나 — 예: N-퀸(서로 공격하지 않는 배치면 됨).</li><li><b>최적화</b>(optimization): 가장 좋은 배치 — 예: 외판원 문제(TSP, 모든 도시를 한 번씩 들르는 가장 짧은 순회 경로. 오른쪽 그림의 빨간 간선처럼 순회에 쓸 간선을 고르는 것).</li></ul>둘 다 상태가 '<b>완성된 구성</b>'입니다. 3장의 8-퍼즐은 중간 상태(아직 안 풀린 판)를 거쳐 갔지만, 여기서는 모든 상태가 '퀸 8개가 다 놓인 판'이나 '완성된 순회 경로'처럼 완전한 후보입니다. 그 후보를 조금씩 고쳐 더 좋게 만드는 것이 <b>반복 개선</b>이고, 현재 상태 하나만 유지합니다.", "e": "TSP 반복 개선: 완성된 순회 경로에서 두 간선을 끊고 다시 잇는(2-opt) 작은 수정을 반복해 총 길이를 줄여 갑니다."}, {"s": "4-1", "im": ["4-1-04"], "en": "How Local Search Differs from Tree Search", "ko": "트리 탐색과의 차이", "key": 1, "o": [["1. Each state's utility (score) is known or can be computed. The goal is to find a state with highest utility", "1. 각 상태의 효용(점수)을 알거나 계산할 수 있다. 목표는 효용이 가장 높은 상태를 찾는 것"], ["2. Often there is no explicit initial state, and neither the path to the goal nor its cost matters", "2. 명시적인 초기 상태가 없을 때가 많고, 목표까지의 경로도 그 비용도 중요하지 않다"], ["3. No search tree is used. Only the current state is stored, and the agent moves to a better state when it can — almost no memory, and very simple code / <b>Constant space complexity (memory)</b>, which suits online search as well as offline search.", "3. 탐색 트리를 쓰지 않는다. 현재 상태만 저장하고, 에이전트는 가능할 때 더 좋은 상태로 이동한다 — 메모리가 거의 없고, 코드가 매우 단순 / <b>상수 공간 복잡도(메모리)</b>, 오프라인 탐색은 물론 온라인 탐색에도 잘 맞는다."]], "x": "3장의 트리 탐색과 세 가지가 다릅니다.<ol><li>상태마다 <b>점수(효용)</b>가 있습니다. 3장에서는 '목표인가 아닌가'만 있었지만, 여기서는 모든 상태에 '얼마나 좋은가'가 매겨집니다.</li><li>정해진 초기 상태가 없어도 됩니다(아무 데서나 출발). 경로와 경로 비용도 필요 없습니다.</li><li><b>탐색 트리가 없습니다.</b> 현재 상태 하나만 저장 → 메모리가 <b>상수</b>.</li></ol>슬라이드 표의 메모리 비교:<div class='tw'><table><tr><th>알고리즘</th><th>저장하는 것</th><th>공간</th></tr><tr><td>BFS</td><td>프런티어 + reached 표</td><td>O(b<sup>d</sup>)</td></tr><tr><td>A*</td><td>프런티어 + reached 표</td><td>O(b<sup>d</sup>)</td></tr><tr><td>DFS / IDS</td><td>현재 경로 + 형제들</td><td>O(bd)</td></tr><tr><td>지역 탐색</td><td>현재 상태</td><td>상수</td></tr></table></div>그래서 상태가 너무 많거나 연속인 공간, 그리고 행동하면서 동시에 탐색하는 <b>온라인 탐색</b>에도 쓸 수 있습니다."}, {"s": "4-1", "im": ["4-1-05"], "en": "The State-Space Landscape", "ko": "상태 공간 지형", "key": 1, "o": [["Treat the objective function as elevation. Then the goal of local search is the global maximum, and climbing towards it is hill climbing", "목적 함수를 높이로 보자. 그러면 지역 탐색의 목표는 전역 최댓값이고, 그쪽으로 오르는 것이 언덕 오르기다"], ["How do we escape a local maximum? — one answer is to start \"hill climbing\" again <b>from a random state</b>", "지역 최댓값을 어떻게 벗어나나? — 한 가지 답은 <b>임의의 상태에서</b> \"언덕 오르기\"를 다시 시작하는 것"]], "x": "이 단원의 핵심 그림, <b>상태 공간 지형(landscape)</b>입니다. 가로축 = 상태 공간(상태들을 한 줄로 늘어놓은 것), 세로축 = 목적 함수 값 u(s) = 높이. 용어:<ul><li><b>global maximum</b>(전역 최댓값): 가장 높은 봉우리. 우리가 찾고 싶은 것.</li><li><b>local maximum</b>(지역 최댓값): 주변보다는 높지만 전역 최댓값은 아닌 작은 봉우리. 여기 서면 어느 쪽도 내리막이라 멈추게 됩니다.</li><li><b>\"flat\" local maximum</b>: 평평한 봉우리. 올라갈 곳이 없습니다.</li><li><b>shoulder</b>(어깨): 평평하지만 지나가면 다시 오르막이 나오는 구간.</li><li><b>current state</b>: 지금 서 있는 곳.</li></ul>현재 상태에서 오르막으로만 가면(<b>언덕 오르기</b>) 가까운 local maximum에 도착해 멈춥니다. 이것을 벗어나는 가장 단순한 방법이 <b>임의의 상태에서 다시 시작</b>하기(13쪽의 random restart)입니다.", "e": "안개 낀 산에서 발밑 경사만 보고 오르면 가장 가까운 봉우리에 서게 되는데, 그것이 최고봉인지는 알 수 없습니다. 헬기로 아무 데나 다시 내려놓고 또 오르면(random restart) 언젠가는 최고봉에 섭니다."}, {"s": "4-1", "im": ["4-1-06"], "en": "Convex and Non-Convex Optimisation", "ko": "볼록/비볼록 최적화", "o": [["Convex: one global optimum, and a smooth continuous function — Solve it by differentiating, f′(x) = 0", "볼록(convex): 전역 최적이 하나뿐이고, 매끄러운 연속 함수 — 미분해서 f′(x) = 0으로 푼다"], ["Non-convex: many local optima, so the solution is hard to find", "비볼록(non-convex): 지역 최적이 많아서 해를 찾기 어렵다"]], "x": "지형의 모양으로 문제의 난이도가 갈립니다.<ul><li><b>볼록(convex)</b> 문제(왼쪽 그릇 모양): 봉우리(또는 골짜기)가 <b>하나</b>뿐입니다. 어디서 출발하든 내리막을 따라가면 같은 바닥에 도착하고, 미분해서 기울기가 0인 점(f′(x) = 0)을 풀면 바로 답입니다. 지역 최적 = 전역 최적.</li><li><b>비볼록(non-convex)</b> 문제(오른쪽 울퉁불퉁한 면): 봉우리와 골짜기가 <b>많습니다</b>. 어디서 출발했느냐에 따라 엉뚱한 지역 최적에 갇히고, 기울기가 0인 점이 수없이 많아 미분만으로는 못 풉니다.</li></ul>현실의 문제(신경망 학습 등)는 대부분 비볼록이고, 그래서 이 단원의 random restart, simulated annealing, beam search, 유전 알고리즘 같은 '지역 최적을 벗어나는 기법'이 필요합니다.", "e": "y = x²는 볼록: 2x = 0 → x = 0이 유일한 최소. y = x⁴ − 3x² 는 비볼록: x = 0은 지역 최대, x = ±√1.5가 전역 최소 — 어느 쪽으로 출발하느냐에 따라 다른 골짜기에 도착."}, {"s": "4-1", "im": ["4-1-07"], "en": "Hill-Climbing Search (Greedy Local Search)", "ko": "언덕 오르기 탐색 (탐욕적 지역 탐색)", "key": 1, "o": [["A simple local search, general idea: Start wherever. / Repeat: move to the best neighboring state. / If no neighbor is better than the current state, quit.", "단순한 지역 탐색, 일반적인 아이디어: 아무 데서나 시작한다. / 반복: 가장 좋은 이웃 상태로 이동한다. / 현재 상태보다 좋은 이웃이 없으면 그만둔다."], ["Greedy in the sense of Chapter 3's greedy best-first search — It follows the objective function alone and never looks ahead", "3장의 탐욕적 최선 우선 탐색과 같은 의미에서 탐욕적 — 목적 함수만 따라가고 앞을 내다보지 않는다"], ["It keeps only the current state. There is no frontier", "현재 상태만 유지한다. 프런티어가 없다"]], "x": "가장 단순한 지역 탐색, <b>언덕 오르기(hill climbing)</b>입니다. 규칙 세 줄: ① 아무 데서나 시작, ② 이웃 중 가장 좋은 곳으로 한 발, ③ 더 좋은 이웃이 없으면 끝. '지금 위치에서 가장 가파르게 오르는 쪽으로 한 발'을 반복하는 것입니다.<br>'탐욕적'이라는 말은 3장의 탐욕적 최선 우선 탐색과 같은 뜻입니다: 당장 눈앞의 값만 보고, 두세 걸음 뒤를 내다보지 않습니다. 그래서 더 오를 데가 없으면 멈추는데, 그 지점이 전역 최댓값이라는 보장이 없습니다 → <b>불완전·비최적</b>. 3장과의 또 다른 차이: 프런티어가 없습니다. 이웃을 만들어 보고 가장 좋은 하나로 옮기면 나머지는 버립니다.", "e": "안개 속에서 발밑 경사만 보고 산을 오르는 것. 가장 가까운 봉우리까지는 확실히 가지만, 더 높은 옆 산이 있어도 모릅니다."}, {"s": "4-1", "im": ["4-1-08"], "en": "Minimization and Maximization Are the Same Problem", "ko": "최소화와 최대화는 같은 문제", "o": [["In AI, hill climbing means walking uphill towards the maximum of a function — In practice the problem is more often stated as a minimization", "AI에서 언덕 오르기는 함수의 최댓값을 향해 오르막을 걷는 것을 뜻한다 — 실제로는 문제가 최소화로 적힐 때가 더 많다"], ["The two are the same: max f(x) is min −f(x)", "둘은 같다: max f(x)는 min −f(x)다"]], "x": "'언덕 오르기'는 최댓값을 찾는 말이지만, 실제 문제는 비용·오차·충돌 수처럼 <b>작을수록 좋은</b> 값을 다룰 때가 많습니다(최소화). 둘은 부호만 다른 같은 문제입니다:<div class='formula'>max f(x) ⇔ min (−f(x))</div>오른쪽 그림은 05쪽의 지형을 위아래로 뒤집은 것입니다 — 봉우리가 골짜기가 되고, '오르기'가 '내려가기'가 됩니다. 그래서 '언덕 오르기(hill climbing)'와 '경사 하강(gradient descent, 25쪽)'은 같은 아이디어이고, 이 단원의 슬라이드들은 어떤 것은 최대화(Maximization), 어떤 것은 최소화(Minimization)로 적혀 있습니다. 부등호 방향만 뒤집어 읽으면 됩니다.", "e": "N-퀸: '충돌 수 h를 최소화' = '−h를 최대화'. 10~11쪽은 최소화로 적혀 있습니다."}, {"s": "4-1", "im": ["4-1-09"], "en": "Hill-Climbing Search: The Algorithm", "ko": "언덕 오르기 알고리즘", "key": 1, "o": [["function HILL-CLIMBING(problem) returns a state that is a local maximum / current ← problem.INITIAL — Random initialization in general / while true do / neighbor ← a highest-valued successor state of current / if VALUE(neighbor) ≤ VALUE(current) then return current — ≥ for minimization / current ← neighbor", "핵심: 가장 좋은 이웃으로 이동하고, <b>이웃이 더 좋지 않으면 멈춘다</b> → 결과는 지역 최댓값 / 시작은 보통 무작위, 최소화라면 부등호를 ≥로", "code"], ["Variants of the Hill-Climbing Search: <b>Steepest-ascent hill climbing</b>: look at every successor and take the highest-valued one. / <b>Stochastic hill climbing</b>: choose at random among the uphill moves (still generate all successors; less greedy). / <b>First-choice stochastic hill climbing</b>: generate one random successor at a time and move only if it is better.", "언덕 오르기의 변형: <b>최급 상승 언덕 오르기</b>: 모든 후속을 보고 값이 가장 높은 것을 택한다. / <b>확률적 언덕 오르기</b>: 오르막 이동 중에서 무작위로 고른다(후속은 여전히 전부 생성; 덜 탐욕적). / <b>첫 선택 확률적 언덕 오르기</b>: 무작위 후속을 한 번에 하나씩 만들어, 더 좋을 때만 이동한다."]], "x": "교재의 언덕 오르기 의사코드(최대화 버전)에서 중요한 것은 하나입니다: 가장 좋은 이웃으로 옮기고, <b>이웃이 지금보다 좋지 않으면 바로 멈춘다</b>. 반환값이 '지역 최댓값인 상태'라고 적혀 있다는 것에 주목 — 전역 최댓값을 약속하지 않습니다. 최소화라면 부등호를 ≥로 바꿉니다.<br>세 가지 변형:<div class='tw'><table><tr><th>변형</th><th>후속 생성</th><th>이동</th></tr><tr><td><b>Steepest-ascent</b>(최급 상승)</td><td>전부</td><td>가장 가파른 오르막</td></tr><tr><td><b>Stochastic</b>(확률적)</td><td>전부</td><td>오르막 중 무작위 하나</td></tr><tr><td><b>First-choice</b>(첫 선택)</td><td>한 번에 하나</td><td>처음 만난 오르막</td></tr></table></div>후속이 수천 개일 때는 전부 만들어 비교하는 것이 비싸므로 first-choice가 유리합니다. 확률적 변형들은 덜 탐욕적이라 지역 최적에 덜 갇히기도 합니다. 15쪽의 담금질 모사는 first-choice를 바탕으로 합니다."}, {"s": "4-1", "im": ["4-1-10", "4-1-11"], "en": "A Heuristic for the n-Queens Problem", "ko": "N-퀸 문제의 휴리스틱", "o": [["The 8-queens problem — Goal: place 8 queens on a chess board so that no queen attacks another. / The board shows the value of h for each possible successor obtained by moving a queen within its column.", "8-퀸 문제 — 목표: 체스판에 퀸 8개를 어떤 퀸도 다른 퀸을 공격하지 않게 놓는다. / 오른쪽 판은 한 퀸을 같은 열 안에서 옮겨 얻는 각 후속 상태의 h 값을 보여 준다."], ["Goal: n queens on the board with no conflicts - no queen attacking another. / States: n queens on the board, one per column. / Actions: move a queen within its column. / Heuristic value function: the number of conflicts. / The three boards show h falling from 5 to 2 to 0 - two moves, and the problem is solved.", "목표: 충돌 없는 n개의 퀸 — 어떤 퀸도 다른 퀸을 공격하지 않음. / 상태: 판 위의 퀸 n개, 열마다 하나. / 행동: 한 퀸을 같은 열 안에서 옮김. / 휴리스틱 값 함수: 충돌의 수. / 세 판은 h가 5 → 2 → 0으로 줄어드는 것을 보여 준다 — 두 번 옮기면 해결."]], "x": "언덕 오르기를 8-퀸에 적용합니다(<b>최소화</b> 문제: 충돌 h를 0으로).<ul><li><b>상태</b>: 열마다 퀸 하나씩 8개(열은 고정, 행만 바뀜) → 상태 수 8<sup>8</sup> ≈ 1,700만.</li><li><b>행동</b>: 퀸 하나를 같은 열의 다른 행으로 옮김 → 이웃은 8 × 7 = 56개.</li><li><b>h</b>: 서로 공격하는 퀸 쌍의 수(같은 행·열·대각선). 해는 h = 0.</li></ul>10쪽 오른쪽 판: 현재 h = 17이고, 각 칸의 숫자는 '그 열의 퀸을 그 칸으로 옮기면 h가 얼마가 되는가'입니다. 가장 작은 값 12가 여러 칸에 있으므로 최급 상승은 그중 하나를 고릅니다. 11쪽: 세 판에서 h = 5 → 2 → 0. 선은 공격 관계를 표시한 것이고, 두 번 옮겨서 해결된 예입니다.", "e": "h 세는 법: 두 퀸이 같은 행이면 1, 같은 대각선(행 차이 = 열 차이)이면 1. 모든 쌍(28쌍)에 대해 세면 h.", "pg": [[1, 1], [1, 1]]}, {"s": "4-1", "im": ["4-1-12"], "en": "Local Optima: Maxima, Ridges and Plateaus", "ko": "지역 최적: 최댓값·능선·고원", "key": 1, "o": [["<b>Local maximum</b>: higher than its neighbors but lower than the global maximum", "<b>지역 최댓값</b>: 이웃보다 높지만 전역 최댓값보다는 낮다"], ["<b>Ridge</b>: a sequence of local maxima; a greedy algorithm has trouble crossing one", "<b>능선(ridge)</b>: 지역 최댓값이 줄지어 있는 것; 탐욕적 알고리즘은 이것을 넘기 어렵다"], ["<b>Plateau</b>: a flat region: either a flat local maximum with no uphill exit, or a shoulder from which progress is still possible", "<b>고원(plateau)</b>: 평평한 구역: 오르막 출구가 없는 평평한 지역 최댓값이거나, 아직 나아갈 수 있는 어깨(shoulder)"], ["Is hill climbing complete or optimal? — <b>No, it can get stuck in any of these.</b>", "언덕 오르기는 완전한가, 최적인가? — <b>아니다, 이 셋 중 어디에나 갇힐 수 있다.</b>"]], "x": "언덕 오르기가 멈춰 버리는 세 가지 지형입니다.<ul><li><b>지역 최댓값</b>: 모든 이웃이 더 낮으니 멈춥니다. 전역 최댓값이 아닌데도.</li><li><b>능선</b>(오른쪽 위 그림): 비스듬히 뻗은 산등성이. 허용된 이동(빨간 화살표, 축 방향)은 능선과 어긋나 있어서, 어느 한 걸음을 내디뎌도 내리막처럼 보입니다. 실제로는 능선을 따라 오르는 길이 있지만 한 걸음씩으로는 못 찾습니다.</li><li><b>고원</b>(아래 그림의 빨간 동그라미): 평평해서 어느 이웃도 더 좋지 않습니다. 09쪽 코드는 '더 좋은 이웃이 없으면 종료'이므로 어깨(shoulder)처럼 조금만 더 가면 오르막인 곳에서도 멈춥니다. (옆으로 가는 이동을 몇 번 허용하면 어깨는 건널 수 있지만, 평평한 지역 최댓값에서는 무한 루프가 되므로 횟수 제한이 필요합니다.)</li></ul>결론: 언덕 오르기는 <b>완전하지도 최적이지도 않습니다</b>. 다음 슬라이드부터 이것을 보완하는 기법들이 나옵니다.", "e": "8-퀸에서 무작위 상태로 시작한 최급 상승은 약 14%만 해를 찾고 86%는 지역 최적에 갇힙니다(교재). 대신 매우 빠릅니다 — 평균 3~4걸음."}, {"s": "4-1", "im": ["4-1-13"], "en": "Local Optima: An Example, and Random Restart", "ko": "지역 최적 예시와 무작위 재시작", "o": [["A local optimum in the 8-queens problem: no queen can be moved within its own column to improve the objective function, yet one attacking pair remains — h = 1", "8-퀸 문제의 지역 최적: 어떤 퀸도 자기 열 안에서 옮겨서 목적 함수를 개선할 수 없는데, 공격하는 쌍이 하나 남아 있다 — h = 1"], ["<b>Random-restart hill climbing</b>: run hill climbing from several random initial states and return the best result found", "<b>무작위 재시작 언덕 오르기</b>: 여러 무작위 초기 상태에서 언덕 오르기를 돌리고, 찾은 것 중 가장 좋은 결과를 반환한다"], ["That strategy works with any stochastic algorithm, not just this one", "이 전략은 이 알고리즘뿐 아니라 어떤 확률적 알고리즘에도 통한다"]], "x": "왼쪽 판이 지역 최적의 실제 예입니다. 빨간 화살표의 두 퀸이 대각선으로 서로 공격해 h = 1인데, 어떤 퀸을 어느 칸으로 옮겨도 h가 1 이상이라 언덕 오르기는 여기서 멈춥니다. 해(h = 0)는 바로 코앞이지만 한 번에 한 퀸만 옮기는 이동으로는 못 갑니다.<br>해결책 <b>무작위 재시작(random restart)</b>: 갇히면 완전히 다른 임의의 상태에서 처음부터 다시 오릅니다. 단순하지만 강력합니다 — 언덕 오르기 한 번이 성공할 확률이 p라면 평균 1/p번만 시도하면 해를 찾습니다. 8-퀸은 p ≈ 0.14이므로 약 7번. 봉우리가 아무리 많아도 출발점을 계속 바꾸면 언젠가는 전역 최댓값 쪽 비탈에 떨어집니다. 이 전략은 확률적 요소가 있는 어떤 알고리즘에도 붙일 수 있습니다.", "e": "8-퀸: 시도당 평균 4걸음, 7번 시도 → 약 30걸음 안에 해를 찾습니다. 상태가 1,700만 개인 것을 생각하면 매우 빠릅니다. 300만-퀸도 1분 안에 풉니다(교재)."}, {"s": "4-1", "im": ["4-1-14", "4-1-15"], "en": "Simulated Annealing", "ko": "담금질 모사", "key": 1, "o": [["Accept a <b>\"bad move\"</b> with some probability, and lower that probability over time, so the search can climb out of a local minimum", "<b>\"나쁜 이동\"</b>을 어떤 확률로 받아들이되, 그 확률을 시간이 지남에 따라 낮춘다. 그러면 탐색이 지역 최솟값에서 빠져나올 수 있다"], ["The name comes from annealing: the controlled cooling of glass or metal. Lowering the temperature means lowering the probability of accepting a bad move", "이름은 담금질(annealing)에서 왔다: 유리나 금속을 제어하며 천천히 식히는 것. 온도를 낮춘다는 것은 나쁜 이동을 받아들일 확률을 낮춘다는 뜻"], ["It is <b>first-choice stochastic hill climbing</b>, plus a rule that accepts some bad moves and accepts them less often as the search goes on.", "이것은 <b>첫 선택 확률적 언덕 오르기</b>에, 일부 나쁜 이동을 받아들이되 탐색이 진행될수록 덜 받아들이는 규칙을 더한 것이다."], ["A negative change means the solution got better; such a move is always taken / A bad move is accepted with probability exp(−ΔE/T), where ΔE is how much worse the move is, and the annealing schedule lowers the temperature T over time.", "음의 변화는 해가 좋아졌다는 뜻; 그런 이동은 항상 택한다 / 나쁜 이동은 확률 exp(−ΔE/T)로 받아들인다. ΔE는 그 이동이 얼마나 나빠지는가이고, 담금질 일정(schedule)이 온도 T를 시간에 따라 낮춘다."], ["function SIMULATED-ANNEALING(problem, schedule) returns a solution state / current ← problem.INITIAL / for t = 1 to ∞ do / T ← schedule(t) / if T = 0 then return current / next ← a randomly selected successor of current / ΔE ← VALUE(current) − VALUE(next) / if ΔE ≤ 0 then current ← next — Next is better, just move / else current ← next only with probability e<sup>−ΔE/T</sup> — Next is worse, bad move with a probability", "핵심: 무작위 이웃 next를 하나 뽑아 더 좋으면 이동 / 더 나쁘면 확률 e<sup>−ΔE/T</sup>로만 이동 / T는 schedule(t)로 점점 낮아지고, T = 0이면 종료", "code"]], "x": "<b>담금질 모사(simulated annealing)</b>: 언덕 오르기는 내리막을 절대 안 가서 갇히고, 무작위 걷기는 내리막을 마구 가서 비효율적입니다. 둘을 섞습니다 — <b>나쁜 이동도 가끔 허용하되, 갈수록 덜 허용</b>합니다.<br>이름의 유래: 금속을 뜨겁게 달궜다가 <b>천천히</b> 식히면 원자들이 안정된 결정을 이룹니다(annealing). 뜨거울 때는 원자가 자유롭게 움직이고, 식으면 자리를 잡습니다. 탐색도 처음엔 '온도' T가 높아 나쁜 이동도 거의 다 받아 넓게 돌아다니고, T가 낮아질수록 나쁜 이동을 거의 안 받아 봉우리에 정착합니다.<br>알고리즘(15쪽, 최대화 버전): 09쪽의 first-choice 언덕 오르기에 규칙 하나를 더한 것입니다. 무작위 후속 next를 하나 뽑아 ΔE = VALUE(current) − VALUE(next)를 계산하고,<ul><li>ΔE ≤ 0 (next가 같거나 더 좋음) → 그냥 이동.</li><li>ΔE &gt; 0 (next가 나쁨) → 확률 <b>e<sup>−ΔE/T</sup></b>로만 이동.</li></ul>이 확률은 ΔE가 클수록(많이 나빠질수록) 작고, T가 클수록(초반일수록) 큽니다. T는 schedule(t)가 정하며, T = 0이 되면 종료. 오른쪽 그래프는 e<sup>x</sup> 곡선이고, 아래의 '볼츠만 분포 p<sub>i</sub> ∝ e<sup>−ε<sub>i</sub>/(kT)</sup>'는 물리학에서 온도 T인 계가 에너지 ε<sub>i</sub>인 상태에 있을 확률 — 이 수식을 그대로 빌려온 것입니다. 최소화로 쓸 때는 ΔE = VALUE(next) − VALUE(current)로 바꿉니다.", "e": "ΔE = 10일 때 수용 확률: T = 100이면 e<sup>−0.1</sup> ≈ 0.90, T = 10이면 e<sup>−1</sup> ≈ 0.37, T = 1이면 e<sup>−10</sup> ≈ 0.00005. 같은 손해라도 온도가 낮으면 거의 안 받습니다.", "pg": [[1, 2], [1, 3]]}, {"s": "4-1", "im": ["4-1-16", "4-1-17"], "en": "Temperature and Cooling Schedules", "ko": "온도와 냉각 일정", "o": [["The probability of accepting a worse state is exp(−ΔE/T) / At a high temperature the curve is nearly flat: almost anything is accepted / At a low temperature only a very small loss is accepted, so the search settles", "더 나쁜 상태를 받아들일 확률은 exp(−ΔE/T) / 온도가 높으면 곡선이 거의 평평하다: 거의 무엇이든 받아들인다 / 온도가 낮으면 아주 작은 손해만 받아들이므로, 탐색이 자리를 잡는다"], ["Classic simulated annealing: T(t) = T<sub>0</sub>/log(1 + t) / Exponential cooling (Kirkpatrick, Gelatt and Vecchi, 1983): T(t) = T<sub>0</sub> · a<sup>t</sup> for 0.8 &lt; a &lt; 1 / Fast simulated annealing (Szu and Hartley, 1987): T(t) = T<sub>0</sub>/(1 + t)", "고전적 담금질 모사: T(t) = T<sub>0</sub>/log(1 + t) / 지수적 냉각(Kirkpatrick, Gelatt, Vecchi, 1983): T(t) = T<sub>0</sub> · a<sup>t</sup>, 0.8 &lt; a &lt; 1 / 빠른 담금질 모사(Szu, Hartley, 1987): T(t) = T<sub>0</sub>/(1 + t)"], ["Choose T<sub>0</sub> so that at t = 0 almost any move is accepted; stop once T falls below a small constant. / The best schedule is normally found by trial and error — AI researchers do always 😅.", "t = 0에서 거의 모든 이동이 받아들여지도록 T<sub>0</sub>을 고른다; T가 작은 상수 아래로 떨어지면 멈춘다. / 가장 좋은 일정은 보통 시행착오로 찾는다 — AI 연구자들은 늘 그렇게 한다 😅."]], "x": "16쪽 그래프: 가로축은 −ΔE(왼쪽으로 갈수록 더 나쁜 이동), 세로축은 수용 확률 e<sup>−ΔE/T</sup>. 온도별 곡선:<ul><li><b>T = 100</b>(파랑): 거의 평평 — 100만큼 나빠져도 37%로 받습니다. 초반, 자유롭게 돌아다니는 단계.</li><li><b>T = 10</b>(빨강): 10만큼 나빠지면 37%, 40이면 2%.</li><li><b>T = 1</b>(하늘): 1만 나빠져도 37%, 5면 0.7% — 사실상 오르막만 갑니다. 후반, 정착 단계.</li></ul>17쪽 냉각 일정(cooling schedule): T를 시간 t에 따라 어떻게 낮출지입니다.<div class='tw'><table><tr><th>일정</th><th>식</th><th>특징</th></tr><tr><td>고전(Classic)</td><td>T<sub>0</sub>/log(1 + t)</td><td>매우 느리게 식음(이론적 보장용)</td></tr><tr><td>지수적(Exponential)</td><td>T<sub>0</sub> · a<sup>t</sup> (0.8 &lt; a &lt; 1)</td><td>매 단계 일정 비율로 — 실무에서 흔함</td></tr><tr><td>빠른(Fast)</td><td>T<sub>0</sub>/(1 + t)</td><td>초반에 급격히 식음</td></tr></table></div>그래프에서 Classic(검정)은 t = 100에서도 T/T<sub>0</sub> ≈ 0.2로 아직 뜨겁고, Exp(α = 0.8)은 금방 0에 붙습니다. T<sub>0</sub>은 처음에 거의 다 받아들여질 만큼 크게 잡고, T가 작은 값 아래로 떨어지면 멈춥니다. 너무 빨리 식으면 지역 최적에 갇히고, 너무 천천히 식으면 오래 걸립니다 — 어떤 일정이 좋은지는 문제마다 달라 <b>시행착오</b>로 찾습니다.", "e": "지수적 냉각, T<sub>0</sub> = 100, a = 0.9: t = 10에서 T ≈ 35, t = 50에서 T ≈ 0.5. 50단계면 사실상 언덕 오르기로 바뀝니다.", "pg": [[1, 1], [1, 2]]}, {"s": "4-1", "im": ["4-1-18"], "en": "Properties of Simulated Annealing", "ko": "담금질 모사의 성질", "o": [["If the temperature falls <b>\"slowly enough\"</b>, simulated annealing finds the global optimum.", "온도가 <b>\"충분히 천천히\"</b> 내려가면, 담금질 모사는 전역 최적을 찾는다."], ["At <b>a high temperature</b>, almost every move is accepted, and the search wanders the whole space freely / As <b>the temperature falls</b>, a large loss is rarely accepted but a small one still is — there is room left to climb out of a local optimum / At <b>a very low temperature</b>, a worse solution is effectively never accepted, and the search stays near the optimum it has", "<b>온도가 높을 때</b>는 거의 모든 이동이 받아들여져, 탐색이 공간 전체를 자유롭게 돌아다닌다 / <b>온도가 내려가면</b> 큰 손해는 거의 받아들이지 않지만 작은 손해는 여전히 받아들인다 — 지역 최적에서 빠져나올 여지가 남아 있다 / <b>온도가 아주 낮을 때</b>는 더 나쁜 해를 사실상 받아들이지 않고, 탐색은 갖고 있는 최적 근처에 머문다"], ["But…, In practice, this guarantee usually takes <b>far too long</b>. / Both the cooling schedule and the local move have to be found <b>experimentally</b>.", "하지만… 실제로는 이 보장이 보통 <b>너무 오래</b> 걸린다. / 냉각 일정과 지역 이동 방식 둘 다 <b>실험적으로</b> 찾아야 한다."]], "x": "담금질 모사의 성질입니다. 이론: 온도를 <b>충분히 천천히</b>(고전 일정 T<sub>0</sub>/log(1+t)처럼) 내리면 확률 1로 전역 최적에 수렴한다는 정리가 있습니다. 세 단계로 이해하면:<ol><li><b>고온</b>: 거의 모든 이동 수용 → 무작위 걷기처럼 공간 전체를 둘러봄.</li><li><b>중간 온도</b>: 큰 손해는 거절, 작은 손해는 수용 → 작은 봉우리에 갇혀도 조금 내려갔다가 옆의 더 큰 봉우리로 넘어갈 수 있음.</li><li><b>저온</b>: 손해를 거의 안 받음 → 언덕 오르기처럼 지금 있는 봉우리의 꼭대기로 정착.</li></ol>현실: 그 '충분히 천천히'가 실용적이지 않을 만큼 느립니다(상태 수에 지수적인 시간). 그래서 실제로는 적당히 빠른 일정으로 '충분히 좋은' 해를 노리고, 냉각 일정과 이웃을 만드는 방식(local move)은 문제마다 실험으로 정합니다. 담금질 모사는 1980년대 초 VLSI 칩 배치 문제에 쓰이며 유명해졌고, 지금도 스케줄링·배치 같은 조합 최적화에 널리 쓰입니다."}, {"s": "4-1", "im": ["4-1-19"], "en": "Local Beam Search", "ko": "지역 빔 탐색", "key": 1, "o": [["The <b>search</b> that follows <b>k states</b> at once rather than one, starting from k randomly chosen states — Unlike <b>random restart</b> it does not follow a single path, it keeps k states, <b>the beam width</b>, in parallel.", "한 상태가 아니라 <b>k개의 상태</b>를 동시에 따라가는 <b>탐색</b>, 무작위로 고른 k개 상태에서 시작한다 — <b>무작위 재시작</b>과 달리 경로 하나를 따라가지 않고, <b>빔 폭(beam width)</b>인 k개의 상태를 병렬로 유지한다."], ["How it runs: choose k states at random from the initial set / generate ALL successors from k states / keep <b>the best k</b> of all those successors and repeat / stop at a goal state or when a termination condition is met", "동작: 초기 집합에서 무작위로 k개 상태를 고른다 / k개 상태에서 모든 후속을 생성한다 / 그 모든 후속 중 <b>가장 좋은 k개</b>를 남기고 반복한다 / 목표 상태에 도달하거나 종료 조건이 만족되면 멈춘다"], ["Properties: More efficient than random restart (= single-path): information is shared across the k states (= communicate) / Stronger than hill climbing, because several directions are explored at once / k too small: it collapses into a local optimum. / k too large: it approaches exhaustive search and becomes inefficient.", "성질: 무작위 재시작(= 단일 경로)보다 효율적: k개 상태 사이에 정보가 공유된다(= 소통) / 여러 방향을 동시에 탐색하므로 언덕 오르기보다 강하다 / k가 너무 작으면 지역 최적으로 붕괴한다. / k가 너무 크면 완전 탐색에 가까워져 비효율적이 된다."]], "x": "<b>지역 빔 탐색(local beam search)</b>: 상태 하나 대신 <b>k개</b>를 동시에 들고 갑니다(k = 빔 폭).<ol><li>무작위 상태 k개로 시작.</li><li>k개 각각의 후속을 <b>전부</b> 만든다.</li><li>그 후속 <b>전체</b>에서 가장 좋은 k개만 남긴다.</li><li>반복.</li></ol>random restart와의 차이가 핵심입니다. random restart k번은 k개의 탐색이 <b>따로따로</b> 돌아가서 서로 모릅니다. 빔 탐색은 3단계에서 k개 상태의 후속을 <b>한데 모아</b> 비교하므로, 좋은 상태 쪽에 자원이 몰립니다 — 가망 없는 상태의 후속은 버려지고 유망한 상태의 후속 여러 개가 살아남습니다. 이것이 \"k개가 정보를 공유한다(소통한다)\"는 뜻입니다.<br>k 고르기: 너무 작으면 모두 같은 봉우리로 몰려 사실상 언덕 오르기(지역 최적에 붕괴), 너무 크면 거의 모든 상태를 보는 완전 탐색이 되어 비효율. (보충: 붕괴를 막기 위해 best k 대신 값에 비례한 확률로 k개를 뽑는 확률적 빔 탐색도 있습니다 — 20쪽 유전 알고리즘의 '선택'과 같은 발상.)", "e": "k = 1이면 언덕 오르기, k = ∞이면 모든 상태를 다 보는 완전 탐색. 그 사이의 적당한 k(예: 수십~수백)를 씁니다. 자연어 번역·음성 인식의 디코딩에도 beam search가 쓰입니다."}, {"s": "4-1", "im": ["4-1-20"], "en": "Genetic Algorithms", "ko": "유전 알고리즘", "key": 1, "o": [["An algorithm for <b>population-based</b> optimization, using mechanisms borrowed <b>from biological evolution</b>", "생물 진화에서 빌린 메커니즘을 쓰는 <b>개체군 기반</b> 최적화 알고리즘"], ["Reproduction: select at random, with probability weighted by a fitness function (1 − h(n)) / Crossover: recombine two parents at a random point / Mutation: change a random position / Repeat for many generations.", "재생산: 적합도 함수(1 − h(n))에 비례한 확률로 무작위 선택 / 교차: 두 부모를 임의의 지점에서 재조합 / 돌연변이: 임의의 위치 하나를 바꿈 / 여러 세대 동안 반복."], ["In the 8-queens example: (a) Initial Population (b) Fitness Function (c) Selection (d) Crossover (e) Mutation → next generation", "8-퀸 예: (a) 초기 개체군 (b) 적합도 함수 (c) 선택 (d) 교차 (e) 돌연변이 → 다음 세대"]], "x": "<b>유전 알고리즘(genetic algorithm, GA)</b>: 빔 탐색처럼 여러 상태(<b>개체군</b>)를 들고 가되, 새 상태를 '이웃으로 한 발'이 아니라 <b>두 부모를 섞어서</b> 만듭니다. 생물 진화를 흉내 낸 것입니다. 8-퀸 그림을 따라가면(상태 = 각 열 퀸의 행 번호 8자리 문자열):<div class='tw'><table><tr><th>단계</th><th>내용</th><th>그림</th></tr><tr><td>(a) 초기 개체군</td><td>무작위 상태 4개</td><td>24748552, 32752411, 24415124, 32543213</td></tr><tr><td>(b) 적합도</td><td>서로 공격하지 않는 퀸 쌍의 수(최대 28). 슬라이드의 (1 − h)는 '충돌이 적을수록 높다'는 뜻</td><td>24, 23, 20, 11 → 비율 31%, 29%, 26%, 14%</td></tr><tr><td>(c) 선택</td><td>적합도에 비례한 확률로 부모 뽑기(좋을수록 자주 뽑힘)</td><td>32752411과 24748552 등 두 쌍</td></tr><tr><td>(d) 교차</td><td>임의의 지점에서 잘라 앞·뒤를 바꿔 자식 생성</td><td>327|52411 + 247|48552 → 327<b>48552</b>, 247<b>52411</b></td></tr><tr><td>(e) 돌연변이</td><td>작은 확률로 한 자리를 무작위로 바꿈</td><td>32748552 → 3274<b>1</b>552</td></tr></table></div>오른쪽 위 체스판은 교차가 '첫 세 열은 부모 1에서, 나머지 다섯 열은 부모 2에서' 가져온다는 것을 보여 줍니다. 이것을 여러 세대 반복하면 적합도 높은 개체가 늘어납니다. 교차가 유용한 이유: 각 부모의 '좋은 부분'(예: 서로 충돌 없는 앞쪽 세 열)이 통째로 자식에게 전해집니다. 돌연변이는 개체군이 다 비슷해지는 것을 막아 다양성을 유지합니다.", "e": "적합도 24 = 28쌍 중 24쌍이 서로 공격하지 않음 = 충돌 h = 4. 적합도 28이면 해."}, {"s": "4-1", "im": ["4-1-21"], "en": "Local Search in Continuous Spaces", "ko": "연속 공간에서의 지역 탐색", "key": 1, "o": [["Most real optimization problems live in a continuous space: the state is a vector of real numbers, not one of a finite set.", "대부분의 실제 최적화 문제는 연속 공간에 있다: 상태가 유한 집합의 원소가 아니라 실수 벡터다."], ["There is no finite list of successors to enumerate, so hill climbing as stated does not apply.", "나열할 유한한 후속 목록이 없으므로, 앞서 말한 대로의 언덕 오르기는 적용되지 않는다."]], "x": "지금까지의 지역 탐색은 이웃이 <b>유한 개</b>였습니다(8-퀸: 56개). 그런데 실제 최적화 문제는 대부분 상태가 <b>실수 벡터</b> x = (x<sub>1</sub>, x<sub>2</sub>, …, x<sub>k</sub>)입니다 — 공항의 좌표, 로봇 팔의 각도, 신경망의 가중치. 실수는 아무리 조금씩 움직여도 무한히 많은 이웃이 있으므로 '이웃을 전부 만들어 가장 좋은 것 고르기'가 불가능합니다. 그림의 울퉁불퉁한 곡면이 연속 상태 공간의 목적 함수입니다(06쪽의 비볼록 예와 같은 그림). 다음 슬라이드들이 이 문제를 다루는 세 방법입니다: 격자로 쪼개기(22~23쪽), 무작위로 흔들기, 미분 쓰기(24~25쪽)."}, {"s": "4-1", "im": ["4-1-22", "4-1-23"], "en": "Method 1 — Discretization", "ko": "방법 1 — 이산화", "o": [["Use atomic states and build the transition function as a graph.", "원자적 상태를 쓰고 전이 함수를 그래프로 만든다."], ["Lay a grid of spacing delta δ over the space; the neighbors of a point are the adjacent grid cells / In practice a much finer grid than the one drawn here is usually needed", "공간 위에 간격 δ의 격자를 깐다; 한 점의 이웃은 인접한 격자 칸이다 / 실제로는 여기 그린 것보다 훨씬 촘촘한 격자가 보통 필요하다"], ["How was this space discretized? The dotted lines are the grid, and the path is a sequence of grid cells / The maze is actually continuous, but once the grid is applied the problem is an ordinary graph search from the initial state to the goal state.", "이 공간은 어떻게 이산화되었나? 점선이 격자이고, 경로는 격자 칸들의 나열이다 / 미로는 실제로는 연속이지만, 격자를 적용하고 나면 문제는 초기 상태에서 목표 상태로 가는 평범한 그래프 탐색이다."]], "x": "<b>방법 1, 이산화(discretization)</b>: 연속 공간에 간격 δ의 <b>격자</b>를 씌워, 각 칸을 하나의 상태로 봅니다. 그러면 이웃은 '옆 칸'이라 유한 개(2차원이면 4개 또는 8개)가 되고, 3장의 그래프 탐색이나 이 단원의 언덕 오르기를 그대로 쓸 수 있습니다. 22쪽: 루마니아 지도(연속)를 도시 그래프(원자적 상태)로 바꾼 것도 같은 생각이고, 오른쪽 작은 지도는 격자를 씌운 모습입니다. 23쪽: 미로는 사실 연속 공간(어디든 설 수 있음)이지만, 점선 격자를 씌우면 칸에서 칸으로 가는 보통의 탐색 문제가 됩니다. 해는 칸들의 나열.<br>δ가 작을수록 정밀하지만 칸(상태)의 수가 폭발합니다 — 2차원에서 δ를 절반으로 줄이면 칸이 4배, k차원이면 2<sup>k</sup>배. 그래서 \"실제로는 훨씬 촘촘한 격자가 필요하다\"는 말이 곧 비용 문제입니다.", "e": "100m × 100m 공간을 1m 격자로 → 10,000칸. 10cm 격자로 → 1,000,000칸. 공항 3개(6차원)를 1km 격자로 루마니아(약 500km × 400km)에 놓으면 상태가 약 (500 × 400)<sup>3</sup> = 8 × 10<sup>15</sup>개.", "pg": [[1, 2], [1, 1]]}, {"s": "4-1", "im": ["4-1-24"], "en": "Three Ways to Handle a Continuous Space", "ko": "연속 공간을 다루는 세 가지 방법", "o": [["1. Discretize it! — define a grid with increment delta δ and use any of the discrete algorithms.", "1. 이산화하라! — 간격 δ의 격자를 정의하고 이산 알고리즘 중 아무거나 쓴다."], ["2. Choose between random perturbations to the state — hill climbing with simulated annealing.", "2. 상태에 무작위 섭동(흔들기)을 주고 그중에서 고른다 — 담금질 모사를 곁들인 언덕 오르기."], ["3. Use continuous, analytic methods — compute gradients and so on, to extrapolate the local curvature.", "3. 연속적·해석적 방법을 쓴다 — 기울기 등을 계산해 국소 곡률을 추정한다."]], "x": "연속 공간을 다루는 세 가지 방법의 요약입니다.<ol><li><b>이산화</b>: 격자로 쪼개서 이산 알고리즘을 쓴다(22~23쪽). 단순하지만 차원이 높으면 칸이 폭발.</li><li><b>무작위 섭동</b>: 현재 상태를 무작위로 조금 흔들어(x에 작은 난수 벡터를 더해) 후속을 만들고, first-choice 언덕 오르기나 담금질 모사로 받아들일지 정한다. 이웃을 전부 만들 필요가 없으니 연속 공간에서도 됩니다.</li><li><b>해석적 방법</b>: 목적 함수가 미분 가능하면 <b>기울기(gradient)</b>를 계산해 '어느 방향이 오르막인지'를 바로 알 수 있다. 이웃을 만들어 볼 필요조차 없음. 다음 쪽의 경사 하강.</li></ol>"}, {"s": "4-1", "im": ["4-1-25"], "en": "Gradient Descent and Newton-Raphson", "ko": "경사 하강과 뉴턴-랩슨", "key": 1, "o": [["State: a vector x = (x<sub>1</sub>, x<sub>2</sub>, …, x<sub>k</sub>). / The state space is <b>infinite</b>. / The objective function: min f(x)", "상태: 벡터 x = (x<sub>1</sub>, x<sub>2</sub>, …, x<sub>k</sub>). / 상태 공간은 <b>무한</b>하다. / 목적 함수: min f(x)"], ["The gradient at x: ∇f(x) = (∂f(x)/∂x<sub>1</sub>, ∂f(x)/∂x<sub>2</sub>, …, ∂f(x)/∂x<sub>k</sub>)", "x에서의 기울기: ∇f(x) = (∂f(x)/∂x<sub>1</sub>, ∂f(x)/∂x<sub>2</sub>, …, ∂f(x)/∂x<sub>k</sub>)"], ["Gradient descent iterates with a step size α: x ← x − α · ∇f(x)", "경사 하강은 보폭 α로 반복한다: x ← x − α · ∇f(x)"], ["<b>Newton-Raphson</b> uses the inverse Hessian as an optimal step size: x ← x − H<sub>f</sub><sup>−1</sup> ∇f(x)", "<b>뉴턴-랩슨</b>은 헤시안의 역행렬을 최적 보폭으로 쓴다: x ← x − H<sub>f</sub><sup>−1</sup> ∇f(x)"], ["Note: In a non-convex space, both still get trapped in a local optimum: <b>simulated annealing</b>, <b>momentum</b> or a similar device is used to escape", "참고: 비볼록 공간에서는 둘 다 여전히 지역 최적에 갇힌다: 빠져나오기 위해 <b>담금질 모사</b>, <b>모멘텀</b> 또는 비슷한 장치를 쓴다"]], "x": "<b>방법 3, 경사 하강(gradient descent)</b> — 연속 공간판 언덕 오르기이며, 머신러닝 학습의 핵심입니다.<ul><li><b>기울기 ∇f(x)</b>: 각 좌표로 편미분한 것을 모은 벡터. 그 점에서 f가 <b>가장 가파르게 증가하는 방향</b>을 가리킵니다(아래 그림의 화살표가 모두 중심의 최솟값을 향하는 것은 −∇f를 그린 것).</li><li><b>경사 하강</b>: 최소화이므로 기울기의 <b>반대</b> 방향으로 한 발:<div class='formula'>x ← x − α · ∇f(x)</div>α(보폭, 학습률)가 크면 최솟값을 지나쳐 발산하고, 작으면 느립니다.</li><li><b>뉴턴-랩슨</b>: 보폭을 하나의 숫자 α가 아니라 <b>헤시안</b>(2차 미분을 모은 행렬 H, 곡면이 얼마나 휘었는지)의 역행렬로 정합니다. 곡률까지 보므로 볼록 함수에서는 훨씬 빨리 수렴하지만(2차 함수면 한 번에), k차원에서 k × k 행렬을 뒤집어야 해서 k가 크면(신경망은 수백만) 비쌉니다.</li></ul>둘 다 '내리막으로만' 가므로 비볼록 공간에서는 지역 최솟값에 갇힙니다. 그래서 담금질 모사(무작위성)나 <b>모멘텀</b>(이전 이동 방향을 관성처럼 이어 가서 작은 골짜기를 지나침) 같은 장치를 더합니다.", "e": "f(x) = x², α = 0.1, x = 10에서 시작: ∇f = 2x = 20 → x = 10 − 2 = 8 → ∇f = 16 → x = 6.4 → 5.12 → … 0으로 수렴. α = 1.1이면 x = −12, 14.4, … 발산."}, {"s": "4-1", "im": ["4-1-26"], "en": "Example: Siting Airports in Romania", "ko": "예: 루마니아 공항 입지", "o": [["Place 3 airports to minimize the sum of squared distances from each city to its nearest airport.", "각 도시에서 가장 가까운 공항까지의 거리 제곱의 합이 최소가 되도록 공항 3개를 놓는다."], ["The state is the airport locations: x = (x<sub>1</sub>, y<sub>1</sub>), (x<sub>2</sub>, y<sub>2</sub>), (x<sub>3</sub>, y<sub>3</sub>) / City locations: (x<sub>c</sub>, y<sub>c</sub>) / C<sub>a</sub> is the set of cities closest to airport a.", "상태는 공항의 위치: x = (x<sub>1</sub>, y<sub>1</sub>), (x<sub>2</sub>, y<sub>2</sub>), (x<sub>3</sub>, y<sub>3</sub>) / 도시의 위치: (x<sub>c</sub>, y<sub>c</sub>) / C<sub>a</sub>는 공항 a에 가장 가까운 도시들의 집합."], ["Objective: minimize f(x) = Σ<sub>a</sub> Σ<sub>c∈C<sub>a</sub></sub> [(x<sub>a</sub> − x<sub>c</sub>)² + (y<sub>a</sub> − y<sub>c</sub>)²]", "목적: 최소화 f(x) = Σ<sub>a</sub> Σ<sub>c∈C<sub>a</sub></sub> [(x<sub>a</sub> − x<sub>c</sub>)² + (y<sub>a</sub> − y<sub>c</sub>)²]"]], "x": "연속 최적화의 예(교재). 루마니아에 공항 3개를 어디에 놓을까? 상태는 공항 3곳의 좌표, 즉 <b>실수 6개</b> x = (x<sub>1</sub>, y<sub>1</sub>, x<sub>2</sub>, y<sub>2</sub>, x<sub>3</sub>, y<sub>3</sub>). 각 도시는 가장 가까운 공항을 이용한다고 보고(초록 점선), 목적 함수는 모든 도시의 '가장 가까운 공항까지 거리의 제곱'의 합:<div class='formula'>f(x) = Σ<sub>a</sub> Σ<sub>c∈C<sub>a</sub></sub> [(x<sub>a</sub> − x<sub>c</sub>)² + (y<sub>a</sub> − y<sub>c</sub>)²]<br>(a = 공항 1, 2, 3 / C<sub>a</sub> = 공항 a가 가장 가까운 도시들)</div>도시 배정 C<sub>a</sub>를 고정하면 f는 좌표에 대해 매끄러운 2차 함수라 미분이 쉽습니다. 예를 들어 ∂f/∂x<sub>1</sub> = 2 Σ<sub>c∈C<sub>1</sub></sub> (x<sub>1</sub> − x<sub>c</sub>) — 공항 1을 담당 도시들의 평균 쪽으로 당기라는 뜻. 경사 하강으로 공항을 조금씩 옮기고, 공항이 움직여 어떤 도시의 '가장 가까운 공항'이 바뀌면 C<sub>a</sub>를 다시 계산합니다. (이 교대 반복은 머신러닝의 k-평균 군집화와 같은 구조입니다.)", "e": "공항 1이 담당하는 도시가 (0,0), (4,0), (2,6)이면 기울기가 0인 지점은 평균 (2, 2) — 거기가 그 배정에서의 최적 위치."}, {"s": "4-1", "im": ["4-1-27"], "en": "Many ML Algorithms Are Local Search", "ko": "많은 머신러닝이 지역 탐색이다", "o": [["Many configuration and optimization problems can be formulated as local search.", "많은 구성·최적화 문제를 지역 탐색으로 정식화할 수 있다."], ["General families of algorithms: Hill climbing, and continuous optimization. / Simulated annealing, and other stochastic methods. / Local beam search: multiple interacting searches. / Genetic algorithms: break states apart and recombine them.", "알고리즘의 일반적인 계열: 언덕 오르기, 그리고 연속 최적화. / 담금질 모사, 그리고 다른 확률적 방법. / 지역 빔 탐색: 서로 상호작용하는 여러 탐색. / 유전 알고리즘: 상태를 쪼개어 재조합한다."], ["Many machine learning algorithms are local searches.", "많은 머신러닝 알고리즘이 지역 탐색이다."]], "x": "파트 I 정리.<div class='tw'><table><tr><th>계열</th><th>핵심 아이디어</th><th>지역 최적 대책</th></tr><tr><td>언덕 오르기 / 경사 하강</td><td>가장 좋은 이웃으로 한 발 / 기울기 반대 방향으로 한 발</td><td>무작위 재시작</td></tr><tr><td>담금질 모사</td><td>나쁜 이동도 확률적으로 허용, 점점 덜</td><td>온도</td></tr><tr><td>지역 빔 탐색</td><td>k개 상태를 함께, 전체에서 best k</td><td>여러 방향 동시 탐색</td></tr><tr><td>유전 알고리즘</td><td>개체군, 선택·교차·돌연변이</td><td>재조합과 변이</td></tr></table></div>마지막 줄이 이 단원의 결론입니다: 신경망 학습(경사 하강 + 모멘텀), 군집화(k-평균), 하이퍼파라미터 탐색 등 수많은 머신러닝 기법이 결국 '목적 함수를 현재 상태 근처에서 조금씩 개선'하는 <b>지역 탐색</b>입니다. 2장에서 '많은 ML이 지역 탐색'이라 했던 말이 여기서 설명됩니다."}, {"s": "4-2", "im": ["4-2-01", "4-2-02"], "en": "Recap: Solving a Search Problem under Certainty", "ko": "복습: 확실성 아래의 탐색", "o": [["<b>No uncertainty</b>: the environment is fully observable, so the agent knows the state, and it is deterministic, so Result(s, a) is a single state.", "<b>불확실성 없음</b>: 환경이 완전 관찰 가능하므로 에이전트는 상태를 알고, 결정적이므로 Result(s, a)는 상태 하나다."], ["The state space describes the environment and the agent completely", "상태 공간이 환경과 에이전트를 완전히 기술한다"], ["Method: use tree search at planning time to produce a sequence of actions, then execute that plan as it stands.", "방법: 계획 시점에 트리 탐색으로 행동의 순열을 만들고, 그 계획을 그대로 실행한다."]], "x": "4장 파트 II, <b>비결정성(nondeterminism)</b>입니다. 먼저 3장의 전제를 복습합니다. 3장의 세계는 ① <b>완전 관찰 가능</b>(지금 어느 상태인지 안다), ② <b>결정적</b>(행동 a를 하면 결과 Result(s, a)가 딱 하나로 정해진다)이었습니다. 그래서 행동하기 전에 머릿속(트리 탐색)으로 [Suck, Right, Suck] 같은 <b>행동 순열</b>을 짜 두고, 눈 감고 그대로 실행해도 목표에 도착했습니다. 오른쪽 그림은 2장의 진공청소기 세계 상태 공간(8개 상태)과, 초기 상태에서 목표 상태로 가는 경로(주황 화살표)입니다. 이 파트는 전제 ②를, 다음 파트(4-3)는 전제 ①을 깨뜨립니다.", "pg": [[1, 0], [1, 3]]}, {"s": "4-2", "im": ["4-2-03"], "en": "Where Uncertainty Comes From, and What It Costs", "ko": "불확실성의 출처와 대가", "key": 1, "o": [["Two sources: 1. The <b>agent</b>'s actions are nondeterministic: it cannot determine the state the environment will be in after acting / 2. The <b>environment</b> is only partially observable: the agent is uncertain about the state it is in now", "두 가지 출처: 1. <b>에이전트</b>의 행동이 비결정적이다: 행동한 뒤 환경이 어떤 상태가 될지 알 수 없다 / 2. <b>환경</b>이 부분적으로만 관찰 가능하다: 에이전트는 지금 자기가 어떤 상태에 있는지 불확실하다"], ["Two consequences: A fixed and precomputed plan (a sequence of actions) does not work against a stochastic transition function. What is needed instead is <b>a conditional plan (a strategy or a policy)</b> that depends on the percepts. / The agent must track every state it could be in. That set of states is called <b>a belief state</b>.", "두 가지 결과: 고정된, 미리 계산된 계획(행동 순열)은 확률적 전이 함수에는 통하지 않는다. 대신 필요한 것은 지각에 따라 달라지는 <b>조건부 계획(전략 또는 정책)</b>이다. / 에이전트는 자기가 있을 수 있는 모든 상태를 추적해야 한다. 그 상태들의 집합을 <b>믿음 상태(belief state)</b>라 한다."]], "x": "불확실성은 두 곳에서 옵니다.<ul><li><b>행동이 비결정적</b>(이 파트 4-2): 같은 행동을 해도 결과가 매번 다를 수 있습니다 — 바퀴가 미끄러지거나, 청소기가 가끔 옆 칸까지 청소하거나.</li><li><b>환경이 부분 관찰</b>(다음 파트 4-3): 센서가 불완전해서 지금 어느 상태인지 정확히 모릅니다.</li></ul>어느 쪽이든 두 가지가 따라옵니다.<ol><li>미리 짠 행동 순열은 <b>통하지 않습니다</b>. 두 번째 행동을 뭘 할지가 첫 행동의 결과에 달려 있기 때문입니다. 대신 \"만약 이렇게 되면 이렇게, 저렇게 되면 저렇게\"라는 <b>조건부 계획</b>(지각 → 행동의 규칙, 전략·정책이라고도 함)이 필요합니다.</li><li>지금 '있을 수 있는 상태들'을 전부 추적해야 합니다. 그 집합이 <b>믿음 상태(belief state)</b> — 4장 후반의 핵심 개념입니다.</li></ol>", "e": "자동차 내비: '다음 사거리에서 좌회전'은 고정 계획. 비결정적이면(길을 놓칠 수 있음) '좌회전에 성공하면 직진, 놓쳤으면 다음 사거리에서 유턴'처럼 조건부로 짜야 합니다."}, {"s": "4-2", "im": ["4-2-04"], "en": "Nondeterministic Actions: The Definition", "ko": "비결정적 행동의 정의", "key": 1, "o": [["If the agent's actions in the environment are <b>nondeterministic</b>, the transition model has to describe that <b>uncertainty</b>", "환경에서 에이전트의 행동이 <b>비결정적</b>이라면, 전이 모델이 그 <b>불확실성</b>을 기술해야 한다"], ["So, Result<b>s</b>(s, a) returns a set of states rather than one state.", "그래서 Result<b>s</b>(s, a)는 상태 하나가 아니라 상태들의 집합을 반환한다."], ["For example, Results(s<sub>1</sub>, a) = {s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub>} — Action a in state s<sub>1</sub> can lead to any one of three states.", "예를 들어 Results(s<sub>1</sub>, a) = {s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub>} — 상태 s<sub>1</sub>에서 행동 a는 세 상태 중 어느 하나로 이어질 수 있다."], ["That set {s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub>} is a belief state: after acting, the agent knows only that it is in one of them.", "그 집합 {s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub>}가 믿음 상태다: 행동한 뒤 에이전트는 자기가 그중 하나에 있다는 것만 안다."]], "x": "비결정적 행동의 정의입니다. 3장의 전이 모델 RESULT(s, a)는 상태 <b>하나</b>를 돌려줬습니다. 비결정적 세계에서는 <b>RESULTS(s, a)</b>(끝에 s가 붙은 복수형 — 슬라이드의 형광펜)가 <b>상태들의 집합</b>을 돌려줍니다.<div class='formula'>RESULTS(s<sub>1</sub>, a) = {s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub>}</div>\"s<sub>1</sub>에서 a를 하면 s<sub>2</sub>, s<sub>4</sub>, s<sub>5</sub> 중 하나가 된다\"는 뜻이고, 어느 것이 될지는 환경이 정합니다. 행동 직후 에이전트가 아는 것은 \"이 셋 중 하나에 있다\"뿐이므로, 이 집합이 곧 <b>믿음 상태</b>입니다. (확률은 아직 없습니다 — 어느 결과가 더 흔한지는 따지지 않고 '가능한가'만 봅니다. 확률을 붙이면 뒤 장의 MDP가 됩니다.)"}, {"s": "4-2", "im": ["4-2-05", "4-2-06"], "en": "Example 1: The Erratic Vacuum World", "ko": "예 1: 변덕스러운 진공청소기 세계", "o": [["The ordinary deterministic vacuum world, <i>except</i> that the <b>powerful</b> but <b>erratic</b> \"Suck\" action makes it nondeterministic", "보통의 결정적 진공청소기 세계인데, <i>단</i> <b>강력하지만</b> <b>변덕스러운</b> \"Suck\" 행동 때문에 비결정적이 된다"], ["(a) <b>On a dirty square</b>: it cleans that square, and sometimes cleans the adjacent square too — Results(s<sub>1</sub>, a) = {s<sub>5</sub>, s<sub>7</sub>} / (b) <b>On a clean square</b>: it sometimes deposits dirt on that square", "(a) <b>더러운 칸에서</b>: 그 칸을 청소하고, 가끔 옆 칸까지 청소한다 — Results(s<sub>1</sub>, a) = {s<sub>5</sub>, s<sub>7</sub>} / (b) <b>깨끗한 칸에서</b>: 가끔 그 칸에 먼지를 떨어뜨린다"], ["From state 1, the \"Suck\" action can lead to two different states, so a <b>conditional plan</b> is needed.", "상태 1에서 \"Suck\" 행동은 두 가지 다른 상태로 이어질 수 있으므로, <b>조건부 계획</b>이 필요하다."], ["The solution in a nondeterministic environment: NOT a sequence of actions, BUT a tree containing if-then-else steps. — [Suck, if State = 5 then [Right, Suck] else []]", "비결정적 환경에서의 해: 행동의 순열이 아니라, if-then-else 단계를 담은 트리다. — [Suck, State = 5이면 [Right, Suck], 아니면 []]"], ["<i>The solution of the ordinary deterministic vacuum world was [Suck, Right, Suck]</i>", "<i>보통의 결정적 진공청소기 세계의 해는 [Suck, Right, Suck]이었다</i>"]], "x": "예 1, <b>변덕스러운(erratic) 진공청소기 세계</b>. 이동(Left/Right)은 결정적이지만 Suck이 변덕스럽습니다:<ul><li>(a) 더러운 칸에서 Suck → 그 칸은 확실히 청소되고, <b>가끔 옆 칸까지</b> 청소됨. 그래서 상태 1(둘 다 더러움, 왼쪽)에서 Suck → {5(왼쪽만 깨끗), 7(둘 다 깨끗)}.</li><li>(b) 깨끗한 칸에서 Suck → <b>가끔 먼지를 떨어뜨림</b>(상태가 나빠질 수도).</li></ul>결정적 세계의 해는 [Suck, Right, Suck]이었습니다(빨간 글씨). 변덕스러운 세계에서는 첫 Suck 뒤에 상태가 5일 수도 7일 수도 있으므로, 다음 행동이 갈립니다:<div class='formula'>[Suck, <b>if</b> State = 5 <b>then</b> [Right, Suck] <b>else</b> []]</div>\"일단 Suck. 결과가 5(오른쪽이 아직 더러움)면 Right, Suck. 7(둘 다 깨끗)이면 끝.\" 해가 리스트가 아니라 <b>if-then-else가 있는 트리</b>가 되었습니다 — '계획은 프로그램'이 되는 첫 신호입니다. 06쪽 그림의 주황 화살표가 Suck의 두 가지 결과(1 → 5, 1 → 7)입니다.", "pg": [[1, 2], [1, 3]]}, {"s": "4-2", "im": ["4-2-07"], "en": "AND-OR Search Trees", "ko": "AND-OR 탐색 트리", "key": 1, "o": [["OR node: the <b>agent</b> chooses one action among several.", "OR 노드: <b>에이전트</b>가 여러 행동 중 하나를 고른다."], ["AND node: the <b>environment</b> chooses, and <b>every possible outcome</b> must be handled.", "AND 노드: <b>환경</b>이 고르며, <b>가능한 모든 결과</b>를 다 처리해야 한다."], ["Because <b>\"Suck\" in state 1</b> leads to the belief state {5, 7}, the agent needs a plan for state 5 AND a plan for state 7.", "<b>상태 1에서의 \"Suck\"</b>이 믿음 상태 {5, 7}로 이어지므로, 에이전트는 상태 5에 대한 계획 그리고(AND) 상태 7에 대한 계획이 모두 필요하다."]], "x": "비결정성을 트리로 그리는 방법, <b>AND-OR 트리</b>입니다. 노드가 두 종류입니다.<ul><li><b>OR 노드</b>(네모, 상태): <b>내가</b> 행동을 고릅니다. 여러 행동 중 <b>하나만</b> 성공하면 됩니다 — 그래서 OR.</li><li><b>AND 노드</b>(동그라미, 행동의 결과): <b>환경이</b> 결과를 고릅니다. 어느 결과가 나와도 대비해야 하므로 <b>모든</b> 가지가 성공해야 합니다 — 그래서 AND. 그림에서 가지들을 묶은 호(arc)가 AND 표시입니다.</li></ul>그림: 상태 1(OR)에서 Suck을 고르면 AND 노드로 가고, 거기서 환경이 7(GOAL) 또는 5를 고릅니다. 둘 다 처리해야 하므로 5에서 다시 OR: Suck(→ {5, 1}, 둘 다 LOOP) 또는 Right(→ 6) → Suck(→ 8 GOAL) 또는 Left(→ 5 LOOP). 3장의 트리는 OR 노드만 있었고 해가 '경로 하나'였지만, 여기서는 해가 <b>부분 트리(subtree)</b> — OR에서는 가지 하나, AND에서는 모든 가지를 포함하고 잎이 전부 GOAL인 것 — 입니다.", "e": "주사위 게임: 내 수(OR)는 좋은 것 하나만 고르면 되지만, 주사위 결과(AND)는 1~6 모두에 대한 대응을 준비해야 합니다. 체스의 '내 수 / 상대 수'도 같은 구조(5장)."}, {"s": "4-2", "im": ["4-2-08"], "en": "Searching the AND-OR Tree", "ko": "AND-OR 트리 탐색하기", "key": 1, "o": [["Goal: choose one action at every <b>OR</b> node, cover every outcome at every <b>AND</b> node, and end with a subtree whose leaves are all goal states", "목표: 모든 <b>OR</b> 노드에서 행동 하나를 고르고, 모든 <b>AND</b> 노드에서 모든 결과를 포괄하며, 잎이 전부 목표 상태인 부분 트리로 끝낸다"], ["Descend depth-first: At an OR node try one action at a time; / At an AND node take every outcome and recurse / if a state already appears on the current path, return failure / abandon any subtree whose leaves are not all goals; / stop at the first complete subtree found", "깊이 우선으로 내려간다: OR 노드에서는 행동을 한 번에 하나씩 시도; / AND 노드에서는 모든 결과를 취해 재귀 / 현재 경로에 이미 나온 상태가 다시 나오면 failure 반환 / 잎이 전부 목표가 아닌 부분 트리는 포기; / 처음 찾은 완전한 부분 트리에서 멈춘다"], ["Conditional Plan: [Suck, if State = 5 then [Right, Suck] else []]", "조건부 계획: [Suck, State = 5이면 [Right, Suck], 아니면 []]"]], "x": "AND-OR 트리에서 해(부분 트리)를 찾는 방법입니다. 깊이 우선으로:<ul><li><b>OR 노드</b>: 행동을 하나씩 시도. 하나라도 성공하면 그 행동을 택하고 성공.</li><li><b>AND 노드</b>: 모든 결과에 대해 재귀. 하나라도 실패하면 이 AND는 실패(그러면 OR로 돌아가 다른 행동 시도).</li><li><b>순환 검사</b>: 현재 경로에 이미 있는 상태가 다시 나오면 failure. 그림의 LOOP 잎들이 이것입니다(5에서 Suck → 5나 1로 돌아감). 없으면 무한히 깊어집니다.</li><li>잎이 전부 GOAL인 부분 트리를 처음 찾으면 멈춤.</li></ul>그림의 빨간 화살표가 찾은 해: 1 –Suck→ {7 GOAL, 5 –Right→ 6 –Suck→ 8 GOAL}. 이것을 읽으면 조건부 계획 [Suck, if State = 5 then [Right, Suck] else []]입니다. (OR에서는 고른 행동 하나를 쓰고, AND에서는 결과마다 if로 분기.)"}, {"s": "4-2", "im": ["4-2-09"], "en": "Recursive AND-OR Tree Search (DFS trace)", "ko": "재귀 AND-OR 트리 탐색 (DFS 추적)", "o": [["DFS: NOT OPTIMAL (Find path and just return)", "DFS: 최적이 아님 (경로를 찾으면 그냥 return)"], ["OR-SEARCH(1, []) → \"Suck\" → RESULTS = {5, 7} → AND-SEARCH({5, 7}, [1]) → OR-SEARCH(5, [1]) → \"Suck\" → RESULTS = {5, 1} → AND-SEARCH({5, 1}, [1, 5]) → OR-SEARCH(5, [1, 5]) IS-CYCLE → return fail / OR-SEARCH(1, [1, 5]) IS-CYCLE → return fail → \"Right\" → RESULTS = {6} → AND-SEARCH({6}, [1, 5]) → OR-SEARCH(6, [1, 5]) → \"Suck\" → RESULTS = {8} → AND-SEARCH({8}, [1, 5, 6]) → OR-SEARCH(8, [1, 5, 6]) GOAL return [\"Right\", \"Suck\"] → \"Left\" → RESULTS = {5} → … IS-CYCLE → return fail → OR-SEARCH(7, [1]) GOAL return [] → return [if State = 5 then [Right, Suck] else []] → return [\"Suck\", if State = 5 then [Right, Suck] else []]", "핵심: 5에서 Suck은 {5, 1}이 모두 사이클이라 <b>fail</b> → Right → 6 → Suck → 8(목표) / 7은 바로 목표 / 합치면 [Suck, if State = 5 then [Right, Suck] else []]", "code"]], "x": "교재의 AND-OR-SEARCH는 서로를 부르는 두 함수입니다: <b>OR-SEARCH(state, path)</b>는 상태에서 행동을 하나씩 시도하고, <b>AND-SEARCH(states, path)</b>는 결과 집합의 모든 상태에 대해 OR-SEARCH를 부릅니다. path는 '지금까지 지나온 상태들'로 순환 검사용입니다. 슬라이드의 추적을 줄여 읽으면:<ol><li>OR-SEARCH(1): Suck 시도 → {5, 7}. 둘 다 풀어야 함.</li><li>OR-SEARCH(5, [1]): Suck 시도 → {5, 1}. 둘 다 path에 이미 있음 → <b>IS-CYCLE → fail</b>. Right 시도 → {6}.</li><li>OR-SEARCH(6, [1, 5]): Suck → {8}. 8은 GOAL → 빈 계획 [] 반환. 따라서 6의 계획 = [Suck], 5의 계획 = [Right, Suck].</li><li>OR-SEARCH(7, [1]): 7은 GOAL → [].</li><li>AND-SEARCH({5, 7})가 둘을 합쳐 [if State = 5 then [Right, Suck] else []]를 만들고, 앞에 Suck을 붙여 최종 해.</li></ol>\"DFS: 최적이 아님\": 처음 찾은 해를 바로 반환하므로, 더 짧은 조건부 계획이 있어도 모릅니다(3장의 DFS와 같은 성질).", "e": "목표 잎이 빈 계획 []을 반환한다는 점: '목표에 도착했으니 더 할 일 없음'. 그래서 7 쪽 가지의 else []가 나옵니다."}, {"s": "4-2", "im": ["4-2-10", "4-2-11"], "en": "Example 2: Slippery Vacuum World & Cyclic Solutions", "ko": "예 2: 미끄러운 세계와 순환 해", "key": 1, "o": [["The ordinary deterministic vacuum world, <i>except</i> that a movement action (Right or Left) sometimes fails and the agent stays put.", "보통의 결정적 진공청소기 세계인데, <i>단</i> 이동 행동(Right 또는 Left)이 가끔 실패해서 에이전트가 제자리에 머문다."], ["So, from state 1, \"Right\" gives the belief state {1, 2}: <b>Results(1, Right) = {1, 2}</b>", "그래서 상태 1에서 \"Right\"는 믿음 상태 {1, 2}를 준다: <b>Results(1, Right) = {1, 2}</b>"], ["There is no longer an acyclic solution from state 1, and <b>AND-OR search returns failure (it has IS-CYCLE check)</b>", "이제 상태 1에서 비순환 해가 없고, <b>AND-OR 탐색은 failure를 반환한다(IS-CYCLE 검사가 있으므로)</b>"], ["But a cyclic solution does exist: keep trying Right until the move succeeds — [Suck, while State = 5 do Right, Suck]", "하지만 순환 해는 존재한다: 이동이 성공할 때까지 Right를 계속 시도한다 — [Suck, State = 5인 동안 Right, Suck]"], ["<i>The plan is now a loop, not just a branch</i> which is why a plan is better thought of as a program than as a list.", "<i>계획이 이제 분기만이 아니라 반복이 되었다</i> — 그래서 계획은 리스트보다 프로그램으로 생각하는 편이 낫다."]], "x": "예 2, <b>미끄러운(slippery) 진공청소기 세계</b>. 이번엔 Suck은 정상인데 <b>이동이 가끔 실패</b>해 제자리에 머뭅니다: Results(1, Right) = {1, 2}.<br>문제: 상태 1에서 Suck → 5, 5에서 Right → {5, 6}. 결과가 5면 또 Right → {5, 6}, … 어떤 유한한 트리를 그려도 '계속 5에 머무는' 가지가 남고, 그 가지는 현재 경로에 5가 다시 나오는 순환입니다. 08쪽의 알고리즘은 순환을 failure로 처리하므로 <b>해를 못 찾습니다</b>. 11쪽 그림의 5 → Right → (5로 돌아가는 화살표)가 그 순환입니다.<br>하지만 상식적으로 해는 있습니다: \"<b>될 때까지 Right를 반복</b>\".<div class='formula'>[Suck, <b>while</b> State = 5 <b>do</b> Right, Suck]</div>이것이 <b>순환 해(cyclic solution)</b>입니다. 매번 실패할 확률이 1보다 작다면 영원히 실패할 확률은 0이므로 언젠가는 성공합니다. 이런 해를 찾으려면 알고리즘을 바꿔 '같은 상태로 돌아오는 것'을 failure가 아니라 '그 상태의 계획을 다시 쓴다(루프)'로 처리해야 합니다. 결론: 계획에는 분기(if)만이 아니라 <b>반복(while)</b>도 필요하다 → <b>계획 = 프로그램</b>.", "e": "엘리베이터 버튼이 가끔 안 눌릴 때 '불이 켜질 때까지 다시 누른다'가 순환 해. '한 번 누른다'는 고정 계획, '안 켜졌으면 한 번 더'는 유한한 조건부 계획인데 그것도 두 번 연속 실패하면 끝입니다.", "pg": [[1, 2], [1, 3]]}, {"s": "4-3", "im": ["4-3-01", "4-3-02"], "en": "Sensorless (Conformant) Problems", "ko": "무감각(컨포먼트) 문제", "key": 1, "o": [["A sensorless (or conformant) problem: the agent has no percepts at all, and gets no information from the environment", "무감각(sensorless, 또는 conformant) 문제: 에이전트에게 지각이 전혀 없고, 환경에서 아무 정보도 받지 못한다"], ["Why is that useful? A doctor prescribes just a broad-spectrum antibiotic instead of running a slow blood test to identify a more specific one - saving time and cost", "그게 왜 유용한가? 의사가 더 구체적인 약을 찾기 위해 느린 혈액 검사를 하는 대신 광범위 항생제를 바로 처방한다 — 시간과 비용을 아낀다"], ["The basic idea: find a plan that works reasonably well whatever state you are in, then execute it blind", "기본 아이디어: 어떤 상태에 있든 그런대로 통하는 계획을 찾아서, 눈 감고 실행한다"]], "x": "4장 파트 III, <b>부분 관찰 가능성</b>입니다. 극단적인 경우부터 시작합니다: 센서가 <b>전혀 없는</b> 문제(sensorless, conformant). 지금 어느 상태인지 알 수 없고, 행동해도 결과를 볼 수 없습니다.<br>그래도 풀 수 있을까요? \"<b>어느 상태에 있든 통하는</b>\" 행동 순열이 있다면 됩니다. 의사 비유: 어떤 균인지 검사(관찰)하지 않고도 웬만한 균에 다 듣는 광범위 항생제를 처방하면, 검사 비용과 시간 없이 문제가 해결됩니다. 관찰이 없으니 분기(if)도 쓸 수 없고, 해는 <b>순수한 행동 순열</b>입니다 — 그 대신 '어느 상태에서 시작해도' 목표에 도착하게 만드는 순열이어야 합니다.", "e": "어두운 방에서 전등 스위치가 어디 있는지 몰라도 '벽을 따라 모든 스위치를 차례로 누른다'는 눈 감고도 통하는 계획입니다. 깜깜한 집에서 '현관 → 왼쪽 벽 따라 5걸음 → 오른쪽'처럼 외워 둔 동선도 마찬가지.", "pg": [[1, 0], [1, 3]]}, {"s": "4-3", "im": ["4-3-03"], "en": "Belief States", "ko": "믿음 상태", "key": 1, "o": [["The agent does not know exactly which state it is in. / But it does know it is in one of several possible states.", "에이전트는 자기가 정확히 어느 상태에 있는지 모른다. / 하지만 가능한 여러 상태 중 하나에 있다는 것은 안다."], ["That set is the <b>belief state</b>: for example, b = {s2, s4, s6}", "그 집합이 <b>믿음 상태(belief state)</b>다: 예를 들어 b = {s2, s4, s6}"]], "x": "이 파트의 핵심 개념 <b>믿음 상태(belief state)</b>입니다. 4-2에서는 '행동의 결과로 있을 수 있는 상태들'로 나왔고, 여기서는 '관찰이 불완전해서 있을 수 있는 상태들'로 나옵니다. 정의는 같습니다: <b>에이전트가 지금 있을 수 있다고 믿는 상태들의 집합</b>.<br>그림: 진공청소기 세계 8개 상태 중 보라 상자의 {2, 4, 6} = 에이전트가 오른쪽 칸에 있고 오른쪽 칸은 더러우며 왼쪽 칸은 모름인 경우들입니다. 오른쪽 위 작은 그림의 물음표(?)가 '모르는 부분'입니다. 핵심 전환: 이제부터 탐색은 <b>실제 상태가 아니라 믿음 상태 위에서</b> 합니다. 믿음 상태 하나를 '상태'로 보고, 행동이 믿음 상태를 다른 믿음 상태로 바꾸는 것으로 봅니다."}, {"s": "4-3", "im": ["4-3-04", "4-3-05", "4-3-06"], "en": "An Action Can Narrow the Belief State", "ko": "행동이 믿음 상태를 좁힌다", "key": 1, "o": [["The initial belief state is everything: {1, 2, 3, 4, 5, 6, 7, 8} / <b>An action can reduce the number of possible states.</b>", "초기 믿음 상태는 전부다: {1, 2, 3, 4, 5, 6, 7, 8} / <b>행동이 가능한 상태의 수를 줄일 수 있다.</b>"], ["Example: the deterministic but unobservable vacuum world — The agent knows neither its own <b>position</b> nor <b>where the dirt</b> is / After Right, every state in which the agent was on the left has moved right, so half the possibilities collapse onto the other half.", "예: 결정적이지만 관찰 불가능한 진공청소기 세계 — 에이전트는 자기 <b>위치</b>도 <b>먼지가 어디 있는지</b>도 모른다 / Right 뒤에는, 에이전트가 왼쪽에 있던 모든 상태가 오른쪽으로 옮겨 가므로, 가능성의 절반이 나머지 절반 위로 합쳐진다."], ["After Suck, the square the agent is on is clean in every remaining possibility, so the belief state shrinks again.", "Suck 뒤에는, 남은 모든 가능성에서 에이전트가 있는 칸이 깨끗하므로, 믿음 상태가 다시 줄어든다."], ["The action sequence [Right, Suck, Left, Suck] forces the world into goal state 7, whatever state it started in / Note that because there are no observations at all, no conditional plan is needed - a plain sequence is enough.", "행동 순열 [Right, Suck, Left, Suck]는 어떤 상태에서 시작했든 세계를 목표 상태 7로 몰아넣는다 / 관찰이 전혀 없으므로 조건부 계획이 필요 없다는 점에 주목 — 단순한 순열이면 충분하다."]], "x": "관찰이 없어도 <b>행동 자체가 정보를 줍니다</b>. 결정적이지만 관찰 불가능한 진공청소기 세계에서, 처음엔 위치도 먼지도 모르니 믿음 상태 = {1, …, 8} 전부. 세 슬라이드를 따라가면:<div class='tw'><table><tr><th>행동</th><th>믿음 상태</th><th>왜</th></tr><tr><td>(시작)</td><td>{1,2,3,4,5,6,7,8}</td><td>아무것도 모름</td></tr><tr><td>Right</td><td>{2,4,6,8}</td><td>왼쪽에 있던 상태(1,3,5,7)는 오른쪽으로 이동해 2,4,6,8이 됨. 오른쪽에 있던 상태는 벽에 막혀 그대로. → '내가 오른쪽에 있다'는 확정</td></tr><tr><td>Suck</td><td>{4,8}</td><td>오른쪽 칸이 청소됨 → 2→4, 6→8. '오른쪽 칸은 깨끗'이 확정</td></tr><tr><td>Left</td><td>{3,7}</td><td>왼쪽으로 이동. '내가 왼쪽에 있다' 확정</td></tr><tr><td>Suck</td><td>{7}</td><td>왼쪽 칸 청소 → 3→7. 둘 다 깨끗 = 목표!</td></tr></table></div>그림의 빨간 X가 사라진 가능성입니다. 어디서 시작했든 [Right, Suck, Left, Suck] 뒤에는 반드시 상태 7이므로, 이 <b>순열</b>이 해입니다. 관찰이 없으니 if가 들어갈 자리가 없고, 그래서 조건부 계획이 아니라 단순 순열로 충분합니다.", "e": "같은 생각: 처음 쓰는 전자레인지에서 '일단 취소 버튼을 두 번 누른다' — 어떤 상태였든 초기 화면으로 돌아오게 만드는, 관찰 없는 순열.", "pg": [[1, 2], [1, 1], [1, 1]]}, {"s": "4-3", "im": ["4-3-07"], "en": "The Reachable Belief-State Space", "ko": "도달 가능한 믿음 상태 공간", "o": [["With no observations the solution is read off as a sequence: [Right, Suck, Left, Suck]", "관찰이 없으면 해는 순열로 읽힌다: [Right, Suck, Left, Suck]"], ["The belief-state space is the power set of the N original states, so its size is 2<sup>N</sup>: here 2<sup>8</sup> = 256", "믿음 상태 공간은 원래 N개 상태의 멱집합이므로, 크기가 2<sup>N</sup>이다: 여기서는 2<sup>8</sup> = 256"], ["But, <b>12 belief states</b> is actually reachable by acting.", "하지만 실제로 행동으로 도달 가능한 것은 <b>12개의 믿음 상태</b>뿐이다."]], "x": "교재 그림 4.14, 무감각 진공청소기 세계의 <b>믿음 상태 공간</b>입니다. 각 네모 상자가 믿음 상태(그 안의 작은 그림들이 가능한 실제 상태들)이고, 화살표 L/R/S가 행동입니다. 맨 위 가운데가 초기 믿음 상태(8개 전부), 아래 파란 상자가 목표 믿음 상태({7}, {8}, 또는 {7, 8} — 전부 목표 상태만 담은 것). 초기에서 R → S → L → S로 따라가면 {7}에 도착합니다.<br>크기 문제: 8개 상태의 부분집합은 2<sup>8</sup> = <b>256</b>개라서 이론상 믿음 상태 공간은 원래 공간보다 훨씬 큽니다. 일반적으로 상태가 N개면 2<sup>N</sup>. 하지만 실제로 행동으로 <b>도달 가능한</b> 믿음 상태는 그림의 <b>12개</b>뿐입니다. 그래서 256개를 다 만들지 않고, 초기 믿음 상태에서 출발해 도달 가능한 것만 탐색합니다(3장 탐색이 상태 공간을 다 만들지 않고 필요한 만큼만 만들듯이)."}, {"s": "4-3", "im": ["4-3-08"], "en": "Planning in Belief-State Space", "ko": "믿음 상태 공간에서의 계획", "key": 1, "o": [["Formulate it as an ordinary search problem and solve it with <b>DFS</b>, <b>IDS</b>, <b>BFS</b> or <b>A*</b>: States: Every belief state; there are 2<sup>N</sup> of them for N world states. / Initial state: Usually the belief state containing every state / Actions: ACTIONS(b) = ∪<sub>s∈b</sub> ACTIONS<sub>P</sub>(s) where P is the original problem. / Transition model: b′ = Results(b, a) = {s′ : s′ = Result(s, a) and s is in b} / Goal test: does the belief state contain only goal states?", "보통의 탐색 문제로 정식화해서 <b>DFS</b>, <b>IDS</b>, <b>BFS</b>, <b>A*</b>로 푼다: 상태: 모든 믿음 상태; 세계 상태가 N개면 2<sup>N</sup>개. / 초기 상태: 보통 모든 상태를 담은 믿음 상태 / 행동: ACTIONS(b) = ∪<sub>s∈b</sub> ACTIONS<sub>P</sub>(s), P는 원래 문제. / 전이 모델: b′ = Results(b, a) = {s′ : s′ = Result(s, a)이고 s ∈ b} / 목표 검사: 믿음 상태가 목표 상태만 담고 있는가?"], ["Simplifying property: if a belief state has a solution, so does every subset of it, by the same action sequence which prunes the tree.", "단순화 성질: 어떤 믿음 상태에 해가 있으면, 그 부분집합 전부에도 같은 행동 순열로 해가 있다 — 이것이 트리를 가지치기한다."], ["b<sub>1</sub> is already <b>solved</b> by a sequence σ, and a subset b<sub>2</sub> ⊆ b<sub>1</sub> comes up later → σ solves b<sub>2</sub> as well → Reuse the plan: no search needed / b<sub>2</sub> is known to be <b>unsolvable</b>, and a superset b<sub>1</sub> ⊇ b<sub>2</sub> comes up later → b<sub>1</sub> is unsolvable too → Discard the whole branch / The search reaches b′, a superset b ⊇ b′ has already reached → b dominates b′ → Drop the b′ path - smaller tree", "b<sub>1</sub>이 순열 σ로 이미 <b>풀렸고</b>, 나중에 부분집합 b<sub>2</sub> ⊆ b<sub>1</sub>이 나오면 → σ가 b<sub>2</sub>도 푼다 → 계획 재사용: 탐색 불필요 / b<sub>2</sub>가 <b>풀 수 없다</b>고 알려졌고, 나중에 상위집합 b<sub>1</sub> ⊇ b<sub>2</sub>가 나오면 → b<sub>1</sub>도 풀 수 없다 → 그 가지 전체를 버림 / 탐색이 b′에 도달했는데, 상위집합 b ⊇ b′에 이미 도달했으면 → b가 b′를 지배 → b′ 경로를 버림 - 더 작은 트리"], ["In practice, the size of the state space 2<sup>N</sup> makes this unuseful for larger problems", "실제로는 상태 공간의 크기 2<sup>N</sup> 때문에 큰 문제에는 쓸모가 없다"]], "x": "믿음 상태 공간에서의 계획은 <b>3장의 탐색 문제 그대로</b>입니다 — 믿음 상태를 '상태'로 보면 됩니다. 5요소를 대응시키면:<div class='tw'><table><tr><th>요소</th><th>믿음 상태 문제</th></tr><tr><td>상태</td><td>믿음 상태 b (가능한 집합 2<sup>N</sup>개)</td></tr><tr><td>초기 상태</td><td>보통 전체 집합</td></tr><tr><td>행동</td><td>b 안의 어떤 상태에서든 가능한 행동 전부(합집합)</td></tr><tr><td>전이</td><td>b′ = b의 각 상태에 a를 적용한 결과들의 집합</td></tr><tr><td>목표</td><td>b의 모든 원소가 목표 상태</td></tr></table></div>그러면 DFS, IDS, BFS, A* 어느 것이든 그대로 돌릴 수 있습니다.<br>유용한 성질: <b>작은 믿음 상태일수록 쉽습니다</b>(가능성이 적으니). b<sub>1</sub>을 푸는 순열 σ는 b<sub>1</sub>의 부분집합도 전부 풉니다. 이것으로 표의 세 가지 가지치기를 합니다 — 이미 푼 것의 부분집합이면 그 계획을 재사용, 못 푸는 것의 상위집합이면 포기, 이미 도달한 믿음 상태의 부분집합이면(더 큰 쪽이 '지배') 그 경로는 버림. 그래도 2<sup>N</sup>의 폭발은 피할 수 없어 큰 문제에는 비현실적이고, 그래서 다음 쪽부터 <b>관찰</b>을 씁니다.", "e": "{1,2,3,4}를 [R,S,L,S]로 풀 수 있다면 {1,3}도 같은 순열로 풀립니다 — 어차피 1과 3은 그 안에 있었으니."}, {"s": "4-3", "im": ["4-3-09"], "en": "Percepts and Observability", "ko": "지각과 관찰 가능성", "key": 1, "o": [["Many problems cannot be solved efficiently without sensing. — Example) The 8-puzzle where the agent must see at least one tile.", "많은 문제는 감지 없이는 효율적으로 풀 수 없다. — 예) 에이전트가 적어도 타일 하나는 봐야 하는 8-퍼즐."], ["The <b>percept function</b> Percept(s) says what the agent observes in state s: Fully observable: Percept(s) = s / Sensorless: Percept(s) = None / Partially observable: Percept(s) = o, an observation that tells the agent something about s.", "<b>지각 함수</b> Percept(s)는 에이전트가 상태 s에서 무엇을 관찰하는지 말한다: 완전 관찰: Percept(s) = s / 무감각: Percept(s) = None / 부분 관찰: Percept(s) = o, 에이전트에게 s에 대해 무언가를 알려 주는 관찰."], ["The difficulty: Many states (different arrangements of the unobserved tiles) produce the same observation", "어려움: 많은 상태(보이지 않는 타일들의 서로 다른 배치)가 같은 관찰을 만들어 낸다"]], "x": "센서 없이는 못 푸는 문제도 많습니다. 8-퍼즐에서 타일을 하나도 못 보면 어느 상태든 통하는 순열은 사실상 없습니다. 그래서 이제 <b>지각(percept)</b>을 넣습니다. 지각 함수 <b>PERCEPT(s)</b>는 '상태 s에서 에이전트에게 보이는 것'이고, 관찰 가능성의 세 단계를 하나의 식으로 통일합니다:<div class='tw'><table><tr><th>관찰 가능성</th><th>PERCEPT(s)</th><th>뜻</th></tr><tr><td>완전 관찰</td><td>s</td><td>상태가 그대로 보임 (3장)</td></tr><tr><td>무감각</td><td>None</td><td>아무것도 안 보임 (02~08쪽)</td></tr><tr><td><b>부분 관찰</b></td><td>o</td><td>상태의 일부만 보임</td></tr></table></div>그림: 8-퍼즐에서 왼쪽 위 타일 '7'만 보이는 상황. 관찰 o = \"왼쪽 위는 7\"인데, 나머지 타일이 어떻게 놓였든 같은 o가 나옵니다. 즉 <b>여러 상태가 같은 관찰을 냅니다</b> — 그래서 관찰을 받아도 믿음 상태가 한 점으로 좁혀지지 않고 집합으로 남습니다. 이것이 부분 관찰의 어려움입니다.", "e": "안개 속 운전: 바로 앞 표지판(관찰)은 보이지만, 같은 표지판이 여러 지점에 있을 수 있어 '내가 어디쯤인지'는 후보 몇 개로 남습니다."}, {"s": "4-3", "im": ["4-3-10"], "en": "Using Observations: Predict and Update", "ko": "관찰 활용: 예측과 갱신", "key": 1, "o": [["Start from the current belief state b: the set of states the agent could be in", "현재 믿음 상태 b에서 시작한다: 에이전트가 있을 수 있는 상태들의 집합"], ["<b>Predict</b> with an action: choose a, and use the transition model to get the belief state that results. b̂ = PREDICT(b, a) = RESULT(b, a)", "행동으로 <b>예측(Predict)</b>: a를 고르고, 전이 모델로 그 결과인 믿음 상태를 얻는다. b̂ = PREDICT(b, a) = RESULT(b, a)"], ["<b>Update</b> with an observation: receive o, and keep only the states consistent with it. b<sub>o</sub> = UPDATE(b̂, o) = {s : o = PERCEPT(s) and s ∈ b̂}", "관찰로 <b>갱신(Update)</b>: o를 받고, 그것과 모순 없는 상태만 남긴다. b<sub>o</sub> = UPDATE(b̂, o) = {s : o = PERCEPT(s)이고 s ∈ b̂}"], ["The two steps together: b ← Update(Predict(b, a), o)", "두 단계를 합치면: b ← Update(Predict(b, a), o)"], ["The agent chooses an action and then receives an observation, so predict always comes before update", "에이전트는 행동을 고른 뒤 관찰을 받으므로, 예측이 항상 갱신보다 먼저 온다"]], "x": "부분 관찰에서 믿음 상태를 유지하는 두 단계입니다.<ol><li><b>예측(Predict)</b>: 행동 a를 하면 믿음 상태가 어떻게 되나. b의 각 상태에 a를 적용한 결과를 모읍니다.<div class='formula'>b̂ = PREDICT(b, a) = {RESULT(s, a) : s ∈ b}</div>행동이 비결정적이면 가능성이 <b>늘어나고</b>, 결정적이면 04쪽처럼 줄어들 수도 있습니다.</li><li><b>갱신(Update)</b>: 관찰 o를 받으면, b̂ 중에서 '그 관찰이 나올 수 있는 상태'만 남깁니다.<div class='formula'>b<sub>o</sub> = UPDATE(b̂, o) = {s ∈ b̂ : PERCEPT(s) = o}</div>관찰과 모순되는 가능성이 쳐내지므로 믿음 상태가 <b>줄어듭니다</b>.</li></ol>합치면 <b>b ← UPDATE(PREDICT(b, a), o)</b>. 에이전트는 '행동하고 → 그 결과를 본다'는 순서이므로 항상 예측이 먼저, 갱신이 다음입니다(그림의 보라·파랑 화살표 순환). 이 두 단계 순환이 14쪽의 모니터링/필터링이고, 확률을 붙이면 칼만 필터·베이즈 필터가 됩니다.", "e": "로봇 위치 추정: 한 칸 전진 명령(예측: 바퀴가 미끄러질 수 있어 위치 후보가 퍼짐) → 센서에 '왼쪽에 벽'(갱신: 왼쪽에 벽이 있는 위치만 남김)."}, {"s": "4-3", "im": ["4-3-11"], "en": "Example: The Local-Sensing Vacuum World", "ko": "예: 국소 감지 진공 세계", "o": [["The agent senses its own square only (Partial Observable): position and whether that square is dirty.", "에이전트는 자기 칸만 감지한다(부분 관찰): 위치와, 그 칸이 더러운지."], ["<b>Predict with Right</b> from b = {1, 3}, then <b>update with the observation [B, Dirty]</b>. = Update(Predict({1, 3}, Right), [B, Dirty]) = {2}", "b = {1, 3}에서 <b>Right로 예측</b>한 뒤, <b>관찰 [B, Dirty]로 갱신</b>한다. = Update(Predict({1, 3}, Right), [B, Dirty]) = {2}"], ["Two possibilities collapse to one, because only state 2 is consistent with seeing B dirty", "두 가능성이 하나로 붕괴한다. B가 더럽다고 본 것과 모순 없는 상태는 2뿐이므로"]], "x": "예측/갱신의 숫자 예, <b>국소 감지(local-sensing) 진공청소기 세계</b>. 에이전트는 자기가 있는 칸의 위치(A/B)와 더러운지만 봅니다. 옆 칸은 못 봅니다.<ol><li>현재 b = {1, 3}: 왼쪽 A칸에 있고 A는 더럽다(관찰로 앎). B는 더러울 수도(1) 깨끗할 수도(3) 있음.</li><li><b>예측</b> Right: 1 → 2, 3 → 4. b̂ = {2, 4}. 둘 다 '오른쪽 칸에 있음'이지만 B가 더러운지는 아직 모름.</li><li><b>관찰</b> [B, Dirty]: \"B칸에 있고, 더럽다\".</li><li><b>갱신</b>: {2, 4} 중 PERCEPT(s) = [B, Dirty]인 것은 2뿐(4는 B가 깨끗하므로 [B, Clean]이 나왔을 것). b = {2}.</li></ol>그림의 빨간 X가 탈락한 4입니다. 두 가능성이 하나로 붕괴했습니다. 만약 관찰이 [B, Clean]이었다면 {4}가 됐을 것이고 — 이렇게 관찰마다 결과가 갈리기 때문에 다음 쪽의 AND-OR 트리가 필요합니다."}, {"s": "4-3", "im": ["4-3-12", "4-3-13"], "en": "Solving a Partially Observable Problem", "ko": "부분 관찰 문제 풀기", "key": 1, "o": [["Build <b>a conditional plan</b> using an AND-OR tree over belief states. / The OR node is the agent's choice of action. / The AND branches are the observations it might then perceive.", "믿음 상태 위의 AND-OR 트리로 <b>조건부 계획</b>을 만든다. / OR 노드는 에이전트의 행동 선택이다. / AND 가지는 그다음에 받을 수 있는 관찰들이다."], ["1. Take Suck at the root. — Plan: [Suck, …]", "1. 루트에서 Suck을 택한다. — 계획: [Suck, …]"]], "x": "부분 관찰 문제의 해법 = 4-2의 AND-OR 탐색을 <b>믿음 상태 위에서</b> 돌리는 것입니다. 달라지는 점은 AND 가지의 의미뿐입니다:<ul><li>4-2: AND 가지 = 행동의 비결정적 <b>결과</b>들(환경이 고름).</li><li>4-3: AND 가지 = 행동 뒤 받을 수 있는 <b>관찰</b>들(역시 환경이 고름). 관찰마다 갱신된 믿음 상태가 다르므로, 관찰별로 계획을 준비해야 합니다.</li></ul>12쪽 그림: 초기 믿음 상태 {1, 3}(A칸, A 더러움, B는 모름). OR 노드에서 두 행동:<ul><li><b>Suck</b> → 예측 {5, 7} → 가능한 관찰은 [A, Clean] 하나뿐(두 상태 모두 A가 깨끗) → AND 가지 하나, 믿음 상태 {5, 7}.</li><li><b>Right</b> → 예측 {2, 4} → 관찰이 [B, Dirty]면 {2}, [B, Clean]이면 {4} → AND 가지 둘.</li></ul>13쪽: 루트에서 Suck을 택해 계획이 [Suck, …]으로 시작. 그다음 {5, 7}에서 Right → 예측 {6, 8} → 관찰 [B, Dirty]면 {6}에서 Suck → {8}(목표), [B, Clean]이면 {8}(목표). 완성된 계획: <b>[Suck, Right, if Bstate = Dirty then Suck else []]</b>. 4-2 05쪽의 변덕스러운 세계 해와 모양이 같은 조건부 계획인데, 이번엔 분기 조건이 '결과 상태'가 아니라 '관찰'입니다.", "pg": [[1, 1], [1, 1]]}, {"s": "4-3", "im": ["4-3-14"], "en": "An Agent for Partially Observable Environments", "ko": "부분 관찰 환경의 에이전트", "o": [["The problem-solving agent formulates the problem, calls a search algorithm such as AND-OR-SEARCH to get a solution, and executes it", "문제 해결 에이전트는 문제를 정식화하고, AND-OR-SEARCH 같은 탐색 알고리즘을 불러 해를 얻고, 그것을 실행한다"], ["The solution is <b>a conditional plan</b>, not a sequence of actions — While acting and receiving percepts, the agent has to keep track of its own belief state: b ← Update(Predict(b, a), o) / That process is called <b>monitoring</b>, <b>filtering</b> or <b>state estimation</b>.", "해는 행동의 순열이 아니라 <b>조건부 계획</b>이다 — 행동하고 지각을 받는 동안, 에이전트는 자기 믿음 상태를 계속 추적해야 한다: b ← Update(Predict(b, a), o) / 그 과정을 <b>모니터링</b>, <b>필터링</b>, 또는 <b>상태 추정</b>이라 한다."], ["The difficulty: the agent must update its belief state in real time. — In many real applications there is only time to compute an approximate belief state - approximations of this kind are common in control theory and in reinforcement learning", "어려움: 에이전트는 믿음 상태를 실시간으로 갱신해야 한다. — 많은 실제 응용에서는 근사적인 믿음 상태를 계산할 시간밖에 없다 - 이런 종류의 근사는 제어 이론과 강화학습에서 흔하다"]], "x": "부분 관찰 환경의 에이전트는 3장의 문제 해결 에이전트와 뼈대가 같습니다: 문제 정식화 → 탐색(AND-OR-SEARCH) → 실행. 차이는 두 가지:<ul><li>해가 순열이 아니라 <b>조건부 계획</b>이라, 실행 중에 '지금 어느 분기인가'를 알아야 합니다.</li><li>그러려면 행동할 때마다 <b>b ← UPDATE(PREDICT(b, a), o)</b>로 믿음 상태를 계속 유지해야 합니다. 이것을 <b>모니터링(monitoring)</b>, <b>필터링(filtering)</b>, <b>상태 추정(state estimation)</b>이라 합니다 — 셋 다 같은 뜻으로, \"지금 내가 어디 있는지를 관찰로부터 계속 추정한다\"입니다.</li></ul>현실의 어려움: 이 갱신을 <b>실시간</b>으로 해야 하는데, 상태가 많으면 정확한 믿음 상태(집합 전체)를 계산할 시간이 없습니다. 그래서 근사합니다 — 예를 들어 집합 대신 '가장 그럴듯한 상태 하나'나 '확률 분포의 평균과 분산'만 유지. 로봇·자율주행의 위치 추정(칼만 필터, 파티클 필터)과 강화학습이 바로 이런 근사 상태 추정 위에서 돌아갑니다.", "e": "자율주행차: 매 순간 GPS·카메라·바퀴 회전수로 '내 위치'의 믿음 상태를 갱신(필터링)하면서, 그 추정 위치에 따라 '차선 유지 / 우회전' 분기를 실행합니다."}, {"s": "4-4", "im": ["4-4-01", "4-4-02"], "en": "Recap: Offline Search", "ko": "복습: 오프라인 탐색", "o": [["<b>Offline search</b> (also called <b>planning</b>): builds a plan using <b>the state space</b> and the <b>transition model</b>, before taking any action.", "<b>오프라인 탐색</b>(<b>계획</b>이라고도 함): 어떤 행동도 하기 전에, <b>상태 공간</b>과 <b>전이 모델</b>을 써서 계획을 세운다."], ["The plan may be <b>a sequence of actions</b>, / <b>a conditional plan</b> that uses observations to handle uncertainty and incomplete perception.", "계획은 <b>행동의 순열</b>일 수도, / 불확실성과 불완전한 지각을 다루기 위해 관찰을 쓰는 <b>조건부 계획</b>일 수도 있다."], ["The agent predicts the outcome of its actions by searching with a known transition function.", "에이전트는 알려진 전이 함수로 탐색해서 행동의 결과를 예측한다."], ["<
