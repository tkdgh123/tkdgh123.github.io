<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>인공지능입문 복습 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a search-tree notebook — graph-paper ground, nodes as section markers.
   Frontier green = next/correct, expanded lavender = visited/selected, goal red = wrong/attention. */
:root{
  --paper:#f3f5f8; --card:#ffffff; --ink:#16202c; --muted:#5a6778; --line:#d6dde6; --grid:#dfe5ec;
  --frontier:#1f8a5b; --frontier-soft:#e2f4ea; --expanded:#6c5bd4; --expanded-soft:#ece9fb;
  --goal:#cf3f33; --goal-soft:#fbe7e5; --warn:#a86a00; --warn-soft:#fbf1dc;
  --code-bg:#eef1f5;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --card:#161d27; --ink:#e5eaf1; --muted:#97a4b6; --line:#273241; --grid:#1a222d;
  --frontier:#4cc38a; --frontier-soft:#14301f; --expanded:#a596f2; --expanded-soft:#241f43;
  --goal:#f0716a; --goal-soft:#3a1916; --warn:#e7b04a; --warn-soft:#352a12; --code-bg:#1d2633; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141b; --card:#161d27; --ink:#e5eaf1; --muted:#97a4b6; --line:#273241; --grid:#1a222d;
  --frontier:#4cc38a; --frontier-soft:#14301f; --expanded:#a596f2; --expanded-soft:#241f43;
  --goal:#f0716a; --goal-soft:#3a1916; --warn:#e7b04a; --warn-soft:#352a12; --code-bg:#1d2633; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.2px);background-size:22px 22px}
a{color:var(--expanded)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--expanded);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;line-height:1.3}
code,.mono{font-family:var(--f-mono);font-size:.92em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:5px}
sub,sup{line-height:0}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.25rem;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--muted);font-size:.8rem;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{border:0;background:none;padding:6px 14px;border-radius:999px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:.92rem;color:var(--muted)}
.tab .dot{width:9px;height:9px;border-radius:50%;border:2px solid currentColor}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tab[aria-selected="true"] .dot{background:var(--frontier);border-color:var(--frontier)}
.badge{font-family:var(--f-mono);font-size:.72rem;background:var(--goal);color:#fff;border-radius:999px;padding:0 7px;line-height:1.6}
.badge[hidden]{display:none}
main{padding-block:24px 64px}

/* chapter switch */
.chsw{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chbtn{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 14px;text-align:left;min-width:0}
.chbtn small{display:block;color:var(--muted);font-size:.75rem;font-family:var(--f-mono)}
.chbtn b{font-weight:700}
.chbtn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* notes */
.notes{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:.9rem;line-height:1.4}
.toc a:hover{background:var(--card);color:var(--ink)}
.toc a .n{font-family:var(--f-mono);font-size:.78rem;color:var(--expanded);flex:none}
.toc .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 8px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;margin-bottom:22px;scroll-margin-top:90px}
.sec-h{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.node{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;
  background:var(--expanded-soft);color:var(--expanded);border:2px solid var(--expanded)}
.sec-h h2{margin:0;font-size:1.45rem}
.sec-h .en{color:var(--muted);font-size:.85rem;font-family:var(--f-mono)}
.sec h3{font-size:1.06rem;margin:26px 0 8px;padding-top:16px;border-top:1px dashed var(--line)}
.sec h3:first-of-type{border-top:0;padding-top:0}
.sec p{margin:8px 0;max-width:72ch}
.sec ul,.sec ol{margin:8px 0;padding-left:1.3em;max-width:74ch}
.sec li{margin:3px 0}
.key{background:var(--frontier-soft);border-left:4px solid var(--frontier);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-weight:500}
.warn{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;font-size:.94rem}
.extra{background:var(--code-bg);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.92rem;color:var(--muted)}
.extra b:first-child{color:var(--ink)}
.formula{font-family:var(--f-mono);background:var(--code-bg);border-radius:8px;padding:10px 14px;margin:10px 0;overflow-x:auto;white-space:nowrap}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.y{color:var(--frontier);font-weight:700} td.n{color:var(--goal);font-weight:700}
.go{display:flex;justify-content:flex-end;margin-top:18px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:8px 18px;font-weight:600;font-size:.92rem;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:5px 12px;font-size:.84rem}
.btn.danger{background:transparent;color:var(--goal);border-color:var(--goal)}

/* quiz */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px}
.qwrap{max-width:820px;margin:0 auto}
.setup h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0 0 4px}
.setup p.sub{color:var(--muted);margin:0 0 18px}
.field{margin:16px 0}
.field>label,.field>.fl{display:block;font-size:.78rem;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 13px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--expanded);border-color:var(--expanded);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--frontier);transition:width .25s}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pill{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.pill.t{border-color:var(--expanded);color:var(--expanded)}
.qtext{font-size:1.12rem;font-weight:600;line-height:1.55;margin:4px 0 6px}
.qhint{font-size:.85rem;color:var(--muted);margin-bottom:14px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:var(--paper);text-align:left;width:100%}
.opt .lt{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--muted)}
.opt .ot{min-width:0;padding-top:1px}
.opt[aria-checked="true"]{border-color:var(--expanded);background:var(--expanded-soft)}
.opt[aria-checked="true"] .lt{background:var(--expanded);border-color:var(--expanded);color:#fff}
.opt.ok{border-color:var(--frontier);background:var(--frontier-soft)}
.opt.ok .lt{border-color:var(--frontier);color:var(--frontier)}
.opt.ok[aria-checked="true"] .lt{background:var(--frontier);color:#fff}
.opt.bad{border-color:var(--goal);background:var(--goal-soft)}
.opt.bad .lt{border-color:var(--goal);background:var(--goal);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--frontier)}
.opt:disabled{cursor:default}
.mark{margin-left:auto;flex:none;font-family:var(--f-mono);font-size:.74rem;font-weight:600;padding-top:3px}
.mark.ok{color:var(--frontier)} .mark.bad{color:var(--goal)}
.sa{display:flex;gap:8px;flex-wrap:wrap}
.sa input{flex:1 1 240px;min-width:0;font:inherit;font-family:var(--f-mono);border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper);color:var(--ink)}
.sa input:focus{outline:2px solid var(--expanded);outline-offset:1px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.verdict{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 14px;border-radius:10px;font-weight:700}
.verdict.ok{background:var(--frontier-soft);color:var(--frontier)}
.verdict.bad{background:var(--goal-soft);color:var(--goal)}
.exp{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.exp h4{margin:14px 0 6px;font-size:.8rem;letter-spacing:.06em;color:var(--muted)}
.exp .tr{background:var(--code-bg);border-radius:8px;padding:10px 14px}
.eo{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.eo:last-child{border-bottom:0}
.eo .lt2{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:.8rem}
.eo.c .lt2{background:var(--frontier);color:#fff} .eo.w .lt2{background:var(--line);color:var(--muted)}
.eo .en{font-size:.92rem}
.eo .ko{font-size:.92rem;color:var(--muted)}
.eo .why{font-size:.92rem;margin-top:2px}
.tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:1px}
.tag.c{background:var(--frontier-soft);color:var(--frontier)} .tag.w{background:var(--goal-soft);color:var(--goal)}
.ansrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:.94rem}
.ansrow dt{color:var(--muted)} .ansrow dd{margin:0;font-family:var(--f-mono);word-break:break-word}
.result h2{font-family:var(--f-display);font-weight:400;font-size:2.4rem;margin:0}
.score{font-family:var(--f-mono);font-size:1rem;color:var(--muted)}

/* wrong notes */
.wn-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.wn-head h2{font-family:var(--f-display);font-weight:400;font-size:1.7rem;margin:0}
.store{font-size:.8rem;color:var(--muted)}
.wlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.wcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--goal);border-radius:10px;padding:14px 16px}
.wcard.res{border-left-color:var(--frontier);opacity:.8}
.wtop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.wq{font-weight:600}
.wbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .node{margin:0 auto 12px;background:var(--frontier-soft);color:var(--frontier);border-color:var(--frontier)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem}

@media (max-width:820px){
  .notes{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .toc .lbl{display:none}
  .toc a{flex:none;border:1px solid var(--line);background:var(--card);white-space:nowrap}
  .sec{padding:20px 16px}
  .panel{padding:18px 16px}
  .brand span{display:none}
  .top .wrap{gap:10px}
  .tabs{width:100%;justify-content:space-between}
  .tab{flex:1;justify-content:center;padding:6px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* slide cards */
.secbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;scroll-margin-top:90px}
.secbar h2{margin:0;font-size:1.5rem}
.secbar .en{color:var(--muted);font-size:.85rem;font-family:var(--f-mono)}
.secbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.secgap{height:28px}
.slide{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px 20px;margin-bottom:16px;scroll-margin-top:90px}
.slide.key{border-left:4px solid var(--frontier)}
.sl-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.pg{font-family:var(--f-mono);font-size:.74rem;color:var(--expanded);border:1px solid var(--expanded);border-radius:999px;padding:0 8px;white-space:nowrap}
.kb{font-size:.72rem;font-weight:700;background:var(--frontier-soft);color:var(--frontier);border-radius:5px;padding:0 6px}
.sl-t{flex-basis:100%;min-width:0}
.sl-t b{display:block;font-size:1.12rem;line-height:1.4}
.sl-t span{color:var(--muted);font-size:.92rem}
.shots{display:grid;gap:8px;margin:4px 0 12px}
.shots.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.shots.n3,.shots.n4,.shots.n5{grid-template-columns:repeat(2,minmax(0,1fr))}
.shot{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;padding:0;display:block;width:100%;position:relative}
.shot img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#fff}
.shot i{position:absolute;left:6px;top:6px;font-style:normal;font-family:var(--f-mono);font-size:.68rem;background:rgba(22,32,44,.72);color:#fff;border-radius:4px;padding:0 5px}
.blk{margin-top:10px}
.blk>.lb{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase}
.orig{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.orig li{border-left:3px solid var(--expanded);padding:2px 0 2px 10px}
.orig .e{display:block;font-size:.95rem}
.orig .k{display:block;font-size:.9rem;color:var(--muted)}
.xp{font-size:.95rem}
.xp p{margin:6px 0}
.xp ul{margin:6px 0;padding-left:1.2em}
.ex{background:var(--warn-soft);border-radius:8px;padding:8px 12px;font-size:.92rem;margin-top:10px}
.ex b{color:var(--warn)}
.lbx{position:fixed;inset:0;z-index:50;background:rgba(10,14,20,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lbx img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
.tgl{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);cursor:pointer;margin-left:auto}
.tgl input{accent-color:var(--frontier)}
@media (max-width:820px){.slide{padding:14px 14px 16px}.shots.n2,.shots.n3,.shots.n4,.shots.n5{grid-template-columns:minmax(0,1fr)}}

/* ===== v3 readability pass ===== */
:root{--r:12px}
body{font-size:17px;line-height:1.75;background-image:none}
.wrap{max-width:1680px;padding-inline:clamp(16px,2.5vw,40px)}
.top .wrap{padding-block:12px}
.brand b{font-size:1.3rem}
.tab{padding:8px 16px;font-size:.95rem}
main{padding-block:28px 80px}
.chsw{gap:10px;margin-bottom:22px}
.chbtn{padding:10px 18px;border-radius:12px}
.chbtn small{font-size:.74rem;letter-spacing:.04em}
.chbtn b{font-size:1rem}
.notes{grid-template-columns:190px minmax(0,1fr);gap:28px}
.toc a{padding:8px 10px;font-size:.95rem}
.toc a:hover{background:var(--expanded-soft);color:var(--ink)}
.toc .lbl{text-transform:none;letter-spacing:0;font-size:.82rem;font-weight:600}
.secbar{margin:10px 0 18px;gap:16px}
.secbar h2{font-size:1.65rem}
.secbar .en{font-size:.88rem}
.secgap{height:44px}

/* slide card: image on the left, text on the right */
.slide{padding:22px 26px 26px;margin-bottom:22px;border-radius:16px}
.slide:has(.shots){display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:32px;align-items:start}
.slide:has(.shots)>.sl-h{grid-column:1/-1}
.slide:has(.shots)>.shots{grid-column:1;grid-row:2;margin:0;grid-template-columns:minmax(0,1fr)}
.slide:has(.shots)>.sl-x{grid-column:2;grid-row:2;min-width:0}
.slide .stk{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.sl-x>.blk:first-child{margin-top:0}
.sl-h{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sl-t b{font-size:1.25rem;line-height:1.4}
.sl-t span{font-size:1rem;color:var(--muted)}
.pg{font-size:.78rem}
.kb{font-size:.78rem;padding:1px 8px}
.shot{border-radius:10px;box-shadow:0 1px 0 var(--line)}
.blk{margin-top:18px}
.blk>.lb{text-transform:none;letter-spacing:0;font-size:.85rem;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.blk>.lb::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--expanded)}
.blk:has(.xp)>.lb::before{background:var(--frontier)}
.orig{gap:12px}
.orig li{border-left:3px solid var(--expanded);padding:2px 0 2px 14px}
.orig .e{font-size:1.02rem;font-weight:500;line-height:1.6}
.orig .k{font-size:.97rem;color:var(--muted);margin-top:2px}
.xp{font-size:1.02rem;line-height:1.8}
.xp p{margin:10px 0}
.xp ul,.xp ol{margin:10px 0;padding-left:1.3em}
.xp li{margin:5px 0}
.ex{padding:12px 16px;font-size:1rem;margin-top:16px;line-height:1.7}
.key{font-size:1rem}
.formula{font-size:.95rem}
table{font-size:.95rem}
th,td{padding:9px 12px}

/* quiz & wrong notes */
.qwrap{max-width:860px}

{s:"1-1",im:["1-1-20"],en:"What Is AI? – Defining AI",ko:"AI란 무엇인가 – AI의 정의",key:1,
 o:[["Intelligence: the ability to acquire knowledge and apply it — to learn, reason, and solve problems — in order to adapt effectively to the environment.","지능: 환경에 효과적으로 적응하기 위해 지식을 습득하고 적용하는 능력 — 배우고, 추론하고, 문제를 해결하는 능력."],["AI = machines that can perceive, learn, reason, and make decisions like humans.","AI = 인간처럼 지각하고, 배우고, 추론하고, 결정을 내릴 수 있는 기계."],["Four ways to finish the sentence \"machines that …\". This course takes the fourth.","\"기계는 ~하는 것이다\"를 완성하는 네 가지 방법. 이 수업은 네 번째를 택한다."]],
 x:"<div class='tw'><table><tr><th></th><th>Humanly (인간처럼)</th><th>Rationally (합리적으로)</th></tr><tr><th>Think (생각)</th><td><b>Cognitive modelling</b>(인지 모델링): 인간 마음의 내부 작동을 재현</td><td><b>The laws of thought</b>(사고의 법칙): 형식 논리로 결론이 반드시 따라 나오게</td></tr><tr><th>Act (행동)</th><td><b>The Turing test</b>(튜링 테스트): 관찰자가 기계와 사람을 구별 못 하게</td><td><b>The rational agent</b>(합리적 에이전트): 목표 달성 가능성을 최대화 ← 이 수업</td></tr></table></div>교재가 <b>acting rationally</b>를 택하는 이유: ① 논리 증명만으로 부족한 상황이 많다(뜨거운 난로에서 손 떼기는 추론 없이도 합리적) ② \"목표를 얼마나 잘 달성했나\"는 수학적으로 측정 가능하다.",
 e:"Act rationally: 내비게이션이 실시간 교통 정보로 가장 빨리 도착할 경로를 고른다. 사람처럼 '생각'할 필요는 없다."},
{s:"1-1",im:["1-1-21"],en:"What Is AI? (AI in films)",ko:"AI란 무엇인가? (영화 속 AI)",
 o:[["AI = machines that can perceive, learn, reason, and make decisions like humans.","AI = 인간처럼 지각·학습·추론·결정하는 기계."]],
 x:"Iron Man(자비스), WALL·E, her(사만다) — 대중이 떠올리는 AI는 모두 \"인간처럼(humanly)\" 보이는 AI입니다. 다음 슬라이드부터 현실의 AI는 훨씬 평범한 곳에 있다는 걸 보여 줍니다."},
{s:"1-1",im:["1-1-22","1-1-23","1-1-24","1-1-25"],en:"What Is AI? — Are these objects \"intelligence\"?",ko:"이 물건들은 '지능'일까?",key:1,
 o:[["Are these objects \"intelligence\"? (Act rationally highlighted)","이 물건들은 '지능'일까? ('합리적으로 행동하기'가 강조됨)"],["Google Home Mini → behind it: Gemini, ChatGPT, Claude","구글 홈 미니 → 그 뒤에 Gemini, ChatGPT, Claude가 있다"]],
 x:"<b>Act rationally</b> 기준(감지 sense → 판단·행동 decide/act → 학습 learn)으로 판정해 봅니다.<div class='tw'><table><tr><th>Object</th><th>Sense</th><th>Act</th><th>Learn</th><th>판정</th></tr><tr><td>Wardrobe 옷장</td><td>✗</td><td>✗</td><td>✗</td><td>지능 아님</td></tr><tr><td>Clock 온습도 시계</td><td>○</td><td>✗</td><td>✗</td><td>보기 어려움</td></tr><tr><td>Fridge 냉장고</td><td>○</td><td>△</td><td>✗</td><td>단순 감지→행동, 경계선</td></tr><tr><td>Nest thermostat 온도조절기</td><td>○</td><td>○</td><td>○</td><td>생활 패턴 학습</td></tr><tr><td>AI speaker</td><td>○</td><td>○</td><td>○</td><td>두뇌는 LLM</td></tr></table></div>핵심 메시지: \"지능이다/아니다\" 사이에 깔끔한 선은 없고 <b>정도의 차이(a matter of degree)</b>다."},
{s:"1-1",im:["1-1-26"],en:"What Is AI? — Which robot is more \"intelligence\"?",ko:"어느 로봇이 더 '지능적'일까?",
 o:[["Which robot is more \"intelligence\"?","어느 로봇이 더 '지능적'인가?"]],
 x:"왼쪽은 트랙을 달리는 휴머노이드(humanoid), 오른쪽은 물류창고에서 상자를 분류하는 모습. 겉보기엔 달리기가 화려하지만, <b>acting rationally</b> 관점에서는 모양·크기가 제각각인 물건을 보고 판단해 처리하는 쪽이 더 많은 지각(perception)과 결정(decision)을 요구합니다.",
 e:"100m를 빨리 뛰는 것보다 처음 보는 부엌에서 설거지를 끝내는 게 로봇에겐 훨씬 어렵다."},
{s:"1-1",im:["1-1-27","1-1-28","1-1-29","1-1-30","1-1-31"],en:"AI in Our Life",ko:"우리 삶 속의 AI",
 o:[["Recommendation · Self-driving car · Smart health care · ChatGPT · Image generation","추천 · 자율주행차 · 스마트 헬스케어 · ChatGPT · 이미지 생성"],["Jensen Huang eating ramen in the Soongsil university cafeteria with students and me.","숭실대 학생식당에서 학생들, 그리고 저와 함께 라면을 먹는 젠슨 황."]],
 x:"<ul><li><b>Recommendation</b>(추천): 유튜브 뮤직이 들은 노래로 다음 곡 추천, \"함께 본 상품\"</li><li><b>Self-driving car</b>(자율주행): 여러 카메라(rearward/medium range camera)로 차선·차량·보행자 인식</li><li><b>Smart health care</b>: 아이폰 충돌 감지(crash detection)가 협곡 추락 사고를 감지해 구조 요청</li><li><b>ChatGPT</b>: 강의 계획 작성, 코드 작성</li><li><b>Image generation</b>: 젠슨 황 학식 사진은 AI가 만든 가짜 사진</li></ul>"},
{s:"1-1",im:["1-1-32","1-1-33","1-1-34"],en:"AI in Our Life – Negative side",ko:"우리 삶 속의 AI – 부정적인 면",key:1,
 o:[["Image generation · Deep fake (Driving Video → Head-Swapping Results)","이미지 생성 · 딥페이크 (구동 영상 → 머리 바꾸기 결과)"],["Deskilling: The tool does it for you → You practice less → Your skill fades → You rely on it more","탈숙련화: 도구가 대신 해 준다 → 연습이 줄어든다 → 기술이 녹슨다 → 더 의존한다"],["When the tool is wrong — or gone — no one can catch it. The skill that would have caught the error is the one that decayed.","도구가 틀리거나 사라지면 아무도 잡지 못한다. 오류를 잡았어야 할 기술이 바로 녹슨 기술이다."]],
 x:"같은 젠슨 황 사진이 31쪽에선 \"신기한 기술\", 32쪽에선 \"위험\"으로 쓰였다는 게 포인트입니다(가짜 뉴스). <b>Deep fake</b>(딥페이크)는 한 사람의 움직임에 다른 사람의 얼굴을 입히는 기술. <b>Deskilling loop</b>(탈숙련화 루프)의 화살표 문구: so you stop doing it → practice is what keeps (the skill) → you can't judge its output → you hand over more.",
 e:"내비게이션만 쓰면 길을 외우지 못하고, 폰이 꺼지면 동네에서도 길을 잃는다."},
{s:"1-1",im:["1-1-35","1-1-36","1-1-37"],en:"Cutting-edge AI: Robots in the Physical World",ko:"최첨단 AI: 물리 세계의 로봇",
 o:[["Hospital robots delivering medication through busy pathway","붐비는 통로를 지나 약을 배달하는 병원 로봇"],["Warehouse robots that bring the shelf to the human picker","선반을 사람 작업자에게 가져다주는 창고 로봇"],["Legged robots over rough terrain · Camera drones tracking a runner · Self-driving taxis and the incidents that follow them","험지의 다리 로봇 · 달리는 사람을 따라가는 드론 · 실제 도시의 자율주행 택시와 뒤따르는 사고들"]],
 x:"화면 속 AI(챗봇)와 달리 <b>몸을 가진(embodied)</b> AI입니다. 드론이 나무를 피하며 사람을 추적하려면 실시간으로 지각(perceive) → 판단(decide) → 행동(act)을 반복해야 합니다. \"the incidents that follow them\"은 현실 세계가 예측 불가능해 아직 실수가 많다는 뜻(1-2의 45쪽과 연결)."},
{s:"1-1",im:["1-1-38"],en:"Summary",ko:"요약",key:1,
 o:[["AI has no single agreed definition — four classical framings: think or act, humanly or rationally. This course takes the fourth: acting rationally.","AI에는 합의된 하나의 정의가 없다 — 네 가지 관점: 생각/행동 × 인간처럼/합리적으로. 이 수업은 네 번째, 합리적으로 행동하기."],["The line between intelligent and not is not a clean one. A thermostat senses and responds. So does a humanoid robot.","지능적인 것과 아닌 것의 경계는 깔끔하지 않다. 온도조절기도 감지하고 반응한다. 휴머노이드 로봇도 그렇다."],["AI already runs through daily life, mostly where you do not notice it.","AI는 이미 일상 곳곳에 있다. 대부분 눈치채지 못하는 곳에."]],
 x:"이 세 줄이 1-1 전체입니다. 시험 대비: 네 관점 2×2 표를 그리고 acting rationally를 택한 이유를 쓸 수 있어야 합니다."},
{s:"1-1",im:["1-1-39"],en:"Next Lecture: History of AI",ko:"다음 강의: AI의 역사",
 o:[["The brain as the original blueprint","원래의 설계도로서의 뇌"],["Hallucination and why it is not only a machine problem","환각, 그리고 그것이 기계만의 문제가 아닌 이유"],["Seventy years of history, including two winters","두 번의 겨울을 포함한 70년의 역사"],["Weak AI and strong AI: the question behind all of it","약한 AI와 강한 AI: 모든 것 뒤에 있는 질문"]],

{s:"1-2",im:["1-2-42","1-2-44"],en:"Recap: What Can AI Do?",ko:"복습: AI는 무엇을 할 수 있나?",key:1,
 o:[["Quiz: which of the following can be done at present?","퀴즈: 다음 중 현재 가능한 것은?"],["✗ items → Generalized physical action required","✗ 항목들의 공통점 → 일반화된 물리적 행동이 필요함"]],
 x:"<div class='tw'><table><tr><th>Task</th><th></th></tr><tr><td>Win against any human at chess / the best humans at Go</td><td class='y'>✓</td></tr><tr><td>Play a decent game of table tennis · Drive safely along the highway</td><td class='y'>✓</td></tr><tr><td>Buy a week's groceries on the web · Discover and prove a new theorem</td><td class='y'>✓</td></tr><tr><td>Translate spoken Chinese into spoken English in real time · Win an art competition · Write an intentionally funny story</td><td class='y'>✓</td></tr><tr><td>Drive safely along unknown city streets</td><td>△</td></tr><tr><td>Unload any dishwasher in any home · Groceries in a physical store · Complex surgery · Construct a building</td><td class='n'>✗</td></tr></table></div>규칙이 정해진 게임과 디지털 세계의 일은 이미 잘하지만, 현실에서 몸을 써야 하고 상황이 매번 다른 일은 아직 어렵습니다. (보충: <b>Moravec's paradox</b>, 모라벡의 역설 — 어려운 일은 컴퓨터에 쉽고 쉬운 일은 어렵다)"},
{s:"1-2",im:["1-2-45"],en:"Recap: Drive safely along unknown city streets △",ko:"처음 가는 도시 도로 운전 △",
 o:[["SBS News: 'Self-driving' taxis, 100+ at once… 'like a horror movie'","SBS 뉴스: '자율주행' 택시 100여 대가 동시에.. '공포영화인 줄'"]],
 x:"대부분 잘 달리지만 예상 못 한 상황(시스템 장애, 공사 구간)에서 한꺼번에 무너질 수 있다는 게 △의 이유입니다. 2026년 3월 우한에서 바이두 로보택시(Apollo Go) 100여 대가 동시에 멈춘 사건."},
{s:"1-2",im:["1-2-46"],en:"Today",ko:"오늘 다룰 내용",
 o:[["What did we copy from the brain? — 86 billion neurons, and the four parts that became a network","뇌에서 무엇을 베꼈나? — 860억 뉴런, 그리고 네트워크가 된 네 가지 부품"],["Where does human cognition still lead? — Five abilities, and what each one is called on the AI side","인간 인지는 어디서 아직 앞서나? — 다섯 능력과 AI 쪽 이름"],["How did seventy years get us here? — Two booms, two winters, and why this one stuck","70년은 어떻게 여기까지 왔나? — 두 번의 호황, 두 번의 겨울, 이번엔 왜 살아남았나"],["Weak AI or strong AI — and can we even tell which we built?","약한 AI냐 강한 AI냐 — 우리가 어느 쪽을 만들었는지 구분할 수 있나?"]],
 x:"1-2 강의의 네 질문입니다."},
{s:"1-2",im:["1-2-47"],en:"The Brain",ko:"뇌",
 o:[["The Blueprint for AI: Human ambition to build intelligent machines.","AI의 설계도: 지능적인 기계를 만들고 싶은 인간의 야망."],["The brain: an enormous network of neurons, elaborately connected.","뇌: 정교하게 연결된 거대한 뉴런 네트워크."],["Mechanism: Electrical & chemical signaling between cells.","작동 방식: 세포 사이의 전기적·화학적 신호 전달."],["Q: If AI imitates human intelligence, can AI research help us understand the brain?","Q: AI가 인간 지능을 흉내 낸다면, AI 연구가 뇌를 이해하는 데 도움이 될까?"]],
 x:"비행기를 만들 때 새를 관찰했듯, 지능을 만들 때 뇌를 관찰했습니다. 질문의 답은 51쪽: \"Yes — a model is easier to open up than a brain.\""},
{s:"1-2",im:["1-2-48"],en:"The Brain Is a Neural Network",ko:"뇌는 신경망이다",key:1,
 o:[["Current estimates put the adult human brain near 86 billion neurons (about 100 trillion synapses).","성인 뇌는 약 860억 개 뉴런(시냅스 약 100조 개)으로 추정된다."],["Kimi K3 (Moonshot AI, 2026.07) has 2.8 trillion weights (about 1/36 size of human brain synapses).","Kimi K3는 2.8조 가중치 — 인간 뇌 시냅스의 약 1/36."],["Neuron: the fundamental processing unit of the brain. Dendrites: the 'input' antennas · Axon: the 'output' cable · Synapse: the connection point","뉴런: 뇌의 기본 처리 단위. 수상돌기: 입력 안테나 · 축삭: 출력 케이블 · 시냅스: 정보를 주고받는 연결 지점"]],
 x:"오른쪽 그림은 <b>artificial neuron</b>(인공 뉴런) 하나:<div class='formula'>output = max{0, A × Age + B × Weight}</div>입력(Age, Weight)에 가중치(weights) A, B를 곱해 더한 뒤 음수면 0 — 이 \"음수면 0\" 규칙이 <b>ReLU</b>입니다. 주의: 그림 속 \"Weight\"는 몸무게(입력값)이고, 신경망의 <b>weight(가중치)</b>는 A, B입니다.",
 e:"A=0.5, B=0.2, Age=20, Weight=60 → 10 + 12 = 22. A=−1, B=0.1 → −20 + 6 = −14 → 0."},
{s:"1-2",im:["1-2-49"],en:"Artificial Neural Network",ko:"인공신경망",key:1,
 o:[["Mapping Neuron to Artificial Neural Network (ANN) Architecture","뉴런을 인공신경망(ANN) 구조에 대응시키기"],["Neuron → Node · Dendrites → Inputs · Axon → Outputs · Synapse → Weights","뉴런 → 노드 · 수상돌기 → 입력 · 축삭 → 출력 · 시냅스 → 가중치"],["Deep neural network = Neural network with many layers of neurons","심층 신경망(DNN) = 뉴런 층(layer)이 여러 개인 신경망"]],
 x:"시냅스 연결이 강하면 신호가 잘 전달되듯, <b>weight</b>가 크면 그 입력이 결과에 큰 영향을 줍니다. 노드를 여러 <b>layer</b>(층)로 쌓으면 DNN, 즉 \"deep learning\"의 \"deep\"입니다."},
{s:"1-2",im:["1-2-50"],en:"Human Intelligence vs. AI",ko:"인간 지능 vs AI",key:1,
 o:[["Where human cognition still leads – [the current AI task]","인간 인지가 아직 앞서는 곳 – [현재 AI의 과제]"]],
 x:"<div class='tw'><table><tr><th>Human ability</th><th>뜻</th><th>AI side</th></tr><tr><td>Imagination 상상력</td><td>opening out beyond what is given</td><td>World model (Genie 3)</td></tr><tr><td>Intuition 직관</td><td>knowing at a glance</td><td>Zero-shot inference</td></tr><tr><td>Comprehension 이해력</td><td>classifying and interpreting sense</td><td>Semantic understanding</td></tr><tr><td>Spatial ability 공간 능력</td><td>perceiving objects in space</td><td>Depth estimation</td></tr><tr><td>Association 연상</td><td>reconstructing the whole from a fragment</td><td>Inpainting</td></tr></table></div>",
 e:"Zero-shot: 얼룩말을 본 적 없어도 \"줄무늬 있는 말\"이라는 설명만으로 알아봄. Inpainting: 사진 속 사람을 지우고 뒤 배경을 채움."},
{s:"1-2",im:["1-2-51"],en:"Human Intelligence and AI",ko:"인간 지능과 AI",
 o:[["Q: If AI imitates human intelligence, can AI research help us understand the brain?","Q: AI 연구가 뇌를 이해하는 데 도움이 될까?"],["Yes. – a model is easier to open up than a brain. CASE IN POINT: Hallucination","예 — 모델은 뇌보다 열어 보기 쉽다. 대표 사례: 환각"]],
 x:"살아 있는 뇌는 뉴런 하나하나를 관찰하기 어렵지만, AI 모델은 모든 숫자(weights)를 들여다볼 수 있습니다. 그래서 AI에서 발견한 현상이 \"사람 뇌도 이런가?\"라는 힌트가 됩니다."},
{s:"1-2",im:["1-2-52"],en:"Hallucination — Reasons in LLMs",ko:"환각 — LLM이 환각을 일으키는 이유",key:1,
 o:[["Hallucination: A fluent, confident answer that is plausible but not true, produced with no sense that anything is missing.","환각: 그럴듯하지만 사실이 아닌, 유창하고 자신감 있는 답. 무언가 빠졌다는 감각 없이 만들어진다."],["1. Plausibility is the objective: trained to predict the next word people would write, not to check whether it happened.","1. 그럴듯함이 목표: 다음에 쓸 법한 단어를 예측하도록 훈련됐지, 실제로 있었는지 확인하도록 훈련되지 않았다."],["2. Blank is not an option: no separate signal for \"I don't know,\" so a gap gets filled with whatever usually goes there.","2. 빈칸은 선택지가 아니다: \"모르겠다\" 신호가 없어 빈틈이 그럴듯한 내용으로 채워진다."],["3. The form survives; the fact doesn't: a wrong citation has the right authors, journal and year — but the paper does not exist.","3. 형식은 살아남고 사실은 사라진다: 틀린 인용도 저자·학술지·연도는 그럴듯하다."]],
 x:"오른쪽 캡처: \"Please summary the last weekly meeting\"이라는 요청에 회의 자료가 없는데도 Jihoon, Minseo라는 인물과 진행 상황(\"80% complete\")을 지어낸 요약입니다.",
 e:"책을 안 읽은 학생이 제목과 표지만 보고 그럴듯한 독후감을 쓰는 것과 같다."},
{s:"1-2",im:["1-2-53"],en:"Hallucination — AI vs Human brain",ko:"환각 — AI와 인간 뇌 비교",key:1,
 o:[["Hallucination is not a defect unique to machines. It is what any system does when it must answer from incomplete evidence and cannot tell the evidence is missing.","환각은 기계만의 결함이 아니다. 불완전한 증거로 답해야 하면서 증거가 빠졌다는 걸 알 수 없는 모든 시스템이 하는 일이다."]],
 x:"<div class='tw'><table><tr><th>AI</th><th>Human brain</th></tr><tr><td><b>Fills gaps in training data</b> with the continuation that best fits the pattern</td><td><b>Fills in the blind spot</b> (association): 망막에 실제 구멍이 있지만 주변 패턴을 보고 알아채지 못함</td></tr><tr><td><b>Reports it with full confidence</b>: 불확실성 표시 없음</td><td><b>Confabulates a memory</b>(작화): 분리뇌(split-brain) 환자의 자세하지만 거짓인 진술 — not lying</td></tr><tr><td><b>Predicts, then is corrected</b> by grounding, retrieval, human feedback</td><td><b>Predicts, then is corrected</b>: perception is a guess the senses keep updating</td></tr></table></div>",
 e:"오른쪽 위 ●와 + 그림: 오른쪽 눈을 감고 +를 보며 거리를 조절하면 ●가 사라진다 — 뇌가 빈 곳을 주변 패턴으로 채운 것."},
{s:"1-2",im:["1-2-54"],en:"History of AI — Beginnings and 1st Neural Winter",ko:"AI의 역사 ① 시작과 첫 번째 신경망 겨울",key:1,
 o:[["1943 Electronic Brain by McCulloch & Pitts — First mathematical model of a neuron.","1943 맥컬럭 & 피츠 — 뉴런의 최초 수학 모델"],["1950 Turing Test by Alan Turing · 1952 Checkers Program by Arthur Samuel","1950 튜링 테스트 · 1952 아서 새뮤얼의 체커 프로그램"],["1957 Perceptron by Frank Rosenblatt — Weights automatically learned. · 1960 ADALINE by Widrow & Hoff — The first cost function.","1957 퍼셉트론 — 가중치 자동 학습 · 1960 ADALINE — 최초의 비용 함수"],["1969 XOR Problem by Minsky & Papert — Perceptron cannot learn XOR.","1969 XOR 문제 — 퍼셉트론은 XOR을 학습할 수 없다"]],
 x:"1943 모델: 입력의 합이 기준값 θ 이상이면 1, 아니면 −1. Samuel의 체커는 스스로 게임하며 실력이 늘었고 \"machine learning\"이라는 말이 여기서 유래했습니다. <b>XOR</b>은 둘 중 하나만 참일 때 참 — 네 점이 대각선으로 엇갈려 <b>직선 하나로 나눌 수 없어(not linearly separable)</b> 단층 퍼셉트론이 풀지 못했고, 연구 자금이 끊기며 <b>1st neural winter</b>가 왔습니다. 오른쪽 포스터는 튜링의 전기 영화 〈이미테이션 게임〉."},
{s:"1-2",im:["1-2-55"],en:"History of AI — 2nd Boom and 2nd Neural Winter",ko:"AI의 역사 ② 두 번째 호황과 두 번째 겨울",
 o:[["1986 Backpropagation in MLP by Rumelhart, Hinton, Williams — popularized.","1986 다층 퍼셉트론의 역전파 대중화"],["AI Winter (1987–1993): Funding collapsed.","AI 겨울(1987–1993): 연구 자금 붕괴"],["1989 LeNet (CNN, handwriting) · 1992 TD-Gammon (reinforcement learning) · 1995 SVM, MNIST","1989 LeNet(CNN 손글씨) · 1992 TD-Gammon(강화학습) · 1995 SVM, MNIST"],["1996 DeepBlue beats Kasparov · 1997 LSTM (vanishing gradients) · 2006 Deep learning is possible · 2009 ImageNet — Big Data!!!","1996 딥블루 · 1997 LSTM(기울기 소실 해결) · 2006 딥러닝 가능 · 2009 ImageNet — 빅데이터"]],
 x:"<b>Backpropagation</b>(역전파): 최종 결과가 얼마나 틀렸는지를 뒤쪽 층에서 앞쪽 층으로 거슬러 전달하며 각 가중치를 얼마나 바꿀지 계산 → 다층망 학습 → XOR 해결. <b>SVM</b>은 신경망이 아닌 강력한 방법으로 한동안 신경망을 밀어냈고, <b>MNIST</b>는 손글씨 숫자 데이터셋(입문 실습의 Hello World)."},
{s:"1-2",im:["1-2-56"],en:"History of AI — GPU era",ko:"AI의 역사 ③ GPU 시대",
 o:[["GPU!! · 2012 AlexNet by Krizhevsky & Hinton — First significant results in deep learning.","GPU!! · 2012 AlexNet — 딥러닝의 첫 번째 큰 성과"],["2013 Word2Vec — Word embeddings become popular · 2014 GAN by Ian Goodfellow","2013 Word2Vec — 단어 임베딩 · 2014 GAN"],["2016 AlphaGo vs Lee Sedol · 2017 Transformer by Google · 2018 BERT · 2019 AlphaStar (Grandmaster level in StarCraft II)","2016 알파고 vs 이세돌 · 2017 트랜스포머 · 2018 BERT · 2019 알파스타"]],
 x:"게임용 그래픽카드(<b>GPU</b>)가 수많은 곱셈을 동시에 하는 신경망 계산에 딱 맞았습니다. <b>Transformer</b>(\"Attention Is All You Need\")는 오늘날 ChatGPT, Claude 등 거의 모든 LLM의 기반 구조입니다.",
 e:"Word2Vec: king − man + woman ≈ queen. GAN: 위조지폐범(generator)과 경찰(discriminator)의 경쟁."},
{s:"1-2",im:["1-2-57"],en:"History of AI — Era of LLMs & Generative AI",ko:"AI의 역사 ④ LLM과 생성형 AI의 시대",
 o:[["2020 GPT-3 — Few-shot learning in LLMs · 2021 DALL-E — Text-to-Image generation becomes highly realistic","2020 GPT-3 — 퓨샷 학습 · 2021 DALL-E — 사실적인 텍스트→이미지"],["2022 Stable Diffusion — Open-source diffusion models democratize generation · 2023 GPT-4 — Multi-modal reasoning and advanced coding","2022 Stable Diffusion — 오픈소스 확산 모델 · 2023 GPT-4 — 멀티모달 추론"],["2024 Gemini — End-to-end multi-modal · 2024 Sora — Video generation · 2025 Veo — Cinematic video with precise control","2024 Gemini · 2024 Sora · 2025 Veo"]],
 x:"<b>Few-shot</b>: \"사과→apple, 바나나→banana, 포도→?\"처럼 예시 몇 개만으로 추가 학습 없이 답하는 능력. <b>Multi-modal</b>: 글·이미지·소리를 함께 다루는 능력."},
{s:"1-2",im:["1-2-58"],en:"Weak AI vs Strong AI",ko:"약한 AI vs 강한 AI",key:1,
 o:[["Philosopher John Searle, 1980","철학자 존 설, 1980"],["Weak AI: machine acts as if it were intelligent — A claim about behavior, solved by watching what the machine does.","약한 AI: 기계가 마치 지능이 있는 것처럼 행동한다 — 행동에 관한 주장, 기계가 하는 일을 관찰하면 판정된다."],["Strong AI: machine actually thinks, and is conscious in doing so — A claim about consciousness. No behavior can solve it.","강한 AI: 기계가 실제로 생각하고 의식이 있다 — 의식에 관한 주장, 어떤 행동으로도 판정할 수 없다."],["Today \"strong AI\" usually means human-level or general AI, solving a wide variety of tasks, including novel (unseen) ones, as well as a human.","오늘날 \"강한 AI\"는 보통 인간 수준/범용 AI — 처음 보는 과제를 포함해 다양한 과제를 인간만큼 푸는 AI."]],
 x:"약한 AI의 대표 논의는 <b>Turing test</b>, 강한 AI의 대표 논의는 <b>Chinese Room argument</b>. 오늘날 강한 AI는 흔히 <b>AGI</b>(Artificial General Intelligence)라고 부르고, 바둑만 잘하는 AI는 <b>narrow AI</b>(좁은 AI).",
 e:"앵무새가 \"안녕하세요\"라고 할 때 '인사하는 것처럼 행동한다'는 관찰로 알 수 있지만(weak), '정말 반가운가'는 관찰로 알 수 없다(strong)."},
{s:"1-2",im:["1-2-59","1-2-60","1-2-61"],en:"Weak AI — A claim about behavior (Turing Test)",ko:"약한 AI — 행동에 관한 주장 (튜링 테스트)",key:1,
 o:[["\"Can Machines Think?\" (1950) — Computing Machinery and Intelligence, by A. M. Turing, MIND","\"기계는 생각할 수 있는가?\"(1950) — 튜링, 「계산 기계와 지능」, 『MIND』"],["The Imitation Game a.k.a. Turing Test (1950) — Computer or Human? A: Faker · B: Helper · C: Interrogator","이미테이션 게임, 일명 튜링 테스트 — 컴퓨터일까 사람일까? A: 흉내 내는 쪽(컴퓨터) · B: 돕는 쪽(사람) · C: 질문자"]],
 x:"튜링은 \"생각이 뭐냐\"는 끝없는 논쟁 대신 \"<b>구분할 수 있느냐</b>\"는 시험으로 질문을 바꿨습니다. 질문자(interrogator)가 문자로만 대화해 어느 쪽이 컴퓨터인지 맞히지 못하면 통과. 영화 제목 〈The Imitation Game〉 자체가 튜링 테스트의 원래 이름입니다."},
{s:"1-2",im:["1-2-62","1-2-63"],en:"Strong AI — The 'Chinese Room' Argument",ko:"강한 AI — '중국어 방' 논증",key:1,
 o:[["The 'Chinese Room' Argument, John Searle (1980)","'중국어 방' 논증, 존 설(1980)"],["What if the computer is just a mapping without 'understanding'?","컴퓨터가 '이해' 없이 그저 대응표(mapping)에 불과하다면?"],["We cannot know whether it is consciousness or imitation.","그것이 의식인지 흉내인지 우리는 알 수 없다."]],
 x:"중국어를 전혀 모르는 사람이 방 안에서 두꺼운 규칙책(rulebook)대로 \"이 모양이 들어오면(IN) 저 모양을 내보내라(OUT)\"만 합니다. 밖에서 보면 방이 중국어를 완벽히 하는 것 같지만 사람은 한 글자도 이해하지 못합니다. 설은 \"컴퓨터도 기호만 조작(symbol manipulation)할 뿐 진짜 이해는 없다\"고 주장했습니다."},
{s:"1-2",im:["1-2-64"],en:"Strong AI — The counterargument: Systems Reply",ko:"강한 AI — 반론: 시스템 응답",
 o:[["The counterargument: Systems Reply, Ned Block (1980)","반론: 시스템 응답, 네드 블록(1980)"],["The man in the room doesn't understand Chinese, but the man plus the rulebook plus the room does.","방 안의 사람은 중국어를 이해하지 못하지만, 사람 + 규칙책 + 방 전체는 이해한다."],["Understanding is a property of the whole system, not of any single part inside it.","이해는 시스템 전체의 속성이지, 그 안의 어느 한 부품의 속성이 아니다."],["Same as brain and neurons: no single neuron understands Korean. We do.","뇌와 뉴런도 같다: 어떤 뉴런 하나도 한국어를 이해하지 못한다. 우리는 이해한다."]],
 x:"그림: 뉴런 하나에 \"안녕하세요~\" → \"…\" / 뇌 전체에 \"안녕하세요~\" → \"반갑습니다~\". (보충: 설은 \"방 안 사람이 규칙책을 통째로 외워도 이해하지 못한다\"고 재반박했고, 논쟁은 아직 결론이 나지 않았습니다.)",
 e:"축구팀의 '팀워크'는 선수 한 명이 아니라 팀 전체에 있다."},
{s:"1-2",im:["1-2-65"],en:"Summary",ko:"요약",key:1,
 o:[["The brain was the blueprint — Neuron, dendrite, axon, synapse became node, input, output, weight","뇌가 설계도였다 — 뉴런·수상돌기·축삭·시냅스가 노드·입력·출력·가중치가 되었다"],["Human cognition still leads where the problem is open-ended — Imagination, intuition, comprehension, spatial sense, association","인간 인지는 문제가 열려 있는 곳에서 여전히 앞선다 — 상상력, 직관, 이해력, 공간 감각, 연상"],["Hallucination is what any system does when it must answer from incomplete evidence and cannot tell the evidence is missing — which is why opening up the model tells us something about ourselves","환각은 불완전한 증거로 답해야 하면서 증거가 빠졌다는 걸 모르는 모든 시스템이 하는 일 — 그래서 모델을 열어 보면 우리 자신을 알게 된다"],["Seventy years, two winters — both from expectations outrunning the technology","70년, 두 번의 겨울 — 둘 다 기대가 기술을 앞질렀기 때문"],["Weak AI is a claim about behavior, and watching the machine settles it. Strong AI is a claim about consciousness, and no behavior settles it.","약한 AI는 행동에 관한 주장, 관찰로 판정된다. 강한 AI는 의식에 관한 주장, 어떤 행동으로도 판정되지 않는다."]],
 x:"이번엔 왜 살아남았나? <b>Big data</b>(ImageNet) + <b>GPU</b>(AlexNet) + <b>Transformer</b>가 뒷받침했기 때문입니다."},
/* ================= 2-1 ================= */
{s:"2-1",im:["2-1-01","2-1-02"],en:"Chapter 2 - Part I: Agents, Rationality, and PEAS",ko:"2장 파트 I: 에이전트, 합리성, PEAS",
 o:[["1 What is an agent? · 2 Rationality · 3 PEAS (Performance, Environment, Actuators, Sensors) · 4 Environment types · 5 Agent types","① 에이전트란? ② 합리성 ③ PEAS ④ 환경 유형 ⑤ 에이전트 유형"]],
 x:"2장 전체의 로드맵. 2-1은 ①~③, 2-2는 ④, 2-3은 ⑤를 다룹니다. 앞으로 배울 탐색(search)·게임(games)·강화학습(RL)이 모두 이 장의 용어(vocabulary) 위에서 설명되므로 교과목 전체의 기초 어휘집입니다."},
{s:"2-1",im:["2-1-03"],en:"What Is an Agent?",ko:"에이전트란 무엇인가?",key:1,
 o:[["An agent perceives its environment through sensors and acts upon it through actuators.","에이전트는 센서를 통해 환경을 지각하고, 액추에이터를 통해 환경에 행동한다."],["Control theory: A closed-loop system that senses and corrects to the desired states without human intervention - the thing doing it is called a controller (ex, thermostat)","제어 이론: 사람 개입 없이 상태를 감지하고 원하는 상태로 보정하는 폐루프 시스템 — 이를 하는 것을 제어기라 부른다(예: 온도조절기)"],["Softbot, short for software robot: an agent whose whole world is inside a machine. Its sensors read files and packets; its actuators write them.","소프트봇(소프트웨어 로봇): 세계 전체가 기계 안에 있는 에이전트. 센서는 파일·패킷을 읽고, 액추에이터는 쓴다."]],
 x:"그림: environment → <b>percepts</b>(지각) → <b>sensors</b> → [agent ?] → <b>actuators</b> → <b>actions</b>(행동) → environment. 가운데 <b>?</b> 상자가 이 과목에서 채워 갈 \"무엇을 보고 어떤 행동을 할지 결정하는 두뇌\"입니다. <b>Closed-loop</b>(폐루프)는 행동 결과를 다시 센서로 확인해 다음 행동을 고치는 순환, 결과를 확인하지 않으면 <b>open-loop</b>(개루프).",
 e:"사람: 눈·귀(sensors) → 뇌 → 손·발(actuators). 스팸 필터(softbot): 메일을 읽고(sensor) 스팸함으로 옮김(actuator)."},
{s:"2-1",im:["2-1-04"],en:"A Rational-Agent Perspective",ko:"합리적 에이전트 관점",
 o:[["Should we make machines that… Think like people? Think rationally? Act like people? Act rationally?","우리는 어떤 기계를 만들어야 할까… 사람처럼 생각? 합리적으로 생각? 사람처럼 행동? 합리적으로 행동?"]],
 x:"빨간 원 = <b>Act rationally</b>(합리적으로 행동하기). 이유: (1) 사람은 실수를 많이 하므로 사람을 흉내 내는 게 목표일 필요가 없고, (2) 생각의 과정보다 <b>행동의 결과</b>가 측정·평가하기 쉽다.",
 e:"자율주행차에 원하는 건 \"사람 운전자처럼(졸음운전 포함?)\"이 아니라 \"안전하고 빠르게 도착하기\"."},
{s:"2-1",im:["2-1-05"],en:"Designing Rational Agents",ko:"합리적 에이전트 설계하기",key:1,
 o:[["An agent is an entity that perceives and acts.","에이전트는 지각하고 행동하는 개체다."],["A rational agent selects actions that maximize its (expected) utility.","합리적 에이전트는 자신의 (기대) 효용을 최대화하는 행동을 선택한다."],["Characteristics of the percepts, environment, and action space order techniques for selecting rational actions.","지각·환경·행동 공간의 특성이 합리적 행동을 고르는 기법을 결정한다."]],
 x:"<b>Utility</b>(효용) = \"얼마나 좋은가\"의 점수. 세상이 불확실하니 평균적으로 얼마나 좋을지인 <b>expected utility</b>(기대 효용)를 봅니다. 세 번째 문장: 어떤 알고리즘을 쓸지는 문제의 성격(→ 2-2 환경 유형)이 정합니다.",
 e:"비 올 확률 30%. 우산을 챙기면 −1, 안 챙겼는데 비 오면 −10. 챙김 = −1, 안 챙김 = 0.3×(−10) = −3 → 챙기는 게 합리적."},
{s:"2-1",im:["2-1-06"],en:"Agent Function and Agent Program",ko:"에이전트 함수와 에이전트 프로그램",key:1,
 o:[["The agent function maps percept sequences P* to a set of actions A.  f : P* → A","에이전트 함수는 지각 순열 P*를 행동 집합 A로 대응시킨다.  f : P* → A"],["The agent program is the implementation that produces it.","에이전트 프로그램은 그것을 만들어 내는 구현이다."]],
 x:"<b>P*</b>의 별표(*)는 \"지금까지 받은 모든 지각의 나열(percept sequence)\". <div class='tw'><table><tr><th>Agent function</th><th>Agent program</th></tr><tr><td>추상적·수학적 명세 (표)</td><td>구체적 코드, 실제 하드웨어에서 실행</td></tr><tr><td>지각 순열 전체를 입력</td><td>보통 현재 지각 하나만 입력(과거가 필요하면 스스로 기억)</td></tr></table></div>",
 e:"자판기: \"500원+콜라 버튼 → 콜라\" 대응 전체가 function, 그것을 실행하는 회로·펌웨어가 program."},
{s:"2-1",im:["2-1-07"],en:"Example: The Vacuum World",ko:"예제: 진공청소기 세계",key:1,
 o:[["Sensors: maybe camera (Computer Vision)","센서: 아마도 카메라(컴퓨터 비전)"],["Percepts: [location, status] — {[A, Dirty], [A, Clean], [B, Dirty], [B, Clean]}","지각: [위치, 상태]"],["Four actions are available: {Left, Right, Suck, NoOp}","가능한 행동 4가지: 왼쪽, 오른쪽, 흡입, 아무것도 안 함"],["Problem: This table can become infinitely large!","문제: 이 표는 무한히 커질 수 있다!"]],
 x:"왼쪽 <b>agent function</b> 표는 지각의 나열마다 행동을 적어야 해서 4 + 4² + … 줄로 끝없이 커집니다. 오른쪽 <b>agent program</b>은 <b>most recent percept p</b>(가장 최근 지각)만 보고 3줄로 같은 행동을 냅니다:<div class='formula'>if status = Dirty then return Suck<br>else if location = A then return Right<br>else if location = B then return Left</div>",
 e:"A·B 모두 더러움: [A,Dirty]→Suck, [A,Clean]→Right, [B,Dirty]→Suck, [B,Clean]→Left, … 다 치운 뒤에도 A↔B를 계속 왕복한다는 점을 기억(뒤에서 다시 나옴)."},
{s:"2-1",im:["2-1-08","2-1-09"],en:"Rational Agents: What Is the Right Action?",ko:"합리적 에이전트: 무엇이 올바른 행동인가?",key:1,
 o:[["Whether an agent is rational depends on four things: 1. The performance measure that defines the criterion of success 2. The agent's prior knowledge of the environment 3. The actions that the agent can perform 4. The agent's percept sequence as history","에이전트가 합리적인지는 네 가지에 달려 있다: ① 성공 기준을 정의하는 성능 척도 ② 환경에 대한 사전 지식 ③ 수행할 수 있는 행동 ④ 이력으로서의 지각 순열"],["Change any one of the four, and the right action can change.","넷 중 하나라도 바뀌면 올바른 행동도 바뀔 수 있다."]],
 x:"합리적 행동은 절대적 정답이 아니라 <b>조건부</b>입니다. 그림: 카메라에 스티커(지각 순열이 달라짐) · 컵 속 공 찾기(이력과 사전 지식) · 사람 손 vs 집게(가능한 행동이 다름).",
 e:"시험 공부: ① A+ 목표냐 통과냐(성능 척도) ② \"슬라이드에서만 낸다\"(사전 지식) ③ 도서관에 갈 수 있나(행동) ④ 중간고사 문제를 본 경험(지각 순열)."},
{s:"2-1",im:["2-1-10"],en:"The Definition of a Rational Agent",ko:"합리적 에이전트의 정의",key:1,
 o:[["Definition: For every possible percept sequence (history), a rational agent selects the action expected to maximize its performance measure.","정의: 가능한 모든 지각 순열(이력)에 대해, 합리적 에이전트는 성능 척도를 최대화할 것으로 기대되는 행동을 선택한다."],["Performance measure: the objective criterion for success · scores the sequence of environment states the agent brings about · plays the role of a utility function, or a reward function","성능 척도: 성공의 객관적 기준 · 에이전트가 만든 환경 상태들의 순서를 채점 · 효용/보상 함수의 역할"],["Expectation: the average over all outcomes that could occur, each weighted by how likely it is","기대값: 일어날 수 있는 모든 결과를 각각의 확률로 가중한 평균"],["Rule: among the available actions a, take the one whose expectation is highest","규칙: 가능한 행동 중 기대값이 가장 높은 것을 택한다"]],
 x:"<div class='formula'>a = argmax<sub>a∈A</sub> E(U|a),   E(U|a) = Σ<sub>outcome</sub> U<sub>a</sub> × P</div><b>argmax</b>는 최댓값 자체가 아니라 그 값을 만드는 <b>행동</b>을 돌려줍니다. 주의: 성능 척도는 에이전트의 행동이 아니라 그 행동이 만든 <b>환경 상태</b>를 평가합니다(\"얼마나 열심히 움직였나\" ✗, \"바닥이 얼마나 깨끗해졌나\" ✓).",
 e:"A: 100%로 10골드 → E=10. B: 20%로 100골드 → E=0.2×100=20. argmax → B (꽝이 나와도 선택은 합리적)."},
{s:"2-1",im:["2-1-11"],en:"What Rationality Is Not",ko:"합리성이 아닌 것",key:1,
 o:[["Rationality is an ideal. A standard we design toward, not a description of any real system","합리성은 이상이다. 설계할 때 지향하는 기준이지 실제 시스템의 묘사가 아니다"],["Not omniscience: It cannot know how things will actually turn out — a cargo door falls from a passing aircraft onto you. Were you irrational to cross? No.","전지가 아니다: 실제 결과를 알 수 없다 — 화물칸 문이 떨어져도 길을 건넌 건 비합리적이지 않다."],["Not perfection: Rationality maximizes expected performance; perfection maximizes actual performance","완벽함이 아니다: 합리성은 기대 성능, 완벽함은 실제 성능을 최대화"],["Not passive: It must gather information, learn from what it perceives, and explore what it does not yet know","수동적이지 않다: 정보를 모으고, 배우고, 모르는 것을 탐험해야 한다"],["Not unlimited: Bounded by available memory, computation, and sensors","무제한이 아니다: 메모리·계산·센서에 의해 제한된다"]],
 x:"합리성은 \"결정 당시 알 수 있던 정보로 최선을 다했는가\"를 봅니다. 결과로 결정을 평가하는 실수가 '결과 편향'. (보충: 자원 한계 안의 합리성 = Herbert Simon의 <b>bounded rationality</b>)",
 e:"로또 번호를 모르고 안 산 사람은 비합리적이지 않다(그걸 아는 건 omniscience). 길 건너기 전 좌우를 살피는 것 자체가 합리적 행동(not passive)."},
{s:"2-1",im:["2-1-12","2-1-13"],en:"Example: Is the Vacuum Agent Rational?",ko:"예제: 진공청소기 에이전트는 합리적인가?",
 o:[["Two questions: What should the performance measure be? Given that measure, is this agent rational?","두 질문: 성능 척도는 무엇이어야 하나? 그 척도에서 이 에이전트는 합리적인가?"],["The honest answer to the second is: it depends — on exactly the 4 things from earlier: performance measure, prior knowledge, actions, percept sequence","정직한 답은 '상황에 따라 다르다' — 바로 앞의 4가지에 따라"]],
 x:"\"합리적이냐?\"는 조건을 정하지 않으면 답할 수 없습니다. 다음 슬라이드에서 조건을 하나씩 못 박습니다."},
{s:"2-1",im:["2-1-14"],en:"Pin Down the Assumptions",ko:"가정을 못 박아 두기",
 o:[["Performance measure: One point per clean square, per time step, over 1000 steps","성능 척도: 1000 시간 단계 동안, 매 단계 깨끗한 칸 하나당 1점"],["Prior knowledge: The layout is known. Where the dirt is, and where the agent starts, are not","사전 지식: 배치는 알려져 있다. 먼지 위치와 시작 위치는 모른다"],["Four actions: {Left, Right, Suck, NoOp} · Percepts: [location, status]","행동 4개 · 지각 [위치, 상태]"]],
 x:"최고 점수 = 1000단계 × 2칸 = <b>2000점</b>. 점수는 '청소 횟수'가 아니라 '깨끗한 칸 수'라서 빨리 치울수록 높습니다. 암묵적 가정: 치운 칸은 다시 안 더러워짐, 이동·흡입은 항상 성공, 이동 벌점 없음."},
{s:"2-1",im:["2-1-15"],en:"Under Those Assumptions: Yes",ko:"그 가정들 아래에서는: 합리적이다",key:1,
 o:[["This simple agent is rational. No other agent does better, because there is nothing better to do","이 단순한 에이전트는 합리적이다. 더 잘할 수 있는 일이 없으니 더 잘하는 에이전트도 없다"],["Square dirty? Cleaning it is the only way to score. Square clean? The only remaining points are next door","칸이 더럽다? 치우는 게 유일한 득점법. 깨끗하다? 남은 점수는 옆 칸에만"],["A three-line program turns out to be optimal — which should make you suspicious of the assumptions","3줄 프로그램이 최적 — 그렇다면 가정을 의심하라"],["Rationality is a relation between an agent and its environment, not a property the agent has","합리성은 에이전트와 환경 사이의 관계이지, 에이전트가 가진 속성이 아니다"]],
 x:"가정을 바꾸면 판정도 바뀝니다: 이동 벌점(−1)이 있으면 다 치운 뒤 왕복이 손해(NoOp이 낫다 → 기억 필요) · 먼지가 다시 생기면 순찰 필요 · 방 구조를 모르면 <b>exploration</b>(탐험) 필요.",
 e:"우산을 항상 드는 사람: 장마철 서울에선 합리적, 사막 도시에선 비합리적."},
{s:"2-1",im:["2-1-16"],en:"Design the Measure Around the Outcome",ko:"원하는 결과를 중심으로 척도를 설계하라",key:1,
 o:[["Suppose we score the vacuum on dirt collected per shift. A sufficiently good agent will maximize exactly that — clean the floor, throw it back out, clean it again, repeatedly. It is doing what we asked. That is the problem.","근무 시간당 모은 먼지로 채점하면, 똑똑한 에이전트는 바로 그걸 최대화한다 — 치우고, 다시 쏟고, 또 치운다. 요청한 대로 하고 있다. 그것이 문제다."],["The rule: The measure around what you want the world to look like; not how you imagine the agent have to behave.","규칙: 원하는 세상의 모습을 중심으로 척도를 만들어라. 에이전트가 어떻게 행동해야 한다고 상상하는 방식이 아니라."],["Same lesson as last week - the machine optimizes what we wrote down → Hallucination in a LLM","지난주와 같은 교훈 — 기계는 우리가 적은 것을 최적화한다 → LLM 환각"]],
 x:"\"먼지를 많이 빨아들인다\"는 우리가 상상한 행동일 뿐, 진짜 원하는 건 \"깨끗한 바닥\"이라는 <b>outcome</b>(결과). LLM이 '그럴듯함'으로 평가·훈련되면 모를 때도 지어내는 편이 점수가 높아집니다. (보충: Goodhart's law, <b>reward hacking / specification gaming</b>)",
 e:"코브라 효과: 죽은 코브라 1마리당 보상 → 사람들이 코브라를 사육."},
{s:"2-1",im:["2-1-17","2-1-18"],en:"Problem Specification: PEAS",ko:"문제 명세: PEAS",key:1,
 o:[["Rationality depends on four things. That bundle (PEAS) is the Task environment.","합리성은 네 가지에 달려 있다. 그 묶음(PEAS)이 과업 환경이다."],["In designing an agent, the first step must always be to specify the task environment as fully as possible.","에이전트 설계의 첫 단계는 언제나 과업 환경을 가능한 한 완전하게 명세하는 것이다."]],
 x:"<div class='tw'><table><tr><th>P · Performance measure</th><th>E · Environment</th><th>A · Actuators</th><th>S · Sensors</th></tr><tr><td>The criterion of success (성공의 기준)<br>예: 게임 승패, 운전의 안정성과 안전</td><td>Everything outside that the agent deals with (상대하는 바깥 모든 것)<br>예: 체스판, 도로, 날씨, 다른 차량</td><td>The ways of affecting the environment (환경에 영향을 주는 수단)<br>예: 로봇 팔, 핸들, 가속 페달, 브레이크</td><td>The ways of observing it (관찰 수단)<br>예: 카메라, 라이다, 마이크</td></tr></table></div>외우는 팁: P(점수) → E(무대) → A(손발) → S(눈귀)."},
{s:"2-1",im:["2-1-19"],en:"Example: An Automated Taxi Driver",ko:"예제: 자동화된 택시 운전사",key:1,
 o:[["P: Safe, fast, legal, comfortable trip, profitable, easy on other road users · E: Roads and traffic, pedestrians, police, customers, weather · A: Steering, accelerator, brake, signals, horn, display and speech · S: Cameras, radar, lidar, speedometer, GPS, engine sensors, accelerometer, microphone","P: 안전·빠름·합법·쾌적·수익·배려 · E: 도로·교통·보행자·경찰·손님·날씨 · A: 핸들·가속·브레이크·방향지시등·경적·화면과 음성 · S: 카메라·레이더·라이다·속도계·GPS·엔진 센서·가속도계·마이크"],["\"Roads\" covers a farm track and a twelve-lane motorway. Snow in Gangwon. No snow in Busan. Drive on the right here. On the left in Japan.","\"도로\"에는 농로도 12차선 고속도로도 있다. 강원도엔 눈, 부산엔 없음. 한국은 우측, 일본은 좌측 통행."],["Every restriction you can honestly make shrinks the design problem — a taxi for one campus is a different machine from a taxi for one country","정직하게 할 수 있는 제약 하나하나가 설계 문제를 줄인다 — 캠퍼스용 택시와 나라용 택시는 다른 기계"],["Notice the performance measures conflict: fast fights safe, profitable fights comfortable. Stating the conflict is part of the specification.","성능 척도들은 충돌한다: 빠름↔안전, 수익↔쾌적. 충돌을 명시하는 것도 명세의 일부다."]],
 x:"범위를 <b>정직하게</b> 좁힐수록 필요한 센서·기능이 줄어 문제가 쉬워집니다(눈이 오는 곳을 \"눈 없음\"으로 가정하면 사고). 충돌하는 척도는 \"어느 쪽을 얼마나 중시할지\"를 설계자가 <b>trade-off</b>(절충)로 적어 줘야 합니다(예: 합법·안전 > 빠름)."},
{s:"2-1",im:["2-1-20"],en:"PEAS for Other Agent Types",ko:"다른 에이전트 유형들의 PEAS",fill:"peas",
 o:[["Medical diagnosis: Patient health, cost / Patient, hospital, staff / Questions, tests, treatments / Symptom and finding entry","의료 진단: 환자 건강·비용 / 환자·병원·직원 / 질문·검사·치료 / 증상·소견 입력"],["Satellite image analysis: Correct categorization / Satellite, downlink, weather / Category display / High-resolution camera","위성 영상 분석: 올바른 분류 / 위성·다운링크·날씨 / 분류 표시 / 고해상도 카메라"],["Part-picking robot: Parts in the right bin / Conveyor belt, bins / Jointed arm and hand / Camera, joint angle, touch","부품 집기 로봇: 올바른 통에 / 컨베이어·통 / 관절 팔과 손 / 카메라·관절 각도·촉각"],["English tutor: Student's later test score / Students, testing agency / Exercises, feedback, speech / Keyboard, voice","영어 튜터: 학생의 나중 시험 점수 / 학생·시험 기관 / 연습 문제·피드백·음성 / 키보드·음성"]],
 x:"소프트웨어 에이전트도 PEAS가 있습니다(진단 에이전트의 actuator는 질문·검사 지시). 영어 튜터의 P가 \"오늘 정답률\"이 아니라 \"<b>later</b> test score\"인 이유: 오늘 정답률로 채점하면 쉬운 문제만 내서 점수를 부풀릴 수 있음(16쪽의 교훈)."},
{s:"2-1",im:["2-1-21"],en:"Let's specify a task environment of a rational agent",ko:"합리적 에이전트의 과업 환경을 명세해 보자 (실습)",
 o:[["Write the PEAS description for one of these: a robot vacuum in a real apartment · a system that recommends what to watch next · a drone that inspects bridges for cracks · an agent that plays a game you know well","다음 중 하나의 PEAS를 작성하라: 실제 아파트의 로봇 청소기 · 다음에 볼 것 추천 시스템 · 다리 균열 점검 드론 · 잘 아는 게임을 하는 에이전트"],["Four columns. Be specific - \"the internet\" is not an environment","네 칸. 구체적으로 — '인터넷'은 환경이 아니다"],["The hardest column is almost always P. Try to make it gameable, then fix it.","가장 어려운 칸은 거의 항상 P. 일부러 게이밍 가능하게 만든 다음 고쳐라."]],
 x:"연습 방법: ① 허점 있는 P → ② 어떻게 악용되나 → ③ 고친 P.",
 e:"로봇 청소기: 허점 P \"주행 거리가 길수록 좋다\" → 같은 방을 빙글빙글 → 고친 P \"청소 후 남은 먼지 적을수록 + 시간 짧을수록 + 충돌 감점\"."},

/* ================= 2-2 ================= */
{s:"2-2",im:["2-2-01","2-2-02"],en:"Chapter 2 - Part II: Environment and Agent types",ko:"2장 파트 II: 환경과 에이전트 유형",
 o:[["4 Environment types","④ 환경 유형"]],
 x:"환경을 분류하는 7가지 기준: observability(관찰 가능성), agents(에이전트 수), determinism(결정성), episodicity(에피소드성), static/dynamic(정적/동적), discrete/continuous(이산/연속), known/unknown(알려짐/모름)."},
{s:"2-2",im:["2-2-03"],en:"What Counts as the Environment?",ko:"무엇이 환경에 해당하는가?",key:1,
 o:[["The environment is everything except the agent function","환경은 에이전트 함수를 제외한 모든 것이다"],["This leads somewhere strange: the sensors and actuators are part of the environment too.. Ex: 1080p vs 720p, high-torque actuator..","이상한 결론: 센서와 액추에이터도 환경의 일부다. 예: 1080p vs 720p, 고토크 액추에이터"],["The agent function is only the mapping from percepts to actions. The camera that produces the percept is on the outside of that line","에이전트 함수는 지각→행동 대응일 뿐이다. 지각을 만드는 카메라는 그 경계 바깥에 있다"]],
 x:"에이전트를 순수한 결정 규칙(두뇌 소프트웨어)으로 보면, 카메라·모터 같은 하드웨어는 두뇌가 바꿀 수 없는 \"주어진 조건\", 즉 환경입니다.",
 e:"게이머의 실력(agent function)은 같아도 입력 지연이 큰 패드·저화질 모니터면 성적이 떨어진다."},
{s:"2-2",im:["2-2-04"],en:"Environment Types: Fully or Partially Observable",ko:"완전 관찰 가능 vs 부분 관찰 가능",key:1,
 o:[["Fully observable - the sensors deliver everything relevant to the decision, at every step","완전 관찰 가능 — 센서가 결정에 관련된 모든 것을 매 단계 전달한다"],["Partially observable - something relevant is hidden: noisy or inaccurate sensors, or state that simply is not sensed","부분 관찰 가능 — 관련된 무언가가 숨겨져 있다: 잡음/부정확한 센서, 또는 아예 감지되지 않는 상태"]],
 x:"핵심은 \"세상 전부\"가 아니라 <b>\"결정에 관련된 것(relevant to the decision)\"</b>이 다 보이느냐. 체스판 = fully, 자율주행 도로 = partially. 부분 관찰 가능하면 에이전트는 <b>memory</b>(기억)가 필요합니다(→ 모델 기반 에이전트).",
 e:"Fully: 오목, 스도쿠, 체스. Partially: 포커(상대 카드), 게임의 '전장의 안개'."},
{s:"2-2",im:["2-2-05"],en:"Environment Types: Single-Agent or Multiagent",ko:"단일 에이전트 vs 다중 에이전트",key:1,
 o:[["The test: is there another entity whose success depends on what you do?","판별법: 당신이 하는 행동에 따라 성공이 달라지는 다른 개체가 있는가?"],["Careful with the test - a falling rock is not an agent. It is only an agent if modelling it as maximizing something is the useful thing to do","조심 — 떨어지는 바위는 에이전트가 아니다. '무언가를 최대화하는 존재'로 모델링하는 게 유용할 때만 에이전트다"]],
 x:"스도쿠 = single-agent, 체스 = multiagent. 도로의 다른 운전자는 \"빨리·안전하게 가려는\" 목적이 있다고 보고 예측해야 하므로 에이전트입니다.",
 e:"로봇 청소기가 강아지를 피해야 한다면? 강아지를 '간식을 원하는 존재'로 모델링하면 예측이 잘 되므로 에이전트로 볼 수도 있다."},
{s:"2-2",im:["2-2-06"],en:"Environment Types: Competitive and Cooperative",ko:"경쟁적 vs 협력적",key:1,
 o:[["Multiagent settings come in two flavors, and usually both at once","다중 에이전트 환경은 두 가지 맛이 있고 보통 둘이 동시에 있다"],["Competitive — Chess: your opponent's performance measure is the opposite of yours","경쟁적 — 체스: 상대의 성능 척도는 당신의 것과 정반대"],["Cooperative — Taxi-driving: avoiding collisions maximizes the performance measure of all agents","협력적 — 택시 운전: 충돌 회피는 모든 에이전트의 성능 척도를 최대화"],["Driving is partly both — only one car fits the parking space: as fast as possible, avoiding collision","운전은 일부는 둘 다 — 주차 공간에 한 대만: 최대한 빨리, 그러나 충돌은 피하면서"],["Multiagent settings make two odd things rational: communicating, and behaving unpredictably - Poker","다중 에이전트는 이상한 두 가지를 합리적으로 만든다: 의사소통, 그리고 예측 불가능하게 행동하기 — 포커"]],
 x:"혼자일 땐 무작위로 행동할 이유가 없지만, 상대가 있으면 행동이 읽히는 것 자체가 약점입니다 → 포커의 <b>bluffing</b>. 협력 상황에서는 의사소통(방향지시등, 경적)이 합리적. (보충: mixed strategy, Nash equilibrium)",
 e:"가위바위보: 항상 바위만 내면 진다 → 1/3씩 무작위가 가장 안전."},
{s:"2-2",im:["2-2-07"],en:"Environment Types: Deterministic, Nondeterministic, Stochastic",ko:"결정적, 비결정적, 확률적",key:1,
 o:[["Deterministic - the next state of the environment is completely determined by the current state and the action executed by the agent(s).","결정적 — 다음 상태가 현재 상태와 실행된 행동으로 완전히 결정된다."],["Nondeterministic - several outcomes are possible, and we do not put numbers on them. Ex) \"It might rain\"","비결정적 — 여러 결과가 가능하고, 숫자(확률)를 붙이지 않는다. 예) \"비가 올지도\""],["Stochastic - the model attaches probabilities. Ex) \"A 25% chance of rain\"","확률적 — 모델이 확률을 붙인다. 예) \"비 올 확률 25%\""],["One caution: If the environment is partially observable, then it could appear to be nondeterministic. The world is not rolling dice - you just cannot see the whole board","주의: 부분 관찰 가능하면 비결정적처럼 보일 수 있다. 세상이 주사위를 굴리는 게 아니라 판 전체를 못 볼 뿐"]],
 x:"Nondeterministic vs stochastic의 차이 = \"가능성 목록만 있나, <b>확률 숫자</b>까지 있나\". 확률이 있으면 expected utility 계산이 가능. 마지막 caution이 시험에 나오기 좋은 포인트.",
 e:"Deterministic: 체스 나이트 이동. Stochastic: 주사위(백개먼), '명중률 70%' 스킬. 카드 섞기는 물리적으로 정해진 과정이지만 볼 수 없어 무작위로 보인다."},
{s:"2-2",im:["2-2-08"],en:"Environment Types: Episodic or Sequential",ko:"에피소드적 vs 순차적",key:1,
 o:[["Episodic - experience comes in independent pieces. Perceive, act, done. The next episode does not care what you did. Ex) Figuring broken parts on a production line","에피소드적 — 경험이 독립된 조각들로 온다. 지각, 행동, 끝. 다음 에피소드는 당신이 한 일에 신경 쓰지 않는다. 예) 생산 라인 불량 부품 가려내기"],["Sequential - this decision shapes every decision after it. Ex) Chess. Driving. Almost everything interesting","순차적 — 이번 결정이 이후 모든 결정을 형성한다. 예) 체스, 운전, 흥미로운 거의 모든 것"]],
 x:"Episodic은 앞을 내다볼 필요가 없어 쉽고, sequential은 \"지금의 선택이 나중에 어떤 결과를 낳을지\" <b>계획(planning)</b>해야 해서 어렵습니다.",
 e:"Episodic: 사진 한 장 고양이/개 분류, 스팸 한 통 판별. Sequential: 수강 신청(선수과목), RPG 스킬 트리."},
{s:"2-2",im:["2-2-09"],en:"Environment Types: Static, Dynamic, Semidynamic",ko:"정적, 동적, 준동적",key:1,
 o:[["Static - the world waits while the agent thinks. Ex) A crossword puzzle does not move, thinking (waiting) is free.","정적 — 에이전트가 생각하는 동안 세상이 기다린다. 예) 십자말풀이 — 생각은 공짜"],["Dynamic - the world changes during consideration. Ex) Driving. And note: not deciding (waiting) is itself a decision.","동적 — 고민하는 동안 세상이 변한다. 예) 운전. 결정하지 않는 것도 그 자체로 결정이다."],["Semidynamic - the world holds still, but your score does not. Chess with a clock","준동적 — 세상은 가만히 있지만 점수는 그렇지 않다. 시간 제한 체스"],["Dynamic environments punish slow reasoning, which constrains which algorithms you can use at all.","동적 환경은 느린 추론을 처벌하며, 쓸 수 있는 알고리즘 자체를 제약한다."]],
 x:"교차로에서 3초 고민하는 동안 차는 움직이고 신호는 바뀝니다. 그래서 dynamic 환경에서는 정확하지만 느린 알고리즘 대신 빠르고 충분히 좋은 방법이 필요.",
 e:"Static: 집에서 수학 문제. Semidynamic: 시험장(문제는 그대로, 시간은 흐름). Dynamic: 운전, 스타크래프트, 탁구."},
{s:"2-2",im:["2-2-10"],en:"Environment Types: Discrete or Continuous",ko:"이산 vs 연속",key:1,
 o:[["This applies to three things at once: state, time, and percepts/actions","이 구분은 상태, 시간, 지각/행동 세 가지에 동시에 적용된다"],["Chess/Go: finitely many states, distinct moves, discrete throughout","체스/바둑: 유한한 상태, 구별되는 수, 처음부터 끝까지 이산"],["Driving: position and speed sweep smoothly, steering angle is continuous, time does not tick","운전: 위치·속도는 매끄럽게 변하고, 핸들 각도는 연속적이며, 시간은 똑딱 끊어지지 않는다"]],
 x:"<b>Discrete</b>(이산) = 계단처럼 셀 수 있음 → 경우를 나열·탐색 가능. <b>Continuous</b>(연속) = 경사로처럼 끊김 없음 → 미적분·최적화 같은 다른 도구 필요. 컴퓨터는 연속 세계를 잘게 쪼개 이산으로 근사(discretize)하기도 합니다."},
{s:"2-2",im:["2-2-11"],en:"Environment Types: Known or Unknown",ko:"알려짐 vs 모름",key:1,
 o:[["This one is not a property of the environment at all. It is about the agent's or designer's knowledge of the rules","이것은 환경의 속성이 전혀 아니다. 에이전트나 설계자가 규칙을 얼마나 아는가에 관한 것이다"],["The performance measure itself can be unknown. Ex) A taxi does not know whether this passenger wants speed or calm — which quietly turns a single-agent problem into something closer to multiagent","성능 척도 자체도 모를 수 있다. 예) 택시는 승객이 빠름을 원하는지 편안함을 원하는지 모른다 — 단일 에이전트 문제가 조용히 다중 에이전트에 가까워진다"]],
 x:"<b>Observability</b>(현재 상태가 보이는가)와 헷갈리면 안 됩니다. <b>Known/unknown</b> = 행동하면 어떻게 되는지 규칙을 아는가. 그림: 사막만 달리던 지프를 한국 도심에 두면 모든 게 보여도(fully) 신호등 규칙은 모름(unknown).",
 e:"Partially + known: 포커(룰은 앎, 상대 패 안 보임). Fully + unknown: 버튼이 다 보이는 낯선 해외 자판기."},
{s:"2-2",im:["2-2-12","2-2-13"],en:"Let's Think About It — Answers (Figure 2.6)",ko:"생각해 봅시다 — 정답 (그림 2.6)",key:1,fill:"fig26",
 o:[["For each one: observable, agents, deterministic, episodic, static, discrete?","각각에 대해: 관찰성, 에이전트 수, 결정성, 에피소드성, 정적, 이산?"],["Not always clear cut. Medical diagnosis is single-agent only if you decline to model the patient as one, and episodic only if the task is one diagnosis rather than a course of treatment.","항상 딱 떨어지지는 않는다. 의료 진단은 환자를 에이전트로 보지 않을 때만 단일, 치료 과정이 아닌 한 번의 진단일 때만 에피소드적이다."]],
 x:"헷갈리는 칸:<ul><li><b>Crossword</b>가 sequential: 한 칸의 단어가 교차하는 칸을 제약</li><li><b>Poker</b>가 static: 상대가 생각하는 동안 판이 변하지 않음</li><li><b>Backgammon</b>이 fully인데 stochastic: 주사위 → 관찰성과 결정성은 독립된 축</li><li><b>Image analysis</b>가 semi(dynamic): 이미지는 그대로지만 처리 시간이 성능에 영향</li><li><b>English tutor</b>가 discrete·multi: 대화가 단어 단위, 학생이 또 다른 에이전트</li></ul>"},
{s:"2-2",im:["2-2-14"],en:"The Environment Decides the Design",ko:"환경이 설계를 결정한다",key:1,
 o:[["This is the payoff of the whole section. Each property makes a demand:","이것이 이 절 전체의 결론이다. 각 속성은 하나의 요구를 만든다:"],["Partially observable → the agent needs memory · Nondeterministic → it must prepare for possibility · Multiagent → acting unpredictably may become rational · Static → there is time to compute a good decision","부분 관찰 → 기억 필요 · 비결정적 → 가능성에 대비 · 다중 → 예측 불가능한 행동이 합리적일 수 있음 · 정적 → 좋은 결정을 계산할 시간"],["Continuous time → it becomes a controller, always running · Unknown rules → it must explore · Unknown performance measure → it must learn from the person it serves","연속 시간 → 항상 돌아가는 제어기 · 규칙 모름 → 탐험 · 성능 척도 모름 → 봉사하는 사람에게서 배우기"]],
 x:"환경을 분류하면 에이전트에 넣어야 할 기능이 자동으로 나옵니다 → 다음에 배울 agent types(기억 → model-based, 계획 → goal-based, 불확실성 → utility-based, 탐험 → learning)로 이어짐. (보충: 마지막 항목은 RLHF 같은 AI safety 연구 주제)",
 e:"로봇 청소기: 침대 밑 안 보임 → 지도 기억 · 러그에서 미끄러짐 → 재시도 · 새 집 → 탐험해 지도 작성."},
{s:"2-2",im:["2-2-15","2-2-16"],en:"Agent types — Why Not Just Use a Table?",ko:"에이전트 유형 — 그냥 표를 쓰면 안 될까?",key:1,
 o:[["We said any agent function can be written as a table. So why not build the table and look the answer up? Chess would need somewhere around 10^150 entries. Too huge..","어떤 에이전트 함수든 표로 쓸 수 있다고 했다. 그럼 표를 만들어 찾아보면? 체스는 약 10^150개 항목이 필요하다. 너무 크다."],["Three separate walls, any one of them fatal: No machine could store it · No designer could fill it in · No agent could learn all the right entries","세 개의 벽, 그중 하나만으로도 치명적: 어떤 기계도 저장 못 함 · 어떤 설계자도 채울 수 없음 · 어떤 에이전트도 전부 학습 못 함"],["So the rest of the chapter asks: how do we get the same behavior out of a small program?","그래서 이 장의 나머지는 묻는다: 작은 프로그램으로 같은 행동을 어떻게 얻을까?"]],
 x:"10<sup>150</sup>은 관측 가능한 우주의 원자 수(약 10<sup>80</sup>)보다 훨씬 큽니다. 이 질문의 답이 다음 슬라이드부터의 네 가지 <b>agent architecture</b>입니다.",
 e:"구구단 81칸은 외우지만 1234×5678은 표 대신 곱셈 알고리즘을 쓴다."},
{s:"2-2",im:["2-2-21"],en:"Where Simple Reflex Breaks",ko:"단순 반사가 무너지는 곳",key:1,
 o:[["Take the location sensor away. Now it knows only clean or dirty","위치 센서를 없애 보자. 이제 깨끗한지 더러운지만 안다"],["On [Clean], what should it do? It cannot tell A from B — Always Left: stuck forever if it started in B · Always Right: stuck forever if it started in A","[Clean]일 때 무엇을? A와 B를 구별할 수 없다 — 항상 Left: B에서 시작했으면 영원히 갇힘 · 항상 Right: A에서 시작했으면 영원히 갇힘"],["A little unobservability is enough to trap it in a loop","약간의 관찰 불가능성만으로도 루프에 갇히기 충분하다"],["One escape: randomize — a coin flip reaches the other square in two steps on average. A useful trick, not a real fix. Better is to give it a memory","탈출구: 무작위화 — 동전 던지기로 평균 두 단계면 다른 칸 도달. 유용한 요령일 뿐 진짜 해결책은 아니다. 더 나은 건 기억을 주는 것"]],
 x:"이 슬라이드는 2-2 강의에만 있습니다. 평균 2단계: 매 단계 1/2 확률로 맞는 방향 → 기하분포 기댓값 1/(1/2) = 2. 2-2 강의의 나머지 에이전트 유형 슬라이드(17~38쪽)는 <b>2-3 강의와 같은 내용</b>이라 2-3 소단원에 모아 두었습니다."},

/* ================= 2-3 ================= */
{s:"2-3",im:["2-3-01","2-3-02"],en:"Chapter 2 - Part III: Agent types — A Hierarchy of Agent Types",ko:"2장 파트 III: 에이전트 유형 — 에이전트 유형의 계층",key:1,
 o:[["Utility-based agents ↑ Goal-based agents ↑ Model-based reflex agents ↑ Simple reflex agents — More capable","효용 기반 ↑ 목표 기반 ↑ 모델 기반 반사 ↑ 단순 반사 — 위로 갈수록 더 유능"]],
 x:"<div class='tw'><table><tr><th>Type</th><th>행동을 고르는 근거</th><th>한계</th></tr><tr><td>Simple reflex</td><td>현재 지각(current percept)</td><td>안 보이는 것은 모름</td></tr><tr><td>Model-based reflex</td><td>현재 지각 + 내부 상태(internal state)</td><td>목적지가 바뀌면 규칙 전부 교체</td></tr><tr><td>Goal-based</td><td>\"이렇게 하면 목표에 도달하나?\"</td><td>여러 방법 중 어느 게 더 좋은지 모름</td></tr><tr><td>Utility-based</td><td>\"이 상태가 얼마나 좋은가?\" (점수)</td><td>효용 함수 설계가 어려움</td></tr></table></div>더 유능하다고 항상 더 좋은 건 아닙니다 — 위로 갈수록 계산이 무거워집니다.",
 e:"미로: 반사 \"벽이면 오른쪽\" / 모델 \"아까 왼쪽은 막혔지\" / 목표 \"출구까지 경로 계획\" / 효용 \"가장 짧고 안전한 길\"."},
{s:"2-3",im:["2-3-03"],en:"Simple Reflex Agent",ko:"단순 반사 에이전트",key:1,
 o:[["Acts on the current percept alone.","오직 현재 지각만을 근거로 행동한다."]],
 x:"흐름: <b>Sensors</b> → [What the world is like now] → (<b>Condition-action rules</b>) → [What action I should do now] → <b>Actuators</b> → Environment. 과거는 전혀 저장하지 않습니다. <b>Condition-action rule</b>(조건-행동 규칙) = \"if 조건 then 행동\" — 뜨거운 것에 닿으면 손을 빼는 반사와 같음.",
 e:"자동문: 사람 감지 → 열기. 보일러: 실내 온도 &lt; 설정 온도 → 난방 켜기."},
{s:"2-3",im:["2-3-04"],en:"How a Reflex Agent Runs",ko:"반사 에이전트는 어떻게 동작하는가",key:1,
 o:[["The agent function is the current percept alone: a = f(p)","에이전트 함수는 현재 지각만 쓴다: a = f(p)"],["So, the interaction is a simple alternation: p0, a0, p1, a1, p2, a2, … pt, at","그래서 상호작용은 단순한 교대: p0, a0, p1, a1, …"],["Fast, and cheap. It also does not know why it does anything — it does not know the performance measure at all, yet well-chosen rules can still perform well","빠르고 싸다. 그리고 자기가 왜 하는지 모른다 — 성능 척도를 전혀 모르지만, 잘 고른 규칙이면 여전히 잘할 수 있다"]],
 x:"f : P* → A(이력 전체)와 비교하면 반사 에이전트는 현재 <b>p</b> 하나만 봅니다 → 표가 무한히 커지는 문제가 사라짐. \"왜 하는지 모른다\" = 규칙 안에 목표가 없다. 규칙을 잘 짠 건 설계자일 뿐.",
 e:"가로등: \"어두우면 켠다\". 보행자 안전이라는 목적을 모르지만 규칙이 좋아서 목적을 달성한다."},
{s:"2-3",im:["2-3-05"],en:"Example of Simple Reflex Agent",ko:"단순 반사 에이전트의 예",
 o:[["Rule-based reflex vacuum cleaner: function REFLEX-VACUUM-AGENT([location, status]) returns an action","규칙 기반 반사 청소기"],["Driving: If the car in front is braking, brake. Everything before this instant (history) is ignored.","운전: 앞차가 브레이크를 밟으면 브레이크. 이 순간 이전(이력)은 모두 무시된다."]],
 x:"<div class='formula'>if status = Dirty then return Suck<br>else if location = A then return Right<br>else if location = B then return Left</div><div class='tw'><table><tr><th>step</th><th>percept</th><th>action</th></tr><tr><td>1</td><td>[A, Dirty]</td><td>Suck</td></tr><tr><td>2</td><td>[A, Clean]</td><td>Right</td></tr><tr><td>3</td><td>[B, Dirty]</td><td>Suck</td></tr><tr><td>4</td><td>[B, Clean]</td><td>Left</td></tr><tr><td>5</td><td>[A, Clean]</td><td>Right … (끝없이 왕복)</td></tr></table></div>두 방이 다 깨끗해도 멈추지 못합니다 — \"B도 치웠다\"를 기억하지 못하기 때문. 이 한계를 고치는 것이 model-based agent."},
{s:"2-3",im:["2-3-06"],en:"Model-Based Reflex Agent",ko:"모델 기반 반사 에이전트",key:1,
 o:[["State · How the world evolves · What my actions do → What the world is like now","상태 · 세상이 어떻게 변하는가 · 내 행동이 무엇을 하는가 → 지금 세상은 어떤 모습인가"]],
 x:"단순 반사에 주황 상자가 추가됐습니다.<ul><li><b>State</b>: 머릿속의 \"세상에 대한 기록\"</li><li><b>How the world evolves</b>: 내가 아무것도 안 해도 세상이 어떻게 바뀌는지</li><li><b>What my actions do</b>: 내가 행동하면 세상이 어떻게 바뀌는지</li></ul>위쪽 점선 화살표 = 추정한 현재 세계를 다시 State로 저장(매 단계 갱신).",
 e:"눈 감고 방 걷기: \"세 걸음 갔으니 책상이 바로 앞\" — 방 구조(model)와 내 행동으로 위치(state)를 추적."},
{s:"2-3",im:["2-3-07"],en:"Model-Based Reflex Agent: Adding Memory",ko:"모델 기반 반사 에이전트: 기억 추가하기",key:1,
 o:[["The agent function now takes a second argument: a = f(p, s) where s is state, updated at every step.","에이전트 함수가 두 번째 인자를 받는다: a = f(p, s), s는 매 단계 갱신되는 상태."],["It can now track what it cannot currently see — memorize a car in the next lane, while you are looking the other way · memorize which rooms already cleaned","이제 지금 볼 수 없는 것을 추적할 수 있다 — 다른 쪽을 보는 동안 옆 차선의 차 기억 · 이미 청소한 방 기억"],["More information available means better rules become possible","쓸 수 있는 정보가 많아지면 더 좋은 규칙이 가능해진다"]],
 x:"<div class='formula'>s′ = T(s, a)   (상태 갱신, transition)<br>a = f(p, s)   (행동 결정)</div>청소기에 기억을 달면 \"A 깨끗, B 깨끗\"을 알게 되어 \"둘 다 깨끗하면 NoOp\"이라는 더 좋은 규칙을 쓸 수 있습니다(2-1의 이동 벌점 문제 해결). 2-2의 위치 센서 없는 청소기도 \"처음 위치 + 오른쪽으로 움직였으니 지금은 B\"로 해결."},
{s:"2-3",im:["2-3-08"],en:"Model-Based Reflex Agent: Two Models Are Needed",ko:"모델 기반 반사 에이전트: 두 가지 모델이 필요하다",key:1,
 o:[["To maintain that state variable, the agent needs two kinds of knowledge","그 상태 변수를 유지하려면 두 종류의 지식이 필요하다"],["A transition model: how the world changes - both from its own actions a and on its own world","전이 모델: 세상이 어떻게 변하는가 — 자신의 행동 a에 의해서, 그리고 스스로"],["A sensor model: how the state of the world shows up in its percepts","센서 모델: 세상의 상태가 지각에 어떻게 나타나는가"],["One honest caution: the state is a best guess in by sensor, never a certainty. In a partially observable world the exact state is rarely knowable","솔직한 주의: 상태는 센서에 의한 최선의 추측이지 결코 확실한 것이 아니다. 부분 관찰 세계에서 정확한 상태는 거의 알 수 없다"]],
 x:"<b>Transition model</b> = 원인 → 결과: ① 내 행동의 효과(핸들 왼쪽 → 차가 왼쪽) ② 세상 스스로의 변화(앞차는 계속 앞으로). <b>Sensor model</b> = 실제 상태 → 내가 보게 되는 것. 둘을 합치면 \"예측(transition) → 관측으로 보정(sensor)\"의 반복. (보충: belief state, Kalman filter)",
 e:"GPS 내비 터널 속: 신호가 끊겨도 \"시속 80km였으니 지금쯤 여기\"(transition)로 추정하고, 나오면 GPS(sensor)로 보정."},
{s:"2-3",im:["2-3-09"],en:"Model-Based Reflex Agent: State Representation",ko:"모델 기반 반사 에이전트: 상태 표현",key:1,
 o:[["State helps the agent keep track of the environment","상태는 에이전트가 환경을 추적하도록 돕는다"],["Atomic - the state is a label. Just \"A\" or \"B\".","원자적 — 상태는 하나의 이름표. 그냥 \"A\" 또는 \"B\"."],["Factored - the state is a set of attribute-value pairs, called fluent. [location = A, status = clean, temperature = 24°C]","요인적(분해된) — 속성-값 쌍의 집합, 이를 플루언트라 부른다."],["Structured - objects, with attributes and relations between them. \"the cup is on the table, which is in the kitchen\"","구조적 — 객체, 그 속성, 객체 사이의 관계. \"컵이 탁자 위에 있고 탁자는 부엌에 있다\""]],
 x:"<div class='tw'><table><tr><th>Representation</th><th>들여다볼 수 있는 것</th><th>쓰이는 곳</th></tr><tr><td>(a) Atomic</td><td>B와 C가 \"다르다\"는 것만</td><td>3장 search</td></tr><tr><td>(b) Factored</td><td>변수별 비교 (\"온도만 다르다\")</td><td>CSP, Bayes net, ML</td></tr><tr><td>(c) Structured</td><td>객체 간 관계까지</td><td>first-order logic, 자연어</td></tr></table></div>",
 e:"게임 캐릭터: atomic \"스테이지 3\" / factored [HP=80, MP=30, Lv=7] / structured \"플레이어는 길드 A 소속, A는 B와 동맹\"."},
{s:"2-3",im:["2-3-10"],en:"Model-Based Reflex Agent: The Transition Model",ko:"모델 기반 반사 에이전트: 전이 모델",key:1,
 o:[["Treat the environment as a discrete dynamic system","환경을 이산 동적 시스템으로 취급한다"],["The transition function says where an action takes you: the set of states (boxes) · A the set of actions (arrows)","전이 함수는 행동이 어디로 데려가는지 알려 준다: 상태 집합(상자) · 행동 집합 A(화살표)"],["Next week this becomes the backbone of every search algorithm","다음 주에 이것이 모든 탐색 알고리즘의 뼈대가 된다"]],
 x:"그림은 진공청소기 세계의 전이 모델 전체 — 상태 수 = 위치 2 × A 먼지 2 × B 먼지 2 = <b>8</b>. L/R은 위치를 바꾸고, S는 현재 칸 먼지를 없앰. 자기 자신으로 돌아오는 고리(self-loop) = 해도 변화 없는 행동(왼쪽 방에서 L). 이 그림이 3장의 <b>state space graph</b>입니다.",
 e:"엘리베이터: 상태 = 층, 행동 = {위, 아래}. (1층, 아래) → 1층(self-loop). 2.5층이 없으니 discrete."},
{s:"2-3",im:["2-3-11"],en:"Goal-Based Agent",ko:"목표 기반 에이전트",key:1,
 o:[["What it will be like if I do action A · Goals → Plan","내가 행동 A를 하면 세상은 어떻게 될까 · 목표 → 계획"]],
 x:"모델 기반에서 두 가지가 바뀜: ① condition-action rules가 사라지고 <b>Goals</b>가 들어옴 ② \"<b>What it will be like if I do action A</b>\"라는 예측 단계(전이 모델로 미래를 시뮬레이션). 예측한 미래와 목표를 비교하는 반복이 <b>Plan</b>(계획)이고, 3장의 search가 바로 계획하는 방법.",
 e:"체스: \"나이트를 여기 두면 → 상대는 이렇게 → 그러면 체크메이트\" — 말을 옮기기 전에 머릿속에서 여러 수를 미리 둔다."},
{s:"2-3",im:["2-3-12"],en:"Goal-Based Agent: Flexibility, Concretely",ko:"목표 기반 에이전트: 유연성, 구체적으로",key:1,
 o:[["Has a goal state: the agent is given a defined goal state to reach, and the task ends once it gets there.","목표 상태를 가진다: 도달해야 할 목표 상태가 주어지고, 거기 도착하면 과업이 끝난다."],["Must act toward the goal state: a planning uses search algorithms to work out a sequence of actions that leads to the goal.","목표 상태를 향해 행동해야 한다: 계획은 탐색 알고리즘으로 목표로 이어지는 행동의 순서를 알아낸다."]],
 x:"핵심 단어 두 개: ① <b>ends</b> — 종료 시점이 있다 ② <b>sequence of actions</b> — 행동 하나가 아니라 \"1 → 2 → 3…\"의 계획 전체.",
 e:"내비게이션: 목적지(goal state) 입력 → \"300m 직진 → 우회전 → …\"을 탐색으로 계산, 도착하면 안내 종료."},
{s:"2-3",im:["2-3-13"],en:"Goal-Based Agent: Examples",ko:"목표 기반 에이전트: 예시",key:1,
 o:[["Send a goal-based taxi somewhere new — change one thing: the destination. The plan is changed for the destination","목표 기반 택시를 새 곳으로 — 한 가지만 바꾼다: 목적지. 계획은 목적지에 맞게 바뀐다"],["Send a reflex taxi somewhere new — every rule for when to turn and when to go straight will work only for a single destination. Replace all of them","반사형 택시를 새 곳으로 — 언제 회전·직진할지 모든 규칙은 한 목적지에서만 통한다. 전부 교체해야 한다"],["The difference is that the goal agent's knowledge is written down explicitly, and so can be changed.","차이: 목표 에이전트의 지식은 명시적으로 적혀 있어서 바꿀 수 있다."]],
 x:"반사형 택시의 \"두 번째 사거리에서 좌회전\"은 특정 목적지가 규칙 속에 몰래 박힌 지식. 목표 기반 택시는 <b>목적지(goal)</b>와 <b>도로 지도(transition model)</b>가 분리되어 있어 목적지 변수 하나만 바꾸면 탐색이 새 경로를 계산합니다 = <b>flexibility</b>.",
 e:"코딩 비유: turn_left_at(2)를 하드코딩(반사형) vs route(dest)처럼 인자로 받기(목표 기반)."},
{s:"2-3",im:["2-3-14"],en:"Utility-Based Agent",ko:"효용 기반 에이전트",key:1,
 o:[["A goal is a yes-or-no test. A utility function scores how good a state is, which is what you need when several routes reach the goal.","목표는 예/아니오 판정이다. 효용 함수는 상태가 얼마나 좋은지 점수를 매기며, 여러 경로가 목표에 도달할 때 필요하다."]],
 x:"Goals 자리에 <b>Utility</b> → \"<b>How happy I will be in such a state</b>\"(그 상태에서 얼마나 행복할까)가 들어갔습니다. 목표 기반은 1시간 길과 3시간 길을 똑같이 \"성공\"으로 보지만, 효용 기반은 점수로 더 좋은 길을 고릅니다.",
 e:"서울→부산: KTX·버스·비행기 모두 목표 달성(yes). 효용 기반은 시간 vs 돈으로 점수를 매겨 하나를 고른다."},
{s:"2-3",im:["2-3-15"],en:"Utility-Based Agent: When Goals Are Not Enough (1)",ko:"효용 기반: 목표만으로 부족할 때 (1)",key:1,
 o:[["Three situations a goal test and a path cost cannot handle","목표 판정과 경로 비용으로 다룰 수 없는 세 상황"],["There is no terminal goal at all — a Mars rover keeping its battery out of the danger zone. Nothing to arrive at. The task never ends.","종료 목표가 아예 없다 — 배터리를 위험 구간 밖으로 유지하는 화성 로버. 도착할 곳이 없고 과업이 끝나지 않는다."],["Objectives conflict — fast against safe against comfortable. You cannot have all three, and someone has to write down the trade-off.","목적들이 충돌한다 — 빠름 vs 안전 vs 쾌적. 셋 다 가질 수 없고 누군가 절충을 적어 줘야 한다."],["Outcomes are uncertain — 90% chance of a small win, 10% chance of a large one. A yes-or-no test cannot multiply by a probability","결과가 불확실하다 — 90% 작은 승리, 10% 큰 승리. 예/아니오에는 확률을 곱할 수 없다"]],
 x:"③ 불확실성: 확률과 결합하려면 결과가 숫자여야 합니다 — 2-1의 E(U|a) = Σ U × P가 여기서 다시 등장. (보충: 100% 50만 원 vs 90% 10만·10% 500만 → 0.9×10 + 0.1×500 = 59만)",
 e:"① 에어컨 자동 모드(쾌적 유지는 끝이 없음) ② 스포츠 vs 컴포트 모드 ③ 인기 강의 10% vs 무난한 강의 90%."},
{s:"2-3",im:["2-3-16"],en:"Utility-Based Agent: When Goals Are Not Enough (2)",ko:"효용 기반: 목표만으로 부족할 때 (2)",
 o:[["Goals just provide a binary distinction between \"happy\" and \"unhappy\" states.","목표는 '행복한' 상태와 '불행한' 상태의 이분법만 제공한다."],["A utility function scores how desirable (happy) a state is — often written as a reward R(s) attached to each state.","효용 함수는 상태가 얼마나 바람직한지(행복한지) 점수를 매긴다 — 흔히 각 상태에 붙은 보상 R(s)로 쓴다."]],
 x:"목표 = 0 또는 1, 효용 = 실수값. <b>R(s)</b> = \"상태 s에 있을 때 받는 점수\" — 강화학습(reinforcement learning)의 핵심 기호.",
 e:"학점: 목표 기반 = Pass/Fail, 효용 기반 = A+ 4.5, A 4.0, B+ 3.5 … 게임: 깃발 도착(goal) vs 코인·시간 보너스(utility)."},
{s:"2-3",im:["2-3-17"],en:"Goal-Based Agent vs Utility-Based Agent",ko:"목표 기반 vs 효용 기반",key:1,
 o:[["Goal-based: p0, s0, a0, p1, s1, a1, …, s_goal — It terminates. The agent arrives, and it is done","목표 기반: …, s_goal — 종료된다. 도착하면 끝이다"],["Utility-based: p0, s0, a0, p1, s1, a1, … — It does not terminate. There is no arriving, only continuing","효용 기반: … — 종료되지 않는다. 도착은 없고 계속될 뿐이다"]],
 x:"<div class='tw'><table><tr><th></th><th>Goal-based</th><th>Utility-based</th></tr><tr><td>평가</td><td>yes/no</td><td>연속적인 점수</td></tr><tr><td>끝</td><td>목표 도달 시 종료</td><td>종료 없음 (계속 최적화)</td></tr><tr><td>강점</td><td>단순, 명확</td><td>trade-off·불확실성 처리</td></tr></table></div>(보충: 교재는 효용 기반도 종료가 있는 과제에 쓸 수 있다고 보며 핵심 차이를 \"이분법 vs 연속 점수\"로 설명. 시험은 강의 표현 기준이 안전.)",
 e:"목표 기반: 택배 마지막 집 배송 후 종료. 효용 기반: 스마트 에어컨이 하루 종일 쾌적함·전기요금을 조절."},
{s:"2-3",im:["2-3-18"],en:"Learning Agent",ko:"학습 에이전트",key:1,
 o:[["Performance element: It takes percepts and chooses actions. That is the entire agent.","수행 요소: 지각을 받아 행동을 고른다. 그것이 (지금까지 배운) 에이전트 전체다."],["Learning element: Updates the performance element so it does better next time","학습 요소: 수행 요소가 다음번에 더 잘하도록 갱신한다"],["Critic: Judges what happened against a fixed external standard","비평가: 일어난 일을 고정된 외부 기준에 대해 판정한다"],["Problem generator: Suggests intentionally actions worth trying","문제 생성기: 시도해 볼 만한 행동을 의도적으로 제안한다"],["Performance standard — It is external – the agent cannot change it","성능 기준 — 외부에 있다. 에이전트는 이것을 바꿀 수 없다"]],
 x:"흐름: Performance element가 행동 → <b>Critic</b>이 성능 기준에 비추어 <b>feedback</b> → <b>Learning element</b>가 수행 요소를 <b>changes</b>(변경) → <b>Problem generator</b>가 learning goals에 따라 새 시도 제안. 문제 생성기가 필요한 이유: 늘 하던 최선만 반복하면 더 좋은 방법을 영영 발견 못 함(<b>exploration vs exploitation</b>).",
 e:"게임 연습: 실제 플레이(performance) · 승패·랭크(critic) · 리플레이 보며 전략 수정(learning) · \"안 써 본 캐릭터 시도\"(problem generator)."},
{s:"2-3",im:["2-3-19"],en:"Learning Agent: Two Things Worth Noticing",ko:"학습 에이전트: 눈여겨볼 두 가지",key:1,
 o:[["The performance standard must sit outside the agent — an agent able to edit its own standard would lower it to whatever it already achieves. The same failure as a gameable performance measure in the vacuum world.","성능 기준은 반드시 에이전트 밖에 있어야 한다 — 자기 기준을 고칠 수 있으면 이미 달성한 수준으로 낮춰 버린다. 진공청소기 세계의 게이밍 가능한 척도와 같은 실패."],["Learning is orthogonal to everything else in this section — any of the four architectures can be built to learn, or not","학습은 이 절의 다른 모든 것과 직교한다 — 네 아키텍처 중 어느 것이든 학습하게 만들 수도, 아닐 수도 있다"]],
 x:"<b>Orthogonal</b>(직교) = 서로 독립된 축. \"어떤 구조냐(reflex~utility)\"와 \"학습하냐\"는 별개의 선택 → 학습하는 반사 에이전트도, 학습 안 하는 효용 에이전트도 있다. (2-2 강의: 학습은 <b>unknown environment</b>, 즉 설계자가 전지전능하지 않은 모든 경우에 가장 중요)",
 e:"학생이 자기 시험 합격선을 정할 수 있다면 기준을 내려 \"항상 합격\". 스팸 필터는 반사형이지만 '스팸 아님' 클릭으로 학습."},
{s:"2-3",im:["2-3-20"],en:"Summary",ko:"요약",key:1,
