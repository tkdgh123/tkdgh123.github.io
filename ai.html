 o:[["The initial state is Arad and the goal state is Bucharest.","초기 상태는 아라드, 목표 상태는 부쿠레슈티다.",1,"맞습니다."],
    ["The action cost is the distance driven.","행동 비용은 이동한 거리다.",1,"맞습니다."],
    ["Arad → Sibiu → Fagaras → Bucharest (450 miles) is the optimal path.","아라드 → 시비우 → 파가라스 → 부쿠레슈티(450마일)가 최적 경로다.",0,"틀렸습니다. 이동 횟수는 적지만 더 깁니다."],
    ["Arad → Sibiu → Rimnicu Vilcea → Pitesti → Bucharest (418 miles) is shorter despite having more moves.","아라드 → 시비우 → 림니쿠빌체아 → 피테슈티 → 부쿠레슈티(418마일)는 이동 횟수가 더 많지만 더 짧다.",1,"맞습니다. 140 + 80 + 97 + 101 = 418."],
    ["The path with the fewest cities is always the cheapest.","거치는 도시가 가장 적은 경로가 항상 가장 싸다.",0,"틀렸습니다. 이 차이(32마일) 때문에 최적 해를 찾는 탐색이 필요합니다."]],
 e:"최적 해 = 목표에 도달하는 행동 순서 중 경로 비용(행동 비용의 합)이 가장 낮은 것. 루마니아에서는 418마일입니다."},
{id:"3-1-06",s:"3-1",t:"mc",
 q:"Which statements about the sliding-tile puzzle are correct?",
 k:"슬라이딩 타일 퍼즐에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The actions are: move the blank Left, Right, Up, or Down.","행동은 빈칸을 왼쪽, 오른쪽, 위, 아래로 옮기는 것이다.",1,"맞습니다. 타일 8개가 아니라 빈칸을 움직인다고 보면 행동이 4가지로 단순해집니다."],
    ["The 8-puzzle has 9!/2 = 181,440 reachable states.","8-퍼즐에는 9!/2 = 181,440개의 도달 가능한 상태가 있다.",1,"맞습니다."],
    ["Half of the permutations cannot be reached from any given start state.","순열의 절반은 주어진 어떤 시작 상태에서도 도달할 수 없다.",1,"맞습니다. 패리티 불변량 때문입니다."],
    ["Every arrangement of the 8-puzzle can be transformed into the goal state.","8-퍼즐의 모든 배치는 목표 상태로 만들 수 있다.",0,"틀렸습니다. 절반은 어떤 합법적 이동으로도 경계를 넘지 못합니다."],
    ["The 24-puzzle has about 10^13 states.","24-퍼즐에는 약 10^13개의 상태가 있다.",0,"틀렸습니다. 10^13은 15-퍼즐(16!/2)이고, 24-퍼즐은 25!/2 ≈ 10^25입니다."]],
 e:"빈칸 위치(밝은/어두운 칸)와 순열의 짝·홀이 매 이동마다 함께 뒤집혀 합이 변하지 않습니다(불변량). 15 → 24퍼즐로 가면 상태 공간이 약 10^12배 커집니다."},
{id:"3-1-07",s:"3-1",t:"mc",
 q:"Which statements about search problems as models and about executing plans are correct?",
 k:"모델로서의 탐색 문제와 계획 실행에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["In a known, deterministic environment, the agent can ignore its percepts while executing the plan (open-loop).","알려진 결정적 환경에서는 계획을 실행하는 동안 지각을 무시해도 된다(개루프).",1,"맞습니다."],
    ["Search never runs in the world itself; it runs on a model of the world.","탐색은 절대 세상 그 자체에서 실행되지 않는다. 세상의 모델 위에서 실행된다.",1,"맞습니다."],
    ["A plan is only as good as the model it was found in.","계획은 그것을 찾아낸 모델만큼만 좋다.",1,"맞습니다. 모델은 일부러 단순화한 것입니다."],
    ["Open-loop execution is the best choice for nondeterministic environments.","개루프 실행은 비결정적 환경에서 최선의 선택이다.",0,"틀렸습니다. 불확실할수록 지각으로 계속 수정하는 폐루프가 필요합니다."],
    ["The optimal solution is the action sequence with the fewest actions, regardless of action costs.","최적 해는 행동 비용과 상관없이 행동 수가 가장 적은 행동 순서다.",0,"틀렸습니다. 경로 비용이 가장 낮은 행동 순서입니다."]],
 e:"'최적 해'는 '이 모델 안에서 최적'이라는 뜻입니다. 모델이 현실을 잘못 반영하면(예: 지도에 없는 공사 구간) 최적 해도 현실에서는 나쁜 계획일 수 있습니다."},
{id:"3-1-08",s:"3-1",t:"sa",
 q:"How many reachable states does the 8-puzzle have? (number)",
 k:"8-퍼즐의 도달 가능한 상태는 몇 개인가? (숫자)",
 a:["181440","181,440","9!/2"],show:"181,440 (= 9!/2)",
 e:"9! = 362,880가지 배치 중 정확히 절반만 도달 가능합니다: 9!/2 = 181,440."},
{id:"3-1-09",s:"3-1",t:"sa",
 q:"What is the cost (in miles) of the optimal path from Arad to Bucharest?",
 k:"아라드에서 부쿠레슈티까지 최적 경로의 비용(마일)은?",
 a:["418","418miles","418마일"],show:"418",
 e:"아라드 → 시비우 → 림니쿠빌체아 → 피테슈티 → 부쿠레슈티 = 140 + 80 + 97 + 101 = 418마일."},
{id:"3-1-10",s:"3-1",t:"sa",
 q:"How many atomic states does the two-square vacuum world have?",
 k:"두 칸짜리 진공청소기 세계의 원자적 상태는 몇 개인가?",
 a:["8","eight","여덟","8개"],show:"8",
 e:"청소기 위치 2 × A 먼지 2 × B 먼지 2 = 8. 목표 상태는 두 방 모두 깨끗한 2개(청소기가 A 또는 B)."},
{id:"3-1-11",s:"3-1",t:"sa",
 q:"The path cost is the ______ of the action costs along the action sequence from the initial state to the goal. (one word)",
 k:"경로 비용은 초기 상태에서 목표까지 행동 순서를 따라 행동 비용을 ______한 값이다. (한 단어)",
 a:["sum","total","합","합계","더한"],show:"sum",
 e:"경로 비용 = 행동 비용의 합. 모든 행동 비용이 1이면 경로 비용 = 행동 횟수입니다."},

/* ===================== 3-2 ===================== */
{id:"3-2-01",s:"3-2",t:"mc",
 q:"Which statements comparing the state-space graph and the search tree are correct?",
 k:"상태 공간 그래프와 탐색 트리를 비교한 설명으로 옳은 것을 모두 고르시오.",
 o:[["In the state space, there is one node per state.","상태 공간에서는 상태 하나당 노드 하나다.",1,"맞습니다."],
    ["In the search tree, each node represents a whole path from the root.","탐색 트리에서 각 노드는 루트로부터의 경로 전체를 나타낸다.",1,"맞습니다. 노드는 상태가 아니라 경로입니다."],
    ["The vacuum world has 8 states, but its search tree is infinite.","진공청소기 세계는 상태가 8개지만 탐색 트리는 무한하다.",1,"맞습니다."],
    ["The search tree is fixed before the search begins.","탐색 트리는 탐색이 시작되기 전에 고정되어 있다.",0,"틀렸습니다. 고정된 것은 상태 공간이고, 탐색 트리는 진행하면서 만들어집니다."],
    ["The same state can appear as several different nodes in the search tree.","같은 상태가 탐색 트리에서 여러 개의 다른 노드로 나타날 수 있다.",1,"맞습니다. 중복 경로를 완전히 막지 못할 때."]],
 e:"상태 공간 = 세상(고정, 그래프, 유한할 수 있음). 탐색 트리 = 시도한 것의 기록(진행하며 생성, 항상 트리, 무한할 수 있음). 학생들이 가장 자주 놓치는 구분입니다."},
{id:"3-2-02",s:"3-2",t:"mc",
 q:"Which statements about cycles and redundant paths are correct?",
 k:"사이클과 중복 경로에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A cycle is a path that returns to the same state.","사이클은 같은 상태로 되돌아오는 경로다.",1,"맞습니다."],
    ["A redundant path is one of several different paths reaching the same state.","중복 경로는 같은 상태에 도달하는 서로 다른 여러 경로다.",1,"맞습니다."],
    ["A cycle can be detected cheaply by following parent pointers along the current path.","사이클은 현재 경로를 따라 부모 포인터를 따라가면 싸게 검사할 수 있다.",1,"맞습니다."],
    ["AI search always removes all redundant paths, no matter how much memory it costs.","AI 탐색은 메모리가 얼마나 들든 항상 모든 중복 경로를 제거한다.",0,"틀렸습니다. 중복 경로 검사는 메모리가 많이 들어 같은 부분을 여러 번 탐색하는 것을 감수하기도 합니다."],
    ["When expanding Sibiu from Arad in the Romania example, the Arad node that reappears one level below is a redundant path, not a cycle.","루마니아 예에서 아라드에서 시비우를 확장할 때 한 단계 아래에 다시 나타난 아라드는 사이클이 아니라 중복 경로다.",0,"틀렸습니다. 아라드→시비우→아라드는 출발점으로 되돌아온 사이클입니다."]],
 e:"사이클 = 한 경로 안에서 같은 상태 반복(무한 루프 → 반드시 잘라냄). 중복 경로 = 서로 다른 두 경로가 같은 상태에서 만남(없애면 효율↑, 단 메모리 비용)."},
{id:"3-2-03",s:"3-2",t:"mc",
 q:"Which statements correctly describe the tree-search algorithm summarized in the lecture?",
 k:"강의에서 요약한 트리 탐색 알고리즘을 올바르게 설명한 것을 모두 고르시오.",
 o:[["Initialize the frontier with all goal states.","프런티어를 모든 목표 상태로 초기화한다.",0,"틀렸습니다. 시작 상태(루트 노드)로 초기화합니다."],
    ["While the frontier is not empty, choose the next node to expand according to the search strategy.","프런티어가 비어 있지 않은 동안, 탐색 전략에 따라 다음에 확장할 노드를 고른다.",1,"맞습니다."],
    ["If the chosen node represents a goal state, return it as the solution.","고른 노드가 목표 상태를 나타내면 해로 반환한다.",1,"맞습니다."],
    ["Otherwise, expand it — apply all possible actions via the transition model — and add the children to the frontier.","아니면 확장한다 — 전이 모델로 가능한 모든 행동을 적용하고 — 자식들을 프런티어에 추가한다.",1,"맞습니다."],
    ["Different strategies such as BFS and DFS need completely different loops.","BFS와 DFS 같은 서로 다른 전략은 완전히 다른 반복문이 필요하다.",0,"틀렸습니다. 모든 전략은 이 하나의 반복문의 특수한 경우이며, 무엇을 먼저 꺼내느냐만 다릅니다."]],
 e:"프런티어 = 알려졌지만 아직 확장되지 않은 노드들. 꺼내기 → 목표 검사 → 확장의 반복이며, 프런티어가 비면 실패입니다."},
{id:"3-2-04",s:"3-2",t:"mc",
 q:"Which statements about the frontier are correct?",
 k:"프런티어에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It holds nodes that are known but not yet expanded.","알려졌지만 아직 확장되지 않은 노드들을 담는다.",1,"맞습니다."],
    ["It is also called the open list.","개방 목록(open list)이라고도 부른다.",1,"맞습니다."],
    ["It contains all nodes that have already been expanded.","이미 확장된 모든 노드를 담는다.",0,"틀렸습니다. 확장된 노드는 프런티어를 떠납니다(아라드 확장 후 아라드는 나감)."],
    ["It must always be a FIFO queue, whatever the strategy.","전략과 상관없이 항상 FIFO 큐여야 한다.",0,"틀렸습니다. 전략에 따라 큐(BFS), 스택(DFS), 우선순위 큐(UCS, A*)를 씁니다."],
    ["An empty frontier means that a solution has been found.","프런티어가 비었다는 것은 해를 찾았다는 뜻이다.",0,"틀렸습니다. 더 가 볼 곳이 없다는 뜻이므로 실패를 반환합니다."]],
 e:"프런티어(개방 목록) = 발견했지만 아직 자식을 만들어 보지 않은 노드들의 대기열. 어떤 노드를 먼저 꺼내느냐가 탐색 전략입니다."},
{id:"3-2-05",s:"3-2",t:"mc",
 q:"Which statements about the four criteria used to evaluate search strategies are correct?",
 k:"탐색 전략을 평가하는 네 가지 기준에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Completeness: does it always find a solution if one exists?","완전성: 해가 존재할 때 항상 해를 찾는가?",1,"맞습니다."],
    ["Cost optimality: does it always find the lowest-cost solution?","비용 최적성: 항상 비용이 가장 낮은 해를 찾는가?",1,"맞습니다."],
    ["Space complexity: how long does it take?","공간 복잡도: 얼마나 오래 걸리는가?",0,"틀렸습니다. 그건 시간 복잡도. 공간 복잡도는 메모리가 얼마나 필요한가입니다."],
    ["A search strategy determines the order in which nodes are expanded.","탐색 전략은 노드가 확장되는 순서를 정한다.",1,"맞습니다."],
    ["In practice, memory usually runs out long before time does.","실제로는 보통 시간보다 메모리가 훨씬 먼저 바닥난다.",1,"맞습니다."]],
 e:"완전성 · 비용 최적성 · 시간 복잡도 · 공간 복잡도. 시험 단골: 'OO 탐색은 완전한가? 최적인가? 시간·공간 복잡도는?'"},
{id:"3-2-06",s:"3-2",t:"mc",
 q:"For the vacuum world, which values of b, m, d are correct (as defined in the lecture)?",
 k:"진공청소기 세계에서 (강의 정의에 따른) b, m, d 값으로 옳은 것을 모두 고르시오.",
 o:[["b = 3","b = 3",1,"맞습니다. 행동은 L, R, S 세 가지."],
    ["m = 5","m = 5",1,"맞습니다. 사이클을 제거한 가장 긴 경로."],
    ["d = 3","d = 3",1,"맞습니다. Suck → Right → Suck."],
    ["m = ∞ even after removing cycles","사이클을 제거한 뒤에도 m = ∞",0,"틀렸습니다. 사이클을 지우지 않으면 ∞지만, 강의는 사이클 제거 후 최대 길이로 정의해 5입니다."],
    ["d can be larger than m","d가 m보다 클 수 있다",0,"틀렸습니다. 항상 d ≤ m입니다."]],
 e:"b = 최대 분기 계수(가능한 행동의 최대 수), m = 사이클을 제거한 최대 깊이, d = 가장 얕은(최적) 해의 깊이. m을 세려면 먼저 사이클을 제거해야 합니다."},
{id:"3-2-07",s:"3-2",t:"mc",
 q:"Which statements about Big-O and the size of the search tree are correct?",
 k:"빅오와 탐색 트리 크기에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["O(n² + n + 1) = O(n²)","O(n² + n + 1) = O(n²)",1,"맞습니다. 최고차항이 지배합니다."],
    ["1 + b + b² + … + b^m = O(b^m)","1 + b + b² + … + b^m = O(b^m)",1,"맞습니다."],
    ["As n grows, the lower-order terms dominate.","n이 커질수록 낮은 차수의 항이 지배한다.",0,"틀렸습니다. 최고차항이 지배합니다(n=1000이면 n²이 99.9%)."],
    ["The cost of the whole tree is roughly the cost of its bottom tier.","트리 전체의 비용은 대략 맨 아래 층의 비용과 같다.",1,"맞습니다."],
    ["In Big-O notation, constant factors are kept (e.g., O(0.5n²) differs from O(n²)).","빅오 표기에서는 상수 계수를 유지한다(예: O(0.5n²)은 O(n²)과 다르다).",0,"틀렸습니다. 상수배는 무시합니다."]],
 e:"각 층은 바로 위층보다 b배 많은 노드를 가지므로 맨 아래 층 b^m이 압도적입니다. 다음 강의의 모든 시간·공간 상한은 이 합의 일부분입니다."},
{id:"3-2-08",s:"3-2",t:"mc",
 q:"Which state-space size estimates from the lecture are correct?",
 k:"강의에서 제시한 상태 공간 크기 추정으로 옳은 것을 모두 고르시오.",
 o:[["8-queens: C(64, 8) ≈ 4.4 × 10^9 (upper bound)","8-퀸: C(64, 8) ≈ 4.4 × 10^9 (상한)",1,"맞습니다. 서로 공격하지 않는다는 조건을 무시한 상한입니다."],
    ["Tic-tac-toe: fewer than 3^9 = 19,683 board states","틱택토: 3^9 = 19,683개 미만의 판 상태",1,"맞습니다."],
    ["Pac-Man pathing: 120 states","팩맨 경로 찾기: 120개 상태",1,"맞습니다. 12 × 10 격자 위치."],
    ["Pac-Man eat-all-dots: 120 × 2^30 states","팩맨 모든 점 먹기: 120 × 2^30개 상태",1,"맞습니다."],
    ["Vacuum world: 2² = 4 states","진공청소기 세계: 2² = 4개 상태",0,"틀렸습니다. 로봇 위치까지 곱해 2 × 2² = 2³ = 8개입니다."]],
 e:"요인적 표현이면 n = |X1| × |X2| × ⋯ × |Xl|. 단, 탐색에 중요한 것은 도달 가능한 상태뿐입니다(8-퍼즐은 정확히 절반)."},
{id:"3-2-09",s:"3-2",t:"mc",
 q:"Which (b, m, d) facts for the example problems are correct?",
 k:"예제 문제들의 (b, m, d)에 대한 사실로 옳은 것을 모두 고르시오.",
 o:[["Tic-tac-toe: b = 9, m = 9, d = 5","틱택토: b = 9, m = 9, d = 5",1,"맞습니다. X, O, X, O, X — 최소 5수."],
    ["8-queens (one queen per column): b = 8, m = 8, d = 8","8-퀸(열마다 퀸 하나): b = 8, m = 8, d = 8",1,"맞습니다. 해는 항상 맨 아래에 있습니다."],
    ["8-puzzle: b = 8","8-퍼즐: b = 8",0,"틀렸습니다. 빈칸의 4방향 이동이므로 b = 4."],
    ["8-puzzle: d ≤ 31","8-퍼즐: d ≤ 31",1,"맞습니다. 모든 배치는 31수 이하로 풀립니다."],
    ["Maze: b = 8","미로: b = 8",0,"틀렸습니다. 상하좌우 4방향이므로 b = 4."]],
 e:"d와 m이 같은 문제(8-퀸)와 다른 문제(틱택토 d=5, m=9)가 있습니다. 목표가 여러 깊이에 흩어져 있기 때문에 d와 m은 서로 다른 두 수입니다."},
{id:"3-2-10",s:"3-2",t:"sa",
 q:"The frontier is also called the ______ list. (one word)",
 k:"프런티어는 ______ 목록(list)이라고도 부른다. (한 단어)",
 a:["open","개방"],show:"open (open list)",
 e:"프런티어 = 개방 목록(open list): 알려졌지만 아직 확장되지 않은 노드들."},
{id:"3-2-11",s:"3-2",t:"sa",
 q:"With branching factor b = 10 and maximum depth m = 3, how many nodes are in the whole tree, 1 + b + b² + b³?",
 k:"분기 계수 b = 10, 최대 깊이 m = 3일 때 트리 전체의 노드 수 1 + b + b² + b³은?",
 a:["1111","1,111"],show:"1,111",
 e:"1 + 10 + 100 + 1000 = 1,111. 맨 아래 층(1000)이 약 90%를 차지하므로 O(b^m)으로 씁니다."},
{id:"3-2-12",s:"3-2",t:"sa",
 q:"A vacuum world with 3 rooms: the robot can be in any room and each room is clean or dirty. How many states are there?",
 k:"방이 3개인 진공청소기 세계: 로봇은 어느 방에든 있을 수 있고 각 방은 깨끗하거나 더럽다. 상태는 몇 개인가?",
 a:["24"],show:"24 (= 3 × 2³)",
 e:"로봇 위치 3 × 먼지 2³ = 24. 방이 k개이면 k × 2^k — 방이 조금만 늘어도 상태 수는 지수적으로 커집니다."},
{id:"3-2-13",s:"3-2",t:"sa",
 q:"How many states does the Pac-Man PATHING problem have on the 12 × 10 grid?",
 k:"12 × 10 격자에서 팩맨 '경로 찾기' 문제의 상태는 몇 개인가?",
 a:["120"],show:"120",
 e:"경로 찾기에는 위치만 필요하므로 12 × 10 = 120. 세계 상태(약 74조)에서 추상화로 120까지 줄인 셈입니다."},

/* ===================== 3-3 ===================== */
{id:"3-3-01",s:"3-3",t:"mc",
 q:"Which statements about breadth-first search (BFS) are correct?",
 k:"너비 우선 탐색(BFS)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Its frontier is a FIFO queue.","프런티어는 FIFO 큐다.",1,"맞습니다."],
    ["It expands the shallowest unexpanded node.","가장 얕은 미확장 노드를 확장한다.",1,"맞습니다."],
    ["It is complete when the branching factor b is finite.","분기 계수 b가 유한하면 완전하다.",1,"맞습니다."],
    ["It is cost-optimal even when action costs differ.","행동 비용이 서로 달라도 비용 최적이다.",0,"틀렸습니다. 모든 단계 비용이 같을 때만 최적입니다. 아니면 UCS를 써야 합니다."],
    ["Its space complexity is O(b^m).","공간 복잡도는 O(b^m)이다.",0,"틀렸습니다. O(b^d)입니다. O(b^m) 시간은 DFS 쪽입니다."]],
 e:"BFS: 완전 ✔, 최적 ✔(비용이 같을 때만), 시간·공간 O(b^d). AI에서는 큰 공간 복잡도가 보통 시간보다 더 큰 문제입니다."},
{id:"3-3-02",s:"3-3",t:"mc",
 q:"Which statements about uniform-cost search (UCS) are correct?",
 k:"균일 비용 탐색(UCS)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Its frontier is a priority queue ordered by the path cost g(n).","프런티어는 경로 비용 g(n)으로 정렬되는 우선순위 큐다.",1,"맞습니다."],
    ["It is essentially Dijkstra's algorithm.","본질적으로 다익스트라 알고리즘이다.",1,"맞습니다."],
    ["It performs the goal test when a node is popped from the frontier (late goal test).","노드를 프런티어에서 꺼낼 때 목표 검사를 한다(늦은 목표 검사).",1,"맞습니다."],
    ["It is complete if every step cost exceeds some small positive constant ε.","모든 단계 비용이 어떤 작은 양수 상수 ε보다 크면 완전하다.",1,"맞습니다."],
    ["Its complexity is always smaller than BFS's O(b^d).","복잡도는 항상 BFS의 O(b^d)보다 작다.",0,"틀렸습니다. O(b^(C*/ε))는 BFS보다 클 수 있습니다. 비싼 짧은 경로보다 싼 긴 경로들을 먼저 많이 탐색할 수 있기 때문입니다."]],
 e:"UCS = 최선 우선 탐색, f(n) = g(n). 더 싼 경로가 나타나면 reached를 갱신합니다(≠ BFS). BFS는 모든 단계 비용이 같은 UCS의 특수한 경우입니다."},
{id:"3-3-03",s:"3-3",t:"mc",
 q:"Which statements about depth-first search (DFS) are correct?",
 k:"깊이 우선 탐색(DFS)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Its frontier is a LIFO stack.","프런티어는 LIFO 스택이다.",1,"맞습니다."],
    ["Its space complexity is O(bm), linear in the maximum depth.","공간 복잡도는 O(bm)으로 최대 깊이에 선형이다.",1,"맞습니다(reached를 쓰지 않을 때)."],
    ["It is not cost-optimal; it returns the first solution it finds.","비용 최적이 아니다. 처음 찾은 해를 반환한다.",1,"맞습니다."],
    ["It uses a reached table to eliminate all redundant paths.","reached 표를 써서 모든 중복 경로를 제거한다.",0,"틀렸습니다. reached 자료구조가 없습니다. 사이클은 현재 경로만 보고 막지만 중복 경로는 검사할 수 없습니다."],
    ["It is complete even in infinite state spaces.","무한한 상태 공간에서도 완전하다.",0,"틀렸습니다. m이 무한일 수 있어 무한히 깊은 가지에 빠지면 돌아오지 못합니다."]],
 e:"DFS: 완전성 조건부(사이클 막고 유한할 때), 최적 ✗, 시간 O(b^m)(m ≫ d이면 비효율), 공간 O(bm). 유일한 장점은 메모리입니다."},
{id:"3-3-04",s:"3-3",t:"mc",
 q:"Which statements about iterative deepening search (IDS) are correct?",
 k:"반복적 깊이 심화 탐색(IDS)에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It repeats depth-limited DFS with limits 0, 1, 2, 3, … until a solution is found.","해가 나올 때까지 한계 0, 1, 2, 3, …으로 깊이 제한 DFS를 반복한다.",1,"맞습니다."],
    ["Its time complexity is O(b^d), the same class as BFS.","시간 복잡도는 O(b^d)로 BFS와 같은 등급이다.",1,"맞습니다. BFS보다 느리지만 같은 등급."],
    ["Its space complexity is O(bd), even less than DFS since d ≤ m.","공간 복잡도는 O(bd)로, d ≤ m이므로 DFS보다도 적다.",1,"맞습니다."],
    ["It distinguishes 'cutoff' from 'failure' so the outer loop knows when to stop.","바깥 루프가 언제 멈출지 알도록 cutoff와 failure를 구분한다.",1,"맞습니다."],
    ["With b = 10 and d = 5, IDS generates about ten times as many nodes as BFS.","b = 10, d = 5일 때 IDS는 BFS의 약 10배의 노드를 생성한다.",0,"틀렸습니다. 123,450 vs 111,110으로 약 11%만 더 듭니다."]],
 e:"IDS = DFS의 메모리 + BFS의 보장. 같은 노드를 여러 번 만들지만 노드 대부분이 맨 아래층에 있고 그 층은 한 번만 만들어 낭비가 적습니다. 그래서 IDS와 DFS가 AI의 일꾼."},
{id:"3-3-05",s:"3-3",t:"mc",
 q:"Which statements about WHEN the goal test is performed are correct?",
 k:"목표 검사를 '언제' 하는지에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["BFS checks for the goal when a child is generated (early goal test).","BFS는 자식을 생성할 때 목표를 검사한다(조기 목표 검사).",1,"맞습니다."],
    ["UCS checks for the goal when a node is popped (late goal test).","UCS는 노드를 꺼낼 때 목표를 검사한다(늦은 목표 검사).",1,"맞습니다."],
    ["With varying action costs, the first goal generated is not guaranteed to be the cheapest.","행동 비용이 제각각이면 처음 생성된 목표가 가장 싸다는 보장이 없다.",1,"맞습니다. 그래서 늦은 검사를 씁니다."],
    ["With S→G costing 10, S→A costing 1 and A→G costing 1, an early goal test returns the cost-2 path.","S→G 비용 10, S→A 비용 1, A→G 비용 1일 때 조기 목표 검사는 비용 2 경로를 반환한다.",0,"틀렸습니다. 조기 검사는 S를 확장하자마자 G(10)를 반환합니다. 늦은 검사(UCS)여야 비용 2를 찾습니다."],
    ["In BFS, the early goal test can save generating a whole extra layer (about a factor of b).","BFS에서 조기 목표 검사는 한 층 전체(약 b배)를 더 만드는 것을 줄여 준다.",1,"맞습니다."]],
 e:"BFS는 얕은 순서로 노드를 만들기 때문에 처음 만든 목표가 가장 얕은 해임이 보장됩니다. 비용이 다르면 그런 보장이 없으므로 최선 우선 계열(UCS, A*)은 꺼낼 때 검사합니다."},
{id:"3-3-06",s:"3-3",t:"mc",
 q:"\"The one queue\": which pairs of frontier data structure → algorithm are correct?",
 k:"'하나의 큐': 프런티어 자료구조 → 알고리즘의 짝이 올바른 것을 모두 고르시오.",
 o:[["FIFO queue → BFS","FIFO 큐 → BFS",1,"맞습니다."],
    ["LIFO stack → DFS","LIFO 스택 → DFS",1,"맞습니다."],
    ["Priority queue ordered by g(n) → UCS","g(n)으로 정렬된 우선순위 큐 → UCS",1,"맞습니다."],
    ["Stack with a depth cutoff → IDS","깊이 컷오프가 있는 스택 → IDS",1,"맞습니다."],
    ["FIFO queue → UCS","FIFO 큐 → UCS",0,"틀렸습니다. UCS는 우선순위 큐가 필요합니다."]],
 e:"BFS, UCS, DFS, IDS는 하나의 알고리즘이고 프런티어 규칙만 다릅니다. 개념적으로 모든 프런티어는 우선순위 큐이지만, BFS/DFS는 일반 큐·스택으로 log(n) 오버헤드를 피합니다."},
{id:"3-3-07",s:"3-3",t:"mc",
 q:"On the lecture's example graph, BFS found S→e→r→f→G and UCS found S→d→e→r→f→G. Which statements are correct?",
 k:"강의 예제 그래프에서 BFS는 S→e→r→f→G, UCS는 S→d→e→r→f→G를 찾았다. 옳은 설명을 모두 고르시오.",
 o:[["The BFS path uses fewer steps.","BFS 경로가 단계 수가 더 적다.",1,"맞습니다. 4단계 vs 5단계."],
    ["The UCS path has cost 10.","UCS 경로의 비용은 10이다.",1,"맞습니다. 3 + 2 + 2 + 1 + 2 = 10."],
    ["BFS guarantees the lowest-cost path on this graph.","이 그래프에서 BFS는 최저 비용 경로를 보장한다.",0,"틀렸습니다. BFS 경로 비용은 9 + 2 + 1 + 2 = 14로 4만큼 손해입니다."],
    ["During UCS, the cost recorded for e was updated from 9 to 5.","UCS 진행 중 e에 기록된 비용이 9에서 5로 갱신되었다.",1,"맞습니다. d를 거치는 더 싼 경로가 발견됐습니다."],
    ["UCS expanded e(9) before b(4) because e is shallower.","e가 더 얕기 때문에 UCS는 b(4)보다 e(9)를 먼저 확장했다.",0,"틀렸습니다. UCS는 깊이가 아니라 누적 비용 순서입니다. 비용이 싼 것부터 꺼냅니다."]],
 e:"BFS가 보장하는 건 '단계 수가 가장 적은' 해. 비용이 다르면 UCS를 써야 합니다. UCS는 비용 등고선처럼 퍼지며, 깊이 4인 f(8)도 깊이 1인 e(9)보다 먼저 처리됩니다."},
{id:"3-3-08",s:"3-3",t:"mc",
 q:"Among the uninformed search strategies, which are cost-optimal when action costs differ (all positive)?",
 k:"무정보 탐색 전략 중, 행동 비용이 서로 다를 때(모두 양수) 비용 최적인 것을 모두 고르시오.",
 o:[["Uniform-cost search","균일 비용 탐색",1,"맞습니다."],
    ["Dijkstra's algorithm (the same idea as UCS)","다익스트라 알고리즘(UCS와 같은 아이디어)",1,"맞습니다."],
    ["Breadth-first search","너비 우선 탐색",0,"틀렸습니다. 비용이 같을 때만 최적입니다."],
    ["Depth-first search","깊이 우선 탐색",0,"틀렸습니다. 처음 찾은 해를 반환하므로 최적이 아닙니다."],
    ["Iterative deepening search","반복적 깊이 심화 탐색",0,"틀렸습니다. BFS와 같은 조건(비용 동일)에서만 최적. 비용이 다르면 가장 얕은 해를 찾을 뿐입니다."]],
 e:"비용이 제각각일 때 무정보 탐색 중 최적을 보장하는 것은 UCS(= 다익스트라)뿐입니다. 노드를 경로 비용이 증가하는 순서로 확장하기 때문입니다."},
{id:"3-3-09",s:"3-3",t:"sa",
 q:"With b = 10 and d = 5, how many nodes does IDS generate? (d·b + (d−1)·b² + … + 1·b^d)",
 k:"b = 10, d = 5일 때 IDS가 생성하는 노드 수는? (d·b + (d−1)·b² + … + 1·b^d)",
 a:["123450","123,450"],show:"123,450",
 e:"5·10 + 4·100 + 3·1,000 + 2·10,000 + 1·100,000 = 123,450. BFS는 111,110이므로 약 11%만 더 듭니다."},
{id:"3-3-10",s:"3-3",t:"sa",
 q:"What value does depth-limited search return to mean \"no solution within this depth limit, but there might be one deeper\"? (one word)",
 k:"깊이 제한 탐색이 \"이 깊이 한계 안에는 해가 없지만 더 깊이 가면 있을 수도 있다\"는 뜻으로 반환하는 값은? (한 단어)",
 a:["cutoff","cut-off","cut off","컷오프"],show:"cutoff",
 e:"cutoff = 한계 때문에 잘림, failure = 해가 아예 없음. IDS 바깥 루프는 cutoff면 한계를 늘려 계속, 해 또는 failure면 멈춥니다."},
{id:"3-3-11",s:"3-3",t:"sa",
 q:"BFS is the special case of uniform-cost search in which all step costs are ______. (one word)",
 k:"BFS는 모든 단계 비용이 ______한 균일 비용 탐색의 특수한 경우다. (한 단어)",
 a:["equal","the same","same","identical","uniform","1","one","같은","동일","같음"],show:"equal (the same)",
 e:"모든 비용이 같으면 g(n) = 깊이(× 상수)가 되어 UCS의 확장 순서가 BFS와 같아집니다(등고선을 평평하게 편 것)."},
{id:"3-3-12",s:"3-3",t:"sa",
 q:"Give the space complexity of DFS in Big-O notation, using b and m.",
 k:"b와 m을 써서 DFS의 공간 복잡도를 빅오 표기로 쓰시오.",
 a:["O(bm)","bm","O(b*m)","b*m","O(mb)","mb","O(b×m)"],show:"O(bm)",
 e:"DFS는 루트에서 현재 노드까지의 경로(최대 m층)와 각 층의 아직 안 본 형제들(층마다 최대 b개)만 기억하므로 O(bm). 시간은 O(b^m)."},

/* ===================== 3-4 ===================== */
{id:"3-4-01",s:"3-4",t:"mc",
 q:"Which statements about heuristic functions are correct?",
 k:"휴리스틱 함수에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["h(n) estimates the cost from node n to a goal.","h(n)은 노드 n에서 목표까지의 비용을 추정한다.",1,"맞습니다."],
    ["Euclidean distance is the straight-line distance, ignoring obstacles.","유클리드 거리는 장애물을 무시한 직선 거리다.",1,"맞습니다."],
    ["Manhattan distance is the number of horizontal moves plus the number of vertical moves.","맨해튼 거리는 가로 이동 칸 수와 세로 이동 칸 수의 합이다.",1,"맞습니다."],
    ["h(n) is the exact cost already paid from the start to n.","h(n)은 시작에서 n까지 이미 지불한 정확한 비용이다.",0,"틀렸습니다. 그것은 g(n)입니다. h는 앞으로 남은 비용의 추정치입니다."],
    ["In the Romania problem, the straight-line distance from Arad to Bucharest is 366.","루마니아 문제에서 아라드에서 부쿠레슈티까지의 직선 거리는 366이다.",1,"맞습니다. 실제 최단 도로 거리는 418입니다."]],
 e:"h(n) = 목표까지 남은 비용의 어림값. 보통 벽·장애물 같은 제약을 무시하고 계산해 빠르게 구합니다. 에이전트가 가진 정보(지도)나 지각(GPS)에서 얻습니다."},
{id:"3-4-02",s:"3-4",t:"mc",
 q:"Which statements about greedy best-first search are correct?",
 k:"탐욕적 최선 우선 탐색에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It expands the node with the lowest h(n): f(n) = h(n).","h(n)이 가장 낮은 노드를 확장한다: f(n) = h(n).",1,"맞습니다."],
    ["It is complete in finite state spaces.","유한한 상태 공간에서 완전하다.",1,"맞습니다. '최선 우선 탐색은 유한한 공간에서 완전하다.'"],
    ["It is cost-optimal.","비용 최적이다.",0,"틀렸습니다. 이미 지불한 비용을 고려하지 않기 때문입니다."],
    ["On the Romania map it finds the 418-mile route.","루마니아 지도에서 418마일 경로를 찾는다.",0,"틀렸습니다. 450마일(아라드–시비우–파가라스–부쿠레슈티)을 찾아 32마일 손해를 봅니다."],
    ["It never considers the cost already paid to reach a node.","노드에 도달하는 데 이미 지불한 비용은 절대 고려하지 않는다.",1,"맞습니다. 목표까지의 추정 비용만 저울질합니다."]],
 e:"탐욕적: 매 순간 목표에 가장 가까워 보이는 선택. 빠르지만(루마니아에서 노드 3개 확장) 최적이 아닙니다. 시비우에서 림니쿠빌체아(193)를 지나치고 파가라스(176)를 택한 것이 갈림길이었습니다."},
{id:"3-4-03",s:"3-4",t:"mc",
 q:"Which statements about the time and space complexity of greedy best-first search are correct?",
 k:"탐욕적 최선 우선 탐색의 시간·공간 복잡도에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Worst case time: O(b^m), similar to DFS.","최악의 시간: O(b^m), DFS와 비슷.",1,"맞습니다. h가 엉뚱한 방향을 가리키면 깊이 파고듭니다."],
    ["Best case time: O(bm), when h(n) is 100% accurate.","최선의 시간: O(bm), h(n)이 100% 정확할 때.",1,"맞습니다. 해 경로 하나만 따라 내려갑니다."],
    ["Best case time: O(1), because a perfect heuristic needs no expansion.","최선의 시간: O(1), 완벽한 휴리스틱은 확장이 필요 없기 때문.",0,"틀렸습니다. 완벽해도 경로를 따라 단계마다 자식 b개를 만들어 봐야 하므로 O(bm)."],
    ["Its space complexity is always much smaller than its time complexity.","공간 복잡도는 항상 시간 복잡도보다 훨씬 작다.",0,"틀렸습니다. 슬라이드: 공간 복잡도는 시간 복잡도와 같다."],
    ["Worst case time: O(b^d), exactly like BFS.","최악의 시간: O(b^d), BFS와 똑같다.",0,"틀렸습니다. 최악은 O(b^m)입니다. (O(b^d)는 A*의 최악으로 제시됨)"]],
 e:"탐욕적 탐색의 성능은 h의 품질에 달려 있습니다. 완벽한 h면 곧장 목표로(O(bm)), 엉터리 h면 DFS처럼 헤맵니다(O(b^m)). 공간 = 시간."},
{id:"3-4-04",s:"3-4",t:"mc",
 q:"Which statements about A* search are correct?",
 k:"A* 탐색에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It orders the frontier by f(n) = g(n) + h(n).","f(n) = g(n) + h(n)으로 프런티어를 정렬한다.",1,"맞습니다."],
    ["It is cost-optimal if h is admissible.","h가 허용 가능하면 비용 최적이다.",1,"맞습니다."],
    ["It performs the goal test when a node is popped from the frontier.","노드를 프런티어에서 꺼낼 때 목표 검사를 한다.",1,"맞습니다. 그래서 450짜리 부쿠레슈티를 만들고도 바로 반환하지 않았습니다."],
    ["On the Romania map, A* expands Fagaras before Rimnicu Vilcea.","루마니아 지도에서 A*는 림니쿠빌체아보다 파가라스를 먼저 확장한다.",0,"틀렸습니다. f(림니쿠빌체아) = 413 < f(파가라스) = 415이므로 림니쿠빌체아가 먼저입니다."],
    ["Its main practical weakness is space: it keeps all nodes in memory.","현실적인 가장 큰 약점은 공간이다: 모든 노드를 메모리에 유지한다.",1,"맞습니다."]],
 e:"A*는 '온 거리(g) + 남은 거리 추정(h)'으로 이미 비싸진 길을 자동으로 피합니다. h(n) = 0이면 A* = UCS."},
{id:"3-4-05",s:"3-4",t:"mc",
 q:"Which statements about the A* trace on the Romania map are correct?",
 k:"루마니아 지도에서의 A* 진행에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["After expanding Sibiu: Rimnicu Vilcea has f = 413 and Fagaras has f = 415.","시비우 확장 후: 림니쿠빌체아 f = 413, 파가라스 f = 415.",1,"맞습니다. 220+193, 239+176."],
    ["Bucharest first enters the frontier with f = 450, via Fagaras.","부쿠레슈티는 처음에 파가라스를 거쳐 f = 450으로 프런티어에 들어온다.",1,"맞습니다."],
    ["A* returns the 450-mile route as soon as Bucharest is generated.","A*는 부쿠레슈티가 생성되자마자 450마일 경로를 반환한다.",0,"틀렸습니다. 꺼낼 때 검사하므로 f = 417인 피테슈티가 먼저 꺼내집니다."],
    ["Pitesti (f = 417) is expanded before Bucharest (f = 450).","피테슈티(f = 417)가 부쿠레슈티(f = 450)보다 먼저 확장된다.",1,"맞습니다."],
    ["The final path found costs 418 miles.","최종적으로 찾은 경로의 비용은 418마일이다.",1,"맞습니다. 450 → 418로 갱신된 뒤 꺼내져 반환됩니다."]],
 e:"꺼낸 순서: 아라드 366 → 시비우 393 → 림니쿠빌체아 413 → 파가라스 415 → 피테슈티 417 → 부쿠레슈티 418. 5개 노드를 확장해 최적 경로를 찾았습니다."},
{id:"3-4-06",s:"3-4",t:"mc",
 q:"Which statements about admissible heuristics are correct?",
 k:"허용 가능한(admissible) 휴리스틱에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["h is admissible if h(n) ≤ h*(n) for every node n, where h* is the true cost to the goal.","모든 노드 n에 대해 h(n) ≤ h*(n)이면 h는 허용 가능하다(h* = 목표까지의 실제 비용).",1,"맞습니다."],
    ["Straight-line distance is admissible for road distance.","직선 거리는 도로 거리에 대해 허용 가능하다.",1,"맞습니다. 절대 과대평가하지 않습니다."],
    ["h(n) = 0 for all n is admissible (and makes A* behave like UCS).","모든 n에서 h(n) = 0은 허용 가능하다(그리고 A*를 UCS처럼 만든다).",1,"맞습니다. 정보는 없지만 과대평가하지 않습니다."],
    ["h(n) = 2 × straight-line distance is admissible.","h(n) = 2 × 직선 거리는 허용 가능하다.",0,"틀렸습니다. h(아라드) = 732 > 418로 과대평가합니다."],
    ["Manhattan distance is admissible on a grid where diagonal moves are allowed.","대각선 이동이 허용되는 격자에서 맨해튼 거리는 허용 가능하다.",0,"틀렸습니다. 대각선 1칸이면 되는 것을 2칸으로 과대평가합니다."]],
 e:"허용 가능한 휴리스틱 = 하한(lower bound), 낙관적. 과대평가하면 최적 경로 위의 노드가 뒤로 밀려 덜 좋은 목표를 먼저 반환할 수 있습니다."},
{id:"3-4-07",s:"3-4",t:"mc",
 q:"Which statements about consistent heuristics are correct?",
 k:"일관적(consistent) 휴리스틱에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["h is consistent if h(n) ≤ c(n, a, n′) + h(n′) for every node n and successor n′.","모든 노드 n과 후속 노드 n′에 대해 h(n) ≤ c(n, a, n′) + h(n′)이면 h는 일관적이다.",1,"맞습니다."],
    ["Consistency is a form of the triangle inequality.","일관성은 삼각 부등식의 한 형태다.",1,"맞습니다."],
    ["Consistency implies admissibility.","일관성은 허용성을 함축한다.",1,"맞습니다."],
    ["Admissibility implies consistency.","허용성은 일관성을 함축한다.",0,"틀렸습니다. 예: S→A(1)→G(3), h(S)=4, h(A)=1은 허용적이지만 4 ≤ 1+1이 거짓이라 일관적이지 않습니다."],
    ["With a consistent h, f can decrease along a path.","일관적인 h에서는 경로를 따라 f가 감소할 수 있다.",0,"틀렸습니다. 일관적이면 f가 경로를 따라 절대 줄지 않습니다(단조)."]],
 e:"일관성(단조성): 한 걸음 갈 때 h가 그 걸음의 비용보다 더 많이 줄어들지 않는다. 그러면 처음 꺼낸 경로가 이미 최적 경로라서 재확장이 필요 없습니다."},
{id:"3-4-08",s:"3-4",t:"mc",
 q:"Which statements about the proof that A* is optimal (with an admissible h) are correct?",
 k:"(허용 가능한 h에서) A*가 최적이라는 증명에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It is a proof by contradiction (reductio ad absurdum).","귀류법(reductio ad absurdum)에 의한 증명이다.",1,"맞습니다."],
    ["It shows that every node n on the optimal path satisfies f(n) ≤ C*.","최적 경로 위의 모든 노드 n이 f(n) ≤ C*를 만족함을 보인다.",1,"맞습니다."],
    ["A suboptimal goal G₂ has f(G₂) = g(G₂) > C*, so it is popped after the optimal-path nodes.","더 나쁜 목표 G₂는 f(G₂) = g(G₂) > C*이므로 최적 경로 노드들보다 나중에 꺼내진다.",1,"맞습니다. h(G₂) = 0이기 때문입니다."],
    ["The key step uses the assumption that h overestimates the true cost.","핵심 단계는 h가 실제 비용을 과대평가한다는 가정을 사용한다.",0,"틀렸습니다. 허용성, 즉 h(n) ≤ h*(n)(과대평가하지 않음)을 사용합니다."],
    ["C* is defined as g*(n) + h*(n) for a node n on the optimal path.","최적 경로 위의 노드 n에 대해 C*는 g*(n) + h*(n)이다.",1,"맞습니다."]],
 e:"(1) f(n) > C*라 가정 (2) f = g + h (3) = g* + h (4) ≤ g* + h* (허용성) (5) ≤ C* → (1)과 (5) 모순. 루마니아: 최적 경로 위 노드는 모두 f ≤ 418, 가짜 목표는 450."},
{id:"3-4-09",s:"3-4",t:"mc",
 q:"BEST-FIRST-SEARCH(problem, f): which choices of f give which algorithm?",
 k:"BEST-FIRST-SEARCH(problem, f)에서 f를 어떻게 정하면 어떤 알고리즘이 되는가? 옳은 것을 모두 고르시오.",
 o:[["f(n) = g(n) → uniform-cost search","f(n) = g(n) → 균일 비용 탐색",1,"맞습니다. 이미 지불한 비용으로 정렬."],
    ["f(n) = h(n) → greedy best-first search","f(n) = h(n) → 탐욕적 최선 우선 탐색",1,"맞습니다. 남은 추정 비용으로 정렬."],
    ["f(n) = g(n) + h(n) → A* search","f(n) = g(n) + h(n) → A* 탐색",1,"맞습니다."],
    ["f(n) = g(n) → greedy best-first search","f(n) = g(n) → 탐욕적 최선 우선 탐색",0,"틀렸습니다. g만 쓰면 UCS입니다."],
    ["A* needs a completely different loop and frontier from UCS.","A*는 UCS와 완전히 다른 반복문과 프런티어가 필요하다.",0,"틀렸습니다. 같은 루프, 같은 프런티어, 같은 EXPAND이고 정렬 키만 바뀝니다."]],
 e:"세 가지 전략, 하나의 루프. UCS = 과거(g)만, 탐욕적 = 미래 추정(h)만, A* = 과거 + 미래(g + h)."},
{id:"3-4-10",s:"3-4",t:"sa",
 q:"How many miles long is the route found by greedy best-first search from Arad to Bucharest?",
 k:"탐욕적 최선 우선 탐색이 아라드에서 부쿠레슈티까지 찾은 경로는 몇 마일인가?",
 a:["450","450miles","450마일"],show:"450",
 e:"아라드 → 시비우 → 파가라스 → 부쿠레슈티 = 140 + 99 + 211 = 450마일. 최적(418)보다 32마일 깁니다."},
{id:"3-4-11",s:"3-4",t:"sa",
 q:"In the Romania A* example, what is f(Rimnicu Vilcea) right after Sibiu is expanded? (g = 220, h = 193)",
 k:"루마니아 A* 예제에서 시비우를 확장한 직후 f(림니쿠빌체아)는? (g = 220, h = 193)",
 a:["413"],show:"413",
 e:"f = g + h = 220 + 193 = 413. 파가라스는 239 + 176 = 415이므로 A*는 림니쿠빌체아를 먼저 확장합니다 — 여기서 탐욕적 탐색과 갈립니다."},
{id:"3-4-12",s:"3-4",t:"sa",
 q:"A heuristic that never overestimates the true cost to reach the goal is called ______. (one word)",
 k:"목표에 도달하는 실제 비용을 절대 과대평가하지 않는 휴리스틱을 ______하다고 한다. (한 단어)",
 a:["admissible","허용가능","허용적","허용가능한"],show:"admissible",
 e:"허용 가능한(admissible) 휴리스틱: h(n) ≤ h*(n). 정리 — h가 허용 가능하면 A*는 최적이다."},
{id:"3-4-13",s:"3-4",t:"sa",
 q:"If you set h(n) = 0 for every node, A* behaves exactly like which uninformed algorithm? (abbreviation or full name)",
 k:"모든 노드에서 h(n) = 0으로 두면 A*는 어떤 무정보 탐색 알고리즘과 똑같이 동작하는가? (약어 또는 전체 이름)",
 a:["UCS","uniform cost search","uniform-cost search","uniformcost","dijkstra","dijkstra's algorithm","균일비용탐색"],show:"UCS (uniform-cost search)",
 e:"f = g + 0 = g이므로 균일 비용 탐색(UCS)이 됩니다. UCS는 '힌트가 전혀 없는 A*'입니다."},
/* ===================== 4-1 Local Search & Continuous Spaces ===================== */
{id:"4-1-01",s:"4-1",t:"mc",
 q:"Which statements about local search are correct?",
 k:"지역 탐색에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It works from the current state and moves to a neighboring state.","현재 상태에서 출발해 이웃 상태로 이동한다.",1,"맞습니다."],
    ["It does not keep the path, and the sequence of states reached does not matter.","경로를 저장하지 않고, 거쳐 온 상태 순서도 중요하지 않다.",1,"맞습니다. 목표 상태 자체가 해입니다."],
    ["It uses very little memory and can work even in an infinite (continuous) state space.","메모리를 거의 쓰지 않고 무한(연속) 공간에서도 동작한다.",1,"맞습니다."],
    ["It is systematic and always guaranteed to find a solution if one exists.","체계적이며 해가 있으면 반드시 찾는다.",0,"틀렸습니다. 체계적이지 않아 해를 못 찾을 수도 있습니다."],
    ["It is well suited to optimization problems — finding the best state by an objective function.","목적 함수로 최선의 상태를 찾는 최적화 문제에 적합하다.",1,"맞습니다."]],
 e:"지역 탐색은 경로가 아니라 '좋은 상태 자체'를 찾습니다. 현재 상태 하나만 들고 이웃으로 옮겨 가므로 메모리가 적지만, 체계적이지 않아 완전하지 않습니다."},
{id:"4-1-02",s:"4-1",t:"mc",
 q:"Which statements about how local search differs from tree search are correct?",
 k:"지역 탐색이 트리 탐색과 다른 점으로 옳은 것을 모두 고르시오.",
 o:[["Local search stores only the current state, so its space complexity is constant.","지역 탐색은 현재 상태만 저장해 공간 복잡도가 상수다.",1,"맞습니다."],
    ["BFS and A* need a frontier plus a reached table, which is O(b^d).","BFS와 A*는 프런티어+reached 표가 필요해 O(b^d)다.",1,"맞습니다."],
    ["In local search there is often no explicit initial state, and the path cost does not matter.","지역 탐색에는 명시적 초기 상태가 없을 때가 많고 경로 비용이 중요하지 않다.",1,"맞습니다."],
    ["Local search builds and stores a full search tree like BFS.","지역 탐색은 BFS처럼 전체 탐색 트리를 만들어 저장한다.",0,"틀렸습니다. 탐색 트리가 없고 현재 상태만 유지합니다."],
    ["Each state's utility (score) is known or can be computed.","각 상태의 효용(점수)을 알거나 계산할 수 있다.",1,"맞습니다."]],
 e:"가장 큰 차이는 메모리입니다. 트리 탐색은 프런티어·reached를 들고 있어야 하지만, 지역 탐색은 현재 상태 하나라 상수 공간입니다."},
{id:"4-1-03",s:"4-1",t:"mc",
 q:"On the state-space landscape, which statements are correct?",
 k:"상태 공간 지형에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["The objective function is treated as elevation (height).","목적 함수를 높이(고도)로 본다.",1,"맞습니다."],
    ["The goal of local search is the global maximum.","지역 탐색의 목표는 전역 최댓값이다.",1,"맞습니다."],
    ["A local maximum is higher than its neighbors but lower than the global maximum.","지역 최댓값은 이웃보다 높지만 전역 최댓값보다는 낮다.",1,"맞습니다."],
    ["A plateau is always a point from which further progress is impossible.","고원은 언제나 더 나아갈 수 없는 지점이다.",0,"틀렸습니다. 어깨(shoulder)처럼 아직 나아갈 수 있는 평평한 구역도 있습니다."],
    ["One way to escape a local maximum is to restart hill climbing from a random state.","지역 최댓값을 벗어나는 한 방법은 임의 상태에서 다시 오르는 것이다.",1,"맞습니다(random restart)."]],
 e:"지형 비유에서 global maximum이 목표이고, local maximum·ridge·plateau는 갇히기 쉬운 함정입니다. plateau 중 shoulder는 빠져나갈 수 있습니다."},
{id:"4-1-04",s:"4-1",t:"mc",
 q:"Which statements about hill-climbing search are correct?",
 k:"언덕 오르기 탐색에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["It repeatedly moves to the best neighboring state and quits when no neighbor is better.","가장 좋은 이웃으로 반복 이동하고, 더 나은 이웃이 없으면 멈춘다.",1,"맞습니다."],
    ["It is greedy: it follows the objective function alone and never looks ahead.","탐욕적이다: 목적 함수만 보고 앞을 내다보지 않는다.",1,"맞습니다."],
    ["It keeps a frontier of unexpanded nodes like best-first search.","최선 우선처럼 미확장 노드의 프런티어를 유지한다.",0,"틀렸습니다. 프런티어가 없고 현재 상태만 유지합니다."],
    ["It is complete and optimal.","완전하고 최적이다.",0,"틀렸습니다. 지역 최댓값·능선·고원에 갇힐 수 있어 둘 다 아닙니다."],
    ["It can get stuck at a local maximum, a ridge, or a plateau.","지역 최댓값·능선·고원에 갇힐 수 있다.",1,"맞습니다."]],
 e:"언덕 오르기는 앞을 안 보는 탐욕적 지역 탐색이라 가까운 봉우리까지만 갑니다. 완전하지도 최적이지도 않습니다."},
{id:"4-1-05",s:"4-1",t:"mc",
 q:"Which statements about hill-climbing variants and the n-queens heuristic are correct?",
 k:"언덕 오르기 변형과 N-퀸 휴리스틱에 대해 옳은 것을 모두 고르시오.",
 o:[["Steepest-ascent generates all successors and takes the highest-valued one.","최대 경사는 모든 후계를 만들어 값이 가장 높은 것을 택한다.",1,"맞습니다."],
    ["First-choice stochastic generates one random successor at a time and moves only if it is better.","첫 선택 확률적은 무작위 후계를 하나씩 만들어 더 좋을 때만 이동한다.",1,"맞습니다. 후계가 많을 때 유리합니다."],
    ["For n-queens, the heuristic h is the number of conflicts (attacking pairs).","N-퀸에서 휴리스틱 h는 충돌(서로 공격하는 쌍) 수다.",1,"맞습니다."],
    ["For n-queens, a solution is reached when h is maximized.","N-퀸은 h가 최대일 때 해에 도달한다.",0,"틀렸습니다. h=0(충돌 없음)일 때 해입니다. 최소화 문제입니다."],
    ["Stochastic hill climbing chooses at random among the uphill moves.","확률적 언덕 오르기는 오르막 이동 중 무작위로 고른다.",1,"맞습니다."]],
 e:"변형은 '후계를 몇 개 만들고 어느 것을 택하느냐'로 갈립니다. N-퀸은 충돌 수 h를 0으로 줄이는 최소화 문제입니다."},
{id:"4-1-06",s:"4-1",t:"mc",
 q:"Which statements about simulated annealing are correct?",
 k:"담금질 모사에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["A bad move is accepted with probability exp(-ΔE / T).","나쁜 이동은 확률 exp(-ΔE / T)로 수용된다.",1,"맞습니다."],
    ["The temperature T is lowered over time, so bad moves are accepted less often as the search goes on.","온도 T를 시간에 따라 낮춰, 진행될수록 나쁜 이동을 덜 받아들인다.",1,"맞습니다."],
    ["Accepting some bad moves lets the search climb out of a local optimum.","나쁜 이동을 일부 받아들이면 지역 최적을 벗어날 수 있다.",1,"맞습니다."],
    ["At a high temperature almost no move is accepted.","높은 온도에서는 거의 어떤 이동도 받아들이지 않는다.",0,"틀렸습니다. 높은 T에서는 거의 다 받아들여 자유롭게 돌아다닙니다."],
    ["If the temperature falls slowly enough, it finds the global optimum (though usually too slowly in practice).","온도가 충분히 천천히 내려가면 전역 최적을 찾는다(실무에선 보통 너무 느림).",1,"맞습니다."]],
 e:"담금질 모사는 '나쁜 이동도 가끔 허용'해 봉우리를 넘고, 온도를 낮춰 점점 보수적으로 만듭니다. 이론적 전역 최적 보장은 실용적이지 않을 만큼 느립니다."},
{id:"4-1-07",s:"4-1",t:"mc",
 q:"Which statements about local beam search and genetic algorithms are correct?",
 k:"지역 빔 탐색과 유전 알고리즘에 대해 옳은 것을 모두 고르시오.",
 o:[["Local beam search keeps k states in parallel and keeps the best k of all their successors each step.","지역 빔 탐색은 k개 상태를 병렬로 유지하고, 매 단계 모든 후계 중 best k를 남긴다.",1,"맞습니다."],
    ["Local beam search shares information across the k states, unlike k independent random restarts.","k개의 독립 재시작과 달리 지역 빔 탐색은 k개 상태가 정보를 공유한다.",1,"맞습니다."],
    ["A genetic algorithm uses reproduction, crossover, and mutation over a population.","유전 알고리즘은 개체군에 재생산·교차·돌연변이를 쓴다.",1,"맞습니다."],
    ["If the beam width k is too small, local beam search approaches exhaustive search.","빔 폭 k가 너무 작으면 완전 탐색에 가까워진다.",0,"틀렸습니다. k가 너무 작으면 지역 최적으로 붕괴하고, 너무 크면 완전 탐색에 가까워집니다."],
    ["In a genetic algorithm, crossover recombines two parents at a random point.","유전 알고리즘에서 교차는 두 부모를 임의 지점에서 재조합한다.",1,"맞습니다."]],
 e:"지역 빔 탐색은 k개를 '함께' 돌리며 정보를 공유합니다. 유전 알고리즘은 상태를 쪼개 재조합(crossover)하고 변이(mutation)를 줍니다."},
{id:"4-1-08",s:"4-1",t:"mc",
 q:"Which statements about local search in continuous spaces are correct?",
 k:"연속 공간에서의 지역 탐색에 대해 옳은 것을 모두 고르시오.",
 o:[["In a continuous space the state is a vector of real numbers, so there is no finite list of successors.","연속 공간에서 상태는 실수 벡터라 유한한 후계 목록이 없다.",1,"맞습니다."],
    ["Discretization lays a grid of spacing δ so the problem becomes an ordinary graph search.","이산화는 간격 δ 격자를 깔아 문제를 평범한 그래프 탐색으로 바꾼다.",1,"맞습니다."],
    ["Gradient descent updates the state by x ← x − α·∇f(x).","경사 하강은 x ← x − α·∇f(x)로 상태를 갱신한다.",1,"맞습니다."],
    ["Gradient descent and Newton-Raphson always find the global optimum, even in non-convex spaces.","경사 하강과 뉴턴-랩슨은 비볼록 공간에서도 항상 전역 최적을 찾는다.",0,"틀렸습니다. 비볼록에서는 지역 최적에 갇혀, 담금질·모멘텀으로 탈출합니다."],
    ["Newton-Raphson uses the inverse Hessian as an optimal step size.","뉴턴-랩슨은 헤시안 역행렬을 최적 보폭으로 쓴다.",1,"맞습니다."]],
 e:"연속 공간은 이웃이 무한하므로 '이산화' 또는 '기울기(경사)'로 다룹니다. 비볼록이면 경사법도 지역 최적에 갇힙니다."},
{id:"4-1-09",s:"4-1",t:"sa",
 q:"In n-queens, the heuristic h counts the number of ______ (attacking queen pairs). The goal is h = 0.",
 k:"N-퀸에서 휴리스틱 h는 ______(서로 공격하는 퀸 쌍)의 수를 센다. 목표는 h = 0. (한 단어)",
 a:["conflicts","conflict","충돌"],show:"conflicts (충돌)",
 e:"h = 충돌(conflict) 수. 충돌이 0이면 어떤 퀸도 서로 공격하지 않으니 해입니다."},
{id:"4-1-10",s:"4-1",t:"sa",
 q:"In simulated annealing, a bad move is accepted with probability exp(-ΔE / T), where T is the ______.",
 k:"담금질 모사에서 나쁜 이동은 exp(-ΔE / T)의 확률로 수용되며, 여기서 T는 ______이다. (한 단어)",
 a:["temperature","temp","온도"],show:"temperature (온도)",
 e:"T는 온도(temperature). 높으면 나쁜 이동도 거의 수용, 낮으면 거의 거부합니다."},
{id:"4-1-11",s:"4-1",t:"sa",
 q:"Running hill climbing from several random initial states and returning the best result is called ______ hill climbing. (two words)",
 k:"여러 임의 초기 상태에서 언덕 오르기를 돌려 가장 좋은 결과를 반환하는 방법을 ______ 언덕 오르기라 한다. (영어 두 단어)",
 a:["random restart","randomrestart","random-restart","무작위재시작","무작위 재시작"],show:"random restart",
 e:"random-restart hill climbing: 갇히면 다른 출발점에서 다시 시도해 결국 전역 최댓값을 만납니다."},
{id:"4-1-12",s:"4-1",t:"sa",
 q:"Maximizing f(x) is the same as minimizing ______. (write the expression)",
 k:"f(x)를 최대화하는 것은 ______를 최소화하는 것과 같다. (식으로)",
 a:["-f(x)","-f","minus f(x)","negative f(x)","-fx"],show:"-f(x)",
 e:"max f(x) = min −f(x). 부호만 뒤집으면 최대화와 최소화는 같은 문제입니다."},
/* ===================== 4-2 Nondeterminism ===================== */
{id:"4-2-01",s:"4-2",t:"mc",
 q:"Which statements about where uncertainty comes from are correct?",
 k:"불확실성의 출처에 대해 옳은 것을 모두 고르시오.",
 o:[["Nondeterministic actions: the agent cannot determine the state that results from acting.","비결정적 행동: 행동 후 어떤 상태가 될지 결정할 수 없다.",1,"맞습니다."],
    ["Partial observability: the agent is uncertain about the state it is in now.","부분 관찰: 지금 자신이 어느 상태인지 불확실하다.",1,"맞습니다."],
    ["Against uncertainty, a fixed precomputed sequence of actions is enough.","불확실성에는 미리 정한 고정 행동 순열이면 충분하다.",0,"틀렸습니다. 지각에 따라 달라지는 조건부 계획이 필요합니다."],
    ["The agent must track every state it could be in — the belief state.","가능한 모든 상태를 추적해야 한다 — 믿음 상태.",1,"맞습니다."],
    ["A conditional plan (strategy/policy) depends on the percepts.","조건부 계획(전략/정책)은 지각에 의존한다.",1,"맞습니다."]],
 e:"불확실성의 두 출처(비결정적 행동, 부분 관찰) 모두에서 해는 고정 순열이 아니라 조건부 계획이고, belief state를 추적해야 합니다."},
{id:"4-2-02",s:"4-2",t:"mc",
 q:"Which statements about nondeterministic actions and Results(s,a) are correct?",
 k:"비결정적 행동과 Results(s,a)에 대해 옳은 것을 모두 고르시오.",
 o:[["With nondeterministic actions, Results(s,a) returns a set of states rather than one.","비결정적 행동에서 Results(s,a)는 상태 하나가 아니라 집합을 반환한다.",1,"맞습니다."],
    ["For example Results(s1,a) = {s2,s4,s5} means a in s1 can lead to any one of three states.","예: Results(s1,a)={s2,s4,s5}는 s1에서 a가 셋 중 하나로 감을 뜻한다.",1,"맞습니다."],
    ["That returned set of states is a belief state.","반환된 상태 집합이 믿음 상태다.",1,"맞습니다."],
    ["The solution to a nondeterministic problem is a plain sequence of actions.","비결정적 문제의 해는 단순한 행동 순열이다.",0,"틀렸습니다. if-then-else가 있는 조건부 계획(트리)입니다."],
    ["In the deterministic case Result(s,a) was a single state.","결정적 경우 Result(s,a)는 상태 하나였다.",1,"맞습니다."]],
 e:"비결정성은 전이 모델에 담깁니다: Result(단수)→Results(복수, 집합). 그 집합이 belief state이고, 해는 조건부 계획입니다."},
{id:"4-2-03",s:"4-2",t:"mc",
 q:"Which statements about AND-OR search trees are correct?",
 k:"AND-OR 탐색 트리에 대해 옳은 것을 모두 고르시오.",
 o:[["At an OR node the agent chooses one action among several.","OR 노드에서 agent는 여러 행동 중 하나를 고른다.",1,"맞습니다."],
    ["At an AND node the environment chooses, and every possible outcome must be handled.","AND 노드에서는 환경이 고르며, 가능한 모든 결과를 처리해야 한다.",1,"맞습니다."],
    ["A solution is a single path from root to a goal, as in Chapter 3.","해는 3장처럼 루트에서 목표까지의 단일 경로다.",0,"틀렸습니다. 해는 단일 경로가 아니라 부분 트리(조건부 계획)입니다."],
    ["A solution chooses one action at every OR node and covers every outcome at every AND node, ending with leaves that are all goals.","해는 모든 OR에서 행동 하나를 고르고 모든 AND에서 모든 결과를 포괄하며, 잎이 전부 목표다.",1,"맞습니다."],
    ["IS-CYCLE returns failure when a state repeats on the current path.","현재 경로에 상태가 재등장하면 IS-CYCLE이 실패를 반환한다.",1,"맞습니다."]],
 e:"OR=내가 선택(하나면 충분), AND=환경이 선택(모두 대비). 해는 경로가 아니라 부분 트리이고, 순환은 IS-CYCLE로 막습니다."},
{id:"4-2-04",s:"4-2",t:"mc",
 q:"Which statements about the erratic and slippery vacuum worlds are correct?",
 k:"변덕스러운/미끄러운 진공 세계에 대해 옳은 것을 모두 고르시오.",
 o:[["In the erratic world, Suck from state 1 can lead to two states, so a conditional plan is needed.","변덕스러운 세계에서 상태 1의 Suck은 두 상태로 갈 수 있어 조건부 계획이 필요하다.",1,"맞습니다."],
    ["In the slippery world, a movement action sometimes fails and the agent stays put.","미끄러운 세계에서 이동 행동은 가끔 실패해 제자리에 머문다.",1,"맞습니다."],
    ["The slippery world has an acyclic solution found by basic AND-OR search.","미끄러운 세계는 기본 AND-OR 탐색이 찾는 비순환 해가 있다.",0,"틀렸습니다. 비순환 해가 없어 기본 AND-OR는 실패를 반환합니다."],
    ["A cyclic solution like [Suck, while State=5 do Right, Suck] can solve the slippery world.","[Suck, State=5인 동안 Right, Suck] 같은 순환 해가 미끄러운 세계를 풀 수 있다.",1,"맞습니다."],
    ["This is why a plan is better thought of as a program than as a list.","그래서 계획을 리스트보다 프로그램으로 보는 것이 낫다.",1,"맞습니다. 분기와 반복이 필요합니다."]],
 e:"변덕스러운 세계는 분기(if)가, 미끄러운 세계는 반복(while)이 필요합니다. 그래서 '계획 = 프로그램'입니다."},
{id:"4-2-05",s:"4-2",t:"sa",
 q:"In a nondeterministic world, the transition function Results(s,a) returns a ______ of states instead of one. (one word)",
 k:"비결정적 세계에서 전이 함수 Results(s,a)는 상태 하나가 아니라 상태들의 ______을 반환한다. (한 단어)",
 a:["set","집합"],show:"set (집합)",
 e:"Results(s,a)는 상태들의 집합(set)을 반환하고, 그 집합이 belief state입니다."},
{id:"4-2-06",s:"4-2",t:"sa",
 q:"The set of all states the agent could currently be in is called the ______ ______. (two words)",
 k:"agent가 현재 있을 수 있는 모든 상태의 집합을 ______ ______라고 한다. (영어 두 단어)",
 a:["belief state","beliefstate","믿음상태","믿음 상태"],show:"belief state (믿음 상태)",
 e:"belief state(믿음 상태): 실제 상태는 몰라도 '이 중 하나'임은 아는 상태들의 집합입니다."},
{id:"4-2-07",s:"4-2",t:"sa",
 q:"At which node type does the ENVIRONMENT choose, so that every outcome must be handled — OR or AND? (one word)",
 k:"환경이 선택하여 모든 결과를 다 처리해야 하는 노드는 OR과 AND 중 무엇인가? (한 단어)",
 a:["and","and node","앤드","AND 노드"],show:"AND",
 e:"AND 노드 = 환경이 고름 → 모든 결과에 대비. OR 노드 = agent가 고름 → 하나만 성공하면 됨."},
/* ===================== 4-3 Partial Observability ===================== */
{id:"4-3-01",s:"4-3",t:"mc",
 q:"Which statements about sensorless (conformant) problems are correct?",
 k:"무감각(컨포먼트) 문제에 대해 옳은 것을 모두 고르시오.",
 o:[["In a sensorless problem the agent has no percepts at all.","무감각 문제에서 agent는 지각이 전혀 없다.",1,"맞습니다."],
    ["The idea is to find a plan that works whatever state you are in, then execute it blind.","어떤 상태든 통하는 계획을 찾아 눈 감고 실행하는 것이 핵심이다.",1,"맞습니다."],
    ["Because there are no observations, no conditional plan is needed — a plain sequence suffices.","관찰이 없으므로 조건부 계획이 불필요하고 단순 순열로 충분하다.",1,"맞습니다."],
    ["A sensorless agent must branch on its percepts at every step.","무감각 agent는 매 단계 지각에 따라 분기해야 한다.",0,"틀렸습니다. 지각이 없으니 분기할 것이 없습니다."],
    ["Prescribing a broad-spectrum antibiotic without a slow test is a conformant-style idea.","느린 검사 없이 광범위 항생제를 처방하는 것이 컨포먼트식 발상이다.",1,"맞습니다."]],
 e:"무감각 문제는 지각이 없으니 분기가 필요 없고, '어느 상태든 통하는' 순수 행동 순열이면 됩니다."},
{id:"4-3-02",s:"4-3",t:"mc",
 q:"Which statements about belief states and narrowing them are correct?",
 k:"믿음 상태와 그 좁히기에 대해 옳은 것을 모두 고르시오.",
 o:[["An action can reduce the number of possible states in the belief state.","행동이 믿음 상태의 가능한 상태 수를 줄일 수 있다.",1,"맞습니다."],
    ["In the unobservable vacuum world, after Right the states where the agent was on the left collapse onto the others.","관찰 불가 진공 세계에서 Right 후 왼쪽에 있던 상태들이 나머지에 합쳐진다.",1,"맞습니다."],
    ["The belief-state space is the power set of the N states, so its size is 2^N.","믿음 상태 공간은 N개 상태의 멱집합이라 크기가 2^N이다.",1,"맞습니다."],
    ["All 2^N belief states are typically reachable by acting.","2^N개의 믿음 상태가 보통 모두 행동으로 도달 가능하다.",0,"틀렸습니다. 실제 도달 가능한 것은 훨씬 적습니다(예: 256 중 12개).",],
    ["The sequence [Right, Suck, Left, Suck] forces the vacuum world into a goal state whatever it started in.","[Right, Suck, Left, Suck]는 어디서 시작하든 진공 세계를 목표로 몰아넣는다.",1,"맞습니다."]],
 e:"관찰이 없어도 행동 자체가 가능성을 좁혀, 믿음 상태를 목표 한 점으로 몰아넣는 순열이 해가 됩니다. 믿음 상태 공간은 2^N이지만 도달 가능한 것은 일부입니다."},
{id:"4-3-03",s:"4-3",t:"mc",
 q:"Which statements about percepts and the predict/update cycle are correct?",
 k:"지각과 예측/갱신 주기에 대해 옳은 것을 모두 고르시오.",
 o:[["Fully observable means Percept(s) = s; sensorless means Percept(s) = None.","완전 관찰은 Percept(s)=s, 무감각은 Percept(s)=None이다.",1,"맞습니다."],
    ["Predict uses an action to get the resulting belief state; update keeps only states consistent with the observation.","예측은 행동으로 결과 믿음 상태를 얻고, 갱신은 관찰과 모순 없는 상태만 남긴다.",1,"맞습니다."],
    ["Update always comes before predict.","갱신이 항상 예측보다 먼저다.",0,"틀렸습니다. agent는 행동하고 나서 관찰하므로 predict가 먼저입니다."],
    ["Keeping the belief state up to date while acting is called monitoring, filtering, or state estimation.","행동하며 믿음 상태를 갱신하는 것을 monitoring/filtering/state estimation이라 한다.",1,"맞습니다."],
    ["In partial observability, a single observation always pins the state down exactly.","부분 관찰에서는 관찰 하나가 언제나 상태를 정확히 특정한다.",0,"틀렸습니다. 같은 관찰을 내는 상태가 여럿일 수 있습니다.",]],
 e:"부분 관찰의 핵심 루프는 predict(행동으로 퍼짐) → update(관찰로 쳐냄)이고, predict가 먼저입니다. 이 추적을 monitoring/filtering이라 합니다."},
{id:"4-3-04",s:"4-3",t:"mc",
 q:"Which statements about planning in belief-state space are correct?",
 k:"믿음 상태 공간에서의 계획에 대해 옳은 것을 모두 고르시오.",
 o:[["It can be formulated as an ordinary search and solved with DFS, IDS, BFS or A*.","보통의 탐색으로 만들어 DFS/IDS/BFS/A*로 풀 수 있다.",1,"맞습니다."],
    ["The goal test asks whether the belief state contains only goal states.","목표 검사는 믿음 상태가 목표 상태만 포함하는지 묻는다.",1,"맞습니다."],
    ["If a belief state has a solution, so does every subset of it, by the same action sequence.","어떤 믿음 상태에 해가 있으면 그 부분집합에도 같은 행동 순열로 해가 있다.",1,"맞습니다."],
    ["A partially observable problem is solved with a conditional plan built from an AND-OR tree over belief states.","부분 관찰 문제는 믿음 상태 위의 AND-OR 트리로 만든 조건부 계획으로 푼다.",1,"맞습니다."],
    ["Because the belief-state space is small, this scales easily to large problems.","믿음 상태 공간이 작아서 큰 문제로 쉽게 확장된다.",0,"틀렸습니다. 2^N이라 큰 문제에는 비현실적입니다.",]],
 e:"belief state를 하나의 상태로 보면 3장 탐색을 그대로 적용합니다. 부분집합·상위집합 관계로 가지치기하지만, 2^N 때문에 큰 문제엔 비쌉니다."},
{id:"4-3-05",s:"4-3",t:"sa",
 q:"The two steps that keep the belief state current are PREDICT with an action and ______ with an observation. (one word)",
 k:"믿음 상태를 갱신하는 두 단계는 행동으로 하는 PREDICT와 관찰로 하는 ______이다. (한 단어)",
 a:["update","갱신","업데이트"],show:"UPDATE (갱신)",
 e:"b ← Update(Predict(b,a), o). 행동 후 관찰하므로 predict가 먼저, update가 나중입니다."},
{id:"4-3-06",s:"4-3",t:"sa",
 q:"Keeping track of the belief state while acting and receiving percepts is called monitoring, filtering, or state ______. (one word)",
 k:"행동하며 지각을 받는 동안 믿음 상태를 추적하는 것을 monitoring, filtering, 또는 state ______이라 한다. (한 단어)",
 a:["estimation","estimate","추정"],show:"estimation (추정)",
 e:"state estimation(상태 추정) = monitoring = filtering. 실시간이라 보통 근사 믿음 상태를 씁니다."},
{id:"4-3-07",s:"4-3",t:"sa",
 q:"For N world states, the size of the belief-state space is ______. (write the expression)",
 k:"세계 상태가 N개일 때 믿음 상태 공간의 크기는 ______이다. (식으로)",
 a:["2^n","2^N","2**n","2n","이의n제곱"],show:"2^N",
 e:"믿음 상태 = 상태들의 멱집합이므로 2^N개. 다만 실제 도달 가능한 것은 훨씬 적습니다."},
/* ===================== 4-4 Online Search ===================== */
{id:"4-4-01",s:"4-4",t:"mc",
 q:"Which statements contrasting offline and online search are correct?",
 k:"오프라인 탐색과 온라인 탐색을 비교한 설명으로 옳은 것을 모두 고르시오.",
 o:[["Offline search builds a plan using the transition model before taking any action.","오프라인 탐색은 행동 전에 전이 모델로 계획을 세운다.",1,"맞습니다."],
    ["In an unknown environment the transition function is not known, so offline search cannot build a plan.","모르는 환경에서는 전이 함수를 몰라 오프라인 탐색이 계획을 세울 수 없다.",1,"맞습니다."],
    ["Online search does no planning; it searches the real world one action at a time.","온라인 탐색은 계획하지 않고 실제 세계를 한 번에 한 행동씩 탐색한다.",1,"맞습니다."],
    ["In online search, offline's predict and update become act and observe.","온라인 탐색에서 오프라인의 예측·갱신은 '행동·관찰'이 된다.",1,"맞습니다."],
    ["Online search is mainly useful when the environment is fully known in advance.","온라인 탐색은 환경을 미리 완전히 알 때 주로 유용하다.",0,"틀렸습니다. 모르는 환경·실시간·비결정적 영역에서 유용합니다.",]],
 e:"전이 함수를 모르면 머릿속 예측이 불가능하므로, 온라인 탐색은 실제로 행동하고 관찰하며 진행합니다."},
{id:"4-4-02",s:"4-4",t:"mc",
 q:"Which statements about the online DFS agent are correct?",
 k:"온라인 DFS 에이전트에 대해 옳은 것을 모두 고르시오.",
 o:[["Its setting is deterministic and fully observable, but result(s,a) is unknown.","설정은 결정적·완전 관찰이지만 result(s,a)를 모른다.",1,"맞습니다."],
    ["It tries actions and records result(s,a) → s′, effectively learning the transition function.","행동을 시도하고 result(s,a)→s′를 기록해 사실상 전이 함수를 학습한다.",1,"맞습니다."],
    ["untried[s] plays the role of the frontier.","untried[s]가 프런티어 역할을 한다.",1,"맞습니다."],
    ["When it reaches a dead end, it can teleport instantly back to any earlier state.","막다른 곳에서 이전 상태로 즉시 순간이동할 수 있다.",0,"틀렸습니다. 순간이동이 안 되므로 왔던 경로를 따라 물리적으로 되돌아갑니다.",],
    ["It remembers where it came from so it can backtrack later.","나중에 되돌아가려고 어디서 왔는지 기억한다.",1,"맞습니다(unbacktracked)."]],
 e:"온라인 DFS는 전이를 모르니 직접 해 보며 result 표를 채웁니다. 막히면 순간이동 대신 왔던 길로 실제로 되돌아갑니다."},
{id:"4-4-03",s:"4-4",t:"mc",
 q:"Which statements about Chapter 4's overall picture are correct?",
 k:"4장 전체 그림에 대해 옳은 것을 모두 고르시오.",
 o:[["Chapter 3 assumed the world is observable, deterministic, and known.","3장은 세상이 관찰 가능·결정적·알려짐이라 가정했다.",1,"맞습니다."],
    ["When the path doesn't matter, only the state, use local search.","경로가 무의미하고 상태만 중요하면 지역 탐색을 쓴다.",1,"맞습니다."],
    ["When the action outcome is not unique, use belief states and AND-OR search with a conditional plan.","행동 결과가 유일하지 않으면 믿음 상태와 AND-OR 탐색, 조건부 계획을 쓴다.",1,"맞습니다."],
    ["When the model itself is unknown, offline search still builds a full plan in advance.","모델 자체를 모를 때도 오프라인 탐색이 미리 완전한 계획을 세운다.",0,"틀렸습니다. 모델을 모르면 온라인 탐색으로 행동하며 result(s,a)를 배웁니다.",],
    ["When the state is not observable, the same belief states are narrowed by predict and update.","상태가 관찰 불가하면 같은 믿음 상태를 predict/update로 좁힌다.",1,"맞습니다."]],
 e:"4장은 3장의 세 전제를 하나씩 없애며 각각 다른 도구(지역 탐색·belief state·AND-OR·predict/update·온라인 탐색)를 꺼냈습니다."},
{id:"4-4-04",s:"4-4",t:"sa",
 q:"In online search, offline's PREDICT and UPDATE are replaced by act and ______. (one word)",
 k:"온라인 탐색에서 오프라인의 PREDICT와 UPDATE는 '행동'과 ______으로 바뀐다. (한 단어)",
 a:["observe","observation","관찰"],show:"observe (관찰)",
 e:"머릿속 predict/update가 실제 act/observe가 됩니다 — 예측 대신 직접 해 보고 결과를 관찰합니다."},
{id:"4-4-05",s:"4-4",t:"sa",
 q:"In the online DFS agent, which variable plays the role of the frontier (actions not yet tried in a state)? untried or result? (one word)",
 k:"온라인 DFS 에이전트에서 프런티어 역할(상태에서 아직 안 해 본 행동)을 하는 변수는? untried와 result 중 (한 단어)",
 a:["untried","untried[s]","언트라이드"],show:"untried",
 e:"untried[s] = 그 상태에서 아직 안 해 본 행동들 = 프런티어. result[s,a]는 배운 전이를 저장하는 표입니다."},
{id:"4-4-06",s:"4-4",t:"sa",
 q:"The online DFS agent repeats the cycle: Explore → Dead End → ______ → Explore a New Path. (one word)",
 k:"온라인 DFS는 '탐험 → 막다른 곳 → ______ → 새 경로 탐험' 주기를 반복한다. (한 단어)",
 a:["backtrack","backtracking","백트랙","되돌아가기"],show:"Backtrack (되돌아가기)",
 e:"막히면 unbacktracked에서 이전 상태를 꺼내 되돌아가(backtrack) 새 길을 탐험합니다."},
/* ===================== 5-1 ===================== */
{id:"5-1-01",s:"5-1",t:"mc",
 q:"Which statements about planning problems and identification problems are correct?",
 k:"계획 문제와 식별 문제에 대한 설명으로 옳은 것을 모두 고르시오.",
 o:[["In a planning problem the answer is a sequence of actions, and the path is the most important.","계획 문제의 답은 행동의 순열이고, 경로가 가장 중요하다.",1,"맞습니다. 경로에 비용과 깊이가 있고, 휴리스틱이 길잡이를 줍니다."],
    ["In an identification problem the goal itself is what matters, not how you got there.","식별 문제에서는 어떻게 도달했는지가 아니라 목표 자체가 중요하다.",1,"맞습니다. 답은 변수에 대한 값 배정입니다."],
    ["CSPs are a specialized class of identification problem.","CSP는 식별 문제의 특수한 한 종류다.",1,"맞습니다."],
    ["In an identification problem, the answer is the sequence of actions that reached the goal.","식별 문제의 답은 목표에 도달한 행동의 순열이다.",0,"틀렸습니다. 그건 계획 문제입니다. 식별 문제의 답은 변수에 대한 값 배정(목표 상태)입니다."],
    ["CSPs are a kind of planning problem because their paths have different costs.","CSP는 경로마다 비용이 달라서 계획 문제의 일종이다.",0,"틀렸습니다. CSP는 식별 문제이고, (일부 정식화에서) 모든 경로가 같은 깊이입니다."]],
 e:"계획 문제 = 행동 순열(경로)이 답, 식별 문제 = 변수 배정(상태)이 답. CSP는 식별 문제의 특수한 종류입니다."},
{id:"5-1-02",s:"5-1",t:"mc",
 q:"Which statements correctly compare a standard search problem with a CSP?",
 k:"표준 탐색 문제와 CSP의 비교로 옳은 것을 모두 고르시오.",

/* ---------------- storage (account db when available, browser fallback) ---------------- */
const LS_KEY="ai-intro-wrong-v1";
const Store={
  mode:"local",items:{},coll:null,
  loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS_KEY)||"{}");if(v&&typeof v==="object")this.items=v;}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.items));}catch(e){}},
  async connect(){
    try{
      if(!window.claude||!window.claude.use)return;
      const db=await window.claude.use("db");if(!db)return;
      const user=await window.claude.use("user");if(!user)return;
      const uid=await user.id();if(!uid)return;
      const coll=db.collection("data/users/"+uid);
      const snap=await coll.get();
      const remote={};
      snap.docs.forEach(d=>{const v=d.data();if(v&&v.qid&&QMAP[v.qid])remote[v.qid]=Object.assign({},v);});
      const merged=Object.assign({},remote),push=[];
      for(const [k,v] of Object.entries(this.items)){const r=remote[k];if(!r||(v.updated||0)>(r.updated||0)){merged[k]=v;push.push(k);}}
      this.coll=coll;this.mode="db";this.items=merged;this.saveLocal();
      for(const k of push)await this.write(k);
      refreshBadge();if(curPage==="wrong")renderWrong();
    }catch(e){this.mode="local";}
  },
  async write(qid){
    this.saveLocal();refreshBadge();
    if(this.mode!=="db")return;
    try{const v=this.items[qid];if(v)await this.coll.doc(qid).set(v);else await this.coll.doc(qid).delete();}
    catch(e){this.mode="local";if(curPage==="wrong")renderWrong();}
  },
  record(q,correct,ans){
    const prev=this.items[q.id]?Object.assign({},this.items[q.id]):null;
    const now=Date.now();
    if(!correct){
      const it=this.items[q.id]||{qid:q.id,sec:q.s,wrong:0};
      it.wrong=(it.wrong||0)+1;it.last=now;it.ans=String(ans).slice(0,300);it.resolved=false;it.updated=now;
      this.items[q.id]=it;this.write(q.id);
    }else if(this.items[q.id]&&!this.items[q.id].resolved){
      this.items[q.id].resolved=true;this.items[q.id].updated=now;this.write(q.id);
    }
    return prev;
  },
  restore(qid,prev){
    if(prev)this.items[qid]=Object.assign(prev,{updated:Date.now()});else delete this.items[qid];
    this.write(qid);
  }
};
function unresolvedCount(){return Object.values(Store.items).filter(v=>!v.resolved&&QMAP[v.qid]).length;}
function refreshBadge(){const n=unresolvedCount(),b=$("#wbadge");b.textContent=n;b.hidden=n===0;}

/* ---------------- readability: one sentence per line ---------------- */
const EN_RE=/(?<=(?:[a-z)\]"”'’]|\d{2})[.!?])\s+(?=[A-Z"“(\[0-9])/;
const KO_RE=/(?<=(?:[가-힣a-zA-Z)\]"”'’%]|\d{2})[.!?])\s+(?=\S)/;
function pieces(t,re){
  const out=[];
  t.split(/\s+\/\s+|\s+·\s+/).forEach(p=>p.split(/\s+(?=\d[.)]\s+[A-Za-z가-힣(])|(?<!→)\s+(?=[①②③④⑤])/).forEach(q=>q.split(re).forEach(r=>{r=r.trim();if(r)out.push(r);})));
  const m=[];
  out.forEach(r=>{if(m.length&&r.length<12)m[m.length-1]+=" "+r;else m.push(r);});
  return m;
}
function origHTML(o){
  const li=(g,e,k)=>'<li'+(g?' class="g"':'')+'><span class="e">'+e+'</span><span class="k">'+k+'</span></li>';
  return o.map(([e,k,c],gi)=>{
    if(c)return '<li class="code'+(gi?' g':'')+'"><span class="e pc">'+e.split(' / ').join('\n')+'</span><span class="k kp">'+k.split(' / ').join('<br>')+'</span></li>';
    const pe=pieces(e,EN_RE),pk=pieces(k,KO_RE);
    if(pe.length===pk.length){
      if(pe.length>=3&&pe.every(x=>x.length<=34))return li(gi,pe.join(" · "),pk.join(" · "));
      return pe.map((x,i)=>li(gi&&i===0,x,pk[i])).join("");
    }
    return '<li'+(gi?' class="g"':'')+'>'+pe.map(x=>'<span class="e">'+x+'</span>').join("")+pk.map(x=>'<span class="k">'+x+'</span>').join("")+'</li>';
  }).join("");
}
const SENT=/(?<=(?:[가-힣a-zA-Z)\]%]|\d{2})[.!?](?:<\/\w+>|["”'’)\]])*)\s+(?=\S)/;
const TAGS=["b","i","u","sup","sub","code"];
function balanced(s){return TAGS.every(t=>(s.match(new RegExp("<"+t+"[ >]","g"))||[]).length===(s.match(new RegExp("</"+t+">","g"))||[]).length);}
function sentences(h){
  const out=[];let cur="";
  h.split(/(?<!→)\s+(?=[①②③④⑤])/).forEach(seg=>{
    seg.split(SENT).forEach(p=>{cur=cur?cur+" "+p:p;if(balanced(cur)){out.push(cur);cur="";}});
    if(cur){out.push(cur);cur="";}
  });
  const m=[];
  out.forEach(r=>{if(m.length&&r.replace(/<[^>]+>/g,"").length<10)m[m.length-1]+=" "+r;else m.push(r);});
  return m;
}
function xHTML(x){
  const re=/<(\/?)(div|ul|ol|table)\b[^>]*>|<br\s*\/?>/gi;
  let depth=0,last=0,out="",m;
  const run=s=>{s=s.trim();if(s)sentences(s).forEach(t=>{out+="<p>"+t+"</p>";});};
  while((m=re.exec(x))){
    if(/^<br/i.test(m[0])){if(!depth){run(x.slice(last,m.index));last=m.index+m[0].length;}continue;}
    if(!m[1]){if(!depth){run(x.slice(last,m.index));last=m.index;}depth++;}
    else{depth--;if(!depth){out+=x.slice(last,m.index+m[0].length);last=m.index+m[0].length;}}
  }
  run(x.slice(last));
  return out;
}

const LEC={
"5-1-04":"<ul><li><b>알고리즘이 보는 것과 인간이 보는 것의 차이를 알아야 한다</b>고 강조하셨어요.</li><li>사람은 <b>state</b>를 보면 그 안(청소기 위치, 먼지)을 읽지만, 3~4장 알고리즘에게 state는 블랙박스 — ACTIONS·RESULT·IS_GOAL로만 접근합니다.</li><li>CSP는 알고리즘이 state 안(변수 = 값)을 직접 읽는다는 점이 다릅니다.</li></ul>",
"5-1-05":"<ul><li><b>문법이 있으면 그게 랭귀지(language)</b> — 변수·도메인·제약이라는 정해진 문법이 있으니 CSP는 <b>formal representation language</b>입니다(5쪽).</li><li>왜 이런 형식을 쓰나: <b>일반적인 규칙(범용 알고리즘)을 모든 상황에 적용하고 싶어서</b>. 문제를 같은 형식으로 써 두면 하나의 알고리즘으로 다 풀 수 있습니다.</li></ul>",
"5-1-06":"<ul><li>7쪽 Constraints: adjacent regions must take different colors.</li><li><b>Implicit</b>: 코드 한 조각 — <code>WA ≠ NT</code>.</li><li><b>Explicit</b>: 허용 쌍을 나열한 목록 — (WA, NT) ∈ {(red, green), (red, blue), …}.</li></ul>",
"5-1-08":"<ul><li>핵심은 <b>솔루션(해)을 문제에 얼마나 잘 인코딩하느냐</b>입니다. 같은 N-퀸이라도 변수를 어떻게 잡느냐에 따라 CSP의 질이 달라집니다.</li></ul>",
"5-1-10":"<ul><li>9~10쪽: <b>As much as possible, structure of the solution is encoded in structure of the problem → getting better CSP.</b></li><li>정식화 1 → 2: '퀸이 N개'라는 해의 구조를 변수 개수에 넣었더니 Σ = N 제약이 필요 없어졌습니다. 정식화 3은 '행마다 하나'까지 넣은 것.</li></ul>",
"5-1-13":"<ul><li><b>Binary CSP는 variables</b> 이야기(제약 하나가 변수 몇 개를 묶나), <b>Boolean CSP는 values</b> 이야기(도메인에 값이 몇 개인가). 이름이 비슷해도 기준이 다릅니다.</li></ul>",
"5-1-15":"<ul><li>T W O + T W O = F O U R에서 <b>각 digit(글자)에 숫자를 넣는 문제로 보고 constraints를 직접 만들 수 있어야</b> 합니다.</li><li><b>constraints가 주어지면 제약 그래프를 그릴 수 있어야</b> 합니다.</li></ul>",
"5-1-19":"<ul><li><b>정션(junction, 교차점)에 붙는 리스트가 constraints</b> — 교차점마다 가능한 라벨 조합의 목록.</li><li><b>오목하냐 볼록하냐가 domain</b> — 각 선이 concave(−)인지 convex(+)인지.</li><li><b>Approach</b> 부분(변수·제약·해)을 중요하게 짚으셨어요.</li></ul>",
"3-1-01":"<ul><li>그냥 <b>환경(environment)</b>과 PEAS로 정한 <b>과업 환경(task environment)</b>은 다르다는 점을 짚으셨어요.</li><li>3장은 네 가지 구조 중 <b>목표 기반 에이전트</b>를 설계하는 장입니다.</li></ul>",
"3-1-07":"<ul><li>예시: 미로 속 로봇. 미로가 환경이고, 로봇이 미로 지도를 가지고 있으면 fully observable, 같은 행동이 항상 같은 결과를 내면(갑자기 엉뚱한 쪽으로 미끄러지지 않으면) deterministic입니다.</li><li>세 가정이 모두 성립하면 행동하기 전에 계획 전체를 세울 수 있습니다.</li><li>\"하나라도 깨지면 다음 장(4장)이다.\" 이 세 가정은 단순한 배경이 아니라 <b>이 장 알고리즘이 다룰 수 있는 범위의 경계</b>입니다.</li></ul>",
"3-1-08":"<ul><li>경로 찾기, 칩 배선, 로봇 동작 계획, 번역·음성 인식처럼 서로 달라 보여도 <b>모두 같은 작은 알고리즘 묶음</b>을 씁니다. 결국 대부분 '최단·최저 비용 경로를 찾는 문제'로 설정됩니다.</li></ul>",
"3-1-09":"<ul><li>2장 그림에는 목표(Goals)와 행동 선택 사이에 <b>'Search for a plan' 상자가 없었는데</b>, 이번 장에서 그 자리가 채워집니다.</li><li>식 aᵢ = argmin [ Σ cₜ | s_T ∈ S<sup>goal</sup> ]의 뜻: <b>목표에 도달하는 행동 순열들 중에서만</b> 총비용 합이 가장 작은 것을 고른다.</li><li>이 조건(s_T ∈ S<sup>goal</sup>)이 없으면 <b>아무것도 안 하는 게 항상 가장 싸다</b>(비용 0).</li></ul>",
"3-1-10":"<ul><li>원자적 상태는 1, 2, 3 같은 이름표일 뿐이라 \"상태 안을 들여다보지 않는다, 아직은.\"</li><li>(s, a, s′) 표 읽기: 상태 1에서 South → 2, 2에서 North → 다시 1.</li><li><b>개루프(open-loop)</b> = 계획을 세운 뒤 눈 감고 실행만 하는 것. 환경이 바뀌면 <b>가장 먼저 깨지는 게 개루프</b>입니다.</li><li>반대인 <b>폐루프(closed-loop)</b>는 매 순간 관측해서 보정합니다. 피드백 고리가 닫혀 있다고 보면 됩니다.</li></ul>",
"3-1-11":"<ul><li>이 5요소가 <b>이 수업 끝까지 쓰는 템플릿</b>입니다.</li><li>미로에 대입: 초기 상태 = 시작 위치 · 행동 = N, E, S, W · 전이 모델 = 다음 상태 s′를 주는 함수 · 목표 = 하나일 수도 여럿일 수도 있음 · 비용 = 한 칸에 1.</li><li>지금은 비용이 모두 1이지만, 뒤에서는 <b>행동마다 비용이 다른 경우</b>가 나옵니다.</li><li>상태 공간 자체는 정의하지 않는다는 점을 다시 강조하셨어요(보통 너무 크거나 무한).</li></ul>",
"3-1-12":"<ul><li>그래프를 표로 적는 흔한 방식: 한 행 = '이 노드에서 이 행동을 하면 저 노드'. 그래서 전이 모델 룩업 표가 곧 상태 공간 그래프입니다.</li><li>ACTIONS(4) = {E, S, N}에 W가 없는 건 벽 때문입니다. <b>가능한 행동은 상태에 따라 달라진다</b>(행동 집합은 상태의 함수).</li></ul>",
"3-1-13":"<ul><li>탐색은 실제 세계에서 직접 돌리는 게 아니라 우리가 만든 모형에서 돕니다.</li><li>모델이 많이 틀리면 <b>최적해라도 현실에서는 실패</b>합니다. 탐색이 잘못되는 경우는 대개 모델이 현실적이지 않았기 때문이고, <b>이 이야기는 나중에 다시 나온다</b>고 하셨어요.</li></ul>",
"3-1-14":"<ul><li>같은 미로라도 <b>문제가 무엇이냐에 따라 상태가 달라집니다</b>. 어딘가로 가기만 하면 위치(x, y)면 충분하고, 점을 다 먹어야 하면 위치 + 점 정보가 필요합니다.</li><li>세계 상태는 거의 모든 걸 표현하지만, 탐색 상태는 계획에 필요한 것만 남긴 추상화입니다.</li></ul>",
"3-1-15":"<ul><li>지금은 'A에서 B로 가면 B에 도착'하는 결정적 전이지만, 뒤 슬라이드에서는 전이 모델이 <b>결정적이지 않은 경우</b>도 본다고 하셨어요.</li><li>Arad는 루마니아의 도시입니다(녹음에서 '인도네시아'로 잘못 들림).</li></ul>",
"3-1-16":"<ul><li>2장의 3줄짜리 반사 청소기 코드(더러우면 Suck, 왼쪽이면 Right, 오른쪽이면 Left)를 떠올려 보라고 하셨어요. 최대 3번(Suck, Right, Suck)이면 목표 상태에 갑니다.</li><li>어떤 프로그램이 왔다 갔다 헤매면 목표에는 가더라도 <b>최소 경로가 아니므로 최적이 아닙니다</b>.</li></ul>",
"3-1-17":"<ul><li><b>타일이 아니라 빈칸을 움직이는 건 퍼즐의 성질이 아니라 모델링 선택</b>입니다.</li><li>빈칸 기준이면 가지가 최대 4개지만, 숫자 타일마다 움직임을 따지면 트리가 훨씬 복잡해집니다.</li></ul>",
"3-1-18":"<ul><li>9!인 이유: 빈칸 포함 9칸에 9 × 8 × … × 1가지로 놓을 수 있어서. 판이 커지면 상태 수가 <b>지수적으로</b> 늘어납니다.</li><li>교수님이 가장 중요하다고 한 건 <b>왜 2로 나누는지</b>입니다.<ol><li>판을 체커보드처럼 칠하고, 빈칸이 밝은 칸이면 0, 어두운 칸이면 1.</li><li>숫자 배열을 순서대로 되돌리는 데 맞바꾸기가 짝수 번이면 even(0), 홀수 번이면 odd(1).</li><li>한 번 움직일 때마다 <b>빈칸 색과 순열 홀짝이 함께 뒤집혀</b> 두 값의 합(홀짝)은 변하지 않습니다.</li><li>시작 상태는 합이 0이라, 합이 1인 배치(예: 빈칸은 그대로 두고 1과 2만 맞바꾼 배치)에는 어떤 합법적 이동으로도 갈 수 없습니다.</li><li>그래서 9! = 362,880이 두 덩어리로 나뉘고 절반만 도달 가능합니다.</li></ol></li><li>이해가 어려우면 대면 수업에서 다시 짚겠다고 하셨어요. 다음 시간은 트리 탐색(Tree Search)부터.</li></ul>"
};
