const MID=[
/* ===================== 2장 ===================== */
{ch:2,t:"mix",sec:"2-1",title:"에이전트 함수 vs 에이전트 프로그램",
h:"<div class='tw'><table><tr><th></th><th>에이전트 함수 (agent function)</th><th>에이전트 프로그램 (agent program)</th></tr><tr><td>정체</td><td>수학적 명세 — 지각 이력 → 행동의 <b>표</b></td><td>그 표와 같은 행동을 내는 실제 <b>코드</b></td></tr><tr><td>입력</td><td>지각 <b>순열 전체</b>: f : P* → A</td><td>보통 <b>현재 지각 하나</b> (과거는 내부에 기억)</td></tr><tr><td>질문</td><td>'무엇을' 해야 하나</td><td>'어떻게' 구현하나</td></tr></table></div>P*의 별표(*) = 지각 하나가 아니라 지금까지의 지각 나열. 청소기 함수 표는 무한히 커지지만, 프로그램은 3줄(더러우면 Suck, 아니면 옆 칸)로 같은 행동을 냅니다.",
q:"f : P* → A에서 *는 무엇을 뜻하나?",a:"지각 하나가 아니라 지금까지 받은 지각 전체의 나열(percept sequence)."},
{ch:2,t:"mem",sec:"2-1",title:"합리적 에이전트의 정의와 수식",
h:"모든 지각 순열에 대해, 지각 이력과 사전 지식이 주어졌을 때 <b>성능 척도의 기대값</b>을 최대화하는 행동을 고르는 에이전트.<div class='formula'>a = argmax<sub>a∈A</sub> E(U | a)<br>E(U | a) = Σ<sub>outcome</sub> U<sub>a</sub> × P</div><b>argmax는 최댓값이 아니라 최댓값을 만드는 행동 a</b>를 돌려줍니다(3장의 argmin과 짝). '올바른 행동'은 네 가지에 달려 있습니다: <b>성능 척도, 사전 지식, 가능한 행동, 지각 순열</b> — 이 넷을 설계자 관점으로 묶은 것이 PEAS.",
q:"합리성이 달려 있는 네 가지는?",a:"성능 척도, 사전 지식, 가능한 행동, 지각 순열."},
{ch:2,t:"mix",sec:"2-1",title:"합리성이 '아닌' 것 네 가지",
h:"<div class='tw'><table><tr><th>아닌 것</th><th>뜻</th></tr><tr><td>전지 (omniscience)</td><td>미래를 다 알 필요 없다. 잘 살피고 건넜는데 떨어진 비행기 문에 맞아도 결정은 합리적</td></tr><tr><td>완벽 (perfection)</td><td>합리성 = <b>기대</b> 성능 최대화, 완벽 = <b>실제</b> 성능 최대화</td></tr><tr><td>수동 (passive)</td><td>모르면 알아보고(정보 수집), 배우고(학습), 탐험해야 한다</td></tr><tr><td>무제한 (unlimited)</td><td>메모리·시간·센서의 한계 안에서 최선</td></tr></table></div>핵심 한 줄: <b>결과가 아니라 결정 당시의 정보로 최선을 다했는가</b>를 본다.",
q:"합리성과 완벽함의 차이를 한 줄로?",a:"합리성은 기대 성능을, 완벽함은 실제 성능을 최대화한다."},
{ch:2,t:"why",sec:"2-1",title:"합리성은 '에이전트와 환경 사이의 관계'",
h:"3줄 청소기는 '이동 벌점 없음, 먼지 다시 안 생김, 구조 앎' 가정 아래에서는 합리적입니다. 하지만 가정을 바꾸면 판정이 바뀝니다:<ul><li>이동에 벌점 → 다 치운 뒤 왕복은 손해 → NoOp이 필요한데 \"둘 다 깨끗\"을 <b>기억</b>해야 함 → 3줄은 비합리적</li><li>먼지가 다시 생김 → 순찰 필요</li><li>구조를 모름 → 탐험 필요</li></ul>그래서 \"이 에이전트는 합리적이다\"는 반쪽 문장이고, <b>\"이 환경에서\"</b>가 붙어야 완성됩니다."},
{ch:2,t:"why",sec:"2-1",title:"성능 척도는 '행동'이 아니라 '결과'로",
h:"\"모은 먼지의 양\"으로 채점하면 청소기는 먼지를 다시 쏟고 또 빨아들입니다. 에이전트는 잘못한 게 없습니다 — <b>우리가 적은 것을 정확히 최대화</b>했을 뿐. 그래서 척도는 원하는 세상의 모습(<b>outcome</b>: 바닥이 깨끗함)을 적어야지, 상상한 행동(먼지를 많이 빨아들임)을 적으면 안 됩니다.<br>같은 원리가 두 군데 더 나옵니다: 학습 에이전트의 <b>성능 기준은 에이전트 밖</b>에 있어야 한다(스스로 기준을 낮추지 못하게), 영어 튜터의 P는 '오늘 맞힌 문제 수'가 아니라 '나중 시험 점수'."},
{ch:2,t:"mix",sec:"2-1",title:"PEAS · 과업 환경 vs 환경",
h:"<div class='tw'><table><tr><th>P</th><th>E</th><th>A</th><th>S</th></tr><tr><td>Performance measure<br>성공의 기준 (점수표)</td><td>Environment<br>상대하는 바깥 모든 것 (무대)</td><td>Actuators<br>환경에 영향을 주는 수단 (손발)</td><td>Sensors<br>환경을 관찰하는 수단 (눈귀)</td></tr></table></div><b>과업 환경(task environment) = P·E·A·S 전체</b>, 그냥 <b>환경(environment) = E 하나</b>. 에이전트 설계의 첫 단계는 코드가 아니라 PEAS 명세. 택시 예의 교훈: E는 정직하게 좁히고, P의 충돌(빠름 vs 안전 vs 수익)은 절충으로 적는다.",
q:"과업 환경과 환경의 차이는?",a:"과업 환경은 PEAS 네 가지 전체, 환경은 그중 E 하나."},
{ch:2,t:"mix",sec:"2-2",title:"어디까지가 환경인가",
h:"<b>에이전트 함수(결정 규칙)를 뺀 전부가 환경</b>입니다. 그래서 로봇의 카메라와 팔(센서·액추에이터)도 환경 쪽입니다 — 두뇌 입장에서 카메라 화질이나 모터 힘은 자기가 바꿀 수 없는 주어진 조건이기 때문."},
{ch:2,t:"mem",sec:"2-2",title:"환경의 7가지 속성과 판별 질문",
h:"<div class='tw'><table><tr><th>속성</th><th>판별 질문</th><th>대비</th></tr><tr><td>관찰 가능성</td><td>결정에 필요한 것이 다 보이나?</td><td>fully / partially</td></tr><tr><td>에이전트 수</td><td>내 행동에 따라 성공이 달라지는 다른 존재가 있나?</td><td>single / multi (경쟁·협력)</td></tr><tr><td>결정성</td><td>같은 상태·행동이면 항상 같은 결과?</td><td>deterministic / nondeterministic / stochastic</td></tr><tr><td>에피소드성</td><td>지금 결정이 다음 결정에 영향을 주나?</td><td>episodic / sequential</td></tr><tr><td>정적/동적</td><td>생각하는 동안 세상이 변하나?</td><td>static / dynamic / semidynamic</td></tr><tr><td>이산/연속</td><td>상태·시간·행동을 셀 수 있나?</td><td>discrete / continuous</td></tr><tr><td>알려짐</td><td>행동의 결과(규칙)를 아나?</td><td>known / unknown</td></tr></table></div>앞 6개가 Figure 2.6의 열, 7번째는 환경이 아니라 <b>에이전트의 지식</b>에 관한 것.",
q:"떨어지는 바위는 에이전트인가?",a:"아니다. 무언가를 최대화하려 한다고 보는 게 예측에 도움이 안 되므로 환경의 일부."},
{ch:2,t:"mix",sec:"2-2",title:"비결정적 vs 확률적 vs 부분 관찰",
h:"<div class='tw'><table><tr><th>비결정적</th><th>확률적</th></tr><tr><td>결과가 여럿, <b>확률 숫자 없음</b> (\"비가 올지도\")</td><td>결과가 여럿, <b>확률 숫자 있음</b> (\"비 올 확률 25%\") → 기대 효용 계산 가능</td></tr></table></div>함정: <b>부분 관찰 가능한 환경은 결정적이어도 비결정적처럼 보인다</b> — 세상이 주사위를 굴리는 게 아니라 내가 다 못 볼 뿐. 관찰 가능성과 결정성은 <b>서로 다른 축</b>입니다(예: 백개먼 = 완전 관찰 + 확률적, 포커 = 부분 관찰)."},
{ch:2,t:"mix",sec:"2-2",title:"정적 · 동적 · 준동적, 알려짐 vs 관찰 가능",
h:"<ul><li><b>정적</b>: 생각하는 동안 세상이 기다림 (십자말풀이). <b>포커도 정적</b> — 상대가 있다고 동적인 게 아님.</li><li><b>동적</b>: 고민하는 동안 세상이 변함 (운전) → \"아직 결정 안 함\" = \"아무것도 안 하기\"로 결정한 것.</li><li><b>준동적</b>: 세상은 그대로, <b>점수만</b> 시간에 따라 변함 (시계 있는 체스, 이미지 분석).</li></ul><b>알려짐(known)</b>은 규칙을 아는가, <b>관찰 가능</b>은 지금 상태가 보이는가. 사막 지프를 서울에 두면 다 보이지만(완전 관찰) 규칙을 모름(unknown). 포커는 규칙을 알지만(known) 상대 카드가 안 보임(부분 관찰)."},
{ch:2,t:"mix",sec:"2-2",title:"Figure 2.6에서 헷갈리는 칸",
h:"<ul><li><b>십자말풀이가 Sequential</b>: 한 칸의 단어가 교차하는 칸을 제약</li><li><b>포커가 Static</b>: 상대가 생각하는 동안 판이 변하지 않음</li><li><b>백개먼이 Fully + Stochastic</b>: 판은 다 보이지만 주사위</li><li><b>이미지 분석이 Semi + Episodic</b>: 이미지는 그대로지만 처리 시간이 점수에, 사진은 서로 독립</li><li><b>의료 진단이 Single + Sequential</b>: 환자를 에이전트로 보지 않을 때만 단일, 치료 과정 전체를 보면 순차적</li></ul>"},
{ch:2,t:"why",sec:"2-2",title:"환경이 설계를 정한다",
h:"<div class='tw'><table><tr><th>환경이 이러면</th><th>에이전트에 필요한 것</th><th>이어지는 곳</th></tr><tr><td>부분 관찰</td><td>기억 (내부 상태)</td><td>모델 기반 에이전트, 4장 belief state</td></tr><tr><td>비결정적</td><td>여러 결과에 대비</td><td>4장 AND-OR 탐색</td></tr><tr><td>다중 에이전트</td><td>때로는 무작위 행동 (블러핑)</td><td>게임 이론</td></tr><tr><td>정적</td><td>천천히 계산해도 됨</td><td>3장 탐색</td></tr><tr><td>규칙을 모름</td><td>탐험</td><td>4장 온라인 탐색, 강화학습</td></tr><tr><td>성능 척도를 모름</td><td>사람에게서 배우기</td><td>학습 에이전트</td></tr></table></div>"},
{ch:2,t:"why",sec:"2-2",title:"왜 표(에이전트 함수)를 그대로 못 쓰나",
h:"체스의 표는 약 10<sup>150</sup>줄. 세 개의 벽 — 하나만으로도 치명적: <b>저장할 기계가 없다 / 설계자가 채울 수 없다 / 에이전트가 다 배울 수 없다</b>. 그래서 질문이 \"표와 같은 행동을 내는 <b>작은 프로그램</b>을 어떻게 만들까?\"로 바뀌고, 그 답이 네 가지 에이전트 구조입니다. 위치 센서 없는 청소기가 무한 루프에 빠지는 예: 무작위화로 탈출할 수 있지만(평균 2단계), 제대로 된 해결은 <b>기억</b>."},
{ch:2,t:"mem",sec:"2-3",title:"에이전트 4가지 구조 — 무엇이 추가되나",
h:"<div class='tw'><table><tr><th>구조</th><th>식 / 근거</th><th>못 하는 것 (다음 단계가 고침)</th></tr><tr><td>① 단순 반사</td><td>a = f(p) — 현재 지각 + 조건-행동 규칙</td><td>안 보이는 것을 모름</td></tr><tr><td>② 모델 기반 반사</td><td>a = f(p, s), s′ = T(s, a) — 내부 상태 추가</td><td>목적이 바뀌면 규칙을 전부 갈아야 함</td></tr><tr><td>③ 목표 기반</td><td>목표 + \"이 행동을 하면 어떻게 될까\" 예측 → Plan(탐색)</td><td>여러 길 중 어느 게 더 좋은지 모름</td></tr><tr><td>④ 효용 기반</td><td>효용 = 상태의 점수 (R(s))</td><td>효용 함수 설계가 어려움</td></tr></table></div>위로 갈수록 유능하지만 계산이 무거움 → 환경에 맞는 <b>가장 단순한 구조</b>를 고르는 것이 설계.",
q:"모델 기반 에이전트의 두 식은?",a:"상태 갱신 s′ = T(s, a), 행동 결정 a = f(p, s)."},
{ch:2,t:"mix",sec:"2-3",title:"목표 기반 vs 효용 기반",
h:"<div class='tw'><table><tr><th></th><th>목표 기반</th><th>효용 기반</th></tr><tr><td>평가</td><td>예/아니오 (0 또는 1)</td><td>연속 점수 (실수)</td></tr><tr><td>끝</td><td>목표 상태 s<sup>goal</sup>에서 종료</td><td>종료 없음 (\"…\" 계속 최적화)</td></tr><tr><td>예</td><td>길 찾기, 퍼즐</td><td>온도 유지, 투자</td></tr></table></div>효용이 꼭 필요한 세 상황: <b>① 끝이 없다</b>(화성 로버 배터리), <b>② 목적이 충돌한다</b>(빠름 vs 안전), <b>③ 결과가 불확실하다</b>(확률을 곱하려면 숫자가 필요). 목표 기반이 반사형보다 유연한 이유: 지식(목적지, 지도)이 <b>명시적으로</b> 적혀 있어 목적지 하나만 바꾸면 됨."},
{ch:2,t:"mix",sec:"2-3",title:"전이 모델 vs 센서 모델",
h:"<ul><li><b>전이 모델</b> = 원인 → 결과: ① 내 행동의 효과(What my actions do) + ② 세상 스스로의 변화(How the world evolves)</li><li><b>센서 모델</b> = 실제 상태 → 내가 보게 되는 것. 이게 있어야 지각을 보고 거꾸로 상태를 추론</li></ul>둘을 합치면 \"예측 → 보정\"의 반복. 부분 관찰 세계에서 상태는 <b>최선의 추측</b>일 뿐 → 4장의 belief state로 이어짐."},
{ch:2,t:"mix",sec:"2-3",title:"원자적 vs 요인적 vs 구조적 표현",
h:"<div class='tw'><table><tr><th>표현</th><th>상태를 적는 법</th><th>쓰이는 곳</th></tr><tr><td>원자적 (atomic)</td><td>이름표 하나 \"B\" — 다르다는 것만 앎</td><td><b>3장 탐색</b></td></tr><tr><td>요인적 (factored)</td><td>변수 = 값 목록 [위치=A, 상태=깨끗]</td><td><b>5장 CSP</b>, 베이즈 망, ML</td></tr><tr><td>구조적 (structured)</td><td>객체 + 관계 \"컵이 탁자 위\"</td><td>1차 논리, 자연어</td></tr></table></div>요인적 표현의 각 변수를 <b>플루언트(fluent)</b>라고 부름. 5장 CSP가 3장보다 강한 이유가 바로 이 차이(블랙박스 vs factored)."},
{ch:2,t:"mem",sec:"2-3",title:"학습 에이전트의 4부품",
h:"<div class='tw'><table><tr><th>부품</th><th>역할</th></tr><tr><td>수행 요소 (performance element)</td><td>행동을 고르는 부분 — 반사~효용 에이전트가 통째로 여기</td></tr><tr><td>비평가 (critic)</td><td>성능 기준에 비추어 잘했나 판정 → 피드백</td></tr><tr><td>학습 요소 (learning element)</td><td>피드백으로 수행 요소를 고침</td></tr><tr><td>문제 생성기 (problem generator)</td><td>새로운 시도를 제안 (탐험)</td></tr></table></div>두 포인트: <b>성능 기준은 외부</b>(에이전트가 못 바꿈), <b>학습은 구조와 직교</b>(어떤 구조든 학습을 붙일 수 있음)."},

/* ===================== 3장 ===================== */
{ch:3,t:"mem",sec:"3-1",title:"탐색 문제의 5요소",
h:"<div class='tw'><table><tr><th>요소</th><th>표기</th></tr><tr><td>초기 상태</td><td>INITIAL</td></tr><tr><td>행동</td><td>ACTIONS(s) — 상태마다 가능한 행동이 다름</td></tr><tr><td>전이 모델</td><td>RESULT(s, a) = s′</td></tr><tr><td>목표 상태</td><td>IS-GOAL(s) — 하나일 수도 여럿일 수도</td></tr><tr><td>행동 비용</td><td>ACTION-COST(s, a, s′)</td></tr></table></div><b>상태 공간 자체는 정의하지 않는다</b>(보통 너무 크거나 무한) — 함수로 필요할 때 생성. 해 = 초기 상태에서 목표까지의 행동 순열, 최적해 = 경로 비용이 가장 낮은 해. 탐색 상태는 세계 상태에서 <b>계획에 필요한 것만 남긴 추상화</b>.",
q:"상태 공간을 표로 미리 정의하지 않는 이유는?",a:"보통 너무 크거나 무한하므로, ACTIONS·RESULT 함수로 필요할 때 생성한다."},
{ch:3,t:"mem",sec:"3-1",title:"8-퍼즐 상태 수: 왜 9! / 2인가",
h:"9칸에 9 × 8 × … × 1 = 9! = 362,880가지로 놓을 수 있지만, 실제로 도달 가능한 것은 <b>절반</b>입니다. 한 번 움직일 때마다 빈칸 색(체커보드)과 순열의 홀짝이 <b>함께</b> 뒤집혀 두 값의 합(홀짝)이 변하지 않기 때문. 그래서 상태 공간이 두 덩어리로 나뉘고 서로 오갈 수 없습니다. 교수님이 가장 중요하다고 한 부분이 <b>왜 2로 나누는지</b>."},
{ch:3,t:"mix",sec:"3-2",title:"상태 공간 그래프 vs 탐색 트리, 상태 vs 노드",
h:"<div class='tw'><table><tr><th></th><th>상태 공간 그래프</th><th>탐색 트리</th></tr><tr><td>점</td><td>상태 (세계의 모습)</td><td>노드 (<b>거기까지의 경로</b>)</td></tr><tr><td>크기</td><td>유한할 수 있음 (진공청소기 8개)</td><td>사이클 때문에 <b>무한</b>할 수 있음</td></tr><tr><td>같은 것</td><td>상태 하나</td><td>같은 상태가 여러 노드로 나타남</td></tr></table></div>노드가 기록하는 4가지: <b>STATE, PARENT, ACTION, PATH-COST</b>. 서울 → 부산 → 서울은 상태는 같아도 다른 노드.",
q:"노드가 기록하는 네 가지는?",a:"상태, 부모, 자신을 만든 행동, 경로 비용."},
{ch:3,t:"mix",sec:"3-2",title:"사이클 vs 중복 경로, 프런티어 vs reached",
h:"<ul><li><b>사이클</b>: 현재 경로 위에 같은 상태가 다시 나옴 (A → B → A). 현재 경로만 보면 싸게 막을 수 있음(IS-CYCLE).</li><li><b>중복 경로</b>: 다른 경로로 같은 상태에 도달 (A → B → D, A → C → D). 막으려면 <b>본 적 있는 모든 상태</b>를 기억해야 함(reached).</li><li><b>프런티어</b> = 발견했지만 아직 확장하지 않은 노드들(open list). <b>reached</b> = 지금까지 본 상태들.</li></ul>모든 전략은 하나의 반복문이고, 다른 것은 <b>프런티어에서 무엇을 먼저 꺼내느냐</b>뿐."},
{ch:3,t:"mem",sec:"3-2",title:"평가 기준 4개와 기호 b · d · m",
h:"<b>완전성</b>(해가 있으면 찾나) · <b>비용 최적성</b>(가장 싼 해를 찾나) · <b>시간 복잡도</b>(만든 노드 수) · <b>공간 복잡도</b>(기억하는 노드 수).<br><b>b</b> = 최대 분기 계수, <b>d</b> = 가장 얕은(최적) 해의 깊이, <b>m</b> = 트리의 최대 깊이.<div class='formula'>깊이 d까지의 노드 수 = 1 + b + b² + … + b<sup>d</sup> = O(b<sup>d</sup>)</div>AI에서는 보통 <b>공간이 시간보다 더 큰 문제</b> — 시간은 기다리면 되지만 메모리는 넘치면 끝."},
{ch:3,t:"mem",sec:"3-3",title:"탐색 알고리즘 총정리 표",
h:"<div class='tw'><table><tr><th></th><th>프런티어 / 기준</th><th>완전</th><th>최적</th><th>시간</th><th>공간</th></tr><tr><td>BFS</td><td>FIFO 큐 (얕은 것)</td><td>예</td><td>비용이 같을 때만</td><td>O(b<sup>d</sup>)</td><td>O(b<sup>d</sup>)</td></tr><tr><td>UCS</td><td>우선순위 큐, f = g</td><td>예 (비용 ≥ ε)</td><td>예</td><td>O(b<sup>C*/ε</sup>)</td><td>같음</td></tr><tr><td>DFS</td><td>LIFO 스택 (깊은 것)</td><td>사이클 막을 때만</td><td>아니오</td><td>O(b<sup>m</sup>)</td><td><b>O(bm)</b></td></tr><tr><td>IDS</td><td>스택 + 깊이 한계 0,1,2…</td><td>예</td><td>비용이 같을 때만</td><td>O(b<sup>d</sup>)</td><td><b>O(bd)</b></td></tr><tr><td>탐욕적</td><td>우선순위 큐, f = h</td><td>예 (유한 공간)</td><td>아니오</td><td>최악 O(b<sup>m</sup>), 최선 O(bm)</td><td>시간과 같음</td></tr><tr><td>A*</td><td>우선순위 큐, f = g + h</td><td>예</td><td>예 (h 허용적)</td><td>최악 O(b<sup>d</sup>)</td><td>시간과 같음</td></tr></table></div>BFS는 UCS에서 모든 비용이 같은 특수한 경우, UCS는 A*에서 h = 0인 특수한 경우.",
q:"IDS가 DFS보다도 공간이 작은 이유는?",a:"깊이가 d에서 멈추므로 O(bd), d ≤ m이라 DFS의 O(bm) 이하."},
{ch:3,t:"mix",sec:"3-3",title:"조기 목표 검사 (BFS) vs 늦은 목표 검사 (UCS·A*)",
h:"<ul><li><b>BFS</b>: 자식을 <b>만드는 순간</b> 목표 검사. 얕은 순서로 만들기 때문에 처음 만든 목표가 이미 가장 얕은 해 → 안전하고 한 층(b배)을 아낌.</li><li><b>UCS·A*</b>: 노드를 <b>꺼낼 때</b> 목표 검사. 꺼냈다는 것 = 남은 것 중 가장 쌈. 만들 때 검사하면 더 싼 경로가 아직 안 나왔을 수 있음.</li></ul>예: S → G 비용 10, S → A → G 비용 1 + 1. 만들 때 검사하면 G(10)를 바로 반환(틀림). A*의 루마니아 예에서도 Bucharest가 450으로 먼저 들어왔지만, Pitesti(417)가 남아 있어 반환하지 않고 418로 갱신."},
{ch:3,t:"why",sec:"3-3",title:"BFS가 최적이 아닌 경우 · UCS가 BFS보다 느린 경우",
h:"BFS가 보장하는 건 <b>단계 수</b>가 최소인 해. 비용이 제각각이면 단계는 적어도 비쌀 수 있음 — 같은 그래프에서 BFS의 해는 4단계·비용 14, UCS의 해는 5단계·비용 10.<br>UCS의 O(b<sup>C*/ε</sup>): 비용 C* 이하 경로는 최대 C*/ε 걸음까지 길어질 수 있어 '실질 깊이'가 C*/ε. 비싼 짧은 길 하나(고속도로 비용 10)를 꺼내기 전에 싼 긴 길(골목 비용 1)을 전부 먼저 보므로 BFS보다 느릴 수 있음. ε 조건이 필요한 이유: 비용 0 행동이 있으면 그 길만 영원히 팔 수 있음."},
{ch:3,t:"why",sec:"3-3",title:"DFS의 공간 O(bm), IDS의 시간 O(b<sup>d</sup>)",
h:"<b>DFS</b>: 동시에 기억하는 것 = 현재 경로(최대 m) + 각 층의 안 본 형제(층마다 최대 b) → b × m. 다 본 가지는 버리고 reached도 없기 때문(그래서 중복 경로는 못 막음).<br><b>IDS</b>: 한계를 늘릴 때마다 처음부터 다시 하지만, 깊이 k 노드는 (d − k + 1)번만 만들어짐: db + (d−1)b² + … + 1·b<sup>d</sup>. 마지막 항이 지배해서 여전히 O(b<sup>d</sup>).<div class='formula'>b = 10, d = 5:  BFS 111,110개  vs  IDS 123,450개 (약 11% 더)</div>메모리는 BFS 약 100,000 vs IDS 약 50 → \"IDS와 DFS가 AI의 일꾼\".",
q:"IDS에서 깊이 1의 노드는 몇 번 만들어지나 (해 깊이 d)?",a:"d번."},
{ch:3,t:"mix",sec:"3-3",title:"cutoff vs failure (깊이 제한 탐색)",
h:"<ul><li><b>cutoff</b>: 한계 ℓ에 걸려 못 본 노드가 있음 → \"더 깊이 가면 있을지도\"</li><li><b>failure</b>: 한계에 걸린 적 없이 다 봤는데 없음 → \"해가 정말 없음\"</li></ul>IDS는 결과가 <b>cutoff가 아닐 때</b>(해 또는 failure) 멈춤. 구분하지 않으면 해가 없는 유한 문제에서 한계를 영원히 늘림."},
{ch:3,t:"mix",sec:"3-4",title:"f = g (UCS) · f = h (탐욕적) · f = g + h (A*)",
h:"g(n) = 시작 → n까지 <b>이미 쓴</b> 비용, h(n) = n → 목표까지 <b>남은 추정</b> 비용. 같은 코드(BEST-FIRST-SEARCH)에 정렬 기준만 바꾼 것.<div class='tw'><table><tr><th>노드 (Sibiu 확장 후)</th><th>g</th><th>h</th><th>UCS</th><th>탐욕적</th><th>A*</th></tr><tr><td>Rimnicu Vilcea</td><td>220</td><td>193</td><td>220</td><td>193</td><td><b>413</b></td></tr><tr><td>Fagaras</td><td>239</td><td>176</td><td>239</td><td><b>176</b></td><td>415</td></tr></table></div>탐욕적: Fagaras 경유 140 + 99 + 211 = <b>450</b>마일 (3노드만 확장, 빠르지만 틀림). A*: Rimnicu Vilcea → Pitesti 경유 140 + 80 + 97 + 101 = <b>418</b>마일 (최적). 차이 32마일.",
q:"탐욕적 탐색이 최적이 아닌 근본 이유는?",a:"이미 지불한 비용 g를 전혀 보지 않고 남은 추정 h만 보기 때문."},
{ch:3,t:"mix",sec:"3-4",title:"허용성 vs 일관성",
h:"<div class='tw'><table><tr><th></th><th>허용성 (admissible)</th><th>일관성 (consistent)</th></tr><tr><td>식</td><td>h(n) ≤ h*(n)</td><td>h(n) ≤ c(n, a, n′) + h(n′)</td></tr><tr><td>뜻</td><td>실제보다 크게 말하지 않음 (낙관적, 하한)</td><td>한 걸음에 h가 그 비용보다 많이 줄지 않음 (삼각 부등식)</td></tr><tr><td>효과</td><td>A* 최적</td><td>경로를 따라 f가 줄지 않음 → 재확장 불필요</td></tr></table></div><b>일관성 ⇒ 허용성, 허용성 ⇏ 일관성.</b> 반례: S → A(1) → G(3), h(S) = 4, h(A) = 1 → 둘 다 실제 이하(허용) but 4 ≤ 1 + 1 거짓(비일관).<br>허용 O: 직선 거리, h = 0, 상하좌우 격자의 맨해튼. 허용 X: 직선 거리 × 2, 대각선 이동 가능한 격자의 맨해튼.",
q:"h = 0은 허용적인가? 그때 A*는?",a:"허용적이다(항상 실제 이하). A*가 UCS가 된다."},
{ch:3,t:"why",sec:"3-4",title:"A* 최적성 증명의 흐름 (귀류법)",
h:"최적 경로 위의 어떤 노드 n이 끝내 확장되지 않는다고 가정하면:<div class='formula'>(1) f(n) > C*        ← 확장 안 됐으니<br>(2) f(n) = g(n) + h(n)    ← 정의<br>(3) f(n) = g*(n) + h(n)    ← n은 최적 경로 위<br>(4) f(n) ≤ g*(n) + h*(n)   ← 허용성 h ≤ h*<br>(5) f(n) ≤ C*        ← g* + h* = C*</div>(1)과 (5)가 모순 → 최적 경로 위 노드는 모두 f ≤ C*라서 확장됨. 비싼 가짜 목표 G₂는 f(G₂) = g(G₂) > C*라 항상 늦게 나옴. (루마니아: 366, 393, 413, 417 ≤ 418, 가짜 목표 450 > 418)",
q:"증명에서 허용성이 쓰이는 줄은?",a:"(4) — h(n) ≤ h*(n)을 써서 f(n) ≤ g*(n) + h*(n)."},

/* ===================== 4장 ===================== */
{ch:4,t:"mix",sec:"4-1",title:"지역 탐색 vs 3장 탐색",
h:"<div class='tw'><table><tr><th></th><th>3장 탐색</th><th>지역 탐색</th></tr><tr><td>답</td><td>경로</td><td><b>상태 자체</b> (최종 배치)</td></tr><tr><td>기억</td><td>프런티어 + reached (O(b<sup>d</sup>) 등)</td><td>현재 상태 하나 → <b>상수 공간</b></td></tr><tr><td>체계성</td><td>빠짐없이 훑음</td><td>체계적이지 않음 → 해를 못 찾을 수 있음</td></tr><tr><td>잘 맞는 곳</td><td>경로 찾기</td><td>최적화 (목적 함수), 연속·무한 공간, 온라인</td></tr></table></div>제약 만족(N-퀸: 조건만 맞으면 됨) vs 최적화(TSP: 가장 좋은 것) 둘 다 '완성된 구성'을 조금씩 고치는 <b>반복 개선</b>."},
{ch:4,t:"mem",sec:"4-1",title:"지형 용어와 언덕 오르기가 멈추는 곳",
h:"<ul><li><b>global maximum</b>: 가장 높은 봉우리 (찾고 싶은 것)</li><li><b>local maximum</b>: 이웃보다 높지만 전역 최댓값보다 낮음 → 모든 이웃이 내리막이라 멈춤</li><li><b>ridge (능선)</b>: 지역 최댓값이 줄지은 비스듬한 지형 → 한 걸음씩으로는 못 넘음</li><li><b>plateau (고원)</b>: 평평한 구역 — 출구 없는 flat local maximum이거나, 지나가면 오르막인 <b>shoulder</b></li></ul>그래서 언덕 오르기는 <b>완전하지도 최적이지도 않다</b>. max f(x) = min −f(x) → 언덕 오르기와 경사 하강은 같은 아이디어.",
q:"shoulder와 flat local maximum의 차이는?",a:"둘 다 평평하지만 shoulder는 지나가면 다시 오르막이 있고, flat local maximum은 오르막 출구가 없다."},
{ch:4,t:"mix",sec:"4-1",title:"언덕 오르기 세 변형",
h:"<div class='tw'><table><tr><th>변형</th><th>후속 생성</th><th>이동</th></tr><tr><td>최급 상승 (steepest-ascent)</td><td>전부</td><td>가장 가파른 오르막</td></tr><tr><td>확률적 (stochastic)</td><td>전부</td><td>오르막 중 무작위 하나 (덜 탐욕적)</td></tr><tr><td>첫 선택 (first-choice)</td><td><b>한 번에 하나</b></td><td>처음 만난 오르막</td></tr></table></div>후속이 수천 개면 first-choice가 유리. 담금질 모사는 first-choice 기반."},
{ch:4,t:"mix",sec:"4-1",title:"무작위 재시작 vs 지역 빔 vs 유전 알고리즘",
h:"<div class='tw'><table><tr><th></th><th>핵심</th><th>구별 포인트</th></tr><tr><td>무작위 재시작</td><td>갇히면 다른 임의 상태에서 처음부터</td><td>시도들이 <b>따로따로</b> (성공 확률 p면 평균 1/p번)</td></tr><tr><td>지역 빔 (k)</td><td>k개 상태의 후속을 <b>전부 모아</b> best k</td><td>k개가 <b>정보를 공유</b>. k 작으면 지역 최적으로 붕괴, 크면 완전 탐색에 가까움</td></tr><tr><td>유전 알고리즘</td><td>선택 → <b>교차</b> → 돌연변이</td><td>두 부모를 <b>섞어서</b> 새 상태 (빔은 이웃으로 한 발)</td></tr></table></div>8-퀸 GA: 적합도 = 서로 공격하지 않는 쌍의 수 (최대 28), 적합도에 비례해 부모 선택."},
{ch:4,t:"why",sec:"4-1",title:"담금질 모사: exp(−ΔE/T)가 어떻게 움직이나",
h:"좋아지는 이동은 항상 수용, 나빠지는 이동(ΔE > 0)은 확률 <b>e<sup>−ΔE/T</sup></b>로만 수용.<ul><li>ΔE가 클수록(많이 나빠질수록) → 확률 작음</li><li>T가 클수록(초반) → 확률 큼 (거의 다 받아 넓게 돌아다님)</li><li>T가 작을수록(후반) → 거의 안 받음 (언덕 오르기처럼 정착)</li></ul><div class='formula'>ΔE = 10:  T=100 → 0.90,  T=10 → 0.37,  T=1 → 0.00005</div>냉각 일정: 고전 T<sub>0</sub>/log(1+t), 지수 T<sub>0</sub>·a<sup>t</sup> (0.8&lt;a&lt;1), 빠른 T<sub>0</sub>/(1+t). \"충분히 천천히\" 식히면 전역 최적 보장 — 하지만 현실적으로 너무 오래 걸림.",
q:"T가 높을 때 담금질 모사는 어떤 탐색과 비슷한가?",a:"무작위 걷기 — 나쁜 이동도 거의 다 받아들인다."},
{ch:4,t:"mem",sec:"4-1",title:"연속 공간: 세 방법과 경사 하강 식",
h:"① <b>이산화</b>: 간격 δ 격자 → 이산 알고리즘 (차원 높으면 칸 폭발) ② <b>무작위 섭동</b> + 담금질 ③ <b>해석적</b>: 기울기 사용.<div class='formula'>경사 하강:  x ← x − α · ∇f(x)<br>뉴턴-랩슨:  x ← x − H<sub>f</sub><sup>−1</sup> ∇f(x)</div>∇f는 가장 가파르게 <b>증가</b>하는 방향 → 최소화는 반대로. α가 크면 발산, 작으면 느림. 뉴턴은 헤시안(곡률)으로 보폭을 정해 빠르지만 k×k 역행렬이 비쌈. 비볼록이면 둘 다 지역 최적에 갇힘 → 담금질, 모멘텀."},
{ch:4,t:"mix",sec:"4-2",title:"RESULT vs RESULTS, OR 노드 vs AND 노드",
h:"결정적: RESULT(s, a) = 상태 하나. 비결정적: <b>RESULTS(s, a) = 상태들의 집합</b> = 믿음 상태 (예: 변덕 청소기 RESULTS(1, Suck) = {5, 7}).<div class='tw'><table><tr><th></th><th>OR 노드</th><th>AND 노드</th></tr><tr><td>누가 고르나</td><td><b>에이전트</b> (행동 선택)</td><td><b>환경</b> (결과 선택)</td></tr><tr><td>성공 조건</td><td>가지 <b>하나</b>만 성공하면 됨</td><td>가지 <b>모두</b> 성공해야 함</td></tr></table></div>해 = 잎이 모두 목표인 <b>부분 트리</b>. 현재 경로에 같은 상태가 다시 나오면 failure (IS-CYCLE). DFS로 찾으므로 최적 아님."},
{ch:4,t:"mix",sec:"4-2",title:"조건부 계획 (if) vs 순환 해 (while)",
h:"<ul><li><b>변덕스러운 청소기</b> (Suck이 가끔 옆 칸까지 / 깨끗한 칸에 먼지): [Suck, <b>if</b> State = 5 <b>then</b> [Right, Suck] <b>else</b> []] — 분기</li><li><b>미끄러운 청소기</b> (이동이 가끔 실패): 비순환 해가 없어 AND-OR 탐색은 failure → 순환 해 [Suck, <b>while</b> State = 5 <b>do</b> Right, Suck] — 반복</li></ul>결정적 세계의 해는 [Suck, Right, Suck]였음. 결론: <b>계획 = 리스트가 아니라 프로그램</b> (순열 → 분기 → 반복)."},
{ch:4,t:"mix",sec:"4-3",title:"무감각 문제 vs 부분 관찰 문제",
h:"<div class='tw'><table><tr><th></th><th>무감각 (sensorless, conformant)</th><th>부분 관찰</th></tr><tr><td>Percept(s)</td><td>None</td><td>o (상태의 일부)</td></tr><tr><td>해</td><td><b>순수한 행동 순열</b> (if 쓸 데가 없음)</td><td><b>조건부 계획</b> (관찰로 분기)</td></tr><tr><td>예</td><td>[Right, Suck, Left, Suck] → 어디서 시작했든 상태 7</td><td>[Suck, Right, if Bstate = Dirty then Suck else []]</td></tr></table></div>무감각에서도 <b>행동 자체가 믿음 상태를 줄인다</b>: {1..8} → Right {2,4,6,8} → Suck {4,8} → Left {3,7} → Suck {7}. 완전 관찰은 Percept(s) = s."},
{ch:4,t:"mem",sec:"4-3",title:"믿음 상태 공간과 Predict / Update",
h:"믿음 상태 공간 크기 = 2<sup>N</sup> (진공 8상태 → 256), 하지만 도달 가능한 것은 12개. 목표 = 믿음 상태의 <b>모든</b> 원소가 목표. 부분집합 성질: b를 푸는 순열은 b의 부분집합도 품 → 가지치기.<div class='formula'>Predict:  b̂ = PREDICT(b, a) = RESULT(b, a)<br>Update:  b<sub>o</sub> = {s ∈ b̂ : PERCEPT(s) = o}<br>합치면:  b ← UPDATE(PREDICT(b, a), o)</div>행동하고 → 관찰하므로 <b>항상 Predict가 먼저</b>. 예측은 가능성을 넓히고, 관찰은 좁힌다. 이 반복 = 모니터링 = 필터링 = 상태 추정. 4-3의 AND 가지는 '결과'가 아니라 '받을 수 있는 관찰'.",
q:"국소 감지 청소기: Update(Predict({1,3}, Right), [B, Dirty]) = ?",a:"{2}. Predict로 {2,4}, 그중 B가 더러운 것은 2뿐."},
{ch:4,t:"mix",sec:"4-4",title:"오프라인 탐색 vs 온라인 탐색",
h:"<div class='tw'><table><tr><th></th><th>오프라인 (계획)</th><th>온라인</th></tr><tr><td>언제</td><td>행동 <b>전에</b> 머릿속으로 계획 완성</td><td>한 번에 한 행동씩 <b>실제로</b></td></tr><tr><td>순환</td><td>Predict → Update</td><td><b>Act → Observe</b></td></tr><tr><td>전제</td><td>전이 함수를 앎</td><td>전이 함수를 몰라도 됨 (행동으로 배움)</td></tr></table></div>온라인이 유용한 곳: 모르는 환경, 실시간 문제, 비결정적 영역(일어난 결과 하나만 처리).<br>온라인 DFS 변수: <b>result</b>[s,a](배운 전이), <b>untried</b>[s](= 프런티어), <b>unbacktracked</b>[s](되돌아갈 곳 스택). 백트랙은 포인터 이동이 아니라 <b>실제로 걸어서</b> 돌아감 → 탐험 → 막다른 곳 → 백트랙 → 새 길."},
{ch:4,t:"mem",sec:"4-4",title:"4장이 없앤 가정 한눈에",
h:"<div class='tw'><table><tr><th>상황</th><th>도구</th></tr><tr><td>경로 무관, 상태만 중요</td><td>지역 탐색 (언덕 오르기, 담금질, 빔, 유전)</td></tr><tr><td>연속 공간</td><td>이산화, 경사 하강</td></tr><tr><td>결과가 유일하지 않음 (비결정)</td><td>믿음 상태 + AND-OR 탐색, 조건부 계획</td></tr><tr><td>상태를 못 봄 (부분 관찰)</td><td>믿음 상태 + Predict/Update</td></tr><tr><td>모델을 모름 (unknown)</td><td>온라인 탐색</td></tr></table></div>"},

/* ===================== 5장 ===================== */
{ch:5,t:"mix",sec:"5-1",title:"계획 문제 vs 식별 문제",
h:"<div class='tw'><table><tr><th></th><th>계획 (planning)</th><th>식별 (identification)</th></tr><tr><td>답</td><td>행동의 순열 (<b>경로</b>)</td><td>변수에 대한 값 배정 (<b>목표 자체</b>)</td></tr><tr><td>특징</td><td>경로에 비용·깊이, 휴리스틱이 길잡이</td><td>어떻게 왔는지 무관, 모든 경로가 같은 깊이 (변수 n개 → 깊이 n)</td></tr></table></div>CSP는 <b>식별 문제의 특수한 한 종류</b>.",
q:"CSP는 계획 문제인가 식별 문제인가?",a:"식별 문제."},
{ch:5,t:"why",sec:"5-1",title:"알고리즘이 보는 상태 vs 사람이 보는 상태",
h:"사람은 상태를 보면 안(청소기 위치, 먼지)을 읽지만, 3~4장 알고리즘에게 상태는 <b>블랙박스</b> — ACTIONS·RESULT·IS-GOAL을 호출할 뿐. CSP는 상태가 <b>변수 = 값</b>(factored)이라 알고리즘이 안을 읽음 → \"이 변수 때문에 막혔다\"를 알 수 있어 범용 알고리즘이 더 강해짐.<br>4장은 <b>환경</b>을 어렵게 바꿨고, 5장은 환경은 3장 그대로 두고 <b>상태 표현</b>을 바꾼 것."},
{ch:5,t:"mem",sec:"5-1",title:"CSP의 정의와 해",
h:"<div class='formula'>CSP = ( 변수 X<sub>i</sub>,  도메인 D (D<sub>i</sub>일 수도),  제약 C )</div><ul><li>제약 = 변수 부분집합에 허용되는 값 조합 = 목표 검사</li><li><b>해 = 모든 변수에 값이 있고(완전 배정) 모든 제약을 만족</b></li><li>정해진 문법이 있으니 <b>형식적 표현 언어</b> → 하나의 범용 알고리즘을 모든 문제에 적용</li></ul>지도 색칠: 변수 WA, NT, Q, NSW, V, SA, T / 도메인 {red, green, blue} / 제약 인접 지역은 다른 색 (간선 9개, T는 독립).",
q:"일부 변수가 비어 있지만 제약은 다 만족하는 배정은 해인가?",a:"아니다. 모든 변수에 값이 있어야 한다."},
{ch:5,t:"mix",sec:"5-1",title:"암묵적 vs 명시적 제약",
h:"<div class='tw'><table><tr><th>암묵적 (implicit)</th><th>명시적 (explicit)</th></tr><tr><td>코드(식) 한 조각: <code>WA ≠ NT</code>, non-threatening(Q<sub>i</sub>, Q<sub>j</sub>), Σ X<sub>ij</sub> = N</td><td>허용 쌍을 나열한 목록: (WA, NT) ∈ {(red, green), (red, blue), …}, (Q<sub>1</sub>, Q<sub>2</sub>) ∈ {(1, 3), (1, 4), …}</td></tr></table></div>3색 지도에서 명시적 목록 = 9쌍 − 같은 색 3쌍 = 6쌍."},
{ch:5,t:"mix",sec:"5-1",title:"Binary CSP vs Boolean CSP, 단항 · 이진 · 고차 제약",
h:"<div class='tw'><table><tr><th></th><th>Binary CSP</th><th>Boolean CSP</th></tr><tr><td>기준</td><td>제약 하나가 묶는 <b>변수</b> 개수 (최대 2)</td><td>도메인의 <b>값</b> 개수 (참/거짓 2개)</td></tr><tr><td>예</td><td>지도 색칠 (도메인 3색)</td><td>N-퀸 정식화 1 (도메인 {0,1})</td></tr></table></div>제약의 차수: <b>단항</b> = 변수 1개 (스도쿠의 이미 채워진 칸), <b>이진</b> = 2개 (WA ≠ NT), <b>고차</b> = 3개 이상 (alldiff). 이진 제약 그래프: 노드 = 변수, 간선 = 제약. 고차 제약은 <b>네모 노드</b>로 그림.",
q:"지도 색칠은 Binary인가 Boolean인가?",a:"Binary CSP이지만 Boolean은 아니다(도메인이 3색)."},
{ch:5,t:"why",sec:"5-1",title:"N-퀸 세 정식화: 해의 구조를 문제의 구조에",
h:"<div class='tw'><table><tr><th></th><th>변수</th><th>도메인</th><th>경우의 수 (N=4)</th><th>문제 구조에 넣은 해의 성질</th></tr><tr><td>1</td><td>X<sub>ij</sub> (칸, N²개)</td><td>{0, 1}</td><td>2<sup>16</sup> = 65,536</td><td>없음 → Σ X<sub>ij</sub> = N 필요 (없으면 전부 0이 통과)</td></tr><tr><td>2</td><td>Q<sub>k</sub> (퀸, N개)</td><td>{11, …, NN} 칸 좌표</td><td>16<sup>4</sup> = 65,536</td><td>퀸이 N개 → Σ 제약 삭제</td></tr><tr><td>3</td><td>Q<sub>k</sub> (k행의 퀸)</td><td>{1, …, N} 열</td><td>4<sup>4</sup> = 256</td><td>퀸 N개 + 행마다 하나</td></tr></table></div><b>As much as possible, structure of the solution is encoded in structure of the problem → better CSP.</b> 정식화 1의 쌍 제약은 (1,1)만 금지하는 명시적 제약.",
q:"정식화 1에서 Σ X_ij = N이 없으면 무슨 일이?",a:"퀸을 하나도 놓지 않은(전부 0) 배정이 모든 쌍 제약을 만족해 버린다."},
{ch:5,t:"mem",sec:"5-1",title:"복면산 · 스도쿠 · 왈츠 정식화",
h:"<b>TWO + TWO = FOUR</b>: 변수 F T U W R O + 받아올림 X<sub>1</sub> X<sub>2</sub> X<sub>3</sub>, 도메인 0~9.<div class='formula'>alldiff(F, T, U, W, R, O)<br>O + O = R + 10·X<sub>1</sub><br>X<sub>1</sub> + W + W = U + 10·X<sub>2</sub><br>X<sub>2</sub> + T + T = O + 10·X<sub>3</sub><br>X<sub>3</sub> = F</div>제약이 주어지면 제약 그래프를 그릴 수 있어야 함 (동그라미 = 변수, 네모 = 제약). 해 예: 734 + 734 = 1468.<br><b>스도쿠</b>: 변수 = 빈칸, 도메인 1~9, 행·열·영역 27개 alldiff (또는 쌍별 ≠), 주어진 칸 = 단항 제약.<br><b>왈츠</b>: 교차점(junction) = 변수, 선이 볼록(+)/오목(−)인지 = 도메인, 교차점마다 가능한 라벨 조합 <b>리스트</b> + 인접 교차점 일치 = 제약, 해 = 물리적으로 가능한 3D 해석."}
];

const MIDT={mix:["헷갈림","서로 헷갈리는 개념 비교"],mem:["암기","꼭 외워야 하는 것"],why:["원리","왜 그런지 이해해야 하는 것"]};
const midF={t:"all",ch:"all"};
function renderMid(){
  const list=MID.filter(m=>(midF.t==="all"||m.t===midF.t)&&(midF.ch==="all"||m.ch===midF.ch));
  const cnt=t=>MID.filter(m=>(t==="all"||m.t===t)&&(midF.ch==="all"||m.ch===midF.ch)).length;
  let h='<div class="panel midhead"><h2>중간고사 정리</h2><p class="sub">2~5장에서 <b>서로 헷갈리는 개념</b>, <b>꼭 외워야 하는 것</b>, <b>원리를 이해해야 하는 것</b>만 모았습니다. 카드의 <b>강의 보기 →</b>를 누르면 해당 소단원으로 이동하고, <b>스스로 확인</b>을 눌러 답을 떠올려 본 뒤 펼쳐 보세요.</p>'+
   '<div class="field"><span class="fl">종류</span>'+chipRow("t",[["all","전체 "+cnt("all")],["mix","헷갈림 "+cnt("mix")],["mem","암기 "+cnt("mem")],["why","원리 "+cnt("why")]],midF.t)+'</div>'+
   '<div class="field"><span class="fl">단원</span>'+chipRow("ch",[["all","2~5장"],[2,"2장 · 에이전트"],[3,"3장 · 탐색"],[4,"4장 · 복잡한 환경"],[5,"5장 · CSP"]],midF.ch)+'</div></div>';
  [2,3,4,5].forEach(c=>{
    const g=list.filter(m=>m.ch===c);if(!g.length)return;
    h+='<h3 class="midch" data-c="'+c+'">'+c+'장 · '+esc(CHN[c])+' <span>'+g.length+'</span></h3>';
    g.forEach(m=>{h+='<article class="mcard t-'+m.t+'"><div class="mh"><span class="mb">'+MIDT[m.t][0]+'</span><h4>'+m.title+'</h4><button class="mgo" data-sec="'+m.sec+'">'+m.sec+' 강의 보기 →</button></div><div class="xp">'+xHTML(m.h)+'</div>'+
      (m.q?'<details class="mq"><summary>스스로 확인 · '+m.q+'</summary><div>'+m.a+'</div></details>':'')+'</article>';});
  });
  $("#mid-root").innerHTML=h;
  document.querySelectorAll("#mid-root .chips").forEach(g=>g.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c)return;let v=c.dataset.v;if(/^\d+$/.test(v))v=+v;midF[g.dataset.group]=v;renderMid();}));
  document.querySelectorAll("#mid-root .mgo").forEach(b=>b.addEventListener("click",()=>gotoSection(b.dataset.sec)));
}
function gotoSection(sec){
  showPage("notes");showNotesCh(+sec[0]);
  const a=document.getElementById("s"+sec);if(a)setTimeout(()=>a.scrollIntoView({block:"start"}),30);
}

/* ---------------- quiz ---------------- */
const setup={ch:"all",n:10,type:"all",st:"new"};
/* 푼 문제 기록: {문제id:{c:마지막 정답 여부,n:푼 횟수,t:시각}} — 이 브라우저에 저장 */
const SKEY="ai-intro-solved-v1";
let SOLVED={};try{SOLVED=JSON.parse(localStorage.getItem(SKEY)||"{}")||{};}catch(e){}
function markSolved(id,c){const o=SOLVED[id]||{n:0};o.n++;o.c=!!c;o.t=Date.now();SOLVED[id]=o;try{localStorage.setItem(SKEY,JSON.stringify(SOLVED));}catch(e){}}
const stOK=q=>setup.st==="all"||(setup.st==="new"?!SOLVED[q.id]:!!SOLVED[q.id]);
let quiz=null;
function pool(ign){return QB.filter(q=>(setup.ch==="all"||q.ch===setup.ch)&&(setup.type==="all"||q.t===setup.type)&&(ign||stOK(q)));}
function chipRow(name,opts,cur){
  return '<div class="chips" data-group="'+name+'">'+opts.map(([v,l])=>'<button class="chip" data-v="'+v+'" aria-pressed="'+(String(v)===String(cur))+'">'+l+'</button>').join("")+'</div>';
}
function renderSetup(){
  const p=pool();
  const counts={mc:p.filter(q=>q.t==="mc").length,sa:p.filter(q=>q.t==="sa").length};
  const all=pool(true),nDone=all.filter(q=>SOLVED[q.id]).length,nOk=all.filter(q=>SOLVED[q.id]&&SOLVED[q.id].c).length;
  $("#quiz-root").innerHTML=
  '<div class="panel setup">'+
   '<h2>퀴즈</h2><p class="sub">문제는 영어, 해설은 한국어입니다. 단원 안의 소단원 문제가 무작위로 섞여 나오고, 선택지 순서도 매번 바뀝니다.</p>'+
   '<div class="sprog"><div class="spbar"><i style="width:'+(all.length?nDone/all.length*100:0)+'%"></i></div><span>지금 조건에서 <b>'+nDone+'</b> / '+all.length+' 문제 풀었어요 · 마지막 채점 기준 정답 '+nOk+'</span></div>'+
   '<div class="field"><span class="fl">풀이 상태</span>'+chipRow("st",[["new","안 푼 문제 "+(all.length-nDone)],["done","푼 문제 "+nDone],["all","전체 "+all.length]],setup.st)+'</div>'+
   '<div class="field"><span class="fl">단원</span>'+chipRow("ch",[["all","전체"],[1,"1장 · AI 이해와 역사"],[2,"2장 · 지능형 에이전트"],[3,"3장 · 탐색"],[4,"4장 · 복잡한 환경의 탐색"],[5,"5장 · 제약 충족 문제"]],setup.ch)+'</div>'+
   '<div class="field"><span class="fl">문제 유형</span>'+chipRow("type",[["all","전체"],["mc","객관식 (복수 정답)"],["sa","단답식"]],setup.type)+'</div>'+
   '<div class="field"><span class="fl">문제 수</span>'+chipRow("n",[[10,"10문제"],[20,"20문제"],["all","전부"]],setup.n)+'</div>'+
   '<div class="legend"><span>선택 가능한 문제: <b class="mono">'+p.length+'</b>개 (객관식 '+counts.mc+' · 단답식 '+counts.sa+')</span><span>틀린 문제는 오답노트에 자동 저장</span></div>'+
   '<div class="actions">'+(!p.length&&setup.st==="new"&&all.length?'<span class="hint" style="margin:0 auto 0 0">이 조건의 문제를 모두 풀었어요. ‘푼 문제’나 ‘전체’로 다시 풀 수 있어요.</span>':'')+'<button class="btn" id="qstart"'+(p.length?"":" disabled")+'>시작하기 →</button></div>'+
  '</div>';
  document.querySelectorAll("#quiz-root .chips").forEach(g=>g.addEventListener("click",e=>{
    const c=e.target.closest(".chip");if(!c)return;
    let v=c.dataset.v;if(/^\d+$/.test(v))v=+v;setup[g.dataset.group]=v;renderSetup();
  }));
  $("#qstart").addEventListener("click",()=>{
    let ids=shuffle(pool().map(q=>q.id));
    if(setup.n!=="all")ids=ids.slice(0,setup.n);
    startQuiz(ids,(setup.ch==="all"?"전체 단원":setup.ch+"장 · "+CHN[setup.ch])+(setup.st==="new"?" · 안 푼 문제":setup.st==="done"?" · 푼 문제":""));
  });
}
function startQuiz(ids,label,isReview){
  quiz={ids:shuffle(ids),i:0,label,review:!!isReview,res:{},orders:{}};
  quiz.ids.forEach(id=>{quiz.orders[id]=shuffle([0,1,2,3,4]);});
  showPage("quiz");renderQ();fx($("#quiz-root"));
}
function curQ(){return QMAP[quiz.ids[quiz.i]];}
function renderQ(){
  const q=curQ(),n=quiz.ids.length,r=quiz.res[q.id];
  let h='<div class="panel">'+
   '<div class="prog"><span>'+(quiz.i+1)+' / '+n+'</span><div class="bar"><i style="width:'+((quiz.i+(r?1:0))/n*100)+'%"></i></div><span>'+esc(quiz.label)+(quiz.review?" · 오답 복습":"")+'</span><button class="btn ghost sm" id="qexit">나가기</button></div>'+
   '<div class="qmeta"><span class="pill t">'+q.s+' '+esc(SECS[q.s])+'</span><span class="pill">'+(q.t==="mc"?"Multiple choice · multiple answers":"Short answer")+'</span></div>'+
   '<div class="qtext">'+q.q+'</div>';
  if(q.t==="mc"){
    h+='<div class="qhint">Select ALL that apply.</div><div class="opts" role="group">';
    quiz.orders[q.id].forEach((oi,pos)=>{
      const o=q.o[oi];let cls="opt",mark="";
      const picked=r?r.picked.includes(oi):false;
      if(r){if(o[2]&&picked){cls+=" ok";mark='<span class="mark ok">✓ 정답</span>';}
            else if(o[2]&&!picked){cls+=" ok miss";mark='<span class="mark ok">놓친 정답</span>';}
            else if(!o[2]&&picked){cls+=" bad";mark='<span class="mark bad">✗ 오답</span>';}}
      h+='<button class="'+cls+'" role="checkbox" data-oi="'+oi+'" aria-checked="'+(r?picked:false)+'"'+(r?" disabled":"")+'><span class="lt">'+LET[pos]+'</span><span class="ot">'+o[0]+'</span>'+mark+'</button>';
    });
    h+='</div>';
  }else{
    h+='<div class="qhint">Type a short answer in English (numbers are fine).</div>'+
       '<div class="sa"><input id="sainput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer" '+(r?'disabled value="'+esc(r.text)+'"':'')+'></div>';
  }
  if(!r){
    h+='<div class="actions"><button class="btn ghost" id="qskip">모르겠어요</button><button class="btn" id="qsubmit"'+(q.t==="mc"?" disabled":"")+'>채점하기</button></div>';
  }else{
    h+=feedbackHTML(q,r,true);
    h+='<div class="actions"><button class="btn ghost" id="qquit">그만하고 결과 보기</button><button class="btn" id="qnext">'+(quiz.i+1<n?"다음 문제 →":"결과 보기 →")+'</button></div>';
  }
  h+='</div>';
  $("#quiz-root").innerHTML=h;
  bindQ(q,r);
}
function feedbackHTML(q,r,live){
  let h='<div class="verdict '+(r.correct?"ok":"bad")+'">'+(r.correct?"정답입니다":"틀렸습니다 — 오답노트에 저장했어요")+'</div><div class="exp">';
  h+='<h4>문제 번역</h4><div class="tr">'+q.k+'</div>';
  if(q.t==="mc"){
    h+='<h4>선택지별 번역과 해설</h4>';
    const order=live?quiz.orders[q.id]:[0,1,2,3,4];
    order.forEach((oi,pos)=>{const o=q.o[oi];
      h+='<div class="eo '+(o[2]?"c":"w")+'"><span class="lt2">'+LET[pos]+'</span><div><div class="en">'+o[0]+'</div><div class="ko">'+o[1]+'</div><div class="why"><span class="tag '+(o[2]?"c":"w")+'">'+(o[2]?"정답":"오답")+'</span>'+o[3]+'</div></div></div>';});
  }else{
    h+='<h4>답</h4><dl class="ansrow"><dt>내 답</dt><dd>'+(r.text?esc(r.text):"(입력 없음)")+'</dd><dt>정답</dt><dd>'+esc(q.show)+'</dd></dl>';
  }
  h+='<h4>해설</h4><div class="xp2">'+xHTML(q.e)+'</div>';
  h+='<div class="wbtns">'+(live&&q.t==="sa"&&!r.correct&&r.text?'<button class="btn ghost sm" id="qaccept">내 답도 맞아요 (정답 처리)</button>':'')+'<button class="btn ghost sm" data-gosec="'+q.s+'">'+q.s+' 강의내용 보기</button></div>';
  return h+'</div>';
}
function grade(q,picked,text){
  if(q.t==="mc"){const want=q.o.map((o,i)=>o[2]?i:-1).filter(i=>i>=0);return picked.length===want.length&&want.every(i=>picked.includes(i));}
  const t=norm(text);if(!t)return false;
  if(q.kw)return q.kw.every(g=>g.some(k=>t.includes(norm(k))));
  return q.a.some(a=>norm(a)===t);
}
function bindQ(q,r){
  const root=$("#quiz-root");
  $("#qexit").addEventListener("click",()=>{quiz=null;renderSetup();window.scrollTo(0,0);});
  root.querySelectorAll("[data-gosec]").forEach(b=>b.addEventListener("click",()=>gotoSection(b.dataset.gosec)));
  if(!r){
    if(q.t==="mc"){
      root.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
        b.setAttribute("aria-checked",b.getAttribute("aria-checked")==="true"?"false":"true");
        $("#qsubmit").disabled=!root.querySelector('.opt[aria-checked="true"]');
      }));
    }else{
      const inp=$("#sainput");inp.focus({preventScroll:true});
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();submit();}});
    }
    $("#qsubmit").addEventListener("click",()=>submit());
    $("#qskip").addEventListener("click",()=>submit(true));
  }else{
    $("#qnext").addEventListener("click",next);
    $("#qquit").addEventListener("click",renderResults);
    const acc=$("#qaccept");
    if(acc)acc.addEventListener("click",()=>{r.correct=true;r.overridden=true;Store.restore(q.id,r.prev);renderQ();});
    $("#qnext").focus({preventScroll:true});
  }
}
function submit(skip){
  const q=curQ();let picked=[],text="";
  if(!skip){
    if(q.t==="mc")picked=[...document.querySelectorAll('#quiz-root .opt[aria-checked="true"]')].map(b=>+b.dataset.oi);
    else text=$("#sainput").value.trim();
  }
  const correct=skip?false:grade(q,picked,text);
  const ansStr=q.t==="mc"?(picked.length?picked.map(oi=>LET[quiz.orders[q.id].indexOf(oi)]+". "+q.o[oi][0].replace(/<[^>]+>/g,"")).join(" / "):"(모르겠어요)"):(text||"(모르겠어요)");
  const prev=Store.record(q,correct,ansStr);markSolved(q.id,correct);
  quiz.res[q.id]={correct,picked,text,prev};
  renderQ();
}
function next(){if(quiz.i+1<quiz.ids.length){quiz.i++;renderQ();window.scrollTo(0,0);fx($("#quiz-root"));}else renderResults();}
function renderResults(){
  const done=quiz.ids.filter(id=>quiz.res[id]);
  const ok=done.filter(id=>quiz.res[id].correct).length;
  const wrongIds=done.filter(id=>!quiz.res[id].correct);
  const by={};done.forEach(id=>{const s=QMAP[id].s;by[s]=by[s]||[0,0];by[s][1]++;if(quiz.res[id].correct)by[s][0]++;});
  let h='<div class="panel result"><div class="prog"><span>'+esc(quiz.label)+'</span></div>'+
   '<h2>'+ok+' / '+done.length+'</h2><div class="score">정답률 '+(done.length?Math.round(ok/done.length*100):0)+'%'+(done.length<quiz.ids.length?' · '+(quiz.ids.length-done.length)+'문제 남기고 종료':'')+'</div>';
  if(done.length){
    h+='<div class="tw" style="margin-top:16px"><table><tr><th>소단원</th><th>맞힘</th><th>정답률</th></tr>'+
     Object.keys(by).sort().map(s=>'<tr><td><span class="mono">'+s+'</span> '+esc(SECS[s])+'</td><td class="mono">'+by[s][0]+' / '+by[s][1]+'</td><td class="mono">'+Math.round(by[s][0]/by[s][1]*100)+'%</td></tr>').join("")+'</table></div>';
  }
  if(wrongIds.length){
    h+='<h4 style="margin:18px 0 6px;font-size:.8rem;color:var(--muted);letter-spacing:.06em">이번에 틀린 문제</h4><div class="wlist" style="margin-top:0">'+
      wrongIds.map(id=>{const q=QMAP[id];return '<div class="wcard"><div class="wtop"><span class="pill t">'+q.s+'</span><span class="pill">'+(q.t==="mc"?"객관식":"단답식")+'</span></div><div class="wq">'+q.q+'</div><div class="ko" style="color:var(--muted);font-size:.9rem">'+q.k+'</div></div>';}).join("")+'</div>';
  }
  h+='<div class="actions">'+(wrongIds.length?'<button class="btn ghost" id="rretry">틀린 '+wrongIds.length+'문제 다시 풀기</button>':'')+
     '<button class="btn ghost" id="rwrong">오답노트 보기</button><button class="btn" id="rnew">새 퀴즈</button></div></div>';
  $("#quiz-root").innerHTML=h;window.scrollTo(0,0);fx($("#quiz-root"));
  const rr=$("#rretry");if(rr)rr.addEventListener("click",()=>startQuiz(wrongIds,"이번 퀴즈 오답",true));
  $("#rwrong").addEventListener("click",()=>showPage("wrong"));
  $("#rnew").addEventListener("click",()=>{quiz=null;renderSetup();});
}
document.addEventListener("keydown",e=>{
  if(curPage!=="quiz"||!quiz||e.target.tagName==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("button"))return;
  const q=curQ();if(!q)return;const r=quiz.res[q.id];
  if(e.key==="Enter"){if(r){const nb=$("#qnext");if(nb&&document.activeElement!==nb){e.preventDefault();nb.click();}}else{const sb=$("#qsubmit");if(sb&&!sb.disabled){e.preventDefault();sb.click();}}return;}
  if(!r&&q.t==="mc"){const k=e.key.toUpperCase();const idx=LET.indexOf(k)>=0?LET.indexOf(k):("12345".indexOf(e.key));
    if(idx>=0&&e.key.length===1){const b=document.querySelectorAll("#quiz-root .opt")[idx];if(b){e.preventDefault();b.click();}}}
});

/* ---------------- wrong notes ---------------- */
const wf={ch:"all",showRes:false,open:{},confirm:false};
function renderWrong(){
  const all=Object.values(Store.items).filter(v=>QMAP[v.qid]);
  const inCh=all.filter(v=>wf.ch==="all"||QMAP[v.qid].ch===wf.ch);
  const list=inCh.filter(v=>wf.showRes||!v.resolved).sort((a,b)=>(a.resolved-b.resolved)||((b.last||0)-(a.last||0)));
  const unres=inCh.filter(v=>!v.resolved);
  const resN=all.filter(v=>v.resolved).length;
  let h='<div class="wn-head"><div><h2>오답노트</h2><div class="store">'+(Store.mode==="db"?"내 계정에 저장됨 — 다른 기기에서 열어도 그대로 보여요":"이 브라우저에만 저장됨")+'</div></div>'+
   '<button class="btn" id="wretry"'+(unres.length?"":" disabled")+'>오답 다시 풀기 ('+unres.length+')</button></div>';
  h+='<div class="panel" style="padding:14px 16px"><div class="chips" id="wch">'+[["all","전체"],[1,"1장"],[2,"2장"],[3,"3장"],[4,"4장"]].map(([v,l])=>{
     const c=all.filter(x=>!x.resolved&&(v==="all"||QMAP[x.qid].ch===v)).length;
     return '<button class="chip" data-v="'+v+'" aria-pressed="'+(String(v)===String(wf.ch))+'">'+l+' <span class="mono">'+c+'</span></button>';}).join("")+
   '<button class="chip" id="wres" aria-pressed="'+wf.showRes+'">해결된 문제도 보기 <span class="mono">'+resN+'</span></button></div>'+
   (resN?'<div class="confirm" style="margin-top:10px">'+(wf.confirm?'해결된 '+resN+'문제를 오답노트에서 지울까요? <button class="btn danger sm" id="wclearyes">지우기</button><button class="btn ghost sm" id="wclearno">취소</button>':'<button class="btn ghost sm" id="wclear">해결된 문제 정리</button><span style="color:var(--muted)">다시 풀어 맞힌 문제는 ‘해결됨’으로 바뀝니다.</span>')+'</div>':'')+
   '</div>';
  if(!list.length){
    h+='<div class="empty"><div class="node">0</div><b>'+(all.length?"이 조건에 남은 오답이 없어요":"아직 저장된 오답이 없어요")+'</b><p>퀴즈에서 틀린 문제가 여기에 소단원 표시와 함께 쌓이고, 다시 풀어 맞히면 해결됨으로 바뀝니다.</p><button class="btn" id="wgo">퀴즈 풀러 가기</button></div>';
  }else{
    h+='<div class="wlist">'+list.map(v=>{const q=QMAP[v.qid];const open=wf.open[v.qid];
      return '<div class="wcard'+(v.resolved?" res":"")+'"><div class="wtop"><span class="pill t">'+q.s+' '+esc(SECS[q.s])+'</span><span class="pill">'+(q.t==="mc"?"객관식":"단답식")+'</span><span class="pill">틀린 횟수 ×'+(v.wrong||1)+'</span>'+(v.resolved?'<span class="tag c">해결됨</span>':'')+'</div>'+
       '<div class="wq">'+q.q+'</div>'+
       '<div style="font-size:.88rem;color:var(--muted);margin-top:4px">내 마지막 오답: <span class="mono">'+esc(v.ans||"")+'</span></div>'+
       (open?'<div style="margin-top:8px">'+feedbackHTML(q,{correct:false},false).replace(/<div class="verdict[^>]*>.*?<\/div>/,"")+'</div>':'')+
       '<div class="wbtns"><button class="btn ghost sm" data-wopen="'+v.qid+'">'+(open?"해설 접기":"번역·해설 보기")+'</button><button class="btn ghost sm" data-wone="'+v.qid+'">이 문제 다시 풀기</button><button class="btn ghost sm" data-wdel="'+v.qid+'" style="color:var(--goal)">삭제</button></div></div>';}).join("")+'</div>';
  }
  $("#wrong-root").innerHTML=h;
  const R=$("#wrong-root");
  R.querySelectorAll("#wch .chip[data-v]").forEach(c=>c.addEventListener("click",()=>{let v=c.dataset.v;if(/^\d$/.test(v))v=+v;wf.ch=v;renderWrong();}));
  $("#wres").addEventListener("click",()=>{wf.showRes=!wf.showRes;renderWrong();});
  const wc=$("#wclear");if(wc)wc.addEventListener("click",()=>{wf.confirm=true;renderWrong();});
  const wn=$("#wclearno");if(wn)wn.addEventListener("click",()=>{wf.confirm=false;renderWrong();});
  const wy=$("#wclearyes");if(wy)wy.addEventListener("click",()=>{Object.values(Store.items).filter(v=>v.resolved).forEach(v=>{delete Store.items[v.qid];Store.write(v.qid);});wf.confirm=false;renderWrong();});
  const wg=$("#wgo");if(wg)wg.addEventListener("click",()=>{quiz=null;showPage("quiz");});
  $("#wretry").addEventListener("click",()=>startQuiz(unres.map(v=>v.qid),"오답노트"+(wf.ch==="all"?"":" · "+wf.ch+"장"),true));
  R.querySelectorAll("[data-wopen]").forEach(b=>b.addEventListener("click",()=>{wf.open[b.dataset.wopen]=!wf.open[b.dataset.wopen];renderWrong();}));
  R.querySelectorAll("[data-wone]").forEach(b=>b.addEventListener("click",()=>startQuiz([b.dataset.wone],"오답노트 · 한 문제",true)));
  R.querySelectorAll("[data-wdel]").forEach(b=>b.addEventListener("click",()=>{delete Store.items[b.dataset.wdel];Store.write(b.dataset.wdel);renderWrong();}));
  R.querySelectorAll("[data-gosec]").forEach(b=>b.addEventListener("click",()=>gotoSection(b.dataset.gosec)));
}

/* ---------------- boot ---------------- */
Store.loadLocal();refreshBadge();showNotesCh(1);
{const h=(location.hash||"").replace("#","");const nm=/^notes-(\d)$/.exec(h);showPage(nm?"notes":["notes","quiz","wrong","mid"].includes(h)?h:"notes",false);if(nm)showNotesCh(+nm[1]);}
Store.connect();

</script>

</body></html>
