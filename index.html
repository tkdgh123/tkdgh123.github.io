<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>1학년 2학기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a code-notebook — a desk for two courses.
   Home is a portal of two cards; the C course is a tabbed notebook
   (강의정리 · 퀴즈 · 오답노트). Accent cycles per chapter. */
:root{
  --paper:#edf0f5; --card:#ffffff; --ink:#131b29; --muted:#465265; --line:#d2d8e3; --grid:#dfe4ec;
  --brand:#4651cc; --brand-soft:#e8eafb;
  --notes:#5650d0; --notes-soft:#ebeafb;
  --quiz:#187a4f;  --quiz-soft:#dff2e7; --on-quiz:#ffffff;
  --wrong:#c4362a; --wrong-soft:#fbe5e2; --on-wrong:#ffffff;
  --warn:#94620a;  --warn-soft:#f9eed4;
  --info:#1f5aa8;  --info-soft:#e1ebfa;
  --c4:#b44a20;    --c4-soft:#fae4d9;
  --code-bg:#f3f5fa; --code-line:#dde2ec; --gut:#97a1b3;
  --kw:#6d28d9; --st:#127238; --cm:#6b7588; --pp:#a14b00; --nm:#1661a8; --fn:#0a6873;
  --f-disp:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d1219; --card:#161d28; --ink:#eaeef5; --muted:#aab4c4; --line:#2b3544; --grid:#18202b;
  --brand:#949cf7; --brand-soft:#21243f;
  --notes:#ada3f5; --notes-soft:#242046;
  --quiz:#55c995;  --quiz-soft:#13301f; --on-quiz:#08180f;
  --wrong:#f27c74; --wrong-soft:#3b1a17; --on-wrong:#250807;
  --warn:#e7b555;  --warn-soft:#332911;
  --info:#86b7f6;  --info-soft:#16283f;
  --c4:#f39c69;    --c4-soft:#3a2116;
  --code-bg:#111923; --code-line:#253244; --gut:#5e6b7f;
  --kw:#c9a8ff; --st:#86e5ae; --cm:#8e9bad; --pp:#f3b867; --nm:#86c8f6; --fn:#62d6dd;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0d1219; --card:#161d28; --ink:#eaeef5; --muted:#aab4c4; --line:#2b3544; --grid:#18202b;
  --brand:#949cf7; --brand-soft:#21243f;
  --notes:#ada3f5; --notes-soft:#242046;
  --quiz:#55c995;  --quiz-soft:#13301f; --on-quiz:#08180f;
  --wrong:#f27c74; --wrong-soft:#3b1a17; --on-wrong:#250807;
  --warn:#e7b555;  --warn-soft:#332911;
  --info:#86b7f6;  --info-soft:#16283f;
  --c4:#f39c69;    --c4-soft:#3a2116;
  --code-bg:#111923; --code-line:#253244; --gut:#5e6b7f;
  --kw:#c9a8ff; --st:#86e5ae; --cm:#8e9bad; --pp:#f3b867; --nm:#86c8f6; --fn:#62d6dd;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.8;
  background-image:radial-gradient(var(--grid) 1px,transparent 1.3px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;line-height:1.3;margin:0}
b,strong{font-weight:700}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--code-line);padding:.08em .38em;border-radius:6px;color:var(--ink)}
.wrap{max-width:1260px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:11px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.logo{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--brand);color:#fff;
  font-family:var(--f-mono);font-weight:600;font-size:1.02rem}
.brand b{font-family:var(--f-disp);font-weight:400;font-size:1.34rem;letter-spacing:.01em;white-space:nowrap}
.brand .sub{color:var(--muted);font-size:.8rem;white-space:nowrap;line-height:1.3}
.home-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:600;color:var(--muted)}
.home-btn:hover{border-color:var(--ink);color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tab{padding:8px 17px;border-radius:999px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;color:var(--muted);white-space:nowrap}
@media (max-width:480px){.tab{padding:8px 11px;gap:6px;font-size:.88rem}.tab .dot{width:8px;height:8px}}
.tab:hover{color:var(--ink)}
.tab .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--dc)}
.tab[data-t="notes"]{--dc:var(--notes)} .tab[data-t="quiz"]{--dc:var(--quiz)} .tab[data-t="wrong"]{--dc:var(--wrong)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
a.vtab{text-decoration:none;--dc:var(--warn)} a.vtab:hover{color:var(--ink)} a.btn{text-decoration:none}
.tab[aria-selected="true"] .dot{background:var(--dc)}
.badge{font-family:var(--f-mono);font-size:.72rem;font-weight:600;background:var(--wrong);color:var(--on-wrong);border-radius:999px;padding:0 7px;line-height:1.7;min-width:20px;text-align:center}
.badge[hidden]{display:none}
main{padding-block:28px 80px}

/* ---------- HOME portal ---------- */
.hero{padding:40px 0 18px;text-align:center}
.hero .kick{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.14em;color:var(--brand);text-transform:uppercase}
.hero h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(2rem,6vw,3rem);margin:10px 0 8px}
.hero p{color:var(--muted);max-width:60ch;margin:0 auto;font-size:1.04rem}
.portal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:28px}
.pcard{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:26px 26px 22px;min-width:0;text-decoration:none;color:inherit;position:relative;overflow:hidden;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px -18px rgba(20,30,50,.5);border-color:var(--ac)}
.pcard::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--ac)}
.pcard.ai{--ac:var(--info);--ac-soft:var(--info-soft)} .pcard.c{--ac:var(--quiz);--ac-soft:var(--quiz-soft)}
.pc-ico{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:var(--ac-soft);color:var(--ac);
  font-family:var(--f-mono);font-weight:600;font-size:1.5rem}
.pc-tag{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;color:var(--ac);text-transform:uppercase}
.pcard h2{font-size:1.6rem}
.pcard .desc{color:var(--muted);font-size:.98rem;min-width:0}
.pc-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.chipm{font-family:var(--f-mono);font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted)}
.pc-go{margin-top:auto;display:inline-flex;align-items:center;gap:7px;font-weight:700;color:var(--ac);font-size:.98rem}
.home-note{margin-top:26px;text-align:center;color:var(--muted);font-size:.9rem}

/* ---------- NOTES ---------- */
.chsw{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
.chbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 16px;text-align:left;min-width:0;line-height:1.45}
.chbtn small{display:block;font-family:var(--f-mono);font-size:.74rem;color:var(--cc);font-weight:600}
.chbtn b{font-weight:700;font-size:1rem}
.chbtn:hover{border-color:var(--cc)}
[data-c="1"]{--cc:var(--notes);--cs:var(--notes-soft)}
[data-c="2"]{--cc:var(--quiz);--cs:var(--quiz-soft)}
[data-c="3"]{--cc:var(--info);--cs:var(--info-soft)}
[data-c="4"]{--cc:var(--c4);--cs:var(--c4-soft)}
.chbtn[aria-pressed="true"]{border-color:var(--cc);background:var(--cs);box-shadow:inset 0 0 0 1px var(--cc)}
.notes{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start;--ac:var(--cc);--ac-soft:var(--cs)}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto}
.toc .lbl{font-weight:700;font-size:.86rem;color:var(--muted);padding:4px 10px 6px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);padding:7px 10px;border-radius:9px;font-size:.93rem;line-height:1.45;border-left:3px solid transparent}
.toc a:hover{background:var(--ac-soft);color:var(--ink)}
.toc a.on{background:var(--ac-soft);color:var(--ink);font-weight:600;border-left-color:var(--ac)}
.toc a .n{font-family:var(--f-mono);font-size:.78rem;color:var(--ac);flex:none}
.ch-head{background:var(--ac-soft);border:1px solid color-mix(in srgb,var(--ac) 32%,var(--line));border-radius:18px;
  padding:20px 24px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ch-head .node{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:var(--card);
  font-family:var(--f-mono);font-weight:700;font-size:1.06rem}
.ch-head .tt{flex:1 1 260px;min-width:0}
.ch-head h2{font-family:var(--f-disp);font-weight:400;font-size:1.85rem}
.ch-head p{margin:4px 0 0;color:var(--muted);font-size:.98rem}
.ch-head .go{display:flex;gap:8px;flex-wrap:wrap}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 32px 30px;margin-bottom:24px;scroll-margin-top:96px}
.sec-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sec-h .pg{font-family:var(--f-mono);font-size:.8rem;font-weight:600;color:var(--ac);border:1.5px solid var(--ac);border-radius:999px;padding:0 10px;flex:none}
.sec-h h3{font-size:1.42rem;font-weight:700}
.sec-h .en{color:var(--muted);font-size:.86rem;font-family:var(--f-mono)}
.sec p{margin:14px 0;max-width:72ch}
.sec ul{margin:10px 0;padding-left:1.3em;max-width:74ch}
.sec li{margin:6px 0}
.call{border-radius:12px;padding:14px 18px;margin:18px 0;font-size:1rem;max-width:80ch}
.call .exl{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.8rem;letter-spacing:.03em;margin-bottom:4px;border-radius:6px;padding:1px 9px}
.call>div{margin-top:2px}
.key{background:var(--quiz-soft);border:1px solid color-mix(in srgb,var(--quiz) 30%,transparent)} .key .exl{background:var(--quiz);color:var(--on-quiz)}
.warnb{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)} .warnb .exl{background:var(--warn);color:var(--card)}
.exb{background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)} .exb .exl{background:var(--info);color:var(--card)}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.97rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--code-bg);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.y{color:var(--quiz);font-weight:700} td.n{color:var(--wrong);font-weight:700}

/* code block */
.codewrap{margin:20px 0}
.codecap{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.84rem;color:var(--muted);
  background:var(--code-bg);border:1px solid var(--code-line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 14px}
.codecap::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:#2fb36a;box-shadow:16px 0 0 #e0a52b,32px 0 0 #e1574b;margin-right:32px}
.codecap b{color:var(--ink);font-weight:600}
.pre{display:flex;overflow-x:auto;background:var(--code-bg);border:1px solid var(--code-line);border-radius:0 0 12px 12px;margin:0}
.codewrap.nocap .pre,.pre.solo{border-radius:12px}
.pre .gut{flex:none;padding:16px 10px 16px 14px;text-align:right;color:var(--gut);font-family:var(--f-mono);font-size:.92rem;line-height:1.75;
  white-space:pre;user-select:none;border-right:1px solid var(--code-line);background:color-mix(in srgb,var(--code-bg) 70%,var(--line))}
.pre code{display:block;flex:1 0 auto;background:none;border:0;padding:16px 20px;font-family:var(--f-mono);font-size:.92rem;line-height:1.75;white-space:pre;color:var(--ink);border-radius:0}
.pre .kw{color:var(--kw);font-weight:600} .pre .st{color:var(--st)} .pre .cm{color:var(--cm);font-style:italic}
.pre .pp{color:var(--pp)} .pre .nm{color:var(--nm)} .pre .fn{color:var(--fn)}
.cnote{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 26%,var(--line));border-top:0;
  border-radius:0 0 13px 13px;padding:14px 20px 16px;font-size:1rem;line-height:1.8;margin-top:-1px}
.codewrap:has(.cnote) .pre{border-radius:0}
.codewrap.nocap:has(.cnote) .pre{border-radius:12px 12px 0 0}
.cnote .lb{display:block;font-weight:700;font-size:.85rem;color:var(--brand);margin-bottom:4px}
.cnote ul{margin:6px 0 0;padding-left:1.25em}
.cnote li{margin:7px 0}
.out{background:#0e1613;border:1px solid #213229;border-radius:12px;padding:14px 18px;margin:18px 0;overflow-x:auto}
.out .ol{display:block;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.06em;color:#7fb398;margin-bottom:7px;text-transform:uppercase}
.out pre{margin:0;font-family:var(--f-mono);font-size:.92rem;line-height:1.65;color:#a8f0c6;white-space:pre-wrap;word-break:break-word}

/* buttons */
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 20px;font-weight:700;font-size:.96rem;display:inline-flex;gap:7px;align-items:center;line-height:1.3}
.btn:disabled{opacity:.42}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:.88rem}
.btn.g{background:var(--quiz);border-color:var(--quiz);color:var(--on-quiz)}
.btn.r{background:transparent;color:var(--wrong);border-color:var(--wrong)}

/* ---------- QUIZ ---------- */
.qpanel{max-width:940px;margin:0 auto}
.qsub{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;margin-bottom:16px}
.qsub button{border-radius:999px;padding:8px 20px;font-weight:700;font-size:.95rem;color:var(--muted)}
.qsub button[aria-selected="true"]{background:var(--quiz);color:var(--on-quiz)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px}
.setup h2,.wn-head h2{font-family:var(--f-disp);font-weight:400;font-size:1.95rem}
.setup .sub{color:var(--muted);margin:8px 0 6px;max-width:66ch;font-size:1rem}
.field{margin:20px 0}
.fl{display:block;font-weight:700;font-size:.94rem;margin-bottom:9px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:.95rem;font-weight:600;color:var(--ink);line-height:1.35}
.chip:hover{border-color:var(--quiz)}
.chip[aria-pressed="true"]{background:var(--quiz);border-color:var(--quiz);color:var(--on-quiz)}
.chip .ct{font-family:var(--f-mono);font-size:.8em;opacity:.75;margin-left:3px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:14px 18px;border-color:color-mix(in srgb,var(--quiz) 45%,var(--line))}
.resume b{display:block;font-size:1rem}.resume span{font-size:.9rem;color:var(--muted)}.resume .ra{display:flex;gap:8px}
.sprog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px;font-size:.9rem;color:var(--muted)}
.sprog b{color:var(--ink);font-family:var(--f-mono)}
.spbar{flex:1 1 160px;max-width:260px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.spbar i{display:block;height:100%;background:var(--quiz);border-radius:3px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.legend b{color:var(--ink);font-family:var(--f-mono)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin-bottom:20px}
.prog .num{font-family:var(--f-mono);font-weight:600;color:var(--ink)}
.bar{flex:1 1 140px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--quiz);transition:width .5s ease}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:.82rem;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 11px;color:var(--muted);line-height:1.5}
.pill.t{border-color:var(--notes);color:var(--notes)}
.pill.ty{border-color:var(--quiz);color:var(--quiz)}
.qtext{font-size:1.34rem;font-weight:700;line-height:1.6;margin:4px 0 10px}
.qtext code,.ot code{font-size:.85em}
.qtext .pre{margin-top:12px;font-weight:400;font-size:1rem}
.wq .pre{margin-top:8px}
.qdesc{white-space:pre-line}
.ed{border:1px solid var(--code-line);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.edbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 14px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--code-line)}
#fcode{display:block;width:100%;min-height:360px;resize:vertical;border:0;background:transparent;color:var(--ink);font-family:var(--f-mono);font-size:.95rem;line-height:1.7;padding:14px 16px;tab-size:4;white-space:pre;overflow:auto;box-sizing:border-box}
#fcode:focus,#fin:focus{outline:2.5px solid var(--brand);outline-offset:-2px}
.runbox{display:grid;gap:8px;margin-top:12px}
.rbh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rbh label{font-size:.9rem;color:var(--muted);margin-right:auto}
#fin{width:100%;box-sizing:border-box;font-family:var(--f-mono);font-size:.95rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);color:var(--ink);resize:vertical}
.runbox .out{margin:4px 0 0}
.out .perr{color:#ff9d93}
.tests{display:grid;gap:10px;margin-top:14px}

.brow.ok .c{background:var(--quiz);color:var(--on-quiz)} .brow.bad .c{background:var(--wrong);color:var(--on-wrong)}

<script>
"use strict";
const NOTES=window.NOTES||[], QZ=window.QUIZ||{mc:[],sa:[]}, GEN=window.GEN||{mc:[],sa:[],lb:[],fc:[]};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const main=$("#main"), topbar=$("#topbar");
const CHN={}; NOTES.forEach(c=>CHN[c.id]=c);
const chLabel=id=>CHN[id]?CHN[id].no+"장 "+CHN[id].title:"";
const CIRC="①②③④⑤⑥⑦⑧⑨⑩";
const LET="ABCDE";

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function nl2br(s){return esc(s).replace(/\n/g,"<br>");}
function qid(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return "q"+(h>>>0);}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fx=el=>{if(!el)return;el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter");};

/* ================= question bank ================= */
const QB=[];
QZ.mc.concat(GEN.mc).forEach(q=>QB.push({id:qid("mc|"+q.q),t:"mc",ch:q.ch,q:q.q,opts:q.opts,ans:q.ans,exp:q.exp}));
QZ.sa.concat(GEN.sa).forEach(q=>QB.push({id:qid("sa|"+q.q),t:"sa",ch:q.ch,q:q.q,a:q.a,exp:q.exp}));
/* 한 줄 코드: 프로그램마다 핵심 줄 하나씩을 빈칸으로 */
GEN.lb.forEach(b=>{const marks=[];b.s.replace(/⟦([^⟧]*)⟧/g,(m,g)=>{marks.push(g.split("¦"));return m;});
  marks.forEach((acc,k)=>{let j=0;const src=b.s.replace(/⟦([^⟧]*)⟧/g,(m,g)=>j++===k?String.fromCharCode(0xE100):g.split("¦")[0]);
    QB.push({id:qid("lb|"+b.t+"|"+k+"|"+acc[0]),t:"cb",ch:b.ch,q:b.t,d:b.d,src,acc:[acc],h:[],x:[(b.x||[])[k]||""],exp:b.e||"",k:k+1,n:marks.length});});});
/* 코드 작성: 전체 프로그램을 작성해 테스트로 채점 */
GEN.fc.forEach(f=>QB.push({id:qid("fc|"+f.t),t:"fc",ch:f.ch,q:f.t,d:f.d,tests:f.tests,sol:f.sol,h:f.h||[],exp:f.e||""}));
const QMAP=Object.fromEntries(QB.map(q=>[q.id,q]));
const TYPE={mc:"객관식",sa:"단답형",cb:"한 줄 코드",fc:"코드 작성"};
const isSub=t=>t==="sa"||t==="cb"||t==="fc";
/* 질문 본문: 빈 줄 뒤는 코드로 보여 준다 */
function qHTML(q){const i=q.indexOf("\n\n");if(i<0)return esc(q).replace(/\n/g,"<br>");return esc(q.slice(0,i))+preHTML(hlC(q.slice(i+2)),true);}

/* ================= wrong-note store ================= */
const WKEY="cprog_wrong_v2";
let W=load(WKEY,null);
if(!W||typeof W!=="object"){
  W={};
  const old=load("cprog_wrong_v1",[]);
  if(Array.isArray(old))old.forEach(o=>{const q=QMAP[o.id];if(!q)return;
    let ans=o.your;if(o.type==="mc"&&typeof o.your==="number")ans=LET[o.your]+". "+(q.opts[o.your]||"");
    W[o.id]={qid:o.id,wrong:1,last:Date.now(),ans:String(ans==null?"":ans),resolved:!!o.res};});
  save(WKEY,W);
}
function saveW(){save(WKEY,W);updateBadge();}
function record(q,correct,ans){
  const prev=W[q.id]?Object.assign({},W[q.id]):null;const now=Date.now();
  if(!correct){const it=W[q.id]||{qid:q.id,wrong:0};it.wrong=(it.wrong||0)+1;it.last=now;it.ans=String(ans).slice(0,400);it.resolved=false;W[q.id]=it;}
  else if(W[q.id]&&!W[q.id].resolved){W[q.id].resolved=true;W[q.id].last=now;}
  saveW();return prev;
}
function restore(id,prev){if(prev)W[id]=prev;else delete W[id];saveW();}
const allWrong=()=>Object.values(W).filter(v=>QMAP[v.qid]);
function updateBadge(){const n=allWrong().filter(v=>!v.resolved).length;const b=$("#wbadge");if(!b)return;b.textContent=n;b.hidden=n===0;}

/* ================= C syntax highlighter ================= */
const KW=new Set("int char short long float double void unsigned signed const static auto register extern return if else for while do switch case default break continue goto sizeof struct enum union typedef".split(" "));
function hlC(src){
  let out="",i=0;const n=src.length;
  const e=s=>s.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
  while(i<n){
    const c=src[i];
    if(c==="/"&&src[i+1]==="*"){let j=src.indexOf("*/",i+2);j=(j<0?n:j+2);out+='<span class="cm">'+e(src.slice(i,j))+"</span>";i=j;continue;}
    if(c==="/"&&src[i+1]==="/"){let j=src.indexOf("\n",i);j=(j<0?n:j);out+='<span class="cm">'+e(src.slice(i,j))+"</span>";i=j;continue;}
    if(c==="#"&&(i===0||src[i-1]==="\n")){let j=src.indexOf("\n",i);j=(j<0?n:j);out+='<span class="pp">'+e(src.slice(i,j))+"</span>";i=j;continue;}
    if(c==='"'){let j=i+1;while(j<n&&src[j]!=='"'&&src[j]!=="\n"){if(src[j]==="\\")j++;j++;}j++;out+='<span class="st">'+e(src.slice(i,j))+"</span>";i=j;continue;}
    if(c==="'"){let j=i+1;while(j<n&&src[j]!=="'"&&src[j]!=="\n"){if(src[j]==="\\")j++;j++;}j++;out+='<span class="st">'+e(src.slice(i,j))+"</span>";i=j;continue;}
    if(/[A-Za-z_]/.test(c)){let j=i+1;while(j<n&&/[A-Za-z0-9_]/.test(src[j]))j++;const w=src.slice(i,j);
      if(KW.has(w))out+='<span class="kw">'+w+"</span>";
      else if(/^\s*\(/.test(src.slice(j,j+8)))out+='<span class="fn">'+w+"</span>";
      else out+=w;
      i=j;continue;}
    if(/[0-9]/.test(c)){let j=i+1;while(j<n&&/[0-9a-fA-FxX.]/.test(src[j]))j++;out+='<span class="nm">'+src.slice(i,j)+"</span>";i=j;continue;}
    out+=e(c);i++;
  }
  return out;
}
function preHTML(hl,solo){
  const n=hl.split("\n").length;let g="";for(let i=1;i<=n;i++)g+=i+(i<n?"\n":"");
  return '<div class="pre'+(solo?" solo":"")+'"><div class="gut" aria-hidden="true">'+g+'</div><code>'+hl+'</code></div>';
}

/* ================= notes blocks ================= */
function call(cls,label,h){return '<div class="call '+cls+'"><span class="exl">'+label+'</span><div>'+h+'</div></div>';}
function renderBlock(b){
  switch(b.t){
    case "p": return '<p>'+b.h+'</p>';
    case "key": return call("key","핵심",b.h);
    case "warn": return call("warnb","주의",b.h);
    case "ex": return call("exb","예시",b.h);
    case "table": return '<div class="tw">'+b.h+'</div>';
    case "out": return '<div class="out"><span class="ol">실행 결과</span><pre>'+nl2br(b.h)+'</pre></div>';
    case "code":{
      const cap=b.cap?'<div class="codecap"><b>'+esc(b.cap)+'</b></div>':'';
      const note=b.note?'<div class="cnote"><span class="lb">코드 설명</span>'+b.note+'</div>':'';
      return '<div class="codewrap'+(b.cap?'':' nocap')+'">'+cap+preHTML(hlC(b.s))+note+'</div>';
    }
    default: return '';
  }
}

/* ================= HOME ================= */
function showHome(){
  topbar.hidden=true;stopToc();
  document.title="1학년 2학기";
  main.innerHTML=`
  <section class="hero">

    <div class="portal">
      <a class="pcard ai" href="ai.html">
        <div class="pc-ico">AI</div>
        <div class="pc-tag">과목 01</div>
        <h2>인공지능 입문</h2>
        <div class="desc">AI 이해와 역사 · 지능형 에이전트 · 탐색으로 문제 풀기 · 복잡한 환경의 탐색(1~4장)</div>
        <div class="pc-meta"><span class="chipm">강의내용</span><span class="chipm">퀴즈</span><span class="chipm">오답노트</span></div>
        <span class="pc-go">들어가기 →</span>
      </a>
      <a class="pcard c" href="#notes">
        <div class="pc-ico">&lt;/&gt;</div>
        <div class="pc-tag">과목 02</div>
        <h2>프로그래밍기초</h2>
        <div class="desc">C언어 — 프로그램 작성 과정부터 자료형·연산자·조건문·반복문·함수·재귀까지(2~9장)</div>

        <span class="pc-go">들어가기 →</span>
      </a>
    </div>
    <div class="home-note">두 과목 모두 이 사이트 안에서 열립니다. 각 과목 상단의 ← 홈으로 돌아올 수 있어요.</div>
  </section>`;
}

/* ================= PROG shell ================= */
let curTab="notes", curCh=load("cprog_ch","ch2");
function showProg(tab){
  curTab=tab;topbar.hidden=false;document.title="프로그래밍기초 · C언어 복습";
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.t===tab?"true":"false"));
  updateBadge();
  if(tab!=="notes")stopToc();
  if(tab==="notes")renderNotes();else if(tab==="quiz")renderQuiz();else renderWrong();
  window.scrollTo(0,0);fx(main);
}

/* ================= NOTES ================= */
let tocObs=null;
function stopToc(){if(tocObs){tocObs.disconnect();tocObs=null;}}
function watchToc(){
  stopToc();if(!("IntersectionObserver" in window))return;
  const links={};$$(".toc a").forEach(a=>links[a.dataset.sec]=a);

  }else{
    h+=feedbackHTML(q,r,true);
    h+='<div class="actions"><button class="btn ghost" id="qquit">그만하고 결과 보기</button><button class="btn g" id="qnext">'+(run.i+1<n?"다음 문제 →":"결과 보기 →")+'</button></div>';
  }
  h+='</div>';
  $("#qroot").innerHTML=h;
  bindQ(q,r);
}
function feedbackHTML(q,r,live){
  let h='<div class="verdict '+(r.correct?"ok":"bad")+'">'+(r.correct?"✓ 정답입니다":"✗ 틀렸습니다 — 오답노트에 저장했어요")+'</div><div class="exp">';
  if(q.t==="sa")h+='<h4>답</h4><dl class="ansrow"><dt>내 답</dt><dd class="'+(r.correct?"good":"badv")+'">'+(r.text?esc(r.text):"(입력 없음)")+'</dd><dt>정답</dt><dd class="good">'+esc(q.a[0])+'</dd></dl>';
  if(q.t==="fc"){
    h+='<h4>모범 답안</h4>'+preHTML(hlC(q.sol),true);
  }
  if(q.t==="cb"){
    h+='<h4>정답 줄과 설명</h4>'+q.acc.map((acc,i)=>{const ok=r.bres[i],v=r.vals[i];
      return '<div class="brow '+(ok?"ok":"bad")+'"><span class="c">'+CIRC[i]+'</span><div><div class="a">'+(ok?'<span class="good">'+esc(v)+'</span>':(v?'<span class="badv">'+esc(v)+'</span> → ':'(빈칸) → ')+'<span class="good">'+esc(acc[0])+'</span>')+'</div>'+
        (acc.length>1?'<div class="alt">다른 정답: '+acc.slice(1).map(esc).join(" · ")+'</div>':'')+'<div class="w">'+esc(q.x[i]||"")+'</div></div></div>';}).join("");
  }
  if(q.exp)h+='<h4>'+(q.t==="cb"?"정리":"해설")+'</h4><div class="xp">'+esc(q.exp)+'</div>';
  h+='<div class="fbtns">'+(live&&isSub(q.t)&&!r.correct&&r.any?'<button class="btn ghost sm" id="qaccept">내 답도 맞아요 (정답 처리)</button>':'')+
     '<button class="btn ghost sm" data-gonotes="'+q.ch+'">'+esc(chLabel(q.ch))+' 강의정리 보기</button></div>';
  return h+'</div>';
}
function bindQ(q,r){
  const root=$("#qroot");
  $("#qexit").onclick=()=>{saveRun();run=null;renderQuiz();window.scrollTo(0,0);};
  $$("[data-gonotes]",root).forEach(b=>b.onclick=()=>{curCh=b.dataset.gonotes;save("cprog_ch",curCh);location.hash="notes";});
  if(!r){
    if(q.t==="mc"){
      $$(".opt",root).forEach(b=>b.onclick=()=>{$$(".opt",root).forEach(x=>x.setAttribute("aria-checked","false"));b.setAttribute("aria-checked","true");$("#qsubmit").disabled=false;});
    }else if(q.t==="sa"){
      const inp=$("#sainput");inp.focus({preventScroll:true});
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();submit();}});
    }else if(q.t==="fc"){
      bindEditor(q);
    }else{
      const ins=$$(".bk-in",root);if(ins[0])ins[0].focus({preventScroll:true});
      ins.forEach((inp,k)=>inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();if(k+1<ins.length)ins[k+1].focus();else submit();}}));
      const hb=$("#hintBtn");if(hb)hb.onclick=()=>{const l=$(".hlist",root);l.hidden=!l.hidden;hb.textContent=l.hidden?"힌트 보기":"힌트 숨기기";};
    }
    $("#qsubmit").onclick=()=>submit();
    $("#qskip").onclick=()=>submit(true);
  }else{
    $("#qnext").onclick=next;
    $("#qquit").onclick=renderResults;
    const acc=$("#qaccept");
    if(acc)acc.onclick=()=>{r.correct=true;restore(q.id,r.prev);if(SOLVED[q.id]){SOLVED[q.id].c=true;save(SKEY,SOLVED);}saveRun();renderQ();};
    $("#qnext").focus({preventScroll:true});
  }
}
function submit(skip){
  const q=curQ();let r={correct:false,any:false};
  if(q.t==="mc"){
    const sel=$('#qroot .opt[aria-checked="true"]');r.pick=(!skip&&sel)?+sel.dataset.oi:-1;r.correct=r.pick===q.ans;
    r.ans=r.pick>=0?LET[run.orders[q.id].indexOf(r.pick)]+". "+q.opts[r.pick]:"(모르겠어요)";
  }else if(q.t==="sa"){
    r.text=skip?"":$("#sainput").value.trim();r.any=!!r.text;r.correct=!skip&&matchSA(r.text,q.a);r.ans=r.text||"(모르겠어요)";
  }else if(q.t==="fc"){
    const code=skip?"":$("#fcode").value;
    r.code=code;r.any=!skip&&code.trim()!==""&&code.trim()!==FC_TEMPLATE.trim();
    r.tests=q.tests.map(t=>{if(skip)return{in:t.in,exp:t.out,out:"",pass:false};const res=window.CMini.run(code,t.in);return{in:t.in,exp:t.out,out:res.out,err:res.err,line:res.line,phase:res.phase,pass:!res.err&&squash(res.out).includes(squash(t.out))};});
    r.correct=!skip&&r.tests.every(x=>x.pass);
    r.ans=skip?"(모르겠어요)":"테스트 "+r.tests.filter(x=>x.pass).length+"/"+r.tests.length+" 통과";
  }else{
    r.vals=q.acc.map((_,i)=>{const el=$('#qroot .bk-in[data-b="'+i+'"]');return skip||!el?"":el.value.trim();});
    r.bres=r.vals.map((v,i)=>!!v&&q.acc[i].some(a=>normCode(a)===normCode(v)));
    r.any=r.vals.some(v=>v);r.correct=r.bres.every(Boolean);
    r.ans=r.any?r.vals.map((v,i)=>CIRC[i]+" "+(v||"—")).join("   "):"(모르겠어요)";
  }
  r.prev=record(q,r.correct,r.ans);
  r.prevSolved=SOLVED[q.id]?Object.assign({},SOLVED[q.id]):null;markSolved(q.id,r.correct);
  run.res[q.id]=r;
  saveRun();
  renderQ();
}
function next(){const j=run.ids.findIndex((id,k)=>k>run.i&&!run.res[id]);if(j>=0){run.i=j;renderQ();window.scrollTo(0,0);fx($("#qroot"));}else renderResults();}
function renderResults(){
  clearRun();
  const done=run.ids.filter(id=>run.res[id]);
  const ok=done.filter(id=>run.res[id].correct).length;
  const wrongIds=done.filter(id=>!run.res[id].correct);
  const by={};done.forEach(id=>{const c=QMAP[id].ch;by[c]=by[c]||[0,0];by[c][1]++;if(run.res[id].correct)by[c][0]++;});
  let h='<div class="panel result"><div class="prog"><span>'+esc(run.label)+(run.review?" · 오답 복습":"")+'</span></div>'+
    '<h2>'+ok+' / '+done.length+'</h2><div class="score">정답률 '+(done.length?Math.round(ok/done.length*100):0)+'%'+(done.length<run.ids.length?' · '+(run.ids.length-done.length)+'문제 남기고 종료':'')+'</div>';
  if(done.length)h+='<div class="tw" style="margin-top:20px"><table><tr><th>단원</th><th>맞힘</th><th>정답률</th></tr>'+
    Object.keys(by).sort((a,b)=>CHN[a].no-CHN[b].no).map(c=>'<tr><td>'+esc(chLabel(c))+'</td><td>'+by[c][0]+' / '+by[c][1]+'</td><td>'+Math.round(by[c][0]/by[c][1]*100)+'%</td></tr>').join("")+'</table></div>';
  if(wrongIds.length)h+='<h4 style="margin:22px 0 4px">이번에 틀린 문제</h4><div class="wlist" style="margin-top:8px">'+
    wrongIds.map(id=>{const q=QMAP[id];return '<div class="wcard"><div class="wtop"><span class="pill t">'+esc(chLabel(q.ch))+'</span><span class="pill">'+TYPE[q.t]+'</span></div><div class="wq">'+esc(q.q)+'</div></div>';}).join("")+'</div>';
  h+='<div class="actions">'+(wrongIds.length?'<button class="btn ghost" id="rretry">틀린 '+wrongIds.length+'문제 다시 풀기</button>':'')+
    '<button class="btn ghost" id="rwrong">오답노트 보기</button><button class="btn g" id="rnew">새 퀴즈</button></div></div>';
  $("#qroot").innerHTML=h;window.scrollTo(0,0);fx($("#qroot"));
  const rr=$("#rretry");if(rr)rr.onclick=()=>startRun(wrongIds,"이번 퀴즈 오답",true);
  $("#rwrong").onclick=()=>{location.hash="wrong";};
  $("#rnew").onclick=()=>{run=null;renderQuiz();};
}
document.addEventListener("keydown",e=>{
  if(curTab!=="quiz"||!run||!$("#qroot .run"))return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==="Enter"&&e.target.closest&&e.target.closest("button"))return;
  const q=curQ();if(!q)return;const r=run.res[q.id];
  if(e.key==="Enter"){const b=r?$("#qnext"):$("#qsubmit");if(b&&!b.disabled){e.preventDefault();b.click();}return;}
  if(!r&&q.t==="mc"&&e.key.length===1){
    const k=e.key.toUpperCase();let idx=LET.indexOf(k);if(idx<0)idx="12345".indexOf(e.key);
    const opts=$$("#qroot .opt");if(idx>=0&&opts[idx]){e.preventDefault();opts[idx].click();}
  }
});

/* ================= WRONG NOTES ================= */
const wf={ch:"all",showRes:false,open:{},confirm:false};
function answerHTML(q){
  if(q.t==="mc")return '<h4>정답</h4><div class="xp"><b>'+esc(q.opts[q.ans])+'</b></div><h4>해설</h4><div class="xp">'+esc(q.exp)+'</div>';
  if(q.t==="sa")return '<h4>정답</h4><div class="xp" style="font-family:var(--f-mono);color:var(--quiz);font-weight:600">'+esc(q.a[0])+'</div><h4>해설</h4><div class="xp">'+esc(q.exp)+'</div>';
  if(q.t==="fc")return '<div class="qdesc" style="margin-top:6px">'+esc(q.d)+'</div><h4>모범 답안</h4>'+preHTML(hlC(q.sol),true)+(q.exp?'<h4>해설</h4><div class="xp">'+esc(q.exp)+'</div>':'');
  return '<div class="qdesc" style="margin-top:6px">'+esc(q.d)+'</div>'+cbCode(q,"answer")+
    '<h4 style="margin-top:16px">정답 줄 설명</h4>'+q.acc.map((acc,i)=>'<div class="brow ok"><span class="c">'+CIRC[i]+'</span><div><div class="a"><span class="good">'+esc(acc[0])+'</span></div><div class="w">'+esc(q.x[i]||"")+'</div></div></div>').join("")+
    (q.exp?'<h4>정리</h4><div class="xp">'+esc(q.exp)+'</div>':'');
}
function renderWrong(){
  const all=allWrong();
  const inCh=all.filter(v=>wf.ch==="all"||QMAP[v.qid].ch===wf.ch);
  const list=inCh.filter(v=>wf.showRes||!v.resolved).sort((a,b)=>(a.resolved-b.resolved)||((b.last||0)-(a.last||0)));
  const unres=inCh.filter(v=>!v.resolved);
  const resN=all.filter(v=>v.resolved).length;
  let h='<div class="wrap-wrong"><div class="wn-head"><div><h2>오답노트</h2><p>객관식·단답형·한 줄 코드·코드 작성에서 틀린 문제가 모입니다. 다시 풀어 맞히면 ‘해결됨’으로 바뀝니다. 이 브라우저에 저장됩니다.</p></div>'+
    '<button class="btn g" id="wretry"'+(unres.length?"":" disabled")+'>오답 다시 풀기 ('+unres.length+')</button></div>';
  h+='<div class="panel wfil"><div class="chips" id="wch">'+[["all","전체"]].concat(NOTES.map(c=>[c.id,c.no+"장"])).map(([v,l])=>{
      const c=all.filter(x=>!x.resolved&&(v==="all"||QMAP[x.qid].ch===v)).length;
      return '<button class="chip" data-v="'+v+'" aria-pressed="'+(v===wf.ch)+'">'+l+'<span class="ct">'+c+'</span></button>';}).join("")+
    '<button class="chip" id="wres" aria-pressed="'+wf.showRes+'">해결된 문제도 보기<span class="ct">'+resN+'</span></button></div>'+
    (resN?'<div class="confirm">'+(wf.confirm?'해결된 '+resN+'문제를 오답노트에서 지울까요? <button class="btn r sm" id="wclearyes">지우기</button><button class="btn ghost sm" id="wclearno">취소</button>':'<button class="btn ghost sm" id="wclear">해결된 문제 정리</button><span>다시 풀어 맞힌 문제는 ‘해결됨’으로 바뀝니다.</span>')+'</div>':'')+'</div>';
  if(!list.length){
    h+='<div class="empty"><div class="big">✓</div><b>'+(all.length?"이 조건에 남은 오답이 없어요":"아직 저장된 오답이 없어요")+'</b>퀴즈에서 틀린 문제가 여기에 쌓이고, 다시 풀어 맞히면 해결됨으로 바뀝니다.<div style="margin-top:16px"><button class="btn g" id="wgo">퀴즈 풀러 가기</button></div></div>';
  }else{
    h+='<div class="wlist">'+list.map(v=>{const q=QMAP[v.qid],open=wf.open[v.qid];
      return '<div class="wcard'+(v.resolved?" res":"")+'"><div class="wtop"><span class="pill t">'+esc(chLabel(q.ch))+'</span><span class="pill ty">'+TYPE[q.t]+'</span><span class="pill">틀린 횟수 ×'+(v.wrong||1)+'</span>'+(v.resolved?'<span class="tag c">해결됨</span>':'')+'</div>'+
        '<div class="wq">'+qHTML(q.q)+'</div>'+
        '<div class="wlast">내 마지막 오답: <span>'+esc(v.ans||"")+'</span></div>'+
        (open?'<div class="exp">'+answerHTML(q)+'</div>':'')+
        '<div class="fbtns"><button class="btn ghost sm" data-wopen="'+v.qid+'">'+(open?"정답 접기":"정답·해설 보기")+'</button><button class="btn g sm" data-wone="'+v.qid+'">이 문제 다시 풀기</button><button class="btn ghost sm" data-wdel="'+v.qid+'" style="color:var(--wrong)">삭제</button></div></div>';}).join("")+'</div>';
  }
  h+='</div>';
  main.innerHTML=h;
  $$("#wch .chip[data-v]").forEach(c=>c.onclick=()=>{wf.ch=c.dataset.v;renderWrong();});
  $("#wres").onclick=()=>{wf.showRes=!wf.showRes;renderWrong();};
  const wc=$("#wclear");if(wc)wc.onclick=()=>{wf.confirm=true;renderWrong();};
  const wn=$("#wclearno");if(wn)wn.onclick=()=>{wf.confirm=false;renderWrong();};
  const wy=$("#wclearyes");if(wy)wy.onclick=()=>{Object.values(W).filter(v=>v.resolved).forEach(v=>delete W[v.qid]);saveW();wf.confirm=false;renderWrong();};
  const wg=$("#wgo");if(wg)wg.onclick=()=>{run=null;location.hash="quiz";};
  $("#wretry").onclick=()=>startRun(unres.map(v=>v.qid),"오답노트"+(wf.ch==="all"?"":" · "+CHN[wf.ch].no+"장"),true);
  $$("[data-wopen]").forEach(b=>b.onclick=()=>{wf.open[b.dataset.wopen]=!wf.open[b.dataset.wopen];renderWrong();});
  $$("[data-wone]").forEach(b=>b.onclick=()=>startRun([b.dataset.wone],"오답노트 · 한 문제",true));
  $$("[data-wdel]").forEach(b=>b.onclick=()=>{delete W[b.dataset.wdel];saveW();renderWrong();});
}

/* ================= router ================= */
function route(){
  const h=(location.hash||"").replace("#","");
  if(h==="notes"||h==="prog")showProg("notes");
  else if(h==="quiz")showProg("quiz");
  else if(h==="wrong")showProg("wrong");
  else showHome();
}
$$(".tab[data-t]").forEach(t=>t.onclick=()=>{if(location.hash==="#"+t.dataset.t)route();else location.hash=t.dataset.t;});
$("#homeBtn").onclick=()=>{location.hash="";};
window.addEventListener("hashchange",route);
updateBadge();
route();
</script>
