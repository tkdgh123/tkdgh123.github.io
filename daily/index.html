<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매일 AI 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 아침 카톡에서 여는 한 장짜리 수업 노트: 휴대폰 한 손 폭, 둥근 카드, 핵심은 카톡 노랑 판 */
:root {
  --bg: #F2F5FA; --card: #FFFFFF; --ink: #1E2638; --ink-2: #5C667C; --line: #DDE3EE;
  --acc: #3E63DD; --acc-soft: #E5EBFC; --key: #FFE97A; --key-ink: #3A3000; --good: #1F8A55; --bad: #C2413A;
  --title: "Jua", "Gowun Dodum", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161F; --card: #1B2130; --ink: #E8ECF4; --ink-2: #A3ACBF; --line: #2B3346;
  --acc: #8FA8FF; --acc-soft: #252F4D; --key: #5A4D10; --key-ink: #FFF3B8; --good: #5CD39A; --bad: #FF8A80; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161F; --card: #1B2130; --ink: #E8ECF4; --ink-2: #A3ACBF; --line: #2B3346;
  --acc: #8FA8FF; --acc-soft: #252F4D; --key: #5A4D10; --key-ink: #FFF3B8; --good: #5CD39A; --bad: #FF8A80; color-scheme: dark }

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.75 var(--body); word-break: keep-all; overflow-wrap: anywhere }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; display: grid; gap: 18px }
a { color: inherit }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px }

nav { display: flex; gap: 8px; flex-wrap: wrap }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); text-decoration: none; font-size: 15px; cursor: pointer }
.pill.on { background: var(--acc); border-color: var(--acc); color: #fff }

.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px }
.day { font-family: var(--title); font-size: 15px; background: var(--acc); color: #fff; padding: 3px 12px; border-radius: 999px }
.unit { font-size: 14px; color: var(--ink-2) }
h1 { font-family: var(--title); font-weight: 400; font-size: clamp(30px, 7vw, 40px); line-height: 1.3; margin: 0; text-wrap: balance }
h2 { font-family: var(--title); font-weight: 400; font-size: 22px; line-height: 1.4; margin: 0 0 6px }
p { margin: 0 }

.card { background: var(--card); border-radius: 24px; padding: 20px 22px; border: 1px solid var(--line) }
.key { background: var(--key); color: var(--key-ink); border: 0 }
.key h2 { font-size: 18px; opacity: .8 }
.key ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: k }
.key li { counter-increment: k; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; font-size: 18px; line-height: 1.55 }
.key li::before { content: counter(k); width: 28px; height: 28px; border-radius: 50%; background: var(--key-ink); color: var(--key); display: grid; place-items: center; font-family: var(--title); font-size: 15px; margin-top: 1px }

.quiz h2 small { font-family: var(--body); font-size: 14px; color: var(--ink-2); margin-left: 6px }
.quiz .q { margin-bottom: 12px }
.opts { display: grid; gap: 8px }
.opts button { text-align: left; padding: 10px 16px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--bg); cursor: pointer; font-size: 16px }
.opts button.right { border-color: var(--good); color: var(--good); font-weight: 700 }
.opts button.wrong { border-color: var(--bad); color: var(--bad); text-decoration: line-through }
.opts button:disabled { cursor: default }
.why { margin-top: 10px; font-size: 15.5px; color: var(--ink-2) }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px }
.steps li { background: var(--acc-soft); color: var(--ink); padding: 8px 14px; border-radius: 16px; font-size: 15.5px }
.steps li + li::before { content: "→"; color: var(--acc); margin: 0 10px 0 -2px; font-weight: 700 }
.steps li + li { background: none; padding: 0 }
.steps li + li span { display: inline-block; background: var(--acc-soft); padding: 8px 14px; border-radius: 16px }

.bars { display: grid; gap: 12px }
.bar { display: grid; gap: 4px }
.bar div { display: flex; justify-content: space-between; gap: 10px; font-size: 15px }
.bar b { font-weight: 700 }
.bar span { color: var(--ink-2) }
.track { height: 14px; border-radius: 999px; background: var(--bg) }
.track i { display: block; height: 100%; border-radius: 999px; background: var(--acc); min-width: 14px }
.fignote { font-size: 13.5px; color: var(--ink-2); margin-top: 10px }

.sec { display: grid; gap: 4px; padding: 0 4px }
.sec p { font-size: 17px }

.mine { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--acc-soft); border: 0 }
.mine svg { width: 44px; height: 44px }
.mine h2 { font-size: 18px; margin: 0 }
.mine p { font-size: 16px }

.terms { display: flex; flex-wrap: wrap; gap: 8px }
.terms details { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px }
.terms summary { cursor: pointer; font-family: var(--title); font-size: 16px; list-style: none }
.terms summary::-webkit-details-marker { display: none }
.terms details[open] { flex-basis: 100% }
.terms details p { font-size: 15.5px; color: var(--ink-2); padding: 2px 0 6px }

.pager { display: flex; justify-content: space-between; gap: 10px }
.pager a { flex: 1; text-align: center; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); text-decoration: none; font-family: var(--title); font-size: 16px }
.pager a.next { background: var(--acc); border-color: var(--acc); color: #fff }

.hero { display: grid; gap: 8px; padding: 6px 4px }
.hero p { color: var(--ink-2) }
.unitbox { display: grid; gap: 10px }
.unitbox h2 { padding: 0 4px }
.list { display: grid; gap: 8px }
.list a { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); text-decoration: none }
.list a b { font-family: var(--title); font-weight: 400; color: var(--acc); font-size: 17px }
.soon { display: flex; flex-wrap: wrap; gap: 8px }
.soon span { padding: 6px 14px; border-radius: 999px; border: 1.5px dashed var(--line); color: var(--ink-2); font-size: 15px }

.search { width: 100%; padding: 12px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font: inherit; color: var(--ink) }
.dict { display: grid; gap: 8px }
.dict div { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px; display: grid; gap: 2px }
.dict b { font-family: var(--title); font-weight: 400; font-size: 18px }
.dict p { font-size: 15.5px; color: var(--ink-2) }
.dict a { font-size: 13.5px; color: var(--acc); text-decoration: none }

.rv { display: grid; gap: 6px }
.rv a { font-family: var(--title); font-size: 19px; text-decoration: none }
.rv ul { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 16px }
</style>
</head>
<body>
<div class="wrap" id="app"><p>불러오는 중…</p></div>

<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const LAPTOP = '<svg viewBox="0 0 44 44" aria-hidden="true"><rect x="7" y="9" width="30" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M3 33h38l-3 4H6z" fill="currentColor"/></svg>';
const HAND = '<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 15l12 7-12 7z" fill="currentColor"/></svg>';

function nav(on) {
  return `<nav><a class="pill${on === "home" ? " on" : ""}" href="./">전체 목록</a><a class="pill${on === "terms" ? " on" : ""}" href="?t">용어 사전</a></nav>`;
}

function quizHTML(qz, label, id) {
  return `<section class="card quiz" data-a="${qz.a}"><h2>${label}<small>${id ? "D" + id : ""}</small></h2><p class="q">${esc(qz.q)}</p>
    <div class="opts">${qz.o.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <p class="why" hidden>${esc(qz.why)}</p></section>`;
}

function figHTML(f) {
  if (!f) return "";
  if (f.type === "steps") return `<section class="card"><ol class="steps">${f.items.map((s, i) => `<li>${i ? `<span>${esc(s)}</span>` : esc(s)}</li>`).join("")}</ol></section>`;
  const max = Math.max(...f.rows.map(r => r[1])) + 1;
  return `<section class="card"><div class="bars">${f.rows.map(([l, v, t]) =>
    `<div class="bar"><div><b>${esc(l)}</b><span>${esc(t)}</span></div><div class="track"><i style="width:${(v + 1) / max * 100}%"></i></div></div>`).join("")}</div>
    <p class="fignote">${esc(f.note)}</p></section>`;
}

function unitOf(data, id) { return data.units.find(u => u.from <= id && id <= u.to); }

function lessonView(data, id) {
  const L = data.lessons, x = L.find(l => l.id === id);
  if (!x) return homeView(data);
  const prev = L.find(l => l.id === id - 1), next = L.find(l => l.id === id + 1), u = unitOf(data, id);
  document.title = `D${id} ${x.title}`;
  return `${nav()}
    <header class="meta"><span class="day">D${id}</span><span class="unit">${u ? esc(u.name) : ""}</span></header>
    <h1>${esc(x.title)}</h1>
    <section class="card key"><h2>오늘의 핵심</h2><ol>${x.key.map(k => `<li>${esc(k)}</li>`).join("")}</ol></section>
    ${prev ? quizHTML(prev.quiz, "어제 퀴즈", prev.id) : ""}
    ${figHTML(x.fig)}
    ${x.body.map(([h, p]) => `<section class="sec"><h2>${esc(h)}</h2><p>${esc(p)}</p></section>`).join("")}
    ${x.mine ? `<section class="card mine">${LAPTOP}<div><h2>내 노트북으로 보면</h2><p>${esc(x.mine)}</p></div></section>` : ""}
    ${x.try ? `<section class="card mine">${HAND}<div><h2>직접 해 보기</h2><p>${esc(x.try)}</p></div></section>` : ""}
    <section class="sec"><h2>오늘 나온 말</h2><div class="terms">${x.terms.map(([t, d]) => `<details><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join("")}</div></section>
    <div class="pager">${prev ? `<a href="?d=${prev.id}">← D${prev.id}</a>` : ""}${next ? `<a class="next" href="?d=${next.id}">D${next.id} →</a>` : ""}</div>`;
}

function reviewView(data, a, b) {
  const ls = data.lessons.filter(l => l.id >= a && l.id <= b);
  document.title = "한 주 정리";
  return `${nav()}
    <header class="meta"><span class="day">한 주 정리</span><span class="unit">D${a} ~ D${b}</span></header>
    <h1>이번 주에 배운 ${ls.length}가지</h1>
    ${ls.map(l => `<section class="card rv"><a href="?d=${l.id}">D${l.id} · ${esc(l.title)}</a><ul>${l.key.map(k => `<li>${esc(k)}</li>`).join("")}</ul></section>`).join("")}
    <h2 style="padding:0 4px">퀴즈로 확인하기</h2>
    ${ls.map(l => quizHTML(l.quiz, esc(l.title), l.id)).join("")}`;
}

function termsView(data) {
  const all = data.lessons.flatMap(l => l.terms.map(([t, d]) => ({ t, d, id: l.id }))).sort((x, y) => x.t.localeCompare(y.t, "ko"));
  document.title = "용어 사전";
  return `${nav("terms")}<h1>용어 사전</h1>
    <input class="search" id="q" type="search" placeholder="찾을 말 입력" aria-label="용어 찾기">
    <div class="dict" id="dict">${all.map(x => `<div data-k="${esc((x.t + x.d).toLowerCase())}"><b>${esc(x.t)}</b><p>${esc(x.d)}</p><a href="?d=${x.id}">D${x.id}에서 배움</a></div>`).join("")}</div>`;
}

function homeView(data) {
  document.title = "매일 AI 공부";
  return `${nav("home")}
    <div class="hero"><h1>매일 AI 공부</h1><p>아침 8시, 카톡으로 하루 한 주제. 컴퓨터 기초부터 AI학과 전공 기초까지 차례대로.</p></div>
    ${data.units.map(u => {
      const ls = u.from ? data.lessons.filter(l => l.id >= u.from && l.id <= u.to) : [];
      return `<section class="unitbox"><h2>${esc(u.name)}</h2>${ls.length ? `<div class="list">${ls.map(l => `<a href="?d=${l.id}"><b>D${l.id}</b><span>${esc(l.title)}</span></a>`).join("")}</div>` : ""}
        ${u.plan ? `<div class="soon">${u.plan.map(p => `<span>${esc(p)}</span>`).join("")}</div>` : ""}</section>`;
    }).join("")}`;
}

fetch("lessons.json").then(r => r.json()).then(data => {
  const q = new URLSearchParams(location.search), h = location.hash.slice(1);
  const d = +(q.get("d") || (h.match(/^d(\d+)$/) || [])[1] || 0), r = q.get("r");
  if (d) app.innerHTML = lessonView(data, d);
  else if (r && /^\d+-\d+$/.test(r)) app.innerHTML = reviewView(data, ...r.split("-").map(Number));
  else if (q.has("t")) app.innerHTML = termsView(data);
  else app.innerHTML = homeView(data);

  app.addEventListener("click", e => {
    const b = e.target.closest(".opts button");
    if (!b) return;
    const card = b.closest(".quiz"), a = +card.dataset.a;
    card.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === a) x.classList.add("right"); });
    if (+b.dataset.i !== a) b.classList.add("wrong");
    card.querySelector(".why").hidden = false;
  });
  const s = document.getElementById("q");
  if (s) s.addEventListener("input", () => {
    const v = s.value.trim().toLowerCase();
    document.querySelectorAll("#dict > div").forEach(x => { x.hidden = v && !x.dataset.k.includes(v); });
  });
}).catch(() => { app.innerHTML = "<p>레슨을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>"; });
</script>
</body>
</html>
