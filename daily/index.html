<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매일 AI 공부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app"><p>불러오는 중…</p></div>

<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const LAPTOP = '<svg viewBox="0 0 44 44" aria-hidden="true"><rect x="7" y="9" width="30" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M3 33h38l-3 4H6z" fill="currentColor"/></svg>';
const HAND = '<svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 15l12 7-12 7z" fill="currentColor"/></svg>';

function nav(on) {
  return `<nav><a class="pill${on === "home" ? " on" : ""}" href="./">전체 목록</a><a class="pill${on === "terms" ? " on" : ""}" href="?t">용어 사전</a><a class="pill" href="portfolio.html">포트폴리오</a></nav>`;
}

function quizHTML(qz, label, id) {
  return `<section class="card quiz" data-a="${qz.a}"><h2>${label}<small>${id ? "D" + id : ""}</small></h2><p class="q">${esc(qz.q)}</p>
    <div class="opts">${qz.o.map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <p class="why" hidden>${esc(qz.why)}</p></section>`;
}

function figHTML(f) {
  if (!f) return "";
  if (f.type === "steps") return `<section class="card"><ol class="steps">${f.items.map((s, i) => `<li>${i ? `<span>${esc(s)}</span>` : esc(s)}</li>`).join("")}</ol></section>`;
  const max = Math.max(...f.rows.map(r => r[1])) + 1;
  return `<section class="card"><div class="bars">${f.rows.map(([l, v, t]) =>
    `<div class="bar"><div><b>${esc(l)}</b><span>${esc(t)}</span></div><div class="track"><i style="width:${(v + 1) / max * 100}%"></i></div></div>`).join("")}</div>
    <p class="fignote">${esc(f.note)}</p></section>`;
}

function unitOf(data, id) { return data.units.find(u => u.from <= id && id <= u.to); }

function lessonView(data, id) {
  const L = data.lessons, x = L.find(l => l.id === id);
  if (!x) return homeView(data);
  const prev = L.find(l => l.id === id - 1), next = L.find(l => l.id === id + 1), u = unitOf(data, id);
  document.title = `D${id} ${x.title}`;
  return `${nav()}
    <header class="meta"><span class="day">D${id}</span><span class="unit">${u ? esc(u.name) : ""}</span></header>
    <h1>${esc(x.title)}</h1>
    <section class="card key"><h2>오늘의 핵심</h2><ol>${x.key.map(k => `<li>${esc(k)}</li>`).join("")}</ol></section>
    ${prev ? quizHTML(prev.quiz, "어제 퀴즈", prev.id) : ""}
    ${figHTML(x.fig)}
    ${x.body.map(([h, p]) => `<section class="sec"><h2>${esc(h)}</h2><p>${esc(p)}</p></section>`).join("")}
    ${x.mine ? `<section class="card mine">${LAPTOP}<div><h2>내 노트북으로 보면</h2><p>${esc(x.mine)}</p></div></section>` : ""}
    ${x.try ? `<section class="card mine">${HAND}<div><h2>직접 해 보기</h2><p>${esc(x.try)}</p></div></section>` : ""}
    <section class="sec"><h2>오늘 나온 말</h2><div class="terms">${x.terms.map(([t, d]) => `<details><summary>${esc(t)}</summary><p>${esc(d)}</p></details>`).join("")}</div></section>
    <div class="pager">${prev ? `<a href="?d=${prev.id}">← D${prev.id}</a>` : ""}${next ? `<a class="next" href="?d=${next.id}">D${next.id} →</a>` : ""}</div>`;
}

function reviewView(data, a, b) {
  const ls = data.lessons.filter(l => l.id >= a && l.id <= b);
  document.title = "한 주 정리";
  return `${nav()}
    <header class="meta"><span class="day">한 주 정리</span><span class="unit">D${a} ~ D${b}</span></header>
    <h1>이번 주에 배운 ${ls.length}가지</h1>
    ${ls.map(l => `<section class="card rv"><a href="?d=${l.id}">D${l.id} · ${esc(l.title)}</a><ul>${l.key.map(k => `<li>${esc(k)}</li>`).join("")}</ul></section>`).join("")}
    <h2 style="padding:0 4px">퀴즈로 확인하기</h2>
    ${ls.map(l => quizHTML(l.quiz, esc(l.title), l.id)).join("")}`;
}

function termsView(data) {
  const all = data.lessons.flatMap(l => l.terms.map(([t, d]) => ({ t, d, id: l.id }))).sort((x, y) => x.t.localeCompare(y.t, "ko"));
  document.title = "용어 사전";
  return `${nav("terms")}<h1>용어 사전</h1>
    <input class="search" id="q" type="search" placeholder="찾을 말 입력" aria-label="용어 찾기">
    <div class="dict" id="dict">${all.map(x => `<div data-k="${esc((x.t + x.d).toLowerCase())}"><b>${esc(x.t)}</b><p>${esc(x.d)}</p><a href="?d=${x.id}">D${x.id}에서 배움</a></div>`).join("")}</div>`;
}

function homeView(data) {
  document.title = "매일 AI 공부";
  return `${nav("home")}
    <div class="hero"><h1>매일 AI 공부</h1><p>아침 8시, 카톡으로 하루 한 주제. 컴퓨터 기초부터 AI학과 전공 기초까지 차례대로.</p></div>
    ${data.units.map(u => {
      const ls = u.from ? data.lessons.filter(l => l.id >= u.from && l.id <= u.to) : [];
      return `<section class="unitbox"><h2>${esc(u.name)}</h2>${ls.length ? `<div class="list">${ls.map(l => `<a href="?d=${l.id}"><b>D${l.id}</b><span>${esc(l.title)}</span></a>`).join("")}</div>` : ""}
        ${u.plan ? `<div class="soon">${u.plan.map(p => `<span>${esc(p)}</span>`).join("")}</div>` : ""}</section>`;
    }).join("")}`;
}

fetch("lessons.json").then(r => r.json()).then(data => {
  const q = new URLSearchParams(location.search), h = location.hash.slice(1);
  const d = +(q.get("d") || (h.match(/^d(\d+)$/) || [])[1] || 0), r = q.get("r");
  if (d) app.innerHTML = lessonView(data, d);
  else if (r && /^\d+-\d+$/.test(r)) app.innerHTML = reviewView(data, ...r.split("-").map(Number));
  else if (q.has("t")) app.innerHTML = termsView(data);
  else app.innerHTML = homeView(data);

  app.addEventListener("click", e => {
    const b = e.target.closest(".opts button");
    if (!b) return;
    const card = b.closest(".quiz"), a = +card.dataset.a;
    card.querySelectorAll(".opts button").forEach(x => { x.disabled = true; if (+x.dataset.i === a) x.classList.add("right"); });
    if (+b.dataset.i !== a) b.classList.add("wrong");
    card.querySelector(".why").hidden = false;
  });
  const s = document.getElementById("q");
  if (s) s.addEventListener("input", () => {
    const v = s.value.trim().toLowerCase();
    document.querySelectorAll("#dict > div").forEach(x => { x.hidden = v && !x.dataset.k.includes(v); });
  });
}).catch(() => { app.innerHTML = "<p>레슨을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>"; });
</script>
</body>
</html>
