<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리길</title>
<meta name="description" content="둘이 같이 쓰는 데이트 코스">
<meta name="theme-color" content="#EDE6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리길">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&display=swap">
<link rel="stylesheet" href="style.css">
<script>try { const v = JSON.parse(localStorage.getItem("urigil")), k = localStorage.getItem("urigil-skin") || (v && v.me ? (v.me === "a" ? "sky" : "pink") : ""); if (k) document.documentElement.dataset.skin = k; } catch {}</script>
<script type="module" src="app.js"></script>
</head>
<body>

<div id="boot" class="boot"><img src="icon-192.png" alt="" width="84" height="84"><b>우리길</b><button class="link" id="bootReset" type="button" hidden>처음 화면으로</button></div>

<section id="setup" class="setup" hidden>
  <div class="setup-top">
    <img class="logo" src="icon-192.png" alt="" width="88" height="88">
    <h1>우리길</h1>
    <p>날짜랑 시간만 주면 데이트 코스를 짜 줘요</p>
  </div>

  <div class="setup-body" id="setupChoose">
    <button class="big" id="goNew" type="button">새로 시작하기</button>
    <button class="big ghost" id="goJoin" type="button">커플 코드로 들어가기</button>
    <p class="hint center">우리달 코드도 그대로 쓸 수 있어요</p>
  </div>

  <form class="setup-body" id="newForm" hidden>
    <label class="who-in a">남자친구 : <input id="nA" required maxlength="12" autocomplete="off" placeholder="이름"></label>
    <label class="who-in b">여자친구 : <input id="nB" required maxlength="12" autocomplete="off" placeholder="이름"></label>
    <label>사귄 날 <input id="nStart" type="date" required></label>
    <div class="me-pick"><span>나는</span><div class="seg two-way" id="nMe" data-v="a"><button type="button" class="a on" data-w="a">남자친구</button><button type="button" class="b" data-w="b">여자친구</button></div></div>
    <button class="big" type="submit">만들기</button>
    <button class="link back" type="button">뒤로</button>
  </form>

  <div class="setup-body" id="shareBox" hidden>
    <p class="lead">이 코드를 상대에게 보내 주세요</p>
    <output class="code" id="shareCode"></output>
    <button class="big" id="copyLink" type="button">링크 보내기</button>
    <button class="big ghost" id="startApp" type="button">시작하기</button>
  </div>

  <form class="setup-body" id="joinForm" hidden>
    <label>받은 코드 <input id="jCode" required autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX"></label>
    <button class="big" type="submit">들어가기</button>
    <p class="err" id="jErr" hidden></p>
    <button class="link back" type="button">뒤로</button>
  </form>

  <div class="setup-body" id="pickBox" hidden>
    <p class="lead">나는 누구예요?</p>
    <div class="pick" id="pickWho"></div>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="top">
    <button class="codebtn" id="codeBtn" type="button">코드</button>
    <button class="skinbtn" id="skinBtn" type="button" aria-label="화면 고르기"><i></i><i></i><i></i></button>
    <button class="hpic" id="hPic" type="button" aria-label="사진"></button>
    <b class="dnum" id="hD"></b>
    <span class="next" id="hNext"></span>
  </header>

  <main>
    <section id="tab-cal" class="tab">
      <div class="mhead">
        <button class="icon" id="prevM" type="button" aria-label="이전 달">‹</button>
        <h2 id="mTitle"></h2>
        <button class="icon" id="nextM" type="button" aria-label="다음 달">›</button>
        <button class="pill" id="todayBtn" type="button">오늘</button>
      </div>
      <div class="week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span></div>
      <div class="grid" id="grid"></div>
      <div class="agenda" id="agenda"></div>
    </section>

    <section id="tab-course" class="tab" hidden>
      <div id="cHead"></div>
      <div class="mapwrap" id="mapWrap" hidden><div id="map"></div></div>
      <div id="cBody"></div>
    </section>

    <section id="tab-us" class="tab" hidden>
      <div class="stats" id="stats"></div>
      <div class="areas" id="areaDots"></div>
      <h2 class="ttl">우리 코스</h2>
      <div class="clist" id="courseList"></div>

      <section class="album" id="album">
        <h2 class="ttl">키티 사진</h2>
        <div class="pics" id="picList"></div>
        <label class="pill wide addpic">+ 사진 넣기<input type="file" id="picIn" accept="image/*" multiple hidden></label>
      </section>

      <h2 class="ttl">설정</h2>
      <div class="settings">
        <label>남자친구 이름 <input id="sA" maxlength="12"></label>
        <label>여자친구 이름 <input id="sB" maxlength="12"></label>
        <button class="pill" id="saveSet" type="button">저장</button>
        <button class="pill" id="skinBtn2" type="button">화면 고르기</button>
        <div class="coderow"><span>커플 코드</span><output class="code small" id="sCode"></output><button class="pill" id="sCopy" type="button">링크 보내기</button></div>
        <button class="pill" id="installBtn" type="button" hidden>홈 화면에 앱 설치</button>
        <p class="hint" id="iosHint" hidden>Safari 공유 버튼 → 홈 화면에 추가</p>
        <button class="link danger" id="leave" type="button">초기화 (처음 화면으로)</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="메뉴">
    <button type="button" data-tab="cal" class="on"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
    <button type="button" data-tab="course"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8.4 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.6"/></svg>코스</button>
    <button type="button" data-tab="us"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>우리</button>
  </nav>
</div>

<dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
