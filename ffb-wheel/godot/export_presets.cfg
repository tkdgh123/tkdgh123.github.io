[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="build/운전연습.exe"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
codesign/enable=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, build/*"
export_path="../play/index.html"

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/head_include="<style>#wait{position:fixed;left:0;right:0;bottom:calc(12% + 48px);text-align:center;padding:0 16px;font:600 16px/1.6 system-ui,sans-serif;color:#1a1a1a;pointer-events:none;z-index:5}#wait b{display:block;font-size:22px}</style><script>addEventListener(\"DOMContentLoaded\",()=>{const d=document.createElement(\"div\");d.id=\"wait\";d.innerHTML=\"<b>운전 연습을 준비하고 있어요</b>처음 켤 때는 그래픽을 준비하느라 30초에서 1분쯤 멈춰 있어요\";document.body.append(d)});window.godotReady=()=>document.getElementById(\"wait\")?.remove()</script><script src=\"../../hub/back.js\" data-cat=\"make\" defer></script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
