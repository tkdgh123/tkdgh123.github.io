<script type="module">
import * as THREE from "three";
import { CAR, newCar, stepCar, shift, setSig, wheelsOf, front, carBox, obbHit } from "./car.js";
import { buildCourse } from "./course.js";
import { buildCity } from "./city.js";
const $ = id => document.getElementById(id);
const cl = (x, a, b) => Math.min(b, Math.max(a, x));
const Q = new URLSearchParams(location.search);
if (window.top !== window) $("up").style.visibility = "hidden"; // 레이싱 휠 페이지 칸 안에서는 위로 가는 줄이 필요 없음
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch { return null; } };
let scoring = store("drive-score") !== "0", sound = store("drive-sound") !== "0" && !Q.has("mute"), simple = store("drive-simple") === "1";

/* ───────── 화면 ───────── */
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(60, 1, .05, 600);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let scene, map, sun;
function newScene() {
  if (scene) scene.traverse(o => { o.geometry?.dispose(); [].concat(o.material || []).forEach(m => { m.map?.dispose(); m.dispose(); }); });
  scene = new THREE.Scene(); scene.background = new THREE.Color(0xf2f1ec); scene.fog = new THREE.Fog(0xf2f1ec, 90, 260);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d4c6, 1.7));
  sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 120 }); sun.shadow.bias = -.0006; scene.add(sun, sun.target);
}

/* ───────── 차 (그랑프리 파란 차를 실제 크기로) ───────── */
const std = c => new THREE.MeshStandardMaterial({ color: c, roughness: .55 });
const lamp = (c, k = .25) => ({ on: new THREE.MeshBasicMaterial({ color: c }), off: new THREE.MeshStandardMaterial({ color: new THREE.Color(c).multiplyScalar(k), roughness: .4 }) });
const LMP = { head: lamp(0xfff6d8, .6), brake: lamp(0xff2a1a), turn: lamp(0xffa21a), rev: lamp(0xffffff, .5) };
let carG, wheelsM, steerHubs, wheelM, lamps, cab, outside;
function buildCar() {
  carG = new THREE.Group(); const body = new THREE.Group(); body.position.z = 1.35; carG.add(body);
  const add = (geo, m, x, y, z, p = body) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; p.add(o); return o; };
  add(new THREE.BoxGeometry(1.8, .55, 4.6), std(0x2b44a6), 0, .62, 0);
  cab = add(new THREE.BoxGeometry(1.58, .52, 2.2), std(0xf2f1ec), 0, 1.15, -.25);
  const roof = add(new THREE.BoxGeometry(.3, .02, 2.2), std(0x151514), 0, 1.42, -.25);
  add(new THREE.BoxGeometry(1.8, .12, .2), std(0xf2f1ec), 0, .66, 2.32);
  const topper = add(new THREE.BoxGeometry(.9, .2, .34), std(0xe8b42a), 0, 1.52, -.3); // 지붕 위 시험차 표시등
  outside = [cab, roof, topper];
  lamps = { head: [], brake: [], turnL: [], turnR: [], rev: [] };
  const L = (k, list, x, y, z, w = .32, h = .12) => { const m = add(new THREE.BoxGeometry(w, h, .04), LMP[k].off, x, y, z); m.userData.k = k; list.push(m); };
  for (const s of [-1, 1]) { L("head", lamps.head, s * .58, .72, 2.31); L("brake", lamps.brake, s * .62, .78, -2.31); L("rev", lamps.rev, s * .32, .78, -2.31, .14, .08);
    L("turn", s > 0 ? lamps.turnL : lamps.turnR, s * .82, .72, 2.31, .14, .1); L("turn", s > 0 ? lamps.turnL : lamps.turnR, s * .86, .78, -2.31, .1, .12); }
  // 운전석 안 (운전석 시점에서만 보이는 계기판·핸들)
  add(new THREE.BoxGeometry(1.6, .14, .5), std(0x1d1e22), 0, .88, .9);
  wheelM = new THREE.Group(); wheelM.position.set(.37, .9, .5); wheelM.rotation.x = -.35; body.add(wheelM);
  wheelM.add(new THREE.Mesh(new THREE.TorusGeometry(.18, .022, 10, 36), std(0x151514)));
  for (const a of [0, 2.1, -2.1]) { const sp = new THREE.Mesh(new THREE.BoxGeometry(.03, .19, .02), std(0x2a2b30)); sp.position.set(Math.sin(a) * .095, -Math.cos(a) * .095, 0); sp.rotation.z = a; wheelM.add(sp); }
  wheelM.add(new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .04, 16).rotateX(Math.PI / 2), std(0x2b44a6)));
  const wg = new THREE.CylinderGeometry(.31, .31, .22, 18); wg.rotateZ(Math.PI / 2);
  wheelsM = []; steerHubs = [];
  for (const [x, z] of [[CAR.TR / 2, 0], [-CAR.TR / 2, 0], [CAR.TR / 2, CAR.WB], [-CAR.TR / 2, CAR.WB]]) {
    const hub = new THREE.Group(); hub.position.set(x, .31, z); carG.add(hub);
    const w = add(wg, std(0x151514), 0, 0, 0, hub); add(new THREE.BoxGeometry(.24, .1, .1), std(0x8f8b80), 0, 0, 0, w); wheelsM.push(w); if (z > 0) steerHubs.push(hub); }
  scene.add(carG);
}
function drawCar(c, t) {
  carG.position.set(c.x, c.y + c.lift, c.z); carG.rotation.set(-c.pitch, c.yaw, c.roll, "YXZ");
  wheelsM.forEach(w => w.rotation.x = c.spin); steerHubs.forEach(h => h.rotation.y = c.steer);
  wheelM.rotation.z = -c.inSteer * 7.85; // 핸들 한쪽 끝까지 1.25바퀴
  const blink = Math.floor(t * 2.6) % 2 === 0;
  const set = (list, on) => list.forEach(m => m.material = on ? LMP[m.userData.k].on : LMP[m.userData.k].off);
  set(lamps.head, c.lights > 0); set(lamps.brake, c.brk > .05 && c.engine); set(lamps.rev, c.gear === "R" && c.engine);
  set(lamps.turnL, blink && (c.sig === 1 || c.hazard)); set(lamps.turnR, blink && (c.sig === 2 || c.hazard));
  return blink;
}

/* ───────── 소리 · 음성 ───────── */
let ac = null;
function tone(f, d, v = .06, type = "sine", at = 0) {
  if (!sound) return; try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at; o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + d); o.connect(g).connect(ac.destination); o.start(t0); o.stop(t0 + d + .02); } catch {}
}
const beep = k => k === "ok" ? (tone(880, .18), tone(1320, .25, .05, "sine", .16)) : k === "alarm" ? [0, .35, .7, 1.05].forEach(a => tone(1040, .25, .08, "square", a)) : tone(240, .2, .06, "sawtooth");
let sayT = 0, voice = null;
function say(txt) {
  $("say").textContent = txt; $("say").classList.add("on"); sayT = 3.2;
  if (sound && "speechSynthesis" in window) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = "ko-KR"; voice = voice || speechSynthesis.getVoices().find(v => v.lang.startsWith("ko")); if (voice) u.voice = voice; u.rate = 1.05; speechSynthesis.speak(u); } catch {} }
}
function toast(txt, info) { const p = document.createElement("p"); p.textContent = txt; if (info) p.className = "info"; $("toasts").prepend(p); setTimeout(() => p.remove(), 2800); while ($("toasts").children.length > 5) $("toasts").lastChild.remove(); }

/* ───────── 입력: 키보드 → { steer, thr, brk }. 레이싱 휠을 붙이면 이 한 곳만 바꾸면 됨 ───────── */
const K = {}, inp = { steer: 0, thr: 0, brk: 0 }, hold = { u: 0, d: 0 };
function readKeys(dt, kmh) {
  // 간단 조작: WASD도 받고 기어는 저절로. W를 누르면 앞으로, 멈춘 뒤 S를 다시 누르면 R (control), 뒤로 갈 땐 S가 가속, W가 브레이크
  let up = K.ArrowUp || simple && K.KeyW, dn = K.ArrowDown || simple && K.KeyS;
  if (simple && car.gear === "R") { if (up && Math.abs(car.v) < .05) car.gear = "D"; else [up, dn] = [dn, up]; }
