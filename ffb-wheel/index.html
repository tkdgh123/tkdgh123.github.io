<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포스 피드백 레이싱 휠</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root { --ink:#111; --soft:#777; --rule:#d6d6d6; --bg:#fff; --stage:#f4f4f4; --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--font); display:flex; flex-direction:column; }
header { display:flex; align-items:flex-end; gap:32px; padding:18px max(24px,env(safe-area-inset-right)) 0 max(24px,env(safe-area-inset-left)); border-bottom:1px solid var(--ink); flex-wrap:wrap; }
header h1 { margin:0 0 14px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
nav { display:flex; gap:24px; }
nav button { font:inherit; font-size:15px; background:none; border:0; padding:0 0 13px; color:var(--soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
nav button[aria-selected="true"] { color:var(--ink); font-weight:700; border-bottom-color:var(--ink); }
nav button:focus-visible, .bar button:focus-visible, .bar a:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
main { flex:1; min-height:0; position:relative; }
section { position:absolute; inset:0; display:flex; flex-direction:column; }
section[hidden] { display:none; }
#slides .stage { flex:1; min-height:0; container-type:size; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--stage); }
#slides img { width:min(100cqw, 100cqh * 16 / 9); height:auto; display:block; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.06); }
#slides .stage:fullscreen { padding:0; background:#fff; }
#slides .stage:fullscreen img { box-shadow:none; }
.bar { display:flex; align-items:center; gap:16px; padding:12px max(24px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left)); border-top:1px solid var(--rule); font-size:14px; flex-wrap:wrap; }
.bar button, .bar a { font:inherit; font-size:14px; background:none; border:1px solid var(--rule); color:var(--ink); padding:7px 14px; cursor:pointer; text-decoration:none; }
.bar button:disabled { color:#bbb; cursor:default; }
.bar .count { font-variant-numeric:tabular-nums; color:var(--soft); min-width:48px; text-align:center; }
.bar .spacer { flex:1; }
.notes { border-top:1px solid var(--rule); padding:14px max(24px,env(safe-area-inset-right)) 18px max(24px,env(safe-area-inset-left)); font-size:15px; line-height:1.7; color:#333; max-height:30vh; overflow:auto; }
.notes p { margin:0; max-width:70ch; }
#sim iframe { flex:1; width:100%; border:0; display:block; }
@media (max-width:600px) { header { gap:12px; } header h1 { font-size:17px; margin-bottom:10px; } #slides .stage { padding:12px; } .bar { gap:8px; } .hint { display:none; } }
</style>
</head>
<body>
<header>
  <h1>포스 피드백 레이싱 휠</h1>
  <nav role="tablist" aria-label="보기 선택">
    <button role="tab" id="tab-slides" aria-controls="slides" aria-selected="true">발표 자료</button>
    <button role="tab" id="tab-sim" aria-controls="sim" aria-selected="false">3D 시뮬레이션</button>
  </nav>
</header>
<main>
  <section id="slides" role="tabpanel" aria-labelledby="tab-slides">
    <div class="stage" id="stage"><img id="slide" src="slides/s-1.png" alt="발표 자료 1번 슬라이드" width="1920" height="1080"></div>
    <div class="notes" id="notes" hidden><p id="notesText"></p></div>
    <div class="bar">
      <button id="prev" type="button">이전</button>
      <span class="count" id="count">1 / 3</span>
      <button id="next" type="button">다음</button>
      <span class="spacer"></span>
      <span class="hint" style="color:var(--soft)">← → 키로 넘기기</span>
      <button id="toggleNotes" type="button" aria-expanded="false" aria-controls="notes">대본 보기</button>
      <button id="full" type="button">전체 화면</button>
    </div>
  </section>
  <section id="sim" role="tabpanel" aria-labelledby="tab-sim" hidden>
    <iframe id="simFrame" title="포스 피드백 레이싱 휠 3D 시뮬레이션" allow="fullscreen" allowfullscreen></iframe>
  </section>
</main>
<script>
const NOTES = ["안녕하세요. 저희 팀은 포스 피드백 레이싱 휠을 만듭니다. 게임 속 노면과 코너링의 힘을 모터로 핸들에 전달하는 아두이노 운전 장치입니다. 왼쪽은 저희가 설계한 3D 모델입니다. 작동 방식은 이렇습니다. 먼저 휠 베이스와 페달의 센서가 핸들 각도와 페달을 밟은 양을 읽습니다. 전자부의 아두이노가 이 값을 USB로 게임에 보내면, 게임은 노면과 코너링 상황에 맞는 힘을 다시 보내 줍니다. 그러면 휠 베이스의 모터가 그 힘을 만들고, 벨트가 핸들에 전달해 손으로 느낄 수 있게 됩니다. 팀은 소프트웨어 황찬웅, 하드웨어 최민호, 기구와 시연 김도영, 기획 김창식 네 명입니다. 이제 저희가 이 휠을 만드는 이유를 말씀드리겠습니다.", "저희는 이 휠을 누구나 쓸 수 있는 운전 연습 장비로 만들고자 합니다. 도로에 나가기 전에 안전한 곳에서 핸들 감각을 익힐 수 있고, 구하기 쉬운 부품으로 만들어 학교나 복지관에서도 부담 없이 갖출 수 있습니다. 또 설계를 공개해서 누구나 따라 만들 수 있게 하려 합니다.", "이 휠을 쓰는 사람은 네 부류입니다. 도로에 나가기 전 연습이 필요한 초보 운전자, 운전 감각을 유지하고 다시 교육받는 고령 운전자, 학교와 동아리에서 공학을 배우는 학생, 그리고 집에서 레이싱 게임을 즐기는 사람들입니다. 이들이 이 휠을 쓰는 이유는 세 가지입니다. 노면과 코너링의 힘이 핸들로 전해져 실제 같은 손맛을 주고, 핸들 각도를 세밀하게 읽어 정밀하게 조향할 수 있으며, 회전 범위와 힘 세기를 사용자에게 맞게 조절할 수 있습니다. 이상으로 발표를 마치겠습니다. 감사합니다."];
const N = NOTES.length;
const $ = id => document.getElementById(id);
const imgs = Array.from({ length: N }, (_, k) => { const im = new Image(); im.src = `slides/s-${k + 1}.png`; return im; });
let cur = 0;
function show(n) {
  cur = Math.max(0, Math.min(N - 1, n));
  $("slide").src = imgs[cur].src;
  $("slide").alt = `발표 자료 ${cur + 1}번 슬라이드`;
  $("count").textContent = `${cur + 1} / ${N}`;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === N - 1;
  $("notesText").textContent = NOTES[cur];
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("stage").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); show(cur + (e.clientX - r.left < r.width / 3 ? -1 : 1)); };
$("toggleNotes").onclick = () => { const h = !$("notes").hidden; $("notes").hidden = h; $("toggleNotes").setAttribute("aria-expanded", String(!h)); $("toggleNotes").textContent = h ? "대본 보기" : "대본 숨기기"; };
$("full").onclick = () => { const st = $("stage"); (document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen?.())?.catch?.(() => {}); };

function openTab(name) {
  const sim = name === "sim";
  $("slides").hidden = sim; $("sim").hidden = !sim;
  $("tab-slides").setAttribute("aria-selected", String(!sim));
  $("tab-sim").setAttribute("aria-selected", String(sim));
  const f = $("simFrame");
  if (sim) { if (!f.src) { f.src = "sim/"; f.addEventListener("load", () => f.contentWindow.focus(), { once: true }); } else f.contentWindow.focus(); }
  history.replaceState(null, "", "#" + (sim ? "sim" : "slides"));
}
$("tab-slides").onclick = () => openTab("slides");
$("tab-sim").onclick = () => openTab("sim");
document.addEventListener("keydown", e => {
  if ($("slides").hidden || e.target.closest("button")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "f" || e.key === "F") $("full").click();
});
show(0);
openTab(location.hash === "#sim" ? "sim" : "slides");
</script>
</body>
</html>
