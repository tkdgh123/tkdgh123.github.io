<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포스 피드백 레이싱 휠</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 계기판: 종이 위 머리에 눈금자, 먹색 무대, 숫자는 고정폭 */
:root {
  --paper: #f2f1ec; --tone: #e4e2da; --ink: #151514; --muted: #5a5954; --rule: #c9c6bc;
  --dark: #151618; --on-dark: #eeece6; --on-dark-soft: #9e9d97; --blue: #2b44a6;
  --m: clamp(16px, 2.6vw, 40px);
  --sans: "Wanted Sans Variable", "Wanted Sans", "Pretendard Variable", system-ui, "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Wanted Sans Variable", monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--sans); word-break: keep-all; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px }

/* 머리: 돌아가기, 제목, 보기 두 칸. 아래 변은 눈금자 */
header { position: relative; display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px clamp(20px, 3vw, 48px); padding: 18px max(var(--m), env(safe-area-inset-right)) 22px max(var(--m), env(safe-area-inset-left)) }
header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; border-bottom: 1px solid var(--ink);
  background: linear-gradient(90deg, var(--ink) 1px, transparent 1px) 0 100% / 80px 9px repeat-x, linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 100% / 8px 4px repeat-x }
.back { font: 400 12.5px/1 var(--mono); letter-spacing: .02em; text-decoration: none; color: var(--muted); padding: 6px 0; transition: color .2s }
.back:hover { color: var(--ink) }
header h1 { margin: 0; font-size: clamp(22px, 1.2rem + .8vw, 34px); font-weight: 300; letter-spacing: -.03em; line-height: 1.1 }
header h1 b { font-weight: 750 }
nav { display: flex; gap: 24px; margin-left: auto }
nav button { display: inline-flex; align-items: baseline; gap: 8px; border: 0; background: none; padding: 8px 0; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; transition: color .2s }
nav button i { font: normal 11.5px var(--mono); }
nav button[aria-selected="true"] { color: var(--ink) }
nav button[aria-selected="true"] span { text-decoration: underline 2px; text-underline-offset: 7px }
nav button:hover { color: var(--ink) }

/* 무대 */
main { flex: 1; min-height: 0; position: relative }
section { position: absolute; inset: 0; display: flex; flex-direction: column }
section[hidden] { display: none }
#slides { background: var(--dark); color: var(--on-dark) }
#slides .stage { flex: 1; min-height: 0; container-type: size; display: flex; align-items: center; justify-content: center; padding: clamp(16px, 2.4vw, 36px) var(--m) 20px; cursor: pointer }
#slides img { width: min(100cqw, 100cqh * 16 / 9); height: auto; display: block; background: #fff }
#slides .stage:fullscreen { padding: 0; background: var(--dark) }

.notes { padding: 4px max(var(--m), env(safe-area-inset-right)) 10px max(var(--m), env(safe-area-inset-left)); max-height: 30vh; overflow: auto }
.notes p { margin: 0 auto; max-width: 60em; font-size: 17px; line-height: 1.75; color: var(--on-dark) }

/* 조작 막대: 위 변은 슬라이드 수만큼 나뉜 눈금, 지나온 만큼 파랗게 */
.bar { position: relative; display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 22px max(var(--m), env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(var(--m), env(safe-area-inset-left)) }
.ruler { position: absolute; top: 0; left: var(--m); right: var(--m); height: 7px; border-top: 1px solid #3a3b3f; border-right: 1px solid var(--on-dark-soft);
  background: linear-gradient(90deg, var(--on-dark-soft) 1px, transparent 1px) 0 0 / calc(100% / var(--n)) 100% repeat-x }
.ruler::before { content: ""; position: absolute; left: 0; top: -1px; height: 2px; width: calc(var(--p, 0) * 100%); background: var(--blue); transition: width .4s cubic-bezier(.2, .7, .2, 1) }
.bar button { min-height: 44px; padding: 0 18px; border: 0; background: none; font-weight: 600; cursor: pointer; transition: background-color .2s, color .2s, transform .15s }
.bar button:hover { background: rgba(238, 236, 230, .08) }
.bar button:active { transform: scale(.97) }
.bar #next { background: var(--blue); color: #fff }
.bar #next:hover { background: #22398f }
.bar button:disabled, .bar #next:disabled { background: none; color: var(--on-dark-soft); opacity: .45; cursor: default; transform: none }
.bar .count { font: 400 15px/1 var(--mono); color: var(--on-dark-soft); min-width: 92px; text-align: center; white-space: nowrap }
.bar .count b { font-weight: 400; font-size: 34px; letter-spacing: -.02em; color: var(--on-dark); vertical-align: -5px; margin-right: 2px }
.bar .spacer { flex: 1 }
.bar .hint { font: 400 12px var(--mono); color: var(--on-dark-soft); margin-right: 6px; word-spacing: -.3em }
.bar #toggleNotes[aria-expanded="true"] { background: var(--on-dark); color: var(--dark) }

#sim iframe { flex: 1; width: 100%; border: 0; display: block }

#slide.turn { animation: turn .35s ease both }
@keyframes turn { from { opacity: .3 } }

@media (max-width: 640px) {
  header { padding-top: 12px; padding-bottom: 18px; row-gap: 4px }
  header h1 { width: 100% }
  nav { margin-left: 0; width: 100% }
  .bar { gap: 4px }
  .bar button { padding: 0 8px; font-size: 15px }
  .bar .count { min-width: 64px }
  .bar .count b { font-size: 26px; vertical-align: -3px }
  .hint { display: none }
}
@media (prefers-reduced-motion: reduce) {
  #slide.turn { animation: none }
  .bar button, .ruler::before { transition: none }
}
</style>
</head>
<body>
<header>
  <a class="back" href="../#make">← 작업실</a>
  <h1>포스 피드백 레이싱 <b>휠</b></h1>
  <nav role="tablist" aria-label="보기 선택">
    <button role="tab" id="tab-slides" aria-controls="slides" aria-selected="true"><i>01</i><span>발표 자료</span></button>
    <button role="tab" id="tab-sim" aria-controls="sim" aria-selected="false"><i>02</i><span>3D 시뮬레이션</span></button>
  </nav>
</header>
<main>
  <section id="slides" role="tabpanel" aria-labelledby="tab-slides">
    <div class="stage" id="stage"><img id="slide" src="slides/s-1.png" alt="발표 자료 1번 슬라이드" width="1920" height="1080"></div>
    <div class="notes" id="notes" hidden><p id="notesText"></p></div>
    <div class="bar">
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <button id="prev" type="button">이전</button>
      <span class="count" id="count"><b>01</b> / 03</span>
      <button id="next" type="button">다음</button>
      <span class="spacer"></span>
      <span class="hint">← → 키로 넘기기</span>
      <button id="toggleNotes" type="button" aria-expanded="false" aria-controls="notes">대본 보기</button>
      <button id="full" type="button">전체 화면</button>
    </div>
  </section>
  <section id="sim" role="tabpanel" aria-labelledby="tab-sim" hidden>
    <iframe id="simFrame" title="포스 피드백 레이싱 휠 3D 시뮬레이션" allow="fullscreen" allowfullscreen></iframe>
  </section>
</main>
<script>
const NOTES = ["안녕하세요. 저희 팀은 포스 피드백 레이싱 휠을 만듭니다. 게임 속 노면과 코너링의 힘을 모터로 핸들에 전달하는 아두이노 운전 장치입니다. 왼쪽은 저희가 설계한 3D 모델입니다. 작동 방식은 이렇습니다. 먼저 휠 베이스와 페달의 센서가 핸들 각도와 페달을 밟은 양을 읽습니다. 전자부의 아두이노가 이 값을 USB로 게임에 보내면, 게임은 노면과 코너링 상황에 맞는 힘을 다시 보내 줍니다. 그러면 휠 베이스의 모터가 그 힘을 만들고, 벨트가 핸들에 전달해 손으로 느낄 수 있게 됩니다. 팀은 소프트웨어 황찬웅, 하드웨어 최민호, 기구와 시연 김도영, 기획 김창식 네 명입니다. 이제 저희가 이 휠을 만드는 이유를 말씀드리겠습니다.", "저희는 이 휠을 누구나 쓸 수 있는 운전 연습 장비로 만들고자 합니다. 도로에 나가기 전에 안전한 곳에서 핸들 감각을 익힐 수 있고, 구하기 쉬운 부품으로 만들어 학교나 복지관에서도 부담 없이 갖출 수 있습니다. 또 설계를 공개해서 누구나 따라 만들 수 있게 하려 합니다.", "이 휠을 쓰는 사람은 네 부류입니다. 도로에 나가기 전 연습이 필요한 초보 운전자, 운전 감각을 유지하고 다시 교육받는 고령 운전자, 학교와 동아리에서 공학을 배우는 학생, 그리고 집에서 레이싱 게임을 즐기는 사람들입니다. 이들이 이 휠을 쓰는 이유는 세 가지입니다. 노면과 코너링의 힘이 핸들로 전해져 실제 같은 손맛을 주고, 핸들 각도를 세밀하게 읽어 정밀하게 조향할 수 있으며, 회전 범위와 힘 세기를 사용자에게 맞게 조절할 수 있습니다. 이상으로 발표를 마치겠습니다. 감사합니다."];
const N = NOTES.length, pad = n => String(n).padStart(2, "0");
document.getElementById("ruler").style.setProperty("--n", N);
const $ = id => document.getElementById(id);
const imgs = Array.from({ length: N }, (_, k) => { const im = new Image(); im.src = `slides/s-${k + 1}.png`; return im; });
let cur = 0;
function show(n) {
  cur = Math.max(0, Math.min(N - 1, n));
  if ($("slide").src !== imgs[cur].src) { $("slide").classList.remove("turn"); void $("slide").offsetWidth; $("slide").classList.add("turn"); }
  $("slide").src = imgs[cur].src;
  $("slide").alt = `발표 자료 ${cur + 1}번 슬라이드`;
  $("count").innerHTML = `<b>${pad(cur + 1)}</b> / ${pad(N)}`;
  $("ruler").style.setProperty("--p", (cur + 1) / N);
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === N - 1;
  $("notesText").textContent = NOTES[cur];
}
$("prev").onclick = () => show(cur - 1);
$("next").onclick = () => show(cur + 1);
$("stage").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); show(cur + (e.clientX - r.left < r.width / 3 ? -1 : 1)); };
$("toggleNotes").onclick = () => { const h = !$("notes").hidden; $("notes").hidden = h; $("toggleNotes").setAttribute("aria-expanded", String(!h)); $("toggleNotes").textContent = h ? "대본 보기" : "대본 숨기기"; };
$("full").onclick = () => { const st = $("stage"); (document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen?.())?.catch?.(() => {}); };

function openTab(name) {
  const sim = name === "sim";
  $("slides").hidden = sim; $("sim").hidden = !sim;
  $("tab-slides").setAttribute("aria-selected", String(!sim));
  $("tab-sim").setAttribute("aria-selected", String(sim));
  const f = $("simFrame");
  if (sim) { if (!f.src) { f.src = "sim/"; f.addEventListener("load", () => f.contentWindow.focus(), { once: true }); } else f.contentWindow.focus(); }
  history.replaceState(null, "", "#" + (sim ? "sim" : "slides"));
}
$("tab-slides").onclick = () => openTab("slides");
$("tab-sim").onclick = () => openTab("sim");
document.addEventListener("keydown", e => {
  if ($("slides").hidden || e.target.closest("button")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "f" || e.key === "F") $("full").click();
});
show(0);
openTab(location.hash === "#sim" ? "sim" : "slides");
</script>
</body>
</html>
