<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FFB 휠 3D 설계도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: CAD viewport. Full-bleed 3D canvas, spec sheet docked bottom-left, stop rail on top. Single light look on purpose (projector). */
:root {
  --sky-top: #E8EDF1;
  --sky-bottom: #C9D2D9;
  --ink: #1C2228;
  --ink-soft: #55606B;
  --rule: #C3CBD2;
  --paper: #FFFFFF;
  --accent: #C8102E;
  --accent-ink: #FFFFFF;
  --planned: #9A6B00;
  --font-ui: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  color: var(--ink); font-family: var(--font-ui); font-size: 15px;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#leaders { position: fixed; inset: 0; pointer-events: none; overflow: visible; }
#labels { position: fixed; inset: 0; pointer-events: none; }
.tag {
  position: absolute; transform: translate(-50%, -50%);
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--ink); padding: 3px 8px;
  font-size: 13px; font-weight: 500; white-space: nowrap; line-height: 1.35;
  transition: opacity .25s;
}
.tag small { display: block; font-family: var(--font-data); font-size: 11px; color: var(--ink-soft); font-weight: 400; }
.tag.planned { border-style: dashed; border-color: var(--planned); }
.tag.planned small { color: var(--planned); }
.dot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; background: var(--accent); border: 1.5px solid var(--paper); border-radius: 50%; }

header.rail {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3;
  display: flex; align-items: center; gap: 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.brand { font-weight: 700; font-size: 14px; letter-spacing: .02em; white-space: nowrap; }
.brand span { font-family: var(--font-data); font-weight: 400; color: var(--ink-soft); margin-left: 8px; font-size: 12px; }
.stops { display: flex; gap: 4px; flex-wrap: wrap; pointer-events: auto; margin-left: auto; }
.stops button {
  font: inherit; font-size: 12.5px; border: 1px solid var(--rule); background: rgba(255,255,255,.72);
  color: var(--ink-soft); padding: 5px 10px; cursor: pointer; border-radius: 2px;
}
.stops button[aria-current="step"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.stops button:focus-visible, .nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

aside.sheet {
  position: fixed; z-index: 3;
  left: max(24px, calc(16px + env(safe-area-inset-left, 0px)));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 48px));
  background: var(--paper); border: 1px solid var(--ink);
  box-shadow: 6px 6px 0 rgba(28,34,40,.12);
}
.sheet .head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 0; }
.sheet .count { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); }
.sheet .part { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .06em; }
.sheet h1 { margin: 6px 18px 0; font-size: 26px; line-height: 1.25; font-weight: 700; text-wrap: balance; }
.sheet p.lead { margin: 10px 18px 0; font-size: 15px; line-height: 1.6; color: var(--ink); max-width: 60ch; }
.sheet dl { margin: 14px 0 0; border-top: 1px solid var(--rule); display: grid; grid-template-columns: max-content 1fr; }
.sheet dt, .sheet dd { margin: 0; padding: 8px 18px; border-bottom: 1px solid var(--rule); font-size: 13.5px; line-height: 1.45; }
.sheet dt { color: var(--ink-soft); padding-right: 6px; }
.sheet dd { font-family: var(--font-data); font-size: 13px; padding-left: 6px; min-width: 0; }
.sheet ol.flow { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--rule); counter-reset: f; }
.sheet ol.flow li { counter-increment: f; display: grid; grid-template-columns: 28px 1fr; gap: 6px; padding: 8px 18px; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-soft); transition: background .2s, color .2s; }
.sheet ol.flow li::before { content: counter(f); font-family: var(--font-data); font-weight: 500; }
.sheet ol.flow li b { color: var(--ink); font-weight: 700; }
.sheet ol.flow li.on { background: var(--accent); color: var(--accent-ink); }
.sheet ol.flow li.on b { color: var(--accent-ink); }
.sheet .note { margin: 0; padding: 10px 18px 14px; font-size: 13px; line-height: 1.55; color: var(--ink-soft); }
.sheet .note:empty { display: none; }
.sheet .note.warn { color: var(--planned); }

.nav {
  position: fixed; z-index: 3; display: flex; align-items: center; gap: 8px;
  right: max(24px, calc(16px + env(safe-area-inset-right, 0px)));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
.nav .hint { font-size: 12.5px; color: var(--ink-soft); margin-right: 6px; }
.nav kbd { font-family: var(--font-data); font-size: 11.5px; border: 1px solid var(--ink-soft); border-bottom-width: 2px; padding: 1px 6px; background: var(--paper); color: var(--ink); }
.nav button {
  font: inherit; font-size: 14px; min-width: 44px; height: 40px; padding: 0 14px; cursor: pointer;
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
}
.nav button.primary { background: var(--ink); color: var(--paper); }
.nav button:disabled { opacity: .35; cursor: default; }
.nav button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--font-data); color: var(--ink-soft); font-size: 13px; z-index: 2; }

@media (max-width: 760px) {
  header.rail .stops { display: none; }
  aside.sheet { left: 0; right: 0; bottom: 0; width: auto; box-shadow: none; border-width: 1px 0 0;
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .sheet h1 { font-size: 21px; }
  .sheet p.lead { font-size: 14px; }
  .sheet dl, .sheet .note { display: none; }
  .sheet ol.flow li { padding-block: 5px; font-size: 13px; }
  .nav { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  .nav .hint, #fs { display: none; }
  .nav button { padding: 0 10px; }
  .tag { font-size: 11.5px; padding: 2px 6px; }
  .tag small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tag, .sheet ol.flow li { transition: none; } }
</style>
</head>
<body>

<div id="stage"></div>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels" aria-hidden="true"></div>
<div id="loading">3D 모델 불러오는 중…</div>

<header class="rail">
  <div class="brand">DIY FFB 레이싱 휠<span>3D 구현 설계</span></div>
  <nav class="stops" id="stops" aria-label="카메라 위치"></nav>
</header>

<aside class="sheet" id="sheet" aria-live="polite">
  <div class="head"><span class="part" id="part"></span><span class="count" id="count"></span></div>
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
  <div id="body"></div>
  <p class="note" id="note"></p>
</aside>

<div class="nav">
  <span class="hint"><kbd>Space</kbd> 다음 · <kbd>←</kbd> 이전 · <kbd>X</kbd> 분해</span>
  <button id="explode" type="button" aria-pressed="false" title="X 키">분해 보기</button>
  <button id="fs" type="button" title="전체 화면">전체 화면</button>
  <button id="prev" type="button" aria-label="이전 장면">←</button>
  <button id="next" type="button" class="primary" aria-label="다음 장면">다음 →</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { OutlinePass } from "three/addons/postprocessing/OutlinePass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const ACCENT = 0xC8102E;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SHOT = window.__SHOT === true;

/* ---------- renderer / scene ---------- */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, 1, 1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 10;
controls.maxDistance = 420;

scene.add(new THREE.HemisphereLight(0xffffff, 0xaab4bd, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.3);
sun.position.set(70, 140, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 10, far: 400 });
sun.shadow.bias = -0.0003;
sun.shadow.normalBias = 0.02;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8f0, 0.8);
fill.position.set(-90, 40, 60);
scene.add(fill);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
rimLight.position.set(0, 60, -120);
scene.add(rimLight);

/* ---------- textures ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
scene.background = canvasTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, "#E8EDF1"); gr.addColorStop(1, "#C6CFD7");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#C99A62"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++) {
    const y = rnd() * h, a = 2 + rnd() * 6, f = 0.004 + rnd() * 0.01, ph = rnd() * 6;
    g.strokeStyle = `rgba(${110 + rnd() * 30},${70 + rnd() * 20},35,${0.12 + rnd() * 0.18})`;
    g.lineWidth = 0.6 + rnd() * 1.8; g.beginPath();
    for (let x = 0; x <= w; x += 8) g.lineTo(x, y + Math.sin(x * f + ph) * a);
    g.stroke();
  }
  for (let i = 0; i < 7; i++) { g.fillStyle = "rgba(255,240,215,.07)"; g.fillRect(0, rnd() * h, w, 10 + rnd() * 40); }
}, [1, 1]);
const threadTex = canvasTex(16, 64, (g, w, h) => {
  for (let y = 0; y < h; y += 4) { g.fillStyle = "#d2d6d9"; g.fillRect(0, y, w, 2); g.fillStyle = "#7d8489"; g.fillRect(0, y + 2, w, 2); }
}, [1, 20]);
const perfTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#c7ccd0"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#4b5258";
  for (let y = 8; y < h; y += 16) for (let x = 8 + ((y / 16) % 2) * 8; x < w; x += 16) { g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); }
}, [3, 2]);
const gripTex = canvasTex(2048, 128, (g, w, h) => {
  g.fillStyle = "#26282b"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.035})`; g.fillRect(rnd() * w, rnd() * h, 2, 2); }
  g.strokeStyle = "#8d949b"; g.lineWidth = 3; g.setLineDash([10, 8]);
  [h * 0.22, h * 0.78].forEach(y => { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); });
});
gripTex.wrapS = THREE.RepeatWrapping;
function pcbTex(bg, text, sub) {
  return canvasTex(512, 384, (g, w, h) => {
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 3;
    for (let i = 0; i < 14; i++) { g.beginPath(); const y = 40 + i * 24; g.moveTo(30, y); g.lineTo(200 + rnd() * 200, y); g.lineTo(260 + rnd() * 200, y + 40); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,.92)"; g.font = "bold 54px monospace"; g.fillText(text, 34, h - 70);
    if (sub) { g.font = "30px monospace"; g.fillText(sub, 36, h - 28); }
  });
}
const motorLabelTex = canvasTex(1024, 128, (g, w, h) => {
  g.fillStyle = "#f2f2ee"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#1c2228"; g.font = "bold 64px monospace"; g.fillText("MY1016  24V 250W", 40, 86);
  g.fillStyle = "#C8102E"; g.fillRect(800, 30, 160, 68);
});
const screenTex = canvasTex(1024, 576, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h * .5); sky.addColorStop(0, "#5f8fb8"); sky.addColorStop(1, "#c8dbe8");
  g.fillStyle = sky; g.fillRect(0, 0, w, h * .5);
  g.fillStyle = "#6f8f5a"; g.fillRect(0, h * .5, w, h * .5);
  g.fillStyle = "#3d4247"; g.beginPath(); g.moveTo(w * .47, h * .5); g.lineTo(w * .53, h * .5); g.lineTo(w * .95, h); g.lineTo(w * .05, h); g.fill();
  for (let i = 0; i < 12; i++) { const t0 = i / 12, t1 = (i + .5) / 12; g.fillStyle = i % 2 ? "#ffffff" : "#d11"; const k = t => [w * .47 - (w * .42) * t, h * .5 + h * .5 * t];
    const a = k(t0 * t0), b = k(t1 * t1); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.lineTo(b[0] - 26 * t1, b[1]); g.lineTo(a[0] - 26 * t0, a[1]); g.fill(); }
  g.strokeStyle = "#f1f1f1"; g.lineWidth = 4; g.setLineDash([30, 30]); g.beginPath(); g.moveTo(w * .5, h * .52); g.lineTo(w * .5, h); g.stroke(); g.setLineDash([]);
  g.fillStyle = "rgba(10,12,14,.72)"; g.fillRect(36, h - 108, 300, 72);
  g.fillStyle = "#fff"; g.font = "bold 26px monospace"; g.fillText("FFB", 52, h - 64);
  g.fillStyle = "#333"; g.fillRect(122, h - 86, 196, 26); g.fillStyle = "#C8102E"; g.fillRect(122, h - 86, 128, 26);
  g.fillStyle = "#fff"; g.font = "bold 44px monospace"; g.fillText("3", w - 90, h - 48);
});
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const step = 32;
  g.strokeStyle = "rgba(60,72,84,.16)"; g.lineWidth = 1;
  for (let i = 0; i <= w; i += step) { g.beginPath(); g.moveTo(i + .5, 0); g.lineTo(i + .5, h); g.stroke(); g.beginPath(); g.moveTo(0, i + .5); g.lineTo(w, i + .5); g.stroke(); }
  g.strokeStyle = "rgba(60,72,84,.28)";
  for (let i = 0; i <= w; i += step * 5) { g.beginPath(); g.moveTo(i + .5, 0); g.lineTo(i + .5, h); g.stroke(); g.beginPath(); g.moveTo(0, i + .5); g.lineTo(w, i + .5); g.stroke(); }
  g.globalCompositeOperation = "destination-in";
  const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  r.addColorStop(0, "rgba(0,0,0,1)"); r.addColorStop(.55, "rgba(0,0,0,.9)"); r.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = r; g.fillRect(0, 0, w, h);
});

/* ---------- part registry ---------- */
const tagged = new Map();
function tag(obj, ...names) { obj.traverse(o => { if (o.isMesh) names.forEach(n => { if (!tagged.has(n)) tagged.set(n, new Set()); tagged.get(n).add(o); }); }); return obj; }
const meshesOf = names => { const s = new Set(); names.forEach(n => (tagged.get(n) || []).forEach(m => s.add(m))); return s; };
function mat(color, o = {}) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .55, metalness: 0, envMapIntensity: .75 }, o)); }
const M = {
  wood: () => mat(0xffffff, { map: woodTex, roughness: .78 }),
  steel: () => mat(0xc4c9cd, { metalness: .9, roughness: .3 }),
  zinc: () => mat(0xb9bec2, { metalness: .85, roughness: .38 }),
  thread: () => mat(0xffffff, { map: threadTex.clone(), metalness: .85, roughness: .4 }),
  alu: () => mat(0xd5d9dc, { metalness: .85, roughness: .26 }),
  black: () => mat(0x1d1f22, { roughness: .7 }),
  rubber: () => mat(0x26282b, { roughness: .9 }),
};
function mesh(geo, material, parent, pos = [0, 0, 0], rot) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(...pos); if (rot) m.rotation.set(...rot);
  m.castShadow = true; m.receiveShadow = true;
  (parent || scene).add(m); return m;
}
const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const cyl = (r, l, seg = 32, r2) => new THREE.CylinderGeometry(r2 ?? r, r, l, seg);
const Z = [Math.PI / 2, 0, 0], X = [0, 0, Math.PI / 2];
const rotFor = a => a === "z" ? Z : a === "x" ? X : [0, 0, 0];
const offFor = (a, d) => a === "z" ? [0, 0, d] : a === "x" ? [d, 0, 0] : [0, d, 0];

function nut(parent, pos, axis = "z", ws = -1) { // ws: side of the washer (toward the part it clamps)
  const g = new THREE.Group(); g.position.set(...pos);
  mesh(cyl(0.75, 0.62, 6), M.zinc(), g, [0, 0, 0], rotFor(axis));
  mesh(cyl(0.7, 0.06, 6, 0.6), M.zinc(), g, offFor(axis, -ws * 0.34), rotFor(axis));
  mesh(cyl(0.86, 0.15, 28), M.steel(), g, offFor(axis, ws * 0.4), rotFor(axis));
  parent.add(g); return g;
}
function rod(parent, len, pos, axis = "z") {
  const m = mesh(cyl(0.4, len, 18), M.thread(), parent, pos, rotFor(axis));
  m.material.map.repeat.set(1, len * 1.25);
  return m;
}
function bearing(parent, pos, axis = "z") {
  const g = new THREE.Group(); g.position.set(...pos);
  const r = rotFor(axis);
  mesh(new THREE.TorusGeometry(1.0, 0.12, 12, 40), M.steel(), g, [0, 0, 0], axis === "x" ? [0, Math.PI / 2, 0] : [0, 0, 0]);
  mesh(cyl(1.1, 0.7, 40), M.steel(), g, [0, 0, 0], r);
  mesh(cyl(0.92, 0.72, 40), mat(0x2a2f35, { roughness: .45 }), g, [0, 0, 0], r);
  mesh(cyl(0.6, 0.74, 32), M.steel(), g, [0, 0, 0], r);
  parent.add(g); return g;
}

/* ---------- desk, floor, room props ---------- */
const FLOOR = -72;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), new THREE.MeshStandardMaterial({ map: floorTex, transparent: true, depthWrite: false, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR; scene.add(floor);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), new THREE.ShadowMaterial({ opacity: .16 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = FLOOR + 0.02; shadowCatcher.receiveShadow = true; scene.add(shadowCatcher);

const desk = new THREE.Group(); scene.add(desk);
mesh(box(140, 3, 65), mat(0xe9eaeb, { roughness: .6 }), desk, [0, -1.5, -22.5]);
[[-66, -51], [66, -51], [-66, 6], [66, 6]].forEach(([x, z]) => mesh(box(3.5, 69, 3.5), mat(0x5a6168, { metalness: .6, roughness: .4 }), desk, [x, -37.5, z]));

const monitor = new THREE.Group(); scene.add(monitor);
mesh(box(24, 1, 14), M.black(), monitor, [0, 0.5, -44]);

function beltShape(R1, R2) {
  const c1 = new THREE.Vector2(0, AXIS_Y), c2 = new THREE.Vector2(0, MOTOR_Y);
  const d = c1.distanceTo(c2), th = Math.atan2(c2.y - c1.y, c2.x - c1.x), b = Math.acos((R1 - R2) / d);
  const path = (r1, r2, s) => { s.absarc(c1.x, c1.y, r1, th + b, th + 2 * Math.PI - b, false); s.absarc(c2.x, c2.y, r2, th - b, th + b, false); s.closePath(); return s; };
  const sh = path(R1 + 0.1, R2 + 0.1, new THREE.Shape());
  sh.holes.push(path(R1 - 0.05, R2 - 0.05, new THREE.Path()));
  return sh;
}

  if (tween) {
    const k = Math.min(1, (performance.now() - tween.start) / tween.dur), e = ease(k);
    camera.position.lerpVectors(tween.from.p, tween.to.p, e); controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    if (k >= 1) tween = null;
  }
  controls.update();

  explodeNow += (explodeTarget - explodeNow) * (reduceMotion || SHOT ? 1 : Math.min(1, dt * 3.2));
  const ex = ease(Math.max(0, Math.min(1, explodeNow)));
  explodables.forEach(o => o.obj.position.copy(o.base).addScaledVector(o.d, ex));
  updateGhost(SHOT ? 1 : dt, ex);

  let steerA = 0, press = [0, 0];
  if (s.anim === "steer" || s.anim === "belt") steerA = Math.sin(t * 0.9) * 0.9;
  if (s.anim === "pedals") { const w = Math.sin(t * 1.7); press = [Math.max(0, -w), Math.max(0, w)]; }
  if (s.anim === "idle") steerA = Math.sin(t * 0.5) * 0.12;
  if (SHOT) { steerA = s.anim === "steer" || s.anim === "belt" ? 0.35 : 0; press = s.anim === "pedals" ? [0, 0.5] : [0, 0]; }
  if (s.anim === "flow") {
    flowT += dt; const cyc = flowT % (PH * FLOW.length); const ph = Math.floor(cyc / PH); const u = (cyc % PH) / PH;
    const f = FLOW[ph];
    if (f.curve) { pulse.visible = true; f.curve().getPointAt(f.rev ? 1 - u : u, pulse.position); } else pulse.visible = false;
    steerA = ph === 3 ? ease(u) * 0.55 : ph === 4 ? 0.55 : ph === 0 ? 0.55 * (1 - ease(Math.min(1, u * 1.5))) : 0;
    if (ph !== lastPhase) { lastPhase = ph; document.querySelectorAll("#flow li").forEach((li, k) => li.classList.toggle("on", k === ph)); setOutline(f.tags); }
  } else { pulse.visible = false; lastPhase = -1; }
  steer.rotation.z = steerA; rotor.rotation.z = steerA * 3;
  setPedal(pedals[0], press[0]); setPedal(pedals[1], press[1]);
  if (s.anim === "paddle") { const k = Math.max(0, Math.sin(t * 2.2)), side = Math.floor(t / 2.85) % 2; paddleLevers.forEach((lv, j) => lv.rotation.y = (j ? -1 : 1) * (j === side ? k * 0.35 : 0)); }
  else paddleLevers.forEach(lv => lv.rotation.y = 0);

  composer.render(dt);

  const W2 = innerWidth, H2 = innerHeight;
  const ready = !tween;
  labelsEl.style.opacity = ready ? 1 : 0; leaders.style.opacity = ready ? 1 : 0;
  if (ready) labelEls.forEach(o => {
    const a = o.l.at;
    if (Array.isArray(a)) tmp.set(...a); else { tmp.set(...a.p); a.obj.localToWorld(tmp); }
    tmp.project(camera);
    const behind = tmp.z > 1;
    const x = (tmp.x * .5 + .5) * W2, y = (-tmp.y * .5 + .5) * H2;
    const f = !SHOT && W2 < 760 ? 0.6 : 1;
    const lx = x + o.l.dx * f, ly = y + o.l.dy * f;
    o.dot.style.left = x + "px"; o.dot.style.top = y + "px";
    o.el.style.left = lx + "px"; o.el.style.top = ly + "px";
    o.line.setAttribute("x1", x); o.line.setAttribute("y1", y); o.line.setAttribute("x2", lx); o.line.setAttribute("y2", ly);
    const vis = behind ? "hidden" : "visible"; o.el.style.visibility = o.dot.style.visibility = o.line.style.visibility = vis;
  });
  requestAnimationFrame(frame);
}

const startAt = Math.max(0, STOPS.findIndex(s => s.key === location.hash.slice(1)));
go(startAt, true);
$("loading").remove();
requestAnimationFrame(frame);
</script>
</body>
