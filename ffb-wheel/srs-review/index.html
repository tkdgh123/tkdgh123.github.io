<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRS 첨삭</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 교정지: 본문은 명조, 여백 메모는 고딕, 고친 자리 표시는 잉크 블루 하나. 빨강은 쪽 그림 속 펜 색을 읽는 법에만 */
:root {
  --paper: #f2f1ec; --tone: #e4e2da; --ink: #151514; --muted: #5a5954; --rule: #c9c6bc;
  --blue: #2b44a6; --pen: #c21414;
  --m: clamp(16px, 3.2vw, 52px); --g: clamp(12px, 1.6vw, 24px);
  --serif: "Noto Serif KR", serif;
  --sans: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", "Pretendard Variable", ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 17px/1.7 var(--sans); word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; overflow-x: clip }
a { color: inherit }
img { display: block; max-width: 100%; height: auto }
:focus-visible { outline: 2px solid currentColor; outline-offset: 4px }

/* 첫 면: 왼쪽 일곱 칸에 글, 오른쪽에 첨삭한 표지 한 장 */
.top { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); align-items: start; padding: 26px var(--m) clamp(80px, 9vw, 140px) }
.back { grid-column: 1 / -1; justify-self: start; font: 400 12.5px/1 var(--mono); letter-spacing: .02em; color: var(--muted); text-decoration: none; padding: 6px 0 }
.back:hover { color: var(--ink) }
.top .copy { grid-column: 1 / 8; padding-top: clamp(64px, 8vw, 128px) }
h1 { margin: 0; font: 300 clamp(44px, 5.4vw, 92px)/1.12 var(--serif); letter-spacing: -.03em }
h1 b { font-weight: 700; text-decoration: underline 3px var(--blue); text-underline-offset: .14em }
.top p { margin: 36px 0 0; max-width: 31em; font: 400 clamp(17px, 1rem + .25vw, 20px)/1.85 var(--serif) }
.legend { margin: 40px 0 0; padding: 22px 0 0; border-top: 1px solid var(--ink); list-style: none; display: grid; grid-template-columns: repeat(2, max-content); gap: 12px 44px; font-size: 15px }
.legend li { display: flex; align-items: center; gap: 10px }
.legend s { text-decoration-color: var(--pen); text-decoration-thickness: 2px; font-weight: 600 }
.legend b { color: var(--pen); font-weight: 700 }
.legend i { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--pen); color: #fff; font: 600 12px/1 var(--mono); font-style: normal }
.dl { margin-top: 40px; display: inline-flex; align-items: center; min-height: 56px; padding: 0 24px; background: var(--blue); color: #fff; font-weight: 700; font-size: 16px; text-decoration: none; transition: transform .15s, background-color .2s }
.dl:hover { background: #22398f } .dl:active { transform: scale(.98) }
.cover { grid-column: 9 / 13; grid-row: 2; width: 100%; margin-top: clamp(64px, 8vw, 128px); background: #fff }

/* 아홉 쪽: 한 단계 어두운 종이 위에 흰 쪽, 오른쪽 여백에 쪽 번호와 고친 곳 메모 */
.pages { background: var(--tone); padding: clamp(80px, 9vw, 140px) var(--m) 160px; display: grid; gap: clamp(72px, 8vw, 120px) }
figure { margin: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--g); align-items: start }
figure img { grid-column: 2 / 9; grid-row: 1; width: 100%; aspect-ratio: 1489 / 2105; background: #fff }
figcaption { grid-column: 9 / 13; grid-row: 1; position: sticky; top: 32px; padding-left: var(--g); border-left: 1px solid var(--rule) }
.pg { display: block; font: 400 15px/1 var(--mono); color: var(--muted) }
.pg b { font: 300 clamp(72px, 7vw, 120px)/.8 var(--serif); color: var(--ink); letter-spacing: -.04em; margin-right: 6px }
.name { display: block; margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.35 }
.notes { margin: 18px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; line-height: 1.5; color: var(--muted) }
.notes li { display: grid; grid-template-columns: 22px minmax(0, 1fr) }
.notes li::before { content: ""; width: 12px; height: 2px; margin-top: .72em; background: var(--blue) }

/* 쪽이 화면에 들어오면 떠오른다 */
.js .rise { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1) }
.js .rise.in { opacity: 1; transform: none }

@media (max-width: 900px) {
  .top .copy { grid-column: 1 / -1 }
  .cover { display: none }
  figure img { grid-column: 1 / -1; grid-row: 2 }
  figcaption { grid-column: 1 / -1; position: static; padding: 0 0 20px; border: 0 }
  .notes { grid-template-columns: repeat(auto-fill, minmax(13em, 1fr)); column-gap: var(--g) }
}
@media (max-width: 640px) {
  .legend { grid-template-columns: 1fr }
  .pages { padding-bottom: 96px }
  .pg b { font-size: 64px }
}
@media (prefers-reduced-motion: reduce) {
  .js .rise { opacity: 1; transform: none; transition: none }
  .dl { transition: none }
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="../">← 레이싱 휠</a>
  <div class="copy">
  <h1 class="rise">FFB 휠 펌웨어 SRS <b>첨삭</b></h1>
  <p class="rise">팀 SRS(8쪽)에 고칠 곳을 빨간 펜으로 직접 표시했습니다. 마지막 9쪽은 문서에 없는 3.3~3.6 요구사항을 새로 쓴 초안입니다. 숫자(1ms, 100ms, 20kHz, 기본값 등)는 제안값이니 팀이 정해서 바꿔 넣으면 됩니다.</p>
  <ul class="legend rise">
    <li><s>취소선</s> 지울 곳</li>
    <li><b>빨간 글씨</b> 바꾸거나 넣을 내용</li>
    <li><b>∧</b> 끼워 넣을 자리</li>
    <li><i>1</i> 같은 쪽 아래 메모와 짝</li>
  </ul>
  <a class="dl rise" href="srs-review.pdf" download>첨삭한 PDF 받기</a>
  </div>
  <img class="cover rise" src="p3.webp" alt="" width="1489" height="2105" aria-hidden="true">
</header>

<main class="pages">
  <figure class="rise"><img src="p1.webp" alt="1쪽 표지: 버전과 개정 이력 추가, 제안값 안내" width="1489" height="2105"><figcaption><span class="pg"><b>1</b> / 9</span><span class="name">표지</span><ul class="notes" aria-hidden="true"><li>버전과 개정 이력 추가</li><li>제안값 안내</li></ul></figcaption></figure>
  <figure class="rise"><img src="p2.webp" alt="2쪽 목차: 3.3~3.6 절 추가" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>2</b> / 9</span><span class="name">목차</span><ul class="notes" aria-hidden="true"><li>3.3~3.6 절 추가</li></ul></figcaption></figure>
  <figure class="rise"><img src="p3.webp" alt="3쪽 서론: 오타, 프레임 정의, 힘 명령 범위, 참고 문서, 요구사항 ID 규칙" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>3</b> / 9</span><span class="name">서론</span><ul class="notes" aria-hidden="true"><li>오타</li><li>프레임 정의</li><li>힘 명령 범위</li><li>참고 문서</li><li>요구사항 ID 규칙</li></ul></figcaption></figure>
  <figure class="rise"><img src="p4.webp" alt="4쪽 전체 설명: 기능과 요구사항 연결, 리셋 중 EN 핀, 송신 버퍼" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>4</b> / 9</span><span class="name">전체 설명</span><ul class="notes" aria-hidden="true"><li>기능과 요구사항 연결</li><li>리셋 중 EN 핀</li><li>송신 버퍼</li></ul></figcaption></figure>
  <figure class="rise"><img src="p5.webp" alt="5쪽 제약과 가정: 1080도, READY 대기, 통신 두절, AS5600 굽기, 풀다운, 2차 표시" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>5</b> / 9</span><span class="name">제약, 가정, 요구사항 분할</span><ul class="notes" aria-hidden="true"><li>1080도</li><li>READY 대기</li><li>통신 두절</li><li>AS5600 굽기</li><li>풀다운</li><li>2차 표시</li></ul></figcaption></figure>
  <figure class="rise"><img src="p6.webp" alt="6쪽 구조도: 안전 감시로 가는 빠진 선 2개, 모드 상태도 추가" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>6</b> / 9</span><span class="name">펌웨어 구조</span><ul class="notes" aria-hidden="true"><li>안전 감시로 가는 빠진 선 2개</li><li>모드 상태도 추가</li></ul></figcaption></figure>
  <figure class="rise"><img src="p7.webp" alt="7쪽 명령표와 핀 표: 단위, 기본값, D4 핀 충돌, 풀업, PWM 주파수" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>7</b> / 9</span><span class="name">사용자·하드웨어 인터페이스</span><ul class="notes" aria-hidden="true"><li>단위</li><li>기본값</li><li>D4 핀 충돌</li><li>풀업</li><li>PWM 주파수</li></ul></figcaption></figure>
  <figure class="rise"><img src="p8.webp" alt="8쪽 시리얼 규칙: 8N1, 프레임 형식, 데이터 형식, 전송 주기, 상태 비트" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>8</b> / 9</span><span class="name">시리얼 통신 규칙, 설계 제약</span><ul class="notes" aria-hidden="true"><li>8N1</li><li>프레임 형식</li><li>데이터 형식</li><li>전송 주기</li><li>상태 비트</li></ul></figcaption></figure>
  <figure class="rise"><img src="p9.webp" alt="9쪽 새로 추가할 3.3~3.6 요구사항 초안" width="1489" height="2105" loading="lazy"><figcaption><span class="pg"><b>9</b> / 9</span><span class="name">새로 추가할 쪽</span><ul class="notes" aria-hidden="true"><li>새로 추가할 3.3~3.6 요구사항 초안</li></ul></figcaption></figure>
</main>

<script>
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
document.querySelectorAll(".rise").forEach(el => io.observe(el));
</script>
</body>
</html>
