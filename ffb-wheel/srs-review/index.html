<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRS 첨삭</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 작업실과 같은 색 넷에, 첨삭이 쓴 빨간 펜 하나 */
:root {
  --paper: #f5f5f2; --tone: #e6e6e1; --dark: #16171b; --ink: #111; --muted: #55554f;
  --on-dark: #f2f2ef; --on-dark-soft: #a9aab0; --accent: #2f4fb5; --accent-ink: #fff; --red: #c21414;
  --m: clamp(16px, 2.6vw, 40px); --cut: 7vw;
  --s-small: 14px; --s-body: clamp(17px, 1rem + .2vw, 19px); --s-lead: clamp(21px, 1.1rem + .7vw, 28px);
  --s-display: clamp(44px, 5.6vw, 92px);
  color-scheme: light;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--s-body)/1.55 "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased }
a { color: inherit }
img { display: block; max-width: 100%; height: auto }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px }

/* 첫 화면: 왼쪽에 제목과 표시 읽는 법, 오른쪽에 첨삭한 표지가 비스듬히 아래 면까지 걸친다 */
.top { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 16px; padding: 22px var(--m) 0 }
.back { grid-column: 1 / -1; justify-self: start; font-weight: 900; font-size: var(--s-lead); letter-spacing: -.04em; text-decoration: none }
.back:hover { text-decoration: underline 3px; text-underline-offset: 6px }
.top .copy { grid-column: 1 / 8; padding: clamp(64px, 9vw, 140px) 0 calc(var(--cut) + 96px) }
h1 { margin: 0; font-size: var(--s-display); font-weight: 900; letter-spacing: -.04em; line-height: 1.02 }
.top p { margin: 32px 0 0; max-width: 34em }
.legend { margin: 36px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, max-content); gap: 14px 40px }
.legend li { display: flex; align-items: center; gap: 10px }
.legend s { text-decoration-color: var(--red); text-decoration-thickness: 2px; font-weight: 700 }
.legend b { color: var(--red); font-weight: 800 }
.legend i { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--red); color: #fff; font: 800 13px/1 inherit; font-style: normal }
.dl { margin-top: 40px; display: inline-flex; align-items: center; min-height: 60px; padding: 0 26px; background: var(--accent); color: var(--accent-ink); font-weight: 800; text-decoration: none; transition: transform .15s, background-color .2s }
.dl:hover { background: #233d93 } .dl:active { transform: scale(.97) }
.cover { grid-column: 9 / 13; justify-self: start; width: calc(100% - 24px); align-self: start; margin: clamp(48px, 7vw, 110px) 0 -16vw; transform: rotate(3deg); background: #fff }

/* 아홉 쪽: 먹색 면 위에 한 쪽씩, 쪽 이름은 왼쪽에 따라온다 */
.pages { position: relative; z-index: 1; margin-top: calc(-1 * var(--cut)); padding: calc(var(--cut) + 16vw + 96px) var(--m) 160px; clip-path: polygon(0 var(--cut), 100% 0, 100% 100%, 0 100%); background: var(--dark); color: var(--on-dark); display: grid; gap: clamp(72px, 8vw, 120px) }
figure { margin: 0; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 16px; align-items: start }
figure img { grid-column: 5 / 13; grid-row: 1; width: 100%; aspect-ratio: 1489 / 2105; background: #fff }
figcaption { grid-column: 1 / 5; grid-row: 1; position: sticky; top: 32px; padding-right: 24px; font-size: var(--s-lead); font-weight: 800; letter-spacing: -.03em; line-height: 1.25 }

/* 쪽이 화면에 들어오면 떠오른다 */
.js .rise { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1) }
.js .rise.in { opacity: 1; transform: none }
.js .cover.rise { transform: translateY(28px) rotate(3deg) } .js .cover.rise.in { transform: rotate(3deg) }

@media (max-width: 900px) {
  .top .copy { grid-column: 1 / 9 }
  .cover { grid-column: 9 / 13; margin-bottom: -8vw }
  .pages { padding-top: calc(var(--cut) + 8vw + 72px) }
  figure img { grid-column: 1 / -1; grid-row: 2 }
  figcaption { grid-column: 1 / -1; position: static; padding: 0 0 16px }
}
@media (max-width: 640px) {
  :root { --cut: 12vw }
  .top .copy { grid-column: 1 / -1; padding-bottom: calc(var(--cut) + 56px) }
  h1 { font-size: 11vw }
  .legend { grid-template-columns: 1fr }
  .cover { display: none }
  .pages { padding-top: calc(var(--cut) + 64px); padding-bottom: 96px }
}
@media (prefers-reduced-motion: reduce) {
  .js .rise { opacity: 1; transform: none; transition: none }
  .js .cover.rise { transform: rotate(3deg) }
  .dl { transition: none }
}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="../../#make">← 작업실</a>
  <div class="copy">
  <h1 class="rise">FFB 휠 펌웨어 SRS 첨삭</h1>
  <p class="rise">팀 SRS(8쪽)에 고칠 곳을 빨간 펜으로 직접 표시했습니다. 마지막 9쪽은 문서에 없는 3.3~3.6 요구사항을 새로 쓴 초안입니다. 숫자(1ms, 100ms, 20kHz, 기본값 등)는 제안값이니 팀이 정해서 바꿔 넣으면 됩니다.</p>
  <ul class="legend rise">
    <li><s>취소선</s> 지울 곳</li>
    <li><b>빨간 글씨</b> 바꾸거나 넣을 내용</li>
    <li><b>∧</b> 끼워 넣을 자리</li>
    <li><i>1</i> 같은 쪽 아래 메모와 짝</li>
  </ul>
  <a class="dl rise" href="srs-review.pdf" download>첨삭한 PDF 받기</a>
  </div>
  <img class="cover rise" src="p1.webp" alt="" width="1489" height="2105" aria-hidden="true">
</header>

<main class="pages">
  <figure class="rise"><img src="p1.webp" alt="1쪽 표지: 버전과 개정 이력 추가, 제안값 안내" width="1489" height="2105"><figcaption>1 / 9 · 표지</figcaption></figure>
  <figure class="rise"><img src="p2.webp" alt="2쪽 목차: 3.3~3.6 절 추가" width="1489" height="2105" loading="lazy"><figcaption>2 / 9 · 목차</figcaption></figure>
  <figure class="rise"><img src="p3.webp" alt="3쪽 서론: 오타, 프레임 정의, 힘 명령 범위, 참고 문서, 요구사항 ID 규칙" width="1489" height="2105" loading="lazy"><figcaption>3 / 9 · 서론</figcaption></figure>
  <figure class="rise"><img src="p4.webp" alt="4쪽 전체 설명: 기능과 요구사항 연결, 리셋 중 EN 핀, 송신 버퍼" width="1489" height="2105" loading="lazy"><figcaption>4 / 9 · 전체 설명</figcaption></figure>
  <figure class="rise"><img src="p5.webp" alt="5쪽 제약과 가정: 1080도, READY 대기, 통신 두절, AS5600 굽기, 풀다운, 2차 표시" width="1489" height="2105" loading="lazy"><figcaption>5 / 9 · 제약, 가정, 요구사항 분할</figcaption></figure>
  <figure class="rise"><img src="p6.webp" alt="6쪽 구조도: 안전 감시로 가는 빠진 선 2개, 모드 상태도 추가" width="1489" height="2105" loading="lazy"><figcaption>6 / 9 · 펌웨어 구조</figcaption></figure>
  <figure class="rise"><img src="p7.webp" alt="7쪽 명령표와 핀 표: 단위, 기본값, D4 핀 충돌, 풀업, PWM 주파수" width="1489" height="2105" loading="lazy"><figcaption>7 / 9 · 사용자·하드웨어 인터페이스</figcaption></figure>
  <figure class="rise"><img src="p8.webp" alt="8쪽 시리얼 규칙: 8N1, 프레임 형식, 데이터 형식, 전송 주기, 상태 비트" width="1489" height="2105" loading="lazy"><figcaption>8 / 9 · 시리얼 통신 규칙, 설계 제약</figcaption></figure>
  <figure class="rise"><img src="p9.webp" alt="9쪽 새로 추가할 3.3~3.6 요구사항 초안" width="1489" height="2105" loading="lazy"><figcaption>9 / 9 · 새로 추가할 쪽</figcaption></figure>
</main>

<script>
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
document.querySelectorAll(".rise").forEach(el => io.observe(el));
</script>
</body>
</html>
