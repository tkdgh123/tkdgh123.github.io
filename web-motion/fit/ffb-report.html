<!-- Claude가 만듦 (2026-11-06) — 초안 위를 내 커서가 직접 고쳐 쓰고, 다 고친 주는 아래에 종이로 쌓인다 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>직접 고쳐 쓰는 보고서 · 카드별 어울림</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#f2f1ec;--tone:#e4e2da;--ink:#151514;--muted:#5a5954;--rule:#c9c6bc;--card:#fbfaf7;--blue:#2b44a6;--blue-soft:#cfd6f0;
 --sans:"Wanted Sans Variable","Wanted Sans","Pretendard Variable",system-ui,"Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--hud:var(--muted);--m:clamp(16px,3.4vw,56px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{position:fixed;z-index:70;inset:0 0 auto;display:flex;justify-content:space-between;gap:12px;padding:16px clamp(16px,3.2vw,52px);font:500 12px/1 var(--mono);letter-spacing:.02em;pointer-events:none;word-spacing:-.25em}
.top a{pointer-events:auto;text-decoration:none;color:var(--hud,currentColor);padding:6px 0}
.top a:hover{text-decoration:underline;text-underline-offset:4px}
.stage{position:fixed;inset:0;overflow:hidden}
.ov{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.box{position:absolute;border:1.5px solid var(--bc);background:color-mix(in srgb,var(--bc) 9%,transparent);transition:opacity .5s}
.box::before,.box::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--bc)}
.box::before{left:-4.5px;top:-4.5px}.box::after{right:-4.5px;bottom:-4.5px}
.size{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:var(--bc);color:#fff;font:600 10.5px/1.4 var(--mono);padding:1px 6px;white-space:nowrap;border-radius:2px}
.cur{position:absolute;left:0;top:0;will-change:transform;transition:opacity .4s}
.cur.follow{transition:opacity .4s,transform .13s linear}
.cur svg{display:block;filter:drop-shadow(0 1px 2px rgb(0 0 0/.35))}
.cur span{position:absolute;left:13px;top:17px;background:var(--cc);color:#fff;font:600 11px/1 var(--sans);padding:4px 8px;border-radius:3px 9px 9px 9px;white-space:nowrap}
.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid var(--cc);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
.tc{opacity:0;font-style:normal;font-variant-ligatures:none}.tc.on{opacity:1}
.tc.last{position:relative}
.tc.last::after{content:"";position:absolute;left:100%;top:.08em;bottom:.04em;width:2px;background:var(--cc,currentColor);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pop{transition:opacity .55s,transform .7s cubic-bezier(.2,.8,.2,1)}
.pop.pre{opacity:0;transform:translateY(10px) scale(.985)}

.page{position:absolute;inset:0;padding:64px var(--m) 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,clamp(400px,40vw,620px));column-gap:clamp(24px,4vw,80px);align-items:stretch}
.l{display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.eyebrow{font:500 12.5px var(--mono);color:var(--muted)}
h1{margin:8px 0 0;font:300 clamp(46px,6.4vw,108px)/1 var(--sans);letter-spacing:-.05em}h1 b{font-weight:750}
.sub{margin-top:clamp(12px,2vh,22px);color:var(--muted);font-size:clamp(14px,1.2vw,18px);max-width:28ch}
.pile{position:relative;width:clamp(250px,24vw,360px);height:clamp(180px,30vh,270px);align-self:flex-start}
.mini{position:absolute;bottom:0;width:clamp(112px,10.5vw,158px);aspect-ratio:1/1.34;background:var(--card);border-radius:3px;box-shadow:0 1px 0 rgb(0 0 0/.07),0 14px 26px -12px rgb(21 21 20/.4);padding:9% 9%;display:flex;flex-direction:column;gap:5.5%;will-change:transform}
.mini b{font:500 11px var(--mono);color:var(--blue);letter-spacing:.02em;margin-bottom:4%}
.mini i{display:block;height:3.4%;background:var(--tone);border-radius:2px}
.mini i:nth-of-type(1){width:92%}.mini i:nth-of-type(2){width:68%}.mini i:nth-of-type(3){width:88%}.mini i:nth-of-type(4){width:54%}.mini i:nth-of-type(5){width:78%}
.stamp{z-index:20;position:absolute;right:-14px;top:42%;background:var(--blue);color:#fff;font:700 clamp(15px,1.4vw,20px) var(--sans);letter-spacing:.04em;padding:6px 14px;border-radius:3px;transform:rotate(-7deg) scale(0);transition:transform .5s cubic-bezier(.3,1.6,.4,1)}
.stamp.on{transform:rotate(-7deg) scale(1)}
.r{display:grid;place-items:center;min-height:0}
.paper{height:100%;width:auto;max-width:100%;aspect-ratio:1/1.3;background:var(--card);border-radius:4px;box-shadow:0 1px 0 rgb(0 0 0/.06),0 40px 70px -34px rgb(21 21 20/.45);padding:clamp(22px,3vw,44px);display:flex;flex-direction:column;gap:clamp(14px,2.4vh,26px);min-width:0;container-type:inline-size}
.paper .hd{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.paper .hd small{font:400 12px var(--mono);color:var(--muted)}
.paper h2{margin:0;font:750 clamp(22px,4.6cqw,34px)/1.1 var(--sans);letter-spacing:-.04em}
.paper h2 em{font-style:normal;color:var(--blue)}
.paper .tt{font:400 12.5px var(--mono);color:var(--muted);margin-top:6px}
.sec h3{margin:0 0 6px;font:500 11.5px var(--mono);color:var(--blue);letter-spacing:.04em}
.ln{margin:0;font-size:clamp(14px,3.5cqw,19px);line-height:1.7;white-space:nowrap;min-height:1.7em;display:flex;align-items:center}
.tx{display:flex;gap:.5em;align-items:center;padding:.15em .1em}
.w{display:block;height:.62em;border-radius:.31em;background:#cfccc2;transform-origin:left;opacity:0;transition:opacity .14s,transform .14s;transform:scaleX(.6)}
.w.on{opacity:1;transform:none}.ln.ink .w{background:#1c1c1a}
.tx{--sw:0%;border-radius:4px;background:linear-gradient(var(--blue-soft),var(--blue-soft)) no-repeat 0 100%/var(--sw) 100%}
.ln.draft{color:#8a8984}
.ln.draft::after{content:"초안";font:500 10px var(--mono);background:var(--tone);color:var(--muted);padding:2px 6px;border-radius:9px;margin-left:10px;vertical-align:2px}
.ln.fine{transition:color .4s}
.rule{margin-top:auto;padding-top:18px;display:grid;gap:9px}.rule i{display:block;height:7px;background:var(--tone);border-radius:3px}.rule i:nth-child(1){width:100%}.rule i:nth-child(2){width:86%}.rule i:nth-child(3){width:64%}
.again{position:fixed;z-index:70;right:var(--m);bottom:8px;font:500 12px var(--mono);color:var(--muted);background:none;border:0;padding:8px 0;cursor:pointer}
.again:hover{color:var(--ink)}
@media (max-width:820px){
 .page{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto;align-content:center;row-gap:16px;padding-top:56px}
 h1{font-size:44px}.sub{display:none}.eyebrow{display:none}
 .l{display:contents}
 .l>div:first-child{order:0}.r{order:1}.pile{order:2;width:100%;height:112px;align-self:stretch}
 .paper{padding:18px;gap:12px;aspect-ratio:auto;height:auto;min-height:330px;width:100%}
 .mini{width:76px}
 .paper .hd{padding-bottom:8px}
}
</style>
</head>
<body>
<nav class="top"><a href="./index.html">← 카드별 어울림</a><a href="../../ffb-report/">작품 보기 →</a></nav>
<div class="stage" id="st">
 <div class="page">
  <section class="l">
   <div><p class="eyebrow" data-b="type">레이싱 휠 · 매주 개별 제출</p><h1 data-b="type">주차 <b>보고서</b></h1><p class="sub" data-b>초안을 직접 고친 글로 PDF까지.</p></div>
   <div class="pile" id="pile"><span class="stamp" id="stamp">PDF</span></div>
  </section>
  <section class="r"><article class="paper" id="paper">
   <header class="hd"><div><h2><em id="wk">10</em>주차 보고서</h2><p class="tt" id="tt">페달 수치와 나무 자르기</p></div><small id="rng">11.3–11.9</small></header>
   <div class="sec"><h3>한 일</h3><p class="ln" id="l0"></p></div>
   <div class="sec"><h3>막힌 곳</h3><p class="ln" id="l1"></p></div>
   <div class="sec"><h3>다음 주</h3><p class="ln" id="l2"></p></div>
   <div class="rule"><i></i><i></i><i></i></div>
  </article></section>
 </div>
 <div class="ov" id="ov"></div>
</div>
<button class="again" id="again" type="button">↻ 다시</button>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let G=0;const ABORT={};
const sleep=ms=>{const g=G;return new Promise((ok,no)=>setTimeout(()=>G===g?ok():no(ABORT),ms))};
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
const tween=(ms,fn,e=ease)=>{const g=G;return new Promise((ok,no)=>{const t0=performance.now();const f=n=>{if(G!==g)return no(ABORT);const t=Math.min(1,(n-t0)/ms);fn(e(t),t);t<1?requestAnimationFrame(f):ok()};requestAnimationFrame(f)})};
const arrow=c=>`<svg width="18" height="20" viewBox="0 0 18 20"><path d="M1 1l15 7.5-6.5 1.8L6.8 17z" fill="${c}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const rel=(st,el)=>{const r=el.getBoundingClientRect(),s=st.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}};
class Cur{
  constructor(ov,c,n,x,y){this.ov=ov;this.c=c;this.x=x;this.y=y;const d=this.el=document.createElement("div");d.className="cur";d.style.setProperty("--cc",c);d.innerHTML=arrow(c)+`<span>${n}</span>`;ov.append(d);this.place()}
  place(){this.el.style.transform=`translate(${this.x}px,${this.y}px)`}
  go(x,y,ms=700,arc=60){const a=[this.x,this.y],dx=x-a[0],dy=y-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,s=arc*Math.min(1,L/420)*(Math.random()<.5?-1:1);return tween(ms,t=>{const b=Math.sin(Math.PI*t)*s;this.x=a[0]+dx*t+nx*b;this.y=a[1]+dy*t+ny*b;this.place()})}
  click(){const r=document.createElement("i");r.className="rip";r.style.cssText=`left:${this.x}px;top:${this.y}px;--cc:${this.c}`;this.ov.append(r);setTimeout(()=>r.remove(),700)}
  goEl(st,el,ox=.5,oy=.5,ms=700){const r=rel(st,el);return this.go(r.x+r.w*ox,r.y+r.h*oy,ms)}
}
// 칸을 끌어 긋기: 커서가 왼쪽 위로 가서 오른쪽 아래까지 끌며 크기 표시가 올라감
async function drawBox(st,ov,cur,el,color,ms=560){
  const r=rel(st,el);await cur.go(r.x,r.y,520+Math.random()*220);
  const b=document.createElement("div"),z=document.createElement("span");b.className="box";z.className="size";b.style.cssText=`--bc:${color};left:${r.x}px;top:${r.y}px;width:0;height:0`;b.append(z);ov.append(b);
  await Promise.all([tween(ms,t=>{b.style.width=r.w*t+"px";b.style.height=r.h*t+"px";z.textContent=`${Math.round(r.w*t)} × ${Math.round(r.h*t)}`}),cur.go(r.x+r.w,r.y+r.h,ms,30)]);
  cur.click();return b;
}
const fadeBox=b=>{b.style.opacity=0;setTimeout(()=>b.remove(),600)};
// 글자 한 자씩 감싸 둠 (자리는 그대로, 보이기만 바꿈)
function split(n){[...n.childNodes].forEach(c=>c.nodeType===3?c.replaceWith(...[...c.textContent].map(ch=>Object.assign(document.createElement("i"),{className:"tc",textContent:ch}))):split(c))}
async function typeEl(st,el,cur,ms=32){
  const cs=$$(".tc",el);el.style.opacity=1;let last=null;if(cur)cur.el.classList.add("follow");
  for(let i=0;i<cs.length;i++){
    if(last)last.classList.remove("last");const c=cs[i];c.classList.add("on","last");last=c;if(cur)c.style.setProperty("--cc",cur.c);
    if(cur&&(i%3===0||i===cs.length-1)){const r=rel(st,c);cur.x=r.x+r.w+3;cur.y=r.y+r.h*.55;cur.place()}
    const t=c.textContent;await sleep(t==="\n"?ms*5:t===" "?ms*.5:ms*(.7+Math.random()*.7));
  }
  if(last)setTimeout(()=>last.classList.remove("last"),900);
  if(cur)cur.el.classList.remove("follow");
}
const showTyped=el=>{$$(".tc",el).forEach(c=>c.classList.add("on"));el.style.opacity=1};
const popIn=el=>el.classList.remove("pre");

const st=$("#st"),ov=$("#ov"),paper=$("#paper"),pile=$("#pile"),stamp=$("#stamp");
const WK=[{n:10,rng:"11.3–11.9",t:"페달 수치와 나무 자르기"},{n:11,rng:"11.10–11.16",t:"페달 완성"},{n:12,rng:"11.17–11.23",t:"휠 베이스와 조향 센서"}];
const items=$$("[data-b]");items.forEach(el=>el.dataset.b==="type"&&split(el));
const rot=[-4,2.5,-1.5],mx=[0,.34,.68];
const L=i=>$(`#l${i}`);
const rr=(a,b)=>a+Math.random()*(b-a);
// 글이 아닌 막대: 낱말 모양 막대 여러 개 (읽을 수 있는 글자는 없음)
const words=(n,p)=>{const fs=parseFloat(getComputedStyle(p).fontSize),tot=Math.max(8,p.clientWidth/fs*rr(.6,.82)-n*.5),ws=Array.from({length:n},()=>rr(.5,1.6)),sm=ws.reduce((a,b)=>a+b);
  return ws.map(w=>`<i class="w" style="width:${Math.max(1.3,tot*w/sm).toFixed(2)}em"></i>`).join("")};
function paint(w){
  $("#wk").textContent=w.n;$("#tt").textContent=w.t;$("#rng").textContent=w.rng;
  [0,1,2].forEach(i=>{const p=L(i);p.className="ln"+(i===1?" ink":" draft");p.innerHTML=`<span class="tx">${words(i===1?6:Math.round(rr(5,8)),p)}</span>`;p.style.opacity=1});
}
const wd=el=>[...el.querySelectorAll(".w")];
async function reveal(el,cur,ms){for(const w of wd(el)){w.classList.add("on");if(cur){const r=rel(st,w);cur.x=r.x+r.w+4;cur.y=r.y+r.h/2;cur.place()}await sleep(ms)}}
async function edit(me,i){
  const p=L(i),tx=$(".tx",p),r=rel(st,tx);
  await me.go(r.x-2,r.y+r.h/2,330);me.click();
  await Promise.all([tween(260,t=>tx.style.setProperty("--sw",t*100+"%")),me.go(r.x+r.w,r.y+r.h/2,260,10)]);
  await sleep(70);
  tx.style.setProperty("--sw","0%");tx.innerHTML=words(Math.round(rr(6,9)),p);p.classList.remove("draft");p.classList.add("ink");
  me.el.classList.add("follow");await reveal(tx,me,48);me.el.classList.remove("follow");await sleep(40);
}
async function fly(k,w){
  const m=document.createElement("div");m.className="mini";m.innerHTML=`<b>${w.n}주</b><i></i><i></i><i></i><i></i><i></i>`;
  m.style.left=mx[k]*(pile.clientWidth-m.offsetWidth||200)+"px";pile.append(m);
  m.style.left=mx[k]*(pile.clientWidth-m.getBoundingClientRect().width)+"px";
  m.style.zIndex=k+1;
  const a=rel(st,paper),mm=m.getBoundingClientRect();m.style.transform=`rotate(${rot[k]}deg)`;
  const b=rel(st,m),s=a.w/mm.width,dx=a.x+a.w/2-(b.x+b.w/2),dy=a.y+a.h/2-(b.y+b.h/2);
  paper.style.transition="opacity .35s";paper.style.opacity=0;
  m.animate([{transform:`translate(${dx}px,${dy}px) scale(${s}) rotate(0deg)`,opacity:.0},{opacity:1,offset:.12},{transform:`translate(${dx*.3}px,${dy*.3-30}px) scale(${s*.5}) rotate(${rot[k]*2}deg)`,offset:.55},{transform:`rotate(${rot[k]}deg)`,opacity:1}],{duration:800,easing:"cubic-bezier(.35,.7,.2,1)",fill:"backwards"});
  await sleep(760);
  return m;
}
async function build(){
  ++G;pile.style.transition="none";pile.style.transform="";
  $$(".cur,.box,.rip",ov).forEach(e=>e.remove());$$(".mini",pile).forEach(e=>e.remove());stamp.classList.remove("on");
  items.forEach(el=>{el.style.opacity=0;el.style.transition="opacity .55s"});$$(".tc",$(".l")).forEach(c=>c.classList.remove("on","last"));
  paper.style.opacity=0;
  if(calm){items.forEach(el=>el.style.opacity=1);$$(".tc",$(".l")).forEach(c=>c.classList.add("on"));paint(WK[0]);wd(paper).forEach(w=>w.classList.add("on"));paper.style.opacity=1;return}
  const S=st.getBoundingClientRect(),W=S.width,H=S.height;
  const me=new Cur(ov,"#2b44a6","나",W+40,H*.6),dr=new Cur(ov,"#6b6a64","초안",-60,H*.8);
  try{
    // 머리글은 내 커서가 긋고, 종이를 펼침
    const hd=async()=>{for(const el of $$("[data-b]")){if(!el.offsetParent){el.style.opacity=1;continue}const b=(await me.goEl(st,el,.15,.6,el.tagName==="H1"?480:200),null);el.style.opacity=1;if(el.dataset.b==="type")await typeEl(st,el,me,9);if(b)setTimeout(()=>fadeBox(b),300)}};
    await hd();
    const done=[];
    for(let k=0;k<WK.length;k++){
      const w=WK[k];paint(w);
      // 종이를 펼치고 초안 커서가 빠르게 초안을 쳐 넣음
      paper.style.transition="none";paper.style.opacity=0;void paper.offsetWidth;
      if(k===0){const b=await drawBox(st,ov,me,paper,me.c,560);paper.style.transition="opacity .5s";paper.style.opacity=1;setTimeout(()=>fadeBox(b),350)}
      else{paper.style.transition="opacity .6s";paper.style.opacity=1;await me.go(W*.75,H*.5,350)}
      for(let i=0;i<3;i++){await dr.goEl(st,L(i),.1,.5,220);dr.el.classList.add("follow");await reveal($(".tx",L(i)),dr,20);dr.el.classList.remove("follow")}
      dr.go(-60,H*.85,600).catch(()=>{});
      await edit(me,0);await edit(me,2);
      await sleep(120);
      done.push(await fly(k,w));
      if(k<WK.length-1){await me.go(W*.7,H*.5,350)}
    }
    // 마지막 장에 PDF 도장
    const top=done[done.length-1],r=rel(st,top);await me.go(r.x+r.w*.7,r.y+r.h*.4,700);me.click();
    stamp.style.left=(top.offsetLeft+top.offsetWidth*.5)+"px";stamp.style.right="auto";stamp.classList.add("on");
    await sleep(300);
    // 쌓인 종이 더미가 가운데로 올라와 PDF 묶음으로 보임
    const R=rel(st,$(".r")),P=rel(st,pile),sc=innerWidth<820?1:Math.min(2,R.w/P.w*.85);
    pile.style.transformOrigin="0 100%";pile.style.transition="transform 1.1s cubic-bezier(.6,0,.2,1)";
    pile.style.transform=`translate(${R.x+R.w/2-P.w*sc/2-P.x}px,${R.y+R.h/2+P.h*sc/2-(P.y+P.h)}px) scale(${sc})`;
    me.go(W+60,H*.6,900).catch(()=>{});await sleep(1000);
  }catch(e){if(e!==ABORT)throw e}
}
$("#again").onclick=build;
addEventListener("load",()=>setTimeout(build,350));
</script>
</body>
</html>
