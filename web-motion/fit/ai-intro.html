<style>

<div class="say on" data-a="0" data-b=".11"><small class="mono">AI INTRODUCTION</small><h1>인공지능<br>입문</h1></div>
<div class="say" data-a=".14" data-b=".28"><h2>점이 모여<br>게임 트리가 돼요</h2><p class="keep">MAX와 MIN이 번갈아 고르는 층.</p></div>
<div class="say" data-a=".31" data-b=".85"><small class="mono">알파-베타 가지치기</small><div class="ab"><span><i>α</i><b id="ra">−∞</b></span><span><i>β</i><b id="rb">+∞</b></span></div><div class="cutn mono" id="rc"></div></div>
<div class="say" data-a=".88" data-b="1.1"><h2>필요 없는 가지는<br>잘라 내요</h2><p class="keep" id="rs"></p></div>

<script type="module">
import * as THREE from "three";
const mob = innerWidth < 700, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ── 게임 트리: MAX(루트) → MIN 3 → MAX 9 → 리프 27. 알파-베타를 실제로 돌려 순서·가지치기를 얻는다
const LEAF = [3, 5, 2, 9, 1, 6, 4, 7, 8, 0, -2, 5, 8, 3, 9, 6, 2, 1, 7, 4, 3, 5, 8, 0, 2, 6, 9];
const kids = id => id === 0 ? [1, 2, 3] : id < 4 ? [0, 1, 2].map(c => 4 + (id - 1) * 3 + c) : id < 13 ? [0, 1, 2].map(c => 13 + (id - 4) * 3 + c) : [];
const level = id => id === 0 ? 0 : id < 4 ? 1 : id < 13 ? 2 : 3;
const NN = 40, pos = Array.from({ length: NN }, () => [0, 0]);
{ let x = 0; for (let i = 0; i < 27; i++) { if (i && i % 9 === 0) x += 2.6; else if (i && i % 3 === 0) x += 1.2; pos[13 + i] = [x, 0]; x += 1.05; }
  const off = x / 2 - .5; for (let i = 0; i < 27; i++) pos[13 + i][0] -= off;
  for (let id = 12; id >= 0; id--) pos[id][0] = kids(id).reduce((s, c) => s + pos[c][0], 0) / 3; }
const LY = [7.6, 2.6, -2.6, -7.6]; pos.forEach((p, id) => p[1] = LY[level(id)]);
const parent = id => id === 0 ? -1 : id < 4 ? 0 : id < 13 ? 1 + Math.floor((id - 4) / 3) : 4 + Math.floor((id - 13) / 3);
const steps = [], litAt = new Array(NN).fill(1e9), cutAt = new Array(NN).fill(1e9), doneAt = new Array(NN).fill(1e9), val = new Array(NN).fill(null);
function rec(id, a, b) {
  litAt[id] = Math.min(litAt[id], steps.length); steps.push({ n: id, a, b });
  if (level(id) === 3) { val[id] = LEAF[id - 13]; doneAt[id] = steps.length; steps.push({ n: id, a, b, done: 1 }); return val[id]; }
  const mx = level(id) % 2 === 0; let v = mx ? -Infinity : Infinity; const ch = kids(id);
  for (let c = 0; c < 3; c++) {
    const r = rec(ch[c], a, b); if (mx) { v = Math.max(v, r); a = Math.max(a, v); } else { v = Math.min(v, r); b = Math.min(b, v); }
    steps.push({ n: id, a, b });
    if (a >= b && c < 2) { const rest = ch.slice(c + 1); const st = { n: id, a, b, cut: rest }; steps.push(st); const mark = k => { cutAt[k] = steps.length - 1; kids(k).forEach(mark); }; rest.forEach(mark); break; }
  }
  val[id] = v; doneAt[id] = steps.length; steps.push({ n: id, a, b, done: 1 }); return v;
}
const rootVal = rec(0, -Infinity, Infinity);
const NS = steps.length, visitedLeaves = LEAF.filter((_, i) => litAt[13 + i] < 1e9).length;

// ── 점: 먼지(흩어진 상태) → 마디(노드) 뭉치와 가지(간선) 점선
const NP = mob ? 70 : 110, EP = mob ? 100 : 170, AP = mob ? 2600 : 4500, N = NN * NP + (NN - 1) * EP + AP;
const pos1 = new Float32Array(N * 3), pos0 = new Float32Array(N * 3), rnd = new Float32Array(N * 4), grp = new Float32Array(N), kind = new Float32Array(N);
let n = 0; const rr = () => Math.random();
const gal = () => { const a = rr() * 6.283, r = 6 + Math.pow(rr(), .7) * 28, h = (rr() - .5) * 8 * (1 - r / 40); return [Math.cos(a) * r, h + Math.sin(a * 2) * 1.5, Math.sin(a) * r * .55]; };
for (let id = 0; id < NN; id++) for (let k = 0; k < NP; k++, n++) {
  const lf = level(id) === 3, R = (lf ? .3 : .52) * Math.cbrt(rr()), u = rr() * 2 - 1, a = rr() * 6.283, s = Math.sqrt(1 - u * u);
  pos1.set([pos[id][0] + R * s * Math.cos(a), pos[id][1] + R * u, R * s * Math.sin(a)], n * 3); pos0.set(gal(), n * 3); grp[n] = id; kind[n] = 0;
}
for (let id = 1; id < NN; id++) for (let k = 0; k < EP; k++, n++) {
  const t = rr(), p = pos[parent(id)], c = pos[id]; const j = (rr() - .5) * .07;
  pos1.set([p[0] + (c[0] - p[0]) * t + j, p[1] + (c[1] - p[1]) * t + j, (rr() - .5) * .05], n * 3); pos0.set(gal(), n * 3); grp[n] = id; kind[n] = 1;
}
for (let k = 0; k < AP; k++, n++) { const g = gal(); pos0.set(g, n * 3); pos1.set([g[0] * .9 + (rr() - .5) * 8, g[1] * 1.6, (rr() - .5) * 10 - 2], n * 3); grp[n] = -1; kind[n] = 2; }
for (let i = 0; i < N * 4; i++) rnd[i] = rr();
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(pos1, 3)); geo.setAttribute("p0", new THREE.BufferAttribute(pos0, 3)); geo.setAttribute("rnd", new THREE.BufferAttribute(rnd, 4));
geo.setAttribute("grp", new THREE.BufferAttribute(grp, 1)); geo.setAttribute("kind", new THREE.BufferAttribute(kind, 1));
const PR = Math.min(devicePixelRatio, 2);
const U = { e: { value: 0 }, time: { value: 0 }, scanX: { value: -99 }, scanOn: { value: 0 }, px: { value: PR }, lit: { value: new Float32Array(NN) }, cut: { value: new Float32Array(NN) }, dim: { value: mob ? 1.5 : 1 } };
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: U,
  vertexShader: `attribute vec3 p0; attribute vec4 rnd; attribute float grp; attribute float kind;
    uniform float e, time, scanX, scanOn, px, dim; uniform float lit[40]; uniform float cut[40]; varying vec3 vC; varying float vA;
    void main(){
      float k = clamp(e * 1.7 - rnd.x * .7, 0., 1.); k = k * k * (3. - 2. * k);
      float w = time * .12 * (.4 + rnd.y); float cs = cos(w), sn = sin(w);
      vec3 q0 = vec3(p0.x * cs - p0.z * sn, p0.y, p0.x * sn + p0.z * cs);
      vec3 p = mix(q0, position, k);
      p += (rnd.yzw - .5) * (.12 + (1. - k) * .5) * sin(time * 1.3 + rnd.x * 40.);
      int gi = int(max(grp, 0.) + .5); float L = grp >= 0. ? lit[gi] : 0.; float C = grp >= 0. ? cut[gi] : 0.;
      p += normalize(vec3(rnd.y - .5, rnd.z - .75, rnd.w - .5)) * C * (1.2 + rnd.x * 3.2); p.y -= C * C * 5. * (.4 + rnd.x);
      float sc = scanOn * exp(-pow((p.x - scanX) / 1.1, 2.));
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_PointSize = (1.3 + rnd.z * 1.5) * px * (46. / -mv.z) * (1. + L * .45 + sc * .5) * (kind > 1.5 ? .8 : 1.) * dim;
      gl_Position = projectionMatrix * mv;
      vec3 base = kind > 1.5 ? vec3(.55, .62, .85) : vec3(.92, .9, .86);
      vec3 col = mix(base, vec3(1., .72, .42), clamp(L * (kind > .5 ? .8 : 1.) + sc * .8, 0., 1.));
      col = mix(col, vec3(.85, .41, .31), clamp(C * 3., 0., 1.));
      vC = col;
      float a = kind > 1.5 ? .5 : (kind > .5 ? .5 : .75);
      vA = (a + L * .3 + sc * .45) * (1. - C * .7) * (kind > 1.5 ? 1. : .35 + .65 * k);
    }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(vC, vA * smoothstep(.5, .08, d)); }`
});
const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("cv"), antialias: false });
renderer.setPixelRatio(PR);
const scene = new THREE.Scene(); scene.background = new THREE.Color("#0a0c12");
const camera = new THREE.PerspectiveCamera(48, 1, .1, 300);
const G = new THREE.Group(); G.add(pts); scene.add(G); if (mob) G.rotation.z = Math.PI / 2;
// 탐색하는 빛(점 하나의 빛번짐)과 세로 스캔선
const glowTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, "rgba(255,226,170,1)"); r.addColorStop(.2, "rgba(255,180,100,.55)"); r.addColorStop(1, "rgba(255,150,70,0)"); g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const beam = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); beam.scale.setScalar(4.2); G.add(beam);
const scanLine = new THREE.Mesh(new THREE.PlaneGeometry(.05, 24), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { o: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `uniform float o; varying vec2 vUv; void main(){ gl_FragColor = vec4(1., .7, .4, o * .5 * sin(vUv.y * 3.1416)); }` })); G.add(scanLine);

// 라벨: 값(리프·완성된 마디), 층 이름
const lbs = document.getElementById("lbs"), labels = [];
for (let id = 0; id < NN; id++) { const d = document.createElement("div"); d.className = "lb"; d.textContent = val[id]; lbs.append(d); labels.push(d); }
const rows = ["MAX", "MIN", "MAX", "리프"].map((t, i) => { const d = document.createElement("div"); d.className = "lb row"; d.textContent = t; lbs.append(d); return d; });
const resLb = document.createElement("div"); resLb.className = "lb res"; resLb.textContent = "= " + rootVal; lbs.append(resLb);

// ── 장면
const clamp01 = x => Math.min(1, Math.max(0, x)), sm = t => t * t * (3 - 2 * t), L = (a, b, t) => a + (b - a) * t, band = (a, b, p) => sm(clamp01((p - a) / (b - a)));
let target = 0, prog = 0, mx = 0, my = 0, mxs = 0, mys = 0;
const prg = () => clamp01(scrollY / (document.documentElement.scrollHeight - innerHeight));
addEventListener("scroll", () => target = prg(), { passive: true });
addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < 700 ? 52 : 48; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize(); target = prog = prg();

const says = [...document.querySelectorAll(".say")], bar = document.getElementById("bar"), ra = document.getElementById("ra"), rb = document.getElementById("rb"), rc = document.getElementById("rc");
document.getElementById("rs").textContent = `리프 27개 중 ${visitedLeaves}개만 보고도 루트 값 ${rootVal}.`;
const fmt = x => x === Infinity ? "+∞" : x === -Infinity ? "−∞" : (x < 0 ? "−" + -x : "" + x);
const clock = new THREE.Clock(), v = new THREE.Vector3(), lit = U.lit.value, cut = U.cut.value, litT = new Float32Array(NN), cutT = new Float32Array(NN);
let T = 0;
const proj = (x, y, z, el, ox = 0, oy = 0, opacity = 1) => { v.set(x + ox, y + oy, z); G.localToWorld(v); v.project(camera); el.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px, ${(-v.y * .5 + .5) * innerHeight}px) translate(-50%, -50%)`; el.style.opacity = v.z < 1 ? opacity : 0; };
renderer.setAnimationLoop(() => {
  const rd = Math.min(.3, clock.getDelta()); T += Math.min(.05, rd) * (calm ? .15 : 1);
  prog += (target - prog) * (1 - Math.exp(-rd * 4)); const p = prog;
  mxs += (mx - mxs) * .05; mys += (my - mys) * .05;
  U.e.value = band(.1, .26, p); U.time.value = T;
  const s = clamp01((p - .3) / .54) * (NS - 1), si = Math.min(NS - 2, Math.floor(s)), sf = s - si, A = steps[si], B = steps[si + 1];
  const searching = p > .29 && p < .87 ? band(.29, .32, p) * (1 - band(.84, .87, p)) : 0;
  // 빛 위치: 단계 사이를 이동
  const bx = L(pos[A.n][0], pos[B.n][0], sm(sf)), by = L(pos[A.n][1], pos[B.n][1], sm(sf));
  beam.position.set(bx, by, .2); beam.material.opacity = searching; scanLine.position.set(bx, 0, -.4); scanLine.material.uniforms.o.value = searching;
  U.scanX.value = bx; U.scanOn.value = searching * .9;
  // 마디 상태
  for (let id = 0; id < NN; id++) {
    litT[id] = s < litAt[id] ? 0 : s > doneAt[id] ? .42 : 1; cutT[id] = clamp01((s - cutAt[id]) / 2.4);
    if (p > .87) { litT[id] = litAt[id] < 1e9 ? .45 : 0; }
    lit[id] += (litT[id] - lit[id]) * Math.min(1, rd * 6); cut[id] += (cutT[id] - cut[id]) * Math.min(1, rd * 3);
  }
  // 글
  const cur = steps[si]; ra.textContent = fmt(cur.a); rb.textContent = fmt(cur.b);
  let cutN = 0; for (let i = 0; i <= si; i++) if (steps[i].cut) cutN += steps[i].cut.length; rc.textContent = cutN ? `잘라낸 가지 ${cutN}` : "";
  // 라벨
  const shown = band(.24, .3, p);
  for (let id = 0; id < NN; id++) { const lf = level(id) === 3, ok = s >= doneAt[id] - 1 && cut[id] < .05 && !(id === 0 && p > .87); proj(pos[id][0], pos[id][1], 0, labels[id], 0, lf ? -.95 : -1.15, ok ? shown : 0); }
  rows.forEach((d, i) => proj(21.5, LY[i], 0, d, 0, 0, shown * .9));
  proj(pos[0][0], pos[0][1], 0, resLb, 1.8, 0, band(.88, .92, p));
  says.forEach(q => q.classList.toggle("on", p >= +q.dataset.a && p < +q.dataset.b));
  // 카메라
  const D = mob ? 68 : L(40, 38, band(.05, .26, p)), az = mxs * .3 + Math.sin(T * .12) * .05;
  camera.position.set(Math.sin(az) * D, -mys * 3 + L(3, 0, band(.1, .26, p)), Math.cos(az) * D); camera.lookAt(0, mob ? 0 : -.5, 0);
  mob ? camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * .03, innerWidth, innerHeight) : camera.clearViewOffset();
  camera.updateProjectionMatrix();
  bar.style.width = p * 100 + "%";
  renderer.render(scene, camera);
});
