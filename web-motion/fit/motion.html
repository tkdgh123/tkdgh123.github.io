<!-- Claude가 만듦 (2026-11-06) — 강의 화면 열한 장이 고리로 돌고(캔 고리 70), 고른 강의 화면 속으로 스크롤해 내려가 장면 목록이 나옴(내려오기 30) -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>움직이는 그림으로 보는 강의</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
:root { --page: #0b0b0d; --ink: #f5f5f7; --mute: #a1a1a6; --acc: #2997ff; --m: clamp(16px, 3.2vw, 52px);
  --sans: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, "Pretendard Variable", monospace; color-scheme: dark }
* { box-sizing: border-box }
html, body { margin: 0; background: var(--page); color: var(--ink); font: 400 17px/1.6 var(--sans); word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: clip }
a { color: inherit }
.top { position: fixed; z-index: 20; inset: 0 0 auto; display: flex; justify-content: space-between; padding: 20px var(--m); font: 500 12.5px var(--mono); color: var(--mute) }
.top a { text-decoration: none } .top a:hover { color: var(--ink) }
#bg { position: fixed; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 46%, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%), var(--page); transition: background .9s }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab }
#gl.grab { cursor: grabbing }
.head { position: fixed; z-index: 5; left: var(--m); top: 74px; pointer-events: none }
.head h1 { margin: 0; font-size: clamp(26px, 3.2vw, 46px); font-weight: 700; letter-spacing: -.035em; line-height: 1.1 }
.head h1 span { color: var(--mute); font-weight: 300 }
.name { position: fixed; z-index: 5; left: 0; right: 0; bottom: clamp(26px, 6vh, 64px); text-align: center; pointer-events: none }
.name b { display: block; font-size: clamp(28px, 4vw, 58px); font-weight: 800; letter-spacing: -.04em; line-height: 1.1 }
.name span { font: 500 13px var(--mono); color: var(--mute); letter-spacing: .06em }
.arrow { position: fixed; z-index: 6; top: 50%; translate: 0 -50%; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .28); background: rgb(0 0 0 / .25); color: #fff; font-size: 20px; cursor: pointer; transition: border-color .2s, opacity .4s }
.arrow:hover { border-color: #fff } .prev { left: var(--m) } .next { right: var(--m) }
.ui { transition: opacity .35s }
/* 화면 속 */
.inside { position: fixed; z-index: 8; inset: 0; display: grid; align-content: center; padding: 90px var(--m) 40px; pointer-events: none; opacity: 0 }
.inside.on { pointer-events: auto }
.inside .no { font: 800 clamp(80px, 14vw, 210px)/.8 var(--sans); letter-spacing: -.06em; color: var(--acc) }
.inside h2 { margin: 18px 0 4px; font-size: clamp(30px, 4.4vw, 64px); font-weight: 800; letter-spacing: -.04em; line-height: 1.05 }
.inside .en { font: 500 13px var(--mono); color: var(--mute); letter-spacing: .06em }
.inside ol { margin: clamp(22px, 4vh, 44px) 0 0; padding: 0; list-style: none; columns: 2; column-gap: clamp(24px, 4vw, 64px); max-width: 980px }
.inside li { display: flex; gap: 14px; padding: 9px 0; break-inside: avoid; font-size: clamp(16px, 1.4vw, 20px); opacity: 0; translate: 0 14px; transition: opacity .5s, translate .6s cubic-bezier(.2, .8, .2, 1) }
.inside li.in { opacity: 1; translate: 0 0 }
.inside li i { font: 500 13px/2.1 var(--mono); font-style: normal; color: var(--acc); min-width: 2ch }
.inside .play { display: inline-flex; align-items: center; gap: 10px; margin-top: clamp(24px, 4vh, 40px); min-height: 50px; padding: 0 24px; border-radius: 999px; background: var(--acc); color: #000; font-weight: 700; text-decoration: none; justify-self: start; transition: transform .15s }
.inside .play:hover { transform: scale(1.03) }
.spacer { height: 330vh }
@media (max-width: 700px) {
  .arrow { top: auto; bottom: 110px; translate: none; width: 46px; height: 46px }
  .inside ol { columns: 1 } .inside li { padding: 6px 0 }
}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="gl" aria-label="강의 화면 열한 장이 고리 모양으로 도는 화면"></canvas>
<nav class="top"><a href="./index.html">← 카드별 어울림</a><a href="../../motion/index.html">작품 보기 →</a></nav>
<header class="head ui"><h1>움직이는 그림으로<br><span>보는 강의</span></h1></header>
<p class="name ui"><b id="nm">프로그램 작성 과정</b><span id="sub">C 02 · 01 / 11</span></p>
<button class="arrow prev ui" type="button" aria-label="이전 강의">←</button>
<button class="arrow next ui" type="button" aria-label="다음 강의">→</button>
<section class="inside" id="inside" aria-live="polite">
  <div class="no" id="iNo">02</div>
  <h2 id="iT">프로그램 작성 과정</h2>
  <p class="en" id="iEn"></p>
  <ol id="iList"></ol>
  <a class="play" id="iGo" href="../../motion/index.html">▶ 강의 보기</a>
</section>
<div class="spacer"></div>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// 실제 강의 목록 (motion/engine.js 장 이름·색, scenes.js 장면 이름)
const C = "../../motion/index.html";
const L = [
  ["02", "프로그램 작성 과정", "From source code to .exe", "#2997ff", C, ["Hello World 해부", "printf와 줄바꿈", "형식 지정자 %d", "문자와 아스키 코드"]],
  ["03", "C 프로그램 구성요소", "Comments · Variables · I/O", "#30d5c8", C, ["주석과 변수", "사칙연산 전체 코드", "입력받아 더하기", "원의 면적 (float)", "환율 계산 (double)"]],
  ["04", "변수와 자료형", "Types, sizes & overflow", "#bf5af2", C, ["sizeof로 크기 확인", "오버플로우 실험", "8진 · 16진 상수", "기호 상수", "char에 산술 연산", "빛의 도달 시간"]],
  ["05", "수식과 연산자", "Operators & expressions", "#ff9f0a", C, ["정수 사칙연산", "초를 분과 초로", "전위 vs 후위 ++", "거스름돈 계산", "윤년 판별", "조건 연산자 ?:", "XOR 암호화", "형변환", "화씨 → 섭씨 버그"]],
  ["06", "조건문", "if · else · switch", "#ff375f", C, ["양수 판별", "홀수 / 짝수", "학점 결정", "else의 짝", "이차방정식", "달의 일수", "계산기", "올바른 삼각형"]],
  ["07", "반복문", "while · for · break", "#30d158", C, ["왜 반복문인가", "1부터 n까지의 합", "센티널로 평균 구하기", "최대공약수", "do-while", "팩토리얼", "직각삼각형 별", "break", "continue", "복리 이자표"]],
  ["08", "함수", "Define · call · return", "#ffd60a", C, ["별 출력 함수", "max — 반환값", "get_integer + add", "함수 원형", "온도 변환기", "동전 던지기", "나무 높이 측정"]],
  ["09", "함수와 변수", "Scope · static · recursion", "#64d2ff", C, ["블록과 지역 변수", "값에 의한 전달", "전역 변수", "static 지역 변수", "재귀 팩토리얼", "재귀로 2진수", "재귀 최대공약수", "하노이의 탑"]],
  ["AI 3", "탐색", "Search · BFS · UCS · IDS", "#5e5ce6", "../../ai-motion/index.html", ["문제 정의 5요소", "그래프 → 트리", "트리 탐색 알고리즘", "BFS 의사코드", "EXPAND — 자식 만들기", "UCS = 최선 우선 탐색", "깊이 제한 · IDS"]],
  ["AI 5", "제약 충족 문제", "CSP = (X, D, C)", "#ff6b3d", "../../ai-motion5/index.html", ["계획 vs 식별", "블랙박스 vs 분해형 상태", "CSP = (X, D, C)", "변수 7개 · 도메인 3색", "인접 = 다른 색", "해 확인하기"]],
  ["Hanoi", "하노이의 탑", "Recursion trace", "#e3a6ff", "../../hanoi/index.html", ["하노이의 탑", "실행 추적"]],
];
const N = L.length, step = Math.PI * 2 / N;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
await document.fonts.load("800 120px 'Pretendard Variable'").catch(() => {});

const cv = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, .05, 80);

// 화면 한 장 = 둥근 검은 몸체 + 앞면 그림(캔버스)
const TW = 1024, TH = 620, PW = 1.9, PH = PW * TH / TW;
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function paint(p, t, live) {
  const [no, title, en, acc, , scenes] = L[p.i], g = p.g;
  g.clearRect(0, 0, TW, TH);
  g.save(); rr(g, 0, 0, TW, TH, 34); g.clip();
  g.fillStyle = "#0d0d10"; g.fillRect(0, 0, TW, TH);
  const gr = g.createRadialGradient(TW * .78, TH * .2, 0, TW * .78, TH * .2, TW * .8);
  gr.addColorStop(0, acc + "66"); gr.addColorStop(1, "#0d0d1000"); g.fillStyle = gr; g.fillRect(0, 0, TW, TH);
  // 장면 미리보기: 앞 화면만 장면 이름이 돌아가며 재생
  const k = live ? t / 1.7 : 0, si = Math.floor(k) % scenes.length, f = k - Math.floor(k);
  g.fillStyle = acc; g.font = "800 190px 'Pretendard Variable'"; g.textBaseline = "alphabetic";
  g.fillText(no, 56, 250);
  g.fillStyle = "#f5f5f7"; g.font = "800 66px 'Pretendard Variable'"; g.fillText(title, 60, 352);
  g.fillStyle = "#a1a1a6"; g.font = "500 26px Consolas, monospace"; g.fillText(en, 62, 398);
  // 지금 장면
  const a = live ? Math.min(1, f * 6, (1 - f) * 6) : .55;
  g.globalAlpha = a; g.fillStyle = "#f5f5f7"; g.font = "600 34px 'Pretendard Variable'";
  g.fillText((live ? "▶  " : "") + scenes[si], 60, 508 + (live ? (1 - Math.min(1, f * 6)) * 14 : 0));
  g.globalAlpha = 1;
  // 진행 막대
  g.fillStyle = "#ffffff22"; g.fillRect(60, 552, TW - 120, 6);
  g.fillStyle = acc; g.fillRect(60, 552, (TW - 120) * (live ? ((si + f) / scenes.length) : 0), 6);
  g.restore();
  p.tex.needsUpdate = true;
}
const ring = new THREE.Group(); scene.add(ring);
const R = 4.3;
const bodyG = new RoundedBoxGeometry(PW + .12, PH + .12, .1, 4, .07), faceG = new THREE.PlaneGeometry(PW, PH);
const bodyM = new THREE.MeshStandardMaterial({ color: "#1b1b20", metalness: .9, roughness: .25 });
const P = L.map((_, i) => {
  const k = document.createElement("canvas"); k.width = TW; k.height = TH;
  const tex = new THREE.CanvasTexture(k); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const grp = new THREE.Group(), a = i * step;
  grp.add(new THREE.Mesh(bodyG, bodyM));
  const face = new THREE.Mesh(faceG, new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
  face.position.z = .052; grp.add(face);
  grp.position.set(Math.sin(a) * R, 0, Math.cos(a) * R); grp.rotation.y = a;
  ring.add(grp);
  const p = { i, g: k.getContext("2d"), tex, grp, a, bob: i * 1.7, s: 1, live: false };
  paint(p, 0, false); return p;
});
// 바닥 빛 웅덩이
const pool = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: .05 }));
pool.rotation.x = -Math.PI / 2; pool.position.y = -1.25; scene.add(pool);

// 고르기
const $ = id => document.getElementById(id);
const bgEl = $("bg"), ui = [...document.querySelectorAll(".ui")], inside = $("inside");
let sel = -1, angle = 0, target = 0, drag = null, dive = 0, diveS = 0;
function pick(i) {
  i = ((i % N) + N) % N; if (i === sel) return; sel = i;
  const [no, title, en, acc, href, scenes] = L[i];
  $("nm").textContent = title;
  $("sub").textContent = `${/^\d/.test(no) ? "C " + no : no} · ${String(i + 1).padStart(2, "0")} / ${N}`;
  document.documentElement.style.setProperty("--acc", acc);
  $("iNo").textContent = no; $("iT").textContent = title; $("iEn").textContent = en; $("iGo").href = href;
  $("iList").innerHTML = scenes.map((s, k) => `<li><i>${String(k + 1).padStart(2, "0")}</i>${s}</li>`).join("");
}
const go = d => { if (dive > .02) return; target -= d * step; pick(Math.round(-target / step)); };
document.querySelector(".prev").onclick = () => go(-1);
document.querySelector(".next").onclick = () => go(1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
cv.addEventListener("pointerdown", e => { if (dive > .02) return; drag = { x: e.clientX, t: target, v: 0, lx: e.clientX }; cv.classList.add("grab"); });
addEventListener("pointermove", e => { if (!drag) return; target = drag.t + (e.clientX - drag.x) / innerWidth * 4.2; drag.v = e.clientX - drag.lx; drag.lx = e.clientX; });
const end = () => { if (!drag) return; target += drag.v / innerWidth * 6; drag = null; cv.classList.remove("grab"); target = Math.round(target / step) * step; pick(Math.round(-target / step)); };
addEventListener("pointerup", end); addEventListener("pointercancel", end);

// 스크롤 = 고른 화면 속으로 내려가기
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const sm = (a, b, x) => Math.min(1, Math.max(0, (x - a) / (b - a)));
function onScroll() { const m = document.documentElement.scrollHeight - innerHeight; dive = m > 0 ? scrollY / m : 0; }
addEventListener("scroll", onScroll, { passive: true });

let mobile = false;
function resize() {
  const w = innerWidth, h = innerHeight; mobile = w < 700;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = mobile ? 48 : 30; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize(); onScroll(); pick(0);

const clock = new THREE.Clock(), v = new THREE.Vector3(), q = new THREE.Vector3(), base = new THREE.Vector3(), look = new THREE.Vector3();
let lastItems = -1;
function frame() {
  const t = clock.getElapsedTime();
  diveS += (dive - diveS) * .12;
  const d = ease(sm(.04, .62, diveS));
  angle += (target - angle) * (reduce ? .3 : .085);
  ring.rotation.y = angle;
  const front = ((Math.round(-target / step) % N) + N) % N;
  P.forEach(p => {
    const on = p.i === front;
    p.s += ((on ? 1.22 : .9) - p.s) * .1; p.grp.scale.setScalar(p.s);
    p.grp.position.y = on ? 0 : Math.sin(t * 1.1 + p.bob) * (reduce ? 0 : .06);
    p.grp.rotation.x = on ? 0 : Math.sin(t * .7 + p.bob) * .03;
    if (on || p.live) { paint(p, t, on); p.live = on; }
  });
  // 카메라: 기본 자리 → 앞 화면이 화면을 가득 채우는 자리
  base.set(0, mobile ? .45 : .7, mobile ? 10.9 : 12.6);
  const fp = P[front].grp; fp.getWorldPosition(v);
  q.set(0, 0, 1).applyQuaternion(fp.getWorldQuaternion(new THREE.Quaternion()));
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const fill = Math.max((PH * 1.22 / 2) / tv, (PW * 1.22 / 2) / (tv * camera.aspect)) * .9; // 화면 안에 꼭 맞게
  const end2 = v.clone().addScaledVector(q, fill);
  camera.position.lerpVectors(base, end2, d);
  look.lerpVectors(new THREE.Vector3(0, -.15, 0), v, Math.min(1, d * 1.6));
  camera.lookAt(look);
  ui.forEach(e => e.style.opacity = String(1 - sm(.0, .25, d)));
  const io = sm(.84, 1, d);
  inside.style.opacity = io; inside.classList.toggle("on", io > .5);
  cv.style.opacity = String(1 - sm(.86, .97, d));
  const items = io > 0 ? Math.floor(sm(.85, 1, d) * 12) : -1;
  if (items !== lastItems) { [...inside.querySelectorAll("li")].forEach((li, k) => li.classList.toggle("in", k < items)); lastItems = items; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
