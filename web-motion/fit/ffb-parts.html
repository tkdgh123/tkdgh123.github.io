<!-- Claude가 만듦 (2026-11-06) — 팀원 넷의 커서가 동시에 주차 표를 짓고, 끝난 주는 종이처럼 쌓인다 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>네 커서가 짓는 주차 표 · 카드별 어울림</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--paper:#f2f1ec;--tone:#e4e2da;--ink:#151514;--muted:#5a5954;--rule:#c9c6bc;--card:#fbfaf7;--blue:#2b44a6;--blue-soft:#d9ddf0;
 --sans:"Wanted Sans Variable","Wanted Sans","Pretendard Variable",system-ui,"Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--hud:var(--muted);--m:clamp(16px,3.4vw,56px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{position:fixed;z-index:70;inset:0 0 auto;display:flex;justify-content:space-between;gap:12px;padding:16px clamp(16px,3.2vw,52px);font:500 12px/1 var(--mono);letter-spacing:.02em;pointer-events:none;word-spacing:-.25em}
.top a{pointer-events:auto;text-decoration:none;color:var(--hud,currentColor);padding:6px 0}
.top a:hover{text-decoration:underline;text-underline-offset:4px}
.stage{position:fixed;inset:0;overflow:hidden}
.ov{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.box{position:absolute;border:1.5px solid var(--bc);background:color-mix(in srgb,var(--bc) 9%,transparent);transition:opacity .5s}
.box::before,.box::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--bc)}
.box::before{left:-4.5px;top:-4.5px}.box::after{right:-4.5px;bottom:-4.5px}
.size{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:var(--bc);color:#fff;font:600 10.5px/1.4 var(--mono);padding:1px 6px;white-space:nowrap;border-radius:2px}
.cur{position:absolute;left:0;top:0;will-change:transform;transition:opacity .4s}
.cur.follow{transition:opacity .4s,transform .13s linear}
.cur svg{display:block;filter:drop-shadow(0 1px 2px rgb(0 0 0/.35))}
.cur span{position:absolute;left:13px;top:17px;background:var(--cc);color:#fff;font:600 11px/1 var(--sans);padding:4px 8px;border-radius:3px 9px 9px 9px;white-space:nowrap}
.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid var(--cc);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
.tc{opacity:0;font-style:normal;font-variant-ligatures:none}.tc.on{opacity:1}
.tc.last{position:relative}
.tc.last::after{content:"";position:absolute;left:100%;top:.08em;bottom:.04em;width:2px;background:var(--cc,currentColor);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pop{transition:opacity .55s,transform .7s cubic-bezier(.2,.8,.2,1)}
.pop.pre{opacity:0;transform:translateY(10px) scale(.985)}

.page{position:absolute;inset:0;padding:60px var(--m) 28px;display:grid;grid-template-columns:minmax(0,1fr) clamp(190px,19vw,300px);column-gap:clamp(24px,4vw,72px)}
.main{display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,34px);min-width:0}
.eyebrow{font:500 12.5px var(--mono);color:var(--muted)}
h1{margin:6px 0 0;font:300 clamp(40px,5.4vw,90px)/1 var(--sans);letter-spacing:-.045em}
h1 b{font-weight:750}
.tbl{display:grid;gap:clamp(6px,1vh,10px)}
.th,.tr{display:grid;grid-template-columns:clamp(84px,9vw,128px) repeat(4,minmax(0,1fr));column-gap:clamp(6px,.9vw,14px);align-items:stretch}
.ph{display:flex;align-items:baseline;gap:8px;padding:0 4px 8px;border-bottom:2px solid var(--pc);font-weight:700;font-size:clamp(14px,1.2vw,18px)}
.ph small{font:500 11.5px var(--mono);color:var(--muted);font-weight:400}
.wk{display:flex;flex-direction:column;justify-content:center;font:400 clamp(12px,1vw,14px)/1.25 var(--mono);color:var(--muted)}
.wk b{font:750 clamp(22px,2.3vw,36px)/1 var(--sans);color:var(--ink);letter-spacing:-.04em}.wk b i{font:400 13px var(--mono);font-style:normal;margin-left:2px;color:var(--muted)}
.cl{padding:clamp(8px,1.4vh,14px) clamp(8px,.9vw,14px);border-radius:8px;background:color-mix(in srgb,var(--pc) 10%,var(--paper));font-weight:500;font-size:clamp(12.5px,1.12vw,16px);line-height:1.35;min-height:clamp(46px,8.4vh,76px);display:flex;align-items:center;transition:opacity .5s,background-color .5s}
.cl .tc{font-style:normal}
.tr.done .cl{filter:saturate(.3);color:var(--muted)}
.sheet span{transition:opacity .4s}.sheet.old span{opacity:0}
.tr.done .wk b{color:var(--blue)}
.side{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:clamp(20px,4vh,44px);min-width:0;padding-bottom:6px}
.cnt{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cnt b{font:200 clamp(88px,10vw,168px)/.85 var(--sans);letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.cnt span{font:300 clamp(24px,2.4vw,40px) var(--sans);color:var(--muted)}
.cnt small{flex-basis:100%;font:500 12.5px var(--mono);color:var(--muted);margin-top:8px}
.stack{position:relative;width:100%;height:clamp(200px,30vh,270px)}
.sheet{position:absolute;left:0;right:0;height:clamp(78px,11vh,100px);background:var(--card);border-radius:3px;padding:10px 14px;box-shadow:0 1px 0 rgb(0 0 0/.08),0 10px 22px -10px rgb(21 21 20/.35);font:400 12px/1.35 var(--mono);color:var(--muted);will-change:transform}
.sheet b{display:block;font:750 clamp(15px,1.3vw,19px)/1.2 var(--sans);color:var(--blue);letter-spacing:-.02em}
.again{position:fixed;z-index:70;left:var(--m);bottom:8px;font:500 12px var(--mono);color:var(--muted);background:none;border:0;padding:8px 0;cursor:pointer}
.again:hover{color:var(--ink)}
@media (max-width:820px){
 .page{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;align-content:center;padding-top:54px;row-gap:14px}
 .main{gap:12px}h1{font-size:40px}
 .th,.tr{grid-template-columns:36px repeat(4,minmax(0,1fr));column-gap:5px}
 .ph{flex-direction:column;gap:0;font-size:12.5px;padding-bottom:5px}.ph small{font-size:10px}
 .wk{font-size:0}.wk b{font-size:20px}.wk b i{display:none}.wk small{display:none}
 .cl{font-size:11.5px;padding:7px 6px;min-height:54px;line-height:1.3}
 .side{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:14px}
 .cnt b{font-size:72px}.cnt span{font-size:22px}.cnt small{display:none}
 .stack{width:58%;height:176px}.sheet{height:68px;padding:7px 10px;font-size:10.5px}
}
</style>
</head>
<body>
<nav class="top"><a href="./index.html">← 카드별 어울림</a><a href="../../ffb-wheel/parts/">작품 보기 →</a></nav>
<div class="stage" id="st">
 <div class="page">
  <section class="main">
   <header><p class="eyebrow" data-b data-p="0">레이싱 휠 · 10~14주차</p><h1 data-b="type" data-p="0">주차별 <b>파트 분배</b></h1></header>
   <div class="tbl" id="tbl"></div>
  </section>
  <aside class="side"><div class="cnt" data-b data-p="3"><b id="n">0</b><span>/ 5</span><small>끝난 주</small></div><div class="stack" id="stack"></div></aside>
 </div>
 <div class="ov" id="ov"></div>
</div>
<button class="again" id="again" type="button">↻ 다시 짓기</button>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let G=0;const ABORT={};
const sleep=ms=>{const g=G;return new Promise((ok,no)=>setTimeout(()=>G===g?ok():no(ABORT),ms))};
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
const tween=(ms,fn,e=ease)=>{const g=G;return new Promise((ok,no)=>{const t0=performance.now();const f=n=>{if(G!==g)return no(ABORT);const t=Math.min(1,(n-t0)/ms);fn(e(t),t);t<1?requestAnimationFrame(f):ok()};requestAnimationFrame(f)})};
const arrow=c=>`<svg width="18" height="20" viewBox="0 0 18 20"><path d="M1 1l15 7.5-6.5 1.8L6.8 17z" fill="${c}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const rel=(st,el)=>{const r=el.getBoundingClientRect(),s=st.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}};
class Cur{
  constructor(ov,c,n,x,y){this.ov=ov;this.c=c;this.x=x;this.y=y;const d=this.el=document.createElement("div");d.className="cur";d.style.setProperty("--cc",c);d.innerHTML=arrow(c)+`<span>${n}</span>`;ov.append(d);this.place()}
  place(){this.el.style.transform=`translate(${this.x}px,${this.y}px)`}
  go(x,y,ms=700,arc=60){const a=[this.x,this.y],dx=x-a[0],dy=y-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,s=arc*Math.min(1,L/420)*(Math.random()<.5?-1:1);return tween(ms,t=>{const b=Math.sin(Math.PI*t)*s;this.x=a[0]+dx*t+nx*b;this.y=a[1]+dy*t+ny*b;this.place()})}
  click(){const r=document.createElement("i");r.className="rip";r.style.cssText=`left:${this.x}px;top:${this.y}px;--cc:${this.c}`;this.ov.append(r);setTimeout(()=>r.remove(),700)}
  goEl(st,el,ox=.5,oy=.5,ms=700){const r=rel(st,el);return this.go(r.x+r.w*ox,r.y+r.h*oy,ms)}
}
// 칸을 끌어 긋기: 커서가 왼쪽 위로 가서 오른쪽 아래까지 끌며 크기 표시가 올라감
async function drawBox(st,ov,cur,el,color,ms=560){
  const r=rel(st,el);await cur.go(r.x,r.y,520+Math.random()*220);
  const b=document.createElement("div"),z=document.createElement("span");b.className="box";z.className="size";b.style.cssText=`--bc:${color};left:${r.x}px;top:${r.y}px;width:0;height:0`;b.append(z);ov.append(b);
  await Promise.all([tween(ms,t=>{b.style.width=r.w*t+"px";b.style.height=r.h*t+"px";z.textContent=`${Math.round(r.w*t)} × ${Math.round(r.h*t)}`}),cur.go(r.x+r.w,r.y+r.h,ms,30)]);
  cur.click();return b;
}
const fadeBox=b=>{b.style.opacity=0;setTimeout(()=>b.remove(),600)};
// 글자 한 자씩 감싸 둠 (자리는 그대로, 보이기만 바꿈)
function split(n){[...n.childNodes].forEach(c=>c.nodeType===3?c.replaceWith(...[...c.textContent].map(ch=>Object.assign(document.createElement("i"),{className:"tc",textContent:ch}))):split(c))}
async function typeEl(st,el,cur,ms=32){
  const cs=$$(".tc",el);el.style.opacity=1;let last=null;if(cur)cur.el.classList.add("follow");
  for(let i=0;i<cs.length;i++){
    if(last)last.classList.remove("last");const c=cs[i];c.classList.add("on","last");last=c;if(cur)c.style.setProperty("--cc",cur.c);
    if(cur&&(i%3===0||i===cs.length-1)){const r=rel(st,c);cur.x=r.x+r.w+3;cur.y=r.y+r.h*.55;cur.place()}
    const t=c.textContent;await sleep(t==="\n"?ms*5:t===" "?ms*.5:ms*(.7+Math.random()*.7));
  }
  if(last)setTimeout(()=>last.classList.remove("last"),900);
  if(cur)cur.el.classList.remove("follow");
}
const showTyped=el=>{$$(".tc",el).forEach(c=>c.classList.add("on"));el.style.opacity=1};
const popIn=el=>el.classList.remove("pre");

const st=$("#st"),ov=$("#ov"),tbl=$("#tbl"),stack=$("#stack");
const P=[["#2b44a6","김○영","기구"],["#b4440f","최○호","HW"],["#0f766e","황○웅","SW"],["#7a3fc0","김창식","기획/테스트"]];
const W=[
 ["10","11.3–11.9","페달 수치와 나무 자르기",["페달 수치 확정","센서 자리 수치","밟는 각도 수치","수치 표 정리"]],
 ["11","11.10–11.16","페달 완성",["페달 조립","센서 장착","센서 범위 방식","페달 시험 표"]],
 ["12","11.17–11.23","휠 베이스와 조향 센서",["휠 베이스 조립","조향 센서 배선","조향 각도 읽기","페달 예외 시험"]],
 ["13","11.24–11.30","모터와 힘",["모터·벨트 장착","24V 전원 연결","시리얼 프레임","안전 시험"]],
 ["14","12.1–12.7","합치기와 전시 준비",["보강·전시 배치","최종 회로도","버그 고치기","전체 시나리오 시험"]]];
tbl.innerHTML=`<div class="th"><span></span>${P.map((p,i)=>`<div class="ph" data-b data-p="${i}" style="--pc:${p[0]}"><b>${p[1]}</b><small>${p[2]}</small></div>`).join("")}</div>`+
 W.map((w,r)=>`<div class="tr" data-r="${r}"><div class="wk" data-b data-p="3"><b>${w[0]}<i>주차</i></b><small>${w[1]}</small></div>${w[3].map((t,i)=>`<div class="cl" data-b="type" data-p="${i}" style="--pc:${P[i][0]}"><span>${t}</span></div>`).join("")}</div>`).join("");
const items=$$("[data-b]");
items.forEach(el=>el.dataset.b==="type"&&split(el));
const rotJ=[-1.4,1.1,-.7,1.6,-1.1],xJ=[2,-5,4,-3,3];
async function build(){
  ++G;
  $$(".cur,.box,.rip",ov).forEach(e=>e.remove());stack.innerHTML="";$("#n").textContent=0;$$(".tr").forEach(t=>t.classList.remove("done"));
  items.forEach(el=>{el.style.opacity=0;el.style.transition="opacity .55s"});$$(".tc").forEach(c=>c.classList.remove("on","last"));
  if(calm){items.forEach(el=>el.style.opacity=1);$$(".tc").forEach(c=>c.classList.add("on"));$("#n").textContent=5;return}
  const S=st.getBoundingClientRect(),Wd=S.width,H=S.height;
  const curs=P.map(([c,n],i)=>new Cur(ov,c,n,[-60,Wd+30,-60,Wd+30][i],[H*.2,H*.12,H*.9,H*.8][i]));
  const rowDone=W.map(()=>[]);let finished=0;
  const reveal=async(cur,el)=>{const b=await drawBox(st,ov,cur,el,cur.c,el.dataset.b==="type"&&el.matches(".cl")?420:560);el.style.opacity=1;if(el.dataset.b==="type")await typeEl(st,el,cur,38);setTimeout(()=>fadeBox(b),350)};
  // 쌓이는 종이: 끝난 주 하나 = 종이 한 장
  const drop=async r=>{
    const row=$(`.tr[data-r='${r}']`),k=finished++;row.classList.add("done");
    const sh=document.createElement("div");sh.className="sheet";sh.innerHTML=`<b>${W[r][0]}주차</b><span>${W[r][2]}</span>`;[...stack.children].forEach(x=>x.classList.add("old"));
    const off=innerWidth<820?24:34;sh.style.cssText=`top:${k*off}px;z-index:${k+1};transform:rotate(${rotJ[k]}deg) translateX(${xJ[k]}px)`;stack.append(sh);
    const a=rel(st,row),b=rel(st,sh),dx=a.x+a.w*.2-b.x-b.w/2,dy=a.y+a.h/2-b.y-b.h/2;
    const fin=sh.style.transform;
    sh.animate([{transform:`translate(${dx}px,${dy}px) scale(.55) rotate(${-rotJ[k]*5}deg)`,opacity:0},{opacity:1,offset:.25},{transform:`translate(${dx*.25}px,${dy*.25-50}px) scale(.9) rotate(${rotJ[k]*3}deg)`,offset:.6},{transform:fin,opacity:1}],{duration:950,easing:"cubic-bezier(.3,.7,.2,1)",fill:"backwards"});
    await sleep(520);$("#n").textContent=finished;
  };
  try{
    const col=async i=>{
      const c=curs[i];await sleep(i*260);
      const els=$$(`[data-p='${i}']`);if(i===3)els.unshift(els.pop());
      for(const el of els){
        if(el.closest(".tr")&&!el.matches(".cl")&&i!==3)continue;
        await reveal(c,el);
        const r=el.closest(".tr");if(r&&el.matches(".cl")){const ri=+r.dataset.r;rowDone[ri].push(1);if(rowDone[ri].length===4)jobs.push(drop(ri))}
      }
    };
    const jobs=[];
    // 열마다 주인 커서. 김창식 커서는 주차 라벨과 끝난 주 숫자도 맡음
    const order=i=>$$(`[data-p='${i}']`);
    await Promise.all(curs.map((_,i)=>col(i)));
    await Promise.all(jobs);await sleep(700);
    curs.forEach((c,i)=>c.go([-70,Wd+50,-70,Wd+50][i],c.y+(i%2?60:-60),900).catch(()=>{}));
  }catch(e){if(e!==ABORT)throw e}
}
$("#again").onclick=build;
addEventListener("load",()=>setTimeout(build,350));
</script>
</body>
</html>
