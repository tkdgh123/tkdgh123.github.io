blk(168, "앞 베어링 블록", [0, 0, 80]); blk(36, "뒤 베어링 블록", [0, 0, -120]);

{ const r1 = 24, r2 = 9, phi = Math.acos((r1 - r2) / D), pts = [], N = 40;

{ const l = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints([[-260, -210, 0], [260, -210, 0], [260, 210, 0], [-260, 210, 0]].map(a => new THREE.Vector3(...a))), new THREE.LineBasicMaterial({ color: "#6f86f0" })); scan.add(l); }

const clamp01 = x => Math.min(1, Math.max(0, x)), sm = t => t * t * (3 - 2 * t), L = (a, b, t) => a + (b - a) * t;

  [0, .42, .5, 11, 1.8], [.15, 1.0, .38, 11.5, 1.8], [.34, -1.55, .12, 17, 2.2], [.62, -1.55, .12, 17, 2.2], [.78, -2.65, .4, 10.5, 1.6], [1, -3.5, .3, 10, 1.6]

let target = 0, prog = 0, mx = 0, my = 0, mxs = 0, mys = 0;

addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < 700 ? 40 : 28; camera.updateProjectionMatrix(); }

const says = [...document.querySelectorAll(".say")], bar = document.getElementById("bar"), root = document.documentElement.style;
const BG = [["#f2f1ec", "#151514", "#5a5954"], ["#151618", "#eeece6", "#9e9d97"]].map(a => a.map(c => new THREE.Color(c)));

  BG[0].forEach((c, i) => { col.copy(c).lerp(BG[1][i], dark); root.setProperty(["--bg", "--fg", "--soft"][i], "#" + col.getHexString()); });

  // 분해된 장면: 옆에서 본 도면 구도(+x 쪽에서). 아닐 땐 위 키 프레임의 방위

  const swing = Math.sin(T * .9) * 1.3 * band(.12, .2, p) * (1 - ex) + Math.sin(T * .35) * .25 * (1 - band(.1, .16, p));

    const colX = innerWidth * .64; let last = -1e9; svg.innerHTML = "";
    parts.filter(P => P.tag && P.vis).sort((a, b) => a.sy - b.sy).forEach(P => {
      const ly = Math.max(P.sy, last + 33); last = ly;
      P.tag.style.transform = `translate(${colX}px, ${ly - 9}px)`; P.tag.style.opacity = 1;
      svg.insertAdjacentHTML("beforeend", `<circle cx="${P.sx}" cy="${P.sy}" r="2.6" fill="#6f86f0"/><path d="M${P.sx} ${P.sy}L${colX - 6} ${ly}" stroke="#6f86f0" stroke-opacity=".55" stroke-width="1" fill="none"/>`);
    });
    parts.forEach(P => { if (P.tag && !P.vis) P.tag.style.opacity = 0; });
  }
  // 벨트: 두 풀리 사이를 도는 모습은 풀리 각도에 맞춰 약간 흔들 (재질 변화 없음)
  says.forEach(s => s.classList.toggle("on", p >= +s.dataset.a && p < +s.dataset.b));
  bar.style.width = p * 100 + "%";
  renderer.render(scene, camera);
});
</script>
</body>
</html>
