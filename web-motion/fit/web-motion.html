scene.add(sky);
{ const n = 900, pos = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) * .9 + .25; v.normalize().multiplyScalar(800); pos.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffe9d6, size: 1.4, sizeAttenuation: false, fog: false, transparent: true, opacity: .55 }))); }

  for (let y = 8; y < 1024; y += 22) for (let x = 6; x < 512; x += 18) { const on = Math.random() < .42; if (dark && !on) continue; g.fillStyle = dark ? `rgba(255,${200 + Math.random() * 40 | 0},150,${.5 + Math.random() * .5})` : on ? "#ffe2b8" : "#5a3f33"; g.fillRect(x, y, 8, 13); }

    c.fillStyle = "#f4e9dc"; c.textAlign = "center"; c.textBaseline = "middle"; c.font = `500 52px "IBM Plex Mono", monospace`; c.fillText(String(i + 1).padStart(2, "0"), W / 2, 52);
    let fs = 96; c.font = `300 ${fs}px Hahmlet, serif`; while (c.measureText(w.t).width > W - 40 && fs > 36) { fs -= 4; c.font = `300 ${fs}px Hahmlet, serif`; } c.fillText(w.t, W / 2, 170); }) }));

/* ───────── 스크롤 → 카메라 ───────── */
const INTRO = 1.4, PER = .75; // 화면 높이 단위: 처음 하늘 장면, 문 하나 지나는 데 드는 스크롤

addEventListener("resize", layout); layout();
$("rail").innerHTML = WORKS.map((w, i) => `<button type="button" aria-label="${i + 1}번 문 ${w.t}" data-i="${i}"></button>`).join("");
const railB = [...$("rail").children];

addEventListener("keydown", e => { if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); goDoor(Math.min(N - 1, Math.round(fNow) + 1)); } if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); goDoor(Math.max(0, Math.round(fNow) - 1)); } });

    railB.forEach((b, i) => b.classList.toggle("on", i === cur)); }
  stickman(f, k, now / 1000);
  renderer.render(scene, camera);
}

const man = new THREE.Group(); scene.add(man);
const BW = .085, bones = {};
for (const n of ["ua1", "fa1", "ua2", "fa2", "th1", "sh1", "th2", "sh2", "torso"]) { const m = new THREE.Mesh(capG, inkM); m.scale.set(n === "torso" ? BW * 1.25 : BW, 1, n === "torso" ? BW * 1.25 : BW); man.add(m); bones[n] = m; }
const head = new THREE.Mesh(ballG, inkM); head.scale.setScalar(.25); man.add(head);
const jointsM = [...Array(6)].map(() => { const j = new THREE.Mesh(ballG, inkM); j.scale.setScalar(BW); man.add(j); return j; });
const UP = new THREE.Vector3(0, 1, 0), tmp = new THREE.Vector3();
function bone(m, a, b) { tmp.subVectors(b, a); const l = tmp.length(); m.position.copy(a).addScaledVector(tmp, .5); m.scale.y = l; m.quaternion.setFromUnitVectors(UP, tmp.normalize()); }
function ik2(a, t, l1, l2, pole) { // a에서 t로, pole 쪽으로 굽음
  const d = Math.min(a.distanceTo(t), l1 + l2 - 1e-3), dir = t.clone().sub(a).normalize();
  const x = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  const p = pole.clone().sub(a); p.addScaledVector(dir, -p.dot(dir)).normalize();
  return a.clone().addScaledVector(dir, x).addScaledVector(p, h);
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
let manDoor = -1, hop = 0;
function stickman(f, k, t) {
  const i = Math.round(f), dr = doors[i];
  man.visible = k > .9;
  if (!dr) return;
  if (i !== manDoor) { if (manDoor >= 0) hop = 1; manDoor = i; }
  hop = Math.max(0, hop - .035);
  man.position.copy(dr.g.position); man.quaternion.copy(dr.g.quaternion);
  const o = dr.open, pull = Math.min(1, o * 1.6), wave = Math.max(0, (o - .75) / .25);
  // 문 기준 좌표(x 오른쪽, z 바깥): 처음엔 문 오른쪽, 당기며 뒤로 물러나고, 다 열리면 문 앞에서 비켜 서서 손짓
  const bx = 1.95 - pull * .55 - wave * .2, bz = .7 + pull * 1.2;
  const jump = Math.sin(hop * Math.PI) * 1.2, br = Math.sin(t * 2.2) * .02;
  const hip = V(bx, 1.05 + jump + br, bz), sh = V(bx - .05 - pull * .08, 1.95 + jump + br, bz + .03);
  bone(bones.torso, hip, sh); head.position.set(sh.x - .02, sh.y + .35, sh.z);
  // 다리: 발은 바닥(살짝 벌림), 당길 땐 뒷발 버팀
  const f1 = V(bx - .25 + pull * .1, jump * .3, bz - .15), f2 = V(bx + .2 + pull * .25, jump * .3, bz + .3 + pull * .2);
  const k1 = ik2(hip, f1, .55, .52, V(bx - 1, 1, bz + 1)), k2 = ik2(hip, f2, .55, .52, V(bx - 1, 1, bz + 1));
  bone(bones.th1, hip, k1); bone(bones.sh1, k1, f1); bone(bones.th2, hip, k2); bone(bones.sh2, k2, f2);
  // 손: 손잡이(문짝과 함께 돔) → 다 열리면 한 손은 문 안쪽을 가리킴
  man.updateMatrixWorld(); dr.knob.getWorldPosition(tmp); const knob = man.worldToLocal(tmp.clone());
  const rest = V(bx + .1, 1.2, bz + .25);
  const h1 = wave > 0 ? rest.clone().lerp(V(bx - .9, 2.35 + Math.sin(t * 5) * .08, bz - .2), wave) : rest.clone().lerp(knob, Math.min(1, .3 + pull * 1.4));
  const h2 = wave > 0 ? knob.clone().lerp(V(bx + .2, 1.15, bz + .1), wave) : V(bx + .25, 1.25 + br * 2, bz - .05).lerp(knob, pull * .6);
  const s1 = sh.clone().add(V(0, 0, .14)), s2 = sh.clone().add(V(0, 0, -.14));
  const e1 = ik2(s1, h1, .42, .4, V(bx + .6, 1, bz + .6)), e2 = ik2(s2, h2, .42, .4, V(bx + .6, 1, bz - .6));
  bone(bones.ua1, s1, e1); bone(bones.fa1, e1, h1); bone(bones.ua2, s2, e2); bone(bones.fa2, e2, h2);
  [hip, k1, k2, e1, e2, sh].forEach((p, j) => jointsM[j].position.copy(p));
}
requestAnimationFrame(frame);
