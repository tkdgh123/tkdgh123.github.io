  const over = new THREE.Vector3(mxs * 20, mob ? 190 : 118, mob ? 118 : 100 + mys * 10);

  const lk = new THREE.Vector3(pos.x + Math.sin(yaw) * 9 * (1 - dw), 1.5, pos.z + Math.cos(yaw) * 9 * (1 - dw)).lerp(new THREE.Vector3(-5, 0, 0), ov);
  if (!init) { camera.position.copy(camP); camL.copy(lk); init = true; }
  camera.position.lerp(camP, 1 - Math.exp(-rd * 4)); camL.lerp(lk, 1 - Math.exp(-rd * 6)); camera.lookAt(camL);
  if (!mob) camera.setViewOffset(innerWidth, innerHeight, ov > .5 ? -innerWidth * .08 * ov : 0, 0, innerWidth, innerHeight); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  sun.position.set(pos.x + 40, 60, pos.z + 30); sun.target.position.set(pos.x, 0, pos.z);
  clouds.forEach((c, i) => c.position.z += Math.sin(T * .1 + i) * .02);
  pins.forEach((P, i) => { P.g.position.y = Math.sin(T * 2 + i) * .4 + .1; P.g.rotation.y = T * .8;
    v.copy(P.g.position).add(tmp.set(0, 7.5, 0)).project(camera); P.e.style.transform = `translate(${(v.x * .5 + .5) * innerWidth}px, ${(-v.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`; P.e.style.opacity = v.z < 1 && (ov > .5 || dw > .2 && Math.abs(P.g.position.x - pos.x) < 12) ? 1 : 0; });
  says.forEach(s => s.classList.toggle("on", p >= +s.dataset.a && p < +s.dataset.b));
  cards.forEach(s => s.classList.toggle("on", p >= +s.dataset.a && p < +s.dataset.b));
  bar.style.width = p * 100 + "%";
  renderer.render(scene, camera);
});
</script>
