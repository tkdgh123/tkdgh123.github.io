<!-- Claude가 만듦 (2026-11-06) — 작품 고리(70) + 앞에 온 작품에만 떨어지는 조명(30), 담을 작품을 골라 오른쪽 위 칸에 모음 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포트폴리오 설계</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../apply/apply.css">
<style>
/* 캔 고리(데모 B)를 창업실 작품 26개로: 끌면 관성으로 돌다 스프링처럼 멈추고, 앞에 온 작품의 분류색으로 바탕이 바뀜 */
body { height: 100svh; overflow: hidden; background: #0e0e0f; color: #eeece6; --soft: #9e9d97; --hud: #eeece6 }
/* 바닥에 깔린 옅은 빛 */
/* 조명: 위에서 앞 작품으로 떨어지는 빛기둥 + 바닥 빛 웅덩이 */
:root { --w: clamp(250px, 30vw, 480px) }
.beam { position: fixed; z-index: 2; left: 50%; top: -6vh; width: calc(var(--w) * 1.5); height: calc(45vh + var(--w) * .42); translate: -50% 0; pointer-events: none; clip-path: polygon(41% 0, 59% 0, 100% 100%, 0 100%); background: linear-gradient(rgb(255 240 214 / .30), rgb(255 240 214 / .09) 70%, rgb(255 240 214 / 0)); filter: blur(10px); mix-blend-mode: screen; opacity: 0 }
.beam.on { animation: lamp .9s var(--ease) forwards }
@keyframes lamp { 0% { opacity: 0 } 14% { opacity: .9 } 22% { opacity: .2 } 34% { opacity: 1 } 100% { opacity: 1 } }
.pool { position: fixed; z-index: 0; left: 50%; top: calc(39% + var(--w) * .3); width: calc(var(--w) * 1.9); height: calc(var(--w) * .45); translate: -50% 0; border-radius: 50%; background: radial-gradient(closest-side, rgb(255 236 205 / .18), transparent); pointer-events: none }
#dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; mix-blend-mode: screen }
.pick { margin-top: 20px; margin-left: 8px; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 1.5px solid rgb(238 236 230 / .4); background: none; color: inherit; font: 600 15px var(--sans); cursor: pointer; vertical-align: top }
.pick:hover { border-color: #eeece6 }
.pick[aria-pressed="true"] { background: #f2e3c4; border-color: #f2e3c4; color: #151514 }
.txt .pick { transition: opacity .35s, transform .45s var(--ease), background .2s, color .2s }
.txt.out .pick { opacity: 0; transform: translateY(10px) }
/* 담은 작품 칸 */
.tray { position: fixed; z-index: 40; right: var(--m); top: 64px; display: flex; gap: 6px; align-items: center }
.tray .n { font: 500 12.5px var(--mono); color: var(--soft); margin-right: 6px }
.tray img { width: 54px; aspect-ratio: 16 / 10; object-fit: cover; display: block; box-shadow: 0 6px 14px -6px #000; animation: drop .5s var(--ease) }
@keyframes drop { from { transform: translateY(-24px) scale(1.3); opacity: 0 } }

.tabs { position: fixed; z-index: 40; top: 64px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; padding: 0 var(--m); overflow-x: auto; scrollbar-width: none }
.tabs button { flex: none; font: 600 15px var(--sans); color: inherit; background: none; border: 0; padding: 10px 14px; cursor: pointer; opacity: .55; transition: opacity .2s }
.tabs button i { font: normal 11px var(--mono); margin-left: 5px; opacity: .8 }
.tabs button:hover, .tabs button[aria-pressed="true"] { opacity: 1 }
.tabs button span { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1.5px no-repeat; padding-bottom: 6px; transition: background-size .4s var(--ease) }
.tabs button[aria-pressed="true"] span { background-size: 100% 1.5px }

.stage { position: fixed; inset: 0; z-index: 1; perspective: 1700px; perspective-origin: var(--po, 50% 40%); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; transition: opacity .2s }
.stage.drag { cursor: grabbing }
.stage.swap { opacity: 0 }
.ring { position: absolute; left: 50%; top: 39%; width: 0; height: 0; transform-style: preserve-3d }
.card { position: absolute; left: calc(var(--w) / -2); top: calc(var(--w) * -.3125); width: var(--w); aspect-ratio: 16 / 10; transform-style: preserve-3d; will-change: transform, opacity }
.face { position: absolute; inset: 0; display: block; overflow: hidden; background: #000; box-shadow: 0 34px 60px -34px rgb(0 0 0 / .6); transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .5s var(--ease); -webkit-user-drag: none }
.face img, .refl img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none }
.face::after { content: ""; position: absolute; inset: 0; background: #000; opacity: var(--dim, 0); pointer-events: none }
/* 앞 카드에만 마우스를 따라오는 빛 반사 */
.glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .35s; mix-blend-mode: screen; background: radial-gradient(38% 55% at var(--gx, 50%) var(--gy, 30%), rgb(255 255 255 / .2), rgb(255 255 255 / 0) 70%) }
.card.hot .glare { opacity: 1 }
/* 바닥 반사: 뒤집은 그림을 아래로 갈수록 사라지게 */
.refl { position: absolute; left: 0; right: 0; top: calc(100% + 8px); height: 28%; overflow: hidden; opacity: calc(.26 - var(--dim, 0) * .35); -webkit-mask-image: linear-gradient(#000, transparent 88%); mask-image: linear-gradient(#000, transparent 88%); pointer-events: none }
.refl img { position: absolute; left: 0; top: 0; height: calc(100% / .28); transform: scaleY(-1) }

.cap { position: fixed; z-index: 40; left: var(--m); right: var(--m); bottom: clamp(24px, 6vh, 64px); display: flex; justify-content: space-between; align-items: end; gap: 24px; pointer-events: none }
.cap > * { pointer-events: auto }
.cap .meta { color: var(--soft, var(--muted)); margin-bottom: 10px; transition: color .8s }
.cap h1 { font-size: clamp(34px, 5vw, 80px); max-width: 12em; overflow: hidden; padding-bottom: .08em }
.cap h1 span { display: inline-block }
.cap .s { margin-top: 10px; max-width: 36em; text-wrap: pretty; color: var(--soft, var(--muted)); transition: color .8s }
.cap .go { margin-top: 20px }
/* 글이 바뀔 때: 제목은 아래에서 솟고, 나머지는 살짝 늦게 */
.txt .meta, .txt .s, .txt .go { transition: opacity .35s, transform .45s var(--ease), color .8s }
.txt h1 span { transition: transform .55s var(--ease) }
.txt.out .meta, .txt.out .s, .txt.out .go { opacity: 0; transform: translateY(10px); transition-duration: .15s }
.txt.out h1 span { transform: translateY(110%); transition: transform .18s ease-in }
.txt:not(.out) .s { transition-delay: .08s } .txt:not(.out) .go { transition-delay: .14s }
body[data-c="프로젝트"] .go { background: #fff; color: var(--blue) }
body[data-c="프로젝트"] .go:hover { background: #e6e9f7 }
.ctl { display: flex; align-items: center; gap: 14px; flex: none }
.ctl .mono b { font-weight: 500; font-size: 15px }
.ctl button { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: inherit; font-size: 18px; cursor: pointer; opacity: .7; transition: opacity .2s, transform .15s }
.ctl button:hover { opacity: 1 } .ctl button:active { transform: scale(.94) }
@media (max-width: 700px) {
  .stage { perspective: 900px }
  .ring { top: 36% }
  :root { --w: 74vw } .tray { top: 50px } .tray img { width: 38px } .tray .n { display: none }
  .pick { margin-left: 0 }
  .cap { flex-direction: column; align-items: stretch; gap: 16px }
  .cap .s { font-size: 15px }
  .ctl { justify-content: space-between }
}
@media (prefers-reduced-motion: reduce) { body, .txt *, .face { transition: none !important } }
</style>
</head>
<body>
<nav class="top mono"><a href="./index.html">← 카드별 어울림</a><span class="right"><a href="../../career/portfolio.html">작품 보기 →</a></span></nav>
<div class="pool"></div>
<div class="tray" id="tray" aria-live="polite"></div>
<div class="stage" id="stage"><div class="ring" id="ring"></div></div>
<div class="beam" id="beam"></div><canvas id="dust"></canvas>
<div class="cap">
  <div class="txt out" id="txt"><p class="meta mono" id="meta"></p><h1><span id="ttl">&nbsp;</span></h1><p class="s" id="desc"></p><a class="go" id="open" href="#">열어 보기 →</a><button class="pick" id="pick" type="button" aria-pressed="false">＋ 담기</button></div>
  <div class="ctl"><button id="prev" type="button" aria-label="이전 작품">←</button><span class="mono" id="count"></span><button id="next" type="button" aria-label="다음 작품">→</button></div>
</div>

<script type="module">
import { WORKS } from "../apply/works.js";
const ROOT = "../../";
const $ = id => document.getElementById(id);
const stage = $("stage"), ring = $("ring"), calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CATS = ["전체", "게임", "공부", "프로젝트", "기타"];
let list = [], cards = [], pos = 0, vel = 0, target = 0, cur = -1, step = 32, wrap = false, born = 0;


function swap(cat) {
  if (calm || !cards.length) return build(cat);
  stage.classList.add("swap");
  setTimeout(() => { build(cat); stage.classList.remove("swap"); }, 200);
}
function build(cat) {
  list = cat === "전체" ? WORKS : WORKS.filter(w => w.cat === cat);
  // 9~12개는 한 바퀴 고리, 그보다 적거나 많으면 같은 휘어짐(32°)의 호로 두고 끝에서 멈춤
  wrap = list.length >= 9 && list.length <= 12; step = wrap ? 360 / list.length : 32;
  ring.innerHTML = list.map((w, i) => {
    const src = ROOT + w.img, lazy = i > 4 && i < list.length - 4 ? ' loading="lazy"' : "";
    return `<div class="card" data-i="${i}"><a class="face" href="${ROOT + w.href}" draggable="false"><img src="${src}" alt="${w.t}" draggable="false"${lazy}><i class="glare"></i></a><div class="refl" aria-hidden="true"><img src="${src}" alt=""${lazy}></div></div>`;
  }).join("");
  cards = [...ring.children];
  pos = target = vel = 0; cur = -1; born = performance.now();
}

// 앞에서 몇 칸 떨어졌는지(고리면 짧은 쪽으로)
const rel = i => { let r = i - pos; if (wrap) { const n = list.length; r = ((r % n) + n * 1.5) % n - n / 2; } return r; };
const lim = x => wrap ? x : Math.max(0, Math.min(list.length - 1, x));
const go = i => { target = lim(i); };
const ease = x => 1 - (1 - x) ** 3;

// 마우스 따라 고리 전체가 살짝 기욺
let tx = 0, ty = 0, sx = 0, sy = 0, hot = null;
addEventListener("pointermove", e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });

function frame(now) {
  if (!drag) {
    // 스프링: 목표 칸으로 끌려가며 흔들림 없이 멈춤
    vel += (target - pos) * (calm ? 1 : .055);
    vel *= calm ? 0 : .76;
    pos += vel;
    if (Math.abs(target - pos) < .0005 && Math.abs(vel) < .0005) { pos = target; vel = 0; }
  }
  sx += (tx - sx) * .06; sy += (ty - sy) * .06;
  ring.style.transform = calm ? "" : `rotateX(${(-sy * 5 - 2).toFixed(2)}deg) rotateY(${(sx * 6).toFixed(2)}deg)`;
  stage.style.setProperty("--po", `${50 + sx * 6}% ${40 + sy * 6}%`);
  const w = cards[0]?.offsetWidth || 400;
  const r = Math.max(w * 1.15, (w / 2 + 24) / Math.tan(Math.PI * step / 360));
  for (let i = 0; i < cards.length; i++) {
    const k = rel(i), a = k * step, abs = Math.abs(a);
    // 분류를 바꾸면 가운데부터 차례로 아래에서 날아 들어옴
    const e = calm ? 1 : ease(Math.min(1, Math.max(0, (now - born - Math.min(Math.abs(Math.round(k)), 6) * 70) / 650)));
    const op = (abs < 55 ? 1 : abs > 88 ? 0 : 1 - (abs - 55) / 33) * e;
    const c = cards[i];
    c.style.transform = `rotateY(${a}deg) translateZ(${r}px) translate3d(0, ${(1 - e) * 160}px, ${-(1 - e) * 300}px) rotateX(${(1 - e) * -25}deg)`;
    c.style.opacity = op;
    c.style.setProperty("--dim", Math.min(Math.abs(k) * .55, .8).toFixed(3));
    c.style.pointerEvents = op > .2 ? "" : "none";
  }
  ring.style.transform += ` translateZ(${-r}px)`;
  const n = list.length, near = ((Math.round(pos) % n) + n) % n;
  if (near !== cur) show(near);
  requestAnimationFrame(frame);
}

let tm;
function show(i) {
  cur = i; const w = list[i];
  const bm = $("beam"); bm.classList.remove("on"); void bm.offsetWidth; bm.classList.add("on");
  $("count").innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b> / ${String(list.length).padStart(2, "0")}`;
  $("txt").classList.add("out"); clearTimeout(tm);
  tm = setTimeout(() => {
    $("meta").textContent = `${w.d} · ${w.cat}${w.lock ? " · 잠금" : ""}`;
    $("ttl").textContent = w.t;
    $("desc").textContent = w.s;
    $("open").href = ROOT + w.href;
    mark();
    $("txt").classList.remove("out");
  }, calm ? 0 : 190);
}

// 끌기: 놓을 때의 속도만큼 더 돌다가 가까운 작품에 멈춤
let drag = null, moved = false;
stage.addEventListener("pointerdown", e => { drag = { x: e.clientX, p: pos, lx: e.clientX, lt: performance.now(), v: 0 }; moved = false; vel = 0; });
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  // 실제로 끌 때만 포인터를 잡음 (처음부터 잡으면 카드 클릭이 무대로 가서 링크가 안 열림)
  if (!moved && Math.abs(dx) > 6) { moved = true; stage.setPointerCapture(e.pointerId); stage.classList.add("drag"); }
  if (!moved) return;
  const unit = (cards[0]?.offsetWidth || 400) * .7, t = performance.now();
  let p = drag.p - dx / unit;
  if (!wrap) { const lo = 0, hi = list.length - 1; if (p < lo) p = lo - (lo - p) * .3; if (p > hi) p = hi + (p - hi) * .3; }   // 끝에서는 고무줄처럼
  drag.v = drag.v * .5 + (-(e.clientX - drag.lx) / unit / Math.max(1, t - drag.lt) * 16) * .5;
  drag.lx = e.clientX; drag.lt = t; pos = p;
});
const end = () => {
  if (!drag) return;
  const v = performance.now() - drag.lt > 90 ? 0 : drag.v;
  drag = null; stage.classList.remove("drag");
  if (!moved) return;
  vel = v; target = lim(Math.round(pos + v * 7));
};
stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
stage.addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  if (moved) { e.preventDefault(); return; }
  const k = rel(+c.dataset.i);
  if (Math.abs(k) > .5) { e.preventDefault(); go(Math.round(target + k)); }
});

// 앞 카드: 마우스 쪽으로 살짝 기울고 빛이 따라옴
stage.addEventListener("pointermove", e => {
  const c = e.target.closest(".card");
  const front = c && Math.abs(rel(+c.dataset.i)) < .5 && !drag?.v ? c : null;
  if (hot && hot !== front) { hot.classList.remove("hot"); hot.style.setProperty("--rx", "0deg"); hot.style.setProperty("--ry", "0deg"); }
  hot = front;
  if (!front || calm) return;
  const b = front.querySelector(".face").getBoundingClientRect(), x = (e.clientX - b.left) / b.width, y = (e.clientY - b.top) / b.height;
  front.classList.add("hot");
  front.style.setProperty("--gx", `${x * 100}%`); front.style.setProperty("--gy", `${y * 100}%`);
  front.style.setProperty("--rx", `${(.5 - y) * 7}deg`); front.style.setProperty("--ry", `${(x - .5) * 9}deg`);
});
stage.addEventListener("pointerleave", () => { if (hot) { hot.classList.remove("hot"); hot.style.setProperty("--rx", "0deg"); hot.style.setProperty("--ry", "0deg"); hot = null; } });

let wheelT = 0;
addEventListener("wheel", e => {
  e.preventDefault();
  const now = performance.now(); if (now - wheelT < 180) return; wheelT = now;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  go(Math.round(target) + Math.sign(d));
}, { passive: false });
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(Math.round(target) + 1);
  if (e.key === "ArrowLeft") go(Math.round(target) - 1);
});
$("prev").onclick = () => go(Math.round(target) - 1);
$("next").onclick = () => go(Math.round(target) + 1);

// 담기: 고른 작품은 오른쪽 위 칸에 모임
const picked = new Set();
function mark() { const on = picked.has(cur); $("pick").setAttribute("aria-pressed", on); $("pick").textContent = on ? "✓ 담음" : "＋ 담기"; }
$("pick").onclick = () => {
  if (picked.has(cur)) picked.delete(cur); else picked.add(cur);
  mark();
  $("tray").innerHTML = (picked.size ? `<span class="n">담은 작품 ${picked.size}</span>` : "") + [...picked].map(i => `<img src="${ROOT + list[i].img}" alt="${list[i].t}">`).join("");
};
// 빛기둥 속 먼지
const dc = $("dust"), dg = dc.getContext("2d"), motes = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.6 + .4, v: Math.random() * .25 + .05, p: Math.random() * 6 }));
function dust(t) {
  const dpr = Math.min(devicePixelRatio, 2), W = innerWidth, H = innerHeight;
  if (dc.width !== Math.round(W * dpr)) { dc.width = Math.round(W * dpr); dc.height = Math.round(H * dpr); }
  dg.setTransform(dpr, 0, 0, dpr, 0, 0); dg.clearRect(0, 0, W, H);
  const bw = (cards[0]?.offsetWidth || 400) * 1.5, bh = H * .45 + bw * .28;
  if (!calm) for (const m of motes) {
    m.y += m.v / 900; if (m.y > 1) m.y = 0;
    const y = m.y * bh - H * .06, half = bw * (.09 + .41 * m.y), x = W / 2 + (m.x * 2 - 1) * half * .8 + Math.sin(t / 1300 + m.p) * 8;
    dg.globalAlpha = .55 * Math.sin(m.y * Math.PI) * (.5 + .5 * Math.sin(t / 700 + m.p));
    dg.fillStyle = "#fff3dc"; dg.beginPath(); dg.arc(x, y, m.s, 0, 7); dg.fill();
  }
  requestAnimationFrame(dust);
}
requestAnimationFrame(dust);
build("전체");
requestAnimationFrame(frame);
</script>
</body>
</html>
