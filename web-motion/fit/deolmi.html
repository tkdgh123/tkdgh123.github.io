<style>
:root{--bg:#dde2e8;--tile:#f6f8fa;--ink:#15202c;--ink2:#4b5868;--rule:#c3ccd6;--steel:#2a4f86;--void:#c2361a;--term:#0f1823;--tink:#d6e1ec;--tdim:#8695a6;--tyel:#f1c56c;--tblue:#8db4f0;--tgreen:#7ed6b3;
 --sans:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono","Pretendard Variable",Pretendard,ui-monospace,monospace;--hud:var(--ink2);--m:clamp(16px,3.4vw,56px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);word-break:keep-all;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{position:fixed;z-index:70;inset:0 0 auto;display:flex;justify-content:space-between;gap:12px;padding:16px clamp(16px,3.2vw,52px);font:500 12px/1 var(--mono);letter-spacing:.02em;pointer-events:none;word-spacing:-.25em}
.top a{pointer-events:auto;text-decoration:none;color:var(--hud,currentColor);padding:6px 0}
.top a:hover{text-decoration:underline;text-underline-offset:4px}
.stage{position:fixed;inset:0;overflow:hidden}
.ov{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.box{position:absolute;border:1.5px solid var(--bc);background:color-mix(in srgb,var(--bc) 9%,transparent);transition:opacity .5s}
.box::before,.box::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--bc)}
.box::before{left:-4.5px;top:-4.5px}.box::after{right:-4.5px;bottom:-4.5px}
.size{position:absolute;left:50%;top:calc(100% + 7px);transform:translateX(-50%);background:var(--bc);color:#fff;font:600 10.5px/1.4 var(--mono);padding:1px 6px;white-space:nowrap;border-radius:2px}
.cur{position:absolute;left:0;top:0;will-change:transform;transition:opacity .4s}

.cur svg{display:block;filter:drop-shadow(0 1px 2px rgb(0 0 0/.35))}

.rip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:1.5px solid var(--cc);animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(3.4);opacity:0}}
.tc{opacity:0;font-style:normal;font-variant-ligatures:none}.tc.on{opacity:1}
.tc.last{position:relative}
.tc.last::after{content:"";position:absolute;left:100%;top:.08em;bottom:.04em;width:2px;background:var(--cc,currentColor);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

canvas{position:absolute;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}

.scr{background:var(--term);border-radius:6px;height:clamp(230px,48vh,440px);padding:clamp(10px,1.2vw,18px);overflow:hidden;font:400 clamp(11.5px,1.02vw,14.5px)/1.75 var(--mono);color:var(--tink);-webkit-mask-image:linear-gradient(transparent 0,#000 14px);mask-image:linear-gradient(transparent 0,#000 14px)}
.base{height:clamp(8px,1vw,13px);margin:0 -5%;border-radius:0 0 14px 14px;background:linear-gradient(#cdd5de,#aeb8c4)}
.ln{height:1.75em;white-space:nowrap;overflow:hidden}
.ln.hold{opacity:0}
.d{color:var(--tdim)}.s{color:var(--tblue)}.m{color:var(--tyel)}.g{color:var(--tgreen)}
.live .tx::after{content:"";display:inline-block;width:.55em;height:1.05em;background:var(--tink);vertical-align:-.2em;margin-left:1px;animation:bl 1s steps(1) infinite}

@keyframes wf{40%{opacity:1}}

#in{position:fixed;left:-200px;top:0;width:10px;height:10px;opacity:0}

@media (max-width:820px){
 .page{padding-top:56px;gap:22px}
 .hd h1{font-size:60px}.hd p{margin-top:8px;font-size:13.5px}
 .row{flex:none;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 60px auto;padding-bottom:30px}
 .scr{height:clamp(150px,22vh,200px);font-size:11px}
 .tag{margin-bottom:6px}.wifi{margin:0;transform:none}.wifi svg{width:38px}
}

<div class="stage" id="st">
 <canvas id="cv"></canvas>
 <div class="page">
  <header class="hd" data-b><h1>덜미<i>.</i></h1><p>같은 와이파이의 노트북끼리 터미널에서 대화하는 C 메신저.</p></header>
  <div class="row">
   <figure class="lap" data-b id="LA"><figcaption class="tag"><i style="--c:#3c6bc4"></i><b>수빈</b>방장</figcaption><div class="bez"><div class="scr" id="SA"></div></div><div class="base"></div></figure>
   <div class="wifi" id="wifi" data-b><svg viewBox="0 0 60 48" aria-hidden="true"><path d="M5 17a36 36 0 0 1 50 0"/><path d="M14 27a23 23 0 0 1 32 0"/><path d="M23 37a10 10 0 0 1 14 0"/><circle cx="30" cy="44" r="3.6"/></svg></div>
   <figure class="lap" data-b id="LB"><figcaption class="tag"><i style="--c:#c2361a"></i><b>민지</b>참가자</figcaption><div class="bez"><div class="scr" id="SB"></div></div><div class="base"></div></figure>
  </div>
 </div>
 <div class="ov" id="ov"></div>
</div>
<input id="in" autocomplete="off" autocapitalize="off" aria-label="글 쓰기" maxlength="22">
<button class="again" id="again" type="button">↻ 다시</button>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let G=0;const ABORT={};
const sleep=ms=>{const g=G;return new Promise((ok,no)=>setTimeout(()=>G===g?ok():no(ABORT),ms))};
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
const tween=(ms,fn,e=ease)=>{const g=G;return new Promise((ok,no)=>{const t0=performance.now();const f=n=>{if(G!==g)return no(ABORT);const t=Math.min(1,(n-t0)/ms);fn(e(t),t);t<1?requestAnimationFrame(f):ok()};requestAnimationFrame(f)})};
const arrow=c=>`<svg width="18" height="20" viewBox="0 0 18 20"><path d="M1 1l15 7.5-6.5 1.8L6.8 17z" fill="${c}" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
const rel=(st,el)=>{const r=el.getBoundingClientRect(),s=st.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}};
class Cur{
  constructor(ov,c,n,x,y){this.ov=ov;this.c=c;this.x=x;this.y=y;const d=this.el=document.createElement("div");d.className="cur";d.style.setProperty("--cc",c);d.innerHTML=arrow(c)+`<span>${n}</span>`;ov.append(d);this.place()}
  place(){this.el.style.transform=`translate(${this.x}px,${this.y}px)`}
  go(x,y,ms=700,arc=60){const a=[this.x,this.y],dx=x-a[0],dy=y-a[1],L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,s=arc*Math.min(1,L/420)*(Math.random()<.5?-1:1);return tween(ms,t=>{const b=Math.sin(Math.PI*t)*s;this.x=a[0]+dx*t+nx*b;this.y=a[1]+dy*t+ny*b;this.place()})}
  click(){const r=document.createElement("i");r.className="rip";r.style.cssText=`left:${this.x}px;top:${this.y}px;--cc:${this.c}`;this.ov.append(r);setTimeout(()=>r.remove(),700)}
  goEl(st,el,ox=.5,oy=.5,ms=700){const r=rel(st,el);return this.go(r.x+r.w*ox,r.y+r.h*oy,ms)}
}
// 칸을 끌어 긋기: 커서가 왼쪽 위로 가서 오른쪽 아래까지 끌며 크기 표시가 올라감
async function drawBox(st,ov,cur,el,color,ms=560){
  const r=rel(st,el);await cur.go(r.x,r.y,520+Math.random()*220);
  const b=document.createElement("div"),z=document.createElement("span");b.className="box";z.className="size";b.style.cssText=`--bc:${color};left:${r.x}px;top:${r.y}px;width:0;height:0`;b.append(z);ov.append(b);
  await Promise.all([tween(ms,t=>{b.style.width=r.w*t+"px";b.style.height=r.h*t+"px";z.textContent=`${Math.round(r.w*t)} × ${Math.round(r.h*t)}`}),cur.go(r.x+r.w,r.y+r.h,ms,30)]);
  cur.click();return b;
}
const fadeBox=b=>{b.style.opacity=0;setTimeout(()=>b.remove(),600)};
// 글자 한 자씩 감싸 둠 (자리는 그대로, 보이기만 바꿈)
function split(n){[...n.childNodes].forEach(c=>c.nodeType===3?c.replaceWith(...[...c.textContent].map(ch=>Object.assign(document.createElement("i"),{className:"tc",textContent:ch}))):split(c))}
async function typeEl(st,el,cur,ms=32){
  const cs=$$(".tc",el);el.style.opacity=1;let last=null;if(cur)cur.el.classList.add("follow");
  for(let i=0;i<cs.length;i++){
    if(last)last.classList.remove("last");const c=cs[i];c.classList.add("on","last");last=c;if(cur)c.style.setProperty("--cc",cur.c);
    if(cur&&(i%3===0||i===cs.length-1)){const r=rel(st,c);cur.x=r.x+r.w+3;cur.y=r.y+r.h*.55;cur.place()}
    const t=c.textContent;await sleep(t==="\n"?ms*5:t===" "?ms*.5:ms*(.7+Math.random()*.7));
  }
  if(last)setTimeout(()=>last.classList.remove("last"),900);
  if(cur)cur.el.classList.remove("follow");
}
const showTyped=el=>{$$(".tc",el).forEach(c=>c.classList.add("on"));el.style.opacity=1};
const popIn=el=>el.classList.remove("pre");

const st=$("#st"),ov=$("#ov"),cv=$("#cv"),g=cv.getContext("2d"),inp=$("#in");
const SA=$("#SA"),SB=$("#SB"),LA=$("#LA"),LB=$("#LB"),wifi=$("#wifi");
const A_C="#3c6bc4",B_C="#c2361a";
let parts=[],raf=0,live=null,busy=false,hinted=false;
function fit(){const d=Math.min(devicePixelRatio||1,2),r=st.getBoundingClientRect();cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0)}
addEventListener("resize",fit);fit();
const lerp=(a,b,t)=>a+(b-a)*t,cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const qb=(p,c,q,t)=>[(1-t)**2*p[0]+2*(1-t)*t*c[0]+t*t*q[0],(1-t)**2*p[1]+2*(1-t)*t*c[1]+t*t*q[1]];
const cen=el=>{const r=rel(st,el);return[r.x+r.w/2,r.y+r.h/2]};
// 줄 만들기. 화면이 차면 맨 위 줄이 밀려 올라감
function line(scr,html,cls=""){
  const d=document.createElement("div");d.className="ln "+cls;d.innerHTML=html;scr.append(d);
  const cap=Math.floor(scr.clientHeight-parseFloat(getComputedStyle(scr).paddingTop)*2)/d.offsetHeight|0;
  while(scr.children.length>cap)scr.firstChild.remove();
  return d;
}
const NM={a:'<span class="s">수빈&gt;</span> ',b:'<span class="m">민지&gt;</span> '};
// 한 글자씩 직접 쳐 넣는 줄 (커서가 따라감)
async function typed(scr,cur,label,text,ms=70){
  const d=line(scr,label+`<span class="tx"></span>`);const tx=$(".tx",d);tx.textContent=text;split(tx);
  if(cur){await cur.goEl(st,scr,.3,.5,600);cur.click();await typeEl(st,tx,cur,ms)}else await typeEl(st,tx,null,ms);
  return d;
}
function setLive(on){
  if(!on){if(live){live.remove();live=null}return}
  const d=line(SA,NM.a+`<span class="tx"></span>${hinted?"":'<span class="ph">아무 말이나 쳐 보세요</span>'}`,"live");live=d;
}
// 점 꾸러미: 글자 → 점 → 꾸러미 → 와이파이를 건너 → 받는 줄의 글자
function transfer(srcTx,dstTx,from,to,text){
  const S=[...srcTx.querySelectorAll(".tc")],D=[...dstTx.querySelectorAll(".tc")];
  const c1=cen(from),c2=cen(to),dx=c2[0]-c1[0],dy=c2[1]-c1[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  const edge=(el,ex,ey)=>{const r=rel(st,el),c=[r.x+r.w/2,r.y+r.h/2],t=Math.min(r.w/2/Math.max(1e-3,Math.abs(ex)),r.h/2/Math.max(1e-3,Math.abs(ey)));return[c[0]+ex*t,c[1]+ey*t]};
  const B1=edge(from,ux,uy),B2=edge(to,-ux,-uy);
  const nx=-uy,ny=ux,sgn=ny<0||(ny===0&&nx<0)?-1:1;const up=Math.abs(dx)>Math.abs(dy)?[0,-1]:[1,0];
  const W=cen(wifi),mid=[(B1[0]+B2[0])/2,(B1[1]+B2[1])/2],vert=Math.abs(dy)>Math.abs(dx),C=[2*W[0]-mid[0]+(vert?90:0),2*W[1]-mid[1]];
  const P=[];
  S.forEach((c,i)=>{const a=cen(c),e=cen(D[i]||D[D.length-1]);for(let k=0;k<7;k++)P.push({a:[a[0]+(Math.random()-.5)*10,a[1]+(Math.random()-.5)*14],e:[e[0]+(Math.random()-.5)*10,e[1]+(Math.random()-.5)*14],o:[(Math.random()-.5)*26,(Math.random()-.5)*26],lag:Math.random()*.14,r:1.6+Math.random()*1.6,j:Math.random()*7})});
  const hex=document.createElement("div");hex.className="hex";{const by=[...new TextEncoder().encode(text)].map(b=>b.toString(16).padStart(2,"0"));hex.textContent=by.slice(0,7).join(" ")+(by.length>7?" …":"")}
  hex.style.cssText=`left:${W[0]}px;top:${W[1]-34}px;opacity:0`;ov.append(hex);
  const T0=performance.now(),DUR=2500;let revealed=false,pulsed=false;
  return new Promise(done=>{parts.push({P,B1,B2,C,T0,DUR,hex,end:()=>{hex.style.opacity=0;setTimeout(()=>hex.remove(),500);done()},
    tick(now){const u=(now-T0)/DUR;
      if(u>.3&&!pulsed){pulsed=true;wifi.classList.remove("pulse");void wifi.offsetWidth;wifi.classList.add("pulse");hex.style.opacity=1}
      if(u>.62)hex.style.opacity=0;
      if(u>.74&&!revealed){revealed=true;dstTx.parentElement.classList.remove("hold");D.forEach((c,i)=>setTimeout(()=>c.classList.add("on"),i*60))}
      return u}})});
}
function frame(now){
  const w=cv.width/(Math.min(devicePixelRatio||1,2));g.clearRect(0,0,w,9999);
  parts=parts.filter(q=>{
    const u=q.tick(now);if(u>=1.05){q.end();return false}
    g.fillStyle="#4b86e0";
    for(const p of q.P){
      const v=u-p.lag*.5;let x,y,a=1;
      if(v<.22){const t=ease(cl(v/.22));x=lerp(p.a[0],q.B1[0]+p.o[0]*.25,t);y=lerp(p.a[1],q.B1[1]+p.o[1]*.25,t)}
      else if(v<.78){const t=ease(cl((v-.22)/.56)),pt=qb(q.B1,q.C,q.B2,t),wob=Math.sin(t*9+p.j)*(1-Math.abs(t*2-1)*.2);x=pt[0]+p.o[0]*(.25+.2*Math.sin(t*3.14))+wob*3;y=pt[1]+p.o[1]*(.25+.2*Math.sin(t*3.14))+wob*3}
      else{const t=ease(cl((v-.78)/.22));x=lerp(q.B2[0]+p.o[0]*.25,p.e[0],t);y=lerp(q.B2[1]+p.o[1]*.25,p.e[1],t);a=1-cl((v-.9)/.12)}
      g.globalAlpha=Math.max(0,a);g.beginPath();g.arc(x,y,p.r,0,7);g.fill();
    }
    g.globalAlpha=1;return true;
  });
  raf=parts.length?requestAnimationFrame(frame):0;
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};
async function send(fromSide,text,srcTx,reply){
  const A=fromSide==="a",tgtScr=A?SB:SA,from=A?LA:LB,to=A?LB:LA;
  const d=line(tgtScr,(A?NM.a:NM.b)+`<span class="tx"></span>`,"hold");const tx=$(".tx",d);tx.textContent=text;split(tx);
  const p=transfer(srcTx,tx,from,to,text);kick();await p;
}
const SCRIPT=[["a","안녕"],["b","들어왔어요"],["a","점심 같이 먹어요?"],["b","좋아요"]];
const REPL=["받았어요","좋아요","잠깐만요","알겠어요","오 신기해요"];
async function build(){
  ++G;parts=[];busy=false;hinted=false;setLive(false);inp.value="";
  $$(".cur,.box,.rip,.hex",ov).forEach(e=>e.remove());SA.innerHTML=SB.innerHTML="";
  const items=$$("[data-b]");items.forEach(el=>{el.style.transition="opacity .6s";el.style.opacity=0});
  if(calm){items.forEach(el=>el.style.opacity=1);
    line(SA,'<span class="d">이름:</span> 수빈');line(SB,'<span class="d">이름:</span> 민지');
    line(SA,NM.a+"안녕");line(SB,NM.a+"안녕");line(SA,NM.b+"들어왔어요");line(SB,NM.b+"들어왔어요");setLive(true);return}
  const S=st.getBoundingClientRect(),W=S.width,H=S.height;
  const A=new Cur(ov,A_C,"수빈",-60,H*.3),B=new Cur(ov,B_C,"민지",W+40,H*.55);
  try{
    const hd=$(".hd");
    const a1=(async()=>{const b=await drawBox(st,ov,A,hd,A_C);hd.style.opacity=1;fadeBox(b);await sleep(100);
      const bz=await drawBox(st,ov,A,LA,A_C,700);LA.style.opacity=1;fadeBox(b);fadeBox(bz)})();
    const b1=(async()=>{await sleep(800);const bz=await drawBox(st,ov,B,LB,B_C,700);LB.style.opacity=1;wifi.style.opacity=1;fadeBox(bz)})();
    await Promise.all([a1,b1]);await sleep(250);
    // 접속
    const sA=(async()=>{await typed(SA,A,'<span class="d">이름:</span> ',"수빈");await sleep(200);await typed(SA,A,'<span class="d">방 열기(1) / 들어가기(2):</span> ',"1");await sleep(250);line(SA,'<span class="g">[주소] 192.168.0.5</span>')})();
    const sB=(async()=>{await sleep(500);await typed(SB,B,'<span class="d">이름:</span> ',"민지");await sleep(200);await typed(SB,B,'<span class="d">방 열기(1) / 들어가기(2):</span> ',"2");await sleep(200);await typed(SB,B,'<span class="d">방장 주소:</span> ',"192.168.0.5",36)})();
    await Promise.all([sA,sB]);await sleep(350);
    line(SA,'<span class="d">민지 입장</span>');line(SB,'<span class="d">수빈 입장</span>');await sleep(600);
    // 대화: 치고 → 점 꾸러미로 → 받는 쪽에 글이 맺힘
    for(const [side,text] of SCRIPT){
      const cur=side==="a"?A:B,scr=side==="a"?SA:SB,d=await typed(scr,cur,NM[side],text,95);
      await sleep(300);await send(side,text,$(".tx",d));await sleep(350);
    }
    // 이제부터 직접
    A.go(W+60,H*.2,900).catch(()=>{});B.go(W+60,H*.7,900).catch(()=>{});
    setLive(true);inp.focus({preventScroll:true});
  }catch(e){if(e!==ABORT)throw e}
}
// 직접 쓰기: 입력창을 숨겨 두고 글자를 줄에 그대로 보여 줌
inp.addEventListener("input",()=>{hinted=true;if(!live)return;const ph=$(".ph",live);if(ph)ph.remove();$(".tx",live).textContent=inp.value});
inp.addEventListener("keydown",async e=>{
  if(e.key!=="Enter"||e.isComposing||busy||!live||!inp.value.trim())return;
  busy=true;const text=inp.value.trim();inp.value="";const d=live;live=null;d.classList.remove("live");
  const tx=$(".tx",d);tx.textContent=text;split(tx);$$(".tc",tx).forEach(c=>c.classList.add("on"));
  const run=G;
  await send("a",text,tx);if(run!==G)return;await sleep(500);
  const r=REPL[Math.floor(Math.random()*REPL.length)],d2=line(SB,NM.b+`<span class="tx"></span>`);const t2=$(".tx",d2);t2.textContent=r;split(t2);
  try{await typeEl(st,t2,null,70);await sleep(250);await send("b",r,t2)}catch(e){if(e!==ABORT)throw e}
  if(run!==G)return;busy=false;setLive(true);
});
st.addEventListener("pointerdown",()=>{if(live)inp.focus({preventScroll:true})});
$("#again").onclick=build;
addEventListener("load",()=>setTimeout(build,350));
</script>
