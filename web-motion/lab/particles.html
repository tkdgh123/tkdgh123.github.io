<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>흩어지고 모이는 점 · 데모 4</title>
<link rel="stylesheet" href="lab.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
/* 점 수만 개가 글자 → 공 → 글자 → 물결로 바뀜. 계산은 전부 그래픽카드(셰이더)에서 */
body { background: #07070b; color: #fff; height: 500vh }
.cap { position: fixed; z-index: 2; left: clamp(16px, 3vw, 32px); bottom: 24px; max-width: 34ch; opacity: .75 }
.step { position: fixed; z-index: 2; right: clamp(16px, 3vw, 32px); bottom: 24px; opacity: .75 }
</style>
</head>
<body>
<nav class="hud mono"><a href="../#more">← 움직이는 웹사이트</a><span class="right"><a href="terrain.html">← 이전</a><span>데모 4 / 7 · 입자</span><a href="spotlight.html">다음 →</a></span></nav>
<canvas class="bg" id="cv"></canvas>
<p class="cap mono">스크롤하면 모양이 바뀌고, 마우스(손가락)를 대면 점이 비켜요.</p>
<p class="step mono" id="step">01 / 04</p>

<script type="module">
import * as THREE from "three";
const small = innerWidth < 700, N = small ? 16000 : 42000;

// 글자를 캔버스에 그린 뒤 칠해진 픽셀에서 점 위치를 뽑는다
async function textPoints(lines, w) {
  await document.fonts.load("800 160px 'Pretendard Variable'").catch(() => {});
  const W = 1024, H = 512, k = document.createElement("canvas"); k.width = W; k.height = H;
  const g = k.getContext("2d"); g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = `800 ${lines.length > 1 ? 170 : 230}px 'Pretendard Variable', sans-serif`;
  lines.forEach((l, i) => g.fillText(l, W / 2, H / 2 + (i - (lines.length - 1) / 2) * 190));
  const d = g.getImageData(0, 0, W, H).data, hit = [];
  for (let y = 0; y < H; y += 2) for (let x = 0; x < W; x += 2) if (d[(y * W + x) * 4] > 128) hit.push(x, y);
  const out = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const j = (Math.random() * hit.length / 2 | 0) * 2; out.set([(hit[j] / W - .5) * w, -(hit[j + 1] / H - .5) * w / 2, (Math.random() - .5) * .3], i * 3); }
  return out;
}
const sphere = () => { const o = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = 3.2 * Math.cbrt(.85 + Math.random() * .15), s = Math.sqrt(1 - u * u); o.set([r * s * Math.cos(a), r * u, r * s * Math.sin(a)], i * 3); } return o; };
const wave = () => { const o = new Float32Array(N * 3), side = Math.sqrt(N) | 0; for (let i = 0; i < N; i++) { const x = (i % side) / side - .5, z = Math.floor(i / side) / side - .5; o.set([x * 16, 0, z * 9], i * 3); } return o; };

const W0 = small ? 7 : 12;
const shapes = [await textPoints(["흩어지고"], W0), sphere(), await textPoints(["다시", "모여요"], W0 * .8), wave()];
const geo = new THREE.BufferGeometry();
shapes.forEach((s, i) => geo.setAttribute("s" + i, new THREE.BufferAttribute(s, 3)));
geo.setAttribute("position", new THREE.BufferAttribute(shapes[0].slice(), 3));
const rnd = new Float32Array(N * 4); for (let i = 0; i < rnd.length; i++) rnd[i] = Math.random();
geo.setAttribute("rnd", new THREE.BufferAttribute(rnd, 4));

const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { u: { value: 0 }, time: { value: 0 }, mouse: { value: new THREE.Vector3(99, 99, 0) }, px: { value: Math.min(devicePixelRatio, 2) } },
  vertexShader: `
    attribute vec3 s0; attribute vec3 s1; attribute vec3 s2; attribute vec3 s3; attribute vec4 rnd;
    uniform float u; uniform float time; uniform vec3 mouse; uniform float px; varying vec3 vC; varying float vA;
    float seg(float k){ return clamp((u - k) * 1.8 - rnd.x * .8, 0., 1.); }
    void main(){
      float f0 = seg(0.), f1 = seg(1.), f2 = seg(2.);
      vec3 p = mix(mix(mix(s0, s1, f0), s2, f1), s3, f2);
      vec3 dir = normalize(rnd.yzw - .5);
      float burst = sin(f0 * 3.1416) + sin(f1 * 3.1416) + sin(f2 * 3.1416);
      p += dir * burst * (2.5 + rnd.y * 3.);
      p.y += f2 * sin(p.x * .8 + time * 1.4) * .7 * cos(p.z * .6 + time);    // 마지막 모양은 물결
      p += dir * .04 * sin(time * 2. + rnd.x * 40.);                          // 살짝 떨림
      vec3 m = p - mouse; float d = length(m.xy);
      p.xy += normalize(m.xy + .0001) * smoothstep(1.2, 0., d) * .7;          // 마우스 근처는 밀려남
      vec4 mv = modelViewMatrix * vec4(p, 1.);
      gl_PointSize = (1.2 + rnd.z * 1.8) * px * (14. / -mv.z);
      gl_Position = projectionMatrix * mv;
      vC = mix(vec3(.55, .62, 1.), vec3(1., .55, .35), clamp(p.x * .08 + .5 + burst * .2, 0., 1.));
      vC = mix(vC, vec3(.4, 1., .75), f2 * (1. - f2) * 2. + f2 * .5 * (1. + sin(p.x)));
      vA = .55 + .45 * rnd.w;
    }`,
  fragmentShader: `varying vec3 vC; varying float vA; void main(){ float d = length(gl_PointCoord - .5); if (d > .5) discard; gl_FragColor = vec4(vC, vA * smoothstep(.5, .1, d)); }`
});
const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;

const cv = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.add(pts);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 100); camera.position.set(0, 0, 14);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.position.z = small ? 17 : 14; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

let target = 0, u = 0;
addEventListener("scroll", () => target = scrollY / (document.documentElement.scrollHeight - innerHeight) * 3, { passive: true });
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hitP = new THREE.Vector3();
const point = e => { ray.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera); if (ray.ray.intersectPlane(plane, hitP)) mat.uniforms.mouse.value.copy(hitP); };
addEventListener("pointermove", point); addEventListener("pointerdown", point);
addEventListener("pointerleave", () => mat.uniforms.mouse.value.set(99, 99, 0));
const step = document.getElementById("step"), clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  u += (target - u) * .06;
  mat.uniforms.u.value = u; mat.uniforms.time.value = t;
  pts.rotation.y = Math.sin(t * .2) * .15 + Math.min(1, Math.max(0, (u - .5) / 1.2)) * Math.PI * 2;   // 공일 때 한 바퀴
  pts.rotation.x = u > 2.4 ? .85 * Math.min(1, (u - 2.4) * 2) : 0;
  step.textContent = `0${Math.min(4, Math.round(u) + 1)} / 04`;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
