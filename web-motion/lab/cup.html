<style>
/* 3D 물건 하나를 스크롤로 돌려 보는 제품 페이지 */

@media (max-width: 700px) { section, section.r { align-items: flex-end; justify-content: flex-start; text-align: left; padding-bottom: 14vh } .glaze { justify-content: flex-start } }

<body>
<nav class="hud mono"><a href="../#more">← 움직이는 웹사이트</a><span class="right"><span>데모 1 / 7 · 3D 제품 스크롤</span><a href="drone.html">다음 →</a></span></nav>
<canvas class="bg" id="cv"></canvas>

<section><div class="t"><small class="mono">MADI · 가상의 제품</small><h1>청자<br>머그</h1></div></section>
<section class="r"><div class="t"><h2>손잡이는<br>손가락 셋.</h2><p>검지·중지·약지가 편하게 걸리는 둥근 고리.</p></div></section>
<section><div class="t"><h2>두께 3mm</h2><p>위에서 보면 입이 닿는 테두리가 얇고 고르게 이어져요.</p></div></section>
<section class="r"><div class="t"><h2>세 가지 유약</h2><p>청자, 분청, 흑유. 스크롤하면 바뀌어요.</p><div class="glaze"><i style="background:#8fb8a4"></i><i style="background:#d9d2c3"></i><i style="background:#2b2724"></i></div></div></section>
<section><div class="t"><h2>매일<br>쓰는 것.</h2><p>Three.js로 만든 데모예요. 컵은 회전체(선반으로 깎듯 단면을 돌린 모양)로 만들었어요.</p></div></section>
<p class="hint mono" id="hint">↓ 스크롤</p>

<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const cv = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, .1, 100);

const sun = new THREE.DirectionalLight("#fff4e6", 2.2);
sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3; sun.shadow.camera.right = sun.shadow.camera.top = 3; sun.shadow.radius = 6;
scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: .28 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// 컵: 바깥 → 테두리 → 안쪽 단면을 한 줄로 이어 돌린다
const prof = [[0, 0], [.52, 0], [.56, .03], [.6, .2], [.62, .9], [.64, 1.3], [.66, 1.36], [.62, 1.38], [.6, 1.32], [.58, .9], [.56, .2], [.5, .1], [0, .1]].map(([x, y]) => new THREE.Vector2(x, y));
const glaze = new THREE.MeshPhysicalMaterial({ color: "#8fb8a4", roughness: .22, clearcoat: 1, clearcoatRoughness: .15, sheen: .3 });
const cup = new THREE.Group();
const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 96), glaze);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.32, .065, 24, 64, Math.PI * 1.15), glaze);
handle.position.set(.62, .72, 0); handle.rotation.z = -Math.PI * .575;
const foot = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, .02, 64), new THREE.MeshStandardMaterial({ color: "#b9a78c", roughness: .9 }));
foot.position.y = .01;
cup.add(body, handle, foot);
cup.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(cup);
// 받침
const saucer = new THREE.Mesh(new THREE.LatheGeometry([[0, 0], [.9, 0], [1.05, .07], [1.1, .1], [1.0, .1], [.85, .05], [0, .05]].map(([x, y]) => new THREE.Vector2(x, y)), 96), glaze);
saucer.receiveShadow = saucer.castShadow = true; scene.add(saucer);

// 장면 다섯: 카메라 위치, 바라보는 곳, 컵 회전·높이, 배경색
const K = [
  { cam: [3.2, 2.2, 4.4], look: [0, .6, 0], ry: .6, rx: 0, y: .05, bg: "#1d2a24" },
  { cam: [2.5, 1.5, 3.4], look: [-.25, .8, 0], ry: -1.1, rx: .15, y: .45, bg: "#2a2a35" },
  { cam: [.15, 4.4, .6], look: [0, .6, 0], ry: 2.2, rx: 0, y: .05, bg: "#33281f" },
  { cam: [-2.6, 1.6, 3.4], look: [0, .7, 0], ry: 4.2, rx: -.12, y: .35, bg: "#1b2430" },
  { cam: [0, 1.4, 5.2], look: [0, .65, 0], ry: 6.6, rx: 0, y: .05, bg: "#1d2a24" }
];
const glazes = ["#8fb8a4", "#d9d2c3", "#2b2724"].map(c => new THREE.Color(c));
const sm = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const v3 = (a, b, t) => new THREE.Vector3(lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t));

let target = 0, p = 0;
const progress = () => scrollY / (document.documentElement.scrollHeight - innerHeight);
addEventListener("scroll", () => { target = progress(); document.getElementById("hint").style.opacity = target > .02 ? 0 : .7; }, { passive: true });

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < 700 ? 44 : 30;
  innerWidth < 700 ? camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * .17, innerWidth, innerHeight) : camera.clearViewOffset();   // 휴대폰: 컵을 위로, 글은 아래
  camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const clock = new THREE.Clock(), tmpC = new THREE.Color();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  p += (target - p) * .07;
  const f = p * (K.length - 1), i = Math.min(K.length - 2, Math.floor(f)), k = sm(f - i), A = K[i], B = K[i + 1];
  camera.position.copy(v3(A.cam, B.cam, k));
  camera.lookAt(v3(A.look, B.look, k));
  cup.rotation.y = lerp(A.ry, B.ry, k) + Math.sin(t * .6) * .05;
  cup.rotation.x = lerp(A.rx, B.rx, k);
  cup.position.y = lerp(A.y, B.y, k) + Math.sin(t * 1.1) * .015;
  document.body.style.backgroundColor = "#" + tmpC.set(A.bg).lerp(new THREE.Color(B.bg), k).getHexString();
  // 넷째 장면에서 유약이 차례로 바뀜
  const g = Math.min(2, Math.max(0, (f - 2.6) * 2.2));
  const gi = Math.min(1, Math.floor(g));
  glaze.color.copy(glazes[gi]).lerp(glazes[gi + 1], sm(g - gi));
  glaze.roughness = gi + (g - gi) > 1.5 ? .35 : .22;
  renderer.render(scene, camera);
});
</script>
