<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>마감 깨기 · 데모 6</title>
<link rel="stylesheet" href="lab.css">
<style>
/* 사이트가 곧 게임: 벽돌깨기. 벽돌 = 과제 마감, 판 = 노트북 */
body { background: #0e1626; color: #eaf0ff; overflow: hidden; touch-action: none; user-select: none }
.wrap { position: fixed; inset: 0; display: grid; place-items: center }
canvas { display: block; max-width: 100vw; max-height: 100svh }
.over { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; background: rgb(14 22 38 / .72); backdrop-filter: blur(3px) }
.over[hidden] { display: none }
.over h1 { margin: 0; font-size: clamp(48px, 9vw, 120px); font-weight: 800; letter-spacing: -.05em; line-height: .95 }
.over h1 span { color: #ffd23f }
.over p { margin: 14px 0 26px; opacity: .8 }
.over button { font: 800 18px "Pretendard Variable", sans-serif; padding: 14px 34px; border-radius: 40px; border: 0; background: #ffd23f; color: #0e1626; cursor: pointer }
.over button:focus-visible { outline: 3px solid #fff; outline-offset: 4px }
.over .best { margin-top: 18px; opacity: .6 }
</style>
</head>
<body>
<nav class="hud mono"><a href="../#more">← 움직이는 웹사이트</a><span class="right"><a href="spotlight.html">← 이전</a><span>데모 6 / 7 · 게임</span><a href="lookup.html">다음 →</a></span></nav>
<div class="wrap"><canvas id="cv" width="900" height="1200" aria-label="벽돌깨기 게임 화면"></canvas></div>
<div class="over" id="over"><div><h1>마감<br><span>깨기</span></h1><p id="msg">마우스나 손가락으로 노트북을 움직여 공을 튕겨요.<br>노란 벽돌을 깨면 노트북이 넓어져요.</p><button id="go" type="button">시작</button><p class="best mono" id="best"></p></div></div>

<script>
const cv = document.getElementById("cv"), g = cv.getContext("2d");
const W = 900, H = 1200, over = document.getElementById("over"), msg = document.getElementById("msg"), goBtn = document.getElementById("go"), bestEl = document.getElementById("best");
const store = { get() { try { return +localStorage.getItem("madi-breaker") || 0 } catch { return 0 } }, set(v) { try { localStorage.setItem("madi-breaker", v) } catch {} } };
const names = ["과제", "퀴즈", "보고서", "발표", "영상", "실습", "토론", "시험"];
const rowCol = ["#ff6b6b", "#ff9f43", "#feca57", "#48dbfb", "#1dd1a1", "#a29bfe"];
let S;

function level(n) {
  const rows = Math.min(6, 3 + n), cols = 7, bw = 108, bh = 46, gap = 12, x0 = (W - cols * bw - (cols - 1) * gap) / 2, bricks = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (n > 0 && (r + c + n) % 5 === 0) continue;
    bricks.push({ x: x0 + c * (bw + gap), y: 170 + r * (bh + gap), w: bw, h: bh, hp: r < n ? 2 : 1, col: rowCol[r % rowCol.length], label: names[(r * 3 + c) % names.length], d: `D-${rows - r}`, power: Math.random() < .08 });
  }
  return bricks;
}
function reset(n = 0, keep) {
  S = { n, score: keep ? S.score : 0, lives: keep ? S.lives : 3, combo: 0, pad: { x: W / 2, w: 170, big: 0 }, balls: [], bricks: level(n), sparks: [], pops: [], shake: 0, stuck: true };
  S.balls.push({ x: W / 2, y: H - 120, vx: 0, vy: 0, r: 12 });
}
function launch() { if (!S.stuck) return; S.stuck = false; const b = S.balls[0], sp = 9 + S.n * .8; b.vx = sp * .45 * (Math.random() < .5 ? -1 : 1); b.vy = -sp; }

let px = W / 2;
function toCanvas(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
addEventListener("pointermove", e => px = toCanvas(e));
addEventListener("pointerdown", e => { px = toCanvas(e); if (over.hidden) launch(); });
const keys = {}; addEventListener("keydown", e => { keys[e.key] = 1; if (e.key === " " && over.hidden) launch(); }); addEventListener("keyup", e => keys[e.key] = 0);

function burst(x, y, col, n = 14) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, s = 2 + Math.random() * 6; S.sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, col }); } }

function step() {
  const p = S.pad;
  if (keys.ArrowLeft) px -= 16; if (keys.ArrowRight) px += 16;
  px = Math.max(p.w / 2, Math.min(W - p.w / 2, px));
  p.x += (px - p.x) * .35;
  if (p.big > 0 && --p.big === 0) p.w = 170;
  for (const b of S.balls) {
    if (S.stuck) { b.x = p.x; b.y = H - 120; continue; }
    const steps = 3;
    for (let k = 0; k < steps; k++) {
      b.x += b.vx / steps; b.y += b.vy / steps;
      if (b.x < b.r || b.x > W - b.r) { b.vx *= -1; b.x = Math.max(b.r, Math.min(W - b.r, b.x)); }
      if (b.y < 110 + b.r) { b.vy = Math.abs(b.vy); }
      // 노트북에 맞으면 맞은 자리에 따라 각도 변화
      if (b.vy > 0 && b.y + b.r > H - 104 && b.y < H - 80 && Math.abs(b.x - p.x) < p.w / 2 + b.r) {
        const hit = (b.x - p.x) / (p.w / 2), sp = Math.hypot(b.vx, b.vy);
        b.vx = sp * Math.sin(hit * 1.05); b.vy = -sp * Math.cos(hit * 1.05); S.combo = 0; S.shake = 3;
      }
      for (const br of S.bricks) {
        if (br.dead) continue;
        const cx = Math.max(br.x, Math.min(b.x, br.x + br.w)), cy = Math.max(br.y, Math.min(b.y, br.y + br.h));
        if ((b.x - cx) ** 2 + (b.y - cy) ** 2 < b.r * b.r) {
          if (Math.abs(b.x - cx) > Math.abs(b.y - cy)) b.vx *= -1; else b.vy *= -1;
          b.x += b.vx / steps; b.y += b.vy / steps;
          if (--br.hp <= 0) {
            br.dead = true; S.combo++; const pts = 10 * S.combo; S.score += pts;
            burst(br.x + br.w / 2, br.y + br.h / 2, br.col); S.pops.push({ x: br.x + br.w / 2, y: br.y, t: `+${pts}`, life: 1 });
            if (br.power) { p.w = 280; p.big = 600; S.pops.push({ x: p.x, y: H - 150, t: "넓어짐!", life: 1.4 }); }
          } else burst(b.x, b.y, "#fff", 6);
          S.shake = 6; break;
        }
      }
    }
    if (b.y > H + 30) b.out = true;
  }
  S.balls = S.balls.filter(b => !b.out);
  if (!S.balls.length) {
    if (--S.lives <= 0) return end(false);
    S.balls.push({ x: p.x, y: H - 120, vx: 0, vy: 0, r: 12 }); S.stuck = true; S.combo = 0;
  }
  if (S.bricks.every(b => b.dead)) { if (S.n >= 2) return end(true); reset(S.n + 1, true); S.pops.push({ x: W / 2, y: H / 2, t: `${S.n + 1}단계`, life: 1.6 }); }
  S.sparks.forEach(s => { s.x += s.vx; s.y += s.vy; s.vy += .25; s.life -= .03; }); S.sparks = S.sparks.filter(s => s.life > 0);
  S.pops.forEach(s => { s.y -= 1.2; s.life -= .02; }); S.pops = S.pops.filter(s => s.life > 0);
  S.shake *= .85;
}

function draw() {
  g.save(); g.clearRect(0, 0, W, H);
  g.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);
  const bgG = g.createLinearGradient(0, 0, 0, H); bgG.addColorStop(0, "#14213d"); bgG.addColorStop(1, "#0e1626"); g.fillStyle = bgG; g.fillRect(-10, -10, W + 20, H + 20);
  g.strokeStyle = "rgba(255,255,255,.04)"; for (let y = 120; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  g.fillStyle = "#eaf0ff"; g.font = "800 40px 'Pretendard Variable', sans-serif"; g.textAlign = "left"; g.fillText(S.score, 40, 90);
  g.textAlign = "right"; g.font = "500 22px 'JetBrains Mono', monospace"; g.fillText(`${S.n + 1}단계 · ${"●".repeat(S.lives)}${"○".repeat(Math.max(0, 3 - S.lives))}`, W - 40, 84);
  if (S.combo > 1) { g.textAlign = "left"; g.fillStyle = "#ffd23f"; g.fillText(`연속 ×${S.combo}`, 40, 126); }
  g.textAlign = "center";
  for (const b of S.bricks) {
    if (b.dead) continue;
    g.fillStyle = b.power ? "#ffd23f" : b.col; g.globalAlpha = b.hp > 1 ? 1 : .88;
    g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 10); g.fill();
    if (b.hp > 1) { g.strokeStyle = "#fff"; g.lineWidth = 3; g.stroke(); }
    g.globalAlpha = 1; g.fillStyle = "#0e1626"; g.font = "800 19px 'Pretendard Variable', sans-serif"; g.fillText(b.power ? "★" : b.label, b.x + b.w / 2, b.y + 22);
    g.font = "500 13px 'JetBrains Mono', monospace"; g.fillText(b.d, b.x + b.w / 2, b.y + 38);
  }
  // 노트북 판
  const p = S.pad; g.fillStyle = "#c9d3e6"; g.beginPath(); g.roundRect(p.x - p.w / 2, H - 100, p.w, 18, 6); g.fill();
  g.fillStyle = "#8b97ad"; g.beginPath(); g.roundRect(p.x - p.w / 2 - 12, H - 84, p.w + 24, 8, 4); g.fill();
  g.fillStyle = "#48dbfb"; g.fillRect(p.x - 10, H - 96, 20, 4);
  for (const b of S.balls) { g.fillStyle = "#fff"; g.shadowColor = "#48dbfb"; g.shadowBlur = 18; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill(); g.shadowBlur = 0; }
  for (const s of S.sparks) { g.globalAlpha = s.life; g.fillStyle = s.col; g.fillRect(s.x, s.y, 5, 5); }
  g.globalAlpha = 1;
  for (const s of S.pops) { g.globalAlpha = Math.min(1, s.life); g.fillStyle = "#fff"; g.font = "800 28px 'Pretendard Variable', sans-serif"; g.fillText(s.t, s.x, s.y); }
  g.globalAlpha = 1;
  if (S.stuck && over.hidden) { g.fillStyle = "rgba(234,240,255,.7)"; g.font = "500 22px 'JetBrains Mono', monospace"; g.fillText("누르면 발사", W / 2, H - 170); }
  g.restore();
}

let running = false;
function loop() { if (!running) return; step(); draw(); requestAnimationFrame(loop); }
function end(win) {
  running = false; const best = Math.max(store.get(), S.score); store.set(best);
  over.hidden = false; over.querySelector("h1").innerHTML = win ? "마감<br><span>전부 끝!</span>" : "마감<br><span>놓침</span>";
  msg.textContent = `점수 ${S.score}`; goBtn.textContent = "다시"; bestEl.textContent = `내 최고 ${best}`;
}
goBtn.onclick = () => { over.hidden = true; reset(); running = true; loop(); };
bestEl.textContent = store.get() ? `내 최고 ${store.get()}` : "";
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + "px"; cv.style.height = H * s + "px"; }
addEventListener("resize", fit); fit();
reset(); draw();
</script>
</body>
</html>
