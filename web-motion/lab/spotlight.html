<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 위 카드 · 데모 5</title>
<link rel="stylesheet" href="lab.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* 어두운 무대, 위에서 떨어지는 빛기둥 아래 3D 카드가 스크롤마다 뒤집히며 작품을 보여 줌 */
body { background: #121110; color: #f3efe6; height: 500vh }
.big { position: fixed; z-index: 0; left: 0; right: 0; bottom: -2vw; white-space: nowrap; font: 800 clamp(90px, 19vw, 300px)/1 "Pretendard Variable", sans-serif; letter-spacing: -.06em; color: #1e1c1a; pointer-events: none; will-change: transform }
canvas.bg { z-index: 1 }
.info { position: fixed; z-index: 2; left: clamp(16px, 4vw, 56px); top: 50%; transform: translateY(-50%); max-width: 22ch; pointer-events: none }
.info small { display: block; margin-bottom: 10px; color: var(--accent, #ffb340); transition: color .6s }
.info h2 { margin: 0 0 10px; font-size: clamp(28px, 3.6vw, 52px); line-height: 1.05; letter-spacing: -.04em; font-weight: 800 }
.info p { margin: 0; opacity: .7 }
.info .fade { transition: opacity .35s }
.dots { position: fixed; z-index: 2; right: clamp(16px, 4vw, 56px); top: 50%; transform: translateY(-50%); display: grid; gap: 10px }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: #f3efe6; opacity: .25; transition: opacity .3s, transform .3s }
.dots i.on { opacity: 1; transform: scale(1.4) }
@media (max-width: 700px) { .info { top: auto; bottom: 8vh; transform: none } .dots { top: 70px; transform: none } }
</style>
</head>
<body>
<nav class="hud mono"><a href="../#more">← 움직이는 웹사이트</a><span class="right"><a href="particles.html">← 이전</a><span>데모 5 / 7 · 무대 조명</span><a href="breaker.html">다음 →</a></span></nav>
<div class="big" id="big">작업실 무대 · 작업실 무대 · 작업실 무대 ·</div>
<canvas class="bg" id="cv"></canvas>
<div class="info"><div class="fade" id="info"></div></div>
<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>

<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// 카드 네 장: 작업실의 실제 작품 이름, 그림은 코드로 그린 표지
const works = [
  { tag: "게임", title: "넋굿", note: "동양풍 3D 로그라이트", c: "#ffb340", draw: g => { g.fillStyle = "#2a1a12"; g.fillRect(0, 0, 512, 720); for (let i = 0; i < 9; i++) { g.strokeStyle = `rgba(255,179,64,${.15 + i * .08})`; g.lineWidth = 6; g.beginPath(); g.arc(256, 300, 40 + i * 22, Math.PI * (1 + i * .05), Math.PI * (2 - i * .05)); g.stroke(); } } },
  { tag: "프로젝트", title: "우리달", note: "둘이 같이 쓰는 달력 앱", c: "#ff8fa3", draw: g => { g.fillStyle = "#2b1820"; g.fillRect(0, 0, 512, 720); for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) { g.fillStyle = (r * 7 + c) % 9 === 3 ? "#ff8fa3" : "rgba(255,255,255,.12)"; g.beginPath(); g.roundRect(70 + c * 54, 160 + r * 62, 42, 48, 8); g.fill(); } } },
  { tag: "공부", title: "인공지능 입문", note: "탐색부터 게임 트리까지", c: "#7cc4ff", draw: g => { g.fillStyle = "#121c26"; g.fillRect(0, 0, 512, 720); const node = (x, y, d) => { if (d > 3) return; [-1, 1].forEach(s => { const nx = x + s * 110 / d, ny = y + 90; g.strokeStyle = "rgba(124,196,255,.6)"; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y); g.lineTo(nx, ny); g.stroke(); node(nx, ny, d + 1); }); g.fillStyle = "#7cc4ff"; g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); }; node(256, 150, 1); } },
  { tag: "프로젝트", title: "덜미", note: "터미널에서 대화하는 C 메신저", c: "#8ef0b0", draw: g => { g.fillStyle = "#0f1a14"; g.fillRect(0, 0, 512, 720); g.font = "500 26px 'JetBrains Mono', monospace"; ["$ ./deolmi --host", "> 방을 열었어요", "> 지우: 안녕", "> 나: 잘 들려?", "$ _"].forEach((l, i) => { g.fillStyle = i % 2 ? "#8ef0b0" : "rgba(255,255,255,.75)"; g.fillText(l, 60, 180 + i * 56); }); } }
];
function face(w) {
  const k = document.createElement("canvas"); k.width = 512; k.height = 720; const g = k.getContext("2d");
  w.draw(g);
  g.fillStyle = w.c; g.font = "800 64px 'Pretendard Variable', sans-serif"; g.fillText(w.title, 48, 610);
  g.fillStyle = "rgba(255,255,255,.6)"; g.font = "500 22px 'JetBrains Mono', monospace"; g.fillText(w.note, 50, 660);
  const t = new THREE.CanvasTexture(k); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
await document.fonts.load("800 64px 'Pretendard Variable'").catch(() => {});
const faces = works.map(face);

const cv = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .15;
const camera = new THREE.PerspectiveCamera(35, 1, .1, 100); camera.position.set(0, .4, 9); camera.lookAt(0, .2, 0);

// 카드: 앞면·뒷면 두 장의 그림을 번갈아 바꿔 끼우며 뒤집음
const front = new THREE.MeshStandardMaterial({ map: faces[0], roughness: .35 });
const back = new THREE.MeshStandardMaterial({ map: faces[1], roughness: .35 });
const edge = new THREE.MeshStandardMaterial({ color: "#222", roughness: .4, metalness: .6 });
const card = new THREE.Group();
const slab = new THREE.Mesh(new RoundedBoxGeometry(2.4, 3.375, .06, 4, .05), edge); slab.castShadow = true; card.add(slab);
const fA = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 3.24), front); fA.position.z = .032; card.add(fA);
const fB = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 3.24), back); fB.position.z = -.032; fB.rotation.y = Math.PI; card.add(fB);
scene.add(card);

const spot = new THREE.SpotLight("#ffb340", 220, 30, .34, .55, 1.6);
spot.position.set(0, 9, 2); spot.target = card; spot.castShadow = true; scene.add(spot);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: "#1a1816", roughness: .9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.4; floor.receiveShadow = true; scene.add(floor);

// 빛기둥: 위가 좁고 아래가 넓은 원뿔에, 가장자리·아래로 갈수록 옅어지는 색
const beamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  uniforms: { col: { value: new THREE.Color("#ffb340") }, time: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying float vY; void main(){ vY = uv.y; vec4 w = modelViewMatrix * vec4(position,1.); vN = normalize(normalMatrix*normal); vV = normalize(-w.xyz); gl_Position = projectionMatrix * w; }`,
  fragmentShader: `uniform vec3 col; uniform float time; varying vec3 vN; varying vec3 vV; varying float vY;
    void main(){ float rim = pow(abs(dot(vN, vV)), 2.2); float a = rim * pow(vY, 1.4) * .5 * (0.9 + 0.1*sin(time*3. + vY*20.)); gl_FragColor = vec4(col, a); }`
});
const beam = new THREE.Mesh(new THREE.CylinderGeometry(.18, 2.6, 11, 48, 1, true), beamMat);
beam.position.set(0, 3.3, .3); scene.add(beam);
// 빛 속 먼지
const DN = 900, dp = new Float32Array(DN * 3);
for (let i = 0; i < DN; i++) { const y = Math.random(), r = (.2 + y * 2.3) * Math.sqrt(Math.random()), a = Math.random() * 7; dp.set([Math.cos(a) * r, 8.8 - y * 11, Math.sin(a) * r + .3], i * 3); }
const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(dp, 3)), new THREE.PointsMaterial({ color: "#ffd9a0", size: .03, transparent: true, opacity: .6, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.position.z = innerWidth < 700 ? 12.5 : 9; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

const info = document.getElementById("info"), dots = [...document.querySelectorAll(".dots i")], big = document.getElementById("big");
let target = 0, p = 0, mx = 0, my = 0, shown = -1;
addEventListener("scroll", () => target = scrollY / (document.documentElement.scrollHeight - innerHeight) * (works.length - 1), { passive: true });
addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
const col = new THREE.Color(), clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  p += (target - p) * .08;
  const i = Math.min(works.length - 2, Math.floor(p)), k = p - i;
  const flip = THREE.MathUtils.smoothstep(k, .25, .75);
  // 뒤집기: 지금 카드가 앞, 다음 카드가 뒤 — 반 바퀴 돌면 다음 카드가 보임
  front.map = faces[i]; back.map = faces[i + 1];
  card.rotation.y = flip * Math.PI + mx * .5;
  card.rotation.x = -my * .3 + Math.sin(t * .8) * .03;
  card.position.y = .2 + Math.sin(t * 1.1) * .06 + Math.sin(flip * Math.PI) * .5;
  const cur = flip > .5 ? i + 1 : i;
  col.set(works[i].c).lerp(new THREE.Color(works[i + 1].c), flip);
  spot.color.copy(col); beamMat.uniforms.col.value.copy(col); dust.material.color.copy(col).lerp(new THREE.Color("#fff"), .5);
  beamMat.uniforms.time.value = t; dust.rotation.y = t * .05;
  spot.intensity = 220 * (1 - Math.sin(flip * Math.PI) * .6);
  if (cur !== shown) {
    shown = cur; const w = works[cur];
    info.style.opacity = 0;
    setTimeout(() => { info.innerHTML = `<small class="mono">${String(cur + 1).padStart(2, "0")} · ${w.tag}</small><h2>${w.title}</h2><p>${w.note}</p>`; info.style.opacity = 1; document.documentElement.style.setProperty("--accent", w.c); }, 200);
    dots.forEach((d, j) => d.classList.toggle("on", j === cur));
  }
  big.style.transform = `translateX(${-p * 22}vw)`;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
