<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한 학기 쌓기 · 작업실 적용 3</title>
<link rel="stylesheet" href="apply.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
/* 스크롤 카메라(Quai·데모 C)를 작업실 git 기록으로: 저장 한 번 = 종이 한 장, 날마다 쌓이는 더미 위를 지나감 */
body { height: 900svh }
canvas.bg { z-index: 0 }
.day { position: fixed; z-index: 2; left: var(--m); top: clamp(84px, 13vh, 130px); max-width: min(560px, calc(100vw - 2 * var(--m))); pointer-events: none }
.day .fade { transition: opacity .25s, transform .25s }
.day .fade.out { opacity: 0; transform: translateY(8px) }
.day .date { color: var(--muted) }
.day .n { display: flex; align-items: baseline; gap: 14px; margin: 4px 0 10px }
.day .n b { font: 200 clamp(96px, 13vw, 210px)/.8 var(--serif); letter-spacing: -.04em }
.day .n span { font: 300 clamp(20px, 2vw, 28px) var(--serif) }
.day .what { font-size: clamp(16px, 1.2vw, 19px) }
.hero { position: fixed; z-index: 2; left: var(--m); top: 18vh; transition: opacity .4s; pointer-events: none }
.hero h1 { font-size: clamp(46px, 7vw, 120px); line-height: 1.08 }
.hero p { margin-top: 18px; color: var(--muted) }
.key { position: fixed; z-index: 2; right: var(--m); bottom: clamp(28px, 7vh, 72px); display: grid; gap: 6px; justify-items: start }
.key span { display: flex; align-items: center; gap: 8px }
.key i { width: 18px; height: 6px; outline: 1px solid rgb(0 0 0 / .25) }
.end { position: fixed; z-index: 2; left: 50%; top: 16vh; transform: translateX(-50%); text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; width: max-content; max-width: calc(100vw - 32px) }
.end.on { opacity: 1; pointer-events: auto }
.end h2 { font-size: clamp(40px, 5.6vw, 92px) }
.end .go { margin-top: 26px }
.lbl { position: fixed; z-index: 1; top: 0; left: 0; color: var(--muted); white-space: nowrap; pointer-events: none; transform: translate(-50%, 0) }
@media (max-width: 700px) { .key { top: 58px; bottom: auto; grid-auto-flow: column; gap: 12px } .hero { top: 22vh } .day { top: 96px } .day .n b { font-size: 88px } }
</style>
</head>
<body>
<nav class="top mono"><a href="../#apply">← 움직이는 웹사이트</a><span class="right"><a href="dots.html">← 이전</a><span>작업실 적용 3 / 3 · 한 학기 쌓기</span></span></nav>
<canvas class="bg" id="cv"></canvas>
<div id="lbls"></div>
<div class="hero" id="hero"><h1>한 학기를<br><b>쌓아</b> 보면</h1><p class="mono">작업실에 저장한 기록 한 번 = 종이 한 장 · 내려 보세요</p></div>
<div class="day"><div class="fade" id="day"></div></div>
<div class="key mono" id="key"></div>
<div class="end" id="end"><h2>16일 동안<br><b>234</b>장</h2><a class="go" href="../../">작업실로 →</a></div>

<script type="module">
import * as THREE from "three";
// git log 그대로: 날짜, 그날 저장들을 분류 순서대로(s 공부, p 프로젝트, g 게임, e 작업실·기타), 그날 한 일
const DAYS = [
  ["10.20", "sssssssss", "C 복습 사이트 · AI 3장 영상 강의"],
  ["10.23", "sssssssssss", "인공지능 입문 노트 · 퀴즈"],
  ["10.24", "ssss", "AI 3장 녹음 정리"],
  ["10.25", "ssssssssss", "코드 작성 연습 칸"],
  ["10.26", "ssss", "강의 예제·Lab 16문제"],
  ["10.27", "ppppppppeg", "레이싱 휠 발표·3D 설계 · 브라운 로그 도록 · 첫 화면 분류"],
  ["10.29", "pppppeppppppppeeeeeeeesesssepppp", "덜미 · 진로 · 현장실습 · 매일 AI 공부 · 학과 진로 지도"],
  ["10.30", "pppp", "학과 진로 지도 새로 짓기"],
  ["10.31", "ppppppep", "LMS 알림 기획서 · 덜미 설명서"],
  ["11.01", "sssssppeessesseessppepeepppepppeeppeepppsgsesgsggsspssssssssssssssssss", "우리달 · 우리길 · 마디 · 인간과 성서 · 잠금"],
  ["11.02", "sssssssspppppepsspsssssspsspp", "박물관 감상문 · 마디 움직임 비교 · 덜미"],
  ["11.03", "peppppppppeee", "덜미 정리 · 저장공간 정리"],
  ["11.04", "peeeespppeeeeeepppppppppppeppp", "움직이는 웹사이트 · 파트 분배 · 액셀 페달 3D"],
];
const KIND = { s: ["공부", 0xfbfaf5], p: ["프로젝트", 0x2b44a6], g: ["게임", 0x1d1e21], e: ["작업실·기타", 0xcfcabb] };
document.getElementById("key").innerHTML = "spge".split("").map(k => `<span><i style="background:#${KIND[k][1].toString(16).padStart(6, "0")}"></i>${KIND[k][0]}</span>`).join("");

// 날짜 → 가로 자리 (커밋 없는 날도 칸을 비워 둠)
const dayNo = s => { const [m, d] = s.split(".").map(Number); return m === 10 ? d - 20 : d + 11; };
const GAP = 2.4, TH = .045;
const X = DAYS.map(d => dayNo(d[0]) * GAP);
const TOTAL = DAYS.reduce((a, d) => a + d[1].length, 0);

const cv = document.getElementById("cv");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setClearColor(0xf2f1ec);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf2f1ec, 14, 46);
const cam = new THREE.PerspectiveCamera(38, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d6cc, 1.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-6, 14, 9); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 5;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 12, bottom: -12, near: 1, far: 50 });
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 60), new THREE.ShadowMaterial({ opacity: .13 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// 시간 줄과 날짜 눈금
const ink = new THREE.MeshBasicMaterial({ color: 0x151514 });
const span = dayNo("11.05") * GAP;
const line = new THREE.Mesh(new THREE.BoxGeometry(span + 4, .006, .012), ink); line.position.set(span / 2 - 1, .003, 1.05); scene.add(line);
for (let i = 0; i <= dayNo("11.05"); i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(.012, .006, i % 5 ? .1 : .22), ink); t.position.set(i * GAP, .003, 1.05 + (i % 5 ? .05 : .11)); scene.add(t); }

// 종이: 장마다 살짝 비틀어 쌓음
const sheets = new THREE.InstancedMesh(new THREE.BoxGeometry(1.5, TH * .8, 1.06), new THREE.MeshStandardMaterial({ roughness: .85 }), TOTAL);
sheets.castShadow = sheets.receiveShadow = true; sheets.frustumCulled = false; scene.add(sheets);   // 처음엔 다 숨어 있어 경계가 작게 잡히므로 끔
const S = []; // [날 j, 그날 몇째, 회전, 어긋남x, 어긋남z]
const col = new THREE.Color();
DAYS.forEach((d, j) => [...d[1]].forEach((k, s) => {
  S.push([j, s, (Math.random() - .5) * .2, (Math.random() - .5) * .07, (Math.random() - .5) * .06]);
  sheets.setColorAt(S.length - 1, col.setHex(KIND[k][1]));
}));
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e3 = new THREE.Euler(), v = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1), zero = new THREE.Vector3();

// 날짜 글씨는 화면 위에 HTML로 (더미 앞 바닥에 붙여서)
const lbls = document.getElementById("lbls");
lbls.innerHTML = DAYS.map(d => `<span class="lbl mono">${d[0]}</span>`).join("");
const L = [...lbls.children];

function resize() {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight; cam.fov = innerWidth < 700 ? 52 : 38; cam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sm = x => (x = cl(x), x * x * (3 - 2 * x));
const out = x => 1 - (1 - cl(x)) ** 3;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur = -2, u = 0;
const camPos = new THREE.Vector3(), look = new THREE.Vector3(), wide = new THREE.Vector3(), wideLook = new THREE.Vector3();

function frame() {
  const max = document.documentElement.scrollHeight - innerHeight;
  const goal = cl(scrollY / Math.max(1, max));
  u += (goal - u) * (calm ? 1 : .09);
  // 0~.06 처음 · .06~.86 날을 따라 이동 · .86~1 한눈에
  const walk = cl((u - .06) / .8), pull = sm((u - .86) / .12);
  const narrow = innerWidth < 700, last = X[X.length - 1];
  const cx = -1.5 + walk * (last + 2.3);   // 마지막 날을 조금 지나야 그날 종이가 다 내려앉음
  // 한눈에: 넓은 화면은 정면에서 전부, 좁은 화면은 끝에서 비스듬히 줄을 따라
  if (narrow) { wide.set(last + 11, 9, 3.4); wideLook.set(last * .45, -1.2, -1.1); }
  else { const d = (last / 2 + 3) / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) / cam.aspect; wide.set(last / 2, d * .42, d * .95); wideLook.set(last / 2, 2.4, 0); }
  scene.fog.near = 14 + pull * 30; scene.fog.far = 46 + pull * 80;
  camPos.set(cx - 2.6, narrow ? 4.6 : 3.4, narrow ? 9.5 : 7.2).lerp(wide, pull);
  look.set(cx + .6, narrow ? 1.6 : 1.1, 0).lerp(wideLook, pull);
  cam.position.copy(camPos); cam.lookAt(look);
  sun.position.set(camPos.x - 6, 14, 9); sun.target.position.set(camPos.x, 0, 0);

  // 카메라가 다가가면 그날 종이가 위에서 차례로 떨어짐
  for (let i = 0; i < S.length; i++) {
    const [j, s, r, ox, oz] = S[i], n = DAYS[j][1].length;
    const arrive = Math.max(pull, cl((cx - X[j] + 1.6) / 2.2));
    const a = calm ? (arrive > 0 ? 1 : 0) : out((arrive - s / n * .75) / .25);
    if (a <= 0) { m4.compose(zero, q, zero); sheets.setMatrixAt(i, m4); continue; }
    v.set(X[j] + ox, (s + .5) * TH + (1 - a) * 3.5, oz);
    q.setFromEuler(e3.set(0, r + (1 - a) * 1.2, (1 - a) * .3));
    sheets.setMatrixAt(i, m4.compose(v, q, one));
  }
  sheets.instanceMatrix.needsUpdate = true;
  renderer.render(scene, cam);

  // 날짜 글씨 자리
  for (let j = 0; j < L.length; j++) {
    v.set(X[j], 0, 1.45).project(cam);
    const vis = v.z < 1 && v.x > -1.1 && v.x < 1.1;
    L[j].style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px, ${(1 - v.y) / 2 * innerHeight}px) translateX(-50%)`;
    const crowd = narrow && pull > .3 && j > 0 && j < L.length - 1;   // 좁은 화면 한눈에 볼 땐 처음·끝 날짜만
    L[j].style.opacity = vis && !crowd ? 1 - pull * .3 : 0;
  }
  // 지금 보는 날
  document.getElementById("hero").style.opacity = 1 - sm(u / .05);
  let near = -1;
  if (u > .045 && pull < .5) { let best = 1e9; X.forEach((x, j) => { const d = Math.abs(x - cx - .2); if (d < best) { best = d; near = j; } }); }
  if (near !== cur) day(near);
  document.getElementById("end").classList.toggle("on", pull > .7);
  requestAnimationFrame(frame);
}

let tm;
function day(j) {
  cur = j; const el = document.getElementById("day");
  el.classList.add("out"); clearTimeout(tm);
  if (j < 0) return;
  tm = setTimeout(() => {
    const [d, s, w] = DAYS[j], [m, dd] = d.split(".");
    el.innerHTML = `<p class="date mono">${+m}월 ${+dd}일</p><p class="n"><b>${s.length}</b><span>장</span></p><p class="what">${w}</p>`;
    el.classList.remove("out");
  }, calm ? 0 : 150);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
