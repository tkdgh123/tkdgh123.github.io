<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>옷 갈아입는 쫄라맨 · 작업실 적용 4</title>
<link rel="stylesheet" href="apply.css">
<style>
/* 작품마다 옷을 갖춰 입은 쫄라맨(그림: Gemini)이 제목 위에서 그 작품다운 동작을 함. 넘길 땐 옷을 벗고 펄쩍 뛰어 새 제목 위에서 새 옷을 입음 */
body { height: 100svh; overflow: hidden; background: var(--paper); user-select: none; -webkit-user-select: none }
canvas.bg { z-index: 1; touch-action: none }
.ttl { position: fixed; z-index: 2; left: 0; right: 0; top: var(--gy, 64svh); margin: 0; padding: 0 var(--m); text-align: center; font: 300 var(--fs, 120px)/1.08 var(--serif); letter-spacing: -.03em; pointer-events: none }
.ttl a { pointer-events: auto; text-decoration: none; display: inline-block; overflow: hidden; padding: 0 .04em .12em; vertical-align: top }
.ttl a:hover { text-decoration: underline 2px; text-underline-offset: .14em }
.ttl i { font-style: normal; display: inline-block; white-space: pre; will-change: transform }
.ttl.out { z-index: 3; pointer-events: none }
.ttl.out a { overflow: visible; pointer-events: none }
.nav { position: fixed; z-index: 4; left: 50%; bottom: clamp(18px, 4vh, 36px); transform: translateX(-50%); display: flex; align-items: center; gap: 14px }
.nav button { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--rule); background: none; color: var(--ink); font-size: 16px; cursor: pointer; transition: border-color .2s }
.nav button:hover { border-color: var(--ink) }
.nav span { min-width: 64px; text-align: center }
.nav b { font-weight: 500 }
</style>
</head>
<body>
<nav class="top mono"><a href="../#apply">← 움직이는 웹사이트</a><span class="right"><a href="pile.html">← 이전</a><span>작업실 적용 4 / 4 · 옷 갈아입는 쫄라맨</span></span></nav>
<canvas class="bg" id="cv"></canvas>
<h1 class="ttl" id="ttl"></h1>
<div class="nav mono"><button id="prev" type="button" aria-label="이전 작품">←</button><span id="idx"></span><button id="next" type="button" aria-label="다음 작품">→</button></div>

<script type="module">
import { WORKS, ROOT } from "./works.js";
// 그림 띠 하나 = 칸 6개(0~4 동작, 5 옷 벗기). keys = [칸, 머무는 ms]
const SETS = [
  ["넋굿", "neokgut", [[0, 750], [1, 380], [2, 520], [3, 800], [4, 900]]],
  ["브라운 로그", "brown", [[0, 650], [1, 380], [2, 520], [3, 320], [4, 700]]],
  ["마디", "mardi", [[0, 230], [1, 230], [2, 230], [3, 230], [0, 230], [1, 230], [2, 230], [3, 230], [4, 750]]],
  ["프로그래밍기초 복습 노트", "cnote", [[0, 220], [3, 220], [0, 220], [3, 220], [1, 650], [2, 900], [0, 220], [3, 220], [4, 1100]]],
  ["인공지능 입문 복습 노트", "ai", [[0, 900], [1, 650], [2, 650], [3, 800], [4, 1100]]],
  ["LMS 할 일·알림", "lms", [[0, 900], [1, 650], [2, 500], [3, 600], [4, 1000]]],
  ["덜미", "dulmi", [[0, 650], [1, 600], [2, 500], [3, 800], [4, 900]]],
  ["학과 진로 지도", "jobmap", [[0, 700], [1, 700], [2, 450], [3, 500], [4, 1100]]],
  ["우리달", "uridal", [[0, 700], [1, 550], [2, 650], [3, 700], [4, 900]]],
  ["레이싱 휠", "racing", [[0, 450], [1, 600], [0, 300], [3, 600], [4, 800]]],
  ["액셀 페달 3D", "pedal", [[0, 700], [1, 700], [2, 450], [3, 800], [4, 900]]],
  ["움직이는 웹사이트", "dance", [[0, 330], [1, 330], [0, 330], [1, 330], [2, 450], [3, 450], [4, 900]]],
].map(([t, f, keys]) => ({ t, keys, href: ROOT + WORKS.find(w => w.t === t).href, img: load(`stick/${f}.webp`), total: keys.reduce((a, k) => a + k[1], 0) }));
const BASE = load("stick/base.webp");   // 맨몸: 0 서기, 1 웅크림, 2 점프, 3 내려옴, 4 털기, 5 손 흔들기
function load(src) { const im = new Image(); im.decoding = "async"; im.src = src; return im; }

const cv = document.getElementById("cv"), g = cv.getContext("2d"), ttl = document.getElementById("ttl"), idxEl = document.getElementById("idx");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k;
const io = k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, out = k => 1 - (1 - k) ** 3;
let W, Hh, dpr, K = 1, GY = 0, gyTarget = 0;

function layout() {
  dpr = Math.min(devicePixelRatio, 2); W = innerWidth; Hh = innerHeight;
  cv.width = W * dpr; cv.height = Hh * dpr;
  document.body.style.setProperty("--fs", Math.round(cl(W * .085, 40, 132)) + "px");
  document.body.style.setProperty("--gy", Math.round(Hh * (W < 700 ? .66 : .68)) + "px");
}
function measure() { // 제목 글자 윗선 = 땅, 그림 배율은 남은 높이·너비에 맞춤
  const a = ttl.querySelector("a"); if (!a) return;
  const fs = parseFloat(getComputedStyle(ttl).fontSize);
  gyTarget = a.getBoundingClientRect().top + fs * .2;
  K = Math.min((gyTarget - 70) / 560, W / 590, 1.05);
}
addEventListener("resize", () => { layout(); measure(); GY = gyTarget; });

// 띠의 i번째 칸을 발이 땅(gy)에 닿게 가운데에 그림
function frame(im, i, gy, lift = 0, squash = 1) {
  if (!im.complete || !im.naturalWidth) return false;
  const fw = im.naturalWidth / 6, fh = im.naturalHeight, w = fw * K, h = fh * K, foot = gy - lift + 20 * K;
  g.save(); g.translate(W / 2, foot); g.scale(2 - squash, squash); g.drawImage(im, i * fw, 0, fw, fh, -w / 2, -h, w, h); g.restore();
  return true;
}

/* 제목 */
function setTitle(s) { ttl.innerHTML = `<a href="${s.href}">${[...s.t].map(ch => `<i>${ch === " " ? " " : ch}</i>`).join("")}</a>`; }
function swapTitle(s) {
  const old = ttl.cloneNode(true); old.removeAttribute("id"); old.classList.add("out"); document.body.appendChild(old);
  [...old.querySelectorAll("i")].forEach((el, i) => el.animate([{ transform: "none", opacity: 1 }, { opacity: 0, offset: .14 }, { transform: `translate(${(Math.random() - .5) * 160}px, 55vh) rotate(${(Math.random() - .5) * 160}deg)`, opacity: 0 }],
    { duration: 900, delay: i * 20, easing: "cubic-bezier(.5,0,.9,.45)", fill: "forwards" }));
  setTimeout(() => old.remove(), 1500);
  setTitle(s); measure();
  [...ttl.querySelectorAll("i")].forEach((el, i) => el.animate([{ transform: "translateY(110%)" }, { transform: "none" }], { duration: 600, delay: 220 + i * 32, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }));
}

/* 상태 */
let ci = cl((parseInt(location.hash.slice(1)) || 1) - 1, 0, SETS.length - 1), t0 = performance.now(), trans = null, queued = null, lastF = -1, popAt = 0;
const showIdx = () => { idxEl.innerHTML = `<b>${String(ci + 1).padStart(2, "0")}</b> / ${SETS.length}`; };
function loopFrame(s, t) { t = ((t % s.total) + s.total) % s.total; for (const [f, d] of s.keys) { if (t < d) return f; t -= d; } return s.keys[0][0]; }

function go(d) {
  if (trans) { queued = d; return; }
  const n = (ci + d + SETS.length) % SETS.length;
  if (calm) { ci = n; setTitle(SETS[ci]); measure(); GY = gyTarget; t0 = performance.now(); showIdx(); history.replaceState(null, "", "#" + (ci + 1)); return; }
  trans = { from: ci, to: n, at: performance.now(), gy0: GY, swapped: false };
}

// 넘어가기: 옷 벗기(앞 작품 6칸) → 웅크림 → 점프(제목 바뀜) → 내려와 새 제목에 착지 → 옷 입기(새 작품 6칸) → 새 동작
const STEPS = [[0, "A5", 520], [1, "B1", 170], [2, "B2", 380], [3, "B3", 240], [4, "B1", 150], [5, "B0", 160], [6, "N5", 520]];
function draw(now) {
  requestAnimationFrame(draw);
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, Hh);
  let im, f, lift = 0, key;
  if (trans) {
    const tt = now - trans.at, A = SETS[trans.from], B = SETS[trans.to];
    let s = 0, step = STEPS[STEPS.length - 1], u = 1;
    for (const st of STEPS) { if (tt < s + st[2]) { step = st; u = (tt - s) / st[2]; break; } s += st[2]; }
    const total = STEPS.reduce((a, st) => a + st[2], 0);
    if (step[0] === 2) { // 공중: 위로 솟았다 내려옴, 이때 제목이 바뀜
      if (!trans.swapped) { trans.swapped = true; swapTitle(B); }
      lift = Math.sin(Math.PI * Math.min(1, u * .9 + .1)) * 70 * K;
    }
    if (step[0] === 3) lift = (1 - out(u)) * 30 * K;
    if (trans.swapped) GY = lerp(trans.gy0, gyTarget, io(cl((tt - 690) / 500)));
    const who = step[1][0], fi = +step[1][1];
    im = who === "A" ? A.img : who === "N" ? B.img : BASE; f = fi; key = step[1];
    if (tt >= total) { ci = trans.to; t0 = now; trans = null; showIdx(); history.replaceState(null, "", "#" + (ci + 1)); if (queued !== null) { const q = queued; queued = null; go(q); } }
  } else { const s = SETS[ci]; im = s.img; f = loopFrame(s, now - t0); key = "L" + f; }
  if (key !== lastF) { lastF = key; popAt = now; }
  // 칸이 바뀔 때 살짝 눌렸다 펴지고, 가만히 있을 땐 숨쉬듯
  const p = cl((now - popAt) / 160), squash = 1 - (1 - out(p)) * .035 + Math.sin(now / 520) * .004;
  if (!frame(im, f, GY, lift, squash)) frame(BASE, 0, GY);
}

/* 조작 */
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
let wt = 0; addEventListener("wheel", e => { e.preventDefault(); const t = performance.now(); if (t - wt < 900) return; wt = t; go(Math.sign(Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)); }, { passive: false });
let sx = null; cv.addEventListener("pointerdown", e => { sx = e.clientX; }); addEventListener("pointerup", e => { if (sx !== null && Math.abs(e.clientX - sx) > 40) go(e.clientX < sx ? 1 : -1); sx = null; });

layout(); setTitle(SETS[ci]); showIdx(); measure(); GY = gyTarget;
document.fonts.ready.then(() => { measure(); GY = gyTarget; });
requestAnimationFrame(draw);
</script>
</body>
</html>
