<script type="module">
import { WORKS, ROOT } from "./works.js";
const INK = "#151514", PAPER = "#fbfaf6";
const D = Math.PI / 180;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const L2 = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k)];
const rnd = (a, b) => a + Math.random() * (b - a);
const E = { l: k => k, io: k => k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, o: k => 1 - (1 - k) ** 3, i: k => k * k * k, b: k => 1 + 2.7 * (k - 1) ** 3 + 1.7 * (k - 1) ** 2 };
const bounce = k => { const n = 7.5625, d = 2.75; return k < 1 / d ? n * k * k : k < 2 / d ? n * (k -= 1.5 / d) * k + .75 : k < 2.5 / d ? n * (k -= 2.25 / d) * k + .9375 : n * (k -= 2.625 / d) * k + .984375; };
// 각도: 0 = 아래, 90 = 오른쪽, 180 = 위, -90 = 왼쪽
const at = (p, a, l) => [p[0] + Math.sin(a * D) * l, p[1] + Math.cos(a * D) * l];
const ang = (p, q) => Math.atan2(q[1] - p[1], q[0] - p[0]);
const norm = (p, q) => { const d = Math.hypot(q[0] - p[0], q[1] - p[1]) || 1; return [(q[0] - p[0]) / d, (q[1] - p[1]) / d]; };

/* ───────── 몸 ───────── */
const LEN = { T: .34, N: .035, R: .13, UA: .2, FA: .19, TH: .245, SH: .245 };
const BASE = { x: 0, y: 0, g: 1, t: 0, h: 0, f: 0, la1: -14, la2: -6, ra1: 14, ra2: 6, ll1: -9, ll2: -5, rl1: 9, rl2: 5, m: 0,
  ik: 0, ikL: 0, ikR: 0, ikf: 0, st: 0, sw: 0, pd: 26, pg: 0, row: 0, env: 1 };
const STAND = {}, CROUCH = { la1: -38, la2: -18, ra1: 38, ra2: 18, ll1: -42, ll2: 4, rl1: 42, rl2: -4, m: 2 };
const HOP = { la1: -155, la2: -172, ra1: 155, ra2: 172, ll1: -16, ll2: -30, rl1: 16, rl2: 30, y: -.4, m: 3 };
const LAND = { la1: -70, la2: -95, ra1: 70, ra2: 95, ll1: -12, ll2: -6, rl1: 12, rl2: 6 };

function rig(p, S, gx, gy, now) {
  const hip = [0, 0], neck = at(hip, 180 - p.t, LEN.T), head = at(neck, 180 - p.t - p.h, LEN.N + LEN.R), sh = at(neck, -p.t, .03);
  const eL = at(sh, p.la1, LEN.UA), hL = at(eL, p.la2, LEN.FA), eR = at(sh, p.ra1, LEN.UA), hR = at(eR, p.ra2, LEN.FA);
  const kL = at(hip, p.ll1, LEN.TH), fL = at(kL, p.ll2, LEN.SH), kR = at(hip, p.rl1, LEN.TH), fR = at(kR, p.rl2, LEN.SH);
  const low = p.g ? Math.max(fL[1], fR[1], kL[1], kR[1]) + .018 : .47;
  const ox = gx + p.x * S, oy = gy - low * S + p.y * S, px = q => [ox + q[0] * S, oy + q[1] * S];
  const th = (p.t + p.h) * D;
  return { p, S, gx, gy, now, hip: px(hip), neck: px(neck), head: px(head), sh: px(sh), eL: px(eL), hL: px(hL), eR: px(eR), hR: px(hR),
    kL: px(kL), fL: px(fL), kR: px(kR), fR: px(fR), R: LEN.R * S, lw: S * .034, ol: Math.max(1.3, S * .0085),
    ct: Math.cos(p.t * D), st: Math.sin(p.t * D), hc: Math.cos(th), hs: Math.sin(th) };
}
// 몸통 기준 점(목이 원점, y는 엉덩이 쪽, 단위 S) · 머리 기준 점(머리 가운데가 원점, 단위 머리 반지름)
const T = (r, x, y) => [r.neck[0] + (x * r.ct - y * r.st) * r.S, r.neck[1] + (x * r.st + y * r.ct) * r.S];
const H = (r, x, y, d) => { if (d) x *= r.p.f; return [r.head[0] + (x * r.hc - y * r.hs) * r.R, r.head[1] + (x * r.hs + y * r.hc) * r.R]; };
function solve(a, b, l1, l2, bend) {
  const d = Math.hypot(b[0] - a[0], b[1] - a[1]), dd = cl(d, 1e-3, l1 + l2 - 1e-3), base = ang(a, b);
  const t = base + bend * Math.acos(cl((l1 * l1 + dd * dd - l2 * l2) / (2 * l1 * dd), -1, 1));
  const j = [a[0] + Math.cos(t) * l1, a[1] + Math.sin(t) * l1], e = ang(j, b);
  return [j, [j[0] + Math.cos(e) * l2, j[1] + Math.sin(e) * l2]];
}
// 팔·다리 끝을 목표에 붙임(w만큼 섞음)
function reach(r, limb, target, w, bend) {
  if (w <= 0) return;
  const [root, j, e, l1, l2] = { L: ["sh", "eL", "hL", LEN.UA, LEN.FA], R: ["sh", "eR", "hR", LEN.UA, LEN.FA], fL: ["hip", "kL", "fL", LEN.TH, LEN.SH], fR: ["hip", "kR", "fR", LEN.TH, LEN.SH] }[limb];
  const [J, X] = solve(r[root], target, l1 * r.S, l2 * r.S, bend);
  r[j] = L2(r[j], J, w); r[e] = L2(r[e], X, w);
}

/* ───────── 그리기 도구 ───────── */
function path(g, pts, close) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); if (close) g.closePath(); }
function shape(g, r, pts, c, line = true) { path(g, pts, 1); g.fillStyle = c; g.fill(); if (line) { g.lineJoin = "round"; g.lineWidth = r.ol; g.strokeStyle = INK; g.stroke(); } }
function band(g, r, pts, w, c, line = true) {
  path(g, pts); g.lineCap = g.lineJoin = "round";
  if (line) { g.strokeStyle = INK; g.lineWidth = w + r.ol * 2; g.stroke(); }
  g.strokeStyle = c; g.lineWidth = w; g.stroke();
}
function dot(g, p, rad, c, line) { g.beginPath(); g.arc(p[0], p[1], Math.max(.1, rad), 0, 7); g.fillStyle = c; g.fill(); if (line) { g.lineWidth = line; g.strokeStyle = INK; g.stroke(); } }
function inFrame(g, o, a, fn) { g.save(); g.translate(o[0], o[1]); g.rotate(a); fn(); g.restore(); }
function smooth(g, pts, close) { // 점들을 부드러운 곡선으로
  g.beginPath(); g.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  const n = pts.length;
  for (let i = 1; i < (close ? n + 1 : n - 1); i++) { const a = pts[i % n], b = pts[(i + 1) % n]; g.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }
  if (close) g.closePath(); else g.lineTo(pts[n - 1][0], pts[n - 1][1]);
}
const top = (r, c, len = .34, w0 = .088, w1 = .1) => [T(r, -w0, -.012), T(r, w0, -.012), T(r, w1, len), T(r, -w1, len)];
function sleeves(g, r, c, w = .062, k = .82) { band(g, r, [r.sh, r.eL, L2(r.eL, r.hL, k)], w * r.S, c); band(g, r, [r.sh, r.eR, L2(r.eR, r.hR, k)], w * r.S, c); }
function pants(g, r, c, w = .07, k = .9) { band(g, r, [r.hip, r.kL, L2(r.kL, r.fL, k)], w * r.S, c); band(g, r, [r.hip, r.kR, L2(r.kR, r.fR, k)], w * r.S, c); }
function heart(g, x, y, s, c) { g.beginPath(); g.moveTo(x, y + s * .35); g.bezierCurveTo(x - s * .9, y - s * .3, x - s * .35, y - s * .95, x, y - s * .42); g.bezierCurveTo(x + s * .35, y - s * .95, x + s * .9, y - s * .3, x, y + s * .35); g.fillStyle = c; g.fill(); }

function drawBody(g, r, col = INK, w = r.lw) {
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = g.lineJoin = "round";
  path(g, [r.fL, r.kL, r.hip, r.kR, r.fR]); g.stroke();
  path(g, [r.hip, r.neck]); g.stroke();
  path(g, [r.hL, r.eL, r.sh, r.eR, r.hR]); g.stroke();
}
function drawHead(g, r) { dot(g, r.head, r.R, PAPER, r.lw * .9); eyes(g, r); }
function eyes(g, r) {
  const f = r.p.f, sep = .36 * (1 - .55 * Math.abs(f)), cx = .3 * f, m = Math.round(r.p.m);
  const blink = (r.now % 3700) < 120 && m === 0;
  g.fillStyle = g.strokeStyle = INK; g.lineWidth = r.R * .1; g.lineCap = "round";
  for (const s of [-1, 1]) {
    const e = H(r, cx + s * sep / 2, -.05);
    if (m === 1) { g.beginPath(); g.arc(e[0], e[1] + r.R * .06, r.R * .11, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    else if (m === 2) { const k = r.R * .1; path(g, [[e[0] - k * s * -1, e[1] - k], [e[0] + k * s, e[1]], [e[0] - k * s * -1, e[1] + k]]); g.stroke(); }
    else if (blink) { path(g, [[e[0] - r.R * .08, e[1]], [e[0] + r.R * .08, e[1]]]); g.stroke(); }
    else dot(g, e, r.R * (m === 3 ? .12 : .085), INK);
  }
}

/* ───────── 효과(입자) ───────── */
const FX = [];
function spark(x, y, o) { FX.push(Object.assign({ x, y, vx: 0, vy: 0, g: 0, age: 0, life: .8, draw() {} }, o)); }

/* ───────── 작품별 옷·소품·동작 ───────── */
// keys: [들어오는 시간 ms, 이징, 자세, 도착할 때 일어날 일]
const C = [
{ t: "넋굿", base: { f: 1 },
  items: [
    { at: "hip", on: "pop", layer: "back", draw(g, r) { // 여우 꼬리 셋
      for (let i = 0; i < 3; i++) {
        const a = (-128 + i * 26 + Math.sin(r.now / 360 + i * 1.4) * 9) * (r.p.f < 0 ? -1 : 1);
        const base = L2(r.hip, r.neck, .06), tip = at(base, a, .42 * r.S), n = [-(tip[1] - base[1]), tip[0] - base[0]], k = .19;
        const c1 = [lerp(base[0], tip[0], .5) + n[0] * k, lerp(base[1], tip[1], .5) + n[1] * k], c2 = [lerp(base[0], tip[0], .5) - n[0] * k, lerp(base[1], tip[1], .5) - n[1] * k];
        g.beginPath(); g.moveTo(base[0], base[1]); g.quadraticCurveTo(c1[0], c1[1], tip[0], tip[1]); g.quadraticCurveTo(c2[0], c2[1], base[0], base[1]);
        g.fillStyle = "#e8873a"; g.fill(); g.lineWidth = r.ol; g.strokeStyle = INK; g.stroke();
        const t0 = L2(base, tip, .72), m1 = L2(c1, tip, .62), m2 = L2(c2, tip, .62);
        g.beginPath(); g.moveTo(t0[0], t0[1]); g.quadraticCurveTo(m1[0], m1[1], tip[0], tip[1]); g.quadraticCurveTo(m2[0], m2[1], t0[0], t0[1]); g.fillStyle = PAPER; g.fill(); g.stroke();
      } } },
    { at: "neck", on: "wipe", layer: "front", draw(g, r) { // 저고리 + 치마
      const xs = [r.kL[0], r.kR[0]], hy = Math.max(r.kL[1], r.kR[1]) + .05 * r.S;
      shape(g, r, [T(r, -.1, .2), T(r, .1, .2), [Math.max(...xs) + .08 * r.S, hy], [Math.min(...xs) - .08 * r.S, hy]], "#c8323c");
      shape(g, r, top(r, 0, .22, .088, .105), PAPER);
      band(g, r, [T(r, -.055, -.005), T(r, .03, .11)], .022 * r.S, "#2b6cb0", false);
      const sw = Math.sin(r.now / 300) * .02;
      band(g, r, [T(r, .03, .11), T(r, .05 + sw, .27)], .02 * r.S, "#c8323c");
      band(g, r, [T(r, .03, .11), T(r, .0 + sw, .24)], .02 * r.S, "#c8323c");
      sleeves(g, r, PAPER, .062, .8);
      for (const [e, h] of [[r.eL, r.hL], [r.eR, r.hR]]) band(g, r, [L2(e, h, .64), L2(e, h, .8)], .062 * r.S, "#2b6cb0");
    } },
    { at: "head", on: "drop", layer: "head", draw(g, r) { // 여우 귀
      for (const s of [-1, 1]) {
        shape(g, r, [H(r, s * .8, -.52), H(r, s * .18, -.98), H(r, s * .74, -1.66)], "#e8873a");
        shape(g, r, [H(r, s * .66, -.68), H(r, s * .32, -.92), H(r, s * .67, -1.36)], "#f6b6a8", false);
      } } },
    { at: "hR", on: "toss", layer: "hand", draw(g, r) { // 부적
      inFrame(g, r.hR, ang(r.eR, r.hR), () => {
        const S = r.S; g.fillStyle = "#f0c93a"; g.fillRect(-.02 * S, -.03 * S, .15 * S, .06 * S);
        g.lineWidth = r.ol; g.strokeStyle = INK; g.strokeRect(-.02 * S, -.03 * S, .15 * S, .06 * S);
        g.strokeStyle = "#c8323c"; g.lineWidth = r.ol * 1.2; g.beginPath();
        for (let i = 0; i <= 8; i++) g.lineTo((.01 + i * .014) * S, (i % 2 ? -.014 : .014) * S);
        g.stroke();
      }); } },
  ],
  keys: [
    [650, "io", { t: -3, h: -4, ra1: 168, ra2: -100, la1: -22, la2: 72, ll1: -13, ll2: -5, rl1: 13, rl2: 5 }],
    [380, "io", { t: -12, h: -8, ra1: -168, ra2: -150, la1: -42, la2: 28, ll1: -16, ll2: -6, rl1: 26, rl2: 8 }],
    [150, "o", { t: 15, h: 6, ra1: 98, ra2: 94, la1: -48, la2: -28, ll1: -26, ll2: -12, rl1: 33, rl2: 6, m: 2 }, "throw"],
    [820, "io", { t: 9, h: 2, ra1: 92, ra2: 88, la1: 24, la2: 108, ll1: -24, ll2: -10, rl1: 30, rl2: 6, m: 0 }],
    [450, "io", { t: 2, ra1: 60, ra2: 40, la1: -10, la2: 40, ll1: -14, ll2: -6, rl1: 16, rl2: 6 }],
  ],
  on: { throw(r) { // 부적이 날아가 오행 다섯 색으로 터짐
    const s = r.S, h = [...r.hR], a = ang(r.eR, r.hR);
    spark(h[0], h[1], { vx: Math.cos(a) * s * 2.6, vy: Math.sin(a) * s * 2.6 - s * .3, g: s * .9, life: .42, rot: 0,
      draw(g, p) { inFrame(g, [p.x, p.y], p.age * 18, () => { g.fillStyle = "#f0c93a"; g.fillRect(-.06 * s, -.025 * s, .12 * s, .05 * s); g.lineWidth = r.ol; g.strokeStyle = INK; g.strokeRect(-.06 * s, -.025 * s, .12 * s, .05 * s); }); },
      end(p) {
        spark(p.x, p.y, { life: .7, draw(g, q) { const k = E.o(q.age / q.life); g.globalAlpha *= 1 - k; g.lineWidth = s * .012; g.strokeStyle = INK; g.beginPath(); g.arc(q.x, q.y, s * (.05 + .3 * k), 0, 7); g.stroke(); } });
        ["#2b6cb0", "#d64545", "#e0b021", PAPER, INK].forEach((c, i) => { const b = i / 5 * Math.PI * 2 - Math.PI / 2;
          spark(p.x, p.y, { vx: Math.cos(b) * s * 1.1, vy: Math.sin(b) * s * 1.1, life: .9, draw(g, q) { const k = q.age / q.life; g.globalAlpha *= 1 - k * k; dot(g, [q.x, q.y], s * .045 * (1 - k * .5), c, r.ol); } }); });
      } });
  } } },

{ t: "브라운 로그", base: { f: 1, sw: 140 },
  tip: r => [at(r.hR, r.p.sw, .56 * r.S), at(r.hR, r.p.sw, .22 * r.S)],
  items: [
    { at: "hip", on: "pop", layer: "back", draw(g, r) { const f = r.p.f < 0 ? -1 : 1; band(g, r, [[r.hip[0] - .02 * r.S * f, r.hip[1] - .03 * r.S], [r.hip[0] - .36 * r.S * f, r.hip[1] + .12 * r.S]], .03 * r.S, "#2a1d14"); } },
    { at: "neck", on: "wipe", layer: "front", draw(g, r) { // 무복
      pants(g, r, "#4a3424", .088, .86);
      for (const [k, f] of [[r.kL, r.fL], [r.kR, r.fR]]) band(g, r, [L2(k, f, .56), L2(k, f, .86)], .062 * r.S, "#e9e2d0");
      shape(g, r, top(r, 0, .33, .092, .115), "#7a5232");
      band(g, r, [T(r, -.06, 0), T(r, .06, .17)], .03 * r.S, "#e9e2d0");
      band(g, r, [T(r, -.115, .29), T(r, .115, .29)], .042 * r.S, "#2a1d14");
      sleeves(g, r, "#7a5232", .078, .78);
    } },
    { at: "head", on: "drop", layer: "head", draw(g, r) { // 상투와 붉은 머리띠
      dot(g, H(r, -.05, -1.12), r.R * .3, INK);
      const f = r.p.f < 0 ? -1 : 1, start = H(r, -f * .92, -.32), pts = [start];
      for (let j = 1; j <= 5; j++) pts.push([start[0] - f * j * r.R * .34, start[1] + j * r.R * .16 + Math.sin(r.now / 110 + j * .9) * r.R * .14 * j / 5]);
      band(g, r, pts, r.R * .16, "#b8272c");
      g.save(); g.beginPath(); g.arc(r.head[0], r.head[1], r.R + r.lw * .45, 0, 7); g.clip();
      band(g, r, [H(r, -1.2, -.32), H(r, 1.2, -.32)], r.R * .26, "#b8272c"); g.restore();
    } },
    { at: "hR", on: "toss", layer: "hand", draw(g, r) { // 환도
      const S = r.S; inFrame(g, r.hR, Math.atan2(Math.cos(r.p.sw * D), Math.sin(r.p.sw * D)), () => {

  // 바닥 그림자
  g.save(); g.globalAlpha = .1 * cl(1 + p.y * 2.5); g.beginPath(); g.ellipse(r.hip[0], GY, S * .26, S * .025, 0, 0, 7); g.fillStyle = INK; g.fill(); g.restore();
  if (c.fxBack && fxA > 0) c.fxBack(g, r, ltl, fxA);
  // 잔상(움직이는 웹사이트)
  if (c.ghost && !trans) { if (!frame.gt || now - frame.gt > 55) { frame.gt = now; ghosts.push(r); if (ghosts.length > 6) ghosts.shift(); }
    ghosts.forEach((q, i) => { g.globalAlpha = .05 + i * .03; drawBody(g, q, "#2b44a6", q.lw * .9); }); g.globalAlpha = 1; }
  const layer = L => worn.forEach(w => w.it.layer === L && drawItem(w, r, c));
  layer("back");
  drawBody(g, r);
  layer("front");
  drawHead(g, r);
  layer("head");
  // 칼끝 자국
  if (c.tip && !trans) { const [a, b] = c.tip(r); trail.push([a, b, now]); while (trail.length && now - trail[0][2] > 160) trail.shift();
    for (let i = 1; i < trail.length; i++) { const [a0, b0] = trail[i - 1], [a1, b1, t1] = trail[i]; if (Math.hypot(a1[0] - a0[0], a1[1] - a0[1]) < 6) continue;
      g.fillStyle = `rgba(21,21,20,${.28 * (1 - (now - t1) / 160)})`; path(g, [a0, a1, b1, b0], 1); g.fill(); } }
  layer("hand");
  if (c.fx && fxA > 0) c.fx(g, r, ltl, fxA);
  // 입자
  for (let i = FX.length - 1; i >= 0; i--) { const q = FX[i]; q.age += dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.age >= q.life) { FX.splice(i, 1); q.end?.(q); continue; } g.save(); q.draw(g, q); g.restore(); }
  // 벗겨져 날아가는 옷
  for (let i = sprites.length - 1; i >= 0; i--) { const s = sprites[i]; s.age += dt; s.vy += S * 4.2 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
    if (s.age > 1 || s.y > Hh + S) { sprites.splice(i, 1); continue; }
    g.save(); g.globalAlpha = 1 - cl((s.age - .55) / .45); g.translate(s.x, s.y); g.rotate(s.rot); g.drawImage(s.c, -s.sz / 2, -s.sz / 2); g.restore(); }
}

/* ───────── 조작 ───────── */
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
let wt = 0; addEventListener("wheel", e => { e.preventDefault(); const t = performance.now(); if (t - wt < 900) return; wt = t; go(Math.sign(Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)); }, { passive: false });
let sx = null; cv.addEventListener("pointerdown", e => { sx = e.clientX; }); addEventListener("pointerup", e => { if (sx !== null && Math.abs(e.clientX - sx) > 40) go(e.clientX < sx ? 1 : -1); sx = null; });

layout(); setTitle(C[ci]); showIdx();
document.fonts.ready.then(() => { measure(); GY = gyTarget; });
measure(); GY = gyTarget;
requestAnimationFrame(frame);
</script>
