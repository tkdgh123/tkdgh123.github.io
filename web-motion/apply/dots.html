<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>점으로 그린 작품 · 작업실 적용 2</title>
<link rel="stylesheet" href="apply.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
/* 흩어지고 모이는 점(데모 4)을 작업실 대표 그림 다섯 장으로.
   점 2만 2천여 개가 밝기 순서대로 짝을 지어(밝은 점은 다음 그림의 밝은 자리로) 휘어진 길로 날아가 다음 그림이 됨 */
body { background: var(--dark); color: var(--on-dark); height: 600svh; --hud: var(--on-dark) }
canvas.bg { z-index: 0 }
.side { position: fixed; z-index: 2; left: var(--m); top: 50%; transform: translateY(-50%); width: min(30vw, 400px) }
.side .meta { color: var(--on-dark-soft); margin-bottom: 14px }
.side h1 { font-size: clamp(40px, 5vw, 86px); overflow: hidden; padding-bottom: .08em }
.side h1 span { display: inline-block }
.side p.d { margin-top: 18px; color: var(--on-dark-soft); max-width: 19em; text-wrap: pretty }
.side .go { margin-top: 26px }
/* 글이 바뀔 때: 제목은 아래에서 솟고, 나머지는 살짝 늦게 */
.side .meta, .side p.d, .side .go { transition: opacity .35s, transform .45s var(--ease) }
.side h1 span { transition: transform .6s var(--ease) }
.side.out .meta, .side.out p.d, .side.out .go { opacity: 0; transform: translateY(10px); transition-duration: .15s }
.side.out h1 span { transform: translateY(110%); transition: transform .18s ease-in }
.side:not(.out) p.d { transition-delay: .1s } .side:not(.out) .go { transition-delay: .16s }
.bar { position: fixed; z-index: 2; right: var(--m); bottom: clamp(20px, 5vh, 48px); display: flex; gap: 8px }
.bar i { position: relative; width: 28px; height: 2px; background: rgb(238 236 230 / .22); overflow: hidden }
.bar i b { position: absolute; inset: 0; background: currentColor; transform-origin: left; transform: scaleX(var(--f, 0)) }
@media (max-width: 800px) {
  .side { top: auto; bottom: 64px; transform: none; width: auto; right: var(--m) }
  .side p.d { display: none }
  .side .go { margin-top: 18px }
  .bar { bottom: 28px }
}
@media (prefers-reduced-motion: reduce) { .side * { transition: none !important } }
</style>
</head>
<body>
<nav class="top mono"><a href="../#apply">← 움직이는 웹사이트</a><span class="right"><a href="ring.html">← 이전</a><span>작업실 적용 2 / 4 · 점으로 그린 작품</span><a href="pile.html">다음 →</a></span></nav>
<canvas class="bg" id="cv"></canvas>
<div class="side out" id="info"><p class="meta mono" id="meta"></p><h1><span id="ttl">&nbsp;</span></h1><p class="d" id="desc"></p><a class="go" id="open" href="#">열어 보기 →</a></div>
<div class="bar" id="bar"></div>

<script type="module">
import * as THREE from "three";
import { WORKS, ROOT } from "./works.js";
const PICK = ["넋굿", "마디", "우리달", "학과 진로 지도", "액셀 페달 3D"];
const SHOW = PICK.map(t => WORKS.find(w => w.t === t));
const COLS = 200, ROWS = 112, N = COLS * ROWS, K = SHOW.length;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

// 그림 → 칸마다 색(rgb)·보임(a)·밝기. 비율은 그대로 두고 남는 칸은 비움
const load = src => new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; });
const cvs = Object.assign(document.createElement("canvas"), { width: COLS, height: ROWS });
const g = cvs.getContext("2d", { willReadFrequently: true });
function sample(im) {
  g.clearRect(0, 0, COLS, ROWS);
  const s = Math.min(COLS / im.width, ROWS / im.height), w = im.width * s, h = im.height * s;
  g.drawImage(im, (COLS - w) / 2, (ROWS - h) / 2, w, h);
  const px = g.getImageData(0, 0, COLS, ROWS).data, rgb = new Float32Array(N * 3), a = new Float32Array(N), lum = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = px[i * 4] / 255, gg = px[i * 4 + 1] / 255, b = px[i * 4 + 2] / 255;
    rgb[i * 3] = r; rgb[i * 3 + 1] = gg; rgb[i * 3 + 2] = b; a[i] = px[i * 4 + 3] > 128 ? 1 : 0;
    lum[i] = a[i] ? .299 * r + .587 * gg + .114 * b : -1;   // 빈 칸은 가장 어두운 쪽 끝으로
  }
  // 밝은 칸부터 줄 세움: 점 i는 그림마다 i번째로 밝은 칸을 맡음
  const order = Uint32Array.from({ length: N }, (_, i) => i).sort((x, y) => lum[y] - lum[x]);
  return { rgb, a, order };
}
const imgs = (await Promise.all(SHOW.map(w => load(ROOT + w.img)))).map(sample);

// 점마다 고정 난수 4개: 휘는 방향·깊이·반짝임 위상·출발 지연
const rnd = new Float32Array(N * 4); for (let i = 0; i < N * 4; i++) rnd[i] = Math.random() * 2 - 1;
const cellA = new Float32Array(N), cellB = new Float32Array(N), colA = new Float32Array(N * 3), colB = new Float32Array(N * 3), alA = new Float32Array(N), alB = new Float32Array(N);
const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(N * 3), 3));   // 자리는 셰이더가 계산
const attr = (name, arr, n) => geo.setAttribute(name, new THREE.BufferAttribute(arr, n));
attr("cellA", cellA, 1); attr("cellB", cellB, 1); attr("colA", colA, 3); attr("colB", colB, 3); attr("alA", alA, 1); attr("alB", alB, 1); attr("rnd", rnd, 4);
let seg = -1;
function useSegment(k) {          // k번째 그림 → k+1번째 그림 짝을 점마다 올림
  if (k === seg) return; seg = k;
  const A = imgs[k], B = imgs[k + 1];
  for (let i = 0; i < N; i++) {
    const ca = A.order[i], cb = B.order[i];
    cellA[i] = ca; cellB[i] = cb; alA[i] = A.a[ca]; alB[i] = B.a[cb];
    for (let c = 0; c < 3; c++) { colA[i * 3 + c] = A.rgb[ca * 3 + c]; colB[i * 3 + c] = B.rgb[cb * 3 + c]; }
  }
  for (const n of ["cellA", "cellB", "colA", "colB", "alA", "alB"]) geo.attributes[n].needsUpdate = true;
}

const U = {
  uT: { value: 0 }, uTime: { value: 0 }, uIntro: { value: calm ? 1 : 0 }, uSp: { value: 4 }, uSize: { value: 4 }, uRound: { value: 1 },
  uC: { value: new THREE.Vector2() }, uM: { value: new THREE.Vector2(-1e4, -1e4) }, uR: { value: 120 }, uScreen: { value: new THREE.Vector2() },
};
const mat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthTest: false,
  vertexShader: `
    uniform float uT, uTime, uIntro, uSp, uSize, uR; uniform vec2 uC, uM, uScreen;
    attribute float cellA, cellB, alA, alB; attribute vec3 colA, colB; attribute vec4 rnd;
    varying vec3 vC; varying float vA;
    const float COLS = ${COLS}.0, ROWS = ${ROWS}.0;
    vec2 cell(float c) { return uC + (vec2(mod(c, COLS), floor(c / COLS)) + .5 - vec2(COLS, ROWS) * .5) * uSp; }
    void main() {
      vec2 a = cell(cellA), b = cell(cellB);
      // 왼쪽 열부터 차례로 출발하는 물결
      float delay = mod(cellA, COLS) / COLS * .55 + (rnd.w * .5 + .5) * .15;
      float t = clamp(uT * 1.7 - delay, 0., 1.); t = t * t * (3. - 2. * t);
      // 곧은 길 대신 옆으로 휘는 곡선(2차 베지어)
      vec2 d = b - a, ctrl = (a + b) * .5 + vec2(-d.y, d.x) * rnd.x * .5 + vec2(0., -length(d) * .18 * (rnd.y * .5 + .5));
      vec2 p = mix(mix(a, ctrl, t), mix(ctrl, b, t), t);
      float fly = sin(3.14159 * t);
      // 처음 들어올 때는 화면 곳곳에서 모여듦
      float ii = clamp(uIntro * 1.6 - (rnd.w * .5 + .5) * .6, 0., 1.); ii = 1. - pow(1. - ii, 3.);
      p = mix(uScreen * .5 + rnd.xy * uScreen * .75, p, ii);
      // 날아가는 동안만 살짝 떨림 (멈춘 그림은 칸에 딱 맞게, 밝기만 아주 조금 반짝임)
      p += vec2(sin(uTime * 1.3 + rnd.z * 30.), cos(uTime * 1.1 + rnd.w * 30.)) * uSp * .6 * fly;
      // 마우스 근처 점은 제자리에서 흩어짐 (구멍·밝은 테 없이)
      float k = pow(max(0., 1. - distance(p, uM) / uR), 2.);
      p += vec2(rnd.x, rnd.z) * k * uSp * 5.;
      vC = mix(colA, colB, t) * (1. + .05 * sin(uTime * 1.6 + rnd.z * 40.));
      vA = mix(alA, alB, t) * (1. - fly * .12) * (.25 + .75 * ii);
      // 날아가는 동안 앞뒤 깊이처럼 크기가 달라짐
      gl_PointSize = uSize * (1. + fly * (rnd.y * .9 + .35) * 1.3);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 0., 1.);
    }`,
  fragmentShader: `uniform float uRound; varying vec3 vC; varying float vA;
    void main() { if (vA < .01 || uRound > .5 && length(gl_PointCoord - .5) > .5) discard; gl_FragColor = vec4(vC, vA); }`,
});
const pts = new THREE.Points(geo, mat); pts.frustumCulled = false;
const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(0, 1, 0, 1, -10, 10);
scene.add(pts);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("cv"), antialias: false });
renderer.setClearColor(0x151618);

// 그림 칸 크기·자리: 넓은 화면은 오른쪽, 좁은 화면은 위
function resize() {
  const W = innerWidth, H = innerHeight, dpr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(dpr); renderer.setSize(W, H, false);
  cam.left = 0; cam.right = W; cam.top = 0; cam.bottom = H; cam.updateProjectionMatrix();
  let FW;
  if (W > 800) { FW = Math.min(W * .58, (H - 140) * COLS / ROWS, 1100); U.uC.value.set(W - FW / 2 - Math.max(W * .04, 24), H / 2); }
  else { FW = W - 32; U.uC.value.set(W / 2, H * .36); }
  const sp = FW / COLS, round = sp * dpr >= 3.5;   // 점이 몇 픽셀뿐이면 동그랗게 깎지 않고 칸을 꽉 채움(틈 줄무늬 방지)
  U.uSp.value = sp; U.uRound.value = round ? 1 : 0;
  U.uSize.value = round ? sp * .94 * dpr : Math.ceil(sp * dpr);
  U.uR.value = Math.max(90, FW * .12); U.uScreen.value.set(W, H);
}
addEventListener("resize", resize); resize();

const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
let mx = -1e4, my = -1e4, cur = -1, ps = 0;
addEventListener("pointermove", e => { if (mx < -1e3) U.uM.value.set(e.clientX, e.clientY); mx = e.clientX; my = e.clientY; });
document.documentElement.addEventListener("pointerleave", () => { mx = my = -1e4; U.uM.value.set(-1e4, -1e4); });
document.getElementById("bar").innerHTML = SHOW.map(() => "<i><b></b></i>").join("");
const bars = [...document.getElementById("bar").children];

function frame(now) {
  const max = document.documentElement.scrollHeight - innerHeight;
  const goal = Math.min(K - 1, Math.max(0, scrollY / Math.max(1, max) * (K - 1) * 1.08));
  ps += (goal - ps) * (calm ? 1 : .08);                   // 스크롤을 부드럽게 따라감
  const k = Math.min(K - 2, Math.floor(ps)), f = ps - k;
  const t = ps >= K - 1 ? 1 : sm((f - .25) / .7);          // 앞 25%는 그림 그대로, 뒤에서 넘어감
  useSegment(k);
  U.uT.value = t; U.uTime.value = calm ? 0 : now / 1000;
  U.uIntro.value += (1 - U.uIntro.value) * .022;
  if (mx > -1e3) U.uM.value.lerp({ x: mx, y: my }, .18);
  renderer.render(scene, cam);
  bars.forEach((b, j) => b.style.setProperty("--f", Math.max(0, Math.min(1, ps - j + 1)).toFixed(3)));
  const near = Math.round(k + t);
  if (near !== cur) info(near);
  requestAnimationFrame(frame);
}

let tm;
function info(i) {
  const first = cur === -1; cur = i; const w = SHOW[i], el = document.getElementById("info");
  el.classList.add("out"); clearTimeout(tm);
  tm = setTimeout(() => {
    document.getElementById("meta").textContent = `${String(i + 1).padStart(2, "0")} / ${String(K).padStart(2, "0")} · ${w.cat}`;
    document.getElementById("ttl").textContent = w.t;
    document.getElementById("desc").textContent = w.s;
    document.getElementById("open").href = ROOT + w.href;
    el.classList.remove("out");
  }, calm ? 0 : first ? 500 : 200);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
