function forward(m) { if (view.mode === "walk") { stepWalk(Math.sin(walk.yaw) * m, Math.cos(walk.yaw) * m); return; } fly.pos.addScaledVector(dirOf(fly.yaw, fly.pitch), m); }
cv.addEventListener("pointerdown", e => { if (sketching && view.mode !== "intro" && view.mode !== "dive") { cv.setPointerCapture(e.pointerId); fly.tw = null; if (e.button === 2) skLook = { x: e.clientX, y: e.clientY }; else skStart(e); return; }
  if (e.pointerType === "mouse") { if (view.mode !== "fly" && view.mode !== "walk") return;
    if (!locked()) { cv.requestPointerLock()?.catch?.(() => {}); return; } // Esc 직후 바로 다시 잠그면 브라우저가 거절할 수 있음
    if (view.mode === "fly") { ray.setFromCamera(new THREE.Vector2(0, 0), camera); const hit = ray.intersectObjects(pickables)[0]; if (hit) { document.exitPointerLock(); select(named.indexOf(hit.object.userData.b)); } } return; } // 고르면 마우스를 풀어 옆 칸 버튼을 누를 수 있게
  ptr.set(e.pointerId, { x: e.clientX, y: e.clientY }); cv.setPointerCapture(e.pointerId); fly.tw = null; $("walkHint").style.opacity = ".35";
  drag = ptr.size === 1 ? { sx: e.clientX, sy: e.clientY, t: performance.now() } : null; pinch = null; });
cv.addEventListener("pointermove", e => { if (sketching) { if (skCur) skAdd(e); else if (skLook) { look((e.clientX - skLook.x) * .65, -(e.clientY - skLook.y) * .75); skLook = { x: e.clientX, y: e.clientY }; } return; }
  if (locked()) { if (e.movementX || e.movementY) { fly.tw = null; look(e.movementX * .65, -e.movementY * .75); } return; } // 마우스를 올리면 위를 봄
  const p = ptr.get(e.pointerId); if (!p) return; const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptr.size >= 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) { forward((d - pinch.d) * (view.mode === "walk" ? .05 : alt() * .006)); if (view.mode === "fly") pan(dx / 2, dy / 2); } pinch = { d }; return; }
  if (view.mode === "dive" || view.mode === "intro") return; look(dx, dy); });
const endPtr = e => { ptr.delete(e.pointerId); if (sketching || skCur) { if (skCur) skEnd(e); skLook = null; return; }
  if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6 && performance.now() - drag.t < 350 && view.mode === "fly") {
    ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera); const hit = ray.intersectObjects(pickables)[0]; if (hit) select(named.indexOf(hit.object.userData.b)); }
  drag = null; pinch = null; };
cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
cv.addEventListener("wheel", e => { e.preventDefault(); fly.tw = null; if (view.mode === "walk") return forward(-e.deltaY * .02); if (view.mode !== "fly") return;
  ray.setFromCamera(locked() ? new THREE.Vector2(0, 0) : new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera); const hit = ray.intersectObjects([terrain, ...pickables])[0];
  const to = hit ? hit.point : fly.pos.clone().addScaledVector(ray.ray.direction, 300), d = fly.pos.distanceTo(to), m = cl(-e.deltaY * .0016, -.5, .5) * d; // 가리킨 곳으로 다가가기
  if (m > 0 && d - m < 18) return; fly.pos.addScaledVector(ray.ray.direction, m); }, { passive: false });
function stepWalk(dx, dz) { const x = walk.pos.x + dx, z = walk.pos.z + dz; if (free(x, z) || !free(walk.pos.x, walk.pos.z)) walk.pos.set(x, Y(x, z) + 1.7, z); }
function keep() { // 땅·건물 아래로 못 들어가고, 너무 멀리·높이 못 감
  const p = fly.pos, r = Math.hypot(p.x - CC.x, p.z - CC.z); if (r > 1100) { p.x = CC.x + (p.x - CC.x) * 1100 / r; p.z = CC.z + (p.z - CC.z) * 1100 / r; }
  let floor = Y(p.x, p.z) + 3; for (const b of named) if (Math.abs(p.x - b.cx) < b.size + 3 && Math.abs(p.z - b.cz) < b.size + 3 && inPoly(p.x, p.z, b.pts)) floor = Math.max(floor, b.top + 4);
  p.y = cl(p.y, floor, 950); }

/* ───────── 작은 지도: 건물 고르기(올리면 이름, 누르면 이동) · 빈 곳 누르면 그 위로 · 지금 보는 곳 ───────── */
const mapC = $("mapC"), mg = mapC.getContext("2d"), MB = (() => { const xs = CAMPUS.map(p => p[0]), zs = CAMPUS.map(p => p[1]); return [Math.min(...xs) - 20, Math.min(...zs) - 20, Math.max(...xs) + 20, Math.max(...zs) + 20]; })();
let mapHover = -1, mapS = 1, mapO = [0, 0];
function mapFit() { const r = mapC.getBoundingClientRect(), d = Math.min(devicePixelRatio, 2); mapC.width = Math.max(1, r.width * d); mapC.height = Math.max(1, r.height * d);

addEventListener("resize", mapFit);
const mp = (x, z) => [mapO[0] + (x - MB[0]) * mapS, mapO[1] + (z - MB[1]) * mapS];
const mapPath = (pts, close = true) => { mg.beginPath(); pts.forEach((p, i) => mg[i ? "lineTo" : "moveTo"](...mp(p[0], p.length > 2 ? p[2] : p[1]))); if (close) mg.closePath(); };
function drawMap() { if ($("map").classList.contains("off")) return; const d = mapC.width / (mapC.clientWidth || 1); mg.clearRect(0, 0, mapC.width, mapC.height);
  mapPath(CAMPUS); mg.fillStyle = "#e3ddcf"; mg.fill();
  for (const a of SPORT_P) { mapPath(a.pts); mg.fillStyle = a.k.includes("basketball") ? "#8fb0dc" : "#a9c896"; mg.fill(); }
  named.forEach((b, i) => { mapPath(b.pts); mg.fillStyle = i === sel ? "#151514" : i === mapHover ? "#2b44a6" : "#a39d90"; mg.fill(); });
  mg.strokeStyle = "#d23b2f"; mg.lineWidth = 2 * d; mg.lineJoin = mg.lineCap = "round"; for (const s of strokes) { mapPath(s.pts, false); mg.stroke(); } if (skCur?.pts.length > 1) { mapPath(skCur.pts, false); mg.stroke(); }
  const o = view.mode === "walk" ? walk : fly, [cx, cy] = mp(camera.position.x, camera.position.z), a = Math.atan2(Math.cos(o.yaw), Math.sin(o.yaw)); // 지금 보는 방향 부채꼴
  mg.beginPath(); mg.moveTo(cx, cy); mg.arc(cx, cy, 30 * d, a - .45, a + .45); mg.closePath(); mg.fillStyle = "rgb(43 68 166 / .22)"; mg.fill();

const mapAt = e => { const r = mapC.getBoundingClientRect(), d = mapC.width / r.width; return [((e.clientX - r.left) * d - mapO[0]) / mapS + MB[0], ((e.clientY - r.top) * d - mapO[1]) / mapS + MB[1]]; };
const mapName = () => { $("mapName").textContent = mapHover >= 0 ? named[mapHover].n : sel >= 0 ? named[sel].n : ""; };
mapC.addEventListener("pointermove", e => { const [x, z] = mapAt(e); mapHover = named.findIndex(b => inPoly(x, z, b.pts)); mapName(); });
mapC.addEventListener("pointerleave", () => { mapHover = -1; mapName(); });
mapC.addEventListener("click", e => { if (view.mode === "walk") walkOut(); if (view.mode !== "fly") return; const [x, z] = mapAt(e), i = named.findIndex(b => inPoly(x, z, b.pts));
  if (i >= 0) return select(i); const g = Y(x, z); flyTo(new V3(x - Math.sin(fly.yaw) * 110, g + 95, z - Math.cos(fly.yaw) * 110), new V3(x, g, z)); });
$("allB").onclick = () => { if (view.mode === "walk") walkOut(); overview(); };

/* ───────── 스케치: 땅·건물 위에 빨간 선을 긋고 메모 → '파일로 저장'하면 실제 좌표·메모·화면이 담긴 JSON이 다운로드 폴더에 (Claude가 읽고 고침) ───────── */
const SKK = "ssu-campus-sketch", skMat = new THREE.LineBasicMaterial({ color: 0xd23b2f, depthTest: false, transparent: true }), skGroup = new THREE.Group(); scene.add(skGroup);
let sketching = false, skCur = null, skLook = null, skOpen = null;
const strokes = (() => { try { return JSON.parse(localStorage.getItem(SKK)) || []; } catch { return []; } })();
const skPlain = () => strokes.map(({ line, pin, ...s }) => s);
const skKeep = () => { try { localStorage.setItem(SKK, JSON.stringify(skPlain())); } catch {} };
const skPts = pts => pts.map(p => new V3(p[0], p[1] + .4, p[2]));
const skTube = new THREE.MeshBasicMaterial({ color: 0xd23b2f, depthTest: false, transparent: true, opacity: .9 });
function skShow(s) { const path = new THREE.CurvePath(), v = skPts(s.pts); for (let i = 1; i < v.length; i++) path.add(new THREE.LineCurve3(v[i - 1], v[i])); // 다 그린 선은 굵은 관으로 (1px 선은 잘 안 보임)
  s.line = new THREE.Mesh(new THREE.TubeGeometry(path, Math.min(400, v.length * 3), .5, 6), skTube); s.line.renderOrder = 9; skGroup.add(s.line); s.pin = document.createElement("div"); s.pin.className = "skPin"; $("labels").append(s.pin); }
const skPins = () => strokes.forEach((s, i) => s.pin.textContent = `${i + 1}${s.note ? " · " + s.note : ""}`);
strokes.forEach(skShow); skPins();
function skHit(e) { ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera); return ray.intersectObjects([terrain, ...pickables, ...blockers])[0]; }
function skStart(e) { skCur = { pts: [], on: new Set(), line: new THREE.Line(new THREE.BufferGeometry(), skMat) }; skCur.line.renderOrder = 9; skGroup.add(skCur.line); skAdd(e); }
function skAdd(e) { const h = skHit(e); if (!h) return; const p = h.point, q = skCur.pts.at(-1); if (q && Math.hypot(p.x - q[0], p.y - q[1], p.z - q[2]) < .6) return;
  skCur.pts.push([+p.x.toFixed(1), +p.y.toFixed(1), +p.z.toFixed(1)]); if (h.object.userData.b) skCur.on.add(h.object.userData.b.n); skCur.line.geometry.setFromPoints(skPts(skCur.pts)); }
function snap(w) { renderer.render(scene, camera); const src = renderer.domElement, c = document.createElement("canvas"); c.width = w; c.height = Math.round(w * src.height / src.width); c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .72); }
function skEnd(e) { const c = skCur; skCur = null; skGroup.remove(c.line); if (c.pts.length < 2) return;
  const o = view.mode === "walk" ? walk : fly, s = { pts: c.pts, on: [...c.on], note: "", time: new Date().toISOString(), cam: { pos: camera.position.toArray().map(v => +v.toFixed(1)), yaw: +o.yaw.toFixed(3), pitch: +o.pitch.toFixed(3), mode: view.mode } };
  strokes.push(s); skShow(s); s.shot = snap(720); skPins(); skKeep();
  const n = $("note"); n.classList.add("on"); n.style.left = `${cl(e.clientX + 12, 8, innerWidth - n.offsetWidth - 8)}px`; n.style.top = `${cl(e.clientY + 12, 60, innerHeight - n.offsetHeight - 8)}px`; skOpen = s; $("noteIn").value = ""; $("noteIn").focus(); }
const noteDone = ok => { if (skOpen && ok) { skOpen.note = $("noteIn").value.trim(); skPins(); skKeep(); } skOpen = null; $("note").classList.remove("on"); };
$("noteOk").onclick = () => noteDone(true); $("noteIn").addEventListener("keydown", e => { if (e.key === "Enter") noteDone(true); if (e.key === "Escape") noteDone(false); });
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
$("skB").onclick = () => { sketching = !sketching; $("skB").setAttribute("aria-pressed", sketching); $("map").classList.toggle("sk", sketching); if (sketching && locked()) document.exitPointerLock(); if (!sketching) noteDone(true); hint(); };
$("skUndo").onclick = () => { const s = strokes.pop(); if (!s) return; skGroup.remove(s.line); s.pin.remove(); skKeep(); };
$("skClear").onclick = () => { const b = $("skClear"); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "한 번 더 누르면 지움"; setTimeout(() => { delete b.dataset.sure; b.textContent = "모두 지우기"; }, 3000); return; }
  delete b.dataset.sure; b.textContent = "모두 지우기"; while (strokes.length) { const s = strokes.pop(); skGroup.remove(s.line); s.pin.remove(); } skKeep(); };
$("skFile").onclick = () => { noteDone(true); if (!strokes.length) return toast("먼저 화면에 그려 주세요"); const d = new Date(), pad = n => String(n).padStart(2, "0");
  const data = { page: location.href, saved: d.toISOString(), coords: "x = 동쪽(m), z = 남쪽(m), y = 해발 - 50m (ssu-data.js 좌표)", view: snap(1280), strokes: skPlain() };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" })); a.download = `숭실대-스케치-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("다운로드 폴더에 저장했어요"); };

let last = performance.now(); const tmp = new V3(), lookNow = new V3().copy(INTRO_LOOK);
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (view.mode === "intro") { const a = now / 9000; camera.position.set(INTRO_FROM.x + Math.sin(a) * 60, INTRO_FROM.y, INTRO_FROM.z + Math.cos(a) * 40); lookNow.copy(INTRO_LOOK); camera.lookAt(lookNow); }
  else if (view.mode === "dive") { // 구름 위 → 구름 속 → 캠퍼스 위로 휘어 내려옴
    const k = cl((now - view.t) / (calm ? 300 : 7500), 0, 1), e = k < .5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2, end = OVER.pos;
    const c1 = new V3(-250, 760, 1000), c2 = new V3(end.x - 300, end.y + 260, end.z + 200), u = 1 - e;
    camera.position.set(0, 0, 0).addScaledVector(INTRO_FROM, u * u * u).addScaledVector(c1, 3 * u * u * e).addScaledVector(c2, 3 * u * e * e).addScaledVector(end, e * e * e);
    lookNow.lerpVectors(INTRO_LOOK, CC, sm(cl(k * 1.3, 0, 1))); camera.lookAt(lookNow);
    if (k >= 1) { view.mode = "fly"; fly.pos.copy(end); Object.assign(fly, aim(end, CC)); $("map").classList.remove("off"); mapFit(); hint(); }
  } else if (view.mode === "fly") {
    const tw = fly.tw;
    if (tw) { const k = cl((now - tw.t0) / tw.dur, 0, 1), e = k < .5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
      fly.pos.lerpVectors(tw.p0, tw.p1, e); fly.pos.y += Math.sin(Math.PI * e) * tw.lift; fly.yaw = lerp(tw.y0, tw.y1, e); fly.pitch = lerp(tw.q0, tw.q1, e); if (k >= 1) fly.tw = null; }
    else if (keys.size) { const v = cl(alt() * 1.1, 25, 320) * (keys.has("shift") ? 2.6 : 1) * dt, f = new V3(Math.sin(fly.yaw), 0, Math.cos(fly.yaw)), r = new V3(-f.z, 0, f.x);
      const k = n => keys.has(n) ? 1 : 0; fly.pos.addScaledVector(f, (k("w") + k("arrowup") - k("s") - k("arrowdown")) * v).addScaledVector(r, (k("d") + k("arrowright") - k("a") - k("arrowleft")) * v); fly.pos.y += (k("e") - k("q")) * v * .8; }

    const k = sm(cl((now - view.t) / (calm ? 300 : 2200), 0, 1)), u = 1 - k, top = Math.max(walk.from.y, walk.pos.y + 70); // 떠올랐다가 그 자리로 곧게 내려앉음 (건물을 뚫지 않게)
    if (k >= 1 && keys.size) { const v = (keys.has("shift") ? 9 : 4.5) * dt, f = n => keys.has(n) ? 1 : 0, a = (f("w") + f("arrowup") - f("s") - f("arrowdown")) * v, b = (f("d") + f("arrowright") - f("a") - f("arrowleft")) * v;
      stepWalk(Math.sin(walk.yaw) * a - Math.cos(walk.yaw) * b, Math.cos(walk.yaw) * a + Math.sin(walk.yaw) * b); }
    camera.position.set(walk.from.x * u * u + walk.pos.x * (1 - u * u), walk.from.y * u * u + top * 2 * u * k + walk.pos.y * k * k, walk.from.z * u * u + walk.pos.z * (1 - u * u));
    tmp.copy(dirOf(walk.yaw, walk.pitch)).multiplyScalar(50).add(camera.position); // 내려오는 동안은 건물을 보다가 땅에 닿으며 걷는 시선으로
    if (k < 1) tmp.lerpVectors(walk.aim, tmp, k * k); camera.lookAt(tmp);
  }
  // 구름: 아래 내려오면 옅게
  const cy = camera.position.y; clouds.forEach(c => { const dyc = Math.abs(cy - c.position.y); c.material.opacity = cl(dyc / 120, .12, .8) * (cy < 480 ? cl((cy - 200) / 280, .25, 1) : 1); });
  scene.fog.density = cy > 520 ? .0003 : .0011;
  // 이름표
  const showLab = view.mode === "fly", placed = [];
  named.map(b => { b.d = camera.position.distanceTo(tmp.set(b.cx, b.top, b.cz)); return b; }).sort((a, b) => (b === named[sel]) - (a === named[sel]) || a.d - b.d).forEach(b => {
    tmp.set(b.cx, b.top + 4, b.cz).project(camera); const x = (tmp.x * .5 + .5) * innerWidth, y = (-tmp.y * .5 + .5) * innerHeight, w = (b.lw ||= b.lab.offsetWidth) + 6, h = 24;
    const vis = showLab && tmp.z < 1 && b.d < 900 && !placed.some(r => Math.abs(r[0] - x) < (r[2] + w) / 2 && Math.abs(r[1] - y) < h); if (vis) placed.push([x, y, w]);
    b.lab.style.opacity = vis ? (b === named[sel] ? 1 : cl(1.3 - b.d / 700, .35, 1)) : 0; b.lab.style.pointerEvents = vis ? "auto" : "none";
    b.lab.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`; });
  for (const s of strokes) { const p = s.pts[0]; tmp.set(p[0], p[1] + 1, p[2]).project(camera); const vis = view.mode !== "intro" && view.mode !== "dive" && tmp.z < 1; s.pin.style.opacity = vis ? 1 : 0;
    if (vis) s.pin.style.transform = `translate(${(tmp.x * .5 + .5) * innerWidth}px, ${(-tmp.y * .5 + .5) * innerHeight}px) translate(-50%, -130%)`; }
  drawMap();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
