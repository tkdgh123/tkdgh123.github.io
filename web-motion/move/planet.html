  const right = new THREE.Vector3().crossVectors(dir.clone().negate(), UP).normalize(); return { dir, right }; }
function pad(p) { const { dir } = view(p), n = UP.clone().addScaledVector(dir, .5).normalize(); return { n, pos: p.pos.clone().addScaledVector(n, p.R + FOOT) }; }
const HOME = { pos: new THREE.Vector3(14, FOOT, 6), n: UP.clone() };
const ORDER = [...planets];
let cur = -1, fly = null, thrust = 0;
const qUp = n => new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), n); // 앞(+z)이 n을 보게
ship.position.copy(HOME.pos); ship.quaternion.copy(qUp(UP));

function go(i) {
  i = (i + ORDER.length) % ORDER.length; if (fly) return;
  const from = cur < 0 ? HOME : pad(ORDER[cur]);
  fly = { i, t0: performance.now(), n0: from.n.clone(), p0: ship.position.clone() };
  fly.d = fly.p0.distanceTo(pad(ORDER[i]).pos); fly.dur = calm ? 400 : cl(3400 + fly.d * 30, 4200, 7500);
  $("intro").classList.remove("on"); $("info").classList.remove("on");
}
function arrive(i) {
  cur = i; const p = ORDER[i], w = p.w;
  $("iMeta").innerHTML = `<i style="--c:${COL[p.cat]}"></i>${String(i + 1).padStart(2, "0")} / ${ORDER.length} · ${p.cat} 궤도 · ${w.d}${w.lock ? " · 잠금" : ""}`;
  $("iT").textContent = w.t; $("iS").textContent = w.s; $("iImg").src = ROOT + w.img; $("open").href = ROOT + w.href;
  $("next").textContent = i === ORDER.length - 1 ? "처음 행성으로 →" : "다음 행성 →";
  $("info").classList.add("on"); dustT = 0;
  document.querySelectorAll("#legend span").forEach(s => s.classList.toggle("cur", +s.dataset.k === p.k));
}
$("go").onclick = () => go(0); $("next").onclick = () => go(cur + 1); $("prev").onclick = () => go(cur - 1);
addEventListener("keydown", e => { if (e.code === "ArrowRight" || e.code === "Space") { e.preventDefault(); go(cur + 1); } if (e.code === "ArrowLeft") go(cur < 0 ? 0 : cur - 1); });
const ray = new THREE.Raycaster();
$("gl").addEventListener("click", e => { ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
  const hit = ray.intersectObjects(planets.map(p => p.ball))[0]; if (hit) go(ORDER.findIndex(p => p.ball === hit.object)); });

/* ───────── 매 프레임 ───────── */
const smooth = (a, b, x) => { const t = cl((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function bezD(a, b, c, d, t) { const u = 1 - t; return b.clone().sub(a).multiplyScalar(3 * u * u).addScaledVector(c.clone().sub(b), 6 * u * t).addScaledVector(d.clone().sub(c), 3 * t * t); }
function bez(a, b, c, d, t) { const u = 1 - t; return a.clone().multiplyScalar(u * u * u).addScaledVector(b, 3 * u * u * t).addScaledVector(c, 3 * u * t * t).addScaledVector(d, t * t * t); }
function landedShot(p, outPos, outLook) { // 행성은 화면 오른쪽(폰은 위), 그 위에 선 우주선이 보이게
  const portrait = camera.aspect < 1, { dir, right } = view(p), dist = p.R * (portrait ? 6.2 : 3.6) + 9;
  outPos.copy(p.pos).addScaledVector(dir, dist).addScaledVector(UP, p.R * .9 + 3);
  outLook.copy(p.pos).addScaledVector(UP, p.R * .45);
  if (portrait) outLook.addScaledVector(UP, -p.R * 1.4); else outLook.addScaledVector(right, -p.R * 1.6);
}
const camPos = new THREE.Vector3(0, 150, 170), camLook = new THREE.Vector3(), wantPos = new THREE.Vector3(), wantLook = new THREE.Vector3(), tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
camera.position.copy(camPos);
let last = performance.now(), shake = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (paintI < planets.length) { const p = planets[paintI++]; p.mat.map = paint(p.kind, p.seed, p.hue); p.mat.color.set(0xffffff); p.mat.needsUpdate = true; }
  planets.forEach(p => place(p, dt));
  const portrait = camera.aspect < 1;
  if (fly) {
    // 한 줄로 이어진 곡선: 이륙 방향(하늘)으로 떠올라 → 날아가 → 도착 행성 위에서 꼬리부터 내려앉음. 속도는 천천히 → 빠르게 → 천천히
    const p = ORDER[fly.i], tg = pad(p), k = cl((now - fly.t0) / fly.dur, 0, 1), u = .5 - Math.cos(Math.PI * k) / 2;
    const c1 = fly.p0.clone().addScaledVector(fly.n0, fly.d * .45 + 4), c2 = tg.pos.clone().addScaledVector(tg.n, fly.d * .45 + 4);
    const pos = bez(fly.p0, c1, c2, tg.pos, u), tan = bezD(fly.p0, c1, c2, tg.pos, cl(u, .002, .998)).normalize();
    // 앞머리: 처음엔 하늘 → 나아가는 방향 → 내리기 한참 전부터 천천히 다시 하늘로 (갑자기 돌지 않게 비율로 섞음)
    const q = qUp(fly.n0).slerp(qUp(tan), smooth(0, .25, u)); q.slerp(qUp(tg.n), smooth(.5, .86, u));
    ship.position.copy(pos); ship.quaternion.copy(q);
    thrust = u < .25 ? 1 : u < .6 ? .65 : .9 * (1 - smooth(.94, 1, u)) + .1;
    const h = c2.clone().sub(c1).setY(0).normalize();
    // 3인칭: 가는 방향 뒤·위에서 따라가다가 → 후반부터 천천히 도착 장면으로
    wantPos.copy(pos).addScaledVector(h, -14).addScaledVector(UP, 5); wantLook.copy(pos).addScaledVector(h, 8);
    { landedShot(p, tmpP, tmpL); const s2 = smooth(.45, 1, k); wantPos.lerp(tmpP, s2); wantLook.lerp(tmpL, s2); }
    if (k >= 1) { const i = fly.i; fly = null; arrive(i); }
  } else if (cur >= 0) {
    const p = ORDER[cur], tg = pad(p); ship.position.copy(tg.pos); ship.quaternion.slerp(qUp(tg.n), 1 - Math.exp(-dt * 6));
    thrust += (0 - thrust) * Math.min(1, dt * 3);
    landedShot(p, wantPos, wantLook);
  } else {
    wantPos.set(20, portrait ? 190 : 105, portrait ? 210 : 165); wantLook.set(portrait ? 0 : -22, 0, 0);
    ship.position.copy(HOME.pos); thrust = 0;
  }
  camPos.lerp(wantPos, 1 - Math.exp(-dt * (fly ? 5 : 2.2))); camLook.lerp(wantLook, 1 - Math.exp(-dt * (fly ? 6 : 2.2)));
  camera.position.copy(camPos); shake *= Math.exp(-dt * 7);
  if (shake > .01 && !calm) camera.position.add(new THREE.Vector3(Math.random() - .5, Math.random() - .5, 0).multiplyScalar(shake * .5));
  camera.lookAt(camLook);
  // 불꽃·연기·착륙 먼지
  const fl = calm ? .1 : thrust * (.85 + Math.random() * .3); flame.visible = fl > .03; flame.scale.set(1, Math.max(.05, fl), 1); flame.position.z = -1.3 - .8 * fl; flameGlow.scale.setScalar(.2 + 2.6 * thrust); flameGlow.material.opacity = thrust;
  if (fly && thrust > .4 && !calm) { const t = trail[trI = (trI + 1) % TR]; t.s.position.copy(ship.position).addScaledVector(new THREE.Vector3(0, 0, 1).applyQuaternion(ship.quaternion), -1.2); t.life = 1; }
  trail.forEach(t => { if (t.life <= 0) return; t.life -= dt * .8; t.s.material.opacity = Math.max(0, t.life) * .16; t.s.scale.setScalar(.5 + (1 - t.life) * 2); });
  if (dustT >= 0 && cur >= 0) { dustT += dt; const k = dustT / 1.1, tg = pad(ORDER[cur]);
    if (k > 1) { dustT = -1; dustRing.material.opacity = 0; } else { dustRing.position.copy(tg.pos).addScaledVector(tg.n, -FOOT + .05); dustRing.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tg.n); dustRing.scale.setScalar(.6 + k * 3); dustRing.material.opacity = (1 - k) * .6; } }
  // 이름표 (정보 칸 밑·지금 있는 행성은 숨김)
  const box = (fly ? null : ($("info").classList.contains("on") ? $("info") : $("intro").classList.contains("on") ? $("intro") : null))?.getBoundingClientRect();
  planets.forEach(p => { tmpP.copy(p.pos).add(new THREE.Vector3(0, -p.R - 1, 0)).project(camera); const d = camera.position.distanceTo(p.pos);
    const sx = (tmpP.x * .5 + .5) * innerWidth, sy = (-tmpP.y * .5 + .5) * innerHeight, under = box && sx > box.left - 60 && sx < box.right + 60 && sy > box.top - 20 && sy < box.bottom + 20;
    const vis = tmpP.z < 1 && !under && !(p === ORDER[cur] && !fly); p.lab.style.opacity = vis ? cl(1.5 - d / 140, .25, 1) : 0;
    p.lab.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, 0)`; });
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
