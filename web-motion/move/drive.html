{ const m = new THREE.Mesh(new THREE.PlaneGeometry(TW, 2.4), new THREE.MeshBasicMaterial({ map: textTex(560, 96, g => { for (let x = 0; x < 14; x++) for (let y = 0; y < 2; y++) { g.fillStyle = (x + y) % 2 ? "#151514" : "#f2f1ec"; g.fillRect(x * 40, y * 48, 40, 48); } }) }));

const box = new THREE.BoxGeometry(1, 1, 1), cyl = new THREE.CylinderGeometry(1, 1, 1, 12), cone = new THREE.ConeGeometry(1, 1, 12), ico = new THREE.IcosahedronGeometry(1, 0), tor = new THREE.TorusGeometry(.62, .3, 8, 16);

const M = { ink: mat(0x1d1e22), glowB: new THREE.MeshBasicMaterial({ color: 0x8fa2ff }), glowW: new THREE.MeshBasicMaterial({ color: 0xfff6e0 }), tire: mat(0x202124), white: mat(0xf2f1ec), blue: mat(BLUE),
  books: [0xe4e2da, 0x2b44a6, 0x8f8b80, 0x151514, 0xc9c6bc, 0x6c7a99].map(mat), trunk: mat(0x6b5a48), leaf: [0x4d5b3f, 0x667552, 0x3c4732].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true })) };

  (x, z) => { const n = 3 + (rnd() * 5 | 0); let y = 0; for (let k = 0; k < n; k++) { const t = .35 + rnd() * .3; put(box, M.books[(rnd() * 6) | 0], x + (rnd() - .5) * .3, y + t / 2, z + (rnd() - .5) * .3, 2.2 + rnd(), t, 1.5 + rnd() * .5, rnd() * .6); y += t; }
    if (rnd() < .35) put(cyl, M.books[1], x + 1.8, .15, z, .12, 2.6, .12).rotation.z = Math.PI / 2; },
  (x, z) => { if (rnd() < .55) { const n = 2 + (rnd() * 3 | 0); for (let k = 0; k < n; k++) put(tor, M.tire, x, .3 + k * .6, z, 1, 1, 1); }
