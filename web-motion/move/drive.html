<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon";
import { WORKS, ROOT } from "../apply/works.js";
const $ = id => document.getElementById(id);
const PAPER = 0xf2f1ec, INK = 0x151514, BLUE = 0x2b44a6;
const CATS = ["게임", "공부", "프로젝트", "기타"];
const CCOL = { 게임: "#151618", 공부: "#a39e90", 프로젝트: "#2b44a6", 기타: "#4d5b3f" };
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cl = (x, a, b) => Math.min(b, Math.max(a, x));
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; // 늘 같은 배치

/* ───────── 장면 ───────── */
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(PAPER); scene.fog = new THREE.Fog(PAPER, 70, 190);
const camera = new THREE.PerspectiveCamera(62, 1, .1, 400);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d4c6, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 100 }); sun.shadow.bias = -.0006;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshStandardMaterial({ color: 0xe9e7df, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -22, 0) }); world.allowSleep = true;
world.addBody(new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane(), quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI / 2, 0, 0) }));
world.defaultContactMaterial.friction = .4; world.defaultContactMaterial.restitution = .2;
function textTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
const SERIF = '"Hahmlet", serif', MONO = '"IBM Plex Mono", monospace';
await Promise.all([document.fonts.load(`300 80px Hahmlet`), document.fonts.load(`700 80px Hahmlet`), document.fonts.load(`500 20px "IBM Plex Mono"`)]).catch(() => {});

/* ───────── 서킷: 닫힌 곡선 하나를 분류 넷(작품 수만큼 길이)으로 나눔 ───────── */
const CP = [[0, 80], [70, 86], [122, 62], [134, 4], [106, -38], [62, -30], [30, -62], [-8, -106], [-72, -100], [-124, -54], [-130, 8], [-94, 52], [-48, 82]].map(([x, z]) => new THREE.Vector3(x * 1.25, 0, z * 1.25));
const curve = new THREE.CatmullRomCurve3(CP, true, "centripetal");
const N = 1400, TW = 14, P = curve.getSpacedPoints(N).slice(0, N), T = P.map((_, i) => curve.getTangentAt(i / N));
const NR = T.map(t => new THREE.Vector3(-t.z, 0, t.x)); // 진행 방향의 옆
const OUT = P.map((p, i) => Math.sign(NR[i].dot(p)) || 1); // 바깥쪽 부호
const cnt = CATS.map(c => WORKS.filter(w => w.cat === c).length), SEC = []; { let a = 0; cnt.forEach(n => { SEC.push([a, a + n / WORKS.length]); a += n / WORKS.length; }); }
const secOf = i => { const u = i / N; return Math.max(0, SEC.findIndex(([a, b]) => u >= a && u < b)); };
const idx = u => ((Math.round(u * N) % N) + N) % N;

function ribbon(a, b, color, y = .02) { // 중심선에서 a~b 만큼 떨어진 띠
  const pos = [], col = [], c = new THREE.Color();
  for (let i = 0; i < N; i++) { const j = (i + 1) % N;
    const q = [[i, a], [i, b], [j, a], [j, b]].map(([k, o]) => P[k].clone().addScaledVector(NR[k], o));
    for (const v of [q[0], q[2], q[1], q[1], q[2], q[3]]) pos.push(v.x, y, v.z);
    c.set(color(i)); for (let k = 0; k < 6; k++) col.push(c.r, c.g, c.b); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .95, side: THREE.DoubleSide })); m.receiveShadow = true; scene.add(m); return m;
}
ribbon(-TW / 2, TW / 2, () => "#3b3c41");
for (const s of [-1, 1]) { ribbon(s * (TW / 2 - .7), s * (TW / 2 - .45), () => "#f2f1ec", .03); // 흰 가장자리 선
  ribbon(s * TW / 2, s * (TW / 2 + 1.5), i => Math.floor(i / 5) % 2 ? "#f2f1ec" : CCOL[CATS[secOf(i)]], .025); } // 구간 색 연석
for (let i = 0; i < N; i += 14) { const m = new THREE.Mesh(new THREE.PlaneGeometry(.35, 3), new THREE.MeshBasicMaterial({ color: 0xd9d6cc })); m.rotation.x = -Math.PI / 2; m.rotation.z = Math.atan2(T[i].x, T[i].z); m.position.set(P[i].x, .03, P[i].z); scene.add(m); } // 가운데 점선

// 출발선
{ const m = new THREE.Mesh(new THREE.PlaneGeometry(TW, 2.4), new THREE.MeshBasicMaterial({ map: textTex(560, 96, g => { for (let x = 0; x < 14; x++) for (let y = 0; y < 2; y++) { g.fillStyle = (x + y) % 2 ? "#151514" : "#f2f1ec"; g.fillRect(x * 40, y * 48, 40, 48); } }) }));
  m.rotation.x = -Math.PI / 2; m.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.atan2(T[0].x, T[0].z)); m.position.set(P[0].x, .04, P[0].z); scene.add(m); }

/* ───────── 구간 문 · 바닥 글씨 · 표지판 ───────── */
const posts = []; // 차가 부딪히는 기둥 [x, z, 표지판]
const loader = new THREE.TextureLoader(), boards = [], mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .7 });
CATS.forEach((cat, s) => {
  const i0 = idx(SEC[s][0]), t = T[i0], col = CCOL[cat];
  // 문: 기둥 둘 + 구간 이름 띠
  const gate = new THREE.Group(); gate.position.copy(P[i0]); gate.rotation.y = Math.atan2(t.x, t.z);
  for (const x of [-1, 1]) { const p = new THREE.Mesh(new THREE.BoxGeometry(.7, 7, .7), mat(INK)); p.position.set(x * (TW / 2 + 2.2), 3.5, 0); p.castShadow = true; gate.add(p);
    const w = new THREE.Vector3(x * (TW / 2 + 2.2), 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), gate.rotation.y).add(P[i0]); posts.push([w.x, w.z, null]); }
  const face = new THREE.MeshBasicMaterial({ map: textTex(1024, 128, (g, w, h) => { g.fillStyle = col; g.fillRect(0, 0, w, h); g.fillStyle = "#fff"; g.font = `500 34px ${MONO}`; g.fillText(`0${s + 1} / 04`, 28, 76); g.font = `700 84px ${SERIF}`; g.textAlign = "center"; g.fillText(cat, w / 2, 95); }) });
  const ban = new THREE.Mesh(new THREE.BoxGeometry(TW + 5.1, 1.7, .4), [mat(col), mat(col), mat(col), mat(col), face, face]);
  ban.position.y = 7.4; ban.castShadow = true; gate.add(ban); scene.add(gate);
  // 안쪽 바닥 큰 글씨
  const im = idx((SEC[s][0] + SEC[s][1]) / 2), inward = NR[im].clone().multiplyScalar(-OUT[im]);
  const lab = new THREE.Mesh(new THREE.PlaneGeometry(22, 7), new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false,
    map: textTex(1024, 320, (g, w, h) => { g.fillStyle = col; g.globalAlpha = .55; g.font = `300 220px ${SERIF}`; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(cat, w / 2, h / 2 + 10); }) }));
  lab.rotation.x = -Math.PI / 2; lab.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.atan2(-inward.x, -inward.z));
  lab.position.copy(P[im]).addScaledVector(inward, TW / 2 + 9); lab.position.y = .03; scene.add(lab);
  // 표지판: 구간 안에 같은 간격으로, 트랙 바깥쪽에 서서 달려오는 차를 봄
  const list = WORKS.filter(w => w.cat === cat), [a, b] = SEC[s];
  list.forEach((w, k) => {
    const i = idx(a + (k + .5) * (b - a) / list.length), side = OUT[i], p = P[i].clone().addScaledVector(NR[i], side * (TW / 2 + 6));
    const fc = T[i].clone().multiplyScalar(-.55).addScaledVector(NR[i], -side * .85).normalize();
    const grp = new THREE.Group(); grp.position.copy(p); grp.rotation.y = Math.atan2(fc.x, fc.z);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(.14, .14, 5.4, 10), mat(INK)); post.position.set(0, 2.7, -.25); post.castShadow = true;
    const pivot = new THREE.Group(); pivot.position.y = 5.3;
    const img = new THREE.Mesh(new THREE.PlaneGeometry(4.4, 2.6), new THREE.MeshBasicMaterial({ color: 0xffffff })); img.position.y = 2.2;
    loader.load(ROOT + w.img, tx => { tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8; img.material.map = tx; const ar = tx.image.width / tx.image.height; img.scale.y = 4.4 / ar / 2.6; img.position.y = 1.3 * img.scale.y + .9; img.material.needsUpdate = true; });
    const back = new THREE.Mesh(new THREE.BoxGeometry(4.6, 3.8, .14), mat(cat === "공부" ? 0xe4e2da : new THREE.Color(col))); back.position.set(0, 1.9, -.09); back.castShadow = true;
    const ttl = new THREE.Mesh(new THREE.PlaneGeometry(4.4, .9), new THREE.MeshBasicMaterial({ transparent: true, map: textTex(1024, 210, (g, W) => {
      g.fillStyle = cat === "공부" ? "#151514" : "#f2f1ec"; g.font = `500 30px ${MONO}`; g.fillText(`${w.d} · ${cat}`, 6, 40);
      let fs = 112; g.font = `300 ${fs}px ${SERIF}`; while (g.measureText(w.t).width > W - 12 && fs > 40) { fs -= 4; g.font = `300 ${fs}px ${SERIF}`; } g.fillText(w.t, 4, 165); }) }));
    ttl.position.set(0, .45, .01);
    const sign = new THREE.Group(); sign.add(back, img, ttl); sign.position.y = -3.85; pivot.add(sign);
    grp.add(post, pivot); scene.add(grp);
    const b2 = { w, x: p.x, z: p.z, pivot, sw: 0, sv: 0, img }; boards.push(b2); posts.push([p.x, p.z, b2]);
  });
});

/* ───────── 구간 풍경: 게임=검은 탑과 빛 상자, 공부=책 더미, 프로젝트=타이어·고깔, 기타=나무 ───────── */
const box = new THREE.BoxGeometry(1, 1, 1), cyl = new THREE.CylinderGeometry(1, 1, 1, 12), cone = new THREE.ConeGeometry(1, 1, 12), ico = new THREE.IcosahedronGeometry(1, 0), tor = new THREE.TorusGeometry(.62, .3, 8, 16);
tor.rotateX(Math.PI / 2);
const M = { ink: mat(0x1d1e22), glowB: new THREE.MeshBasicMaterial({ color: 0x8fa2ff }), glowW: new THREE.MeshBasicMaterial({ color: 0xfff6e0 }), tire: mat(0x202124), white: mat(0xf2f1ec), blue: mat(BLUE),
  books: [0xe4e2da, 0x2b44a6, 0x8f8b80, 0x151514, 0xc9c6bc, 0x6c7a99].map(mat), trunk: mat(0x6b5a48), leaf: [0x4d5b3f, 0x667552, 0x3c4732].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .9, flatShading: true })) };
function put(geo, m, x, y, z, sx, sy, sz, ry = 0) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.scale.set(sx, sy, sz); o.rotation.y = ry; o.castShadow = true; o.receiveShadow = true; scene.add(o); return o; }
const PROP = [
  (x, z) => { const h = 5 + rnd() * 12, w = 1.4 + rnd() * 1.6; put(box, M.ink, x, h / 2, z, w, h, w, rnd()); put(box, rnd() < .5 ? M.glowB : M.glowW, x, h + .45, z, w * .7, .5, w * .7); if (rnd() < .4) put(box, M.glowB, x + w, 1 + rnd() * 3, z, .5, .5, .5, rnd()); },
  (x, z) => { const n = 3 + (rnd() * 5 | 0); let y = 0; for (let k = 0; k < n; k++) { const t = .35 + rnd() * .3; put(box, M.books[(rnd() * 6) | 0], x + (rnd() - .5) * .3, y + t / 2, z + (rnd() - .5) * .3, 2.2 + rnd(), t, 1.5 + rnd() * .5, rnd() * .6); y += t; }
    if (rnd() < .35) put(cyl, M.books[1], x + 1.8, .15, z, .12, 2.6, .12).rotation.z = Math.PI / 2; },
  (x, z) => { if (rnd() < .55) { const n = 2 + (rnd() * 3 | 0); for (let k = 0; k < n; k++) put(tor, M.tire, x, .3 + k * .6, z, 1, 1, 1); }
    else { put(cone, M.blue, x, .5, z, .45, 1, .45); put(cyl, M.white, x, .55, z, .3, .12, .3); put(box, M.blue, x, .05, z, 1, .1, 1); } },
  (x, z) => { const h = 1.2 + rnd() * 1.4; put(cyl, M.trunk, x, h / 2, z, .22, h, .22); const r = 1.3 + rnd() * 1.2; put(ico, M.leaf[(rnd() * 3) | 0], x, h + r * .8, z, r, r * 1.15, r, rnd() * 3); },
];
function nearTrack(x, z, gap) { for (let i = 0; i < N; i += 3) { const dx = P[i].x - x, dz = P[i].z - z; if (dx * dx + dz * dz < gap * gap) return true; } return false; }
CATS.forEach((cat, s) => { const [a, b] = SEC[s], want = 14 + cnt[s] * 4; let made = 0, tries = 0;
  while (made < want && tries++ < want * 20) { const i = idx(a + rnd() * (b - a)), side = rnd() < .5 ? 1 : -1, d = TW / 2 + 5 + rnd() * 34, p = P[i].clone().addScaledVector(NR[i], side * d);
    if (nearTrack(p.x, p.z, TW / 2 + 3.5) || posts.some(([x, z]) => Math.hypot(x - p.x, z - p.z) < 6)) continue; PROP[s](p.x, p.z); made++; } });

/* ───────── 상자 더미: 구간마다 굽은 길 안쪽에 (가로질러 가면 무너짐) ───────── */
const crates = [], boxMats = [0x2b44a6, 0x151514, 0xe4e2da, 0xf2f1ec].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .8 }));
CATS.forEach((_, s) => { const i = idx((SEC[s][0] + SEC[s][1]) / 2 + .02), inward = NR[i].clone().multiplyScalar(-OUT[i]), c = P[i].clone().addScaledVector(inward, TW / 2 + 3.2), rot = Math.atan2(T[i].x, T[i].z) + Math.PI / 2;
  for (let r = 0; r < 3; r++) for (let k = 0; k < 3 - r; k++) { const p = new THREE.Vector3((k - (2 - r) / 2) * 1.04, .5 + r, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), rot).add(c);
    const mesh = new THREE.Mesh(box, boxMats[(r + k + s) % 4]); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
    const body = new CANNON.Body({ mass: .6, shape: new CANNON.Box(new CANNON.Vec3(.5, .5, .5)), position: new CANNON.Vec3(p.x, p.y, p.z), allowSleep: true, sleepSpeedLimit: .2, angularDamping: .15 });
    body.quaternion.setFromEuler(0, rot, 0); body.sleep(); world.addBody(body); crates.push({ mesh, body }); } });

/* ───────── 차 (레이싱 휠 팀 파랑) ───────── */
const car = new THREE.Group(), std = c => new THREE.MeshStandardMaterial({ color: c, roughness: .55 });
const add = (geo, m, x, y, z, parent = car) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; parent.add(o); return o; };
add(new THREE.BoxGeometry(1.9, .5, 3.9), std(BLUE), 0, .62, 0);
add(new THREE.BoxGeometry(1.55, .5, 1.7), std(PAPER), 0, 1.1, -.35);
add(new THREE.BoxGeometry(1.9, .08, .5), std(INK), 0, 1.2, -1.8);
add(new THREE.BoxGeometry(.08, .35, .08), std(INK), .6, 1.0, -1.8); add(new THREE.BoxGeometry(.08, .35, .08), std(INK), -.6, 1.0, -1.8);
add(new THREE.BoxGeometry(1.9, .12, .2), std(PAPER), 0, .66, 1.96);
add(new THREE.BoxGeometry(.3, .02, 3.9), std(PAPER), 0, .88, 0); // 지붕 줄
const wheelGeo = new THREE.CylinderGeometry(.42, .42, .36, 18); wheelGeo.rotateZ(Math.PI / 2);
const wheels = [], steerers = [];
for (const [x, z] of [[1, 1.3], [-1, 1.3], [1, -1.3], [-1, -1.3]]) { const hub = new THREE.Group(); hub.position.set(x, .42, z); car.add(hub);
  const wm = add(wheelGeo, std(INK), 0, 0, 0, hub); add(new THREE.BoxGeometry(.38, .14, .14), std(0x8f8b80), 0, 0, 0, wm); wheels.push(wm); if (z > 0) steerers.push(hub); }
scene.add(car);
const carBody = new CANNON.Body({ type: CANNON.Body.KINEMATIC, shape: new CANNON.Box(new CANNON.Vec3(.95, .55, 1.95)) }); world.addBody(carBody);

/* ───────── 바퀴 자국 · 먼지 ───────── */
const SK = 600, skid = new THREE.InstancedMesh(new THREE.PlaneGeometry(.32, .5), new THREE.MeshBasicMaterial({ color: INK, transparent: true, opacity: .2, depthWrite: false }), SK);
skid.geometry.rotateX(-Math.PI / 2); skid.count = 0; scene.add(skid); let skI = 0; const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), Y = new THREE.Vector3(0, 1, 0), ONE = new THREE.Vector3(1, 1, 1);

let dI = 0; function puff(p) { const d = dust[dI = (dI + 1) % dust.length]; d.m.position.copy(p); d.m.position.y = .3; d.v.set((Math.random() - .5) * 2, 1 + Math.random(), (Math.random() - .5) * 2); d.life = 1; }

/* ───────── 조작 ───────── */
const key = {};
addEventListener("keydown", e => { key[e.code] = true; if (/Arrow|Space/.test(e.code)) e.preventDefault(); if (e.code === "Enter" && near) location.href = ROOT + near.w.href; });
addEventListener("keyup", e => key[e.code] = false);
let joy = null; const joyEl = $("joy");
$("gl").addEventListener("pointerdown", e => { joy = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, id: e.pointerId, t: performance.now() }; joyEl.style.cssText = `display:block;left:${e.clientX}px;top:${e.clientY}px`; });
addEventListener("pointermove", e => { if (!joy || e.pointerId !== joy.id) return; joy.dx = cl((e.clientX - joy.x) / 48, -1, 1); joy.dy = cl((e.clientY - joy.y) / 48, -1, 1); joyEl.firstChild.style.transform = `translate(${joy.dx * 30}px,${joy.dy * 30}px)`; });
addEventListener("pointerup", e => { if (joy && performance.now() - joy.t < 220 && Math.abs(joy.dx) + Math.abs(joy.dy) < .1) clickBoard(e); joy = null; joyEl.style.display = "none"; });
const ray = new THREE.Raycaster();
function clickBoard(e) { ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1), camera);
  const hit = ray.intersectObjects(boards.map(b => b.img))[0]; if (hit) location.href = ROOT + boards.find(b => b.img === hit.object).w.href; }

/* ───────── 달리기 ───────── */
const S = { x: P[N - 8].x, z: P[N - 8].z, yaw: Math.atan2(T[0].x, T[0].z), v: new THREE.Vector2(), steer: 0, spin: 0, shake: 0, roll: 0, pitch: 0, i: N - 8 };
let near = null, camYaw = S.yaw;
const lap = { t0: null, best: null, seen: new Set() };
const camPos = new THREE.Vector3(), look = new THREE.Vector3(); let first = true;
function nearest() { let best = S.i, bd = 1e9; for (let k = -40; k <= 40; k++) { const i = (S.i + k + N) % N, dx = P[i].x - S.x, dz = P[i].z - S.z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = i; } }
  if (bd > 900) for (let i = 0; i < N; i += 2) { const dx = P[i].x - S.x, dz = P[i].z - S.z, d = dx * dx + dz * dz; if (d < bd) { bd = d; best = i; } }
  return [best, Math.sqrt(bd)]; }
function step(dt, now) {
  const up = key.KeyW || key.ArrowUp, dn = key.KeyS || key.ArrowDown, lf = key.KeyA || key.ArrowLeft, rt = key.KeyD || key.ArrowRight, hb = key.Space;
  let thr = (up ? 1 : 0) - (dn ? 1 : 0), st = (lf ? 1 : 0) - (rt ? 1 : 0);
  if (joy) { thr = -joy.dy; st = -joy.dx; }
  if (thr || st) { $("keys").classList.add("off"); if (lap.t0 === null) lap.t0 = now; }
  const [ni, off] = nearest(), prevI = S.i; S.i = ni;
  const grass = off > TW / 2 + 1.5;
  const fx = Math.sin(S.yaw), fz = Math.cos(S.yaw), rx = fz, rz = -fx;
  let vf = S.v.x * fx + S.v.y * fz, vl = S.v.x * rx + S.v.y * rz;
  if (thr > 0) vf += 30 * thr * dt * (vf < 0 ? 1.6 : 1); else if (thr < 0) vf += (vf > .5 ? 38 : 16) * thr * dt;
  vf -= vf * (.5 + (thr ? 0 : .8) + (grass ? 1.6 : 0)) * dt; vf = cl(vf, -10, 30);
  vl *= Math.exp(-(hb ? 1.6 : grass ? 6 : 10) * dt);

  S.v.set(fx * vf + rx * vl, fz * vf + rz * vl);
  S.x += S.v.x * dt; S.z += S.v.y * dt;
  if (off > 60) { const p = P[ni]; S.x += (p.x - S.x) * dt; S.z += (p.z - S.z) * dt; } // 너무 멀리 가면 트랙 쪽으로 끌려옴
  for (const [x, z, b] of posts) { const dx = S.x - x, dz = S.z - z, d = Math.hypot(dx, dz);
    if (d < 1.6) { const nx = dx / d, nz = dz / d, vn = S.v.x * nx + S.v.y * nz;
      if (vn < 0) { S.v.x -= 1.5 * vn * nx; S.v.y -= 1.5 * vn * nz; if (b) b.sv += vn * .25 * (Math.random() < .5 ? 1 : -1); S.shake = Math.min(1, -vn / 14); }
      S.x = x + nx * 1.6; S.z = z + nz * 1.6; } }
  // 한 바퀴: 네 구간을 다 지나고 출발선을 앞으로 넘으면 기록
  lap.seen.add(secOf(ni));
  if (prevI > N * .9 && ni < N * .1) { if (lap.seen.size === 4 && lap.t0 !== null) { const t = now - lap.t0; lap.best = lap.best ? Math.min(lap.best, t) : t; } lap.t0 = now; lap.seen = new Set([0]); }
  const speed = S.v.length(), slip = Math.abs(vl);
  // 바퀴 자국은 미끄러질 때(트랙 위), 먼지는 풀밭에서만
  if ((slip > 3.5 || (grass && speed > 4)) && !calm) for (const s of [-1, 1]) { const p = new THREE.Vector3(S.x + rx * .95 * s - fx * 1.3, 0, S.z + rz * .95 * s - fz * 1.3); if (!grass) mark(p, S.yaw); else if (Math.random() < .35) puff(p); }

}
const fmt = ms => ms == null ? "-:--.-" : `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}.${Math.floor(ms / 100) % 10}`;
let last = performance.now(), hudSec = -1;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  const { speed, ni } = step(dt, now);
  carBody.position.set(S.x, .6, S.z); carBody.velocity.set(S.v.x, 0, S.v.y); carBody.quaternion.setFromEuler(0, S.yaw, 0);
  for (const c of crates) if (c.body.sleepState && Math.hypot(c.body.position.x - S.x, c.body.position.z - S.z) < 4) c.body.wakeUp();
  world.step(1 / 60, dt, 3);
  crates.forEach(c => { c.mesh.position.copy(c.body.position); c.mesh.quaternion.copy(c.body.quaternion); });
  car.position.set(S.x, 0, S.z); car.rotation.set(S.pitch, S.yaw, S.roll, "YXZ");
  wheels.forEach(w => w.rotation.x = S.spin); steerers.forEach(h => h.rotation.y = S.steer);
  boards.forEach(b => { b.sv += (-b.sw * 60 - b.sv * 4) * dt; b.sw += b.sv * dt; b.pivot.rotation.x = b.sw; });
  dust.forEach(d => { if (d.life <= 0) return; d.life -= dt * 1.4; d.m.position.addScaledVector(d.v, dt); d.m.scale.setScalar(1 + (1 - d.life) * 1.6); d.m.material.opacity = Math.max(0, d.life) * .35; });
  // 3인칭: 차 바로 뒤·조금 위에 붙어서 차가 도는 만큼만 부드럽게 따라 돎 (미끄러져도 화면이 휘청이지 않게 속도 방향이 아니라 차 방향을 따름)
  camYaw += wrapA(S.yaw - camYaw) * (1 - Math.exp(-dt * 5));
  const cx = Math.sin(camYaw), cz = Math.cos(camYaw), want = new THREE.Vector3(S.x - cx * 7.6, 3.1, S.z - cz * 7.6);
  if (first) { camPos.copy(want); first = false; } else camPos.lerp(want, 1 - Math.exp(-dt * 14));
  camera.position.copy(camPos);
  S.shake *= Math.exp(-dt * 6); if (S.shake > .01 && !calm) camera.position.add(new THREE.Vector3(Math.random() - .5, Math.random() - .5, 0).multiplyScalar(S.shake * .4));
  look.set(S.x + cx * 6, 1.3, S.z + cz * 6); camera.lookAt(look);
  const fov = (camera.aspect < 1 ? 78 : 62) + Math.min(6, speed * .2); if (Math.abs(camera.fov - fov) > .05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
  sun.position.set(S.x + 16, 32, S.z + 12); sun.target.position.set(S.x, 0, S.z);
  // 가까운 표지판 → 카드
  let best = null, bd = 10; for (const b of boards) { const d = Math.hypot(S.x - b.x, S.z - b.z); if (d < bd) { bd = d; best = b; } }
  if (best !== near) { near = best; $("card").classList.toggle("on", !!near);
    if (near) { const w = near.w; $("cImg").src = ROOT + w.img; $("cMeta").innerHTML = `${w.d} · ${w.cat}${w.lock ? " · 잠금" : ""} <kbd>Enter</kbd>`; $("cT").textContent = w.t; $("cS").textContent = w.s; $("cA").href = ROOT + w.href; } }
  // 계기판
  const sc = secOf(ni); if (sc !== hudSec) { hudSec = sc; $("hSec").textContent = `0${sc + 1} ${CATS[sc]}`; $("hud").style.setProperty("--c", sc === 1 ? "#7d786b" : CCOL[CATS[sc]]); }
  $("hLap").textContent = `${Math.round(speed * 3.6)} km/h · ${fmt(lap.t0 === null ? 0 : now - lap.t0)}`;
  $("hBest").textContent = `최고 ${fmt(lap.best)}`;
  renderer.render(scene, camera);
  drawMap();
}
// 작은 지도: 구간 색 트랙 + 차
const mc = $("map"), mg = mc.getContext("2d");
let mnx = 1e9, mxx = -1e9, mnz = 1e9, mxz = -1e9; P.forEach(p => { mnx = Math.min(mnx, p.x); mxx = Math.max(mxx, p.x); mnz = Math.min(mnz, p.z); mxz = Math.max(mxz, p.z); });
function drawMap() {
  const s = mc.clientWidth, dp = Math.min(devicePixelRatio, 2); if (mc.width !== s * dp) mc.width = mc.height = s * dp;
  mg.setTransform(dp, 0, 0, dp, 0, 0); mg.clearRect(0, 0, s, s);
  const k = (s - 16) / Math.max(mxx - mnx, mxz - mnz), ox = (s - (mxx - mnx) * k) / 2, oz = (s - (mxz - mnz) * k) / 2, M2 = (x, z) => [ox + (x - mnx) * k, oz + (z - mnz) * k];
  mg.lineWidth = 3; mg.lineCap = "round";
  for (let i = 0; i < N; i += 7) { const j = (i + 7) % N, [x0, y0] = M2(P[i].x, P[i].z), [x1, y1] = M2(P[j].x, P[j].z); mg.strokeStyle = CCOL[CATS[secOf(i)]]; mg.beginPath(); mg.moveTo(x0, y0); mg.lineTo(x1, y1); mg.stroke(); }
  const [x, y] = M2(S.x, S.z); mg.save(); mg.translate(x, y); mg.rotate(Math.PI - S.yaw); mg.fillStyle = "#e0452b";
  mg.beginPath(); mg.moveTo(0, -6); mg.lineTo(4.5, 4.5); mg.lineTo(0, 2); mg.lineTo(-4.5, 4.5); mg.closePath(); mg.fill(); mg.restore();
}
requestAnimationFrame(frame);
</script>
