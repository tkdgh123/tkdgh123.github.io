<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>창업실</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@250;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root { --paper: #f2f1ec; --card: #fbfaf6; --ink: #151514; --muted: #5d5c57; --rule: #d6d3c9; --blue: #2b44a6; --red: #a3261d; --green: #2f6b3c; --amber: #8a5a00; --m: clamp(16px, 4vw, 56px) }
* { box-sizing: border-box }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif; padding: 0 var(--m) 96px; word-break: keep-all; overflow-wrap: anywhere }
a { color: var(--blue); text-underline-offset: 3px }
.mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace }
header { display: flex; justify-content: space-between; align-items: center; padding-block: 24px }
header a.home { font: 600 21px/1 Hahmlet, serif; color: var(--ink); text-decoration: none }
.chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--rule); padding: 3px 10px; border-radius: 99px; white-space: nowrap }
h1 { margin: 7vh 0 6px; font: 250 clamp(48px, 10vw, 112px)/1 Hahmlet, serif; letter-spacing: -.035em }
h1 b { font-weight: 600 }
.meta { margin: 0 0 48px; color: var(--muted); font-size: 14.5px }
main { max-width: 1080px }
section { margin: 0 0 64px }
h2 { margin: 0 0 14px; padding-top: 14px; border-top: 2px solid var(--ink); font: 600 24px/1.25 Hahmlet, serif; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }
h2 small { font: 400 13px "IBM Plex Mono", monospace; color: var(--muted) }

/* 할 일 */
.todo { list-style: none; margin: 0; padding: 0 }
.todo li { display: grid; grid-template-columns: 26px 1fr auto; gap: 4px 12px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--rule) }
.todo input { width: 20px; height: 20px; margin: 3px 0 0; accent-color: var(--ink) }
.todo .w { font-size: 13.5px; color: var(--muted); grid-column: 2 }
.todo li.done .t { text-decoration: line-through; color: var(--muted) }
.dd { font: 600 13px/1 "IBM Plex Mono", monospace; padding: 6px 8px; border-radius: 6px; background: #e6e3d9; white-space: nowrap; grid-row: 1 / span 2; grid-column: 3 }
.dd.hot { background: var(--red); color: #fff }
.dd.soon { background: #f0dcc0; color: var(--amber) }
.dd.past { background: transparent; color: var(--muted); text-decoration: line-through }

/* 확인 결과 */
.status { display: grid; gap: 0 }
.status div { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 6px 18px; padding: 14px 0; border-bottom: 1px solid var(--rule) }
.status b { font-weight: 600 }
.status em { font-style: normal; font-weight: 700; margin-left: 6px }
.status .y em { color: var(--green) } .status .n em { color: var(--red) }
.status p { margin: 0; color: var(--muted) }
.call { margin: 18px 0 0; padding: 14px 16px; background: var(--card); border-left: 4px solid var(--blue) }
.lesson { margin: 0; padding-left: 1.2em; color: var(--muted) } .lesson li { margin: 4px 0 }

/* 목록 */
.items { border-top: 1px solid var(--ink) }
details.it { border-bottom: 1px solid var(--rule) }
details.it summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr minmax(120px, 210px) minmax(110px, 190px) 84px; gap: 4px 16px; align-items: center; padding: 14px 0 }
details.it summary::-webkit-details-marker { display: none }
details.it summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.it .nm b { font-weight: 600 } .it .nm small { display: block; color: var(--muted); font-size: 12.5px }
.it .am, .it .wh { font-size: 14px } .it .wh { color: var(--muted) }
.fit { justify-self: end; font-size: 12.5px; font-weight: 700; padding: 4px 9px; border-radius: 99px; white-space: nowrap }
.fit.ok { background: #dcebdc; color: var(--green) } .fit.likely { background: #e3e7f6; color: var(--blue) } .fit.check { background: #f0e6cf; color: var(--amber) }
.it .body { padding: 0 0 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 32px }
.it .body h3 { margin: 0 0 4px; font-size: 13px; color: var(--muted); font-weight: 600 }
.it .body ul { margin: 0; padding-left: 1.1em } .it .body li { margin: 3px 0 }
.it .links { grid-column: 1 / -1; display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px }
.past-items { margin-top: 10px; color: var(--muted); font-size: 14px }

/* 공지 */
.notices { list-style: none; margin: 0; padding: 0 }
.notices li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: baseline }
.notices .new { font: 700 11px/1 "IBM Plex Mono", monospace; color: #fff; background: var(--red); padding: 4px 6px; border-radius: 4px; flex: none }
.notices .tag { font-size: 12px; color: var(--blue); flex: none }
.notices a { color: var(--ink) }
.btn { font: 600 14px/1 inherit; font-family: inherit; min-height: 40px; padding: 0 16px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; margin-top: 14px }
.no { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 28px }
.no div { padding: 10px 0; border-bottom: 1px solid var(--rule) } .no b { font-weight: 600 } .no span { display: block; color: var(--muted); font-size: 13.5px }
.src { font-size: 14px; columns: 2 300px } .src a { display: block; margin: 4px 0; break-inside: avoid }

/* 잠김 화면 */
#locked { max-width: 520px; margin: 18vh auto 0; text-align: center }
#locked h1 { font-size: clamp(36px, 7vw, 56px); margin: 0 0 14px }
#locked p { color: var(--muted) }

@media (max-width: 720px) {
  details.it summary { grid-template-columns: 1fr auto; }
  .it .am, .it .wh { grid-column: 1; font-size: 13.5px }
  .fit { grid-row: 1; grid-column: 2 }
  .it .body { grid-template-columns: 1fr }
  .status div { grid-template-columns: 1fr }
}
@media (prefers-reduced-motion: no-preference) { details.it[open] .body { animation: in .2s ease-out } @keyframes in { from { opacity: 0; transform: translateY(-4px) } } }
</style>
</head>
<body>
<header><a class="home" href="/">창업실</a><span class="chip" id="dev" hidden>이 기기에서만 열려요</span></header>
<div id="locked" hidden>
  <h1>열 수 없어요</h1>
  <p id="why">등록한 기기에서만 열리는 페이지예요.</p>
</div>
<main id="app" hidden></main>
<script src="app.js"></script>
</body>
</html>
