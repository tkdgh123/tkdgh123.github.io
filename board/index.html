<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자유게시판 · 창업실</title>
<meta name="description" content="창업실 자유게시판 — 로그인 없이 닉네임과 비밀번호로 글을 남겨요">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 창업실과 같은 종이·먹·잉크 블루. 커뮤니티 게시판처럼 줄 목록 */
:root {
  --paper: #f2f1ec; --tone: #e4e2da; --ink: #151514; --muted: #5a5954; --rule: #c9c6bc; --blue: #2b44a6; --red: #a3261c;
  --m: clamp(16px, 3.2vw, 52px);
  --serif: "Hahmlet", "Noto Serif KR", serif;
  --sans: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", "Pretendard Variable", Pretendard, ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.65 var(--sans); word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased }
a { color: inherit }
button, input, textarea { font: inherit; color: inherit }
h1, h2 { margin: 0 }
p, ul, ol { margin: 0; padding: 0; list-style: none }
.mono { font: 400 13px/1.5 var(--mono) }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 var(--m) 96px }

.top { display: flex; justify-content: space-between; align-items: baseline; padding: 26px var(--m); max-width: 920px; margin: 0 auto }
.top .mark { font-weight: 700; font-size: 18px; text-decoration: none }
.top .mark:hover { text-decoration: underline 1px; text-underline-offset: 5px }

.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 40px 0 22px; border-bottom: 2px solid var(--ink) }
.head h1 { font: 250 clamp(40px, 7vw, 72px)/1 var(--serif); letter-spacing: -.04em; cursor: pointer }
.head h1 b { font-weight: 700 }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 20px; border: 0; background: var(--ink); color: var(--paper); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn:hover { background: #2c2d2f }
.btn:active { transform: scale(.98) }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink) }
.btn.ghost:hover { background: var(--tone) }
.btn:disabled { opacity: .5; cursor: wait }
.link { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: underline 1px; text-underline-offset: 4px }
.link:hover { color: var(--red) }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px }

/* 목록 */
.list li { border-bottom: 1px solid var(--rule) }
.list a { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 24px; align-items: baseline; padding: 16px 4px; text-decoration: none }
.list a:hover { background: var(--tone) }
.list .t { font-weight: 600; font-size: 17px }
.list .n { margin-left: 6px; color: var(--blue); font: 500 13px var(--mono) }
.list .who { color: var(--muted); font-size: 14px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .d { color: var(--muted) }
.more { display: flex; justify-content: center; padding-top: 28px }
.empty { padding: 72px 0; text-align: center; color: var(--muted) }

/* 글 보기 */
.post { padding: 34px 0 30px; border-bottom: 1px solid var(--rule) }
.post h2 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.3; letter-spacing: -.03em }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-top: 12px; color: var(--muted); font-size: 14px }
.meta .mono { font-size: 12.5px }
.body { margin-top: 30px; font-size: 17px; line-height: 1.8; white-space: pre-wrap; min-height: 4em }
.cmts { padding-top: 30px }
.cmts h3 { margin: 0 0 6px; font-size: 15px }
.cmts h3 span { color: var(--blue); font: 500 13px var(--mono); margin-left: 4px }
.cmt { padding: 14px 0; border-bottom: 1px solid var(--rule) }
.cmt .meta { margin-top: 0 }
.cmt .meta b { color: var(--ink); font-weight: 600 }
.cmt p { margin-top: 4px; white-space: pre-wrap }
.back { margin-top: 36px }

/* 비밀번호 확인(지우기) */
.ask { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap }
.ask input { width: 11em; min-height: 40px; padding: 0 12px }
.ask .btn { min-height: 40px; padding: 0 14px; background: var(--red) }

/* 쓰기 */
form { display: grid; gap: 14px }
.form { padding-top: 30px }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600 }
input, textarea { width: 100%; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--rule); padding: 12px 14px; font-size: 16px; font-weight: 400; border-radius: 0 }
input:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink) }
textarea { min-height: 16em; resize: vertical; line-height: 1.7 }
.cform { margin-top: 22px }
.cform textarea { min-height: 6em }
.acts { display: flex; gap: 10px; justify-content: flex-end; align-items: center }
.err { color: var(--red); font-size: 14px; margin-right: auto }

@media (max-width: 600px) {
  .list a { grid-template-columns: 1fr auto; padding: 14px 2px }
  .list .t { grid-column: 1 / -1; font-size: 16px }
  .list .who { max-width: 12em }
  .row { grid-template-columns: 1fr }
  .head { padding-top: 24px }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none } }
</style>
</head>
<body>
<header class="top"><a class="mark" href="../">← 창업실</a></header>
<main class="wrap">
  <div class="head">
    <h1 id="home"><b>자유</b>게시판</h1>
    <a class="btn" href="#write" id="writeBtn">글쓰기</a>
  </div>
  <div id="view" aria-live="polite"></div>
</main>

<script type="module">
// 만든 사람: Claude (사용자 김창식 요청, 2026-11-05)
// 저장: Firebase Firestore(우리달과 같은 프로젝트, 게시판 전용 칸 board·boardkey·boarddel)
// 지우기: 비밀번호 자체는 어디에도 저장하지 않는다. sha256("대상:비밀번호")를 이름으로 한 문서(boardkey, 아무도 못 읽음)를 글과 함께 만들고,
//        지울 때 같은 값을 다시 계산해 보여 줘야만 규칙이 지우기를 허락한다. 관리자 열쇠는 대상이 "*"인 boardkey 문서 하나.
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, query, orderBy, limit, startAfter,
  writeBatch, serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyA4VJvIM9DwMB4D2KzhDwcekCIGMRSrmwI",
  authDomain: "uridal-43133.firebaseapp.com",
  projectId: "uridal-43133",
  appId: "1:704081943105:web:aff91a36dae41a6bd5c4c0"
}));

const $ = id => document.getElementById(id);
const view = $("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const when = (ts, full) => {
  if (!ts) return "방금";
  const d = ts.toDate(), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (!full && d.toDateString() === now.toDateString()) return hm;
  const ymd = `${d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + "."}${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  return full ? `${ymd} ${hm}` : ymd;
};
const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const myName = { get() { try { return localStorage.getItem("board-name") || ""; } catch { return ""; } }, set(v) { try { localStorage.setItem("board-name", v); } catch {} } };
const fail = e => e?.code === "permission-denied" ? "비밀번호가 맞지 않아요." : "연결이 안 돼요. 잠시 뒤 다시 해 주세요.";

const PAGE = 20;
let last = null;

async function route() {
  const h = location.hash;
  $("writeBtn").hidden = h === "#write";
  if (h === "#write") return writeForm();
  if (h.startsWith("#p=")) return showPost(h.slice(3));
  return showList();
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
$("home").onclick = () => { location.hash = ""; };

/* ---------- 목록 ---------- */
async function showList() {
  view.innerHTML = `<ul class="list" id="list"></ul><div class="more"><button class="btn ghost" id="more" hidden>더 보기</button></div>`;
  last = null;
  await loadMore();
  $("more").onclick = loadMore;
}
async function loadMore() {
  const btn = $("more"); btn.disabled = true;
  let snap;
  try { snap = await getDocs(query(collection(db, "board"), orderBy("at", "desc"), ...(last ? [startAfter(last)] : []), limit(PAGE))); }
  catch (e) { $("list").innerHTML = `<li class="empty">${fail(e)}</li>`; return; }
  if (!last && snap.empty) $("list").innerHTML = `<li class="empty">아직 글이 없어요. 첫 글을 남겨 주세요.</li>`;
  $("list").insertAdjacentHTML("beforeend", snap.docs.map(d => {
    const p = d.data();
    return `<li><a href="#p=${d.id}"><span class="t">${esc(p.title)}${p.n ? `<span class="n">[${p.n}]</span>` : ""}</span><span class="who">${esc(p.name)}</span><span class="d mono">${when(p.at)}</span></a></li>`;
  }).join(""));
  last = snap.docs.at(-1) || last;
  btn.hidden = snap.size < PAGE; btn.disabled = false;
}

/* ---------- 글 보기 + 댓글 ---------- */
async function showPost(id) {
  view.innerHTML = `<p class="empty">불러오는 중…</p>`;
  let d, cs;
  try { [d, cs] = await Promise.all([getDoc(doc(db, "board", id)), getDocs(query(collection(db, "board", id, "c"), orderBy("at")))]); }
  catch (e) { view.innerHTML = `<p class="empty">${fail(e)}</p>`; return; }
  if (!d.exists()) { view.innerHTML = `<p class="empty">지워졌거나 없는 글이에요.</p><p style="text-align:center"><a class="btn ghost" href="#">목록으로</a></p>`; return; }
  const p = d.data();
  view.innerHTML = `
    <article class="post">
      <h2>${esc(p.title)}</h2>
      <div class="meta"><span>${esc(p.name)}</span><span class="mono">${when(p.at, true)}</span><button class="link" id="del">지우기</button></div>
      <div id="delBox"></div>
      <div class="body">${esc(p.body)}</div>
    </article>
    <section class="cmts">
      <h3>댓글<span>${cs.size}</span></h3>
      <ul>${cs.docs.map(c => { const x = c.data(); return `
        <li class="cmt" data-id="${c.id}">
          <div class="meta"><b>${esc(x.name)}</b><span class="mono">${when(x.at, true)}</span><button class="link" data-del>지우기</button></div>
          <p>${esc(x.body)}</p><div data-box></div>
        </li>`; }).join("")}</ul>
      <form class="cform" id="cform">
        <div class="row">
          <label>닉네임<input name="name" maxlength="20" required autocomplete="nickname"></label>
          <label>비밀번호<input name="pw" type="password" placeholder="지울 때 써요" minlength="4" maxlength="40" required autocomplete="new-password"></label>
        </div>
        <label>댓글<textarea name="body" maxlength="1000" required></textarea></label>
        <div class="acts"><span class="err" id="cerr"></span><button class="btn">댓글 달기</button></div>
      </form>
    </section>
    <p class="back"><a class="btn ghost" href="#">목록으로</a></p>`;

  $("del").onclick = () => askPw($("delBox"), async k => {
    const b = writeBatch(db);
    b.set(doc(db, "boarddel", id), { k });
    b.delete(doc(db, "board", id));
    await b.commit();
    location.hash = "";
  }, id);

  view.querySelectorAll("[data-del]").forEach(btn => {
    const li = btn.closest("li"), cid = li.dataset.id;
    btn.onclick = () => askPw(li.querySelector("[data-box]"), async k => {
      const b = writeBatch(db);
      b.set(doc(db, "boarddel", `${id}_${cid}`), { k });
      b.delete(doc(db, "board", id, "c", cid));
      b.update(doc(db, "board", id), { n: increment(-1) });
      await b.commit();
      showPost(id);
    }, `${id}_${cid}`);
  });

  const f = $("cform");
  f.name.value = myName.get();
  f.onsubmit = async e => {
    e.preventDefault();
    const name = f.name.value.trim(), body = f.body.value.trim();
    if (!name || !body) { $("cerr").textContent = "닉네임과 댓글을 적어 주세요."; return; }
    f.querySelector("button").disabled = true;
    const ref = doc(collection(db, "board", id, "c"));
    const b = writeBatch(db);
    b.set(ref, { name, body, at: serverTimestamp() });
    b.set(doc(db, "boardkey", await sha(`${id}_${ref.id}:${f.pw.value}`)), { t: `${id}_${ref.id}` });
    b.update(doc(db, "board", id), { n: increment(1) });
    try { await b.commit(); myName.set(name); showPost(id); }
    catch (e) { $("cerr").textContent = fail(e).replace("비밀번호가 맞지 않아요.", "올리지 못했어요."); f.querySelector("button").disabled = false; }
  };
}

// 비밀번호 칸을 그 자리에 열고, 맞으면 run(열쇠) 실행. 글쓴이 열쇠가 안 맞으면 관리자 열쇠로 한 번 더
function askPw(box, run, target) {
  if (box.firstChild) { box.innerHTML = ""; return; }
  box.innerHTML = `<form class="ask"><input type="password" placeholder="비밀번호" required autocomplete="current-password"><button class="btn">지우기</button><span class="err"></span></form>`;
  const f = box.firstChild, input = f.querySelector("input"), err = f.querySelector(".err");
  input.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    f.querySelector("button").disabled = true; err.textContent = "";
    let last;
    for (const k of [await sha(`${target}:${input.value}`), await sha(`*:${input.value}`)]) {
      try { return await run(k); } catch (e) { last = e; if (e?.code !== "permission-denied") break; }
    }
    err.textContent = fail(last); f.querySelector("button").disabled = false;
  };
}

/* ---------- 글쓰기 ---------- */
function writeForm() {
  view.innerHTML = `
    <form class="form" id="wform">
      <div class="row">
        <label>닉네임<input name="name" maxlength="20" required autocomplete="nickname"></label>
        <label>비밀번호<input name="pw" type="password" placeholder="지울 때 써요 · 4자 이상" minlength="4" maxlength="40" required autocomplete="new-password"></label>
      </div>
      <label>제목<input name="title" maxlength="80" required></label>
      <label>내용<textarea name="body" maxlength="5000" required></textarea></label>
      <div class="acts"><span class="err" id="werr"></span><a class="btn ghost" href="#">취소</a><button class="btn">올리기</button></div>
    </form>`;
  const f = $("wform");
  f.name.value = myName.get();
  (f.name.value ? f.title : f.name).focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const name = f.name.value.trim(), title = f.title.value.trim(), body = f.body.value.trim();
    if (!name || !title || !body) { $("werr").textContent = "빈칸을 채워 주세요."; return; }
    f.querySelector("button").disabled = true;
    const ref = doc(collection(db, "board"));
    const b = writeBatch(db);
    b.set(ref, { name, title, body, at: serverTimestamp(), n: 0 });
    b.set(doc(db, "boardkey", await sha(`${ref.id}:${f.pw.value}`)), { t: ref.id });
    try { await b.commit(); myName.set(name); location.hash = "p=" + ref.id; }
    catch (e) { $("werr").textContent = "올리지 못했어요. 잠시 뒤 다시 해 주세요."; f.querySelector("button").disabled = false; }
  };
}

route();
</script>
</body>
</html>
