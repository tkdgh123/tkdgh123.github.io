<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자유게시판 · 창업실</title>
<meta name="description" content="창업실 자유게시판 — 구글로 로그인하고 닉네임으로 글을 남겨요">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@200..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 창업실과 같은 종이·먹·잉크 블루. 커뮤니티 게시판처럼 줄 목록 */
:root {
  --paper: #f2f1ec; --tone: #e4e2da; --ink: #151514; --muted: #5a5954; --rule: #c9c6bc; --blue: #2b44a6; --red: #a3261c;
  --m: clamp(16px, 3.2vw, 52px);
  --serif: "Hahmlet", "Noto Serif KR", serif;
  --sans: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", "Pretendard Variable", Pretendard, ui-monospace, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.65 var(--sans); word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased }
a { color: inherit }
button, input, textarea { font: inherit; color: inherit }
h1, h2 { margin: 0 }
p, ul, ol { margin: 0; padding: 0; list-style: none }
.mono { font: 400 13px/1.5 var(--mono) }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 var(--m) 96px }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px var(--m); max-width: 920px; margin: 0 auto; min-height: 76px }
.top .mark { font-weight: 700; font-size: 18px; text-decoration: none; white-space: nowrap }
.top .mark:hover { text-decoration: underline 1px; text-underline-offset: 5px }
.me { display: flex; align-items: center; gap: 14px; font-size: 14px; min-width: 0 }
.me b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.head { display: flex; justify-content: space-between; align-items: end; gap: 16px; padding: 30px 0 22px; border-bottom: 2px solid var(--ink) }
.head h1 { font: 250 clamp(40px, 7vw, 72px)/1 var(--serif); letter-spacing: -.04em; cursor: pointer }
.head h1 b { font-weight: 700 }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border: 0; background: var(--ink); color: var(--paper); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn:hover { background: #2c2d2f }
.btn:active { transform: scale(.98) }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink) }
.btn.ghost:hover { background: var(--tone) }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 14px }
.btn.red { background: var(--red) }
.btn:disabled { opacity: .5; cursor: wait }
.link { border: 0; background: none; padding: 4px 0; color: var(--muted); font-size: 14px; cursor: pointer; text-decoration: underline 1px; text-underline-offset: 4px }
.link:hover { color: var(--red) }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px }
.adm { display: inline-block; padding: 1px 7px; background: var(--blue); color: #fff; font: 600 11.5px/1.6 var(--sans); vertical-align: 2px; margin-left: 6px }

/* 목록 */
.list li { border-bottom: 1px solid var(--rule) }
.list a { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 24px; align-items: baseline; padding: 16px 4px; text-decoration: none }
.list a:hover { background: var(--tone) }
.list .t { font-weight: 600; font-size: 17px }
.list .n { margin-left: 6px; color: var(--blue); font: 500 13px var(--mono) }
.list .who { color: var(--muted); font-size: 14px; max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.list .d { color: var(--muted) }
.more { display: flex; justify-content: center; padding-top: 28px }
.empty { padding: 72px 0; text-align: center; color: var(--muted) }

/* 글 보기 */
.post { padding: 34px 0 30px; border-bottom: 1px solid var(--rule) }
.post h2 { font-size: clamp(24px, 3.4vw, 32px); line-height: 1.3; letter-spacing: -.03em }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; margin-top: 12px; color: var(--muted); font-size: 14px }
.meta .mono { font-size: 12.5px }
.body { margin-top: 30px; font-size: 17px; line-height: 1.8; white-space: pre-wrap; min-height: 4em }
.cmts { padding-top: 30px }
.cmts h3 { margin: 0 0 6px; font-size: 15px }
.cmts h3 span { color: var(--blue); font: 500 13px var(--mono); margin-left: 4px }
.cmt { padding: 14px 0; border-bottom: 1px solid var(--rule) }
.cmt .meta { margin-top: 0 }
.cmt .meta b { color: var(--ink); font-weight: 600 }
.cmt p { margin-top: 4px; white-space: pre-wrap }
.back { margin-top: 36px }
.sure { display: inline-flex; gap: 8px; align-items: center; color: var(--red); font-weight: 600 }

/* 로그인·닉네임 안내 */
.gate { padding: 56px 0; display: grid; justify-items: center; gap: 18px; text-align: center }
.gate p { color: var(--muted) }
.gate form { width: min(100%, 360px) }
.gate.in { padding: 26px 0 0; justify-items: start; text-align: left }

/* 쓰기 */
form { display: grid; gap: 14px }
.form { padding-top: 30px }
label { display: grid; gap: 6px; font-size: 14px; font-weight: 600 }
input, textarea { width: 100%; border: 0; background: #fff; box-shadow: inset 0 0 0 1px var(--rule); padding: 12px 14px; font-size: 16px; font-weight: 400; border-radius: 0 }
input:focus, textarea:focus { outline: none; box-shadow: inset 0 0 0 2px var(--ink) }
textarea { min-height: 16em; resize: vertical; line-height: 1.7 }
.cform { margin-top: 22px }
.cform textarea { min-height: 6em }
.acts { display: flex; gap: 10px; justify-content: flex-end; align-items: center }
.err { color: var(--red); font-size: 14px; margin-right: auto }

@media (max-width: 600px) {
  .list a { grid-template-columns: 1fr auto; padding: 14px 2px }
  .list .t { grid-column: 1 / -1; font-size: 16px }
  .list .who { max-width: 14em }
  .head { padding-top: 18px }
  .me { gap: 10px }
}
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none } }
</style>
</head>
<body>
<header class="top"><a class="mark" href="../">← 창업실</a><div class="me" id="me"></div></header>
<main class="wrap">
  <div class="head">
    <h1 id="home"><b>자유</b>게시판</h1>
    <a class="btn" href="#write" id="writeBtn">글쓰기</a>
  </div>
  <div id="view" aria-live="polite"></div>
</main>

<script type="module">
// 만든 사람: Claude (사용자 김창식 요청, 2026-11-05)
// 저장: Firebase(우리달과 같은 프로젝트 uridal-43133)의 게시판 전용 칸 board·boarduser·boardname
// 누가 무엇을 할 수 있는지는 화면이 아니라 Firestore 규칙이 정한다:
//   글·댓글 쓰기 = 구글 로그인 + 닉네임 / 지우기 = 쓴 사람 본인, 운영자는 모두 / 고치기·댓글 수 조작 = 아무도 못 함
//   도배 막기 = 같은 사람 글 30초, 댓글 10초 간격 / 구글 이메일·이름은 어디에도 저장하지 않음
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, connectAuthEmulator } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, connectFirestoreEmulator, collection, doc, getDoc, getDocs, getCount, query, orderBy, limit, startAfter,
  writeBatch, deleteDoc, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-lite.js";

const app = initializeApp({
  apiKey: "AIzaSyA4VJvIM9DwMB4D2KzhDwcekCIGMRSrmwI",
  authDomain: "uridal-43133.firebaseapp.com",
  projectId: "uridal-43133",
  appId: "1:704081943105:web:aff91a36dae41a6bd5c4c0"
});
const auth = getAuth(app), db = getFirestore(app);
// 내 노트북 테스트용: 127.0.0.1/board/?emu 로 열면 진짜 대신 로컬 에뮬레이터에 붙는다
if (location.hostname === "127.0.0.1" && location.search.includes("emu")) {
  connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
  connectFirestoreEmulator(db, "127.0.0.1", 8080);
}

const $ = id => document.getElementById(id);
const view = $("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const when = (ts, full) => {
  if (!ts) return "방금";
  const d = ts.toDate(), now = new Date();
  const hm = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (!full && d.toDateString() === now.toDateString()) return hm;
  const ymd = `${d.getFullYear() === now.getFullYear() ? "" : d.getFullYear() + "."}${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
  return full ? `${ymd} ${hm}` : ymd;
};
const badge = x => x.adm ? `<span class="adm">운영자</span>` : "";
const NET = "연결이 안 돼요. 잠시 뒤 다시 해 주세요.";
const RESERVED = ["운영자", "관리자", "운영진", "admin", "administrator"];
const GAP = { lp: 30, lc: 10 };   // 규칙과 같은 간격(초)

let me = null;   // { uid, name, lp, lc, admin }
const can = x => me && (x.uid === me.uid || me.admin);
const waitSec = k => me?.[k] ? Math.ceil(GAP[k] - (Date.now() - me[k].toMillis()) / 1000) : 0;

/* ---------- 로그인 ---------- */
async function login() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { if (!/popup-closed|cancelled-popup/.test(e?.code)) alertBox("로그인하지 못했어요. 팝업 차단을 풀고 다시 해 주세요."); }
}
const alertBox = msg => { const p = view.querySelector(".gate p") || view; p.insertAdjacentHTML("beforeend", `<span class="err" style="display:block;margin-top:8px">${esc(msg)}</span>`); };

onAuthStateChanged(auth, async u => {
  me = null;
  if (u) {
    me = { uid: u.uid, admin: false };
    const [d, adm] = await Promise.all([
      getDoc(doc(db, "boarduser", u.uid)).catch(() => null),
      getDoc(doc(db, "boardadmin", "check")).then(() => true, () => false)
    ]);
    if (d?.exists()) Object.assign(me, d.data());
    me.admin = adm;
  }
  drawMe(); route();
});

function drawMe() {
  const box = $("me");
  if (!me) { box.innerHTML = `<button class="btn ghost small" id="loginBtn">구글로 로그인</button>`; $("loginBtn").onclick = login; return; }
  box.innerHTML = `<b>${me.name ? esc(me.name) : "닉네임 없음"}</b>${me.admin ? `<span class="adm" style="margin:0">운영자</span>` : ""}<button class="link" id="outBtn">로그아웃</button>`;
  $("outBtn").onclick = () => signOut(auth);
}

// 글·댓글 쓰기 전에: 로그인 안 했으면 로그인, 닉네임 없으면 닉네임부터. 준비되면 true
function ready(box, inline) {
  if (me?.name) return true;
  box.innerHTML = `<div class="gate${inline ? " in" : ""}">${me ? `
    <p>게시판에서 쓸 닉네임을 정해 주세요. 한 번 정하면 바꿀 수 없어요.</p>
    <form id="nform"><input name="name" maxlength="20" required placeholder="닉네임" autocomplete="off">
      <div class="acts"><span class="err" id="nerr"></span><button class="btn">정하기</button></div></form>` : `
    <p>${inline ? "댓글을" : "글을"} 쓰려면 구글로 로그인해 주세요.<br>구글 이름·이메일은 게시판에 보이지도, 저장되지도 않아요.</p>
    <button class="btn" data-login>구글로 로그인</button>`}</div>`;
  box.querySelector("[data-login]")?.addEventListener("click", login);
  const f = box.querySelector("#nform");
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const name = f.name.value.trim().replace(/\s+/g, " "), key = name.toLowerCase(), err = f.querySelector(".err");
    if (!name || name.includes("/") || /^\.+$/.test(name) || /^__.*__$/.test(name)) { err.textContent = "쓸 수 없는 닉네임이에요."; return; }
    if (RESERVED.includes(key) && !me.admin) { err.textContent = "운영자만 쓸 수 있는 닉네임이에요."; return; }
    f.querySelector("button").disabled = true;
    try {
      if ((await getDoc(doc(db, "boardname", key))).exists()) { err.textContent = "이미 누가 쓰고 있는 닉네임이에요."; f.querySelector("button").disabled = false; return; }
      const b = writeBatch(db), zero = Timestamp.fromMillis(0);
      b.set(doc(db, "boarduser", me.uid), { name, lp: zero, lc: zero });
      b.set(doc(db, "boardname", key), { uid: me.uid });
      await b.commit();
      Object.assign(me, { name, lp: zero, lc: zero });
      drawMe(); route();
    } catch (e) { err.textContent = e?.code === "permission-denied" ? "이미 누가 쓰고 있거나 쓸 수 없는 닉네임이에요." : NET; f.querySelector("button").disabled = false; }
  };
  return false;
}

/* ---------- 화면 고르기 ---------- */
function route() {
  const h = location.hash;
  $("writeBtn").hidden = h === "#write";
  if (h === "#write") return writeForm();
  if (h.startsWith("#p=")) return showPost(h.slice(3));
  return showList();
}
addEventListener("hashchange", () => { route(); scrollTo(0, 0); });
$("home").onclick = () => { location.hash = ""; };

/* ---------- 목록 ---------- */
const PAGE = 20;
let last = null;
async function showList() {
  view.innerHTML = `<ul class="list" id="list"></ul><div class="more"><button class="btn ghost" id="more" hidden>더 보기</button></div>`;
  last = null;
  $("more").onclick = loadMore;
  await loadMore();
}
async function loadMore() {
  const btn = $("more"); if (!btn) return; btn.disabled = true;
  let snap;
  try { snap = await getDocs(query(collection(db, "board"), orderBy("at", "desc"), ...(last ? [startAfter(last)] : []), limit(PAGE))); }
  catch { $("list").innerHTML = `<li class="empty">${NET}</li>`; return; }
  if (!$("list")) return;   // 그사이 다른 화면으로 갔으면 그만
  if (!last && snap.empty) $("list").innerHTML = `<li class="empty">아직 글이 없어요. 첫 글을 남겨 주세요.</li>`;
  $("list").insertAdjacentHTML("beforeend", snap.docs.map(d => {
    const p = d.data();
    return `<li><a href="#p=${d.id}"><span class="t">${esc(p.title)}<span class="n" data-n="${d.id}"></span></span><span class="who">${esc(p.name)}${badge(p)}</span><span class="d mono">${when(p.at)}</span></a></li>`;
  }).join(""));
  // 댓글 수는 실제 댓글을 세서 보여 준다(저장된 숫자가 없어 조작할 수 없음)
  snap.docs.forEach(d => getCount(collection(db, "board", d.id, "c")).then(c => {
    const n = c.data().count, el = view.querySelector(`[data-n="${d.id}"]`);
    if (el && n) el.textContent = `[${n}]`;
  }).catch(() => {}));
  last = snap.docs.at(-1) || last;
  btn.hidden = snap.size < PAGE; btn.disabled = false;
}

/* ---------- 글 보기 + 댓글 ---------- */
async function showPost(id) {
  view.innerHTML = `<p class="empty">불러오는 중…</p>`;
  let d, cs;
  try { [d, cs] = await Promise.all([getDoc(doc(db, "board", id)), getDocs(query(collection(db, "board", id, "c"), orderBy("at")))]); }
  catch (e) {
    if (e?.code === "permission-denied") d = { exists: () => false };   // 지워진 글의 댓글은 규칙이 막는다
    else { view.innerHTML = `<p class="empty">${NET}</p>`; return; }
  }
  if (location.hash !== "#p=" + id) return;
  if (!d.exists()) { view.innerHTML = `<p class="empty">지워졌거나 없는 글이에요.</p><p style="text-align:center"><a class="btn ghost" href="#">목록으로</a></p>`; return; }
  const p = d.data();
  view.innerHTML = `
    <article class="post">
      <h2>${esc(p.title)}</h2>
      <div class="meta"><span>${esc(p.name)}${badge(p)}</span><span class="mono">${when(p.at, true)}</span>${can(p) ? `<span data-del="post"><button class="link">지우기</button></span>` : ""}</div>
      <div class="body">${esc(p.body)}</div>
    </article>
    <section class="cmts">
      <h3>댓글<span>${cs.size}</span></h3>
      <ul>${cs.docs.map(c => { const x = c.data(); return `
        <li class="cmt" data-id="${c.id}">
          <div class="meta"><b>${esc(x.name)}</b>${badge(x)}<span class="mono">${when(x.at, true)}</span>${can(x) ? `<span data-del="cmt"><button class="link">지우기</button></span>` : ""}</div>
          <p>${esc(x.body)}</p>
        </li>`; }).join("")}</ul>
      <div id="cbox"></div>
    </section>
    <p class="back"><a class="btn ghost" href="#">목록으로</a></p>`;

  view.querySelectorAll("[data-del]").forEach(box => sure(box, async () => {
    if (box.dataset.del === "post") { await deleteDoc(doc(db, "board", id)); location.hash = ""; }
    else { await deleteDoc(doc(db, "board", id, "c", box.closest("li").dataset.id)); showPost(id); }
  }));

  const cbox = $("cbox");
  if (!ready(cbox, true)) return;
  cbox.innerHTML = `
    <form class="cform" id="cform">
      <label>댓글<textarea name="body" maxlength="1000" required></textarea></label>
      <div class="acts"><span class="err" id="cerr"></span><button class="btn">댓글 달기</button></div>
    </form>`;
  const f = $("cform");
  f.onsubmit = async e => {
    e.preventDefault();
    const body = f.body.value.trim(), w = waitSec("lc");
    if (!body) { $("cerr").textContent = "댓글을 적어 주세요."; return; }
    if (w > 0) { $("cerr").textContent = `${w}초 뒤에 달 수 있어요.`; return; }
    f.querySelector("button").disabled = true;
    const b = writeBatch(db);
    b.set(doc(collection(db, "board", id, "c")), { uid: me.uid, name: me.name, body, at: serverTimestamp(), adm: me.admin });
    b.update(doc(db, "boarduser", me.uid), { lc: serverTimestamp() });
    try { await b.commit(); me.lc = Timestamp.now(); showPost(id); }
    catch (e) { $("cerr").textContent = e?.code === "permission-denied" ? "잠시 뒤에 다시 달아 주세요." : NET; f.querySelector("button").disabled = false; }
  };
}

// '지우기' → '정말 지울까요? 지우기 · 취소'로 한 번 더 묻고 run
function sure(box, run) {
  const first = box.innerHTML;
  box.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.k === "no") { box.innerHTML = first; return; }
    if (b.dataset.k !== "yes") { box.innerHTML = `<span class="sure">정말 지울까요? <button class="btn small red" data-k="yes">지우기</button><button class="link" data-k="no">취소</button></span>`; return; }
    b.disabled = true;
    try { await run(); } catch { box.innerHTML = `<span class="err">지우지 못했어요.</span>`; }
  };
}

/* ---------- 글쓰기 ---------- */
function writeForm() {
  if (!ready(view)) return;
  view.innerHTML = `
    <form class="form" id="wform">
      <label>제목<input name="title" maxlength="80" required></label>
      <label>내용<textarea name="body" maxlength="5000" required></textarea></label>
      <div class="acts"><span class="err" id="werr"></span><a class="btn ghost" href="#">취소</a><button class="btn">올리기</button></div>
    </form>`;
  const f = $("wform");
  f.title.focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const title = f.title.value.trim(), body = f.body.value.trim(), w = waitSec("lp");
    if (!title || !body) { $("werr").textContent = "제목과 내용을 채워 주세요."; return; }
    if (w > 0) { $("werr").textContent = `${w}초 뒤에 올릴 수 있어요.`; return; }
    f.querySelector("button").disabled = true;
    const ref = doc(collection(db, "board"));
    const b = writeBatch(db);
    b.set(ref, { uid: me.uid, name: me.name, title, body, at: serverTimestamp(), adm: me.admin });
    b.update(doc(db, "boarduser", me.uid), { lp: serverTimestamp() });
    try { await b.commit(); me.lp = Timestamp.now(); location.hash = "p=" + ref.id; }
    catch (e) { $("werr").textContent = e?.code === "permission-denied" ? "잠시 뒤에 다시 올려 주세요." : NET; f.querySelector("button").disabled = false; }
  };
}
</script>
</body>
</html>
