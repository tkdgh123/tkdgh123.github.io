<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잘못 아는 발음 · 말문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #eef1f8; --card: #fff; --ink: #141722; --soft: #4a5068; --blue: #3557f5; --blue-bg: #e3e9ff; --red: #d93a40; --green: #13894f; --green-bg: #dcf3e6; --line: #d9deeb }
@media (prefers-color-scheme: dark) { :root { --bg: #0f1118; --card: #1a1d28; --ink: #eef0f7; --soft: #a9afc4; --blue: #7d95ff; --blue-bg: #232b4d; --red: #ff6b70; --green: #45d08b; --green-bg: #173326; --line: #2c3142 } }
* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 17px/1.6 "Pretendard Variable", Pretendard, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none }
main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px }
header a { color: var(--soft); text-decoration: none; font-weight: 600; font-size: 15px }
h1 { margin: 0; font-size: 22px; font-weight: 750; letter-spacing: -.02em }
.count { font: 500 14px "IBM Plex Mono", monospace; color: var(--soft) }
.bar { height: 6px; margin: 14px 0 18px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .3s }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px }
.chips button { flex: none; padding: 7px 14px; border-radius: 99px; background: var(--card); font-weight: 600; font-size: 15px; color: var(--soft) }
.chips button[aria-pressed=true] { background: var(--ink); color: var(--card) }
.card { background: var(--card); border-radius: 22px; padding: 28px 24px 24px; box-shadow: 0 10px 30px -18px rgba(20, 30, 70, .35) }
.tag { display: inline-block; padding: 3px 10px; border-radius: 6px; background: var(--blue-bg); color: var(--blue); font-weight: 700; font-size: 14px }
.word { margin: 18px 0 2px; font-size: clamp(44px, 13vw, 64px); font-weight: 750; letter-spacing: -.03em; line-height: 1.05 }
.word s { text-decoration: none; color: var(--red); opacity: .45 }
.mean { color: var(--soft); font-weight: 500 }
.ask { display: block; width: 100%; margin-top: 26px; padding: 16px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700; font-size: 18px }
.ans { margin-top: 22px; display: grid; gap: 14px }
.ans[hidden], .ask[hidden] { display: none }
.wrong { color: var(--red); font-size: 19px; font-weight: 600 }
.wrong del { text-decoration-thickness: 2px }
.right { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px }
.right strong { font-size: 34px; font-weight: 500; letter-spacing: -.02em }
.right strong b { font-weight: 850; color: var(--blue) }
.ipa { font: 400 16px "IBM Plex Mono", monospace; color: var(--soft) }
.tip { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bg); font-weight: 500 }
.tools { display: flex; gap: 8px; flex-wrap: wrap }
.tools button { display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 12px; background: var(--blue-bg); color: var(--blue); font-weight: 700 }
.tools button.on { background: var(--red); color: #fff }
.heard { margin: 0; font-weight: 600 }
.heard:empty { display: none }
.heard.ok { color: var(--green) }
.heard.no { color: var(--red) }
.next { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px }
.next button { padding: 15px; border-radius: 14px; font-weight: 700; font-size: 17px }
.again { background: var(--bg) }
.got { background: var(--green-bg); color: var(--green) }
.done { text-align: center; padding: 40px 24px }
.done p { font-size: 40px; font-weight: 800; margin: 0 0 4px; letter-spacing: -.03em }
.done button { margin-top: 24px; padding: 14px 26px; border-radius: 14px; background: var(--blue); color: #fff; font-weight: 700 }
</style>
</head>
<body>
<main>
  <header><h1>잘못 아는 발음</h1><a href="../plan/">말문</a></header>
  <div class="bar"><i id="bar"></i></div>
  <div class="chips" id="chips" role="group" aria-label="함정 종류"></div>
  <section class="card" id="card" aria-live="polite"></section>
  <p class="count" id="count"></p>
</main>
<script>
// 데이터: [단어, 뜻, 흔히 읽는 법, 실제(굵게=[강세]), 발음기호(미국식), 종류, 외우는 요령]
// 단어 속 (괄호) = 소리 안 나는 글자 / 줄어드는 소리
const W = [
  ["sa(l)mon", "연어", "살몬", "[새]먼", "ˈsæmən", "묵음", "l은 쓰기만 하고 소리는 없어요."],
  ["recei(p)t", "영수증", "리시프트", "리[시]트", "rɪˈsiːt", "묵음", "p는 소리 없이 '리싯'에 가까워요."],
  ["i(s)land", "섬", "아이슬랜드", "[아일]런드", "ˈaɪlənd", "묵음", "s는 소리 없어요. 아이슬란드(Iceland)와 달라요."],
  ["debu(t)", "데뷔", "데뷰트", "데이[뷰]", "deɪˈbjuː", "묵음", "프랑스어에서 온 말이라 끝 t를 읽지 않아요."],
  ["su(b)tle", "미묘한", "서브틀", "[서]틀", "ˈsʌtl", "묵음", "b는 소리 없어요."],
  ["dou(b)t", "의심", "다우브트", "다웃", "daʊt", "묵음", "b는 소리 없어요. debt(빚, '뎃')도 같아요."],
  ["mus(c)le", "근육", "머스클", "[머]슬", "ˈmʌsl", "묵음", "c는 소리 없어요. 홍합 mussel과 소리가 같아요."],
  ["cas(t)le", "성", "캐스틀", "[캐]슬", "ˈkæsl", "묵음", "t는 소리 없어요. listen, whistle도 같아요."],
  ["s(w)ord", "칼", "스워드", "소어드", "sɔːrd", "묵음", "w는 소리 없어요."],
  ["We(d)n(e)sday", "수요일", "웨드네스데이", "[웬]즈데이", "ˈwenzdeɪ", "묵음", "d와 가운데 e를 건너뛰어 '웬즈'로 시작해요."],
  ["ya(ch)t", "요트", "요트", "얏", "jɑːt", "외래어", "ch는 소리 없어요. '야'로 시작해요."],
  ["label", "상표", "라벨", "[레이]블", "ˈleɪbl", "외래어", "a를 '에이'로 읽어요."],
  ["allergy", "알레르기", "알레르기", "[앨]러지", "ˈælərdʒi", "외래어", "알레르기는 독일어 발음이에요."],
  ["buffe(t)", "뷔페", "뷔페", "버[페이]", "bəˈfeɪ", "외래어", "끝 t는 소리 없고 뒤를 세게 읽어요."],
  ["theme", "주제", "테마", "띰", "θiːm", "외래어", "th는 혀끝을 이 사이에 살짝 넣고 내는 소리예요."],
  ["radio", "라디오", "라디오", "[레이]디오", "ˈreɪdioʊ", "외래어", "a를 '에이'로 읽어요."],
  ["model", "모델", "모델", "[마]들", "ˈmɑːdl", "외래어", "o를 '아'에 가깝게 읽어요."],
  ["vitamin", "비타민", "비타민", "[바이]터민", "ˈvaɪtəmɪn", "외래어", "i를 '아이'로 읽어요. 영국에선 '비터민'이에요."],
  ["margarine", "마가린", "마가린", "[마]저린", "ˈmɑːrdʒərɪn", "외래어", "g를 'ㅈ' 소리로 읽어요."],
  ["vinyl", "비닐", "비닐", "[바이]늘", "ˈvaɪnl", "외래어", "y를 '아이'로 읽어요."],
  ["coco(a)", "코코아", "코코아", "[코우]코우", "ˈkoʊkoʊ", "외래어", "끝 a는 소리 없어요."],
  ["ideology", "이념", "이데올로기", "아이디[알]러지", "ˌaɪdiˈɑːlədʒi", "외래어", "이데올로기는 독일어 발음이에요. i를 '아이'로 시작해요."],
  ["ballet", "발레", "발레", "밸[레이]", "bæˈleɪ", "외래어", "끝 t는 소리 없고 뒤를 세게 읽어요."],
  ["banana", "바나나", "바나나", "버[내]너", "bəˈnænə", "강세", "가운데만 세게, 앞뒤는 약하게 '어'로 흘려요."],
  ["tomato", "토마토", "토마토", "터[메이]토", "təˈmeɪtoʊ", "강세", "가운데 '메이'를 세게 읽어요."],
  ["hotel", "호텔", "호텔", "호우[텔]", "hoʊˈtel", "강세", "앞이 아니라 뒤 '텔'을 세게 읽어요."],
  ["dessert", "디저트", "디저트", "디[저]트", "dɪˈzɜːrt", "강세", "뒤를 세게. 앞을 세게 '데저트'라 하면 사막(desert)이에요."],
  ["garage", "차고", "개라지", "거[라]지", "ɡəˈrɑːʒ", "강세", "뒤 '라'를 세게, 앞은 '거'로 약하게요."],
  ["photographer", "사진작가", "포토그래퍼", "퍼[타]그러퍼", "fəˈtɑːɡrəfər", "강세", "photo(포우토우)와 달리 두 번째를 세게 읽어요."],
  ["comf(or)table", "편한", "컴포터블", "[컴]프터블", "ˈkʌmftərbl", "음절", "or가 빠져 3박자로 읽어요."],
  ["veg(e)table", "채소", "베지터블", "[베]쥐터블", "ˈvedʒtəbl", "음절", "가운데 e가 빠져 3박자로 읽어요."],
  ["choc(o)late", "초콜릿", "초콜릿", "[차]클릿", "ˈtʃɑːklət", "음절", "가운데 o가 빠져 2박자로 읽어요."],
  ["diff(e)rent", "다른", "디퍼런트", "[디]프런트", "ˈdɪfrənt", "음절", "가운데 e가 빠져 2박자로 읽어요."],
  ["fam(i)ly", "가족", "패밀리", "[팸]리", "ˈfæmli", "음절", "가운데 i가 거의 빠져 2박자로 읽어요."],
  ["strike", "파업·치다", "스트라이크", "스트라잌", "straɪk", "음절", "'으'를 넣지 않고 한 박자에 붙여 읽어요. 5박자가 아니라 1박자예요."],
];
const TYPES = ["전체", "묵음", "외래어", "강세", "음절"];
const NAMES = { 묵음: "소리 없는 글자", 외래어: "외래어와 달라요", 강세: "세게 읽는 곳", 음절: "박자 수" };
const KEY = "malmun-pron-got";
let got = new Set(); try { got = new Set(JSON.parse(localStorage.getItem(KEY)) || []) } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...got])) } catch {} };
const plain = w => w.replace(/[()]/g, "");
const $ = id => document.getElementById(id);
let type = "전체", queue = [], total = 0;

function start() {
  const pool = W.filter(w => (type === "전체" || w[5] === type) && !got.has(plain(w[0])));
  queue = pool.sort(() => Math.random() - .5); total = pool.length; show();
}
function show() {
  $("bar").style.width = total ? (100 * (total - queue.length) / total) + "%" : "100%";
  $("count").textContent = total ? `${total - queue.length} / ${total}` : "";
  const c = $("card");
  if (!queue.length) {
    const n = W.filter(w => type === "전체" || w[5] === type).length;
    c.innerHTML = `<div class="done"><p>${n}개 다 외웠어요</p><button id="reset">처음부터 다시</button></div>`;
    $("reset").onclick = () => { W.forEach(w => (type === "전체" || w[5] === type) && got.delete(plain(w[0]))); save(); start() };
    return;
  }
  const [w, mean, wrong, right, ipa, t, tip] = queue[0];
  c.innerHTML = `<span class="tag">${NAMES[t]}</span>
    <div class="word" lang="en">${w.replace(/\((.+?)\)/g, "<span class=q>$1</span>")}</div>
    ${mean === wrong ? "" : `<div class="mean">${mean}</div>`}
    <button class="ask" id="ask">어떻게 읽을까요?</button>
    <div class="ans" id="ans" hidden>
      <div class="wrong"><del>${wrong}</del> 아니고</div>
      <div class="right"><strong>${right.replace(/\[(.+?)\]/g, "<b>$1</b>")}</strong><span class="ipa">/${ipa}/</span></div>
      <p class="tip">${tip}</p>
      <div class="tools"><button id="say">▶ 듣기</button><button id="slow">▶ 천천히</button>${Rec ? '<button id="mic">● 말해 보기</button>' : ""}</div>
      <p class="heard" id="heard"></p>
      <div class="next"><button class="again" id="again">다시 볼래요</button><button class="got" id="got">외웠어요</button></div>
    </div>`;
  $("ask").onclick = () => {
    $("ask").hidden = true; $("ans").hidden = false;
    c.querySelectorAll(".q").forEach(q => q.outerHTML = `<s>${q.textContent}</s>`);
    speak(1);
  };
  $("say").onclick = () => speak(1);
  $("slow").onclick = () => speak(.6);
  if (Rec) $("mic").onclick = listen;
  $("again").onclick = () => { queue.splice(Math.min(3, queue.length), 0, queue.shift()); show() };
  $("got").onclick = () => { got.add(plain(w)); save(); queue.shift(); show() };
}
function speak(rate) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(plain(queue[0][0]));
  u.lang = "en-US"; u.rate = rate;
  const v = speechSynthesis.getVoices().find(v => v.lang === "en-US");
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen() {
  const target = plain(queue[0][0]).toLowerCase(), mic = $("mic"), out = $("heard");
  const r = new Rec(); r.lang = "en-US"; r.maxAlternatives = 5;
  mic.classList.add("on"); mic.textContent = "● 듣는 중"; out.className = "heard"; out.textContent = "";
  r.onresult = e => {
    const alts = [...e.results[0]].map(a => a.transcript.trim());
    const ok = alts.some(a => a.toLowerCase().split(/\W+/).includes(target));
    out.className = "heard " + (ok ? "ok" : "no");
    out.textContent = ok ? "잘 알아들었어요" : `'${alts[0]}'(으)로 들렸어요`;
  };
  r.onerror = e => { out.className = "heard no"; out.textContent = e.error === "not-allowed" ? "마이크를 허용해 주세요" : "다시 말해 주세요" };
  r.onend = () => { mic.classList.remove("on"); mic.textContent = "● 말해 보기" };
  r.start();
}
$("chips").innerHTML = TYPES.map(t => `<button aria-pressed="${t === type}">${t === "전체" ? t : NAMES[t]}</button>`).join("");
$("chips").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  type = TYPES[[...$("chips").children].indexOf(b)];
  [...$("chips").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  start();
};
speechSynthesis.getVoices();
start();
</script>
</body>
</html>
